# Template for auto-generating endpoint documentation
# Used by doc-sync to create YAML snippets for new/modified API endpoints

# Variables (replaced at runtime):
# {path} - API endpoint path
# {method} - HTTP method (GET, POST, PUT, DELETE)
# {auth_level} - Authentication level (user, admin, public)
# {query_params} - Query parameters (extracted from FastAPI)
# {request_body} - Request body schema (extracted from Pydantic)
# {response_model} - Response schema (extracted from response_model)
# {source_file} - Source code file path
# {source_line} - Line number in source file
# {timestamp} - Detection timestamp

# ---------------------------------------------------------------------------
# {method} {path} (NEW - Auto-detected)
# ---------------------------------------------------------------------------
- path: "{path}"
  method: {method}
  auth: {auth_level}
  description: "TODO: Add description - auto-detected from {source_file}:{source_line}"
  query_params:
{query_params_yaml}
  request:
    body:
{request_body_yaml}
  response:
    status: 200
    body:
{response_model_yaml}
  service:
    # TODO: Add $ref to functionality module
    $ref: "../functionality/[MODULE_NAME].yaml#/module/services/[INDEX]"
  notes: |
    Auto-generated by doc-sync on {timestamp}
    Source: {source_file}:{source_line}

    Please review:
    - [ ] Description is accurate
    - [ ] Service reference is correct
    - [ ] Response schema is complete
    - [ ] Error responses documented

# Example query_params_yaml:
#   q: "string - search query (required)"
#   type: "income | expense (optional)"
#   page: "integer - page number (default: 1)"

# Example request_body_yaml:
#   name: "string (required)"
#   type: "income | expense (required)"
#   parent_id: "integer (optional)"

# Example response_model_yaml:
#   articles: "array of article objects"
#   total: "integer - total count"
#   limit: "integer - page size"
#   offset: "integer - skip count"
