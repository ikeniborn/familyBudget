# Template for auto-generating database table documentation
# Used by doc-sync to create YAML snippets for new/modified SQLAlchemy models

# Variables:
# {table_name} - Database table name
# {model_class} - SQLAlchemy model class name
# {columns_yaml} - Column definitions (extracted from SQLAlchemy)
# {indexes_yaml} - Index definitions
# {constraints_yaml} - Constraint definitions
# {source_file} - Source code file path
# {timestamp} - Detection timestamp

{table_name}:
  description: "TODO: Add table description - auto-detected from {model_class}"
  model: "{model_class}"
  type: "dimension | fact"  # TODO: Specify table type
  scd_type: "1 | 2"  # TODO: Specify SCD type (1 for facts, 2 for dimensions)
  columns:
{columns_yaml}
  indexes:
{indexes_yaml}
  constraints:
{constraints_yaml}
  relationships:
    # TODO: Document relationships to other tables
    - foreign_key: "[column_name]"
      references: "[table_name].[column_name]"
      description: "[Relationship description]"
  notes: |
    Auto-generated by doc-sync on {timestamp}
    Source: {source_file}

    Please review:
    - [ ] Table type is correct (dimension/fact)
    - [ ] SCD type is correct
    - [ ] All relationships documented
    - [ ] Indexes match actual database

