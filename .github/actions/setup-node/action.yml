name: Setup Node.js
description: Setup Node.js with optional npm caching

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '18'
  enable-cache:
    description: 'Enable npm caching'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.enable-cache == 'true' && 'npm' || '' }}
