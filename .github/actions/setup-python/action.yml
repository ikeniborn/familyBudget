name: Setup Python
description: Setup Python with pip caching

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  cache-dependency-path:
    description: 'Path to requirements file for cache invalidation'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
