name: Setup Test Services
description: |
  Health checks for PostgreSQL test service.
  NOTE: Services must be defined at job level - this action only validates PostgreSQL is ready.
  Redis health check is handled by service health-cmd option (redis-cli not available in runner).

inputs:
  postgres-password:
    description: PostgreSQL password for connection validation
    required: true
    default: test_password_12345678901234567890

runs:
  using: composite
  steps:
    - name: Wait for PostgreSQL
      shell: bash
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 30 bash -c 'until pg_isready -h localhost -U familybudget; do sleep 1; done'
        echo "✅ PostgreSQL is ready"

    - name: Validate PostgreSQL connection
      shell: bash
      env:
        PGPASSWORD: ${{ inputs.postgres-password }}
      run: |
        echo "Validating PostgreSQL connection..."
        psql -h localhost -U familybudget -d familybudget_test -c "SELECT version();" > /dev/null
        echo "✅ PostgreSQL connection validated"

    # Note: Redis health check removed - services already have built-in health checks
    # redis-cli is not available in GitHub Actions runner by default
