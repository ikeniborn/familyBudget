# Release Drafter Configuration
# Автоматическая генерация changelog из Pull Requests

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Категории для группировки изменений
categories:
  - title: '✨ Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'perf'
  - title: '🔧 Refactoring'
    labels:
      - 'refactor'
      - 'refactoring'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🚀 Infrastructure'
    labels:
      - 'infrastructure'
      - 'chore'
      - 'ci'
      - 'deployment'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '⚠️ Deprecations'
    labels:
      - 'deprecation'

# Формат каждой строки в changelog
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

# Шаблон для группировки без категории
change-title-escapes: '\<*_&'

# Автоматическое определение версии на основе labels
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'feat'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'documentation'
      - 'docs'
  default: patch

# Автоматические labels на основе branch names
autolabeler:
  - label: 'feature'
    branch:
      - '/^feat(ure)?[/-].+/'
  - label: 'fix'
    branch:
      - '/^fix[/-].+/'
  - label: 'refactor'
    branch:
      - '/^refactor[/-].+/'
  - label: 'documentation'
    branch:
      - '/^docs?[/-].+/'
  - label: 'chore'
    branch:
      - '/^chore[/-].+/'
  - label: 'performance'
    branch:
      - '/^perf[/-].+/'

# Шаблон Release Notes
template: |
  ## Изменения

  $CHANGES

  ## Участники

  $CONTRIBUTORS

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Exclude labels - PR с этими labels не попадут в changelog
exclude-labels:
  - 'skip-changelog'
  - 'wip'
  - 'work-in-progress'
  - 'duplicate'
  - 'invalid'

# Заменители для улучшенного форматирования
replacers:
  - search: '/\[([A-Z]+-\d+)\]/g'
    replace: '[$1](https://github.com/$OWNER/$REPOSITORY/issues/$1)'
  - search: '/##(\d+)/g'
    replace: '[#$1](https://github.com/$OWNER/$REPOSITORY/pull/$1)'

# Сортировка PR
sort-by: title
sort-direction: ascending

# Предварительный релиз
prerelease: false
