name: API Contract Tests

on:
  pull_request:
    branches:
      - test
    paths:
      - 'backend/app/api/**'
      - 'backend/app/models/**'
      - 'docs/architecture/endpoints/**'
      - '.github/workflows/api-contract-tests.yml'

permissions:
  contents: read

jobs:
  openapi-validation:
    name: OpenAPI Schema Validation
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Re-enabled: Fixed FastAPI startup with improved health check retry logic

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familybudget_test
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python 3.12
        uses: ./.github/actions/setup-python
        with:
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 18
        uses: ./.github/actions/setup-node
        with:
          enable-cache: 'false'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install OpenAPI tools
        run: |
          npm install -g @openapitools/openapi-generator-cli openapi-diff

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
        run: |
          alembic -c backend/db/migrations/alembic.ini upgrade head

      - name: Start backend server
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          JWT_SECRET: test_jwt_secret
          SECRET_KEY: test_secret_key
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8000
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend

          # Start backend in background with logging
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          BACKEND_PID=$!

          echo "Started backend with PID: $BACKEND_PID"
          sleep 5  # Initial wait for startup

          # Improved health check with exponential backoff
          MAX_ATTEMPTS=60
          ATTEMPT=1
          WAIT_TIME=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            # Check if process is still running
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "❌ Backend process died! Logs:"
              cat backend.log
              exit 1
            fi

            # Try health check
            if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend ready after $ATTEMPT attempts"
              curl -s http://localhost:8000/health
              break
            fi

            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS: waiting ${WAIT_TIME}s..."
            sleep $WAIT_TIME

            # Exponential backoff (max 5s)
            WAIT_TIME=$((WAIT_TIME < 5 ? WAIT_TIME + 1 : 5))
            ATTEMPT=$((ATTEMPT + 1))
          done

          # Final check
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Backend failed to start after $MAX_ATTEMPTS attempts. Logs:"
            cat backend.log
            exit 1
          fi

      - name: Generate current OpenAPI spec
        run: |
          curl http://localhost:8000/openapi.json > openapi-current.json
          echo "✅ Current OpenAPI spec generated"

      - name: Validate OpenAPI spec
        run: |
          npx openapi-generator-cli validate -i openapi-current.json
          echo "✅ OpenAPI spec validation passed"

      - name: Generate previous OpenAPI spec (PR only)
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          JWT_SECRET: test_jwt_secret
          SECRET_KEY: test_secret_key
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8001
        run: |
          # Kill current backend
          pkill -f uvicorn || true
          sleep 2

          # Checkout previous commit
          git checkout HEAD~1

          # Restart backend with previous code
          cd backend
          pip install -r requirements.txt

          # Start previous backend with logging
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8001 > backend-prev.log 2>&1 &
          PREV_PID=$!

          echo "Started previous backend with PID: $PREV_PID"
          sleep 5

          # Improved health check
          MAX_ATTEMPTS=60
          ATTEMPT=1
          WAIT_TIME=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if ! kill -0 $PREV_PID 2>/dev/null; then
              echo "❌ Previous backend died! Logs:"
              cat backend-prev.log
              exit 1
            fi

            if curl -f -s http://localhost:8001/health > /dev/null 2>&1; then
              echo "✅ Previous backend ready after $ATTEMPT attempts"
              break
            fi

            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS: waiting ${WAIT_TIME}s..."
            sleep $WAIT_TIME
            WAIT_TIME=$((WAIT_TIME < 5 ? WAIT_TIME + 1 : 5))
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Previous backend failed to start. Logs:"
            cat backend-prev.log
            exit 1
          fi

          # Generate spec
          curl http://localhost:8001/openapi.json > ../openapi-previous.json

          # Return to current commit
          git checkout -

          echo "✅ Previous OpenAPI spec generated"

      - name: Detect breaking changes (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          npx openapi-diff openapi-previous.json openapi-current.json \
            --json > openapi-diff.json || true

          # Check for breaking changes
          if [ -f openapi-diff.json ]; then
            BREAKING_CHANGES=$(jq '.breakingChanges | length' openapi-diff.json || echo "0")

            if [ "$BREAKING_CHANGES" -gt 0 ]; then
              echo "## ⚠️ Breaking API Changes Detected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The following breaking changes were found:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
              jq '.breakingChanges' openapi-diff.json >> $GITHUB_STEP_SUMMARY || true
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Please review these changes carefully and update the CHANGELOG." >> $GITHUB_STEP_SUMMARY

              echo "::warning::Breaking API changes detected ($BREAKING_CHANGES). Review required."
            else
              echo "✅ No breaking API changes detected"
            fi
          fi

      - name: Upload OpenAPI spec artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: |
            openapi-current.json
            openapi-previous.json
            openapi-diff.json
          retention-days: 30

  typescript-types-validation:
    name: TypeScript Types Consistency
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    needs: openapi-validation  # Wait for OpenAPI spec generation
    # Re-enabled: openapi-validation is now working
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: ./.github/actions/setup-node
        with:
          enable-cache: 'false'

      - name: Install dependencies
        run: npm install openapi-typescript

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-specs

      - name: Generate TypeScript types from OpenAPI
        run: |
          echo "Generating TypeScript types from OpenAPI schema..."

          # Ensure output directory exists
          mkdir -p frontend/web/static/js/types

          # Generate types
          npx openapi-typescript openapi-current.json \
            --output frontend/web/static/js/types/api-generated.ts

          echo "✅ TypeScript types generated successfully"

          # Show file size
          ls -lh frontend/web/static/js/types/api-generated.ts

      - name: Check for API breaking changes (TypeScript types)
        run: |
          # Check if committed types file exists
          if [ ! -f frontend/web/static/js/types/api-generated.ts ]; then
            echo "⚠️ No committed TypeScript types found"
            echo "This is the first API contract test run"
            echo "Please commit the generated types file"
            exit 0
          fi

          # Compare generated types with committed version
          if git diff --quiet frontend/web/static/js/types/api-generated.ts 2>/dev/null; then
            echo "✅ TypeScript types are in sync with OpenAPI spec"
            echo "✅ No API breaking changes detected"
          else
            echo "## ⚠️ API Breaking Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The generated TypeScript types differ from the committed version." >> $GITHUB_STEP_SUMMARY
            echo "This indicates potential breaking changes to the API contract." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changes:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            git diff frontend/web/static/js/types/api-generated.ts >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Action Required:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the API changes carefully" >> $GITHUB_STEP_SUMMARY
            echo "2. Update frontend code to handle new types" >> $GITHUB_STEP_SUMMARY
            echo "3. Regenerate types: \`npx openapi-typescript http://localhost:8000/openapi.json -o frontend/web/static/js/types/api-generated.ts\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Commit the updated types file" >> $GITHUB_STEP_SUMMARY

            echo "::error::API breaking changes detected! TypeScript types changed."
            exit 1
          fi
