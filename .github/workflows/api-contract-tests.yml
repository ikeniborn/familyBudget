name: API Contract Tests

on:
  pull_request:
    branches:
      - test
    paths:
      - 'backend/app/api/**'
      - 'backend/app/models/**'
      - 'docs/architecture/endpoints/**'
      - '.github/workflows/api-contract-tests.yml'

permissions:
  contents: read

jobs:
  openapi-validation:
    name: OpenAPI Schema Validation
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: false  # Disabled: FastAPI startup timing issues in CI/CD

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familybudget_test
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python 3.12
        uses: ./.github/actions/setup-python
        with:
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 18
        uses: ./.github/actions/setup-node
        with:
          enable-cache: 'false'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install OpenAPI tools
        run: |
          npm install -g @openapitools/openapi-generator-cli openapi-diff

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
        run: |
          alembic -c backend/db/migrations/alembic.ini upgrade head

      - name: Start backend server
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          JWT_SECRET: test_jwt_secret
          SECRET_KEY: test_secret_key
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8000
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

          # Wait for backend
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Generate current OpenAPI spec
        run: |
          curl http://localhost:8000/openapi.json > openapi-current.json
          echo "✅ Current OpenAPI spec generated"

      - name: Validate OpenAPI spec
        run: |
          npx openapi-generator-cli validate -i openapi-current.json
          echo "✅ OpenAPI spec validation passed"

      - name: Generate previous OpenAPI spec (PR only)
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          JWT_SECRET: test_jwt_secret
          SECRET_KEY: test_secret_key
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8001
        run: |
          # Kill current backend
          pkill -f uvicorn || true
          sleep 2

          # Checkout previous commit
          git checkout HEAD~1

          # Restart backend with previous code
          cd backend
          pip install -r requirements.txt
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8001 &
          sleep 10

          # Wait for backend
          for i in {1..30}; do
            if curl -s http://localhost:8001/health > /dev/null 2>&1; then
              echo "Previous backend ready"
              break
            fi
            echo "Waiting for previous backend... ($i/30)"
            sleep 1
          done

          # Generate spec
          curl http://localhost:8001/openapi.json > ../openapi-previous.json

          # Return to current commit
          git checkout -

          echo "✅ Previous OpenAPI spec generated"

      - name: Detect breaking changes (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          npx openapi-diff openapi-previous.json openapi-current.json \
            --json > openapi-diff.json || true

          # Check for breaking changes
          if [ -f openapi-diff.json ]; then
            BREAKING_CHANGES=$(jq '.breakingChanges | length' openapi-diff.json || echo "0")

            if [ "$BREAKING_CHANGES" -gt 0 ]; then
              echo "## ⚠️ Breaking API Changes Detected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The following breaking changes were found:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
              jq '.breakingChanges' openapi-diff.json >> $GITHUB_STEP_SUMMARY || true
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Please review these changes carefully and update the CHANGELOG." >> $GITHUB_STEP_SUMMARY

              echo "::warning::Breaking API changes detected ($BREAKING_CHANGES). Review required."
            else
              echo "✅ No breaking API changes detected"
            fi
          fi

      - name: Upload OpenAPI spec artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: |
            openapi-current.json
            openapi-previous.json
            openapi-diff.json
          retention-days: 30

  typescript-types-validation:
    name: TypeScript Types Consistency
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    # needs: openapi-validation  # Removed: openapi-validation is disabled
    if: false  # Disabled: Depends on openapi-validation artifacts
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: ./.github/actions/setup-node
        with:
          enable-cache: 'false'

      - name: Install dependencies
        run: npm install openapi-typescript

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-specs

      - name: Generate TypeScript types from OpenAPI
        continue-on-error: true
        run: |
          npx openapi-typescript openapi-current.json \
            --output frontend/web/static/js/types/api-generated.ts || true

      - name: Check for type mismatches
        continue-on-error: true
        run: |
          if git diff --quiet frontend/web/static/js/types/api-generated.ts 2>/dev/null; then
            echo "✅ TypeScript types are in sync with OpenAPI spec"
          else
            echo "## ⚠️ TypeScript Types Out of Sync" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The generated TypeScript types differ from committed version." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            git diff frontend/web/static/js/types/api-generated.ts >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            echo "::warning::TypeScript types need regeneration. Run: npx openapi-typescript openapi.json"
          fi
