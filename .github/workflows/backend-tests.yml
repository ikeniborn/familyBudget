name: Backend Tests

on:
  push:
    branches:
      - main
      - test
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'bot/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - main
      - test
    paths:
      - 'backend/**'
      - 'bot/**'
      - 'pytest.ini'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  backend-unit-integration:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familybudget_test
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio

      - name: Run backend migrations
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run backend tests with coverage
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          REDIS_ENABLED: true
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_for_ci_only_do_not_use_in_production
          SECRET_KEY: test_secret_key_for_ci_only_do_not_use_in_production
        run: |
          cd backend
          pytest tests/ \
            --cov=app \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --cov-report=lcov:coverage/lcov.info \
            --cov-report=term \
            -v \
            -m "not e2e" \
            --maxfail=5 \
            --tb=short

      - name: Check backend coverage thresholds
        run: |
          cd backend

          # Extract coverage percentage from JSON
          LINES=$(python3 -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          THRESHOLD=70.0

          echo "Backend Coverage: $LINES% (threshold: $THRESHOLD%)"

          # Compare coverage to threshold
          if awk -v a="$LINES" -v b="$THRESHOLD" 'BEGIN {exit (a >= b ? 0 : 1)}'; then
            echo "✅ Backend coverage threshold met: $LINES% >= $THRESHOLD%"
          else
            echo "❌ Backend coverage $LINES% is below $THRESHOLD% threshold"
            exit 1
          fi

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 7

  bot-tests:
    name: Bot Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install bot dependencies
        run: |
          cd bot
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run bot tests
        env:
          TELEGRAM_BOT_TOKEN: test_token_for_ci_only
          BACKEND_URL: http://localhost:8000
        run: |
          cd bot
          pytest tests/ \
            -v \
            --tb=short \
            --maxfail=3 \
            --junitxml=pytest-report.xml

      - name: Upload bot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-test-results
          path: bot/pytest-report.xml
          retention-days: 7
