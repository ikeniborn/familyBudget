name: Build and Push Docker Images

on:
  push:
    branches: [test]
    tags: ['v*.*.*']
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'bot/**'
      - 'nginx/**'
      - 'redis/**'
      - 'postgres/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string
      skip_version_check:
        description: 'Skip VERSION change check'
        required: false
        type: boolean
        default: false

# Allow only one workflow run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 0: Check VERSION changes
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.skip_version_check == false
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      current_version: ${{ steps.read.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read current VERSION
        id: read
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check VERSION changes
        id: check
        run: |
          # Для push событий проверяем изменился ли VERSION в последнем коммите
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff HEAD~1 HEAD -- VERSION | grep -q "^[+-][0-9]"; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ VERSION changed in this push"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⚠ VERSION not changed, build may create duplicate tags"
            fi

          # Для tags и manual
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Skipping VERSION check for tag/manual trigger"
          fi

  # Job 1: Frontend Build
  frontend-build:
    needs: check-version
    runs-on: ubuntu-latest
    if: |
      needs.check-version.outputs.version_changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache busting
        run: |
          # Генерация cache version в формате v{YYYYMMDD_HHMM}
          # Формат требуется Service Worker для валидации версии
          CACHE_VERSION="v$(date -u +%Y%m%d_%H%M)"
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Generated cache version: $CACHE_VERSION"

          # Запуск cache busting скрипта
          bash scripts/ci/cache_busting_ci.sh "$CACHE_VERSION"

          # Проверка изменений
          if git diff --quiet frontend/; then
            echo "No changes after cache busting"
          else
            echo "Cache versions updated in templates"
            git diff frontend/ | head -50
          fi

      - name: Validate cache busting and PGlite
        run: |
          # Test 1: Check PLACEHOLDER replaced
          echo "🔍 Checking for unreplaced PLACEHOLDERs..."
          if grep -rE '\?v=PLACEHOLDER' frontend/web/templates/ frontend/webapp/; then
            echo "❌ PLACEHOLDER not replaced in templates"
            exit 1
          fi
          echo "✅ No PLACEHOLDER markers found"

          # Test 2: Check version format in templates
          echo "🔍 Checking cache version format..."
          if ! grep -rE '\?v=v[0-9_]+' frontend/web/templates/ >/dev/null; then
            echo "❌ No valid cache versions found in templates"
            exit 1
          fi
          echo "✅ Valid cache versions found"

          # Test 3: Check PGlite script tag exists
          echo "🔍 Checking PGlite script tag in base.html..."
          if ! grep -q "/shared/db/pglite.min.js" frontend/web/templates/base.html; then
            echo "❌ PGlite script tag missing in base.html"
            exit 1
          fi
          echo "✅ PGlite script tag found"

          # Test 4: Check Service Worker file exists and has valid version
          echo "🔍 Checking Service Worker cache version..."
          if [[ ! -f frontend/web/static/sw.min.js ]]; then
            echo "❌ Service Worker file missing: sw.min.js"
            exit 1
          fi

          # Service Worker uses minified code, check for version presence
          CACHE_VERSION="${CACHE_VERSION}"
          if ! grep -q "$CACHE_VERSION" frontend/web/static/sw.min.js; then
            echo "⚠️  Warning: Could not verify SW cache version (may be minified)"
            # Don't fail - version might be in minified format
          else
            echo "✅ Service Worker cache version verified"
          fi

          echo ""
          echo "✅ All validation checks passed"

          # Persist cache version to file for docker-build job (after successful validation)
          echo "$CACHE_VERSION" > .cache_version
          echo "Cache version persisted to .cache_version file"

      - name: Build frontend
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain frontend/web/static/js/dist frontend/web/static/css) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Frontend build artifacts changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in frontend build artifacts"
          fi

      - name: Commit built files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/web/static/js/dist/ \
                  frontend/web/static/css/*.min.css \
                  frontend/web/templates/ \
                  frontend/webapp/
          git commit -m "chore(ci): auto-build frontend assets and cache bust templates [skip ci]"
          git push

  # Job 2: Quality Checks
  quality-checks:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull to get committed frontend assets
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Detect merge commit from PR
        id: detect-merge
        run: |
          # Проверяем является ли коммит merge коммитом из PR
          commit_message=$(git log -1 --pretty=%B)

          if echo "$commit_message" | grep -qE "^Merge pull request #[0-9]+ from"; then
            echo "is_pr_merge=true" >> $GITHUB_OUTPUT
            echo "✓ Detected PR merge commit, quality checks already passed in pr-checks.yml"
          else
            echo "is_pr_merge=false" >> $GITHUB_OUTPUT
            echo "Direct push to test, running quality checks"
          fi

      - name: Setup Node.js
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm ci

      - name: TypeScript type check
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm run type-check

      - name: ESLint
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm run lint

      - name: Setup Python
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: |
          pip install mypy ruff pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: Python mypy type check
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: mypy backend/ || true
        continue-on-error: true

      - name: Python ruff lint
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: ruff check backend/
        continue-on-error: true

      - name: Unit tests
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: pytest tests/unit/ --cov --cov-report=xml || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Job 3: Build and Push Docker Images
  build-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_built: ${{ steps.changes.outputs.backend }}
      bot_built: ${{ steps.changes.outputs.bot }}
      nginx_built: ${{ steps.changes.outputs.nginx }}
      redis_built: ${{ steps.changes.outputs.redis }}
      postgresql_built: ${{ steps.changes.outputs.postgresql }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull to get committed frontend assets
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Set cache and image versions
        run: |
          # Frontend/SW use timestamp for cache invalidation
          if [[ -f .cache_version ]]; then
            CACHE_VERSION=$(cat .cache_version)
          else
            echo "❌ Cache version file missing - frontend build failed"
            exit 1
          fi
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Using cache version: $CACHE_VERSION"

          # Docker images use git hash for traceability
          IMAGE_VERSION=$(git rev-parse --short HEAD)
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "Using image version: $IMAGE_VERSION"

      - name: Check image changes
        id: changes
        run: |
          # Backend changes
          if bash scripts/ci/check_image_changes.sh backend | grep -q "build"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          # Bot changes
          if bash scripts/ci/check_image_changes.sh bot | grep -q "build"; then
            echo "bot=true" >> $GITHUB_OUTPUT
          else
            echo "bot=false" >> $GITHUB_OUTPUT
          fi

          # Nginx changes
          if bash scripts/ci/check_image_changes.sh nginx | grep -q "build"; then
            echo "nginx=true" >> $GITHUB_OUTPUT
          else
            echo "nginx=false" >> $GITHUB_OUTPUT
          fi

          # Redis changes
          if bash scripts/ci/check_image_changes.sh redis | grep -q "build"; then
            echo "redis=true" >> $GITHUB_OUTPUT
          else
            echo "redis=false" >> $GITHUB_OUTPUT
          fi

          # PostgreSQL changes
          if bash scripts/ci/check_image_changes.sh postgresql | grep -q "build"; then
            echo "postgresql=true" >> $GITHUB_OUTPUT
          else
            echo "postgresql=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Backend
            org.opencontainers.image.description=Family Budget application backend (FastAPI)
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-bot
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Bot
            org.opencontainers.image.description=Family Budget Telegram bot
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (nginx)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-nginx
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Nginx
            org.opencontainers.image.description=Family Budget Nginx reverse proxy
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (redis)
        id: meta-redis
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-redis
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Redis
            org.opencontainers.image.description=Family Budget Redis cache
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (postgresql)
        id: meta-postgresql
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-postgresql
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget PostgreSQL
            org.opencontainers.image.description=Family Budget PostgreSQL database
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            CACHE_VERSION=${{ env.CACHE_VERSION }}

      - name: Build and push bot
        if: steps.changes.outputs.bot == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11

      - name: Build and push nginx
        if: steps.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push redis
        if: steps.changes.outputs.redis == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: true
          tags: ${{ steps.meta-redis.outputs.tags }}
          labels: ${{ steps.meta-redis.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push postgresql
        if: steps.changes.outputs.postgresql == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          tags: ${{ steps.meta-postgresql.outputs.tags }}
          labels: ${{ steps.meta-postgresql.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3.5: Update IMAGE_VERSIONS.json для собранных образов
  update-versions:
    needs: build-push
    runs-on: ubuntu-latest
    if: |
      needs.build-push.outputs.backend_built == 'true' ||
      needs.build-push.outputs.bot_built == 'true' ||
      needs.build-push.outputs.nginx_built == 'true' ||
      needs.build-push.outputs.redis_built == 'true' ||
      needs.build-push.outputs.postgresql_built == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Read VERSION
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update backend version
        if: needs.build-push.outputs.backend_built == 'true'
        run: bash scripts/ci/update_image_version.sh backend "${{ steps.version.outputs.VERSION }}"

      - name: Update bot version
        if: needs.build-push.outputs.bot_built == 'true'
        run: bash scripts/ci/update_image_version.sh bot "${{ steps.version.outputs.VERSION }}"

      - name: Update nginx version
        if: needs.build-push.outputs.nginx_built == 'true'
        run: bash scripts/ci/update_image_version.sh nginx "${{ steps.version.outputs.VERSION }}"

      - name: Update redis version
        if: needs.build-push.outputs.redis_built == 'true'
        run: bash scripts/ci/update_image_version.sh redis "${{ steps.version.outputs.VERSION }}"

      - name: Update postgresql version
        if: needs.build-push.outputs.postgresql_built == 'true'
        run: bash scripts/ci/update_image_version.sh postgresql "${{ steps.version.outputs.VERSION }}"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain IMAGE_VERSIONS.json) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "IMAGE_VERSIONS.json has been updated:"
            git diff IMAGE_VERSIONS.json
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to IMAGE_VERSIONS.json"
          fi

      - name: Commit IMAGE_VERSIONS.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add IMAGE_VERSIONS.json
          git commit -m "chore(ci): auto-update IMAGE_VERSIONS.json [skip ci]"
          git push

  # Job 4: Security Scan
  security-scan:
    needs: [build-push, update-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          # Always use VERSION file (matches tags from build-push job)
          TAG="${{ steps.version.outputs.VERSION }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Run Trivy scanner (backend)
        if: needs.build-push.outputs.backend_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (backend)
        if: needs.build-push.outputs.backend_built == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'backend-image'
        continue-on-error: true

      - name: Run Trivy scanner (bot)
        if: needs.build-push.outputs.bot_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-bot.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (bot)
        if: needs.build-push.outputs.bot_built == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-bot.sarif'
          category: 'bot-image'
        continue-on-error: true

  # Job 5: Summary
  summary:
    needs: [check-version, frontend-build, quality-checks, build-push, update-versions, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch/Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Checks: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.build-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-nginx:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-redis:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-postgresql:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
