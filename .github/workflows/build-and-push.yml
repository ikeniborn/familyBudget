name: Build and Push Docker Images

on:
  push:
    branches: [test]
    tags: ['v*.*.*']
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'bot/**'
      - 'nginx/**'
      - 'redis/**'
      - 'postgres/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string
      skip_version_check:
        description: 'Skip VERSION change check'
        required: false
        type: boolean
        default: false

# Allow only one workflow run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Check VERSION file changes
  # ============================================================================
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.skip_version_check == false
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      current_version: ${{ steps.read.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read current VERSION
        id: read
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check VERSION changes
        id: check
        run: |
          # Для push событий проверяем изменился ли VERSION в последнем коммите
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff HEAD~1 HEAD -- VERSION | grep -q "^[+-][0-9]"; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ VERSION changed in this push"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⚠ VERSION not changed, build may create duplicate tags"
            fi

          # Для tags и manual
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Skipping VERSION check for tag/manual trigger"
          fi

  # ============================================================================
  # Job 2: Build services (frontend: cache busting, minification, validation)
  # ============================================================================
  service-build:
    needs: [check-version]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch')
    outputs:
      cache_version: ${{ steps.cache_bust.outputs.cache_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache busting
        id: cache_bust
        run: |
          # Чтение версии из VERSION файла
          if [[ ! -f VERSION ]]; then
            echo "❌ VERSION file not found"
            exit 1
          fi

          CACHE_VERSION=$(cat VERSION | tr -d '[:space:]')

          # Валидация semantic versioning (X.Y.Z)
          if [[ ! "$CACHE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid VERSION format: $CACHE_VERSION"
            echo "   Expected: X.Y.Z (e.g., 10.0.23)"
            exit 1
          fi

          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "cache_version=$CACHE_VERSION" >> $GITHUB_OUTPUT
          echo "Cache version from VERSION file: $CACHE_VERSION"

          # Запуск cache busting скрипта
          bash scripts/ci/cache_busting_ci.sh "$CACHE_VERSION"

          # Проверка изменений
          if git diff --quiet frontend/; then
            echo "No changes after cache busting"
          else
            echo "Cache versions updated in templates"
            git diff frontend/ | head -50
          fi

      - name: Build frontend
        run: npm run build

      - name: Validate cache busting and PGlite
        run: |
          # Test 1: Check PLACEHOLDER replaced
          echo "🔍 Checking for unreplaced PLACEHOLDERs..."
          if grep -rE '\?v=PLACEHOLDER' frontend/web/templates/ frontend/webapp/; then
            echo "❌ PLACEHOLDER not replaced in templates"
            exit 1
          fi
          echo "✅ No PLACEHOLDER markers found"

          # Test 2: Check version format in templates
          echo "🔍 Checking cache version format..."
          # Support both semantic versioning (X.Y.Z) and legacy format (v{timestamp})
          if ! grep -rE '\?v=([0-9]+\.[0-9]+\.[0-9]+|v[0-9_]+)' frontend/web/templates/ >/dev/null; then
            echo "❌ No valid cache versions found in templates"
            exit 1
          fi
          echo "✅ Valid cache versions found"

          # Test 3: Check PGlite script tag exists
          echo "🔍 Checking PGlite script tag in base.html..."
          if ! grep -q "/shared/db/pglite.min.js" frontend/web/templates/base.html; then
            echo "❌ PGlite script tag missing in base.html"
            exit 1
          fi
          echo "✅ PGlite script tag found"

          # Test 4: Check Service Worker file exists and has valid version
          echo "🔍 Checking Service Worker cache version..."
          if [[ ! -f frontend/web/static/sw.min.js ]]; then
            echo "❌ Service Worker file missing: sw.min.js"
            exit 1
          fi

          # Service Worker uses minified code, check for version presence
          CACHE_VERSION="${CACHE_VERSION}"
          if ! grep -q "$CACHE_VERSION" frontend/web/static/sw.min.js; then
            echo "⚠️  Warning: Could not verify SW cache version (may be minified)"
            # Don't fail - version might be in minified format
          else
            echo "✅ Service Worker cache version verified"
          fi

          echo ""
          echo "✅ All validation checks passed"

      # NOTE: Template files (frontend/web/templates/, frontend/webapp/) are NOT committed back to git
      # They should always have PLACEHOLDER in git, replaced during Docker build only
      # Build artifacts (dist/, *.min.css) are also excluded per registry-first architecture
      # All built files exist only in Docker images, not in git

  # ============================================================================
  # Job 3: Quality checks (TypeScript, ESLint, Python mypy/ruff, unit tests)
  # ============================================================================
  quality-checks:
    needs: [check-version, service-build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.service-build.result == 'success' || needs.service-build.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull in case of concurrent commits (race conditions)
      - name: Pull latest changes
        run: |
          # Retry pull with exponential backoff (max 3 attempts)
          for i in 1 2 3; do
            if git pull origin ${{ github.ref_name }}; then
              echo "✅ Git pull successful"
              break
            else
              echo "⚠️ Git pull attempt $i failed, retrying in $((i * 2))s..."
              sleep $((i * 2))
            fi
          done

      - name: Detect merge commit from PR
        id: detect-merge
        run: |
          # Проверяем является ли коммит merge коммитом из PR
          commit_message=$(git log -1 --pretty=%B)

          if echo "$commit_message" | grep -qE "^Merge pull request #[0-9]+ from"; then
            echo "is_pr_merge=true" >> $GITHUB_OUTPUT
            echo "✓ Detected PR merge commit, quality checks already passed in pr-checks.yml"
          else
            echo "is_pr_merge=false" >> $GITHUB_OUTPUT
            echo "Direct push to test, running quality checks"
          fi

      - name: Setup Node.js
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm ci

      - name: TypeScript type check
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm run type-check

      - name: ESLint
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: npm run lint

      - name: Setup Python
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: |
          pip install mypy ruff pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: Python mypy type check
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: mypy backend/ || true
        continue-on-error: true

      - name: Python ruff lint
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: ruff check backend/
        continue-on-error: true

      - name: Unit tests
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        run: pytest tests/unit/ --cov --cov-report=xml || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: steps.detect-merge.outputs.is_pr_merge == 'false'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================================
  # Job 4: Build and push Docker images to GitHub Container Registry
  # ============================================================================
  image-build-push:
    needs: [check-version, service-build, quality-checks]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.service-build.result == 'success'
    permissions:
      contents: write  # Changed from read to write for git push
      packages: write
    outputs:
      backend_built: ${{ steps.changes.outputs.backend }}
      bot_built: ${{ steps.changes.outputs.bot }}
      nginx_built: ${{ steps.changes.outputs.nginx }}
      redis_built: ${{ steps.changes.outputs.redis }}
      postgresql_built: ${{ steps.changes.outputs.postgresql }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull in case of concurrent commits (race conditions)
      - name: Pull latest changes
        run: |
          # Retry pull with exponential backoff (max 3 attempts)
          for i in 1 2 3; do
            if git pull origin ${{ github.ref_name }}; then
              echo "✅ Git pull successful"
              break
            else
              echo "⚠️ Git pull attempt $i failed, retrying in $((i * 2))s..."
              sleep $((i * 2))
            fi
          done

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Set cache and image versions
        run: |
          # Frontend/SW use VERSION for cache invalidation (from service-build job output)
          CACHE_VERSION="${{ needs.service-build.outputs.cache_version }}"
          if [[ -z "$CACHE_VERSION" ]]; then
            echo "❌ Cache version missing from service-build job output"
            exit 1
          fi
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Using cache version: $CACHE_VERSION"

          # Docker images use git hash for traceability
          IMAGE_VERSION=$(git rev-parse --short HEAD)
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "Using image version: $IMAGE_VERSION"

      - name: Check image changes
        id: changes
        run: |
          # Backend changes
          if bash scripts/ci/check_image_changes.sh backend | grep -q "build"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          # Bot changes
          if bash scripts/ci/check_image_changes.sh bot | grep -q "build"; then
            echo "bot=true" >> $GITHUB_OUTPUT
          else
            echo "bot=false" >> $GITHUB_OUTPUT
          fi

          # Nginx changes
          if bash scripts/ci/check_image_changes.sh nginx | grep -q "build"; then
            echo "nginx=true" >> $GITHUB_OUTPUT
          else
            echo "nginx=false" >> $GITHUB_OUTPUT
          fi

          # Redis changes
          if bash scripts/ci/check_image_changes.sh redis | grep -q "build"; then
            echo "redis=true" >> $GITHUB_OUTPUT
          else
            echo "redis=false" >> $GITHUB_OUTPUT
          fi

          # PostgreSQL changes
          if bash scripts/ci/check_image_changes.sh postgresql | grep -q "build"; then
            echo "postgresql=true" >> $GITHUB_OUTPUT
          else
            echo "postgresql=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Backend
            org.opencontainers.image.description=Family Budget application backend (FastAPI)
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-bot
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Bot
            org.opencontainers.image.description=Family Budget Telegram bot
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (nginx)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-nginx
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Nginx
            org.opencontainers.image.description=Family Budget Nginx reverse proxy
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (redis)
        id: meta-redis
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-redis
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Redis
            org.opencontainers.image.description=Family Budget Redis cache
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (postgresql)
        id: meta-postgresql
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-postgresql
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget PostgreSQL
            org.opencontainers.image.description=Family Budget PostgreSQL database
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cache busting before Docker build
        run: |
          echo "Running cache busting with version: $CACHE_VERSION"
          bash scripts/ci/cache_busting_ci.sh "$CACHE_VERSION"

          # Verify templates were updated
          if grep -rE '\?v=PLACEHOLDER' frontend/web/templates/ frontend/webapp/ 2>/dev/null; then
            echo "❌ PLACEHOLDER still found after cache busting"
            exit 1
          fi
          echo "✅ Cache busting completed - templates ready for Docker build"

      - name: Set build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            CACHE_VERSION=${{ env.CACHE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Build and push bot
        if: steps.changes.outputs.bot == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Build and push nginx
        if: steps.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push redis
        if: steps.changes.outputs.redis == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: true
          tags: ${{ steps.meta-redis.outputs.tags }}
          labels: ${{ steps.meta-redis.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push postgresql
        if: steps.changes.outputs.postgresql == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          tags: ${{ steps.meta-postgresql.outputs.tags }}
          labels: ${{ steps.meta-postgresql.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================================
      # Update IMAGE_VERSIONS.json with newly built image tags
      # ========================================================================
      - name: Install jq for IMAGE_VERSIONS.json update
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.bot == 'true' ||
          steps.changes.outputs.nginx == 'true' ||
          steps.changes.outputs.redis == 'true' ||
          steps.changes.outputs.postgresql == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update backend version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.backend == 'true'
        run: bash scripts/ci/update_image_version.sh backend "${{ steps.version.outputs.VERSION }}"

      - name: Update bot version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.bot == 'true'
        run: bash scripts/ci/update_image_version.sh bot "${{ steps.version.outputs.VERSION }}"

      - name: Update nginx version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.nginx == 'true'
        run: bash scripts/ci/update_image_version.sh nginx "${{ steps.version.outputs.VERSION }}"

      - name: Update redis version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.redis == 'true'
        run: bash scripts/ci/update_image_version.sh redis "${{ steps.version.outputs.VERSION }}"

      - name: Update postgresql version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.postgresql == 'true'
        run: bash scripts/ci/update_image_version.sh postgresql "${{ steps.version.outputs.VERSION }}"

      # ========================================================================
      # Update package.json and package-lock.json version
      # ========================================================================
      - name: Update package.json and package-lock.json
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.bot == 'true' ||
          steps.changes.outputs.nginx == 'true' ||
          steps.changes.outputs.redis == 'true' ||
          steps.changes.outputs.postgresql == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Updating package.json to version $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          echo "Updating package-lock.json to version $VERSION"
          jq --arg v "$VERSION" '.version = $v' package-lock.json > package-lock.json.tmp
          jq --arg v "$VERSION" '.packages."".version = $v' package-lock.json.tmp > package-lock.json
          rm package-lock.json.tmp

          echo "✅ package.json and package-lock.json updated to $VERSION"

      # ========================================================================
      # Commit all version files (IMAGE_VERSIONS.json + package.json + package-lock.json)
      # ========================================================================
      - name: Commit version files
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.bot == 'true' ||
          steps.changes.outputs.nginx == 'true' ||
          steps.changes.outputs.redis == 'true' ||
          steps.changes.outputs.postgresql == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if any version files changed
          if [[ -n $(git status --porcelain IMAGE_VERSIONS.json package.json package-lock.json) ]]; then
            echo "Version files have been updated:"
            git diff IMAGE_VERSIONS.json package.json package-lock.json
            git add IMAGE_VERSIONS.json package.json package-lock.json
            git commit -m "chore(ci): auto-update IMAGE_VERSIONS.json [skip ci]"
            git push
            echo "✅ Version files committed and pushed"
          else
            echo "ℹ️ No changes to version files"
          fi

  # ============================================================================
  # Job 5: Security scanning with Trivy (CRITICAL and HIGH vulnerabilities)
  # ============================================================================
  security-scan:
    needs: [check-version, image-build-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          # Always use VERSION file (matches tags from build-push job)
          TAG="${{ steps.version.outputs.VERSION }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Run Trivy scanner (backend)
        if: needs.image-build-push.outputs.backend_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '0'

      - name: Generate vulnerability summary (backend)
        if: needs.image-build-push.outputs.backend_built == 'true'
        run: |
          echo "## 🔒 Security Scan: Backend" >> $GITHUB_STEP_SUMMARY
          docker run --rm aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --format table \
            ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }} \
            >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Upload Trivy results (backend)
        if: needs.image-build-push.outputs.backend_built == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'backend-image'
        continue-on-error: true

      - name: Run Trivy scanner (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-bot.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '0'

      - name: Generate vulnerability summary (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        run: |
          echo "## 🔒 Security Scan: Bot" >> $GITHUB_STEP_SUMMARY
          docker run --rm aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --format table \
            ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }} \
            >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Upload Trivy results (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-bot.sarif'
          category: 'bot-image'
        continue-on-error: true

  # ============================================================================
  # Job 6: Pipeline summary (version, commit, job statuses, Docker image tags)
  # ============================================================================
  summary:
    needs: [check-version, service-build, quality-checks, image-build-push, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch/Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.service-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Checks: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.image-build-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-nginx:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-redis:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-postgresql:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
