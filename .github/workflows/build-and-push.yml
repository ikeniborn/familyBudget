name: Build and Push Docker Images

on:
  push:
    branches: [test]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string

# Allow only one workflow run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Frontend Build
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache busting
        run: |
          # Генерация cache version из git hash
          CACHE_VERSION=$(git rev-parse --short HEAD)
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Generated cache version: $CACHE_VERSION"

          # Запуск cache busting скрипта
          bash scripts/ci/cache_busting_ci.sh "$CACHE_VERSION"

          # Проверка изменений
          if git diff --quiet frontend/; then
            echo "No changes after cache busting"
          else
            echo "Cache versions updated in templates"
            git diff frontend/ | head -50
          fi

      - name: Build frontend
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain frontend/web/static/js/dist frontend/web/static/css) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Frontend build artifacts changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in frontend build artifacts"
          fi

      - name: Commit built files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/web/static/js/dist/ frontend/web/static/css/*.min.css
          git commit -m "chore(ci): auto-build frontend assets [skip ci]"
          git push

  # Job 2: Quality Checks
  quality-checks:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull to get committed frontend assets
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install mypy ruff pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: Python mypy type check
        run: mypy backend/ || true
        continue-on-error: true

      - name: Python ruff lint
        run: ruff check backend/
        continue-on-error: true

      - name: Unit tests
        run: pytest tests/unit/ --cov --cov-report=xml || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Job 3: Build and Push Docker Images
  build-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull to get committed frontend assets
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Generate CACHE_VERSION
        run: |
          CACHE_VERSION=$(git rev-parse --short HEAD)
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Generated CACHE_VERSION: $CACHE_VERSION"

      - name: Check image changes
        id: changes
        run: |
          # Backend changes
          if bash scripts/ci/check_image_changes.sh backend | grep -q "build"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          # Bot changes
          if bash scripts/ci/check_image_changes.sh bot | grep -q "build"; then
            echo "bot=true" >> $GITHUB_OUTPUT
          else
            echo "bot=false" >> $GITHUB_OUTPUT
          fi

          # Nginx changes
          if bash scripts/ci/check_image_changes.sh nginx | grep -q "build"; then
            echo "nginx=true" >> $GITHUB_OUTPUT
          else
            echo "nginx=false" >> $GITHUB_OUTPUT
          fi

          # Redis changes
          if bash scripts/ci/check_image_changes.sh redis | grep -q "build"; then
            echo "redis=true" >> $GITHUB_OUTPUT
          else
            echo "redis=false" >> $GITHUB_OUTPUT
          fi

          # PostgreSQL changes
          if bash scripts/ci/check_image_changes.sh postgresql | grep -q "build"; then
            echo "postgresql=true" >> $GITHUB_OUTPUT
          else
            echo "postgresql=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Backend
            org.opencontainers.image.description=Family Budget application backend (FastAPI)
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-bot
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Bot
            org.opencontainers.image.description=Family Budget Telegram bot
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (nginx)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-nginx
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Nginx
            org.opencontainers.image.description=Family Budget Nginx reverse proxy
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (redis)
        id: meta-redis
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-redis
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Redis
            org.opencontainers.image.description=Family Budget Redis cache
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (postgresql)
        id: meta-postgresql
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-postgresql
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget PostgreSQL
            org.opencontainers.image.description=Family Budget PostgreSQL database
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            CACHE_VERSION=${{ env.CACHE_VERSION }}

      - name: Build and push bot
        if: steps.changes.outputs.bot == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11

      - name: Build and push nginx
        if: steps.changes.outputs.nginx == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push redis
        if: steps.changes.outputs.redis == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: true
          tags: ${{ steps.meta-redis.outputs.tags }}
          labels: ${{ steps.meta-redis.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push postgresql
        if: steps.changes.outputs.postgresql == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          tags: ${{ steps.meta-postgresql.outputs.tags }}
          labels: ${{ steps.meta-postgresql.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Security Scan
  security-scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          # Always use VERSION file (matches tags from build-push job)
          TAG="${{ steps.version.outputs.VERSION }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'backend-image'
        continue-on-error: true

      - name: Run Trivy scanner (bot)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-bot.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (bot)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-bot.sarif'
          category: 'bot-image'
        continue-on-error: true

  # Job 5: Summary
  summary:
    needs: [frontend-build, quality-checks, build-push, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch/Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Checks: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.build-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-nginx:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-redis:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/familybudget-postgresql:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
