name: Build → Push → Deploy → Test

on:
  push:
    branches: [test]
    tags: ['v*.*.*']
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'bot/**'
      - 'redis/**'
      - 'postgres/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.trivyignore'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string
      skip_version_check:
        description: 'Skip VERSION change check'
        required: false
        type: boolean
        default: false
      runner_type:
        description: 'Runner type (use self-hosted if GitHub Actions down)'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

# Allow only one workflow run at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Check VERSION file changes
  # ============================================================================
  check-version:
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: github.event_name != 'workflow_dispatch' || inputs.skip_version_check == false
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      current_version: ${{ steps.read.outputs.VERSION }}
      trivyignore_changed: ${{ steps.check.outputs.trivyignore_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read current VERSION
        id: read
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check VERSION changes
        id: check
        run: |
          # Для push событий проверяем изменился ли VERSION в последнем коммите
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff HEAD~1 HEAD -- VERSION | grep -q "^[+-][0-9]"; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ VERSION changed in this push"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⚠ VERSION not changed, build may create duplicate tags"
            fi

            # Check if .trivyignore changed (triggers security re-scan without image rebuild)
            if git diff HEAD~1 HEAD -- .trivyignore | grep -q "^[+-]"; then
              echo "trivyignore_changed=true" >> $GITHUB_OUTPUT
              echo "✓ .trivyignore changed — security re-scan needed"
            else
              echo "trivyignore_changed=false" >> $GITHUB_OUTPUT
            fi

          # Для tags и manual
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "trivyignore_changed=false" >> $GITHUB_OUTPUT
            echo "✓ Skipping VERSION check for tag/manual trigger"
          fi

      - name: Notify workflow started (Telegram)
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Workflow Started

            Version: ${{ steps.read.outputs.VERSION }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}

  # ============================================================================
  # Job 2: Build services (frontend: cache busting, minification, validation)
  # ============================================================================
  service-build:
    needs: [check-version]
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch')
    outputs:
      cache_version: ${{ steps.cache_bust.outputs.cache_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .vite
            .build-cache
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'config/vite.config*.ts', 'build-all.js') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm ci

      - name: Cache busting
        id: cache_bust
        run: |
          # Чтение версии из VERSION файла
          if [[ ! -f VERSION ]]; then
            echo "❌ VERSION file not found"
            exit 1
          fi

          CACHE_VERSION=$(cat VERSION | tr -d '[:space:]')

          # Валидация semantic versioning (X.Y.Z)
          if [[ ! "$CACHE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid VERSION format: $CACHE_VERSION"
            echo "   Expected: X.Y.Z (e.g., 10.0.23)"
            exit 1
          fi

          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "cache_version=$CACHE_VERSION" >> $GITHUB_OUTPUT
          echo "Cache version from VERSION file: $CACHE_VERSION"

          # Запуск cache busting скрипта
          bash scripts/ci/cache_busting_ci.sh "$CACHE_VERSION"

          # Проверка изменений
          if git diff --quiet frontend/; then
            echo "No changes after cache busting"
          else
            echo "Cache versions updated in templates"
            git diff frontend/ | head -50
          fi

      - name: Build frontend
        env:
          NODE_ENV: production
        run: npm run build:prod  # Skip type-check (38 Dexie errors)

      - name: Validate cache busting
        run: bash scripts/ci/validate_build_artifacts.sh "$CACHE_VERSION" --strict-sw

      # NOTE: Template files (frontend/web/templates/, frontend/webapp/) are NOT committed back to git
      # They should always have PLACEHOLDER in git, replaced during Docker build only
      # Build artifacts (dist/, *.min.css) are also excluded per registry-first architecture
      # All built files exist only in Docker images, not in git

  # ============================================================================
  # Job 3: Build and push Docker images to GitHub Container Registry
  # ============================================================================
  image-build-push:
    needs: [check-version, service-build]
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: |
      always() &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.service-build.result == 'success'
    permissions:
      contents: write  # Changed from read to write for git push
      packages: write
    outputs:
      backend_built: ${{ steps.changes.outputs.backend }}
      bot_built: ${{ steps.changes.outputs.bot }}
      redis_built: ${{ steps.changes.outputs.redis }}
      postgresql_built: ${{ steps.changes.outputs.postgresql }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-pull in case of concurrent commits (race conditions)
      - name: Pull latest changes
        run: |
          # Retry pull with exponential backoff (max 3 attempts)
          for i in 1 2 3; do
            if git pull origin ${{ github.ref_name }}; then
              echo "✅ Git pull successful"
              break
            else
              echo "⚠️ Git pull attempt $i failed, retrying in $((i * 2))s..."
              sleep $((i * 2))
            fi
          done

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Set cache and image versions
        run: |
          # Frontend/SW use VERSION for cache invalidation (from service-build job output)
          CACHE_VERSION="${{ needs.service-build.outputs.cache_version }}"
          if [[ -z "$CACHE_VERSION" ]]; then
            echo "❌ Cache version missing from service-build job output"
            exit 1
          fi
          echo "CACHE_VERSION=$CACHE_VERSION" >> $GITHUB_ENV
          echo "Using cache version: $CACHE_VERSION"

          # Docker images use git hash for traceability
          IMAGE_VERSION=$(git rev-parse --short HEAD)
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "Using image version: $IMAGE_VERSION"

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull moby/buildkit:buildx-stable-1; then
              break
            fi
            echo "Attempt $i failed, waiting $((i * 5))s..."
            sleep $((i * 5))
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Returns 0 (build) if: hash changed OR image tag missing from registry
          needs_build() {
            local service="$1"
            # Check git hash first
            if bash scripts/ci/check_image_changes.sh "$service" | grep -q "build"; then
              return 0
            fi
            # Fallback: verify image actually exists in registry using docker buildx
            # Uses the same mechanism as deploy.sh (manifest inspect) for consistency
            local version
            version=$(jq -r ".${service}.version // empty" IMAGE_VERSIONS.json 2>/dev/null)
            if [[ -n "$version" ]]; then
              local image="ghcr.io/${{ github.repository_owner }}/familybudget-${service}:${version}"
              if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
                echo "⚠️ ${service}:${version} not found in registry — forcing rebuild" >&2
                return 0
              fi
            fi
            return 1
          }

          needs_build backend    && echo "backend=true"    >> $GITHUB_OUTPUT || echo "backend=false"    >> $GITHUB_OUTPUT
          needs_build bot        && echo "bot=true"        >> $GITHUB_OUTPUT || echo "bot=false"        >> $GITHUB_OUTPUT
          needs_build redis      && echo "redis=true"      >> $GITHUB_OUTPUT || echo "redis=false"      >> $GITHUB_OUTPUT
          needs_build postgresql && echo "postgresql=true" >> $GITHUB_OUTPUT || echo "postgresql=false" >> $GITHUB_OUTPUT

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Backend
            org.opencontainers.image.description=Family Budget application backend (FastAPI)
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-bot
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Bot
            org.opencontainers.image.description=Family Budget Telegram bot
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (redis)
        id: meta-redis
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-redis
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget Redis
            org.opencontainers.image.description=Family Budget Redis cache
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Docker meta (postgresql)
        id: meta-postgresql
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familybudget-postgresql
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=Family Budget PostgreSQL
            org.opencontainers.image.description=Family Budget PostgreSQL database
            org.opencontainers.image.vendor=Family Budget Team
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Cache busting already done in service-build job (line 113-145)
      # Templates are validated there, no need to repeat
      - name: Set build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # NOTE: Distroless migration (v11.3) - Expected image sizes after optimization:
      # - Backend: ~400 MB (was 500 MB, 20% reduction)
      # - Bot: ~320 MB (was 400 MB, 20% reduction)
      # TODO: Add image size validation step after first successful build

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            CACHE_VERSION=${{ env.CACHE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Build and push bot
        if: steps.changes.outputs.bot == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot/Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            PYTHON_VERSION=3.11
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}

      - name: Build and push redis
        if: steps.changes.outputs.redis == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: true
          tags: ${{ steps.meta-redis.outputs.tags }}
          labels: ${{ steps.meta-redis.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push postgresql
        if: steps.changes.outputs.postgresql == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          tags: ${{ steps.meta-postgresql.outputs.tags }}
          labels: ${{ steps.meta-postgresql.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # ========================================================================
      # Update IMAGE_VERSIONS.json with newly built image tags
      # ========================================================================
      - name: Install jq for IMAGE_VERSIONS.json update
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.bot == 'true' ||
          steps.changes.outputs.redis == 'true' ||
          steps.changes.outputs.postgresql == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update backend version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.backend == 'true'
        run: bash scripts/ci/update_image_version.sh backend "${{ steps.version.outputs.VERSION }}"

      - name: Update bot version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.bot == 'true'
        run: bash scripts/ci/update_image_version.sh bot "${{ steps.version.outputs.VERSION }}"

      - name: Update redis version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.redis == 'true'
        run: bash scripts/ci/update_image_version.sh redis "${{ steps.version.outputs.VERSION }}"

      - name: Update postgresql version in IMAGE_VERSIONS.json
        if: steps.changes.outputs.postgresql == 'true'
        run: bash scripts/ci/update_image_version.sh postgresql "${{ steps.version.outputs.VERSION }}"

      # ========================================================================
      # Commit IMAGE_VERSIONS.json
      # ========================================================================
      - name: Commit IMAGE_VERSIONS.json
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.bot == 'true' ||
          steps.changes.outputs.redis == 'true' ||
          steps.changes.outputs.postgresql == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if IMAGE_VERSIONS.json changed
          if [[ -n $(git status --porcelain IMAGE_VERSIONS.json) ]]; then
            echo "IMAGE_VERSIONS.json has been updated:"
            git diff IMAGE_VERSIONS.json
            git add IMAGE_VERSIONS.json
            git commit -m "chore(ci): auto-update IMAGE_VERSIONS.json [skip ci]"

            # Pull and rebase to handle concurrent pushes
            git pull --rebase origin test
            git push
            echo "✅ IMAGE_VERSIONS.json committed and pushed"
          else
            echo "ℹ️ No changes to IMAGE_VERSIONS.json"
          fi

      # ========================================================================
      # Cleanup old untagged cache images (older than 14 days)
      # IMPORTANT: Runs AFTER Commit IMAGE_VERSIONS.json so protected tags are
      # fully up-to-date (includes newly built service versions)
      # ========================================================================
      - name: Cleanup old untagged images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Cleaning up old untagged Docker cache images (older than 14 days)..."

          # Calculate cutoff date (14 days ago in ISO 8601 format)
          # 14 days prevents edge case where cleanup runs exactly 7 days after a slow-changing
          # service (e.g. postgresql) was last built, causing GHCR inconsistency on manifest inspect
          CUTOFF_DATE=$(date -u -d '14 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          echo "Cutoff date: $CUTOFF_DATE"

          # List of all package names
          PACKAGES=(
            "familybudget-backend"
            "familybudget-bot"
            "familybudget-redis"
            "familybudget-postgresql"
          )

          TOTAL_DELETED=0

          for PACKAGE in "${PACKAGES[@]}"; do
            echo ""
            echo "📦 Processing package: $PACKAGE"

            # Collect protected tags from IMAGE_VERSIONS.json (never delete these)
            # Also protect the current build VERSION to guard against newly pushed images
            PROTECTED_TAGS=$(jq -r '.[].version' IMAGE_VERSIONS.json 2>/dev/null | sort -u)
            CURRENT_VERSION=$(cat VERSION 2>/dev/null || echo "")
            if [[ -n "$CURRENT_VERSION" ]]; then
              PROTECTED_TAGS=$(printf "%s\n%s" "$PROTECTED_TAGS" "$CURRENT_VERSION" | sort -u)
            fi
            echo "   Protected tags: $(echo $PROTECTED_TAGS | tr '\n' ' ')"

            # Collect protected sub-manifest digests: multi-platform images store per-platform
            # manifests as untagged versions referenced by the tagged parent manifest list.
            # Deleting these untagged children breaks the parent tag, so a later `docker pull`
            # fails with "manifests/<digest> not found". Protect the pinned version's children.
            #
            # $PACKAGE already carries the "familybudget-" prefix, so the image reference must
            # NOT prepend it again (the previous "familybudget-${PACKAGE}" produced a doubled
            # name that never resolved, leaving protection silently empty — the root cause of
            # recurring redis/postgres corruption).
            #
            # Fail-safe: only this package's OWN pinned version must be inspectable. The global
            # PROTECTED_TAGS union holds other services' versions that legitimately don't exist
            # as tags here, so we cannot require all of them to resolve. If the pinned tag
            # cannot be inspected (registry unreachable or already partially broken), abort
            # cleanup for this package rather than delete sub-manifests we cannot prove are
            # unreferenced.
            PKG_KEY="${PACKAGE#familybudget-}"
            OWN_VERSION=$(jq -r ".${PKG_KEY}.version // empty" IMAGE_VERSIONS.json 2>/dev/null)
            PROTECTED_DIGESTS=""
            if [[ -n "$OWN_VERSION" ]]; then
              OWN_IMAGE="ghcr.io/${{ github.repository_owner }}/${PACKAGE}:${OWN_VERSION}"
              OWN_MANIFEST=$(docker manifest inspect "$OWN_IMAGE" 2>/dev/null) || true
              if [[ -z "$OWN_MANIFEST" ]]; then
                echo "   ⚠️ Cannot inspect pinned tag ${PACKAGE}:${OWN_VERSION} — aborting cleanup for this package (fail-safe)"
                continue
              fi
              CHILD_DIGESTS=$(echo "$OWN_MANIFEST" | jq -r '.manifests[]?.digest // empty' 2>/dev/null || echo "")
              if [[ -n "$CHILD_DIGESTS" ]]; then
                PROTECTED_DIGESTS=$(printf "%s" "$CHILD_DIGESTS" | grep -v '^$' | sort -u)
              fi
            fi
            PROTECTED_DIGEST_COUNT=$(echo "$PROTECTED_DIGESTS" | grep -c 'sha256:' 2>/dev/null || echo "0")
            echo "   Protected sub-manifest digests for ${PACKAGE}:${OWN_VERSION}: $PROTECTED_DIGEST_COUNT"

            # Get total version count for this package (to protect the last one)
            TOTAL_VERSIONS=$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions?per_page=100" \
              --jq '.[].id' 2>/dev/null | wc -l || echo "0")
            echo "   Total versions in registry: $TOTAL_VERSIONS"

            # Never delete if package has 2 or fewer versions total (keep at least 1 as buffer)
            if [[ "$TOTAL_VERSIONS" -le 2 ]]; then
              echo "   🛡️ Skipping cleanup — package has only $TOTAL_VERSIONS version(s), keeping all"
              continue
            fi

            # Get all untagged versions older than cutoff date
            OLD_VERSIONS=$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | length == 0) | select(.created_at < \"$CUTOFF_DATE\") | .id" 2>/dev/null || echo "")

            if [[ -z "$OLD_VERSIONS" ]]; then
              echo "   No old untagged images found"
              continue
            fi

            COUNT=$(echo "$OLD_VERSIONS" | wc -l)
            echo "   Found $COUNT old untagged images to delete"

            # Safety: never delete more versions than (total - 1) to keep at least one
            VERSIONS_TO_DELETE=0
            # Delete each old version, skipping any that match a protected tag
            while IFS= read -r VERSION_ID; do
              [[ -z "$VERSION_ID" ]] && continue

              # Stop if deleting this would leave 0 versions
              REMAINING=$((TOTAL_VERSIONS - VERSIONS_TO_DELETE))
              if [[ "$REMAINING" -le 1 ]]; then
                echo "   🛡️ Stopping cleanup — would leave package empty (total=$TOTAL_VERSIONS, deleted=$VERSIONS_TO_DELETE)"
                break
              fi

              # Verify this version has no tags (re-fetch to guard against race conditions)
              VERSION_DATA=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$VERSION_ID" \
                2>/dev/null || echo "")

              if [[ -z "$VERSION_DATA" ]]; then
                echo "   ⚠️ Could not fetch data for version $VERSION_ID, skipping"
                continue
              fi

              VERSION_TAGS=$(echo "$VERSION_DATA" | jq -r '.metadata.container.tags[]?' 2>/dev/null || echo "")

              # Skip if any tag is in the protected list
              PROTECTED=false
              while IFS= read -r TAG; do
                [[ -z "$TAG" ]] && continue
                if echo "$PROTECTED_TAGS" | grep -qx "$TAG"; then
                  echo "   🛡️ Skipping protected version $VERSION_ID (tag: $TAG is in IMAGE_VERSIONS.json)"
                  PROTECTED=true
                  break
                fi
              done <<< "$VERSION_TAGS"
              [[ "$PROTECTED" == "true" ]] && continue

              # Double-check: skip if version still has any tags (guard against race condition)
              TAG_COUNT=$(echo "$VERSION_DATA" | jq '.metadata.container.tags | length' 2>/dev/null || echo "1")
              if [[ "$TAG_COUNT" -gt 0 ]]; then
                echo "   🛡️ Skipping version $VERSION_ID — still has $TAG_COUNT tag(s) (race condition guard)"
                continue
              fi

              # Skip if this untagged version is a sub-manifest of a protected tagged image.
              # Multi-platform images reference per-platform manifests by digest; deleting
              # them breaks the parent manifest list even though the parent tag still exists.
              VERSION_DIGEST=$(echo "$VERSION_DATA" | jq -r '.name // empty' 2>/dev/null || echo "")
              if [[ -n "$VERSION_DIGEST" ]] && [[ -n "$PROTECTED_DIGESTS" ]] \
                 && echo "$PROTECTED_DIGESTS" | grep -qx "$VERSION_DIGEST"; then
                echo "   🛡️ Skipping version $VERSION_ID — sub-manifest of protected tag (${VERSION_DIGEST:0:19}...)"
                continue
              fi

              if gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$VERSION_ID" \
                2>/dev/null; then
                TOTAL_DELETED=$((TOTAL_DELETED + 1))
                VERSIONS_TO_DELETE=$((VERSIONS_TO_DELETE + 1))
                echo "   ✓ Deleted image ID: $VERSION_ID"
              else
                echo "   ✗ Failed to delete image ID: $VERSION_ID"
              fi
            done <<< "$OLD_VERSIONS"
          done

          echo ""
          echo "✅ Cleanup completed: $TOTAL_DELETED old untagged images deleted"


  # ============================================================================
  # Job 4: Security scanning with Trivy (CRITICAL and HIGH vulnerabilities)
  # ============================================================================
  security-scan:
    needs: [check-version, image-build-push]
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: |
      always() &&
      (
        needs.check-version.outputs.version_changed == 'true' ||
        needs.check-version.outputs.trivyignore_changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      needs.image-build-push.result == 'success'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync .trivyignore from branch HEAD
        run: |
          # On rerun or when SHA is older than latest push, ensure .trivyignore
          # reflects the current branch HEAD (not the SHA that triggered the run)
          git fetch origin ${{ github.ref_name }} --depth=1
          git checkout origin/${{ github.ref_name }} -- .trivyignore
          echo "Using .trivyignore from origin/${{ github.ref_name }} HEAD"

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        run: |
          # Always use VERSION file (matches tags from build-push job)
          TAG="${{ steps.version.outputs.VERSION }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

      - name: Run Trivy scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Generate vulnerability summary (backend)
        run: |
          echo "## 🔒 Security Scan: Backend" >> $GITHUB_STEP_SUMMARY
          docker run --rm \
            -v ${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --format table \
            --ignorefile /root/.trivyignore \
            ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }} \
            >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Check HIGH/CRITICAL vulnerabilities (backend)
        run: |
          echo "🔍 Checking for HIGH/CRITICAL vulnerabilities in backend image (with .trivyignore exceptions)..."

          # Run Trivy with JSON output to count vulnerabilities (excluding .trivyignore)
          VULN_COUNT=$(docker run --rm \
            -v ${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --format json \
            --quiet \
            --ignorefile /root/.trivyignore \
            ghcr.io/${{ github.repository_owner }}/familybudget-backend:${{ steps.tag.outputs.TAG }} \
            | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length')

          echo "Found $VULN_COUNT HIGH/CRITICAL vulnerabilities (after .trivyignore exclusions)"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::error::❌ Backend image contains $VULN_COUNT HIGH/CRITICAL vulnerabilities (not in .trivyignore) - blocking deployment"
            exit 1
          else
            echo "✅ No HIGH/CRITICAL vulnerabilities found in backend image (after .trivyignore)"
          fi

      - name: Upload Trivy results (backend)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'backend-image'
        continue-on-error: true

      - name: Run Trivy scanner (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }}
          format: 'sarif'
          output: 'trivy-bot.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Generate vulnerability summary (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        run: |
          echo "## 🔒 Security Scan: Bot" >> $GITHUB_STEP_SUMMARY
          docker run --rm \
            -v ${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --format table \
            --ignorefile /root/.trivyignore \
            ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }} \
            >> $GITHUB_STEP_SUMMARY || true
        continue-on-error: true

      - name: Check HIGH/CRITICAL vulnerabilities (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        run: |
          echo "🔍 Checking for HIGH/CRITICAL vulnerabilities in bot image (with .trivyignore exceptions)..."

          # Run Trivy with JSON output to count vulnerabilities (excluding .trivyignore)
          VULN_COUNT=$(docker run --rm \
            -v ${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --format json \
            --quiet \
            --ignorefile /root/.trivyignore \
            ghcr.io/${{ github.repository_owner }}/familybudget-bot:${{ steps.tag.outputs.TAG }} \
            | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length')

          echo "Found $VULN_COUNT HIGH/CRITICAL vulnerabilities (after .trivyignore exclusions)"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::error::❌ Bot image contains $VULN_COUNT HIGH/CRITICAL vulnerabilities (not in .trivyignore) - blocking deployment"
            exit 1
          else
            echo "✅ No HIGH/CRITICAL vulnerabilities found in bot image (after .trivyignore)"
          fi

      - name: Upload Trivy results (bot)
        if: needs.image-build-push.outputs.bot_built == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-bot.sarif'
          category: 'bot-image'
        continue-on-error: true

  # ============================================================================
  # Job 5: Pipeline summary (version, commit, job statuses, Docker image tags)
  # ============================================================================
  summary:
    needs: [check-version, service-build, image-build-push, security-scan, deploy-test, post-deploy-tests, post-deploy-summary]
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: always()
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Query container versions from registry
        id: registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER:    ${{ github.repository_owner }}
        run: |
          # Get the latest semver tag (X.Y.Z) for a container package in ghcr.io
          get_latest_tag() {
            local pkg="$1"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/users/${OWNER}/packages/container/${pkg}/versions?per_page=100" \
              --jq '[
                .[] |
                select(.metadata.container.tags |
                  map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | length > 0
                )
              ] | sort_by(.updated_at) | last |
              .metadata.container.tags[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
              2>/dev/null | head -1 || echo "?"
          }

          echo "backend=$(    get_latest_tag familybudget-backend)"    >> "$GITHUB_OUTPUT"
          echo "bot=$(        get_latest_tag familybudget-bot)"        >> "$GITHUB_OUTPUT"
          echo "redis=$(      get_latest_tag familybudget-redis)"      >> "$GITHUB_OUTPUT"
          echo "postgresql=$( get_latest_tag familybudget-postgresql)" >> "$GITHUB_OUTPUT"

      - name: Compute pipeline status and build Telegram message
        id: msg
        env:
          RESULT_CHECK:    ${{ needs.check-version.result }}
          RESULT_BUILD:    ${{ needs.service-build.result }}
          RESULT_DOCKER:   ${{ needs.image-build-push.result }}
          RESULT_SECURITY: ${{ needs.security-scan.result }}
          RESULT_DEPLOY:   ${{ needs.deploy-test.result }}
          RESULT_TESTS:    ${{ needs.post-deploy-tests.result }}
          BUILT_BACKEND:   ${{ needs.image-build-push.outputs.backend_built }}
          BUILT_BOT:       ${{ needs.image-build-push.outputs.bot_built }}
          BUILT_REDIS:     ${{ needs.image-build-push.outputs.redis_built }}
          BUILT_PG:        ${{ needs.image-build-push.outputs.postgresql_built }}
          VER_BACKEND:     ${{ steps.registry.outputs.backend }}
          VER_BOT:         ${{ steps.registry.outputs.bot }}
          VER_REDIS:       ${{ steps.registry.outputs.redis }}
          VER_PG:          ${{ steps.registry.outputs.postgresql }}
          BRANCH:          ${{ github.ref_name }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VERSION=$(cat VERSION)

          # Commit subject (first line only — avoid multi-line commit messages)
          COMMIT=$(git log -1 --pretty=format:"%s")

          # Overall status:
          # - any failure  → ❌ Pipeline Failed
          # - build jobs all skipped (no VERSION change) → ⏭ Pipeline Skipped
          # - otherwise    → ✅ Pipeline Completed
          if [[ "$RESULT_BUILD" == "failure" || "$RESULT_DOCKER" == "failure" ||
                "$RESULT_SECURITY" == "failure" || "$RESULT_DEPLOY" == "failure" ||
                "$RESULT_TESTS" == "failure" ]]; then
            OVERALL="❌ Pipeline Failed"
          elif [[ "$RESULT_BUILD" == "skipped" && "$RESULT_DOCKER" == "skipped" &&
                  "$RESULT_SECURITY" == "skipped" && "$RESULT_DEPLOY" == "skipped" ]]; then
            OVERALL="⏭ Pipeline Skipped (no VERSION change)"
          else
            OVERALL="✅ Pipeline Completed"
          fi

          # Job status icon helper
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              skipped)   echo "⏭" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          # Container line: ✅ name:ver (new) OR ✅ name:ver (current) OR ⏭ name:ver
          # Show ✅ current only when Docker Images job actually ran (not skipped)
          c_line() {
            local name="$1" built="$2" ver="$3"
            if [[ "$built" == "true" ]]; then
              echo "✅ ${name}:${ver} (new)"
            elif [[ "$RESULT_DOCKER" == "success" && "$ver" == "$VERSION" ]]; then
              echo "✅ ${name}:${ver}"
            else
              echo "⏭ ${name}:${ver}"
            fi
          }

          # Build multi-line GITHUB_OUTPUT value
          {
            echo 'message<<TEOF'
            echo "$OVERALL"
            echo ""
            echo "v${VERSION} · ${BRANCH}"
            echo "${COMMIT}"
            echo ""
            echo "Jobs:"
            echo "$(icon "$RESULT_CHECK")  Version Check"
            echo "$(icon "$RESULT_BUILD")  Frontend Build"
            echo "$(icon "$RESULT_DOCKER")  Docker Images"
            echo "$(icon "$RESULT_SECURITY")  Security Scan"
            echo "$(icon "$RESULT_DEPLOY")  Deploy → fbd.ikeniborn.ru"
            echo "$(icon "$RESULT_TESTS")  Post-Deploy Tests"
            echo ""
            echo "Containers:"
            echo "$(c_line backend    "$BUILT_BACKEND" "$VER_BACKEND")"
            echo "$(c_line bot        "$BUILT_BOT"     "$VER_BOT")"
            echo "$(c_line redis      "$BUILT_REDIS"   "$VER_REDIS")"
            echo "$(c_line postgresql "$BUILT_PG"      "$VER_PG")"
            echo ""
            echo "Logs: ${RUN_URL}"
            echo 'TEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create summary (markdown)
        env:
          RESULT_CHECK:    ${{ needs.check-version.result }}
          RESULT_BUILD:    ${{ needs.service-build.result }}
          RESULT_DOCKER:   ${{ needs.image-build-push.result }}
          RESULT_SECURITY: ${{ needs.security-scan.result }}
          RESULT_DEPLOY:   ${{ needs.deploy-test.result }}
          RESULT_TESTS:    ${{ needs.post-deploy-tests.result }}
          BUILT_BACKEND:   ${{ needs.image-build-push.outputs.backend_built }}
          BUILT_BOT:       ${{ needs.image-build-push.outputs.bot_built }}
          BUILT_REDIS:     ${{ needs.image-build-push.outputs.redis_built }}
          BUILT_PG:        ${{ needs.image-build-push.outputs.postgresql_built }}
          VER_BACKEND:     ${{ steps.registry.outputs.backend }}
          VER_BOT:         ${{ steps.registry.outputs.bot }}
          VER_REDIS:       ${{ steps.registry.outputs.redis }}
          VER_PG:          ${{ steps.registry.outputs.postgresql }}
        run: |
          VERSION=$(cat VERSION)

          icon_md() {
            case "$1" in
              success)   echo "✅" ;;
              skipped)   echo "⏭" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          c_md() {
            local name="$1" built="$2" ver="$3"
            if [[ "$built" == "true" ]]; then
              echo "| ${name} | \`${ver}\` | ✅ updated |"
            elif [[ "$RESULT_DOCKER" == "success" && "$ver" == "$VERSION" ]]; then
              echo "| ${name} | \`${ver}\` | ✅ current |"
            else
              echo "| ${name} | \`${ver}\` | ⏭ unchanged |"
            fi
          }

          {
            echo "## 🚀 CI/CD Pipeline Summary"
            echo ""
            echo "**Version:** \`${VERSION}\`  |  **Branch:** \`${{ github.ref_name }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "### Job Status"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Version Check     | $(icon_md "$RESULT_CHECK")  \`${RESULT_CHECK}\` |"
            echo "| Frontend Build    | $(icon_md "$RESULT_BUILD")  \`${RESULT_BUILD}\` |"
            echo "| Docker Images     | $(icon_md "$RESULT_DOCKER")  \`${RESULT_DOCKER}\` |"
            echo "| Security Scan     | $(icon_md "$RESULT_SECURITY")  \`${RESULT_SECURITY}\` |"
            echo "| Deploy Test       | $(icon_md "$RESULT_DEPLOY")  \`${RESULT_DEPLOY}\` |"
            echo "| Post-Deploy Tests | $(icon_md "$RESULT_TESTS")  \`${RESULT_TESTS}\` |"
            echo ""
            echo "### Container Versions (from ghcr.io)"
            echo "| Image | Version | Status |"
            echo "|-------|---------|--------|"
            echo "$(c_md backend    "$BUILT_BACKEND" "$VER_BACKEND")"
            echo "$(c_md bot        "$BUILT_BOT"     "$VER_BOT")"
            echo "$(c_md redis      "$BUILT_REDIS"   "$VER_REDIS")"
            echo "$(c_md postgresql "$BUILT_PG"      "$VER_PG")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify pipeline summary (Telegram)
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          message: ${{ steps.msg.outputs.message }}

  # ============================================================================
  # Job 6: Deploy to test server (only for test branch)
  # ============================================================================
  deploy-test:
    name: deploy-test
    needs: [check-version, image-build-push, security-scan]
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    if: |
      always() &&
      github.ref_name == 'test' &&
      (needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.image-build-push.result == 'success' &&
      needs.security-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_SSH_PORT }}
          script: |
            echo "🚀 Starting deployment to budget-test..."

            # Navigate to project repository
            cd ~/familyBudget

            # Pull latest code from test branch
            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout test
            git pull origin test

            # CRITICAL: Wait for IMAGE_VERSIONS.json commit to propagate
            # Race condition: image-build-push may still be pushing the commit
            echo "⏳ Waiting for IMAGE_VERSIONS.json commit to propagate (10s)..."
            sleep 10

            # Pull again to ensure we have the latest IMAGE_VERSIONS.json
            echo "📥 Pulling IMAGE_VERSIONS.json updates..."
            git pull origin test

            # Run deploy script in registry mode
            # CRITICAL: Check exit code to catch deployment failures (sync errors, etc.)
            echo "🐳 Pulling Docker images and restarting containers..."
            if ! sudo bash deploy.sh --use-registry --sync-mode update --cleanup-mode smart; then
              echo "❌ Deployment failed! Check logs for details."
              exit 1
            fi

            # Wait for services to start
            echo "⏳ Waiting for services to initialize (30s)..."
            sleep 30

            # Verify deployment
            echo "✅ Checking container health..."
            sudo docker-compose ps

            # Check backend health endpoint
            echo "🏥 Checking backend health..."
            curl -f http://localhost:8000/health || exit 1

            # Check public HTTP entrypoint response
            echo "🌐 Checking public HTTP entrypoint..."
            curl -f http://localhost:80 || exit 1

            echo "✅ Deployment completed successfully!"

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Successfully deployed to test server (budget-test)" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: https://fbd.ikeniborn.ru/" >> $GITHUB_STEP_SUMMARY
          echo "📦 Version: $(cat VERSION)" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment to test server failed" >> $GITHUB_STEP_SUMMARY
          echo "📋 Check logs for details" >> $GITHUB_STEP_SUMMARY


  # ============================================================================
  # Job 7: Post-Deploy Tests (AUTOMATIC validation after deployment)
  # ============================================================================
  post-deploy-tests:
    name: Post-Deploy Tests (${{ matrix.test-suite }})
    needs: [deploy-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      always() &&
      needs.deploy-test.result == 'success'

    strategy:
      matrix:
        test-suite: [frontend, backend]
      fail-fast: false  # Continue all tests even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================================
      # SSH Setup (for backend tests)
      # ============================================================================
      - name: Setup SSH for backend tests
        if: matrix.test-suite == 'backend'
        env:
          SSH_HOST: ${{ secrets.TEST_SERVER_HOST }}
          SSH_USER: ${{ secrets.TEST_SERVER_USER }}
          SSH_PORT: ${{ secrets.TEST_SERVER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Add test server to known_hosts
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          # Create SSH config
          cat >> ~/.ssh/config << EOF
          Host budget-test
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF

      # ============================================================================
      # Frontend Tests (Vitest unit/integration)
      # ============================================================================
      - name: Setup Node.js (frontend tests)
        if: matrix.test-suite == 'frontend'
        uses: ./.github/actions/setup-node

      - name: Install dependencies (frontend tests)
        if: matrix.test-suite == 'frontend'
        run: npm ci

      - name: Run frontend tests
        if: matrix.test-suite == 'frontend'
        env:
          VITE_API_URL: https://fbd.ikeniborn.ru
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: matrix.test-suite == 'frontend' && always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-post-deploy
          path: coverage/
          retention-days: 7

      # ============================================================================
      # Backend Tests (pytest via SSH)
      # ============================================================================
      - name: Run backend tests on test server
        if: matrix.test-suite == 'backend'
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: |
          ssh budget-test "bash -s" << 'EOF'
            set -e
            cd ~/familyBudget

            # Pull latest changes and checkout specific commit
            git fetch origin
            git checkout ${{ github.sha }}

            # Build DATABASE_URL with localhost (tests run on host, not inside Docker network)
            # All secrets passed via GitHub Actions expression expansion inside the heredoc
            export DATABASE_URL="postgresql+asyncpg://familybudget:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5432/familybudget"
            export JWT_SECRET="${{ secrets.TEST_JWT_SECRET }}"
            export TELEGRAM_BOT_TOKEN="${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}"
            export ADMIN_TELEGRAM_ID="${{ secrets.TEST_ADMIN_TELEGRAM_ID }}"
            export API_INTERNAL_KEY="${{ secrets.TEST_API_INTERNAL_KEY }}"
            export CORS_ORIGINS="${{ secrets.TEST_CORS_ORIGINS }}"

            # ================================================================
            # PRE-TEST BACKUP: Snapshot live DB before pytest can modify it
            # ================================================================
            # pytest conftest._clean_database_before_session (autouse, session scope)
            # runs DELETE across all 37 tables before any test starts.
            # --clean --if-exists добавляет DROP TABLE IF EXISTS перед каждым CREATE,
            # что гарантирует чистое восстановление без конфликтов дубликатов.
            BACKUP_FILE="/tmp/pre_test_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "Creating pre-test database backup: $BACKUP_FILE"
            sudo docker compose -f /opt/budget/docker-compose.yml exec -T postgres \
              pg_dump --clean --if-exists -U familybudget familybudget > "$BACKUP_FILE"
            BACKUP_SIZE=$(wc -c < "$BACKUP_FILE")
            echo "Backup created: ${BACKUP_SIZE} bytes"
            if [ "$BACKUP_SIZE" -lt 1000 ]; then
              echo "ERROR: Backup file is suspiciously small (${BACKUP_SIZE} bytes), aborting"
              exit 1
            fi

            # Register restore trap: runs on EXIT (success AND failure AND SIGTERM)
            # --clean в дампе гарантирует: DROP TABLE IF EXISTS → CREATE TABLE → INSERT
            # то есть полное восстановление без ошибок дубликатов
            restore_database() {
              local EXIT_CODE=$?
              echo "=== POST-TEST RESTORE (exit code: ${EXIT_CODE}) ==="
              echo "Restoring database from backup: $BACKUP_FILE"
              # Отключаем все активные соединения с БД перед восстановлением
              sudo docker compose -f /opt/budget/docker-compose.yml exec -T postgres \
                psql -U familybudget -d postgres -c \
                "SELECT pg_terminate_backend(pid) FROM pg_stat_activity \
                 WHERE datname='familybudget' AND pid <> pg_backend_pid();" \
                2>/dev/null || true
              # Восстанавливаем: DROP TABLE IF EXISTS + CREATE TABLE + INSERT (из --clean дампа)
              sudo docker compose -f /opt/budget/docker-compose.yml exec -T postgres \
                psql -U familybudget familybudget < "$BACKUP_FILE"
              echo "Database restored successfully"
              rm -f "$BACKUP_FILE"
              echo "Backup file removed"
              echo "=== RESTORE COMPLETE ==="
            }
            trap restore_database EXIT

            # ================================================================
            # Apply migrations (idempotent — deployment already ran them)
            # ================================================================
            backend/.venv/bin/alembic -c backend/db/migrations/alembic.ini upgrade head

            # ================================================================
            # Run pytest — non-destructive only (-m "not destructive")
            # ================================================================
            # SAFETY: -m "not e2e and not destructive" prevents tests that
            # permanently DELETE/MODIFY real data from running against live DB.
            # DB is backed up above and restored via EXIT trap after this block.
            cd backend
            export ENVIRONMENT="test"
            export PYTHONPATH="/home/ikeniborn/familyBudget"

            .venv/bin/pytest tests/ \
              -m "not e2e and not destructive" \
              --maxfail=5 \
              -v \
              --tb=short
          EOF

  # ============================================================================
  # Job 8: Post-Deploy Summary
  # ============================================================================
  post-deploy-summary:
    name: Post-Deploy Summary
    needs: [post-deploy-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Post-Deploy Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** https://fbd.ikeniborn.ru/" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.post-deploy-tests.result }}" == "success" ]; then
            echo "### ✅ All Test Suites Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some Test Suites Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suites (parallel execution):**" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** Vitest unit/integration tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** pytest read-only mode (via SSH to test server)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 E2E tests (Playwright) run separately — trigger manually via [e2e-tests workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/e2e-tests.yml)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View individual test suite results:**" >> $GITHUB_STEP_SUMMARY
          echo "[Post-Deploy Tests job logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data Safety:** Backend tests run with \`-m 'not e2e and not destructive'\` filter. DB is snapshotted via pg_dump before tests and restored via EXIT trap after — even on test failure." >> $GITHUB_STEP_SUMMARY
