name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, nodejs ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-frontend:
    name: Test Frontend (SvelteKit)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend-svelte/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend-svelte
      run: npm ci
    
    - name: Run linter
      working-directory: ./frontend-svelte
      run: npm run lint || true  # Allow lint failures for now
    
    - name: Type checking
      working-directory: ./frontend-svelte
      run: npm run check
    
    - name: Run tests
      working-directory: ./frontend-svelte
      run: npm run test:run
    
    - name: Build
      working-directory: ./frontend-svelte
      run: npm run build
    
    - name: Upload coverage
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage-report
        path: frontend-svelte/coverage

  test-backend-fastapi:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./backend-fastapi
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run linter (flake8)
      working-directory: ./backend-fastapi
      run: flake8 app/ --max-line-length=120 --exclude=__pycache__ || true
    
    - name: Run type checking (mypy)
      working-directory: ./backend-fastapi
      run: mypy app/ || true
    
    - name: Run tests
      working-directory: ./backend-fastapi
      env:
        DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379
        SESSION_SECRET: test-secret-key
        TELEGRAM_BOT_TOKEN: test-token
      run: pytest --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage-report
        path: backend-fastapi/htmlcov

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend-fastapi]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-svelte
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-fastapi
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - name: Deploy to server
      run: |
        echo "Deployment step would go here"
        # Add actual deployment commands (SSH, kubectl, etc.)