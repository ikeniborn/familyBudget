name: Deploy to Test Server

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  deploy-test:
    name: Deploy to budget-test
    runs-on: ubuntu-latest
    needs: build-and-push  # Wait for Docker images to be built and pushed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for build completion
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'build-and-push'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_SSH_PORT }}
          script: |
            echo "🚀 Starting deployment to budget-test..."

            # Navigate to project directory
            cd /opt/budget

            # Pull latest code from test branch
            echo "📥 Pulling latest code..."
            sudo git fetch origin
            sudo git checkout test
            sudo git pull origin test

            # Run deploy script in registry mode
            echo "🐳 Pulling Docker images and restarting containers..."
            sudo bash scripts/deploy.sh --mode registry

            # Wait for services to start
            echo "⏳ Waiting for services to initialize (30s)..."
            sleep 30

            # Verify deployment
            echo "✅ Checking container health..."
            sudo docker-compose ps

            # Check backend health endpoint
            echo "🏥 Checking backend health..."
            curl -f http://localhost:8000/health || exit 1

            # Check nginx response
            echo "🌐 Checking nginx..."
            curl -f http://localhost:80 || exit 1

            echo "✅ Deployment completed successfully!"

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "✅ Successfully deployed to test server (budget-test)"
          echo "🌐 URL: https://fbd.ikeniborn.ru/"
          echo "📦 Version: $(grep -oP '(?<=VERSION=).*' VERSION || echo 'unknown')"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "❌ Deployment to test server failed"
          echo "📋 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
