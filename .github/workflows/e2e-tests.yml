name: E2E Tests

on:
  pull_request:
    branches:
      - main  # Only run E2E tests for test → prod (main)
    paths:
      - 'frontend/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (chromium/firefox/webkit/all)'
        required: false
        default: 'chromium'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ${{ github.event.inputs.runner_type || 'self-hosted' }}
    timeout-minutes: 15
    # Only run if PR is from test branch to main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'test' && github.base_ref == 'main')

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: ./.github/actions/setup-node

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          # Install chromium for setup project (always needed for auth)
          npx playwright install --with-deps chromium
          # Install test browser if different from chromium
          if [ "${{ matrix.browser }}" != "chromium" ]; then
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Verify Playwright installation
        run: npx playwright --version

      - name: Run E2E tests (against test server)
        env:
          CI: true
          BASE_URL: https://fbd.ikeniborn.ru
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          echo "Running E2E tests against https://fbd.ikeniborn.ru"
          npx playwright test --project="${{ matrix.browser }}" --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
