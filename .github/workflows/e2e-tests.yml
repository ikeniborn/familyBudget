name: E2E Tests

on:
  push:
    branches:
      - main
      - test
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (chromium/firefox/webkit/all)'
        required: false
        default: 'chromium'

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familybudget_test
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build frontend
        run: |
          npm run build:css
          npm run bundle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
        run: |
          alembic -c backend/db/migrations/alembic.ini upgrade head

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8000
          POSTGRES_HOST: localhost
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          REDIS_ENABLED: true
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_for_ci_only
          SECRET_KEY: test_secret_key_for_ci_only
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8000
          PYTHONPATH: ${{ github.workspace }}
        run: |
          npx playwright test --project="${{ matrix.browser }}" --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
