name: PR Quality Checks

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'bot/**'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'docker-compose*.yml'
      - '**/Dockerfile'
      - '.env.example'
      - '.github/workflows/**'
      - '!docs/**'
      - '!**.md'
      - '!.claude/**'
      - '!README.md'

# Allow only one workflow run per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Frontend Checks (Consolidated from frontend-tests.yml)
  # ============================================================================
  frontend-quality:
    name: Frontend Quality & Tests
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build CSS
        run: npm run build:css

      - name: Bundle JavaScript
        run: npm run bundle

      - name: Verify bundle sizes
        run: |
          if [ -f "frontend/web/static/js/dist/bundle.js" ]; then
            MAIN_SIZE=$(stat -c%s frontend/web/static/js/dist/bundle.js)
            MAX_SIZE=500000  # 500KB

            echo "Main bundle size: $MAIN_SIZE bytes (max: $MAX_SIZE bytes)"

            if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
              echo "❌ Main bundle too large: $MAIN_SIZE bytes (max $MAX_SIZE bytes / 500KB)"
              exit 1
            fi

            echo "✅ Bundle size OK"
          else
            echo "⚠️  Bundle file not found, skipping size check"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/web/static/css/output.css
            frontend/web/static/js/dist/
          retention-days: 7

      # Runtime tests removed - moved to post-deploy workflow (automatic after deployment)
      # This allows faster PR feedback while ensuring deployed code is validated

  # ============================================================================
  # Backend Checks
  # ============================================================================
  backend-quality:
    name: Backend Quality Checks
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (for type checking)
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install quality tools
        run: pip install mypy ruff

      - name: Python mypy type check
        run: |
          python -m mypy backend/app/ \
            --config-file=pyproject.toml \
            --explicit-package-bases \
            --namespace-packages
        continue-on-error: true  # Allow merge while fixing 20+ existing type errors

      - name: Python ruff lint
        run: ruff check backend/

  # ============================================================================
  # Backend Integration Tests (NOT E2E)
  # ============================================================================
  backend-tests:
    name: Backend Integration Tests
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
          POSTGRES_DB: familybudget_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5433/familybudget_test
        run: |
          alembic -c backend/db/migrations/alembic.ini upgrade head

      - name: Run backend integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5433/familybudget_test
        run: |
          pytest tests/integration/backend/ -v --tb=short

      # E2E tests excluded - run in post-deploy workflow after deployment to https://fbd.ikeniborn.ru/
      # E2E requires deployed application to test against

  # ============================================================================
  # PR Summary
  # ============================================================================
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality, backend-tests]
    if: always()

    steps:
      - name: Generate PR Summary
        run: |
          echo "## ✅ PR Quality Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Test Strategy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR Checks (Pre-Merge):**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting & Formatting (ESLint, mypy, ruff)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend Integration Tests (pytest with PostgreSQL)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build Verification (CSS, JS bundling)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Post-Deploy Checks (After Deployment):**" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 E2E Tests (Playwright against https://fbd.ikeniborn.ru/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Frontend Unit Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rationale:** E2E tests require deployed code on test server, so they run post-deploy." >> $GITHUB_STEP_SUMMARY
