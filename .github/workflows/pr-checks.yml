name: PR Quality Checks

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'bot/**'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'docker-compose*.yml'
      - '**/Dockerfile'
      - '.env.example'
      - '.github/workflows/**'
      - '!docs/**'
      - '!**.md'
      - '!.claude/**'
      - '!README.md'

# Allow only one workflow run per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Frontend Checks (Consolidated from frontend-tests.yml)
  # ============================================================================
  frontend-quality:
    name: Frontend Quality & Tests
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm ci

      # TypeScript type check (REMOVED - already in pre-commit hook)
      # Kept in CI only as safety net if pre-commit bypassed
      - name: TypeScript type check (safety net)
        run: npm run type-check
        continue-on-error: false

      - name: ESLint
        run: npm run lint

      - name: Build CSS
        run: npm run build:css

      - name: Bundle JavaScript
        run: npm run bundle

      - name: Verify bundle sizes
        run: |
          if [ -f "frontend/web/static/js/dist/bundle.js" ]; then
            MAIN_SIZE=$(stat -c%s frontend/web/static/js/dist/bundle.js)
            MAX_SIZE=500000  # 500KB

            echo "Main bundle size: $MAIN_SIZE bytes (max: $MAX_SIZE bytes)"

            if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
              echo "❌ Main bundle too large: $MAIN_SIZE bytes (max $MAX_SIZE bytes / 500KB)"
              exit 1
            fi

            echo "✅ Bundle size OK"
          else
            echo "⚠️  Bundle file not found, skipping size check"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/web/static/css/output.css
            frontend/web/static/js/dist/
          retention-days: 7

      # Unit tests with coverage (SINGLE SOURCE OF TRUTH)
      - name: Unit & Integration Tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage thresholds
        run: |
          LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
          BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
          STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)

          # Thresholds from vitest.config.ts
          # LOWERED: After PGlite removal, will raise incrementally
          LINES_THRESHOLD=4.0
          FUNCTIONS_THRESHOLD=32.0
          BRANCHES_THRESHOLD=60.0
          STATEMENTS_THRESHOLD=4.0

          echo "Coverage Report:"
          echo "  Lines: $LINES% (threshold: $LINES_THRESHOLD%)"
          echo "  Functions: $FUNCTIONS% (threshold: $FUNCTIONS_THRESHOLD%)"
          echo "  Branches: $BRANCHES% (threshold: $BRANCHES_THRESHOLD%)"
          echo "  Statements: $STATEMENTS% (threshold: $STATEMENTS_THRESHOLD%)"

          FAIL=0

          if awk -v a="$LINES" -v b="$LINES_THRESHOLD" 'BEGIN {exit (a >= b)}'; then
            echo "❌ Lines coverage $LINES% is below $LINES_THRESHOLD% threshold"
            FAIL=1
          fi

          if awk -v a="$FUNCTIONS" -v b="$FUNCTIONS_THRESHOLD" 'BEGIN {exit (a >= b)}'; then
            echo "❌ Functions coverage $FUNCTIONS% is below $FUNCTIONS_THRESHOLD% threshold"
            FAIL=1
          fi

          if awk -v a="$BRANCHES" -v b="$BRANCHES_THRESHOLD" 'BEGIN {exit (a >= b)}'; then
            echo "❌ Branches coverage $BRANCHES% is below $BRANCHES_THRESHOLD% threshold"
            FAIL=1
          fi

          if awk -v a="$STATEMENTS" -v b="$STATEMENTS_THRESHOLD" 'BEGIN {exit (a >= b)}'; then
            echo "❌ Statements coverage $STATEMENTS% is below $STATEMENTS_THRESHOLD% threshold"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then
            exit 1
          fi

          echo "✅ All coverage thresholds met"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================================
  # Backend Checks
  # ============================================================================
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: familybudget_test
          POSTGRES_USER: familybudget
          POSTGRES_PASSWORD: test_password_12345678901234567890
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -c max_locks_per_transaction=256

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test services
        uses: ./.github/actions/setup-test-services
        with:
          postgres-password: test_password_12345678901234567890

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
          database-url: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test

      - name: Install quality tools
        run: pip install mypy ruff

      - name: Python mypy type check
        run: mypy backend/ || true
        continue-on-error: true

      - name: Python ruff lint
        run: ruff check backend/

      - name: Backend unit tests
        env:
          POSTGRES_HOST: localhost
          TEST_DATABASE_URL: postgresql+asyncpg://familybudget:test_password_12345678901234567890@localhost:5432/familybudget_test
          REDIS_ENABLED: true
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_for_ci_only_do_not_use_in_production
          SECRET_KEY: test_secret_key_for_ci_only_do_not_use_in_production
          TELEGRAM_BOT_TOKEN: test_bot_token_for_ci_only
          ADMIN_TELEGRAM_ID: 123456789
          API_INTERNAL_KEY: test_internal_key_for_ci_only
          CORS_ORIGINS: http://localhost:8000
        run: pytest tests/unit/ --cov --cov-report=xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================================
  # PR Summary
  # ============================================================================
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality]
    if: always()

    steps:
      - name: Generate PR Summary
        run: |
          echo "## ✅ PR Quality Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Optimization Notes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Type check: Run in pre-commit hook (local)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Unit tests: Run once in CI with full coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ console.log check: Run in pre-commit hook (local)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time saved:** ~7 minutes per PR (eliminated test duplication)" >> $GITHUB_STEP_SUMMARY
