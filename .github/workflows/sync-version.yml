name: Sync Version Files

on:
  push:
    branches: [test, main]
    paths:
      - 'VERSION'

# Prevent concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-version:
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci] to prevent loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current VERSION: $VERSION"

      - name: Check if VERSION changed
        id: check
        run: |
          if git diff HEAD~1 HEAD -- VERSION | grep -q "^[+-][0-9]"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ VERSION changed in this push"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⚠ VERSION not changed, skipping sync"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update package.json version
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Updating package.json to version $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Update package-lock.json version
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Updating package-lock.json to version $VERSION"
          # Update root version
          jq --arg v "$VERSION" '.version = $v' package-lock.json > package-lock.json.tmp
          # Update packages."" version (root package reference)
          jq --arg v "$VERSION" '.packages."".version = $v' package-lock.json.tmp > package-lock.json
          rm package-lock.json.tmp

      - name: Check for changes
        id: git_status
        if: steps.check.outputs.changed == 'true'
        run: |
          git diff --quiet package.json package-lock.json || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true' && steps.git_status.outputs.has_changes == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: auto-sync package.json and package-lock.json to version $VERSION [skip ci]"
          git push

      - name: Summary
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "✅ Version files synchronized to $VERSION"
          if [[ "${{ steps.git_status.outputs.has_changes }}" == "true" ]]; then
            echo "📝 Created commit with updated package.json and package-lock.json"
          else
            echo "ℹ️ No changes needed (files already in sync)"
          fi
