name: Test Suite

on:
  push:
    branches: [ master, develop, nodejs ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: budgetdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend-fastapi/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: ./backend-fastapi
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest-cov
    
    - name: Run linting
      working-directory: ./backend-fastapi
      run: |
        pip install black flake8 mypy
        black --check app/ tests/
        flake8 app/ tests/ --max-line-length=100
        mypy app/ --ignore-missing-imports
    
    - name: Run tests with coverage
      working-directory: ./backend-fastapi
      env:
        DATABASE_URL: "postgresql+asyncpg://budget:testpassword@localhost:5432/budgetdb_test"
        REDIS_URL: "redis://localhost:6379/0"
        SESSION_SECRET: "test-secret-key"
        ENVIRONMENT: "test"
        PASSWORD_AUTH_ENABLED: "true"
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload backend coverage
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: backend-fastapi/htmlcov/

  frontend-tests:
    name: Frontend Tests (SvelteKit)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Cache npm dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend-svelte/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: ./frontend-svelte
      run: npm ci
    
    - name: Run linting
      working-directory: ./frontend-svelte
      run: |
        npm run lint
        npm run check
    
    - name: Run tests with coverage
      working-directory: ./frontend-svelte
      run: npm run test:coverage
    
    - name: Build application
      working-directory: ./frontend-svelte
      run: npm run build
    
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: frontend-svelte/coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: budgetdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install backend dependencies
      working-directory: ./backend-fastapi
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Install frontend dependencies
      working-directory: ./frontend-svelte
      run: npm ci
    
    - name: Run database migrations
      working-directory: ./backend-fastapi
      env:
        DATABASE_URL: "postgresql+asyncpg://budget:testpassword@localhost:5432/budgetdb"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        alembic upgrade head
    
    - name: Start backend server
      working-directory: ./backend-fastapi
      env:
        DATABASE_URL: "postgresql+asyncpg://budget:testpassword@localhost:5432/budgetdb"
        REDIS_URL: "redis://localhost:6379/0"
        SESSION_SECRET: "test-secret-key"
        ENVIRONMENT: "test"
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 4000 &
        sleep 5
    
    - name: Run integration tests
      working-directory: ./backend-fastapi
      env:
        DATABASE_URL: "postgresql+asyncpg://budget:testpassword@localhost:5432/budgetdb"
        REDIS_URL: "redis://localhost:6379/0"
        SESSION_SECRET: "test-secret-key"
        API_URL: "http://localhost:4000"
      run: |
        pytest tests/test_integration.py -v

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build backend image
      run: |
        docker build -t budget-backend:test ./backend-fastapi
    
    - name: Build frontend image
      run: |
        docker build -t budget-frontend:test ./frontend-svelte
    
    - name: Test Docker Compose
      run: |
        docker-compose -f docker-compose.yml config
        docker-compose -f docker-compose.yml build

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download backend coverage
      uses: actions/download-artifact@v3
      with:
        name: backend-coverage
        path: ./coverage/backend
    
    - name: Download frontend coverage
      uses: actions/download-artifact@v3
      with:
        name: frontend-coverage
        path: ./coverage/frontend
    
    - name: Generate combined report
      run: |
        echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Backend Coverage" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
        echo "Coverage report available in artifacts" >> $GITHUB_STEP_SUMMARY
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = 'Coverage reports have been generated and are available in the workflow artifacts.';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: coverage
          });

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests, docker-build]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.backend-tests.result }}" != "success" ] || \
           [ "${{ needs.frontend-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "Some tests failed!"
          exit 1
        fi
        echo "All tests passed!"