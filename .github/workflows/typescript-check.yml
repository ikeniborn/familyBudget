name: TypeScript Type Check

on:
  pull_request:
    branches: [ test ]
    paths:
      - '**.ts'
      - 'frontend/**/*.ts'
      - 'tsconfig.json'
      - 'package.json'
      - '.github/workflows/typescript-check.yml'
      - '!docs/**'
      - '!**.md'

permissions:
  contents: read  # Для checkout

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --production=false

      - name: Run TypeScript type check
        run: |
          npm run type-check
        continue-on-error: true
        id: typecheck

      - name: Count TypeScript errors
        if: always()
        run: |
          ERROR_COUNT=$(npm run type-check 2>&1 | grep -c "error TS" || echo "0")
          echo "## TypeScript Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -eq "0" ]; then
            echo "✅ **No TypeScript errors found!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "⚠️ **Found $ERROR_COUNT TypeScript errors**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These are non-critical warnings that don't block deployment." >> $GITHUB_STEP_SUMMARY
            echo "Production builds use \`npm run build:prod\` which skips type-check." >> $GITHUB_STEP_SUMMARY

            # Show error breakdown by type
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Error Breakdown by Type" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            npm run type-check 2>&1 | grep "error TS" | sed 's/.*error //' | sed 's/:.*//' | sort | uniq -c | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            # Show error breakdown by file
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Error Breakdown by File" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            npm run type-check 2>&1 | grep "error TS" | awk -F: '{print $1}' | sort | uniq -c | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            exit 0
          fi
