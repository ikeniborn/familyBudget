    <div id="userForm">

        <div class="input-group">
          <div class="input-group-prepend"></div>
          <input type="text" class="form-control" id="dateFrom" placeholder="yyyy-mm-dd" required>
        </div>
      </div>

      <!-- start field -->

        <div class="input-group">
          <div class="input-group-prepend"></div>
          <input type="text" class="form-control" id="dateTo" placeholder="yyyy-mm-dd">
        </div>
      </div>

      <!-- start field -->
      <div class="form-group">
        <label for="invoiceNumber">* Токен A</label>
        <div class="input-group">
          <div class="input-group-prepend"></div>
          <input type="text" class="form-control" id="tokenA">
        </div>
      </div>
      <!-- end field -->
      <!-- start field -->
      <div class="form-group">
        <label for="invoiceNumber">* Токен B</label>
        <div class="input-group">
          <div class="input-group-prepend"></div>
          <input type="text" class="form-control" id="tokenB">
        </div>
      </div>
      <!-- end field -->

      <p></p>
      <button class="btn btn-warning" id="loadButton">Загрузить цены</button>
      <p></p>
      <button class="btn btn-warning" id="calculateButton">Рассчитать новый канал</button>

    </div>
    <!-- end userForm -->
  </div>

  <script>

    function afterEndLoad(e) {
      new Promise(resolve => {
        google.script.run.showAlert('Load complete.')
        resolve()
      })
    }

    function afterEndLoadError() {
      google.script.run.showAlert('Load failed!')
    }

    function afterLoadClicked() {
      if (validate()) {
        google.script.run.showToast('Start load...', 'Process')
        const tokenA = document.getElementById('tokenA').value
        const tokenB = document.getElementById('tokenB').value
        const dateFrom = document.getElementById('dateFrom').value
        const dateTo = document.getElementById('dateTo').value
        google.script.run.withSuccessHandler(afterEndLoad).withFailureHandler(afterEndLoadError).updateHistory(dateFrom, dateTo, tokenA, tokenB, void 0)
      }
      // } else {
      // $('#errorNotification').toast('show')
      // }
    }

    function afterEndCalculate(e) {
      new Promise(resolve => {
        google.script.run.showAlert('Calculate complete.')
        resolve()
      })
    }

    function afterEndCalculateError() {
      google.script.run.showAlert('Calculate failed!')
    }

    function afterCalculateClicked() {
      if (validate()) {
        google.script.run.showToast('Start calculate...', 'Process')
        const dateFrom = document.getElementById('dateFrom').value
        const dateTo = document.getElementById('dateTo').value
        const tokenA = document.getElementById('tokenA').value
        const tokenB = document.getElementById('tokenB').value
        google.script.run.withSuccessHandler(afterEndCalculate).withFailureHandler(afterEndCalculateError).calculateCoef(dateFrom, dateTo, tokenA, tokenB, void 0)
      }
      // else {
      // $('#errorNotification').toast('show')
      // }
    }


    function afterSubmit(e) {
      clearFields(['dateFrom', 'dateTo'])
      // $('#successNotification').toast('show');
      // updateQtyOnHand();
    }

    function clearFields(fields) {
      fields.forEach((field) => {
        const el = document.getElementById(field)
        // if (el.type === "checkbox") {
        //   $('#' + el.id).bootstrapToggle('off')
        // } else {
        el.value = ''
        // };
      })
    }

    function validate() {
      const fieldsToValidate = document.querySelectorAll('#userForm input')
      Array.prototype.forEach.call(fieldsToValidate, function (el) {
        if (el.checkValidity()) {
          el.classList.remove('is-invalid')
        } else {
          el.classList.add('is-invalid')
        }
      })
      return Array.prototype.every.call(fieldsToValidate, function (el) {
        return el.checkValidity()
      })
    }

    // function afterSidebarLoads() {
    //   google.script.run.withSuccessHandler(afterDropdowArrayReturned).getDropdownArray();
    // }

    document
      .getElementById("loadButton")
      .addEventListener("click", afterLoadClicked)
    document
      .getElementById("calculateButton")
      .addEventListener("click", afterCalculateClicked)
