version: '2.4'

services:
  streamlit:
    build:
      dockerfile: ./Dockerfile
      context: ./
    ports:
      - '443:443'
    volumes:
      - '/home/bagatocorp/web:/usr/src/app:delegated'
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - GOOGLE_CREDENTIAL_PATH=/usr/src/app/secrets/familybudget-317019-797cf157b1ff.json
      - GOOGLE_SPREADSHEET_ID=12zOV6GkjmT2eUAQalQCTDP1OXOBCfLOhcBQaXQ4gbUQ
    networks:
      web_default:
        ipv4_address: 192.168.112.2
    healthcheck:
      test: ["CMD", "curl","--cacert","/usr/src/app/cert/budget.ikeniborn.ru.pem","--fail","https://192.168.112.2:443/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
networks:
  web_default:
    ipam:
      config:
        - subnet: 172.25.112.0/16