version: '2.4'

services:
  streamlit:
    build:
      dockerfile: ./Dockerfile
      context: ./
    ports:
      - '8501:8501'
    volumes:
      - '/home/bagatocorp/web:/usr/src/app/web:delegated'
      - '/home/bagatocorp/cert:/usr/src/app/cert:delegated'
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always