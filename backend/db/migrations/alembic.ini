# Alembic configuration for Family Budget
# DO NOT use until Production Mode (after v5.0.0 release)

[alembic]
# Path to migration scripts
script_location = backend/db/migrations

# Version locations (where versions are stored)
version_locations = backend/db/migrations/versions

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Database URL (can be overridden with -x dburl= command line arg)
# NOTE: Use synchronous driver (psycopg2) for Alembic migrations, not asyncpg
sqlalchemy.url = postgresql://familybudget:budget@postgres:5432/familybudget

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
