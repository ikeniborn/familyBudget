# Alembic configuration for Family Budget
# Production ready (v5.0.0+)

[alembic]
# Path to migration scripts
script_location = backend/db/migrations

# Prepend sys.path with this path to find backend module
prepend_sys_path = .

# Version locations (where versions are stored)
version_locations = backend/db/migrations/versions

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Database URL (loaded from environment variable in env.py)
# NOTE: Use synchronous driver (psycopg2) for Alembic migrations, not asyncpg
# sqlalchemy.url will be set programmatically in env.py from DATABASE_URL env var
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
