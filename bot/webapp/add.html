<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавить транзакцию - Family Budget</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/webapp/static/css/telegram-theme.css">
    <link rel="stylesheet" href="/webapp/static/css/app.css">
    <link rel="stylesheet" href="/webapp/static/css/forms.css">

    <style>
        /* Add transaction specific styles */
        .page-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
        }

        .amount-input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .amount-input {
            width: 100%;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            border: 2px solid var(--tg-theme-button-color);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }

        .amount-input:focus {
            outline: none;
            border-color: var(--tg-theme-link-color);
        }

        .amount-input.expense {
            border-color: var(--tg-theme-destructive-text-color);
            color: var(--tg-theme-destructive-text-color);
        }

        .amount-input.income {
            border-color: #34c759;
            color: #34c759;
        }

        .currency-label {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--tg-theme-hint-color);
            pointer-events: none;
        }

        .category-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color);
        }

        .category-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-item:active {
            background-color: var(--tg-theme-secondary-bg-color);
        }

        .category-item.selected {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .category-item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .category-loading {
            padding: 16px;
            text-align: center;
            color: var(--tg-theme-hint-color);
        }

        .quick-amount-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .quick-amount-btn {
            padding: 8px;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color);
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 8px;
            color: var(--tg-theme-text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-amount-btn:active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">Добавить транзакцию</div>
        </div>

        <!-- Transaction Type Selector -->
        <div class="form-group">
            <label class="form-label">Тип операции</label>
            <div class="segmented-control">
                <button type="button" class="segmented-control-item" data-type="expense">Расход</button>
                <button type="button" class="segmented-control-item active" data-type="income">
                    Доход
                </button>
            </div>
        </div>

        <!-- Quick Amount Buttons -->
        <div class="form-group">
            <label class="form-label">Быстрый выбор суммы</label>
            <div class="quick-amount-buttons">
                <button type="button" class="quick-amount-btn" data-amount="100">100 </button>
                <button type="button" class="quick-amount-btn" data-amount="500">500 </button>
                <button type="button" class="quick-amount-btn" data-amount="1000">1000 </button>
                <button type="button" class="quick-amount-btn" data-amount="5000">5000 </button>
            </div>
        </div>

        <!-- Amount Input -->
        <div class="form-group">
            <label class="form-label form-label-required">Сумма</label>
            <div class="amount-input-wrapper">
                <input
                    type="number"
                    id="amount"
                    class="amount-input income"
                    placeholder="0.00"
                    step="0.01"
                    min="0.01"
                    max="9999999.99"
                    inputmode="decimal"
                    required
                >
                <span class="currency-label"></span>
            </div>
            <span class="error-message" id="amount-error"></span>
        </div>

        <!-- Category Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Категория</label>
            <div class="category-list" id="category-list">
                <div class="category-loading">Загрузка категорий...</div>
            </div>
            <span class="error-message" id="category-error"></span>
        </div>

        <!-- Description (optional) -->
        <div class="form-group">
            <label class="form-label">Описание (необязательно)</label>
            <textarea
                id="description"
                class="form-textarea"
                placeholder="Добавьте комментарий..."
                maxlength="200"
                rows="3"
            ></textarea>
            <span class="char-counter" id="description-counter">0 / 200</span>
        </div>

        <!-- Date Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Дата</label>
            <input
                type="date"
                id="fact-date"
                class="form-input"
                required
            >
            <span class="error-message" id="date-error"></span>
        </div>
    </div>

    <!-- Core JS modules -->
    <script src="/webapp/static/js/storage.js"></script>
    <script src="/webapp/static/js/theme.js"></script>
    <script src="/webapp/static/js/validators.js"></script>
    <script src="/webapp/static/js/ui.js"></script>
    <script src="/webapp/static/js/auth.js"></script>
    <script src="/webapp/static/js/api.js"></script>
    <script src="/webapp/static/js/app.js"></script>

    <script>
        let formState = {
            factType: 'income',  // 'income' or 'expense'
            amount: null,
            categoryId: null,
            description: '',
            factDate: null
        };

        let categories = [];
        let app = null;

        // Page-specific initialization
        window.pageInit = async function(budgetApp) {
            console.log('Add transaction page init');
            app = budgetApp;

            // Setup transaction type selector
            setupTypeSelector();

            // Setup quick amount buttons
            setupQuickAmountButtons();

            // Setup amount input
            setupAmountInput();

            // Setup description counter
            setupDescriptionCounter();

            // Setup date input (default: today)
            setupDateInput();

            // Load categories
            await loadCategories();

            // Setup MainButton for save
            setupMainButton();

            // Setup BackButton
            app.setupBackButton(() => {
                app.tg.close();
            });

            console.log('Add transaction page ready');
        };

        function setupTypeSelector() {
            const buttons = document.querySelectorAll('.segmented-control-item');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');

                    // Update form state
                    formState.factType = button.dataset.type;

                    // Update amount input style
                    const amountInput = document.getElementById('amount');
                    amountInput.classList.remove('income', 'expense');
                    amountInput.classList.add(formState.factType);

                    // Reload categories for selected type
                    loadCategories();

                    // Haptic feedback
                    app.ui.hapticLight();
                });
            });
        }

        function setupQuickAmountButtons() {
            const buttons = document.querySelectorAll('.quick-amount-btn');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const amount = parseFloat(button.dataset.amount);
                    document.getElementById('amount').value = amount.toFixed(2);
                    formState.amount = amount;
                    app.ui.hapticLight();
                });
            });
        }

        function setupAmountInput() {
            const amountInput = document.getElementById('amount');

            amountInput.addEventListener('input', () => {
                const value = parseFloat(amountInput.value);
                formState.amount = isNaN(value) ? null : value;

                // Clear error on input
                document.getElementById('amount-error').textContent = '';
                amountInput.classList.remove('input-error');
            });
        }

        function setupDescriptionCounter() {
            const textarea = document.getElementById('description');
            const counter = document.getElementById('description-counter');

            textarea.addEventListener('input', () => {
                const length = textarea.value.length;
                counter.textContent = `${length} Я ваа`;

                if (length > 200) {
                    counter.classList.add('over-limit');
                } else {
                    counter.classList.remove('over-limit');
                }

                formState.description = textarea.value;
            });
        }

        function setupDateInput() {
            const dateInput = document.getElementById('fact-date');

            // Set default to today
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            dateInput.value = todayStr;
            formState.factDate = todayStr;

            // Set max date to today (no future dates)
            dateInput.max = todayStr;

            dateInput.addEventListener('change', () => {
                formState.factDate = dateInput.value;

                // Clear error on change
                document.getElementById('date-error').textContent = '';
                dateInput.classList.remove('input-error');
            });
        }

        async function loadCategories() {
            const categoryList = document.getElementById('category-list');
            categoryList.innerHTML = '<div class="category-loading">Загрузка категорий...</div>';

            try {
                // TODO: Implement when /api/v1/webapp/articles GET endpoint is ready
                // const result = await app.api.listArticles({
                //     type: formState.factType,
                //     is_current: true
                // });
                // categories = result.articles || [];

                // Placeholder categories for now
                categories = [
                    { id: 1, name: 'Продукты' },
                    { id: 2, name: 'Транспорт' },
                    { id: 3, name: ' азвлечения' },
                    { id: 4, name: 'Здоровье' },
                    { id: 5, name: 'Одежда' },
                ];

                if (categories.length === 0) {
                    categoryList.innerHTML = '<div class="category-loading">Категории не найдены</div>';
                    return;
                }

                // Render categories
                categoryList.innerHTML = '';
                categories.forEach(category => {
                    const item = document.createElement('div');
                    item.className = 'category-item';
                    item.dataset.categoryId = category.id;

                    item.innerHTML = `<div class="category-item-name">${category.name}</div>`;

                    item.addEventListener('click', () => {
                        // Update selected state
                        document.querySelectorAll('.category-item').forEach(i => {
                            i.classList.remove('selected');
                        });
                        item.classList.add('selected');

                        // Update form state
                        formState.categoryId = category.id;

                        // Clear error
                        document.getElementById('category-error').textContent = '';

                        // Haptic feedback
                        app.ui.hapticLight();
                    });

                    categoryList.appendChild(item);
                });

            } catch (error) {
                console.error('Failed to load categories:', error);
                categoryList.innerHTML = '<div class="category-loading">Ошибка загрузки категорий</div>';
            }
        }

        function setupMainButton() {
            const mainButton = app.tg.MainButton;

            mainButton.setText('Сохранить');
            mainButton.show();
            mainButton.enable();

            mainButton.onClick(async () => {
                await handleSave();
            });
        }

        async function handleSave() {
            console.log('Saving transaction...', formState);

            // Validate form
            const errors = validateForm();
            if (Object.keys(errors).length > 0) {
                app.ui.hapticError();
                return;
            }

            // Show loading
            app.ui.showLoading('Сохранение...');

            try {
                // TODO: Implement when /api/v1/webapp/facts POST endpoint is ready
                // const result = await app.api.createFact({
                //     fact_type: formState.factType,
                //     amount: formState.amount,
                //     article_id: formState.categoryId,
                //     description: formState.description,
                //     fact_date: formState.factDate
                // });

                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 1000));

                app.ui.hideLoading();
                app.ui.showSuccess('Транзакция сохраненаС', () => {
                    // Go back to main menu
                    app.tg.close();
                });

            } catch (error) {
                app.ui.hideLoading();
                app.ui.showError(`Ошибкак ${error.message}`);
            }
        }

        function validateForm() {
            const errors = {};

            // Amount validation
            const amountInput = document.getElementById('amount');
            const amountError = Validators.amount(formState.amount);
            if (amountError) {
                errors.amount = amountError;
                document.getElementById('amount-error').textContent = amountError;
                amountInput.classList.add('input-error');
            }

            // Category validation
            if (!formState.categoryId) {
                errors.category = 'Выберите категорию';
                document.getElementById('category-error').textContent = 'Выберите категорию';
            }

            // Date validation
            const dateInput = document.getElementById('fact-date');
            const dateError = Validators.date(formState.factDate);
            if (dateError) {
                errors.date = dateError;
                document.getElementById('date-error').textContent = dateError;
                dateInput.classList.add('input-error');
            }

            return errors;
        }
    </script>
</body>
</html>
