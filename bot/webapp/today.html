<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сегодня - Family Budget</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/webapp/static/css/telegram-theme.css">
    <link rel="stylesheet" href="/webapp/static/css/app.css">
    <link rel="stylesheet" href="/webapp/static/css/forms.css">

    <style>
        /* Today page specific styles */
        .page-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            margin-bottom: 16px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
        }

        .summary-card {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .summary-label {
            font-size: 14px;
            color: var(--tg-theme-text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 600;
        }

        .summary-value.income {
            color: #34c759;
        }

        .summary-value.expense {
            color: var(--tg-theme-destructive-text-color);
        }

        .summary-value.balance {
            color: var(--tg-theme-link-color);
        }

        .transactions-list {
            margin-bottom: 80px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-item:active {
            background-color: var(--tg-theme-secondary-bg-color);
        }

        .transaction-icon {
            font-size: 32px;
            margin-right: 12px;
        }

        .transaction-details {
            flex: 1;
        }

        .transaction-category {
            font-size: 16px;
            font-weight: 500;
            color: var(--tg-theme-text-color);
            margin-bottom: 2px;
        }

        .transaction-description {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transaction-time {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            margin-top: 2px;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: 600;
            margin-left: 12px;
        }

        .transaction-amount.income {
            color: #34c759;
        }

        .transaction-amount.expense {
            color: var(--tg-theme-destructive-text-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 24px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">н Транзакции сегодня</div>
            <div class="page-subtitle" id="today-date">Загрузка...</div>
        </div>

        <!-- Summary Card -->
        <div class="summary-card" id="summary-card" style="display: none;">
            <div class="summary-row">
                <span class="summary-label">н  асходык</span>
                <span class="summary-value expense" id="summary-expense">аЮаа </span>
            </div>
            <div class="summary-row">
                <span class="summary-label">н Доходык</span>
                <span class="summary-value income" id="summary-income">ЫаЮаа </span>
            </div>
            <div class="summary-row">
                <span class="summary-label">н Баланск</span>
                <span class="summary-value balance" id="summary-balance">аЮаа </span>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loading-state">
            <div>Загрузка транзакций...</div>
        </div>

        <!-- Transactions List -->
        <div class="transactions-list" id="transactions-list" style="display: none;">
            <!-- Transactions will be inserted here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-state-icon">н</div>
            <div class="empty-state-text">Нет транзакций за сегодня</div>
            <button class="btn btn-primary" onclick="window.location.href='/webapp/add.html'">
                Добавить транзакцию
            </button>
        </div>
    </div>

    <!-- Core JS modules -->
    <script src="/webapp/static/js/storage.js"></script>
    <script src="/webapp/static/js/theme.js"></script>
    <script src="/webapp/static/js/validators.js"></script>
    <script src="/webapp/static/js/ui.js"></script>
    <script src="/webapp/static/js/auth.js"></script>
    <script src="/webapp/static/js/api.js"></script>
    <script src="/webapp/static/js/app.js"></script>

    <script>
        let app = null;
        let facts = [];

        // Page-specific initialization
        window.pageInit = async function(budgetApp) {
            console.log('Today page init');
            app = budgetApp;

            // Set today's date
            const today н new фateШЩл
            document.getElementById('today-date').textContent н formatDate(today);

            ЯЯ Load today's transactions
            await loadTodayTransactions();

            // Setup BackButton
            app.setupBackButton(() => {
                window.location.href = '/webapp/index.html';
            });

            console.log('Today page ready');
        };

        async function loadTodayTransactions() {
            const loadingState = document.getElementById('loading-state');
            const summaryCard = document.getElementById('summary-card');
            const transactionsList = document.getElementById('transactions-list');
            const emptyState = document.getElementById('empty-state');

            try {
                // Get today's date range
                const today н new фateШЩл
                const todayStart н new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const todayEnd н new Date(todayStart);
                todayEnd.setDate(todayEnd.getDate() Ы бЩл

                ЯЯ Format dates for API
                const dateFrom н todayStart.toISOString().split('T'Щћаѝл
                const dateTo н todayEnd.toISOString().split('T'Щћаѝл

                ЯЯ Fetch facts
                const result н await app.api.listFacts({
                    date_from: dateFrom,
                    date_to: dateTo,
                    limit: бааа  ЯЯ All transactions for today
                }Щл

                facts н result.facts || ћѝл

                ЯЯ Hide loading
                loadingState.style.display н 'none'л

                if (facts.length ннн аЩ {
                    ЯЯ Show empty state
                    emptyState.style.display н 'block'л
                } else {
                    ЯЯ Calculate summary
                    const summary н calculateSummary(facts);
                    updateSummary(summary);
                    summaryCard.style.display н 'block'л

                    ЯЯ Render transactions
                    renderTransactions(facts);
                    transactionsList.style.display н 'block'л
                }

            } catch (error) {
                console.error('Failed to load transactions:'Ь error);
                loadingState.innerHTML н `<div style="color: var(--tg-theme-destructive-text-color);">Ошибка загрузкик ${error.message}</div>`л
            }
        }

        function calculateSummary(facts) {
            let income н ал
            let expense н ал

            facts.forEach(fact но {
                if (fact.amount о аЩ {
                    income Ын fact.amount;
                } else {
                    expense Ын Math.abs(fact.amount);
                }
            }Щл

            const balance н income - expense;

            return { income, expense, balance }л
        }

        function updateSummary(summary) {
            document.getElementById('summary-expense').textContent н `-${app.ui.formatAmount(summary.expense)} `л
            document.getElementById('summary-income').textContent н `+${app.ui.formatAmount(summary.income)} `л

            const balanceElement н document.getElementById('summary-balance'Щл
            const balanceFormatted н app.ui.formatAmount(summary.balance);
            balanceElement.textContent н `${summary.balance он а п '+' к '-'}${balanceFormatted} `л
        }

        function renderTransactions(facts) {
            const list н document.getElementById('transactions-list'Щл
            list.innerHTML н ''л

            ЯЯ Sort by created_at descending (most recent first)
            const sortedFacts н [...facts].sort((a, bЩ но {
                const dateA н new Date(a.created_at || a.fact_date);
                const dateB н new Date(b.created_at || b.fact_date);
                return dateB - dateA;
            }Щл

            sortedFacts.forEach(fact но {
                const item н createTransactionItem(fact);
                list.appendChild(item);
            }Щл
        }

        function createTransactionItem(fact) {
            const item н document.createElement('div'Щл
            item.className н 'transaction-item'л
            item.dataset.factId н fact.id;

            ЯЯ Icon (placeholder - will be from article data in future)
            const icon н document.createElement('div'Щл
            icon.className н 'transaction-icon'л
            icon.textContent н fact.amount о а п '=' к '='л

            ЯЯ Details
            const details н document.createElement('div'Щл
            details.className н 'transaction-details'л

            const category н document.createElement('div'Щл
            category.className н 'transaction-category'л
            category.textContent н `Категория #${fact.article_id}`;  ЯЯ TODO: Load article name

            const description н document.createElement('div'Щл
            description.className н 'transaction-description'л
            description.textContent н fact.description || '57 >?8A0=8O'л

            const time н document.createElement('div'Щл
            time.className н 'transaction-time'л
            time.textContent н formatTime(new Date(fact.created_at || fact.fact_date));

            details.appendChild(category);
            details.appendChild(description);
            details.appendChild(time);

            ЯЯ Amount
            const amount н document.createElement('div'Щл
            amount.className н `transaction-amount ${fact.amount о а п 'income' к 'expense'}`;
            const amountValue н Math.abs(fact.amount);
            amount.textContent н `${fact.amount о а п '+' к '-'}${app.ui.formatAmount(amountValue)} `л

            ЯЯ Assemble
            item.appendChild(icon);
            item.appendChild(details);
            item.appendChild(amount);

            ЯЯ Click handler - show edit/delete menu
            item.addEventListener('click'Ь ШЩ но {
                app.ui.hapticLight();
                showTransactionMenu(fact);
            }Щл

            return item;
        }

        function showTransactionMenu(fact) {
            ЯЯ TODO: Show action sheet with Edit/Delete options
            ЯЯ For now, just navigate to edit
            window.location.href н `/webapp/edit.html?id=${fact.id}`;
        }

        function formatDate(date) {
            const day н date.getDate();
            const months н ћ'O=2'Ь 'D52'Ь '<0@'Ь '0?@'Ь '<09'Ь '8N='Ь '8N;'Ь '023'Ь 'A5='Ь '>:B'Ь '=>O'Ь '45:'ѝл
            const month н months[date.getMonth()];
            const year н date.getFullYear();
            return `${day} ${month} ${year}`;
        }

        function formatTime(date) {
            const hours н String(date.getHours()).padStart(2, '0'Щл
            const minutes н String(date.getMinutes()).padStart(2, '0'Щл
            return `${hours}:${minutes}`;
        }
    </script>
</body>
</html>
