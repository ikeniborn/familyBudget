name: familybudget-test

services:
  postgres:
    image: ${POSTGRESQL_IMAGE:?Set the PostgreSQL image digest}
    cpus: 1.0
    mem_limit: 768m
    environment:
      POSTGRES_DB: familybudget
      POSTGRES_USER: familybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a test database password}
    command: [postgres, -c, max_locks_per_transaction=256]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, familybudget, -d, familybudget]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:?Set the Redis image digest}
    cpus: 0.5
    mem_limit: 256m
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set a test Redis password}
    command: [redis-server, --maxmemory, 128mb, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  familybudget-test-backend:
    image: ${BACKEND_IMAGE:?Set the backend image digest}
    cpus: 1.5
    mem_limit: 1024m
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://familybudget:${POSTGRES_PASSWORD}@postgres:5432/familybudget
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set a test JWT secret}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:?Set a test internal API key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the dedicated test bot token}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:?Set the test admin Telegram ID}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DOMAIN: fbd.ikeniborn.ru
      CORS_ORIGINS: '["https://fbd.ikeniborn.ru","https://web.telegram.org","https://oauth.telegram.org"]'
      WEBAUTHN_RP_ID: fbd.ikeniborn.ru
      WEBAUTHN_ORIGIN: https://fbd.ikeniborn.ru
    tmpfs:
      - /app/logs:uid=65532,gid=65532,mode=0700
      - /app/uploads:uid=65532,gid=65532,mode=0700
      - /app/backups:uid=65532,gid=65532,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      private:
        aliases: [backend]
      proxy-net:

  bot:
    image: ${BOT_IMAGE:?Set the test bot image digest}
    cpus: 0.5
    mem_limit: 384m
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the dedicated test bot token}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      BACKEND_API_URL: http://backend:8000/api/v1
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:?Set a test internal API key}
      DOMAIN: fbd.ikeniborn.ru
    tmpfs:
      - /app/logs:uid=65532,gid=65532,mode=0700
    depends_on:
      familybudget-test-backend:
        condition: service_healthy
    networks: [private]

volumes:
  postgres_data:
  redis_data:

networks:
  private:
    ipam:
      config:
        - subnet: ${TEST_SUBNET:?Reserve a non-overlapping test subnet}
  proxy-net:
    external: true
