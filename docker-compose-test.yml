version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: familybudget-postgres-test
    environment:
      POSTGRES_USER: familybudget
      POSTGRES_PASSWORD: test_password_12345678901234567890
      POSTGRES_DB: familybudget_test
    ports:
      - "5433:5432"  # Use port 5433 to avoid conflicts with production DB
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familybudget"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

volumes:
  postgres-test-data:

networks:
  test-network:
    driver: bridge
