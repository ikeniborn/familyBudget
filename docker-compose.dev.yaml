# Development Docker Compose configuration - Unified API
# This file automatically uses .env file if present in the project root
# For development, copy .env.dev to .env or use: ./scripts/dev.sh
# All services include hot-reload for rapid development

version: "3.8"

services:
  postgres:
    container_name: postgres-dev
    image: "postgres:13"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-devpassword}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/var/lib/postgresql/data/pgdata/postgresql.conf
      - ./postgresql/init:/docker-entrypoint-initdb.d
      - ./postgresql/ddl/budgetdb.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./postgresql/ddl/products.sql:/docker-entrypoint-initdb.d/products.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:4000
    networks:
      - app_network
    depends_on:
      - frontend-api

  frontend-api:
    container_name: frontend-api-dev
    build:
      context: ./frontend-api
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend-api:/app
      - /app/node_modules
      - ./frontend-api/prisma:/app/prisma
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://budget:${BUDGET_DB_PASSWORD:-devpassword}@postgres:5432/budgetdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_UNIFIED_API=true
      - FRONTEND_URL=http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-dev_bot_token}
    networks:
      - app_network
    depends_on:
      - postgres
      - redis
    command: "npm run dev"

networks:
  app_network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data: