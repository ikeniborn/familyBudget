# Development overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file provides development-friendly overrides:
# - Bind mounts for live code editing
# - Debug mode enabled
# - Exposed ports for direct access
# - Development-optimized settings

services:
  backend:
    # Override: use local code instead of image code (for development)
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      # Add scripts for debugging
      - ./scripts:/app/scripts:ro
      # VERSION file for runtime version reading
      - ./VERSION:/app/VERSION:ro
    environment:
      # Development mode
      DEBUG: "true"
      LOG_LEVEL: debug
      APP_ENV: development
      # Reload on code changes (uvicorn --reload)
      RELOAD: "true"
    # Development command with reload
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-dir /app/frontend
      --ws-per-message-deflate false
      --log-level debug
      --access-log
      --proxy-headers
      --forwarded-allow-ips='*'

  bot:
    # Override: use local code instead of image code
    volumes:
      - ./bot:/app/bot:ro
      - ./logs:/app/logs
    environment:
      LOG_LEVEL: debug

  nginx:
    # Override: use local config instead of image config
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Serve static files directly from local filesystem
      - ./frontend/web/static:/usr/share/nginx/html/static:ro
      - nginx_cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
      # SSL certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Service Worker and Manifest
      - ./sw.min.js:/usr/share/nginx/html/sw.min.js:ro
      - ./sw.min.js.gz:/usr/share/nginx/html/sw.min.js.gz:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro

  redis:
    # Override: disable persistence in dev (faster restarts)
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --requirepass "${REDIS_PASSWORD}"
    # Expose port for local redis-cli access
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    # Override: expose port for local psql access
    # SECURITY: Only bind to localhost (not 0.0.0.0)
    ports:
      - "127.0.0.1:5432:5432"
