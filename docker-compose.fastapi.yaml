# Development Docker Compose configuration with FastAPI Backend
# This file automatically uses .env file if present in the project root
# For development, copy .env.dev to .env or use: ./scripts/dev-fastapi.sh
# All services include hot-reload for rapid development

services:
  postgres:
    container_name: postgres-dev
    image: "postgres:13"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-devpassword}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
      - ./postgresql/ddl/budgetdb.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./postgresql/ddl/products.sql:/docker-entrypoint-initdb.d/products.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend-svelte-dev
    build:
      context: ./frontend-svelte
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend-svelte:/app
      - /app/node_modules
      - /app/.svelte-kit
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:4000
      - ORIGIN=http://localhost:5173
    networks:
      - app_network
    depends_on:
      - backend-fastapi

  backend-fastapi:
    container_name: backend-fastapi-dev
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend-fastapi:/app
      - /app/__pycache__
    ports:
      - "4000:4000"
    environment:
      - ENVIRONMENT=development
      - PORT=4000
      - DATABASE_URL=postgresql+asyncpg://budget:${BUDGET_DB_PASSWORD:-devpassword}@postgres:5432/budgetdb
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-dev_bot_token}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ENABLE_PASSWORD_AUTH=${ENABLE_PASSWORD_AUTH:-true}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=DEBUG
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: "uvicorn app.main:app --host 0.0.0.0 --port 4000 --reload"

networks:
  app_network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data: