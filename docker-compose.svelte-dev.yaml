version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: postgres-svelte
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_svelte_data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - budget_svelte_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis-svelte
    command: redis-server --appendonly yes
    volumes:
      - redis_svelte_data:/data
    networks:
      - budget_svelte_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend API (Node.js)
  frontend-api:
    build:
      context: ./frontend-api
      dockerfile: Dockerfile.dev
    container_name: frontend-api-svelte
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://budget:${BUDGET_DB_PASSWORD}@postgres:5432/budgetdb
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      PORT: 4001
    volumes:
      - ./frontend-api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budget_svelte_network
    ports:
      - "4001:4001"
    command: npm run dev

  # SvelteKit Frontend with hot reload
  frontend-svelte:
    image: node:20-alpine
    container_name: frontend-svelte-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4001
      VITE_TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME}
    volumes:
      - ./frontend-svelte:/app
      - /app/node_modules
      - /app/.svelte-kit
    depends_on:
      - frontend-api
    networks:
      - budget_svelte_network
    ports:
      - "5173:5173"
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  budget_svelte_network:
    driver: bridge

volumes:
  postgres_svelte_data:
  redis_svelte_data: