version: "3"

services:
  postgres:
    container_name: postgres
    hostname: postgres
    image: "postgres:13"
    networks:
      app_network:
        ipv4_address: 10.5.0.2
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${APP_PATH}/web/db/postgresql/postgresql.conf:/var/lib/postgresql/data/pgdata/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    cpuset: "0"    
    cpus: 0.5  
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - haproxy

  budget-api:
    container_name: budget-api
    hostname: budget-api
    build:
      dockerfile: ./api/Dockerfile
      context: ./
    volumes:
      - ${APP_PATH}/web/api:/usr/src/app:delegated
    ports:
      - "8888:8888"
    command: "uvicorn budget_api:app --host 0.0.0.0 --port 8888 --reload"
    env_file:
      - .env
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB_BUDGET}
      - POSTGRES_USER=${POSTGRES_USER_BUDGET}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_BUDGET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      app_network:
        ipv4_address: 10.5.0.3
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/0.0.0.0/8888"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    cpuset: "0"    
    cpus: 0.15 
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - postgres
      - haproxy

  budget-ui:
    container_name: budget-ui
    hostname: budget-ui
    build:
      dockerfile: ./app/budget/Dockerfile
      context: ./
    volumes:
      - ${APP_PATH}/web/app/budget:/usr/src/app:delegated
    ports:
      - "8501:8501"
    command: "streamlit run ui.py --server.port=8501"
    env_file:
      - .env
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - API_URL=${API_URL}
      - POLARS_SKIP_CPU_CHECK=${POLARS_SKIP_CPU_CHECK}
    networks:
      app_network:
        ipv4_address: 10.5.0.4
    healthcheck:
      test: ["CMD", "curl","--fail","http://0.0.0.0:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    cpuset: "0"    
    cpus: 0.15
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - budget-api
      - haproxy

  haproxy:
    container_name: haproxy
    hostname: haproxy
    image: "haproxy:2.2-alpine"
    volumes:
      - ${APP_PATH}/web/service/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:delegated
      - /etc/haproxy/certs:/etc/ssl/certs:delegated
    network_mode: "host"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    cpuset: "0"    
    mem_reservation: "50M"
    mem_limit: "100M" 
    cpus: 0.1

  couchdb:
      image: couchdb:latest
      hostname: couchdb
      container_name: couchdb
      networks:
        app_network:
          ipv4_address: 10.5.0.6
      ports:
          - "5984:5984"
      env_file:
          - .env
      environment:
          - COUCHDB_USER=${COUCHDB_USER}
          - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      volumes:
          - couchdb-data:/opt/couchdb/data
          - ${APP_PATH}/web/db/couchdb/local.ini:/opt/couchdb/etc/local.ini
      healthcheck:
        test: ["CMD", "sh", "-c", "curl -f http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@localhost:5984/_up"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      restart: always
      cpuset: "0"    
      cpus: 0.50
      mem_reservation: "100M"
      mem_limit: "300M" 

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1

volumes:
  postgres-data:
    driver: local
  couchdb-data:
    driver: local
  crm-data:
    driver: local

