version: "3"

services:
  postgres:
    container_name: postgres
    hostname: postgres
    image: "postgres:13"
    networks:
      app_network:
        ipv4_address: 10.5.0.2
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${APP_PATH}/web/db/postgresql/postgresql.conf:/var/lib/postgresql/data/pgdata/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    cpuset: "0"    
    cpus: 0.5  
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - traefik

  budget-api:
    container_name: budget-api
    hostname: budget-api
    build:
      dockerfile: ./api/Dockerfile
      context: ./
    volumes:
      - ${APP_PATH}/web/api:/usr/src/app:delegated
    ports:
      - "8888:8888"
    command: "uvicorn budget_api:app --host 0.0.0.0 --port 8888 --reload"
    env_file:
      - .env
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB_BUDGET}
      - POSTGRES_USER=${POSTGRES_USER_BUDGET}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_BUDGET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
    networks:
      app_network:
        ipv4_address: 10.5.0.3
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/0.0.0.0/8888"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.budget-api.rule=Host(`api.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.budget-api.entrypoints=websecure"
      - "traefik.http.routers.budget-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.budget-api.loadbalancer.server.port=8888"
      - "traefik.http.routers.budget-api.middlewares=secure-headers@file,compress@file,rate-limit@file"
    restart: always
    cpuset: "0"    
    cpus: 0.15 
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - postgres
      - traefik

  budget-ui:
    container_name: budget-ui
    hostname: budget-ui
    build:
      dockerfile: ./app/budget/Dockerfile
      context: ./
    volumes:
      - ${APP_PATH}/web/app/budget:/usr/src/app:delegated
    ports:
      - "8501:8501"
    command: "streamlit run ui.py --server.port=8501"
    env_file:
      - .env
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - API_URL=${API_URL}
      - POLARS_SKIP_CPU_CHECK=${POLARS_SKIP_CPU_CHECK}
    networks:
      app_network:
        ipv4_address: 10.5.0.4
    healthcheck:
      test: ["CMD", "curl","--fail","http://0.0.0.0:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.budget-ui.rule=Host(`budget.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.budget-ui.entrypoints=websecure"
      - "traefik.http.routers.budget-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.budget-ui.loadbalancer.server.port=8501"
      - "traefik.http.routers.budget-ui.middlewares=secure-headers@file,compress@file"
    restart: always
    cpuset: "0"    
    cpus: 0.15
    mem_reservation: "100M"
    mem_limit: "250M" 
    depends_on:
      - budget-api
      - traefik

  traefik:
    container_name: traefik
    hostname: traefik
    image: "traefik:v3.0"
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${APP_PATH}/service/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${APP_PATH}/service/traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      app_network:
        ipv4_address: 10.5.0.10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth,secure-headers@file"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASSWORD}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    cpuset: "0"    
    mem_reservation: "50M"
    mem_limit: "100M" 
    cpus: 0.1

  redis:
    container_name: redis
    hostname: redis
    image: "redis:7-alpine"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      app_network:
        ipv4_address: 10.5.0.5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    cpuset: "0"
    cpus: 0.2
    mem_reservation: "100M"
    mem_limit: "300M"

  couchdb:
      image: couchdb:latest
      hostname: couchdb
      container_name: couchdb
      networks:
        app_network:
          ipv4_address: 10.5.0.6
      ports:
          - "5984:5984"
      env_file:
          - .env
      environment:
          - COUCHDB_USER=${COUCHDB_USER}
          - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      volumes:
          - couchdb-data:/opt/couchdb/data
          - ${APP_PATH}/web/db/couchdb/local.ini:/opt/couchdb/etc/local.ini
      healthcheck:
        test: ["CMD", "sh", "-c", "curl -f http://$${COUCHDB_USER}:$${COUCHDB_PASSWORD}@localhost:5984/_up"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.couchdb.rule=Host(`notes.${TRAEFIK_DOMAIN}`)"
        - "traefik.http.routers.couchdb.entrypoints=websecure"
        - "traefik.http.routers.couchdb.tls.certresolver=letsencrypt"
        - "traefik.http.services.couchdb.loadbalancer.server.port=5984"
        - "traefik.http.routers.couchdb.middlewares=secure-headers@file,compress@file"
      restart: always
      cpuset: "0"    
      cpus: 0.50
      mem_reservation: "100M"
      mem_limit: "300M" 

  backup:
    container_name: backup
    hostname: backup
    build:
      dockerfile: ./db/backup/Dockerfile
      context: ./web
    networks:
      app_network:
        ipv4_address: 10.5.0.10
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - COUCHDB_HOST=couchdb
      - COUCHDB_PORT=5984
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=7
      - RUN_INITIAL_BACKUP=false
    volumes:
      - backup-data:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - postgres
      - couchdb
    restart: always
    cpuset: "0"
    cpus: 0.1
    mem_reservation: "50M"
    mem_limit: "100M"

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1

volumes:
  postgres-data:
    driver: local
  couchdb-data:
    driver: local
  redis-data:
    driver: local
  traefik-certificates:
    driver: local
  backup-data:
    driver: local

