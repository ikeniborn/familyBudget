# Docker Compose configuration for Family Budget
# Supports basic deployment (postgres + backend) and full deployment (+ nginx + bot + certbot)
#
# IMPORTANT: This file is located in /opt/budget after running setup.sh
# Do NOT edit this file directly in repository - changes will be overwritten by setup.sh
#
# Workflow to update:
#   1. Make changes in your git repository (e.g., ~/familyBudget)
#   2. git pull   # Get latest changes
#   3. ./setup.sh # Sync repository → /opt/budget
#   4. ./deploy.sh # Apply changes
#
# This ensures consistency between repository and deployment directory.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: familybudget-postgres
    # Restart policy: "always" ensures PostgreSQL starts even after manual stop or Docker daemon restart
    # Unlike "unless-stopped", "always" will restart the container after Docker daemon restarts,
    # regardless of the container's previous state (running, stopped, or exited)
    restart: always
    stop_grace_period: 60s  # Allow PostgreSQL time for graceful shutdown
    stop_signal: SIGINT     # Preferred signal for PostgreSQL clean shutdown
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familybudget}
      POSTGRES_USER: ${POSTGRES_USER:-familybudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    # Port 5432 is exposed on host, but access is controlled by UFW firewall
    # By default, UFW blocks all external connections to port 5432
    # To enable access: run setup.sh and configure POSTGRES_EXTERNAL_ACCESS
    ports:
      - "5432:5432"
    networks:
      - familybudget
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familybudget} -d ${POSTGRES_DB:-familybudget}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=10MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_destination=stderr"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"  # Query performance monitoring
      - "-c"
      - "pg_stat_statements.track=all"  # Track all queries (including nested)
      - "-c"
      - "pg_stat_statements.max=10000"  # Store up to 10k distinct queries
      - "-c"
      - "max_locks_per_transaction=256"  # Default 64 - increased to prevent out of shared memory errors

  # Redis (Caching & WebSocket Sync)
  redis:
    image: redis:7-alpine
    container_name: familybudget-redis
    # Restart policy: "always" ensures Redis is always available for caching
    restart: always
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    # Port 6379 is exposed on host, but access is controlled by UFW firewall
    # By default, UFW blocks all external connections to port 6379
    ports:
      - "6379:6379"
    networks:
      - familybudget
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.1}'
          memory: 512M
        reservations:
          cpus: '${REDIS_CPU_RESERVATION:-0.02}'
          memory: 128M

  # Backend Application (FastAPI + HTMX)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: familybudget-backend:${VERSION:-latest}
    container_name: familybudget-backend
    # Restart policy: "always" ensures backend is always available after Docker daemon restarts
    # Critical service - entire application depends on backend (API, auth, business logic)
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-familybudget}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-familybudget}
      # Database connection for run_migrations.sh
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-familybudget}
      DB_USER: ${POSTGRES_USER:-familybudget}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Application
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      VERSION: ${VERSION:-4.0.0}
      PYTHONDONTWRITEBYTECODE: 1  # Prevent .pyc cache files (force fresh code on restart)

      # Security
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:?API_INTERNAL_KEY is required}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}

      # Admin
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:?ADMIN_TELEGRAM_ID is required}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,https://${DOMAIN}}
      # SECURITY FIX: Pass CORS_ORIGINS as JSON array for Pydantic Settings
      # Format: JSON array of strings (required by Pydantic list[str] parsing)
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://${DOMAIN}","https://web.telegram.org","https://oauth.telegram.org"]}

      # Domain
      DOMAIN: ${DOMAIN:-localhost}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # Timezone (IANA format: Europe/Moscow, America/New_York, UTC)
      TZ: ${SYSTEM_TIMEZONE:-UTC}
      SYSTEM_TIMEZONE: ${SYSTEM_TIMEZONE:-UTC}

      # Performance
      # WORKERS: Configurable workers with Redis-backed WebSocket support
      # Default: 1 (legacy SSE mode), can be increased to 4 with Redis Pub/Sub
      WORKERS: ${WORKERS:-1}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}

      # Redis (Caching & WebSocket Sync)
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL_DEFAULT: ${REDIS_CACHE_TTL_DEFAULT:-60}
      REDIS_CACHE_TTL_REFERENCE: ${REDIS_CACHE_TTL_REFERENCE:-300}
      REDIS_CACHE_TTL_DASHBOARD: ${REDIS_CACHE_TTL_DASHBOARD:-30}
      WRITE_BEHIND_ENABLED: ${WRITE_BEHIND_ENABLED:-false}

      # S3 Backup (optional)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro  # Frontend: web UI, Telegram Web Apps, shared modules
      - ./scripts:/app/scripts:ro  # Scripts: backup health check, deployment utilities
      - ./backups:/app/backups:ro  # Backups directory (read-only for health checks)
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      # PWA files (served by FastAPI StaticFiles)
      - ./sw.min.js:/app/sw.min.js:ro  # Service Worker (minified)
      - ./manifest.json:/app/manifest.json:ro  # PWA Manifest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - familybudget
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Workers: Default 1 for legacy SSE mode, can be increased with Redis Pub/Sub
    # See: backend/app/api/v1/endpoints/budget_ws.py for WebSocket implementation
    # --ws-per-message-deflate false: Disable WebSocket compression for iOS Safari compatibility
    # Reference: https://github.com/encode/uvicorn/issues/1298
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${WORKERS:-1}
      --ws-per-message-deflate false
      --log-level ${LOG_LEVEL:-info}
      --access-log
      --proxy-headers
      --forwarded-allow-ips='*'
    deploy:
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-0.8}'  # Auto-configured by setup.sh
          memory: 2G
        reservations:
          cpus: '${BACKEND_CPU_RESERVATION:-0.3}'  # Auto-configured by setup.sh
          memory: 512M

  # Telegram Bot (Optional - can run in same container as backend)
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    image: familybudget-bot:${VERSION:-latest}
    container_name: familybudget-bot
    # Restart policy: "always" ensures Telegram bot is always available for users
    # Critical service - primary user interface for Telegram users (polling mode requires 24/7 uptime)
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Telegram
      # Python warnings
      PYTHONWARNINGS: "ignore::UserWarning:telegram.ext"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}

      # Backend API
      BACKEND_API_URL: http://backend:8000/api/v1
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:?API_INTERNAL_KEY is required}

      # Domain (for WebApp URL generation)
      DOMAIN: ${DOMAIN:-localhost}

      # Application
      PYTHONDONTWRITEBYTECODE: 1  # Prevent .pyc cache files (force fresh code on restart)

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Timezone (IANA format: Europe/Moscow, America/New_York, UTC)
      TZ: ${SYSTEM_TIMEZONE:-UTC}
    volumes:
      - ./bot:/app/bot:ro
      - ./logs:/app/logs
    networks:
      - familybudget
    profiles:
      - full  # Only start if 'full' profile is active
    deploy:
      resources:
        limits:
          cpus: '${BOT_CPU_LIMIT:-0.15}'  # Auto-configured by setup.sh
          memory: 512M
        reservations:
          cpus: '${BOT_CPU_RESERVATION:-0.05}'  # Auto-configured by setup.sh
          memory: 256M

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: familybudget-nginx
    # Restart policy: "always" ensures nginx (entry point for all HTTPS traffic) is always available
    # CRITICAL service - without nginx, application is completely inaccessible from internet
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/web/static:/usr/share/nginx/html/static:ro
      - nginx_cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
      # SSL certificates from host system (managed by scripts/ssl_certificate_manager.sh)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Service Worker (minified + gzip pre-compressed for nginx gzip_static)
      - ./sw.min.js:/usr/share/nginx/html/sw.min.js:ro
      - ./sw.min.js.gz:/usr/share/nginx/html/sw.min.js.gz:ro
      # PWA Manifest
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - familybudget
    profiles:
      - full  # Only start if 'full' profile is active
    healthcheck:
      # Check nginx itself, not backend - prevents false "unhealthy" during backend restart
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${NGINX_CPU_LIMIT:-0.05}'  # Auto-configured by setup.sh
          memory: 256M
        reservations:
          cpus: '${NGINX_CPU_RESERVATION:-0.01}'  # Auto-configured by setup.sh
          memory: 64M

  # Certbot removed - SSL certificates now managed on host system
  # See scripts/ssl_certificate_manager.sh for certificate management
  # Auto-renewal configured via cron (twice daily)

volumes:
  postgres_data:
    external: true
    name: budget_postgres_data

  redis_data:
    driver: local

  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DIR:-/opt/budget/backups}  # Absolute path to prevent volume recreation

  nginx_cache:
    driver: local

networks:
  familybudget:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
