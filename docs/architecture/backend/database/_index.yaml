# PostgreSQL Configuration
postgresql_config:
  description: "Critical PostgreSQL parameters configured in docker-compose.yml"
  parameters:
    max_connections:
      value: 100
      description: "Maximum concurrent connections"

    shared_buffers:
      value: "256MB"
      description: "Shared memory for caching"

    max_locks_per_transaction:
      value: 256
      default: 64
      description: |
        Maximum locks per transaction. Increased from default 64 to 256
        to prevent "out of shared memory" errors during concurrent operations.
        Error fixed: asyncpg.exceptions.OutOfMemoryError

    effective_cache_size:
      value: "1GB"
      description: "Expected memory available for disk caching"

  troubleshooting:
    out_of_shared_memory:
      symptom: "asyncpg.exceptions.OutOfMemoryError: out of shared memory"
      hint: "You might need to increase max_locks_per_transaction"
      root_cause: |
        Partitioned tables require a lock on EACH partition.
        t_f_budget_fact has 96 partitions (2023-01 to 2030-12).
        Query without partition key filter (fact_date) locks ALL 96 partitions.
        Multiple concurrent users × 96 locks = shared memory exhaustion.
      solution: |
        1. PREFERRED: Add partition key filter to queries for partition pruning
           Example: WHERE fact_date >= current_date - interval '90 days'
           This reduces locks from 96 to ~3 partitions.

        2. FALLBACK: Increase max_locks_per_transaction
           - Check current value: SHOW max_locks_per_transaction;
           - Update docker-compose.yml command section
           - Recreate postgres container: docker compose up -d postgres --force-recreate
           - Verify new value: SHOW max_locks_per_transaction;

  partitioning_notes:
    description: |
      When querying partitioned tables, always include partition key in WHERE clause
      to enable partition pruning and minimize locks.

    example_bad: |
      -- Locks ALL 96 partitions (no pruning)
      SELECT * FROM t_f_budget_fact ORDER BY created_at DESC LIMIT 10;

    example_good: |
      -- Locks only ~3 partitions (pruning enabled)
      SELECT * FROM t_f_budget_fact
      WHERE fact_date >= current_date - interval '90 days'
      ORDER BY created_at DESC LIMIT 10;
