# Analytics Endpoints
# Statistics, reports, dashboards

routes:
  # ---------------------------------------------------------------------------
  # QUICK STATS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/quick-stats"
    method: GET
    auth: user
    description: "Dashboard summary statistics"
    query_params:
      period: "today | week | month (default: month)"
    response:
      status: 200
      body:
        total_income: "decimal"
        total_expense: "decimal"
        balance_change: "decimal"
        top_expense_categories:
          - article_id: "integer"
            article_name: "string"
            amount: "decimal"
            percentage: "decimal"
        top_income_categories:
          - # same structure
        transactions_count: "integer"
    service:
      $ref: "../functionality/analytics.yaml#/module"

  - path: "/api/v1/analytics/quick-stats-html"
    method: GET
    auth: user
    description: "Quick stats as HTML (for HTMX)"
    query_params:
      period: "today | week | month"
    response:
      status: 200
      content_type: "text/html"
      template: "partials/quick_stats.html"
    htmx:
      $ref: "../web/htmx-triggers.yaml#/index_page/quick_stats"

  # ---------------------------------------------------------------------------
  # ACCOUNT BALANCES
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/account-balances"
    method: GET
    auth: user
    description: "Current balance per financial center"
    response:
      status: 200
      body:
        - financial_center_id: "integer"
          financial_center_name: "string"
          initial_balance: "decimal"
          current_balance: "decimal"
          income_total: "decimal"
          expense_total: "decimal"
    service:
      $ref: "../functionality/financial-centers.yaml#/module/services/1"

  - path: "/api/v1/analytics/account-balances-html"
    method: GET
    auth: user
    description: "Account balances as HTML (for HTMX)"
    response:
      status: 200
      content_type: "text/html"
      template: "partials/account_balances.html"
    htmx:
      $ref: "../web/htmx-triggers.yaml#/index_page/account_balances"
    security:
      xss_prevention: "html.escape() applied to financial_center name in generated HTML cards"

  # ---------------------------------------------------------------------------
  # PLAN VS FACT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/plan-fact"
    method: GET
    auth: user
    description: "Plan vs fact comparison for bar chart with plan distribution"
    query_params:
      period: "month | quarter | year (optional, calendar periods from 1st day to today)"
      date_from: "YYYY-MM-DD (optional, overrides period)"
      date_to: "YYYY-MM-DD (optional, overrides period)"
      article_type: "income | expense | debit | credit | all (default: expense)"
      chart_mode: "normal | cumulative (default: cumulative)"
      cfo_id: "integer (optional) - Filter by Financial Center ID"
      article_ids: "integer[] (optional) - Filter by category IDs (multiple)"
    response:
      status: 200
      body:
        labels: "array of period labels"
        plan: "array of decimals - distributed plan amounts (cumulative if chart_mode=cumulative)"
        fact: "array of decimals - fact amounts (cumulative if chart_mode=cumulative)"
        plan_period: "array of decimals - original period plan amounts (for tooltips)"
        fact_period: "array of decimals - original period fact amounts (for tooltips)"
        period: "string - period type used"
        article_type: "string"
        chart_mode: "string"
    notes: |
      Plan distribution algorithm:
      - period=month: plan amount / days_in_period (daily average)
      - period=quarter or year: plan amount / months_in_period (monthly average)
      Avoids showing plan only on the fixation date (usually 1st of month).
      Auto-grouping for custom date ranges: ≤31d→daily, 32-91d→weekly, >91d→monthly.

  # ---------------------------------------------------------------------------
  # HEATMAP
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/heatmap"
    method: GET
    auth: user
    description: "Spending pattern heatmap with dynamic aggregation"
    query_params:
      period: "month | quarter | year (optional)"
      date_from: "YYYY-MM-DD (optional, overrides period)"
      date_to: "YYYY-MM-DD (optional, overrides period)"
      article_type: "income | expense | debit | credit | all (default: expense)"
      transaction_filter: "debit | credit | all (optional, takes priority over article_type)"
      record_type: "fact | plan (default: fact)"
      cfo_id: "integer (optional) - Filter by Financial Center ID"
      article_ids: "integer[] (optional) - Filter by category IDs (multiple)"
    response:
      status: 200
      body:
        data: "heatmap matrix data"
        labels_x: "array - column labels (time axis)"
        labels_y: "array - row labels (category or day axis)"
        aggregation: "string - aggregation type used (day | week | month)"
    notes: |
      Dynamic aggregation based on date range:
      - ≤7 days: aggregate by days (horizontal)
      - 7-30 days: aggregate by weeks (days × weeks)
      - >30 days: aggregate by months (weeks × months)

  # ---------------------------------------------------------------------------
  # CATEGORY BREAKDOWN
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/category-breakdown"
    method: GET
    auth: user
    description: "Expense breakdown by category"
    query_params:
      date_from: "YYYY-MM-DD"
      date_to: "YYYY-MM-DD"
      type: "expense | income (default: expense)"
      financial_center_id: "integer (optional)"
    response:
      status: 200
      body:
        - article_id: "integer"
          article_name: "string"
          article_type: "string"
          total_amount: "decimal"
          percentage: "decimal"
          transaction_count: "integer"

  # ---------------------------------------------------------------------------
  # MONTHLY SUMMARY
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/monthly-summary"
    method: GET
    auth: user
    description: "Month-over-month comparison"
    query_params:
      months: "integer (default: 6)"
    response:
      status: 200
      body:
        - month: "YYYY-MM"
          income: "decimal"
          expense: "decimal"
          balance: "decimal"

  # ---------------------------------------------------------------------------
  # FACT HINTS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/fact-hints"
    method: GET
    auth: user
    description: "Suggestions for transaction form"
    query_params:
      article_id: "integer (optional)"
      month: "YYYY-MM (optional)"
    response:
      status: 200
      body:
        recent_amounts:
          - amount: "decimal"
            count: "integer"
        recent_descriptions:
          - description: "string"
            count: "integer"
        suggested_article_id: "integer"

  # ---------------------------------------------------------------------------
  # PLAN HINTS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/plan-hints"
    method: GET
    auth: user
    description: "Hints for plan creation modal (previous month sums)"
    query_params:
      period: "YYYY-MM (required) - Month for which to get hints"
      article_type: "expense | income | debit | credit (default: expense)"
      article_id: "integer (optional) - Category ID"
      financial_center_id: "integer (optional) - Account filter"
    response:
      status: 200
      body:
        prev_period_plan_sum: "decimal (nullable) - Sum of plans for previous month"
        prev_period_fact_sum: "decimal (nullable) - Sum of facts for previous month"
        prev_period: "string - Previous period in YYYY-MM format"
        article_id: "integer (nullable) - Category ID"
        article_name: "string (nullable) - Category name"
        article_type: "string - expense/income/debit/credit"
    notes: |
      Used by plan.html and transfer.js to show clickable hint buttons.
      Example: period=2025-12 → returns November 2025 sums

  # ---------------------------------------------------------------------------
  # PLAN MONTHLY COMPARISON
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/plans/monthly-comparison"
    method: GET
    auth: user
    description: "Compare current month plans with previous month facts/plans"
    query_params:
      planning_month: "YYYY-MM (required) - Month for comparison"
      financial_center_id: "integer (optional)"
      article_type: "expense | income | debit | credit (optional)"
      article_id: "integer (optional)"
    response:
      status: 200
      body:
        current_month:
          month: "YYYY-MM"
          month_name: "string (e.g., 'План Декабрь 2025')"
          record_type: "plan"
          by_type:
            expense: "decimal"
            income: "decimal"
            debit: "decimal"
            credit: "decimal"
          by_category:
            - category_id: "integer"
              category_name: "string"
              category_type: "string"
              amount: "decimal"
          total_records: "integer"
        previous_month:
          month: "YYYY-MM"
          month_name: "string (e.g., 'Факт Ноябрь 2025')"
          record_type: "fact | plan"
          by_type: "same structure"
          by_category: "same structure"
        categories_comparison:
          - category_id: "integer"
            category_name: "string"
            current_amount: "decimal"
            previous_amount: "decimal"
            change: "decimal"
            change_percent: "decimal"
    notes: |
      Uses date range comparison instead of date_trunc for PostgreSQL compatibility.
      Previous month shows 'fact' data if current month is current/past,
      'plan' data if current month is in the future.
      FIX (2025-12-21): Replaced date_trunc with date range to avoid type mismatch.

  # ---------------------------------------------------------------------------
  # TRENDS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/trends"
    method: GET
    auth: user
    description: "Spending trends over time"
    query_params:
      article_id: "integer (optional)"
      period: "daily | weekly | monthly"
      date_from: "YYYY-MM-DD"
      date_to: "YYYY-MM-DD"
    response:
      status: 200
      body:
        labels: "array of dates"
        income: "array of decimals"
        expense: "array of decimals"

  # ---------------------------------------------------------------------------
  # WATERFALL (CASCADE DIAGRAM)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/analytics/waterfall"
    method: GET
    auth: user
    description: "Cumulative flow data for waterfall chart (cascade diagram)"
    query_params:
      period: "month | quarter | year (optional) - Calendar period from 1st day to today"
      date_from: "YYYY-MM-DD (optional) - Start date for custom range (overrides period)"
      date_to: "YYYY-MM-DD (optional) - End date for custom range (overrides period)"
      article_id: "integer (optional) - Filter by specific article (for drill-down)"
      cfo_id: "integer (optional) - Filter by Financial Center ID"
    response:
      status: 200
      body:
        labels: "array of period labels (e.g., 'Янв 2025', 'Фев 2025')"
        income: "array of decimals - Income per period"
        expense: "array of decimals - Expense per period"
        balance: "array of decimals - Cumulative balance"
        categories: "array of arrays - Article breakdown for drill-down (v5.1.3)"
        initial_balance: "decimal - Starting balance from previous period"
        period: "string - Which period type was used"
        year: "integer - Current year"
        article_id: "integer (nullable) - Drill-down filter if active"
        article_name: "string (nullable) - Selected article name if active"
    notes: |
      Aggregation depends on period or date range:
      - period=month: Groups by days (from 1st of month to today)
      - period=quarter: Groups by weeks using date_trunc('week') (from Q start to today)
      - period=year: Groups by months using date_trunc('month') (from Jan 1 to today)
      - Custom date range ≤31 days: Groups by days
      - Custom date range 32-91 days: Groups by weeks using date_trunc('week')
      - Custom date range >91 days: Groups by months using date_trunc('month')

      FIX (2025-12-21): Changed period='year' to use date_trunc('month') for correct
      monthly aggregation. Previously used Fact.fact_date which only counted
      transactions on the 1st of each month.

      FIX (2025-12-21): Changed period='quarter' to use date_trunc('week') for
      consistency with custom date range 32-91 days. Updated week rendering to look
      up data by week_start (Monday) directly instead of iterating through days.

# Frontend
frontend:
  pages:
    - $ref: "../web/templates.yaml#/templates/index"
    - $ref: "../web/templates.yaml#/templates/analytics"
  charts:
    library: "ECharts"
