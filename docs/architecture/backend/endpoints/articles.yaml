# Articles Endpoints
# Budget categories CRUD + hierarchy

routes:
  # ---------------------------------------------------------------------------
  # LIST
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles"
    method: GET
    auth: user
    description: "List all articles (categories)"
    query_params:
      type: "income | expense (optional)"
      parent_id: "integer (optional)"
      include_archived: "boolean (default: false)"
      flat: "boolean (default: false, returns tree if false)"
    response:
      status: 200
      body:
        articles: "array of article objects"
        total: "integer - total count"
        limit: "integer - page size"
        offset: "integer - skip count"
      article_object:
        - id: "integer"
          name: "string"
          type: "income | expense"
          parent_id: "integer (nullable)"
          code: "string (optional)"
          is_active: "boolean"
          children: "array (if flat=false)"
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/1"

  # ---------------------------------------------------------------------------
  # LIST (ADMIN - NON-PAGINATED)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/admin/articles"
    method: GET
    auth: admin
    description: "List all articles with full details (admin only, non-paginated)"
    query_params:
      include_inactive: "boolean (default: true - includes archived categories)"
      type: "income | expense (optional)"
    response:
      status: 200
      body: "List[ArticleResponse] - Direct array (NOT paginated object)"
      article_object:
        - id: "integer"
          name: "string"
          type: "income | expense"
          parent_id: "integer (nullable)"
          code: "string (optional)"
          is_active: "boolean"
          user_id: "integer"
          user_name: "string - first_name from joined User"
          financial_center_ids: "array of integers - linked FCs"
          is_leaf: "boolean - has no children"
          created_at: "datetime"
          updated_at: "datetime"
    note: |
      IMPORTANT: Response format differs from /api/v1/articles:
      - /api/v1/admin/articles returns: List[ArticleResponse] (direct array)
      - /api/v1/articles returns: ArticleListResponse (paginated object with .articles property)

      Frontend (admin_articles.html:350-356) handles both formats:
      - if (isAdmin): articlesData = responseData (direct array)
      - else: articlesData = responseData.articles (extract nested array)
    service:
      $ref: "../functionality/admin.yaml#/module/services/0"

  # ---------------------------------------------------------------------------
  # CREATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles"
    method: POST
    auth: user
    description: "Create new article"
    request:
      body:
        name: "string (required)"
        type: "income | expense (required)"
        parent_id: "integer (optional)"
        code: "string (optional, unique)"
        description: "string (optional)"
    response:
      status: 201
      body:
        id: "integer"
        name: "string"
        type: "string"
        parent_id: "integer"
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/0"
    side_effects:
      - "ArticleHistory record created"
      - "ArticleHierarchy updated (closure table)"
      - "WebSocket broadcast: article_created"

  # ---------------------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}"
    method: GET
    auth: user
    description: "Get article by ID"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        name: "string"
        type: "string"
        parent_id: "integer"
        code: "string"
        description: "string"
        is_active: "boolean"
        created_at: "datetime"
        updated_at: "datetime"
    errors:
      - status: 404
        detail: "Article not found"

  # ---------------------------------------------------------------------------
  # UPDATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}"
    method: PUT
    auth: user
    description: "Update article"
    path_params:
      id: "integer"
    request:
      body:
        name: "string (optional)"
        parent_id: "integer (optional)"
        code: "string (optional)"
        description: "string (optional)"
    response:
      status: 200
      body:
        id: "integer"
        name: "string"
        # ... all fields
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/0"
    side_effects:
      - "Old ArticleHistory closed (is_current=False)"
      - "New ArticleHistory created (is_current=True)"
      - "WebSocket broadcast: article_updated"

  # ---------------------------------------------------------------------------
  # DELETE (ADMIN ONLY)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}"
    method: DELETE
    auth: admin
    description: "Soft delete article"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        message: "Article deleted"
    constraints:
      - "Cannot delete if has facts referencing it"
    errors:
      - status: 400
        detail: "Cannot delete article with existing transactions"

  # ---------------------------------------------------------------------------
  # ARCHIVE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}/archive"
    method: POST
    auth: admin
    description: "Archive article (and optionally children)"
    path_params:
      id: "integer"
    query_params:
      recursive: "boolean (default: false)"
    response:
      status: 200
      body:
        archived_count: "integer"
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/1"

  # ---------------------------------------------------------------------------
  # RESTORE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}/restore"
    method: POST
    auth: admin
    description: "Restore archived article"
    path_params:
      id: "integer"
    query_params:
      recursive: "boolean (default: false)"
    response:
      status: 200
      body:
        restored_count: "integer"
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/1"

  # ---------------------------------------------------------------------------
  # HISTORY
  # ---------------------------------------------------------------------------
  - path: "/api/v1/articles/{article_id}/history"
    method: GET
    auth: admin
    description: "Get article change history (SCD Type 2)"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        - history_id: "integer"
          article_id: "integer"
          name: "string"
          valid_from: "datetime"
          valid_to: "datetime"
          is_current: "boolean"
          change_type: "CREATE | UPDATE | ARCHIVE | RESTORE | DELETE"
          changed_fields: "array of strings"
    service:
      $ref: "../functionality/budget-management.yaml#/module/services/0"

# Models
models:
  - $ref: "../database/dimensions.yaml#/tables/t_d_article"
  - $ref: "../database/history.yaml#/tables/t_d_article_history"
  - $ref: "../database/hierarchy.yaml#/tables/t_d_article_hierarchy"

# Schemas
schemas:
  path: "backend/app/schemas/article.py"
  classes:
    - ArticleCreate
    - ArticleUpdate
    - ArticleResponse
    - ArticleTreeResponse
    - ArticleHistoryResponse
