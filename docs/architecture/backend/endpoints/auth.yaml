# Auth Endpoints
# Authentication and authorization

meta:
  version: "1.0.0"
  description: "Authentication and authorization API endpoints"
  created: "2025-11-01"
  last_updated: "2026-03-03"
  status: "active"
  base_path: "/api/v1/auth"
  authentication_methods:
    - "Telegram OAuth"
    - "Email + Password"
    - "JWT Token Refresh"
    - "2FA (Email OTP)"
  related_docs:
    - "../functionality/authentication.yaml"
    - "../authentication.md"
    - "./webauthn.yaml"

routes:
  # ---------------------------------------------------------------------------
  # TELEGRAM OAUTH
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/telegram"
    method: POST
    auth: public
    description: "Telegram OAuth login"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/1"
    request:
      body:
        id: "integer (Telegram user ID)"
        first_name: "string"
        last_name: "string (optional)"
        username: "string (optional)"
        photo_url: "string (optional)"
        auth_date: "integer (Unix timestamp)"
        hash: "string (HMAC-SHA256)"
    response:
      status: 200
      body:
        user:
          id: "integer"
          telegram_id: "integer"
          username: "string"
          is_admin: "boolean"
        access_token: "string (also set as httpOnly cookie)"
    errors:
      - status: 401
        detail: "Invalid Telegram auth data"
      - status: 403
        detail: "User not found (must be created by admin first)"
    flow:
      $ref: "../flows/telegram-oauth.yaml"
    security:
      auth_date_expiration: "300 seconds (5 minutes) — requests older than 5 min are rejected"
      hash_validation: |
        HMAC-SHA256 over sorted key=value pairs (excluding 'hash' field).
        validate_telegram_auth() uses data.get('hash') without mutating the caller's dict
        (dict is NOT modified — 'hash' key is excluded via filter in sorted(), not via pop()).
      implementation: "backend/app/services/telegram_auth.py:validate_telegram_auth()"

  # ---------------------------------------------------------------------------
  # TOKEN REFRESH
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/refresh"
    method: POST
    auth: public
    description: "Refresh JWT access token"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/0"
    request:
      body:
        refresh_token: "string"
    response:
      status: 200
      body:
        access_token: "string"
        refresh_token: "string (new)"
    errors:
      - status: 401
        detail: "Invalid or expired refresh token"

  # ---------------------------------------------------------------------------
  # LOGOUT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/logout"
    method: POST
    auth: user
    description: "Logout and invalidate tokens"
    response:
      status: 200
      body:
        message: "Successfully logged out"
    actions:
      - "Delete refresh token from database"
      - "Clear access_token cookie"

  # ---------------------------------------------------------------------------
  # EMAIL/PASSWORD MANAGEMENT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/login"
    method: POST
    auth: public
    description: "Email/password login with 2FA support"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/2"
    request:
      body:
        email: "string"
        password: "string"
    response:
      status: 200
      body:
        requires_2fa: "boolean"
        session_id: "string (if 2FA required)"
        user: "object (if 2FA not required)"
        access_token: "string (if 2FA not required)"
    errors:
      - status: 401
        detail: "Invalid credentials"

  - path: "/api/v1/auth/set-password"
    method: POST
    auth: user
    description: "Set password for first-time users (Telegram → Email upgrade)"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/3"
    request:
      body:
        email: "string"
        password: "string (min 8 chars)"
    response:
      status: 200
      body:
        message: "Password set successfully"
    errors:
      - status: 400
        detail: "Password too weak"
      - status: 409
        detail: "Email already registered"

  - path: "/api/v1/auth/add-email"
    method: POST
    auth: user
    description: "Add email to Telegram-only account"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/2"
    request:
      body:
        email: "string"
    response:
      status: 200
      body:
        message: "Email added successfully"

  # ---------------------------------------------------------------------------
  # 2FA MANAGEMENT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/setup-2fa"
    method: POST
    auth: user
    description: "Generate TOTP secret and QR code"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/4"
    response:
      status: 200
      body:
        secret: "string (Base32)"
        qr_code_url: "string (otpauth:// URI)"
        backup_codes: "array of strings (10 codes)"

  - path: "/api/v1/auth/verify-2fa-setup"
    method: POST
    auth: user
    description: "Verify TOTP code and enable 2FA"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/4"
    request:
      body:
        code: "string (6 digits)"
    response:
      status: 200
      body:
        message: "2FA enabled successfully"
    errors:
      - status: 400
        detail: "Invalid code"

  - path: "/api/v1/auth/verify-2fa"
    method: POST
    auth: public
    description: "Verify TOTP code during login"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/5"
    request:
      body:
        session_id: "string"
        code: "string (6 digits or backup code)"
    response:
      status: 200
      body:
        user: "object"
        access_token: "string"
    errors:
      - status: 401
        detail: "Invalid code or session expired"

  - path: "/api/v1/auth/disable-2fa"
    method: POST
    auth: user
    description: "Disable TOTP 2FA"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/4"
    request:
      body:
        code: "string (6 digits or backup code)"
    response:
      status: 200
      body:
        message: "2FA disabled successfully"

  - path: "/api/v1/auth/backup-codes"
    method: POST
    auth: user
    description: "Regenerate backup codes"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/4"
    request:
      body:
        code: "string (6 digits, current TOTP code required)"
    response:
      status: 200
      body:
        backup_codes: "array of strings (10 new codes)"

  - path: "/api/v1/auth/setup-and-verify-2fa"
    method: POST
    auth: user
    description: "Combined setup + verify in one step"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/4"
    request:
      body:
        secret: "string (Base32)"
        code: "string (6 digits)"
    response:
      status: 200
      body:
        message: "2FA enabled successfully"

  # ---------------------------------------------------------------------------
  # AUTH STATUS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/methods"
    method: GET
    auth: user
    description: "Get available auth methods for current user"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/2"
    response:
      status: 200
      body:
        has_password: "boolean"
        has_2fa: "boolean"
        has_webauthn: "boolean"
        telegram_linked: "boolean"

  # ---------------------------------------------------------------------------
  # TELEGRAM LINKING
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/link-telegram"
    method: POST
    auth: user
    description: "Link Telegram account to existing email account"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/1"
    request:
      body:
        telegram_id: "integer"
        hash: "string (HMAC-SHA256)"
        auth_date: "integer (Unix timestamp)"
    response:
      status: 200
      body:
        message: "Telegram account linked successfully"
    errors:
      - status: 409
        detail: "Telegram account already linked to another user"

  - path: "/api/v1/auth/telegram-login"
    method: GET
    auth: public
    description: "Telegram Login Widget redirect endpoint"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/1"
    request:
      query_params:
        id: "integer"
        first_name: "string"
        hash: "string"
        auth_date: "integer"
    response:
      status: 302
      redirect: "/dashboard (with access_token cookie)"

  - path: "/api/v1/auth/telegram-callback"
    method: GET
    auth: public
    description: "Telegram OAuth callback"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/1"
    notes: "Same as telegram-login but different path for compatibility"

  # ---------------------------------------------------------------------------
  # WEBAPP AUTH
  # ---------------------------------------------------------------------------
  - path: "/api/v1/webapp/validate"
    method: POST
    auth: public
    description: "Validate Telegram Web App initData"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/6"
    request:
      body:
        initData: "string (Telegram Web App init data)"
    response:
      status: 200
      body:
        access_token: "string"
        user:
          id: "integer"
          telegram_id: "integer"
    errors:
      - status: 401
        detail: "Invalid initData"

  # ---------------------------------------------------------------------------
  # USER INFO
  # ---------------------------------------------------------------------------
  - path: "/api/v1/users/me"
    method: GET
    auth: user
    description: "Get current user info"
    response:
      status: 200
      body:
        id: "integer"
        telegram_id: "integer"
        email: "string (optional)"
        username: "string"
        first_name: "string"
        is_admin: "boolean"
        is_active: "boolean"
        created_at: "datetime"
        last_login_at: "datetime"

# Models
models:
  - $ref: "../database/dimensions.yaml#/tables/t_d_user"
  - $ref: "../database/support.yaml#/tables/t_refresh_token"
  - $ref: "../database/support.yaml#/tables/t_2fa_session"

# Schemas
schemas:
  path: "backend/app/schemas/auth.py"
  classes:
    - TelegramAuthRequest
    - TokenResponse
    - RegisterRequest
    - LoginEmailRequest
    - TwoFactorVerifyRequest
    - UserResponse
