# Facts Endpoints
# Transactions CRUD

routes:
  # ---------------------------------------------------------------------------
  # LIST
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts"
    method: GET
    auth: user
    description: "List transactions with filters"
    query_params:
      date_from: "YYYY-MM-DD (optional)"
      date_to: "YYYY-MM-DD (optional)"
      article_id: "integer (optional)"
      financial_center_id: "integer (optional)"
      cost_center_id: "integer (optional)"
      record_type: "fact | plan (optional)"
      page: "integer (default: 1)"
      per_page: "integer (default: 50, max: 100)"
    response:
      status: 200
      body:
        facts: "array of fact objects"
        total: "integer - total count"
        limit: "integer - page size"
        offset: "integer - skip count"
      fact_object:
        - id: "integer"
          user_id: "integer"
          article_id: "integer"
          article_name: "string"
          financial_center_id: "integer"
          cost_center_id: "integer"
          amount: "decimal"
          fact_date: "YYYY-MM-DD"
          description: "string"
          record_type: "fact | plan"
          transfer_id: "UUID (nullable)"
          created_at: "datetime"

  # ---------------------------------------------------------------------------
  # CREATE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts"
    method: POST
    auth: user
    description: "Create new transaction"
    request:
      body:
        article_id: "integer (required)"
        amount: "decimal (required, > 0)"
        fact_date: "YYYY-MM-DD (required, cannot be in future for record_type=fact)"
        financial_center_id: "integer (required)"
        cost_center_id: "integer (optional)"
        description: "string (optional)"
        record_type: "fact | plan (default: fact)"
        sync_hash: "string (optional, for offline deduplication)"
    validation:
      date_timezone: "SYSTEM_TIMEZONE (from config, default UTC)"
      date_rules:
        - "For record_type=fact: fact_date <= today + 1 day (timezone tolerance)"
        - "For record_type=plan: future dates allowed"
        - "Both: date must be within 10 years from today"
      timezone_tolerance: |
        +1 day tolerance allows users in timezones ahead of UTC (up to UTC+14)
        to create transactions with their local "today" date even when
        server time (UTC) is still on the previous day.
    response:
      status: 201
      body:
        id: "integer"
        # ... all fields
    errors:
      - status: 404
        detail: "Article not found"
      - status: 422
        detail: "Счёт с id=X не найден"
        description: "Financial center does not exist"
      - status: 422
        detail: "Счёт 'Name' архивирован. Выберите активный счёт."
        description: "Financial center is archived"
      - status: 422
        detail: "Место затрат с id=X не найдено"
        description: "Cost center does not exist (if provided)"
      - status: 422
        detail: "Место затрат 'Name' архивировано"
        description: "Cost center is archived (if provided)"
    service:
      $ref: "../functionality/budget-management.yaml#/module"
    side_effects:
      - "BudgetFactHistory record created"
      - "WebSocket broadcast: fact_created"
      - "Balance aggregation update"
    deduplication:
      field: "sync_hash"
      behavior: "Skip if exists, return existing record"
    flow:
      $ref: "../flows/create-transaction.yaml"

  # ---------------------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts/{fact_id}"
    method: GET
    auth: user
    description: "Get transaction by ID"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        # ... all fields
    errors:
      - status: 404
        detail: "Transaction not found"

  # ---------------------------------------------------------------------------
  # UPDATE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts/{fact_id}"
    method: PUT
    auth: user
    description: "Update transaction"
    path_params:
      id: "integer"
    request:
      body:
        article_id: "integer (optional)"
        amount: "decimal (optional)"
        fact_date: "YYYY-MM-DD (optional)"
        financial_center_id: "integer (optional)"
        cost_center_id: "integer (optional)"
        description: "string (optional)"
    response:
      status: 200
      body:
        id: "integer"
        # ... all fields
    side_effects:
      - "Old BudgetFactHistory closed"
      - "New BudgetFactHistory created"
      - "WebSocket broadcast: fact_updated"

  # ---------------------------------------------------------------------------
  # DELETE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts/{fact_id}"
    method: DELETE
    auth: user
    description: "Delete transaction"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        message: "Transaction deleted"
    side_effects:
      - "BudgetFactHistory with change_type=DELETE"
      - "WebSocket broadcast: fact_deleted"

  # ---------------------------------------------------------------------------
  # RECENT (HTMX)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/facts/recent-html"
    method: GET
    auth: user
    description: "Recent transactions as HTML (for HTMX)"
    query_params:
      limit: "integer (default: 10)"
    response:
      status: 200
      content_type: "text/html"
      template: "partials/recent_transactions.html"
    htmx:
      $ref: "../web/htmx-triggers.yaml#/index_page/recent_transactions"

# Models
models:
  - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
  - $ref: "../database/history.yaml#/tables/t_f_budget_fact_history"

# Schemas
schemas:
  path: "backend/app/schemas/fact.py"
  classes:
    - FactCreate
    - FactUpdate
    - FactResponse
    - FactListResponse
    - FactFilter
