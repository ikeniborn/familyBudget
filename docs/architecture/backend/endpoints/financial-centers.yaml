# Financial Centers Endpoints
# Bank accounts, wallets, cash management

routes:
  # ---------------------------------------------------------------------------
  # LIST
  # ---------------------------------------------------------------------------
  - path: "/api/v1/financial-centers"
    method: GET
    auth: user
    description: "List all financial centers"
    query_params:
      include_archived: "boolean (default: false)"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          code: "string (optional)"
          description: "string (optional)"
          initial_balance: "decimal"
          current_balance: "decimal (calculated)"
          is_active: "boolean"
          created_at: "datetime"
    service:
      $ref: "../functionality/financial-centers.yaml#/module"

  # ---------------------------------------------------------------------------
  # CREATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/financial-centers"
    method: POST
    auth: user
    description: "Create new financial center"
    request:
      body:
        name: "string (required)"
        code: "string (optional, unique)"
        description: "string (optional)"
        initial_balance: "decimal (default: 0)"
    response:
      status: 201
      body:
        id: "integer"
        name: "string"
        code: "string"
        initial_balance: "decimal"
    service:
      $ref: "../functionality/financial-centers.yaml#/module/services/0"
    side_effects:
      - "FinancialCenterHistory record created"

  # ---------------------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------------------
  - path: "/api/v1/financial-centers/{financial_center_id}"
    method: GET
    auth: user
    description: "Get financial center by ID"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        name: "string"
        code: "string"
        description: "string"
        initial_balance: "decimal"
        current_balance: "decimal"
        is_active: "boolean"
    errors:
      - status: 404
        detail: "Financial center not found"

  # ---------------------------------------------------------------------------
  # UPDATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/financial-centers/{financial_center_id}"
    method: PUT
    auth: user
    description: "Update financial center"
    path_params:
      id: "integer"
    request:
      body:
        name: "string (optional)"
        code: "string (optional)"
        description: "string (optional)"
        initial_balance: "decimal (optional)"
    response:
      status: 200
      body:
        id: "integer"
        # ... all fields
    service:
      $ref: "../functionality/financial-centers.yaml#/module/services/0"
    side_effects:
      - "FinancialCenterHistory updated (SCD Type 2)"
      - "Balance aggregation recalculation (if initial_balance changed)"

  # ---------------------------------------------------------------------------
  # DELETE (ADMIN ONLY)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/financial-centers/{financial_center_id}"
    method: DELETE
    auth: admin
    description: "Soft delete financial center"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        message: "Financial center deleted"
    constraints:
      - "Cannot delete if has facts referencing it"
    errors:
      - status: 400
        detail: "Cannot delete financial center with existing transactions"

# Models
models:
  - $ref: "../database/dimensions.yaml#/tables/t_d_financial_center"
  - $ref: "../database/history.yaml#/tables/t_d_financial_center_history"
  - $ref: "../database/support.yaml#/tables/t_agg_financial_center_balance_monthly"

# Schemas
schemas:
  path: "backend/app/schemas/financial_center.py"
  classes:
    - FinancialCenterCreate
    - FinancialCenterUpdate
    - FinancialCenterResponse
    - FinancialCenterWithBalance
