# Health Endpoints
# Health checks, readiness probes

routes:
  # ---------------------------------------------------------------------------
  # PING
  # ---------------------------------------------------------------------------
  - path: "/ping"
    method: GET
    auth: public
    description: "Simple ping endpoint"
    response:
      status: 200
      body:
        message: "pong"
    use_case: "Load balancer health check"

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  - path: "/health"
    method: GET
    auth: public
    description: "Basic health check"
    response:
      status: 200
      body:
        status: "healthy"
        timestamp: "ISO 8601"
    use_case: "Kubernetes liveness probe"

  # ---------------------------------------------------------------------------
  # READY
  # ---------------------------------------------------------------------------
  - path: "/ready"
    method: GET
    auth: public
    description: "Readiness probe (checks dependencies)"
    checks:
      - database: "PostgreSQL connection"
    response:
      status: 200
      body:
        status: "ready"
        database: "connected"
    errors:
      - status: 503
        body:
          status: "not ready"
          database: "disconnected"
    use_case: "Kubernetes readiness probe"

  # ---------------------------------------------------------------------------
  # DETAILED HEALTH
  # ---------------------------------------------------------------------------
  - path: "/health/detailed"
    method: GET
    auth: admin
    description: "Detailed health diagnostics"
    response:
      status: 200
      body:
        status: "healthy | degraded | unhealthy"
        version: "string (app version)"
        uptime_seconds: "float (seconds)"
        timestamp: "ISO 8601"
        components:
          database:
            status: "up | down"
            message: "Database operational. Users: N, Facts: M"
            latency_ms: "float"
          redis:
            status: "up | down"
            message: "Memory: XMB, Keys: N, Hit ratio: Y%"
            latency_ms: "float"
          deferred_operations:
            status: "up | down | degraded"
            message: "Queue: N, Processed: M, Failed: K, DLQ: L"
            note: "Displays as 'Deferred operations' in UI (/admin/monitoring)"
          backup:
            status: "up | down"
            message: "Latest: YYYY-MM-DD HH:MM:SS, Size: XMB, Total: N"
        system:
          platform: "string"
          platform_version: "string"
          python_version: "string"
          cpu_count: "integer"
          cpu_percent: "float"
          memory_total_gb: "float"
          memory_used_gb: "float"
          memory_percent: "float"
          disk_total_gb: "float"
          disk_used_gb: "float"
          disk_percent: "float"
    use_case: "Admin monitoring dashboard (/admin/monitoring)"

# Endpoint File
endpoint_file:
  path: "backend/app/api/health.py"
  loc: 447

# Integration
integration:
  docker_compose:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: "30s"
      timeout: "10s"
      retries: 3

  kubernetes:
    livenessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 30

    readinessProbe:
      httpGet:
        path: "/ready"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10

# Monitoring
monitoring:
  script: "logs.sh"
  features:
    - "Container status"
    - "Health checks"
    - "Backend errors"
    - "Database status"
    - "Resource usage"
