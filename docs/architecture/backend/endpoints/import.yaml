# Import Endpoints
# CSV and Google Sheets import

routes:
  # ---------------------------------------------------------------------------
  # UPLOAD
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/upload"
    method: POST
    auth: user
    description: "Upload CSV file for import"
    request:
      content_type: "multipart/form-data"
      body:
        file: "CSV file"
        bank_provider_id: "integer (optional, auto-detect if not provided)"
    response:
      status: 201
      body:
        upload_id: "integer"
        detected_bank: "string"
        detected_encoding: "string"
        detected_delimiter: "string"
        row_count: "integer"
        columns: "array of strings"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/4"
    models:
      - $ref: "../database/support.yaml#/tables/t_import_file_upload"

  # ---------------------------------------------------------------------------
  # ANALYZE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/analyze"
    method: POST
    auth: user
    description: "Analyze CSV structure and suggest column mapping"
    request:
      body:
        upload_id: "integer"
    response:
      status: 200
      body:
        suggested_mapping:
          date_column: "string"
          amount_column: "string"
          description_column: "string"
          category_column: "string (optional)"
        sample_rows: "array (first 5 rows)"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/5"

  # ---------------------------------------------------------------------------
  # PREVIEW
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/preview"
    method: POST
    auth: user
    description: "Preview import with column mapping"
    request:
      body:
        upload_id: "integer"
        column_mapping:
          date: "string (column name)"
          amount: "string (column name)"
          description: "string (column name)"
          category: "string (column name, optional)"
        article_id: "integer (default article for all rows)"
        financial_center_id: "integer (optional)"
    response:
      status: 200
      body:
        valid_rows: "integer"
        invalid_rows: "integer"
        warnings: "array of strings"
        preview:
          - date: "YYYY-MM-DD"
            amount: "decimal"
            description: "string"
            article_name: "string"
            validation_errors: "array (if any)"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/6"

  # ---------------------------------------------------------------------------
  # EXECUTE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/execute"
    method: POST
    auth: user
    description: "Execute import"
    request:
      body:
        upload_id: "integer"
        column_mapping:
          # same as preview
        article_id: "integer"
        financial_center_id: "integer (optional)"
        skip_duplicates: "boolean (default: true)"
    response:
      status: 201
      body:
        imported_count: "integer"
        skipped_count: "integer"
        error_count: "integer"
        facts_created:
          - id: "integer"
            amount: "decimal"
            fact_date: "YYYY-MM-DD"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/8"
    side_effects:
      - "BudgetFact records created"
      - "ImportStaging records cleared"
      - "WebSocket broadcasts for each fact"
    flow:
      $ref: "../flows/csv-import.yaml"

  # ---------------------------------------------------------------------------
  # TEMPLATES
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/templates"
    method: GET
    auth: user
    description: "Get user's saved import templates"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          bank_provider_id: "integer"
          column_mapping: "object"
          created_at: "datetime"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/9"

  - path: "/api/v1/import/templates"
    method: POST
    auth: user
    description: "Save import template"
    request:
      body:
        name: "string"
        bank_provider_id: "integer"
        column_mapping: "object"
    response:
      status: 201

  # ---------------------------------------------------------------------------
  # GOOGLE SHEETS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/google-sheets/upload"
    method: POST
    auth: user
    description: "Upload data from public Google Sheets URL (alternative to CSV file upload)"
    request:
      content_type: "application/json"
      body:
        google_sheets_url: "string (public Google Sheets URL, e.g. https://docs.google.com/spreadsheets/d/ID/edit#gid=0)"
        bank_provider_id: "integer (required, bank provider for column mapping)"
    response:
      status: 201
      body:
        file_id: "integer (ImportFileUpload record ID)"
        file_name: "string (generated filename based on spreadsheet ID)"
        bank_provider_id: "integer"
        status: "string (analyzed)"
    errors:
      - status: 404
        detail: "Bank provider not found"
      - status: 400
        detail: "Google Sheets URL validation errors"
      - status: 403
        detail: "Google Sheets не публична (requires public sharing)"
    service:
      $ref: "../functionality/csv-import.yaml#/module/services/2"
    notes: |
      - Parses Google Sheets URL to extract spreadsheet_id and sheet_gid
      - Fetches public sheet as CSV via Google's export endpoint
      - Saves CSV to temp file and creates ImportFileUpload record
      - Returns same response as /import/upload for workflow consistency
      - Subsequent steps (mapping, preview, execute) work identically

  - path: "/api/v1/import/google-sheets"
    method: POST
    auth: user
    deprecated: true
    description: "[DEPRECATED] Use /google-sheets/upload instead"
    notes: "Legacy endpoint, replaced by /google-sheets/upload for consistency"

  # ---------------------------------------------------------------------------
  # COLUMN MAPPINGS (SHARED PER BANK)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/mappings/{bank_provider_id}"
    method: GET
    auth: user
    description: "Get saved mapping for bank (shared across all users)"
    notes: |
      Mappings are SHARED per bank - any user can use any bank's mapping.
      Returns 404 with default_mapping if no saved mapping exists.
    response:
      status: 200
      body:
        mapping_id: "integer"
        bank_provider_id: "integer"
        mapping: "object (CSV column → budget field)"
        transformations: "object (optional)"

  - path: "/api/v1/import/mappings"
    method: POST
    auth: user
    description: "Save or update mapping (shared per bank)"
    notes: |
      Mappings are SHARED per bank - any user can create or update.
      user_id is recorded to track who last updated (informational only).
    request:
      body:
        bank_provider_id: "integer"
        mapping: "object"
        transformations: "object (optional)"
    response:
      status: 200
      body:
        mapping_id: "integer"
        bank_provider_id: "integer"
        mapping: "object"
        transformations: "object"

  # ---------------------------------------------------------------------------
  # BANK PROVIDERS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/import/banks"
    method: GET
    auth: user
    description: "List active bank providers"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          code: "string"
          active: "boolean"

  - path: "/api/v1/import/banks"
    method: POST
    auth: user
    description: "Create new bank provider"
    request:
      body:
        code: "string (unique, 2-50 chars, alphanumeric + underscore)"
        name: "string (2-255 chars)"
    response:
      status: 201
      body:
        id: "integer"
        code: "string"
        name: "string"
        active: "boolean"
    errors:
      - status: 400
        detail: "Bank with this code already exists"

  - path: "/api/v1/import/banks/{bank_id}"
    method: DELETE
    auth: user
    description: "Delete bank provider with cascade (deletes all related data)"
    cascade_deletes:
      - "ImportStaging records for this bank"
      - "ImportFileUpload records for this bank"
      - "ImportColumnMapping records for all users"
    response:
      status: 200
      body:
        message: "string"
        bank_id: "integer"
        cascade_deleted:
          staging: "integer"
          uploads: "integer"
          mappings: "integer"
    errors:
      - status: 404
        detail: "Bank not found"

# Models
models:
  - $ref: "../database/support.yaml#/tables/t_import_staging"
  - $ref: "../database/support.yaml#/tables/t_import_file_upload"
  - $ref: "../database/support.yaml#/tables/t_import_column_mapping"
  - $ref: "../database/dimensions.yaml#/tables/t_d_import_template"
  - $ref: "../database/dimensions.yaml#/tables/t_d_bank_provider"
