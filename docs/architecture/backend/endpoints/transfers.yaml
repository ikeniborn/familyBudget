# Transfers Endpoints
# Inter-account transfers

routes:
  # ---------------------------------------------------------------------------
  # CREATE TRANSFER
  # ---------------------------------------------------------------------------
  - path: "/api/v1/transfers"
    method: POST
    auth: user
    description: "Create transfer between financial centers"
    request:
      body:
        from_financial_center_id: "integer (required)"
        from_article_id: "integer (required, type=debit)"
        from_cost_center_id: "integer (optional, DEPRECATED - always null from UI)"
        to_financial_center_id: "integer (required)"
        to_article_id: "integer (required, type=credit)"
        to_cost_center_id: "integer (optional, DEPRECATED - always null from UI)"
        amount: "decimal (required, > 0)"
        transfer_date: "YYYY-MM-DD (required)"
        description: "string (optional)"
        record_type: "fact | plan (default: fact)"
    response:
      status: 201
      body:
        transfer_id: "UUID"
        expense_fact:
          id: "integer"
          financial_center_id: "integer"
          amount: "decimal"
          # ... other fields
        income_fact:
          id: "integer"
          financial_center_id: "integer"
          amount: "decimal"
          # ... other fields
    implementation:
      description: |
        Creates TWO linked BudgetFact records:
        1. Expense from source financial_center
        2. Income to destination financial_center
        Both linked via transfer_id (UUID)
    service:
      $ref: "../functionality/transfers.yaml#/module"
    side_effects:
      - "Two BudgetFact records created"
      - "Two BudgetFactHistory records created"
      - "WebSocket broadcast: transfer_created"
      - "Balance aggregation update for both accounts"
    validation:
      - "from_financial_center_id != to_financial_center_id"
      - "Both financial centers must exist and be active"
      - "amount > 0"
      - "For record_type='fact': transfer_date <= today + 1 day (timezone tolerance)"
      - "Uses SYSTEM_TIMEZONE from config for date comparison (same as facts.py)"

  # ---------------------------------------------------------------------------
  # GET TRANSFER
  # ---------------------------------------------------------------------------
  - path: "/api/v1/transfers/{transfer_id}"
    method: GET
    auth: user
    description: "Get transfer details by transfer_id"
    path_params:
      transfer_id: "UUID"
    response:
      status: 200
      body:
        transfer_id: "UUID"
        expense_fact:
          id: "integer"
          financial_center_id: "integer"
          financial_center_name: "string"
          amount: "decimal"
          fact_date: "YYYY-MM-DD"
        income_fact:
          id: "integer"
          financial_center_id: "integer"
          financial_center_name: "string"
          amount: "decimal"
          fact_date: "YYYY-MM-DD"
        description: "string"
        created_at: "datetime"
    errors:
      - status: 404
        detail: "Transfer not found"

# Frontend Integration
frontend:
  modal:
    $ref: "../web/templates.yaml#/components/modal_transfer"
  js_module:
    $ref: "../web/js-modules.yaml#/modules/transfer"

# Models
models:
  - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"

# Note: No separate Transfer model - uses BudgetFact with transfer_id field
transfer_field:
  table: "t_f_budget_fact"
  column: "transfer_id"
  type: "UUID"
  description: "Links paired expense/income facts for transfers"
