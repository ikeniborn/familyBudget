# WebAuthn Endpoints
# FIDO2/WebAuthn biometric authentication (v6.5.0+)

routes:
  # ---------------------------------------------------------------------------
  # REGISTRATION
  # ---------------------------------------------------------------------------
  - path: "/api/v1/webauthn/register/options"
    method: POST
    auth: user
    description: "Generate registration challenge and options"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    request:
      body:
        device_name: "string (optional, default: 'Authenticator')"
    response:
      status: 200
      body:
        options:
          challenge: "string (Base64URL)"
          rp:
            name: "string"
            id: "string (domain)"
          user:
            id: "string (Base64URL-encoded user ID)"
            name: "string (email or username)"
            displayName: "string (full name)"
          pubKeyCredParams:
            - type: "public-key"
              alg: -7  # ES256
            - type: "public-key"
              alg: -257  # RS256
          timeout: 60000
          attestation: "none"
          authenticatorSelection:
            authenticatorAttachment: "platform"  # TouchID, FaceID, Windows Hello
            requireResidentKey: false
            userVerification: "required"
    errors:
      - status: 401
        detail: "User not authenticated"
    notes: "Challenge expires in 10 minutes"

  - path: "/api/v1/webauthn/register/verify"
    method: POST
    auth: user
    description: "Verify attestation and store credential"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    request:
      body:
        credential:
          id: "string (Base64URL credential ID)"
          rawId: "string (Base64URL)"
          response:
            clientDataJSON: "string (Base64URL)"
            attestationObject: "string (Base64URL)"
          type: "public-key"
        device_name: "string (optional)"
    response:
      status: 200
      body:
        credential_id: "string"
        device_name: "string"
        created_at: "string (ISO 8601)"
    errors:
      - status: 400
        detail: "Invalid attestation response"
      - status: 401
        detail: "Challenge expired or invalid"
      - status: 409
        detail: "Credential already registered"
    database_writes:
      - table: t_d_webauthn_credential
        action: INSERT
      - table: t_f_webauthn_challenge
        action: UPDATE (consumed_at)
      - table: t_f_webauthn_audit_log
        action: INSERT (registration_success/failure)

  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------
  - path: "/api/v1/webauthn/authenticate/options"
    method: POST
    auth: public
    description: "Generate authentication challenge"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    request:
      body:
        email: "string (optional, for user identification)"
    response:
      status: 200
      body:
        challenge: "string (Base64URL)"
        timeout: 60000
        rpId: "string (domain)"
        userVerification: "required"
        allowCredentials: "array (optional, user-specific credentials)"
    errors:
      - status: 404
        detail: "User has no registered credentials"

  - path: "/api/v1/webauthn/authenticate/verify"
    method: POST
    auth: public
    description: "Verify assertion and issue JWT tokens"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    request:
      body:
        credential:
          id: "string (Base64URL credential ID)"
          rawId: "string (Base64URL)"
          response:
            clientDataJSON: "string (Base64URL)"
            authenticatorData: "string (Base64URL)"
            signature: "string (Base64URL)"
            userHandle: "string (Base64URL, optional)"
          type: "public-key"
    response:
      status: 200
      body:
        user:
          id: "integer"
          email: "string"
          username: "string"
          is_admin: "boolean"
        access_token: "string (also set as httpOnly cookie)"
    errors:
      - status: 400
        detail: "Invalid assertion response"
      - status: 401
        detail: "Challenge expired, invalid signature, or credential revoked"
      - status: 403
        detail: "Sign count regression detected (credential cloned)"
    database_writes:
      - table: t_d_webauthn_credential
        action: UPDATE (sign_count, last_used_at)
      - table: t_f_webauthn_challenge
        action: UPDATE (consumed_at)
      - table: t_f_webauthn_audit_log
        action: INSERT (authentication_success/failure)
    notes: "Sign count validation prevents cloned credentials"

  # ---------------------------------------------------------------------------
  # CREDENTIAL MANAGEMENT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/webauthn/credentials"
    method: GET
    auth: user
    description: "List user's registered credentials"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    response:
      status: 200
      body:
        credentials:
          - id: "integer"
            credential_id: "string (Base64URL)"
            device_name: "string"
            backup_eligible: "boolean"
            backup_state: "boolean"
            last_used_at: "string (ISO 8601, nullable)"
            created_at: "string (ISO 8601)"

  - path: "/api/v1/webauthn/credentials/{credential_id}"
    method: DELETE
    auth: user
    description: "Revoke (soft delete) credential"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    request:
      path_params:
        credential_id: "integer"
    response:
      status: 200
      body:
        message: "Credential revoked successfully"
    errors:
      - status: 403
        detail: "Cannot revoke credential belonging to another user"
      - status: 404
        detail: "Credential not found"
    database_writes:
      - table: t_d_webauthn_credential
        action: UPDATE (is_revoked=true, revoked_at)
      - table: t_f_webauthn_audit_log
        action: INSERT (credential_revoked)

  # ---------------------------------------------------------------------------
  # STATUS CHECK
  # ---------------------------------------------------------------------------
  - path: "/api/v1/auth/webauthn-status"
    method: GET
    auth: user
    description: "Check if user has WebAuthn credentials"
    service:
      $ref: "../functionality/authentication.yaml#/module/services/7"
    response:
      status: 200
      body:
        has_credentials: "boolean"
        credential_count: "integer"
        browser_support: "boolean (checked client-side)"

frontend_integration:
  onboarding_flow:
    $ref: "../web/js-modules.yaml#/modules/webauthnManager"
  browser_detection:
    file: "frontend/web/static/js/webauthn/browserDetection.ts"
    checks:
      - "window.PublicKeyCredential"
      - "navigator.credentials.create"
      - "navigator.credentials.get"

security_notes:
  - "Challenges single-use (consumed_at)"
  - "Challenges expire after 10 minutes"
  - "Sign count regression detection prevents cloning"
  - "Soft revoke preserves audit trail"
  - "User verification required (PIN/biometric)"
  - "Platform authenticators preferred (TouchID, FaceID)"
