# Database Objects Index
# PostgreSQL tables, indexes, constraints

summary:
  total_tables: 36
  dimensions: 10
  facts: 2
  history: 8
  hierarchy: 2
  support: 14

categories:
  dimensions:
    description: "Dimension tables (t_d_*) - Master data"
    file: "./dimensions.yaml"
    tables:
      - t_d_user
      - t_d_article
      - t_d_financial_center
      - t_d_cost_center
      - t_d_shopping_list
      - t_d_shopping_list_item
      - t_d_store
      - t_d_product_group
      - t_d_import_template
      - t_d_bank_provider

  facts:
    description: "Fact tables (t_f_*) - Transactional data"
    file: "./facts.yaml"
    tables:
      - t_f_budget_fact
      - t_f_shopping_list

  history:
    description: "History tables (*_history) - SCD Type 2"
    file: "./history.yaml"
    tables:
      - t_d_user_history
      - t_d_article_history
      - t_d_financial_center_history
      - t_d_cost_center_history
      - t_f_budget_fact_history
      - t_d_shopping_list_history
      - t_d_shopping_list_item_history
      - t_d_store_history

  hierarchy:
    description: "Closure tables for hierarchical queries"
    file: "./hierarchy.yaml"
    tables:
      - t_d_article_hierarchy
      - t_d_product_group_hierarchy

  support:
    description: "Support tables - Auth, notifications, import"
    file: "./support.yaml"
    tables:
      - t_refresh_token
      - t_two_factor_session
      - t_notification
      - t_import_staging
      - t_import_file_upload
      - t_import_column_mapping
      - alembic_version

# Database Schema Pattern
patterns:
  scd_type_1:
    description: "Slowly Changing Dimension Type 1 - In-place updates"
    used_in:
      - t_d_user
      - t_d_article
      - t_d_financial_center
      - t_d_cost_center
    implementation: |
      Main table contains ONLY current state.
      UPDATE overwrites previous values.
      History tracked in separate *_history table.

  scd_type_2:
    description: "Slowly Changing Dimension Type 2 - Full history"
    used_in:
      - t_d_user_history
      - t_d_article_history
      - t_d_financial_center_history
      - t_d_cost_center_history
      - t_f_budget_fact_history
    columns:
      - valid_from: "Timestamp when record became effective"
      - valid_to: "Timestamp when record was superseded (NULL = current)"
      - is_current: "Boolean flag for current record"
      - change_type: "CREATE | UPDATE | DELETE"

  closure_table:
    description: "Closure Table pattern for hierarchical queries"
    used_in:
      - t_d_article_hierarchy
      - t_d_product_group_hierarchy
    columns:
      - ancestor_id: "Parent node"
      - descendant_id: "Child node"
      - depth: "Distance between nodes"
    benefits:
      - "O(1) subtree queries"
      - "O(1) ancestor queries"
      - "Efficient breadcrumbs"

  partitioned_table:
    description: "Range partitioning by month"
    used_in:
      - t_f_budget_fact
    partitions: 96
    range: "2023-01 to 2030-12"
    benefits:
      - "Fast date range queries"
      - "Easy data archival"
      - "Partition pruning"

