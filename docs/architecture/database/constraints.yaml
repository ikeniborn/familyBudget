# Database Constraints
# FK, CHECK, UNIQUE constraints

constraint_types:
  primary_key:
    description: "Unique identifier for each row"
    naming: "pk_{table_name}"

  foreign_key:
    description: "Referential integrity between tables"
    naming: "fk_{table}_{column}"

  unique:
    description: "Unique value constraint"
    naming: "uq_{table}_{column(s)}"

  check:
    description: "Data validation constraint"
    naming: "ck_{table}_{description}"

constraints:
  # ===========================================================================
  # USER CONSTRAINTS
  # ===========================================================================
  t_d_user:
    primary_key:
      name: pk_user
      columns: [id]

    unique:
      - name: uq_user_telegram_id
        columns: [telegram_id]
        description: "One user per Telegram account"

      - name: uq_user_email
        columns: [email]
        where: "email IS NOT NULL"
        description: "Unique email (partial)"

    check:
      - name: ck_user_email_format
        condition: "email ~* '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$'"
        description: "Valid email format"

  # ===========================================================================
  # ARTICLE CONSTRAINTS
  # ===========================================================================
  t_d_article:
    primary_key:
      name: pk_article
      columns: [id]

    foreign_keys:
      - name: fk_article_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

      - name: fk_article_parent
        columns: [parent_id]
        references:
          table: t_d_article
          columns: [id]
        on_delete: SET NULL
        description: "Self-referencing for hierarchy"

    check:
      - name: ck_article_type
        condition: "type IN ('income', 'expense', 'transfer')"
        description: "Valid article type"

      - name: ck_article_no_self_parent
        condition: "id != parent_id"
        description: "Article cannot be its own parent"

      - name: ck_article_color
        condition: "color IS NULL OR color ~* '^#[0-9A-Fa-f]{6}$'"
        description: "Valid hex color code"

  # ===========================================================================
  # BUDGET FACT CONSTRAINTS
  # ===========================================================================
  t_f_budget_fact:
    primary_key:
      name: pk_budget_fact
      columns: [id, fact_date]
      note: "Composite PK required for partitioning"

    foreign_keys:
      - name: fk_bf_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

      - name: fk_bf_article
        columns: [article_id]
        references:
          table: t_d_article
          columns: [id]
        on_delete: RESTRICT
        description: "Cannot delete article with facts"

      - name: fk_bf_financial_center
        columns: [financial_center_id]
        references:
          table: t_d_financial_center
          columns: [id]
        on_delete: SET NULL

      - name: fk_bf_cost_center
        columns: [cost_center_id]
        references:
          table: t_d_cost_center
          columns: [id]
        on_delete: SET NULL

    check:
      - name: ck_bf_amount_not_zero
        condition: "amount != 0"
        description: "Amount must be non-zero"

      - name: ck_bf_record_type
        condition: "record_type IN ('fact', 'plan')"
        description: "Valid record type (fact = actual, plan = planned)"
        note: "Updated 2025-12-20: previously used income/expense/transfer_out/transfer_in"

      - name: ck_bf_fact_date_range
        condition: "fact_date >= '2023-01-01' AND fact_date < '2031-01-01'"
        description: "Date within partitioned range"

  # ===========================================================================
  # FINANCIAL CENTER CONSTRAINTS
  # ===========================================================================
  t_d_financial_center:
    primary_key:
      name: pk_financial_center
      columns: [id]

    foreign_keys:
      - name: fk_fc_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

    unique:
      - name: uq_fc_user_name
        columns: [user_id, name]
        description: "Unique name per user"

    check:
      - name: ck_fc_currency
        condition: "currency ~* '^[A-Z]{3}$'"
        description: "Valid ISO 4217 currency code"

      - name: ck_fc_color
        condition: "color IS NULL OR color ~* '^#[0-9A-Fa-f]{6}$'"
        description: "Valid hex color code"

  # ===========================================================================
  # COST CENTER CONSTRAINTS
  # ===========================================================================
  t_d_cost_center:
    primary_key:
      name: pk_cost_center
      columns: [id]

    foreign_keys:
      - name: fk_cc_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

    unique:
      - name: uq_cc_user_name
        columns: [user_id, name]
        description: "Unique name per user"

  # ===========================================================================
  # SHOPPING LIST CONSTRAINTS
  # ===========================================================================
  t_d_shopping_list:
    primary_key:
      name: pk_shopping_list
      columns: [id]

    foreign_keys:
      - name: fk_sl_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

    check:
      - name: ck_sl_status
        condition: "status IN ('active', 'completed', 'archived')"
        description: "Valid list status"

  t_d_shopping_list_item:
    primary_key:
      name: pk_shopping_list_item
      columns: [id]

    foreign_keys:
      - name: fk_sli_shopping_list
        columns: [shopping_list_id]
        references:
          table: t_d_shopping_list
          columns: [id]
        on_delete: CASCADE

      - name: fk_sli_store
        columns: [store_id]
        references:
          table: t_d_store
          columns: [id]
        on_delete: SET NULL

      - name: fk_sli_product_group
        columns: [product_group_id]
        references:
          table: t_d_product_group
          columns: [id]
        on_delete: SET NULL

      - name: fk_sli_checked_by
        columns: [checked_by_user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: SET NULL

    check:
      - name: ck_sli_quantity_positive
        condition: "quantity IS NULL OR quantity > 0"
        description: "Quantity must be positive"

      - name: ck_sli_price_positive
        condition: "price IS NULL OR price >= 0"
        description: "Price must be non-negative"

  # ===========================================================================
  # HIERARCHY CONSTRAINTS
  # ===========================================================================
  t_d_article_hierarchy:
    primary_key:
      name: pk_article_hierarchy
      columns: [id]

    foreign_keys:
      - name: fk_ah_ancestor
        columns: [ancestor_id]
        references:
          table: t_d_article
          columns: [id]
        on_delete: CASCADE

      - name: fk_ah_descendant
        columns: [descendant_id]
        references:
          table: t_d_article
          columns: [id]
        on_delete: CASCADE

    unique:
      - name: uq_ah_pair
        columns: [ancestor_id, descendant_id]
        description: "No duplicate relationships"

    check:
      - name: ck_ah_depth_positive
        condition: "depth >= 0"
        description: "Depth must be non-negative"

  t_d_product_group_hierarchy:
    primary_key:
      name: pk_product_group_hierarchy
      columns: [id]

    foreign_keys:
      - name: fk_pgh_ancestor
        columns: [ancestor_id]
        references:
          table: t_d_product_group
          columns: [id]
        on_delete: CASCADE

      - name: fk_pgh_descendant
        columns: [descendant_id]
        references:
          table: t_d_product_group
          columns: [id]
        on_delete: CASCADE

    unique:
      - name: uq_pgh_pair
        columns: [ancestor_id, descendant_id]

    check:
      - name: ck_pgh_depth_positive
        condition: "depth >= 0"

  # ===========================================================================
  # HISTORY TABLE CONSTRAINTS
  # ===========================================================================
  history_tables_common:
    note: "All history tables share these constraint patterns"

    check:
      - name: ck_{table}_change_type
        condition: "change_type IN ('CREATE', 'UPDATE', 'DELETE')"

      - name: ck_{table}_valid_period
        condition: "valid_to IS NULL OR valid_to > valid_from"
        description: "valid_to must be after valid_from"

  # ===========================================================================
  # SUPPORT TABLE CONSTRAINTS
  # ===========================================================================
  t_refresh_token:
    primary_key:
      name: pk_refresh_token
      columns: [id]

    foreign_keys:
      - name: fk_rt_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

    unique:
      - name: uq_rt_token
        columns: [token]

    check:
      - name: ck_rt_expires_future
        condition: "expires_at > created_at"
        description: "Expiry must be after creation"

  t_notification:
    primary_key:
      name: pk_notification
      columns: [id]

    foreign_keys:
      - name: fk_notif_user
        columns: [user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: CASCADE

      - name: fk_notif_created_by
        columns: [created_by_user_id]
        references:
          table: t_d_user
          columns: [id]
        on_delete: SET NULL

    check:
      - name: ck_notif_type
        condition: "type IN ('info', 'warning', 'error', 'success', 'reminder')"

# On Delete Behavior Summary
on_delete_summary:
  CASCADE:
    description: "Delete child records when parent deleted"
    used_for:
      - "User → all owned records"
      - "ShoppingList → items"
      - "ImportFileUpload → staging"
      - "Hierarchy closure records"

  SET_NULL:
    description: "Set FK to NULL when parent deleted"
    used_for:
      - "Article parent_id (orphan becomes root)"
      - "BudgetFact optional FKs (financial_center, cost_center)"

  RESTRICT:
    description: "Prevent deletion if children exist"
    used_for:
      - "Article with BudgetFacts (must archive instead)"

# Constraint Validation
validation:
  check_all_fk:
    description: "Verify all FK constraints are satisfied"
    sql: |
      -- Check for orphaned budget facts
      SELECT COUNT(*) FROM t_f_budget_fact bf
      WHERE NOT EXISTS (SELECT 1 FROM t_d_article a WHERE a.id = bf.article_id);

      -- Check for orphaned shopping list items
      SELECT COUNT(*) FROM t_d_shopping_list_item sli
      WHERE NOT EXISTS (SELECT 1 FROM t_d_shopping_list sl WHERE sl.id = sli.shopping_list_id);
