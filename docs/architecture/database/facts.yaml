# Fact Tables
# Transactional data (t_f_*)

meta:
  version: "1.0.0"
  description: "Fact tables (transactional data) - t_f_* pattern"
  created: "2025-11-01"
  last_updated: "2026-01-21"
  status: "active"
  pattern: "Star schema with dimension FK references"
  partitioning: "Monthly partitions for budget_fact"
  related_docs:
    - "./dimensions.yaml"
    - "./indexes.yaml"
    - "../endpoints/facts.yaml"
    - "../functionality/budget-management.yaml"

tables:
  # ---------------------------------------------------------------------------
  # BUDGET FACT
  # ---------------------------------------------------------------------------
  t_f_budget_fact:
    model: BudgetFact
    file: "backend/app/models/budget_fact.py"
    pattern: "Partitioned (monthly)"
    description: "Financial transactions (income, expense, transfer)"

    partitioning:
      type: RANGE
      column: fact_date
      partitions: "96+ (auto-created)"
      range:
        initial: "2023-01-01 to 2030-12-31"
        dynamic: "Any date supported via auto-partition"
      partition_naming: "t_f_budget_fact_YYYY_MM"
      auto_partition:
        enabled: true
        trigger: "trg_budget_fact_ensure_partition"
        function: "ensure_budget_fact_partition(DATE)"
        description: |
          BEFORE INSERT trigger automatically creates missing partitions.
          Supports dates outside initial 2023-2030 range.
        indexes_created:
          - "GIN index on description (gin_trgm_ops)"
      benefits:
        - "Fast date range queries (partition pruning)"
        - "Easy archival (DROP PARTITION)"
        - "Parallel scans per partition"
        - "No 409 errors for dates outside initial range"

    columns:
      - name: id
        type: SERIAL
        note: "NOT globally unique, unique within partition"
      - name: user_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
        description: "Creator (not owner - shared budget)"
      - name: article_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_article"
      - name: financial_center_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_financial_center"
      - name: cost_center_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_cost_center"
      - name: amount
        type: DECIMAL(15,2) NOT NULL
        check: "amount != 0"
      - name: fact_date
        type: DATE NOT NULL
        description: "Transaction date (partition key)"
      - name: description
        type: TEXT
      - name: record_type
        type: VARCHAR(20) NOT NULL
        check: "record_type IN ('income', 'expense', 'transfer_out', 'transfer_in')"
      - name: transfer_id
        type: UUID
        description: "Links paired transfer facts"
      - name: recurring_plan_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_recurring_plan"
        description: "Reference to recurring plan template (if auto-generated)"
        note: "No FK constraint due to partitioning - integrity maintained by service layer"
      - name: created_at
        type: TIMESTAMP DEFAULT NOW()
      - name: updated_at
        type: TIMESTAMP

    primary_key:
      columns: [id, fact_date]
      note: "Composite PK required for partitioning"

    indexes:
      - $ref: "./indexes.yaml#/indexes/idx_bf_user_id"
      - $ref: "./indexes.yaml#/indexes/idx_bf_article_id"
      - $ref: "./indexes.yaml#/indexes/idx_bf_fact_date"
      - $ref: "./indexes.yaml#/indexes/idx_bf_financial_center_id"
      - $ref: "./indexes.yaml#/indexes/idx_bf_transfer_id"
      - $ref: "./indexes.yaml#/indexes/idx_bf_record_type"
      - $ref: "./indexes.yaml#/indexes/idx_bf_recurring_plan_id"

    history_table:
      $ref: "./history.yaml#/tables/t_f_budget_fact_history"

    record_types:
      income:
        description: "Money received"
        amount_sign: "positive"
        article_type: "income"

      expense:
        description: "Money spent"
        amount_sign: "negative"
        article_type: "expense"

      transfer_out:
        description: "Money sent to another account"
        amount_sign: "negative"
        article_type: "transfer"
        requires: "transfer_id"

      transfer_in:
        description: "Money received from another account"
        amount_sign: "positive"
        article_type: "transfer"
        requires: "transfer_id"

    transfer_logic:
      description: |
        Transfers create TWO BudgetFact records with same transfer_id:
        1. transfer_out (negative amount) from source FinancialCenter
        2. transfer_in (positive amount) to target FinancialCenter
      invariant: "SUM(amount) WHERE transfer_id = X MUST equal 0"
      implementation:
        $ref: "../functionality/transfers.yaml#/module/transfer_logic"

    services:
      - $ref: "../functionality/budget-management.yaml#/module/services/2"

    endpoints:
      - $ref: "../endpoints/facts.yaml#/routes"
      - $ref: "../endpoints/transfers.yaml#/routes"

    aggregations:
      balance_by_fc:
        description: "Current balance per financial center"
        sql: |
          SELECT
            fc.id,
            fc.name,
            fc.initial_balance + COALESCE(SUM(bf.amount), 0) as current_balance
          FROM t_d_financial_center fc
          LEFT JOIN t_f_budget_fact bf ON bf.financial_center_id = fc.id
          GROUP BY fc.id
        service:
          $ref: "../functionality/financial-centers.yaml#/module/services/1"

      monthly_summary:
        description: "Income/expense totals by month"
        sql: |
          SELECT
            DATE_TRUNC('month', fact_date) as month,
            SUM(CASE WHEN record_type = 'income' THEN amount ELSE 0 END) as income,
            SUM(CASE WHEN record_type = 'expense' THEN ABS(amount) ELSE 0 END) as expense
          FROM t_f_budget_fact
          GROUP BY DATE_TRUNC('month', fact_date)
        endpoints:
          $ref: "../endpoints/analytics.yaml#/routes"

  # ---------------------------------------------------------------------------
  # SHOPPING LIST FACT
  # ---------------------------------------------------------------------------
  t_f_shopping_list:
    model: ShoppingListFact
    file: "backend/app/models/shopping_list.py"
    pattern: "Standard fact"
    description: "Shopping list completion events"
    note: "Optional - tracks when lists were completed and converted to expenses"

    columns:
      - name: id
        type: SERIAL PRIMARY KEY
      - name: shopping_list_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_shopping_list"
      - name: budget_fact_id
        type: INTEGER
        fk:
          $ref: "#/tables/t_f_budget_fact"
        description: "Created expense fact (if converted)"
      - name: total_amount
        type: DECIMAL(15,2)
      - name: items_count
        type: INTEGER
      - name: completed_at
        type: TIMESTAMP DEFAULT NOW()
      - name: completed_by_user_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"

    services:
      - $ref: "../functionality/shopping-lists.yaml#/module/services/4"

  # ---------------------------------------------------------------------------
  # SHOPPING LIST ITEM (Header+Lines pattern - Lines)
  # ---------------------------------------------------------------------------
  t_f_shopping_list_item:
    model: ShoppingListItem
    file: "backend/app/models/shopping_list_item.py"
    pattern: "Header+Lines (Lines)"
    description: "Individual items in shopping lists"

    columns:
      - name: id
        type: SERIAL PRIMARY KEY
      - name: creator_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
        description: "User who created the item (audit only)"
      - name: shopping_list_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_shopping_list"
        on_delete: CASCADE
        description: "Parent shopping list (Header)"
      - name: store_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_store"
        description: "Which store to buy from (REQUIRED)"
      - name: product_group_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_product_group"
        description: "Product category (REQUIRED)"
      - name: product_name
        type: VARCHAR(255) NOT NULL
        description: "Product name (e.g., 'Organic Milk 1L')"
      - name: quantity
        type: NUMERIC(10,3)
        description: "Quantity to buy (optional, e.g., 2.5)"
      - name: unit
        type: VARCHAR(50)
        description: "Unit of measurement (e.g., 'kg', 'liters', 'pieces')"
      - name: comment
        type: TEXT
        description: "Optional notes (e.g., 'buy on sale')"
      - name: is_completed
        type: BOOLEAN DEFAULT FALSE
        description: "Completion flag (True = bought, False = needed)"
      - name: completed_at
        type: TIMESTAMP
        description: "When item was marked as completed"
      - name: sync_status
        type: VARCHAR(20) DEFAULT 'synced'
        description: "Offline sync: synced, pending, conflict"
      - name: version
        type: INTEGER DEFAULT 1
        description: "Optimistic locking version"
      - name: deleted_at
        type: TIMESTAMP
        description: "Soft delete timestamp (NULL = active)"
      - name: last_modified_by
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
        description: "User who last modified this item"
      - name: created_at
        type: TIMESTAMP DEFAULT NOW()
      - name: updated_at
        type: TIMESTAMP DEFAULT NOW()

    indexes:
      - name: idx_sli_creator_id
        columns: [creator_id]
      - name: idx_sli_shopping_list_id
        columns: [shopping_list_id]
      - name: idx_sli_store_id
        columns: [store_id]
      - name: idx_sli_product_group_id
        columns: [product_group_id]
      - name: idx_sli_product_name
        columns: [product_name]
      - name: idx_sli_is_completed
        columns: [is_completed]
      - name: idx_sli_sync_status
        columns: [sync_status]
      - name: idx_sli_deleted_at
        columns: [deleted_at]

    shared_architecture:
      pattern: "SHARED across all users"
      rules:
        - "Any user can CREATE/UPDATE/DELETE any item"
        - "creator_id is audit only (NOT for filtering)"
        - "Items belong to a shopping list via shopping_list_id FK"

    offline_sync:
      sync_status:
        - "synced: Item synchronized with server"
        - "pending: Created/updated offline, not yet synced"
        - "conflict: Conflicting changes (offline + online)"
      optimistic_locking: "version field incremented on each update"
      conflict_detection: "client version != server version"

    soft_delete:
      description: "deleted_at NULL = active, NOT NULL = deleted"
      purpose:
        - "Keep for autocomplete history"
        - "Conflict resolution"
        - "Audit trail"

    services:
      - $ref: "../functionality/shopping-lists.yaml#/module/services/3"

    endpoints:
      - $ref: "../endpoints/shopping.yaml#/routes"

    notes: |
      Header+Lines pattern: ShoppingList (Header) → ShoppingListItem (Lines).
      All users can add/edit/delete any item (SHARED architecture).

      Offline sync support:
        - sync_status tracks synchronization state
        - version field for optimistic locking
        - Conflict resolution: user chooses server/client/merge

      Soft delete preserves autocomplete history and audit trail.

  # ---------------------------------------------------------------------------
  # WEBAUTHN CHALLENGE (v6.5.0+)
  # ---------------------------------------------------------------------------
  t_f_webauthn_challenge:
    model: WebAuthnChallenge
    file: "backend/app/models/webauthn_challenge.py"
    pattern: "Ephemeral fact (10-min TTL)"
    description: "Temporary challenges for WebAuthn registration/authentication"

    columns:
      - name: id
        type: SERIAL PRIMARY KEY
      - name: challenge
        type: TEXT UNIQUE NOT NULL
        description: "Base64URL-encoded challenge (32 bytes)"
      - name: user_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
        description: "Nullable for authentication challenges"
      - name: challenge_type
        type: VARCHAR(20) NOT NULL
        description: "'registration' or 'authentication'"
      - name: created_at
        type: TIMESTAMP DEFAULT NOW()
      - name: expires_at
        type: TIMESTAMP NOT NULL
        description: "created_at + 10 minutes"
      - name: consumed_at
        type: TIMESTAMP
        description: "Single-use enforcement"
      - name: ip_address
        type: INET
      - name: user_agent
        type: TEXT

    indexes:
      - name: idx_webauthn_challenge_challenge
        columns: [challenge]
        type: btree
        unique: true
      - name: idx_webauthn_challenge_expires_at
        columns: [expires_at]
        type: btree
        description: "For cleanup job"
      - name: idx_webauthn_challenge_consumed_at
        columns: [consumed_at]
        type: btree

    fk_to:
      - t_d_user (optional)

    services:
      - $ref: "../functionality/authentication.yaml#/module/services/7"

    cleanup:
      job: "Hourly scheduler task"
      query: "DELETE FROM t_f_webauthn_challenge WHERE expires_at < NOW()"

    notes: |
      Challenges expire after 10 minutes.
      Single-use: consumed_at prevents replay attacks.
      Registration challenges: user_id NOT NULL.
      Authentication challenges: user_id NULL (public challenge).

# Star Schema
star_schema:
  fact_table: t_f_budget_fact
  dimensions:
    - table: t_d_user
      join: "budget_fact.user_id = user.id"
      cardinality: "many-to-one"

    - table: t_d_article
      join: "budget_fact.article_id = article.id"
      cardinality: "many-to-one"

    - table: t_d_financial_center
      join: "budget_fact.financial_center_id = financial_center.id"
      cardinality: "many-to-one"
      nullable: true

    - table: t_d_cost_center
      join: "budget_fact.cost_center_id = cost_center.id"
      cardinality: "many-to-one"
      nullable: true

  diagram: |
    ┌─────────────┐     ┌──────────────────┐     ┌─────────────────┐
    │  t_d_user   │     │ t_f_budget_fact  │     │   t_d_article   │
    │             │◄────│                  │────►│                 │
    │ (dimension) │     │     (fact)       │     │   (dimension)   │
    └─────────────┘     │                  │     └─────────────────┘
                        │                  │
    ┌─────────────────┐ │                  │ ┌─────────────────┐
    │ t_d_financial_  │◄┤                  ├►│ t_d_cost_center │
    │    center       │ │                  │ │                 │
    │   (dimension)   │ └──────────────────┘ │   (dimension)   │
    └─────────────────┘                      └─────────────────┘

# Performance Notes
performance:
  partition_pruning:
    description: |
      PostgreSQL automatically prunes partitions based on fact_date filter.
      Query: WHERE fact_date BETWEEN '2024-01-01' AND '2024-01-31'
      Scans: ONLY t_f_budget_fact_2024_01 partition
    critical: true

  index_usage:
    recommended_queries:
      - "Filter by user_id + fact_date range"
      - "Filter by article_id + fact_date range"
      - "Filter by financial_center_id"
      - "Lookup by transfer_id (exact match)"

  avoid:
    - "SELECT * without date filter (full scan all partitions)"
    - "ORDER BY id (not meaningful across partitions)"
