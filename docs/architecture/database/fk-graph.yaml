# ===========================================================================
# FK DIRECTION SUMMARY
# ===========================================================================
fk_directions:
  t_d_user:
    referenced_by:
      - t_d_article.user_id
      - t_d_financial_center.user_id
      - t_d_cost_center.user_id
      - t_d_shopping_list.user_id
      - t_d_store.user_id
      - t_d_product_group.user_id
      - t_f_budget_fact.user_id
      - t_refresh_token.user_id
      - t_two_factor_session.user_id
      - t_notification.user_id
      - t_notification.created_by_user_id
      - t_d_shopping_list_item.checked_by_user_id
      - t_import_file_upload.user_id
      - t_d_import_template.user_id
      - "*_history.user_id (various)"

  t_d_article:
    references:
      - t_d_user (user_id)
      - t_d_article (parent_id, self-reference)
    referenced_by:
      - t_f_budget_fact.article_id
      - t_d_article_hierarchy.ancestor_id
      - t_d_article_hierarchy.descendant_id
      - t_import_staging.mapped_article_id

  t_d_financial_center:
    references:
      - t_d_user (user_id)
    referenced_by:
      - t_f_budget_fact.financial_center_id

  t_d_cost_center:
    references:
      - t_d_user (user_id)
    referenced_by:
      - t_f_budget_fact.cost_center_id

  t_d_shopping_list:
    references:
      - t_d_user (user_id)
    referenced_by:
      - t_d_shopping_list_item.shopping_list_id

  t_d_shopping_list_item:
    references:
      - t_d_shopping_list (shopping_list_id)
      - t_d_store (store_id)
      - t_d_product_group (product_group_id)
      - t_d_user (checked_by_user_id)

  t_f_budget_fact:
    references:
      - t_d_user (user_id)
      - t_d_article (article_id)
      - t_d_financial_center (financial_center_id)
      - t_d_cost_center (cost_center_id)

  t_import_file_upload:
    references:
      - t_d_user (user_id)
      - t_d_bank_provider (bank_provider_id)
    referenced_by:
      - t_import_staging.upload_id
      - t_import_column_mapping.upload_id

# ===========================================================================
# DELETE CASCADE PATHS
# ===========================================================================
delete_cascade_paths:
  user_deletion:
    description: "What happens when a user is deleted"
    cascade:
      - t_d_user
      - "→ t_d_article (CASCADE)"
      - "  → t_d_article_hierarchy (CASCADE)"
      - "  → t_d_article_history (orphaned, fact_id becomes stale)"
      - "→ t_d_financial_center (CASCADE)"
      - "→ t_d_cost_center (CASCADE)"
      - "→ t_d_shopping_list (CASCADE)"
      - "  → t_d_shopping_list_item (CASCADE)"
      - "→ t_d_store (CASCADE)"
      - "→ t_d_product_group (CASCADE)"
      - "  → t_d_product_group_hierarchy (CASCADE)"
      - "→ t_f_budget_fact (CASCADE)"
      - "→ t_refresh_token (CASCADE)"
      - "→ t_notification (CASCADE)"
      - "→ t_import_file_upload (CASCADE)"
      - "  → t_import_staging (CASCADE)"
      - "  → t_import_column_mapping (CASCADE)"
    warning: "User deletion removes ALL user data!"

  article_deletion:
    description: "What happens when an article is deleted"
    behavior:
      - "If article has facts: RESTRICT (blocked)"
      - "If no facts:"
      - "  → t_d_article_hierarchy (CASCADE)"
      - "  → Children articles: parent_id SET NULL (become root)"
    recommended: "Soft delete (is_active = FALSE) instead of hard delete"

  shopping_list_deletion:
    description: "What happens when a shopping list is deleted"
    cascade:
      - t_d_shopping_list
      - "→ t_d_shopping_list_item (CASCADE)"

# ===========================================================================
# CIRCULAR REFERENCES
# ===========================================================================
circular_references:
  - table: t_d_article
    type: "Self-reference"
    column: parent_id
    note: "Article can reference itself as parent (hierarchy)"

  - table: t_d_product_group
    type: "Self-reference"
    column: parent_id
    note: "Product group can reference itself as parent"

  - table: t_notification
    type: "Same-table FK"
    columns: [user_id, created_by_user_id]
    note: "Both reference t_d_user (different semantic meaning)"

# ===========================================================================
