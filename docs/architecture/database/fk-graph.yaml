    ┌───────────────────────┐
    │   t_f_budget_fact     │
    │      (FACT)           │
    └───────────────────────┘
    ▲           ▲           ▲
    │           │           │
    │  ┌────────┴────────┐  │
    │  │                 │  │
    ┌──┴────┐     ┌──────┴──┐
    │t_d_   │     │t_d_cost_│
