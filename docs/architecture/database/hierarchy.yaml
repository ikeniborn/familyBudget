# Hierarchy Tables
# Closure Table pattern for hierarchical queries

pattern:
  name: "Closure Table"
  description: |
    Stores ALL ancestor-descendant relationships for efficient hierarchical queries.
    Each node has a self-referencing row (ancestor_id = descendant_id, depth = 0).
    Enables O(1) queries for subtrees, ancestors, and paths.

  columns:
    - ancestor_id: "Parent/grandparent node"
    - descendant_id: "Child/grandchild node"
    - depth: "Distance between nodes (0 = self)"

  operations:
    get_subtree:
      description: "Get all descendants of a node"
      complexity: "O(n) where n = subtree size"
      sql: |
        SELECT d.*
        FROM t_d_article d
        JOIN t_d_article_hierarchy h ON d.id = h.descendant_id
        WHERE h.ancestor_id = :parent_id

    get_ancestors:
      description: "Get all ancestors of a node"
      complexity: "O(d) where d = depth"
      sql: |
        SELECT a.*
        FROM t_d_article a
        JOIN t_d_article_hierarchy h ON a.id = h.ancestor_id
        WHERE h.descendant_id = :child_id
        ORDER BY h.depth DESC

    get_depth:
      description: "Get depth of a node"
      complexity: "O(1)"
      sql: |
        SELECT MAX(depth)
        FROM t_d_article_hierarchy
        WHERE descendant_id = :node_id

    get_path:
      description: "Get path from root to node (breadcrumbs)"
      complexity: "O(d)"
      sql: |
        SELECT a.id, a.name
        FROM t_d_article a
        JOIN t_d_article_hierarchy h ON a.id = h.ancestor_id
        WHERE h.descendant_id = :node_id
        ORDER BY h.depth DESC

    is_ancestor:
      description: "Check if A is ancestor of B"
      complexity: "O(1)"
      sql: |
        SELECT EXISTS(
          SELECT 1 FROM t_d_article_hierarchy
          WHERE ancestor_id = :a AND descendant_id = :b
        )

tables:
  # ---------------------------------------------------------------------------
  # ARTICLE HIERARCHY
  # ---------------------------------------------------------------------------
  t_d_article_hierarchy:
    model: ArticleHierarchy
    file: "backend/app/models/article_hierarchy.py"
    main_table:
      $ref: "./dimensions.yaml#/tables/t_d_article"
    description: "Closure table for budget category hierarchy"

    columns:
      - name: id
        type: SERIAL PRIMARY KEY
      - name: ancestor_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_article"
        on_delete: CASCADE
      - name: descendant_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_article"
        on_delete: CASCADE
      - name: depth
        type: INTEGER NOT NULL
        check: "depth >= 0"

    constraints:
      - name: uq_article_hierarchy_pair
        type: UNIQUE
        columns: [ancestor_id, descendant_id]
        description: "Prevent duplicate relationships"

    indexes:
      - name: idx_ah_ancestor_id
        columns: [ancestor_id]
        description: "For get_subtree queries"
      - name: idx_ah_descendant_id
        columns: [descendant_id]
        description: "For get_ancestors queries"
      - name: idx_ah_depth
        columns: [depth]
        description: "For filtering by depth level"

    maintenance:
      on_insert_node:
        description: "When adding a new node"
        steps:
          - "INSERT self-reference: (new_id, new_id, 0)"
          - "INSERT relationships: COPY from parent with depth + 1"
        sql: |
          -- Self-reference
          INSERT INTO t_d_article_hierarchy (ancestor_id, descendant_id, depth)
          VALUES (:new_id, :new_id, 0);

          -- Inherit parent's ancestors
          INSERT INTO t_d_article_hierarchy (ancestor_id, descendant_id, depth)
          SELECT h.ancestor_id, :new_id, h.depth + 1
          FROM t_d_article_hierarchy h
          WHERE h.descendant_id = :parent_id;

      on_delete_node:
        description: "When deleting a node"
        steps:
          - "DELETE all relationships where node is ancestor OR descendant"
        sql: |
          DELETE FROM t_d_article_hierarchy
          WHERE ancestor_id = :node_id OR descendant_id = :node_id;

      on_move_node:
        description: "When moving node to new parent"
        steps:
          - "DELETE old ancestor relationships (except self)"
          - "INSERT new ancestor relationships from new parent"
        sql: |
          -- Remove old ancestors (keep subtree intact)
          DELETE FROM t_d_article_hierarchy
          WHERE descendant_id IN (
            SELECT descendant_id FROM t_d_article_hierarchy
            WHERE ancestor_id = :node_id
          )
          AND ancestor_id IN (
            SELECT ancestor_id FROM t_d_article_hierarchy
            WHERE descendant_id = :node_id AND ancestor_id != :node_id
          );

          -- Add new ancestors
          INSERT INTO t_d_article_hierarchy (ancestor_id, descendant_id, depth)
          SELECT p.ancestor_id, c.descendant_id, p.depth + c.depth + 1
          FROM t_d_article_hierarchy p
          CROSS JOIN t_d_article_hierarchy c
          WHERE p.descendant_id = :new_parent_id
            AND c.ancestor_id = :node_id;

    services:
      - $ref: "../functionality/budget-management.yaml#/module/services/1"

    frontend:
      - $ref: "../web/js-modules.yaml#/modules/hierarchyView"

  # ---------------------------------------------------------------------------
  # PRODUCT GROUP HIERARCHY
  # ---------------------------------------------------------------------------
  t_d_product_group_hierarchy:
    model: ProductGroupHierarchy
    file: "backend/app/models/product_group_hierarchy.py"
    main_table:
      $ref: "./dimensions.yaml#/tables/t_d_product_group"
    description: "Closure table for product group hierarchy"

    columns:
      - name: id
        type: SERIAL PRIMARY KEY
      - name: ancestor_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_product_group"
        on_delete: CASCADE
      - name: descendant_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_product_group"
        on_delete: CASCADE
      - name: depth
        type: INTEGER NOT NULL
        check: "depth >= 0"

    constraints:
      - name: uq_product_group_hierarchy_pair
        type: UNIQUE
        columns: [ancestor_id, descendant_id]

    indexes:
      - name: idx_pgh_ancestor_id
        columns: [ancestor_id]
      - name: idx_pgh_descendant_id
        columns: [descendant_id]

    services:
      - $ref: "../functionality/shopping-lists.yaml#/module/services/3"

# Comparison with Alternatives
alternatives:
  adjacency_list:
    pattern: "parent_id column"
    pros:
      - "Simple to understand"
      - "Easy INSERT/UPDATE"
    cons:
      - "Recursive queries for subtree (slow)"
      - "Multiple queries for ancestors"
    used_in: "t_d_article.parent_id (as supplement)"

  nested_sets:
    pattern: "lft/rgt columns"
    pros:
      - "Fast subtree queries"
      - "Fast ancestor queries"
    cons:
      - "Complex INSERT/DELETE (renumber all)"
      - "Poor write performance"
    used_in: "Not used"

  closure_table:
    pattern: "Separate relationship table"
    pros:
      - "Fast subtree queries"
      - "Fast ancestor queries"
      - "Moderate INSERT/DELETE complexity"
      - "Supports multiple hierarchies"
    cons:
      - "Additional storage"
      - "Must maintain separately from main table"
    used_in:
      - "t_d_article_hierarchy"
      - "t_d_product_group_hierarchy"

# Frontend Integration
frontend:
  tree_rendering:
    description: "How hierarchy is rendered in UI"
    components:
      - $ref: "../web/js-modules.yaml#/modules/hierarchyView"
      - $ref: "../web/js-modules.yaml#/modules/choicesCategoryTree"
    data_format: |
      API returns flat list with parent_id.
      Frontend builds tree structure client-side.
      Closure table used for server-side filtering.
