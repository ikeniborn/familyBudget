      - name: idx_bfh_transfer_id
        columns: [transfer_id]
        where: "transfer_id IS NOT NULL"

    critical_note: |
      ВАЖНО: При создании записи в BudgetFactHistory необходимо
      копировать ВСЕ поля из BudgetFact, включая:
      - record_type (NOT NULL в history!)
      - transfer_id (может быть NULL, но копировать обязательно)

      Пропуск любого поля приведет к IntegrityError!
      См. CLAUDE.md секция "History Tables: Полное копирование полей"

    endpoints:
