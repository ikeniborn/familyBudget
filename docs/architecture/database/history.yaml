# History Tables
# SCD Type 2 implementation for audit trail

pattern:
  name: "Slowly Changing Dimension Type 2"
  description: |
    Each change creates a NEW record in history table.
    Main table (SCD Type 1) contains ONLY current state.
    History table contains ALL versions with validity period.

  columns:
    - "history_id: Primary key for history record"
    - "{entity}_id: FK to main table (stable reference)"
    - "valid_from: When this version became effective"
    - "valid_to: When superseded (NULL = current)"
    - "is_current: Boolean flag for quick filtering"
    - "change_type: CREATE | UPDATE | DELETE"
    - "...all columns from main table..."

  invariants:
    - "Exactly ONE record with is_current = TRUE per entity"
    - "valid_to of previous record = valid_from of next record"
    - "DELETE sets is_current = FALSE, valid_to = NOW()"

tables:
  # ---------------------------------------------------------------------------
  # USER HISTORY
  # ---------------------------------------------------------------------------
  t_d_user_history:
    model: UserHistory
    file: "backend/app/models/user_history.py"
    main_table:
      $ref: "./dimensions.yaml#/tables/t_d_user"
    description: "User profile change history"

    columns:
      - name: history_id
        type: SERIAL PRIMARY KEY
      - name: user_id
        type: INTEGER NOT NULL
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
      - name: telegram_id
        type: BIGINT NOT NULL
      - name: username
        type: VARCHAR(255)
      - name: first_name
        type: VARCHAR(255) NOT NULL
      - name: last_name
        type: VARCHAR(255)
      - name: email
        type: VARCHAR(255)
      - name: is_admin
        type: BOOLEAN NOT NULL
      - name: is_active
        type: BOOLEAN NOT NULL
      - name: valid_from
        type: TIMESTAMP NOT NULL
      - name: valid_to
        type: TIMESTAMP
      - name: is_current
        type: BOOLEAN DEFAULT TRUE
      - name: change_type
        type: VARCHAR(10) NOT NULL
        check: "change_type IN ('CREATE', 'UPDATE', 'DELETE')"
      - name: changed_by_user_id
        type: INTEGER
        fk:
          $ref: "./dimensions.yaml#/tables/t_d_user"
        description: "Admin who made the change"

    indexes:
      - name: idx_uh_user_id
        columns: [user_id]
      - name: idx_uh_is_current
        columns: [is_current]
        where: "is_current = TRUE"
      - name: idx_uh_valid_from
        columns: [valid_from]

    services:
      - $ref: "../functionality/admin.yaml#/module/services/1"

