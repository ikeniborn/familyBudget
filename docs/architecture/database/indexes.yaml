# Index Strategy
# PostgreSQL indexes for Family Budget

strategy:
  principles:
    - "Index columns used in WHERE clauses"
    - "Index columns used in JOIN conditions"
    - "Use partial indexes for boolean filters"
    - "Consider covering indexes for frequent queries"
    - "Avoid over-indexing (write overhead)"

  naming_convention: |
    idx_{table_abbrev}_{column(s)}
    Examples:
    - idx_bf_user_id (budget_fact.user_id)
    - idx_ah_is_current (article_history.is_current)

indexes:
  # ===========================================================================
  # USER INDEXES
  # ===========================================================================
  idx_user_telegram_id:
    table: t_d_user
    columns: [telegram_id]
    unique: true
    description: "Telegram login lookup"
    used_by:
      - $ref: "../functionality/authentication.yaml#/module/services/1"

  idx_user_email:
    table: t_d_user
    columns: [email]
    unique: true
    where: "email IS NOT NULL"
    description: "Email login lookup (partial)"

  idx_user_is_active:
    table: t_d_user
    columns: [is_active]
    where: "is_active = TRUE"
    description: "Active users filter (partial)"

  # ===========================================================================
  # ARTICLE INDEXES
  # ===========================================================================
  idx_article_user_id:
    table: t_d_article
    columns: [user_id]
    description: "Articles by owner"

  idx_article_parent_id:
    table: t_d_article
    columns: [parent_id]
    description: "Child articles lookup"
    used_by:
      - $ref: "../functionality/budget-management.yaml#/module/services/1"

  idx_article_type:
    table: t_d_article
    columns: [type]
    description: "Filter by income/expense/transfer"

  idx_article_is_active:
    table: t_d_article
    columns: [is_active]
    where: "is_active = TRUE"
    description: "Active articles only (partial)"

  idx_article_name_trgm:
    table: t_d_article
    columns: [name]
    type: GIN
    using: "gin_trgm_ops"
    description: "Trigram search for autocomplete"
    note: "Requires pg_trgm extension"

  # ===========================================================================
  # BUDGET FACT INDEXES
  # ===========================================================================
  idx_bf_user_id:
    table: t_f_budget_fact
    columns: [user_id]
    description: "Facts by creator"
    note: "Partitioned - index exists on each partition"

  idx_bf_article_id:
    table: t_f_budget_fact
    columns: [article_id]
    description: "Facts by category"

  idx_bf_fact_date:
    table: t_f_budget_fact
    columns: [fact_date]
    description: "Date range queries"
    note: "Primary benefit is partition pruning"

  idx_bf_financial_center_id:
    table: t_f_budget_fact
    columns: [financial_center_id]
    where: "financial_center_id IS NOT NULL"
    description: "Facts by account (partial)"

  idx_bf_cost_center_id:
    table: t_f_budget_fact
    columns: [cost_center_id]
    where: "cost_center_id IS NOT NULL"
    description: "Facts by cost center (partial)"

  idx_bf_transfer_id:
    table: t_f_budget_fact
    columns: [transfer_id]
    where: "transfer_id IS NOT NULL"
    description: "Transfer pair lookup (partial)"
    used_by:
      - $ref: "../endpoints/transfers.yaml#/routes"

  idx_bf_record_type:
    table: t_f_budget_fact
    columns: [record_type]
    description: "Filter by transaction type"

  idx_bf_created_at:
    table: t_f_budget_fact
    columns: [created_at DESC]
    description: "Recent transactions (sorted)"

  # Composite indexes for common queries
  idx_bf_user_date:
    table: t_f_budget_fact
    columns: [user_id, fact_date]
    description: "User's facts in date range"

  idx_bf_article_date:
    table: t_f_budget_fact
    columns: [article_id, fact_date]
    description: "Category totals by period"

  idx_bf_fc_date:
    table: t_f_budget_fact
    columns: [financial_center_id, fact_date]
    where: "financial_center_id IS NOT NULL"
    description: "Account balance calculations"

  idx_bf_recurring_plan_id:
    table: t_f_budget_fact
    columns: [recurring_plan_id]
    where: "recurring_plan_id IS NOT NULL"
    description: "Facts by recurring plan (partial)"
    used_by:
      - $ref: "../functionality/recurring-plans.yaml#/module/services/0"

  # ===========================================================================
  # RECURRING PLAN INDEXES
  # ===========================================================================
  idx_rp_user_id:
    table: t_d_recurring_plan
    columns: [user_id]
    description: "Plans by owner"

  idx_rp_is_active_next_date:
    table: t_d_recurring_plan
    columns: [is_active, next_generation_date]
    where: "is_active = TRUE"
    description: "Active plans needing generation (scheduler job)"
    used_by:
      - $ref: "../functionality/recurring-plans.yaml#/module/services/0"

  idx_rp_article_id:
    table: t_d_recurring_plan
    columns: [article_id]
    description: "Plans by category"

  # ===========================================================================
  # FINANCIAL CENTER INDEXES
  # ===========================================================================
  idx_fc_user_id:
    table: t_d_financial_center
    columns: [user_id]
    description: "Accounts by owner"

  idx_fc_is_active:
    table: t_d_financial_center
    columns: [is_active]
    where: "is_active = TRUE"
    description: "Active accounts (partial)"

  # ===========================================================================
  # COST CENTER INDEXES
  # ===========================================================================
  idx_cc_user_id:
    table: t_d_cost_center
    columns: [user_id]
    description: "Cost centers by owner"

  idx_cc_is_active:
    table: t_d_cost_center
    columns: [is_active]
    where: "is_active = TRUE"
    description: "Active cost centers (partial)"

  # ===========================================================================
  # SHOPPING LIST INDEXES
  # ===========================================================================
  idx_sl_user_id:
    table: t_d_shopping_list
    columns: [user_id]
    description: "Lists by creator"

  idx_sl_status:
    table: t_d_shopping_list
    columns: [status]
    description: "Filter by status"

  idx_sl_is_shared:
    table: t_d_shopping_list
    columns: [is_shared]
    where: "is_shared = TRUE"
    description: "Shared lists (partial)"

  # ===========================================================================
  # SHOPPING LIST ITEM INDEXES
  # ===========================================================================
  idx_sli_shopping_list_id:
    table: t_d_shopping_list_item
    columns: [shopping_list_id]
    description: "Items by list"

  idx_sli_is_checked:
    table: t_d_shopping_list_item
    columns: [is_checked]
    description: "Checked/unchecked filter"

  idx_sli_store_id:
    table: t_d_shopping_list_item
    columns: [store_id]
    where: "store_id IS NOT NULL"
    description: "Items by store (partial)"

  idx_sli_product_group_id:
    table: t_d_shopping_list_item
    columns: [product_group_id]
    where: "product_group_id IS NOT NULL"
    description: "Items by product group (partial)"

  idx_sli_name_trgm:
    table: t_d_shopping_list_item
    columns: [name]
    type: GIN
    using: "gin_trgm_ops"
    description: "Product name autocomplete"

  # ===========================================================================
  # HIERARCHY INDEXES
  # ===========================================================================
  idx_ah_ancestor_id:
    table: t_d_article_hierarchy
    columns: [ancestor_id]
    description: "Get subtree"

  idx_ah_descendant_id:
    table: t_d_article_hierarchy
    columns: [descendant_id]
    description: "Get ancestors"

  idx_ah_depth:
    table: t_d_article_hierarchy
    columns: [depth]
    description: "Filter by depth level"

  idx_pgh_ancestor_id:
    table: t_d_product_group_hierarchy
    columns: [ancestor_id]
    description: "Product group subtree"

  idx_pgh_descendant_id:
    table: t_d_product_group_hierarchy
    columns: [descendant_id]
    description: "Product group ancestors"

  # ===========================================================================
  # HISTORY TABLE INDEXES
  # ===========================================================================
  idx_uh_user_id:
    table: t_d_user_history
    columns: [user_id]
    description: "User history lookup"

  idx_uh_is_current:
    table: t_d_user_history
    columns: [is_current]
    where: "is_current = TRUE"
    description: "Current version only (partial)"

  idx_ah_article_id:
    table: t_d_article_history
    columns: [article_id]
    description: "Article history lookup"

  idx_ah_is_current:
    table: t_d_article_history
    columns: [is_current]
    where: "is_current = TRUE"
    description: "Current version only (partial)"

  idx_bfh_fact_id:
    table: t_f_budget_fact_history
    columns: [fact_id]
    description: "Fact history lookup"

  idx_bfh_is_current:
    table: t_f_budget_fact_history
    columns: [is_current]
    where: "is_current = TRUE"
    description: "Current version only (partial)"

  idx_bfh_transfer_id:
    table: t_f_budget_fact_history
    columns: [transfer_id]
    where: "transfer_id IS NOT NULL"
    description: "Transfer history (partial)"

  # ===========================================================================
  # SUPPORT TABLE INDEXES
  # ===========================================================================
  idx_rt_user_id:
    table: t_refresh_token
    columns: [user_id]
    description: "Tokens by user"

  idx_rt_token:
    table: t_refresh_token
    columns: [token]
    unique: true
    description: "Token lookup"

  idx_rt_expires_at:
    table: t_refresh_token
    columns: [expires_at]
    description: "Expired token cleanup"

  idx_notif_user_id:
    table: t_notification
    columns: [user_id]
    description: "Notifications by user"

  idx_notif_is_read:
    table: t_notification
    columns: [is_read]
    where: "is_read = FALSE"
    description: "Unread notifications (partial)"

  idx_ifu_user_id:
    table: t_import_file_upload
    columns: [user_id]
    description: "Uploads by user"

  idx_is_upload_id:
    table: t_import_staging
    columns: [upload_id]
    description: "Staging rows by upload"

# Performance Monitoring
monitoring:
  unused_indexes:
    description: "Find indexes with zero scans"
    sql: |
      SELECT schemaname, tablename, indexname, idx_scan
      FROM pg_stat_user_indexes
      WHERE idx_scan = 0
      ORDER BY pg_relation_size(indexrelid) DESC;

  index_sizes:
    description: "Index size analysis"
    sql: |
      SELECT
        indexname,
        pg_size_pretty(pg_relation_size(indexrelid)) as size
      FROM pg_stat_user_indexes
      ORDER BY pg_relation_size(indexrelid) DESC
      LIMIT 20;

  missing_indexes:
    description: "Tables with sequential scans"
    sql: |
      SELECT
        relname,
        seq_scan,
        idx_scan,
        n_live_tup
      FROM pg_stat_user_tables
      WHERE seq_scan > idx_scan
        AND n_live_tup > 10000
      ORDER BY seq_scan DESC;

# Extensions Required
extensions:
  pg_trgm:
    description: "Trigram similarity for text search"
    used_by:
      - idx_article_name_trgm
      - idx_sli_name_trgm
    install: "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
