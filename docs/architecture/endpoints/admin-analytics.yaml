# Admin Analytics Endpoints
# Analytics and monitoring for administrators (v6.8.0+)

routes:
  # ---------------------------------------------------------------------------
  # ANALYTICS OVERVIEW
  # ---------------------------------------------------------------------------
  - path: "/api/v1/admin/analytics/overview"
    method: GET
    auth: admin
    description: "Dashboard overview statistics"
    response:
      status: 200
      body:
        total_users: "integer"
        active_users_30d: "integer"
        total_facts: "integer"
        total_articles: "integer"
        facts_last_30d: "integer"
        storage_size_mb: "integer"

  - path: "/api/v1/admin/analytics/users-growth"
    method: GET
    auth: admin
    description: "User registration growth over time"
    request:
      query_params:
        period: "string (7d, 30d, 90d, 1y)"
    response:
      status: 200
      body:
        data:
          - date: "string (ISO 8601)"
            new_users: "integer"
            cumulative_users: "integer"

  - path: "/api/v1/admin/analytics/top-users"
    method: GET
    auth: admin
    description: "Most active users by transaction count"
    request:
      query_params:
        limit: "integer (default 10)"
    response:
      status: 200
      body:
        users:
          - user_id: "integer"
            username: "string"
            fact_count: "integer"
            last_active: "string (ISO 8601)"

  - path: "/api/v1/admin/analytics/transactions-trends"
    method: GET
    auth: admin
    description: "Transaction creation trends"
    request:
      query_params:
        period: "string (7d, 30d, 90d, 1y)"
        group_by: "string (day, week, month)"
    response:
      status: 200
      body:
        data:
          - period: "string (ISO 8601)"
            fact_count: "integer"
            unique_users: "integer"

  - path: "/api/v1/admin/analytics/categories-breakdown"
    method: GET
    auth: admin
    description: "Article usage breakdown"
    response:
      status: 200
      body:
        categories:
          - article_id: "integer"
            article_name: "string"
            fact_count: "integer"
            percentage: "float"

  - path: "/api/v1/admin/analytics/centers-usage"
    method: GET
    auth: admin
    description: "Financial/Cost centers usage statistics"
    response:
      status: 200
      body:
        financial_centers:
          - id: "integer"
            name: "string"
            fact_count: "integer"
        cost_centers:
          - id: "integer"
            name: "string"
            fact_count: "integer"

  # ---------------------------------------------------------------------------
  # CACHE METRICS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/admin/cache-metrics"
    method: GET
    auth: admin
    description: "Redis cache hit/miss statistics"
    service:
      $ref: "../functionality/caching.yaml#/module/services/3"
    response:
      status: 200
      body:
        cache_hit_rate: "float (0.0-1.0)"
        total_requests: "integer"
        cache_hits: "integer"
        cache_misses: "integer"
        cache_size_bytes: "integer"
        eviction_count: "integer"

  - path: "/api/v1/admin/cache-metrics"
    method: POST
    auth: admin
    description: "Force cache metrics recalculation"
    service:
      $ref: "../functionality/caching.yaml#/module/services/3"
    response:
      status: 200
      body:
        message: "Cache metrics updated"

  - path: "/api/v1/admin/redis-stats"
    method: GET
    auth: admin
    description: "Redis server statistics"
    service:
      $ref: "../functionality/caching.yaml#/module/services/0"
    response:
      status: 200
      body:
        used_memory_mb: "integer"
        connected_clients: "integer"
        total_commands_processed: "integer"
        instantaneous_ops_per_sec: "integer"
        keyspace_hits: "integer"
        keyspace_misses: "integer"

  # ---------------------------------------------------------------------------
  # BALANCE AGGREGATION
  # ---------------------------------------------------------------------------
  - path: "/api/v1/admin/analytics/refresh-balance-aggregates"
    method: POST
    auth: admin
    description: "Force refresh balance aggregation cache"
    service:
      $ref: "../functionality/financial-centers.yaml#/module/services/1"
    response:
      status: 200
      body:
        message: "Balance aggregates refreshed"
        updated_centers: "integer"

dependencies:
  - $ref: "../functionality/admin.yaml"
  - $ref: "../functionality/analytics.yaml"
  - $ref: "../functionality/caching.yaml"
