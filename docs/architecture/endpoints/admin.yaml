# Admin Endpoints
# User management, bulk operations

routes:
  # ===========================================================================
  # USERS
  # ===========================================================================
  - path: "/api/v1/users"
    method: GET
    auth: admin
    description: "List all users"
    query_params:
      include_inactive: "boolean (default: false)"
    response:
      status: 200
      body:
        - id: "integer"
          telegram_id: "integer"
          email: "string (optional)"
          username: "string"
          first_name: "string"
          last_name: "string"
          is_admin: "boolean"
          is_active: "boolean"
          two_factor_enabled: "boolean"
          has_password: "boolean (computed from password_hash)"
          created_at: "datetime"
          last_login_at: "datetime"
    service:
      $ref: "../functionality/admin.yaml#/module/services/0"

  - path: "/api/v1/users"
    method: POST
    auth: admin
    description: "Create new user (admin only)"
    request:
      body:
        telegram_id: "integer (required)"
        username: "string (optional)"
        first_name: "string (required)"
        last_name: "string (optional)"
        is_admin: "boolean (default: false)"
    response:
      status: 201
      body:
        id: "integer"
        telegram_id: "integer"
    note: "No auto-registration. Users must be created by admin."

  - path: "/api/v1/users/{id}"
    method: GET
    auth: admin
    description: "Get user by ID"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        # full user object
    errors:
      - status: 404
        detail: "User not found"

  - path: "/api/v1/users/{id}/role"
    method: PUT
    auth: admin
    description: "Update user role (promote/demote)"
    path_params:
      id: "integer"
    request:
      body:
        is_admin: "boolean"
    response:
      status: 200
    constraints:
      - "Cannot demote yourself"
    side_effects:
      - "UserHistory record created"

  - path: "/api/v1/users/{id}/deactivate"
    method: POST
    auth: admin
    description: "Deactivate user"
    path_params:
      id: "integer"
    response:
      status: 200
    constraints:
      - "Cannot deactivate yourself"
    side_effects:
      - "User.is_active = False"
      - "All refresh tokens invalidated"

  - path: "/api/v1/users/{id}/reactivate"
    method: POST
    auth: admin
    description: "Reactivate user"
    path_params:
      id: "integer"
    response:
      status: 200

  - path: "/api/v1/users/{id}/history"
    method: GET
    auth: admin
    description: "Get user change history"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        - history_id: "integer"
          change_type: "string"
          changed_fields: "array"
          valid_from: "datetime"

  - path: "/api/v1/admin/users/{id}/reset-password"
    method: PUT
    auth: admin
    description: "Reset user password (clears password_hash)"
    path_params:
      id: "integer"
    response:
      status: 200
      body: "Full user object with has_password=false"
    errors:
      - status: 404
        detail: "User not found"
      - status: 400
        detail: "Password is not set for this user"
    constraints:
      - "User must have has_password=true"
    side_effects:
      - "User.password_hash = NULL"
      - "User must set new password via security settings"

  - path: "/api/v1/admin/users/{id}/reset-2fa"
    method: PUT
    auth: admin
    description: "Reset user 2FA (clears two_factor_secret)"
    path_params:
      id: "integer"
    response:
      status: 200
      body: "Full user object with two_factor_enabled=false"
    errors:
      - status: 404
        detail: "User not found"
      - status: 400
        detail: "2FA is not enabled for this user"
    constraints:
      - "User must have two_factor_enabled=true"
    side_effects:
      - "User.two_factor_secret = NULL"
      - "User.two_factor_enabled = False"
      - "User must re-setup 2FA via security settings"

  # ===========================================================================
  # USER STATISTICS
  # ===========================================================================
  - path: "/api/v1/admin/users/stats/summary"
    method: GET
    auth: admin
    description: "Get per-user statistics"
    response:
      status: 200
      body:
        - user_id: "integer"
          username: "string"
          first_name: "string"
          total_facts: "integer"
          total_articles: "integer"
          last_fact_date: "datetime (nullable)"

  - path: "/api/v1/admin/users/stats/system"
    method: GET
    auth: admin
    description: "Get system-wide statistics (Shared Family Budget)"
    response:
      status: 200
      body:
        total_users: "integer"
        total_active_users: "integer"
        total_facts: "integer"
        total_articles: "integer"
        last_fact_date: "datetime (nullable)"
    note: "All metrics are GLOBAL - no user_id filtering per Shared Family Budget Model"

  # ===========================================================================
  # BULK OPERATIONS
  # ===========================================================================
  - path: "/api/v1/admin/articles/bulk-archive"
    method: POST
    auth: admin
    description: "Bulk archive articles"
    request:
      body:
        article_ids: "array of integers"
        recursive: "boolean (default: false)"
    response:
      status: 200
      body:
        archived_count: "integer"

  - path: "/api/v1/admin/articles/bulk-restore"
    method: POST
    auth: admin
    description: "Bulk restore articles"
    request:
      body:
        article_ids: "array of integers"
        recursive: "boolean (default: false)"
    response:
      status: 200
      body:
        restored_count: "integer"

  - path: "/api/v1/admin/facts/batch-delete"
    method: POST
    auth: admin
    description: "Bulk delete facts with WebSocket summary event"
    request:
      body:
        fact_ids: "array of integers"
    response:
      status: 200
      body:
        deleted_count: "integer"
    websocket:
      event: "facts_bulk_delete_summary"
      payload:
        deleted_count: "integer"
    notes: "Sends single summary event instead of per-fact events (v6.6.0+)"

  - path: "/api/v1/articles/batch-delete"
    method: POST
    auth: user
    description: "Bulk delete articles"
    request:
      body:
        article_ids: "array of integers"
    response:
      status: 200
      body:
        deleted_count: "integer"

  - path: "/api/v1/recurring-plans/batch-delete"
    method: POST
    auth: user
    description: "Bulk delete recurring plans"
    request:
      body:
        plan_ids: "array of integers"
    response:
      status: 200
      body:
        deleted_count: "integer"

  # ===========================================================================
  # IMPORT STAGING (ADMIN)
  # NOTE: User-level staging endpoints are available at /api/v1/staging
  # Users can access their own staging records without admin privileges.
  # These admin endpoints remain for backwards compatibility.
  # ===========================================================================
  - path: "/api/v1/admin/staging"
    method: GET
    auth: admin
    description: "Review staged imports (admin only)"
    response:
      status: 200
      body:
        - staging_id: "integer"
          user_id: "integer"
          bank_provider: "string"
          row_count: "integer"
          status: "pending | approved | rejected"
          uploaded_at: "datetime"

  - path: "/api/v1/admin/staging/{id}/approve"
    method: POST
    auth: admin
    description: "Approve staged import"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        imported_count: "integer"

  - path: "/api/v1/admin/staging/{id}/reject"
    method: POST
    auth: admin
    description: "Reject staged import"
    path_params:
      id: "integer"
    response:
      status: 200

  - path: "/api/v1/admin/staging/bulk-update"
    method: POST
    auth: admin
    description: "Bulk update staging records enrichment"
    request:
      body:
        staging_ids: "array of integers (required)"
        article_id: "integer (optional)"
        financial_center_id: "integer (optional)"
        cost_center_id: "integer (optional)"
        record_type: "string: 'fact' | 'plan' (optional)"
    response:
      status: 200
      body:
        message: "Updated N staging records"
    errors:
      - status: 400
        detail: "staging_ids cannot be empty"
      - status: 404
        detail: "No staging records found"
    note: "Only updates non-None fields. Used by Step 4 (Enrichment) bulk panel."

  - path: "/api/v1/admin/staging/bulk-delete"
    method: POST
    auth: admin
    description: "Bulk delete staging records"
    request:
      body:
        staging_ids: "array of integers (required)"
    response:
      status: 200
      body:
        message: "Deleted N staging records"
    errors:
      - status: 400
        detail: "staging_ids cannot be empty"
      - status: 404
        detail: "No staging records found"

  # ===========================================================================
  # DATA EXPORT
  # ===========================================================================
  - path: "/api/v1/admin/export/transactions"
    method: GET
    auth: admin
    description: "Export transactions to CSV"
    query_params:
      date_from: "YYYY-MM-DD"
      date_to: "YYYY-MM-DD"
      format: "csv | xlsx (default: csv)"
    response:
      status: 200
      content_type: "text/csv"
      headers:
        Content-Disposition: "attachment; filename=transactions.csv"

  - path: "/api/v1/admin/export/full"
    method: GET
    auth: admin
    description: "Export full database backup"
    response:
      status: 200
      content_type: "application/json"
      body:
        users: "array"
        articles: "array"
        facts: "array"
        financial_centers: "array"
        cost_centers: "array"

# Authorization
authorization:
  check: "get_current_admin"
  path: "backend/app/core/auth.py"
  requires:
    - "Valid JWT token"
    - "User.is_admin == True"
    - "User.is_active == True"

# Frontend
frontend:
  pages:
    - $ref: "../web/templates.yaml#/templates/admin_dashboard"
    - $ref: "../web/templates.yaml#/templates/admin_users"
    - $ref: "../web/templates.yaml#/templates/admin_articles"
    - $ref: "../web/templates.yaml#/templates/admin_financial_centers"
    - $ref: "../web/templates.yaml#/templates/admin_cost_centers"
    - $ref: "../web/templates.yaml#/templates/admin_monitoring"
