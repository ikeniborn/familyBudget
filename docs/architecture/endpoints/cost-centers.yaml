# Cost Centers Endpoints
# Projects, departments, expense groups

routes:
  # ---------------------------------------------------------------------------
  # LIST
  # ---------------------------------------------------------------------------
  - path: "/api/v1/cost-centers"
    method: GET
    auth: user
    description: "List all cost centers"
    query_params:
      include_archived: "boolean (default: false)"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          code: "string (optional)"
          description: "string (optional)"
          is_active: "boolean"
          created_at: "datetime"
    service:
      $ref: "../functionality/cost-centers.yaml#/module"

  # ---------------------------------------------------------------------------
  # CREATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/cost-centers"
    method: POST
    auth: user
    description: "Create new cost center"
    request:
      body:
        name: "string (required)"
        code: "string (optional, unique)"
        description: "string (optional)"
    response:
      status: 201
      body:
        id: "integer"
        name: "string"
        code: "string"
    service:
      $ref: "../functionality/cost-centers.yaml#/module/services/0"
    side_effects:
      - "CostCenterHistory record created"

  # ---------------------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------------------
  - path: "/api/v1/cost-centers/{cost_center_id}"
    method: GET
    auth: user
    description: "Get cost center by ID"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        name: "string"
        code: "string"
        description: "string"
        is_active: "boolean"
    errors:
      - status: 404
        detail: "Cost center not found"

  # ---------------------------------------------------------------------------
  # UPDATE (ALL USERS)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/cost-centers/{cost_center_id}"
    method: PUT
    auth: user
    description: "Update cost center"
    path_params:
      id: "integer"
    request:
      body:
        name: "string (optional)"
        code: "string (optional)"
        description: "string (optional)"
    response:
      status: 200
      body:
        id: "integer"
        # ... all fields
    service:
      $ref: "../functionality/cost-centers.yaml#/module/services/0"
    side_effects:
      - "CostCenterHistory updated (SCD Type 2)"

  # ---------------------------------------------------------------------------
  # DELETE (ADMIN ONLY)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/cost-centers/{cost_center_id}"
    method: DELETE
    auth: admin
    description: "Soft delete cost center"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        message: "Cost center deleted"
    constraints:
      - "Cannot delete if has facts referencing it"
    errors:
      - status: 400
        detail: "Cannot delete cost center with existing transactions"

# Models
models:
  - $ref: "../database/dimensions.yaml#/tables/t_d_cost_center"
  - $ref: "../database/history.yaml#/tables/t_d_cost_center_history"

# Schemas
schemas:
  path: "backend/app/schemas/cost_center.py"
  classes:
    - CostCenterCreate
    - CostCenterUpdate
    - CostCenterResponse
