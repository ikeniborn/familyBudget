# Health Endpoints
# Health checks, readiness probes

routes:
  # ---------------------------------------------------------------------------
  # PING
  # ---------------------------------------------------------------------------
  - path: "/ping"
    method: GET
    auth: public
    description: "Simple ping endpoint"
    response:
      status: 200
      body:
        message: "pong"
    use_case: "Load balancer health check"

  # ---------------------------------------------------------------------------
  # HEALTH
  # ---------------------------------------------------------------------------
  - path: "/health"
    method: GET
    auth: public
    description: "Basic health check"
    response:
      status: 200
      body:
        status: "healthy"
        timestamp: "ISO 8601"
    use_case: "Kubernetes liveness probe"

  # ---------------------------------------------------------------------------
  # READY
  # ---------------------------------------------------------------------------
  - path: "/ready"
    method: GET
    auth: public
    description: "Readiness probe (checks dependencies)"
    checks:
      - database: "PostgreSQL connection"
    response:
      status: 200
      body:
        status: "ready"
        database: "connected"
    errors:
      - status: 503
        body:
          status: "not ready"
          database: "disconnected"
    use_case: "Kubernetes readiness probe"

  # ---------------------------------------------------------------------------
  # DETAILED HEALTH
  # ---------------------------------------------------------------------------
  - path: "/health/detailed"
    method: GET
    auth: admin
    description: "Detailed health diagnostics"
    response:
      status: 200
      body:
        status: "healthy"
        version: "string (app version)"
        uptime: "integer (seconds)"
        database:
          status: "connected"
          pool_size: "integer"
          active_connections: "integer"
        websocket:
          status: "active"
          connection_count: "integer"
        memory:
          rss_mb: "decimal"
          heap_mb: "decimal"
        cpu:
          usage_percent: "decimal"
    use_case: "Admin monitoring dashboard"

# Endpoint File
endpoint_file:
  path: "backend/app/api/health.py"
  loc: 447

# Integration
integration:
  docker_compose:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: "30s"
      timeout: "10s"
      retries: 3

  kubernetes:
    livenessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 30

    readinessProbe:
      httpGet:
        path: "/ready"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10

# Monitoring
monitoring:
  script: "logs.sh"
  features:
    - "Container status"
    - "Health checks"
    - "Backend errors"
    - "Database status"
    - "Resource usage"
