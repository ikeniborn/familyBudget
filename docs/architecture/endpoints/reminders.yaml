# Reminders Endpoints
# Scheduled reminders for plans

# IMPORTANT: Route Order
# In FastAPI, routes are matched in definition order.
# General routes (GET /) MUST be defined BEFORE parameterized routes (GET /{fact_id})
# to prevent incorrect parameter matching.
# See: backend/app/api/v1/endpoints/reminders.py

routes:
  # ---------------------------------------------------------------------------
  # LIST (must be first to avoid route collision with /{fact_id})
  # ---------------------------------------------------------------------------
  - path: "/api/v1/reminders"
    method: GET
    auth: user
    description: "List all reminders for current user"
    query_params:
      status_filter: "pending | sent | failed | cancelled (optional)"
      skip: "integer (default: 0)"
      limit: "integer (default: 50, max: 100)"
    response:
      status: 200
      body:
        items:
          - id: "integer"
            fact_id: "integer"
            user_id: "integer"
            reminder_datetime: "datetime"
            status: "pending | sent | failed | cancelled"
            telegram_sent: "boolean"
            web_push_sent: "boolean"
            retry_count: "integer"
            created_at: "datetime"
            updated_at: "datetime"
            plan_info:
              amount: "decimal"
              description: "string"
              article_name: "string"
              fact_date: "YYYY-MM-DD"
        total: "integer"
        skip: "integer"
        limit: "integer"
    notes: |
      This endpoint MUST be defined before GET /{fact_id} in the router
      to prevent FastAPI from matching "/" as a fact_id parameter.

  # ---------------------------------------------------------------------------
  # CREATE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/reminders/{fact_id}"
    method: POST
    auth: user
    description: "Create reminder for a plan"
    path_params:
      fact_id: "integer - ID of plan (BudgetFact with record_type='plan')"
    request:
      body:
        reminder_datetime: "datetime (required)"
    response:
      status: 201
      body:
        id: "integer"
        fact_id: "integer"
        user_id: "integer"
        reminder_datetime: "datetime"
        status: "pending"
    errors:
      - status: 400
        detail: "Plan not found, not a plan, or reminder already exists"
      - status: 403
        detail: "Plan doesn't belong to current user"
      - status: 404
        detail: "Plan not found"

  # ---------------------------------------------------------------------------
  # READ
  # ---------------------------------------------------------------------------
  - path: "/api/v1/reminders/{fact_id}"
    method: GET
    auth: user
    description: "Get reminder for a plan with plan info"
    path_params:
      fact_id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        fact_id: "integer"
        reminder_datetime: "datetime"
        status: "string"
        plan_info:
          amount: "decimal"
          description: "string"
          article_name: "string"
          fact_date: "YYYY-MM-DD"
    errors:
      - status: 404
        detail: "Reminder not found or plan doesn't belong to user"

  # ---------------------------------------------------------------------------
  # UPDATE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/reminders/{fact_id}"
    method: PUT
    auth: user
    description: "Update reminder datetime"
    path_params:
      fact_id: "integer"
    request:
      body:
        reminder_datetime: "datetime (required)"
    response:
      status: 200
      body:
        id: "integer"
        fact_id: "integer"
        reminder_datetime: "datetime"
        status: "string"
    errors:
      - status: 404
        detail: "Reminder not found"
      - status: 403
        detail: "Plan doesn't belong to current user"

  # ---------------------------------------------------------------------------
  # DELETE
  # ---------------------------------------------------------------------------
  - path: "/api/v1/reminders/{fact_id}"
    method: DELETE
    auth: user
    description: "Delete a reminder"
    path_params:
      fact_id: "integer"
    response:
      status: 204
    errors:
      - status: 404
        detail: "Reminder not found"
      - status: 403
        detail: "Plan doesn't belong to current user"

# Database
database:
  table: "t_scheduled_reminder"
  model: "ScheduledReminder"
  constraints:
    - "UNIQUE (fact_id) - one reminder per plan"
  fields:
    - id: "SERIAL PRIMARY KEY"
    - fact_id: "INTEGER NOT NULL REFERENCES t_f_budget_fact(id)"
    - user_id: "INTEGER NOT NULL REFERENCES t_d_user(id)"
    - reminder_datetime: "TIMESTAMP NOT NULL"
    - status: "VARCHAR(20) DEFAULT 'pending'"
    - telegram_sent: "BOOLEAN DEFAULT FALSE"
    - web_push_sent: "BOOLEAN DEFAULT FALSE"
    - retry_count: "INTEGER DEFAULT 0"
    - last_error: "TEXT"
    - created_at: "TIMESTAMP DEFAULT NOW()"
    - updated_at: "TIMESTAMP DEFAULT NOW()"

# Service
service:
  file: "backend/app/services/reminder_service.py"
  class: "ReminderService"
  methods:
    - create_reminder
    - get_reminder_with_plan_info
    - update_reminder
    - delete_reminder
    - list_user_reminders
    - process_pending_reminders
    - send_telegram_reminder
    - send_web_push_reminder

# Frontend
frontend:
  page: "plan.html"
  js_module: "plan.html inline script"
  features:
    - "Reminder button on plan cards"
    - "Date/time picker for reminder"
    - "Status indicators"
