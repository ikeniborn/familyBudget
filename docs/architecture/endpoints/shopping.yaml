# Shopping Endpoints
# Shopping lists, items, stores, product groups

routes:
  # ===========================================================================
  # SHOPPING LISTS
  # ===========================================================================
  - path: "/api/v1/shopping-lists"
    method: GET
    auth: user
    description: "List all shopping lists with statistics"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          user_id: "integer (creator)"
          total_items: "integer (excludes soft-deleted items)"
          completed_items: "integer (excludes soft-deleted items)"
          completion_percentage: "float (0-100)"
          created_at: "datetime"
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/0"
    notes: |
      Item counts exclude soft-deleted items (deleted_at IS NOT NULL).
      Changed in commit 6aa943bf to fix incorrect counts.

  - path: "/api/v1/shopping-lists"
    method: POST
    auth: user
    description: "Create new shopping list"
    request:
      body:
        name: "string (required)"
    response:
      status: 201
      body:
        id: "integer"
        name: "string"
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/0"

  - path: "/api/v1/shopping-lists/{shopping_list_id}"
    method: PUT
    auth: user
    description: "Update shopping list"
    path_params:
      id: "integer"
    request:
      body:
        name: "string"
    response:
      status: 200

  - path: "/api/v1/shopping-lists/{shopping_list_id}"
    method: DELETE
    auth: user
    description: "Delete shopping list"
    path_params:
      id: "integer"
    constraints:
      - "Only creator can delete"
    response:
      status: 200

  # ===========================================================================
  # SHOPPING LIST ITEMS
  # ===========================================================================
  - path: "/api/v1/shopping-list-items"
    method: GET
    auth: user
    description: "List items for a shopping list (excludes soft-deleted)"
    query_params:
      shopping_list_id: "integer (required)"
      is_completed: "boolean (optional)"
      store_id: "integer (optional)"
      product_group_id: "integer (optional)"
    response:
      status: 200
      body:
        - id: "integer"
          shopping_list_id: "integer"
          product_name: "string"
          quantity: "decimal"
          unit: "string"
          product_group_id: "integer (optional)"
          store_id: "integer (optional)"
          is_completed: "boolean"
          deleted_at: "datetime (always NULL in response - soft-deleted items excluded)"
          sync_hash: "string"
    notes: |
      Returns only active items (deleted_at IS NULL).
      Soft-deleted items are hidden from all queries.

  - path: "/api/v1/shopping-list-items"
    method: POST
    auth: user
    description: "Create shopping list item"
    request:
      body:
        shopping_list_id: "integer (required)"
        name: "string (required)"
        quantity: "decimal (optional)"
        unit: "string (optional)"
        product_group_id: "integer (optional)"
        store_id: "integer (optional)"
        sync_hash: "string (optional, for offline)"
    response:
      status: 201
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/1"
    side_effects:
      - "WebSocket broadcast: shopping_list_item_created"

  - path: "/api/v1/shopping-list-items/{item_id}"
    method: PUT
    auth: user
    description: "Update shopping list item"
    path_params:
      id: "integer"
    request:
      body:
        name: "string (optional)"
        quantity: "decimal (optional)"
        is_completed: "boolean (optional)"
    response:
      status: 200
    side_effects:
      - "WebSocket broadcast: shopping_list_item_updated"

  - path: "/api/v1/shopping-list-items"
    method: DELETE
    auth: user
    description: "Soft-delete shopping list items (batch)"
    request:
      body:
        ids: "array of integers"
    response:
      status: 200
      body:
        deleted_count: "integer"
    side_effects:
      - "WebSocket broadcast: shopping_list_item_deleted"
    notes: |
      Uses soft delete pattern: sets deleted_at timestamp instead of physical deletion.
      Soft-deleted items preserved for autocomplete history and conflict resolution.
      Excluded from all item count queries and list responses.

  - path: "/api/v1/shopping-list-items/{item_id}/restore"
    method: PUT
    auth: user
    description: "Restore soft-deleted shopping list item"
    path_params:
      id: "integer"
    response:
      status: 200
      body:
        id: "integer"
        shopping_list_id: "integer"
        product_name: "string"
        quantity: "decimal"
        unit: "string"
        is_completed: "boolean"
        deleted_at: "null (always NULL after restore)"
    side_effects:
      - "WebSocket broadcast: shopping_list_item_created"
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/1"
    notes: |
      Idempotent operation: returns 200 OK if item is already active.
      Returns 404 if item_id not found.
      Sets deleted_at=NULL, increments version, sets sync_status='synced'.
      Used by autocomplete when selecting previously deleted item.

  # ---------------------------------------------------------------------------
  # PRODUCT SUGGESTIONS (AUTOCOMPLETE)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/shopping-list-items/products/suggest"
    method: GET
    auth: user
    description: "Get product name suggestions for autocomplete"
    query_params:
      q: "string (required, min 2 chars)"
      shopping_list_id: "integer (optional, prioritize items from this list)"
      include_deleted: "boolean (default: true, include soft-deleted items)"
      limit: "integer (default: 10, max: 50)"
    response:
      status: 200
      body:
        - id: "integer (nullable, set for deleted items to restore)"
          is_deleted: "boolean (true if soft-deleted, can be restored)"
          shopping_list_id: "integer (nullable)"
          product_name: "string"
          store_id: "integer (nullable)"
          store_name: "string (nullable)"
          product_group_id: "integer (nullable)"
          product_group_name: "string (nullable)"
          quantity: "decimal (nullable, from deleted item)"
          unit: "string (nullable, from deleted item)"
          comment: "string (nullable, from deleted item)"
          last_used: "datetime (nullable)"
          usage_count: "integer"
    notes: |
      Two-query approach for prioritization:
      1. Deleted items from shopping_list_id (if provided) - have id for restore
      2. Active items from all lists (aggregated) - no id, only form pre-fill

      Deduplication by (product_name, store_id, product_group_id).
      Deleted items take priority (have specific ID for restore).

      Frontend behavior:
      - If is_deleted=true: call PUT /restore endpoint
      - If is_deleted=false: pre-fill form fields (product_name, store, group)

  # ---------------------------------------------------------------------------
  # OFFLINE SYNC
  # ---------------------------------------------------------------------------
  - path: "/api/v1/shopping-list-items/sync/batch"
    method: POST
    auth: user
    description: "Batch sync for offline items"
    request:
      body:
        items:
          - operation: "create | update | delete"
            data:
              # item fields
            sync_hash: "string"
            client_timestamp: "datetime"
    response:
      status: 200
      body:
        synced: "integer"
        conflicts: "array (if any)"
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/1"
    functionality:
      $ref: "../functionality/offline.yaml#/module"

  # ===========================================================================
  # STORES
  # ===========================================================================
  - path: "/api/v1/stores"
    method: GET
    auth: user
    description: "List all stores"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          address: "string (optional)"
          is_active: "boolean"

  - path: "/api/v1/stores"
    method: POST
    auth: user
    description: "Create store"
    request:
      body:
        name: "string (required)"
        address: "string (optional)"
    response:
      status: 201
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/2"

  # ===========================================================================
  # PRODUCT GROUPS
  # ===========================================================================
  - path: "/api/v1/product-groups"
    method: GET
    auth: user
    description: "List product groups (hierarchical)"
    query_params:
      flat: "boolean (default: false)"
    response:
      status: 200
      body:
        - id: "integer"
          name: "string"
          parent_id: "integer (nullable)"
          children: "array (if flat=false)"

  - path: "/api/v1/product-groups"
    method: POST
    auth: user
    description: "Create product group"
    request:
      body:
        name: "string (required)"
        parent_id: "integer (optional)"
    response:
      status: 201
    service:
      $ref: "../functionality/shopping-lists.yaml#/module/services/3"
    side_effects:
      - "ProductGroupHierarchy updated (closure table)"

# Models
models:
  - $ref: "../database/facts.yaml#/tables/t_f_shopping_list"
  - $ref: "../database/facts.yaml#/tables/t_f_shopping_list_item"
  - $ref: "../database/dimensions.yaml#/tables/t_d_store"
  - $ref: "../database/dimensions.yaml#/tables/t_d_product_group"
  - $ref: "../database/hierarchy.yaml#/tables/t_d_product_group_hierarchy"
