# SSE Endpoints
# Server-Sent Events for real-time updates

routes:
  # ---------------------------------------------------------------------------
  # CONNECT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/events/connect"
    method: GET
    auth: user
    description: "Establish SSE connection"
    response:
      status: 200
      content_type: "text/event-stream"
      headers:
        Cache-Control: "no-cache"
        Connection: "keep-alive"
    implementation:
      file: "backend/app/api/v1/endpoints/budget_sse.py"
      loc: 877
      manager: "BudgetConnectionManager"
    events:
      - name: "connected"
        data:
          message: "Connected to SSE"
          connection_id: "string"

      - name: "fact_created"
        data:
          id: "integer"
          amount: "decimal"
          article_id: "integer"
          fact_date: "YYYY-MM-DD"
        trigger: "POST /api/v1/facts"

      - name: "fact_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/facts/{id}"

      - name: "fact_deleted"
        data:
          id: "integer"
        trigger: "DELETE /api/v1/facts/{id}"

      - name: "transfer_created"
        data:
          transfer_id: "UUID"
          from_financial_center_id: "integer"
          to_financial_center_id: "integer"
          amount: "decimal"
        trigger: "POST /api/v1/transfers"

      - name: "shopping_list_item_created"
        data:
          id: "integer"
          shopping_list_id: "integer"
          name: "string"
        trigger: "POST /api/v1/shopping-list-items"

      - name: "shopping_list_item_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/shopping-list-items/{id}"

      - name: "shopping_list_item_deleted"
        data:
          id: "integer"
        trigger: "DELETE /api/v1/shopping-list-items"

      - name: "article_created"
        data:
          id: "integer"
          name: "string"
          type: "string"
        trigger: "POST /api/v1/articles"

      - name: "article_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/articles/{id}"

      - name: "ping"
        data:
          timestamp: "ISO 8601"
        interval: "30 seconds"
        description: "Keep-alive ping"

  # ---------------------------------------------------------------------------
  # STATUS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/events/status"
    method: GET
    auth: user
    description: "Check SSE connection status"
    response:
      status: 200
      body:
        connected: "boolean"
        connection_count: "integer (total connections)"
        user_connection_count: "integer (user's connections)"

  # ---------------------------------------------------------------------------
  # DISCONNECT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/events/disconnect"
    method: POST
    auth: user
    description: "Gracefully disconnect SSE"
    response:
      status: 200
      body:
        message: "Disconnected"

  # ---------------------------------------------------------------------------
  # POLL (Fallback)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/events/poll"
    method: GET
    auth: user
    description: "Polling fallback for SSE (iOS Safari workaround)"
    implementation:
      file: "backend/app/api/v1/endpoints/budget_sse.py"
      added: "2025-12-19"
    query_params:
      - name: "since"
        type: "string"
        description: "ISO timestamp to get events since (future use)"
    response:
      status: 200
      body:
        events: "array (empty for now, future: cached events)"
        timestamp: "ISO 8601"
        user_id: "integer"
        message: "Polling active, prefer SSE for real-time updates"
    usage:
      description: |
        Last-resort fallback when SSE fails. Client polls every 5 seconds.
        Currently serves as health check - confirms auth and server reachability.
      triggered_by:
        - "3+ failed fetch-based SSE attempts"
        - "_startPollingFallback() in budgetSSEClient.js"

# Critical Constraint
critical_constraint:
  $ref: "../functionality/realtime.yaml#/critical_constraint"

# Frontend Integration
frontend:
  js_module:
    $ref: "../web/js-modules.yaml#/modules/budgetSSEClient"

  ui:
    indicator_location: "navbar"
    states:
      connected: "🟢 green badge - Real-time синхронизация активна"
      connected_via_leader: "🟢 green badge - Синхронизация через другую вкладку (follower mode)"
      approaching_limit: "⚠️ warning badge - Много соединений. Закройте лишние вкладки"
      disconnected: "🔴 red badge - Ошибка соединения"
      reconnecting: "⏳ loading badge - Переподключение"
      limit_reached: "🔴 red badge - Превышен лимит соединений"
      offline: "⚫ gray badge - Offline режим"

  safari_ios:
    description: |
      Safari iOS/iPadOS требует полностью отдельной стратегии подключения.
      Стандартный EventSource и Web Locks API ненадёжны на iOS.
      Updated: 2025-12-19 - добавлена поддержка iPadOS Desktop Mode.

    known_issues:
      - "EventSource буферизирует ответы до ~2KB (onopen никогда не срабатывает)"
      - "Web Locks API работает непредсказуемо, таймауты могут быть огромными"
      - "Cookies с withCredentials: true могут не работать корректно"
      - "iOS 18 regression: error event не срабатывает после background/foreground"
      - "iPadOS Desktop Mode маскируется под macOS Safari (нет 'iPad' в User-Agent)"

    detection:
      method: "_detectSafariIOS()"
      checks:
        - name: "Standard iOS"
          check: "/iPad|iPhone|iPod/.test(ua) && !window.MSStream"
        - name: "iPadOS Desktop Mode"
          check: "navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1"
          note: "iPadOS в Desktop Mode представляется как macOS, но имеет touchscreen"
        - name: "Safari-like browser"
          check: "/Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua)"
      result: "(isIOS || isPadOSDesktop) && isSafariLike"

    fallback_strategy:
      name: "Cascading Fallback"
      order:
        1: "fetch-based SSE (primary for Safari iOS)"
        2: "Retry fetch up to 3 times"
        3: "Switch to polling fallback (/events/poll every 5s)"
      implementation:
        fetch_attempts: "_fetchAttempts counter"
        switch_threshold: "3 failures"
        polling_method: "_startPollingFallback()"

    safety_mechanisms:
      - name: "Web Locks Safety Timeout"
        description: "5 second timeout prevents Web Locks from hanging forever"
        implementation: "_initMultiTab() has safetyTimeout"
        action: "Force leader status and create connection"
      - name: "Visibility Health Check"
        description: "iOS 18 bug: error event doesn't fire after background"
        implementation: "_checkConnectionHealth() on visibilitychange"
        action: "Verify connection staleness, call _forceReconnect() if needed"
      - name: "Connection Staleness Detection"
        description: "45 second timeout since last server ping"
        implementation: "_isConnectionStale()"

    solution:
      detection: "_detectSafariIOS() - поддержка iPadOS Desktop Mode через maxTouchPoints"
      connection_method: "fetch() + ReadableStream → polling fallback"
      multi_tab: "Отключено - каждая вкладка создаёт своё соединение"
      web_locks: "Пропускаются с 5s safety timeout"

    implementation:
      flag: "_safariIOSMode = true при инициализации"
      connect_flow: |
        1. connect() вызывается на DOMContentLoaded
        2. Safari iOS: ждём window.load (DOMContentLoaded слишком рано!)
        3. _safariIOSDelayedConnect(): 300ms задержка (сетевой стек должен "осесть")
        4. Warm-up fetch к /events/status (прогрев сетевого стека)
        5. _createConnection() → _useFetchEventSource()
        6. fetch() устанавливает SSE соединение через ReadableStream
        7. При 3+ неудачах → _startPollingFallback()
        8. Polling каждые 5 секунд как last resort
      timing_insight: |
        Почему screen off/on работает, а page load нет:
        - DOMContentLoaded: DOM готов, но ресурсы ещё грузятся
        - window.load: Все ресурсы загружены, сетевой стек "прогрет"
        - Screen on: Страница УЖЕ полностью загружена
        Решение: ждать window.load + задержка 300ms для Safari iOS

  multi_tab_support:
    description: "Одно SSE соединение на браузер через Web Locks + BroadcastChannel"
    leader_tab: "Создаёт SSE соединение, рассылает события"
    follower_tabs: "Получают события через BroadcastChannel от лидера"
    leader_heartbeat: "Каждые 3 секунды для обнаружения падения лидера"
    connection_staleness: "45 секунд без ping = stale, force reconnect"
    safari_ios_exception: "На Safari iOS multi-tab отключен - каждая вкладка независима"

# Connection Manager
connection_manager:
  type: "In-memory"
  class: "BudgetConnectionManager"
  methods:
    - connect: "Add client to pool"
    - disconnect: "Remove client from pool"
    - broadcast: "Send event to all clients"
    - get_connection_count: "Get total connections"
  note: |
    In-memory manager does NOT share state between workers.
    MUST run with WORKERS=1.
