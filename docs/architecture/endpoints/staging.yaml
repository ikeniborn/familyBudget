# User Staging Endpoints
# User-accessible staging management for CSV import workflow
#
# These endpoints allow regular users to manage their own staging records.
# Users can only access records where user_id matches their own ID.
# Admin endpoints (/api/v1/admin/staging) remain available for admins.

routes:
  # ===========================================================================
  # LIST STAGING RECORDS
  # ===========================================================================
  - path: "/api/v1/staging"
    method: GET
    auth: user
    description: "List staging records for current user"
    response:
      status: 200
      body:
        - id: "integer"
          user_id: "integer"
          file_upload_id: "integer"
          bank_provider_id: "integer"
          fact_date: "YYYY-MM-DD"
          amount_string: "string (raw amount from CSV)"
          description: "string"
          csv_metadata: "object (bank-specific metadata)"
          budget_description: "string (user-assigned)"
          user_comment: "string (user-assigned)"
          article_id: "integer (user-assigned)"
          financial_center_id: "integer (user-assigned)"
          cost_center_id: "integer (user-assigned)"
          is_selected: "boolean"
          record_type: "string: 'fact' | 'plan'"
    notes: |
      Used in Step 4 (Enrichment) of the import workflow.
      Returns only records where user_id matches current user.

  # ===========================================================================
  # UPDATE STAGING RECORD
  # ===========================================================================
  - path: "/api/v1/staging/{staging_id}"
    method: PATCH
    auth: user
    description: "Update individual staging record enrichment fields"
    path_params:
      staging_id: "integer"
    request:
      body:
        article_id: "integer (optional)"
        financial_center_id: "integer (optional)"
        cost_center_id: "integer (optional)"
        budget_description: "string (optional)"
        user_comment: "string (optional)"
        record_type: "string: 'fact' | 'plan' (optional)"
    response:
      status: 200
      body:
        message: "Staging record updated successfully"
    errors:
      - status: 404
        detail: "Staging record not found"
    notes: "Only updates non-None fields. Record must belong to current user."

  # ===========================================================================
  # DELETE STAGING RECORD
  # ===========================================================================
  - path: "/api/v1/staging/{staging_id}"
    method: DELETE
    auth: user
    description: "Delete individual staging record"
    path_params:
      staging_id: "integer"
    response:
      status: 200
      body:
        message: "Staging record deleted successfully"
    errors:
      - status: 404
        detail: "Staging record not found"
    notes: "Record must belong to current user."

  # ===========================================================================
  # CLEAR ALL STAGING
  # ===========================================================================
  - path: "/api/v1/staging"
    method: DELETE
    auth: user
    description: "Clear all staging records for current user"
    response:
      status: 200
      body:
        message: "Cleared N staging records"
    notes: "Deletes all staging records where user_id matches current user."

  # ===========================================================================
  # BULK DELETE
  # ===========================================================================
  - path: "/api/v1/staging/bulk-delete"
    method: POST
    auth: user
    description: "Bulk delete staging records"
    request:
      body:
        staging_ids: "array of integers (required)"
    response:
      status: 200
      body:
        message: "Deleted N staging records"
    errors:
      - status: 400
        detail: "staging_ids cannot be empty"
      - status: 404
        detail: "No staging records found"
    notes: "Only deletes records where user_id matches current user."

  # ===========================================================================
  # BULK UPDATE
  # ===========================================================================
  - path: "/api/v1/staging/bulk-update"
    method: POST
    auth: user
    description: "Bulk update staging records enrichment"
    request:
      body:
        staging_ids: "array of integers (required)"
        article_id: "integer (optional)"
        financial_center_id: "integer (optional)"
        cost_center_id: "integer (optional)"
        record_type: "string: 'fact' | 'plan' (optional)"
    response:
      status: 200
      body:
        message: "Updated N staging records"
    errors:
      - status: 400
        detail: "staging_ids cannot be empty"
      - status: 404
        detail: "No staging records found"
    notes: |
      Only updates non-None fields.
      Only updates records where user_id matches current user.
      Used by Step 4 (Enrichment) bulk panel.

  # ===========================================================================
  # EXECUTE IMPORT
  # ===========================================================================
  - path: "/api/v1/staging/import"
    method: POST
    auth: user
    description: "Execute import from staging to budget facts"
    request:
      body:
        staging_ids: "array of integers (required)"
    response:
      status: 200
      body:
        success: "boolean"
        total_imported: "integer"
        message: "string"
    errors:
      - status: 400
        detail: "staging_ids cannot be empty"
      - status: 400
        detail: "Staging record N missing article_id/financial_center_id"
      - status: 400
        detail: "Invalid amount format"
      - status: 400
        detail: "Zero amount not allowed"
      - status: 404
        detail: "No staging records found"
    workflow:
      - "Validate all staging records exist and belong to current user"
      - "Validate all have required fields (article_id, financial_center_id)"
      - "Parse amount_string with smart format detection"
      - "Convert to absolute value (expenses stored as positive)"
      - "Create BudgetFact records"
      - "Create BudgetFactHistory records (SCD Type 2)"
      - "Delete staging records"
      - "Commit transaction"
    side_effects:
      - "BudgetFact records created"
      - "BudgetFactHistory records created"
      - "ImportStaging records deleted"
    notes: |
      Amount parsing handles international formats:
      - Russian/EU: "1 234,56" (space thousands, comma decimal)
      - US: "1,234.56" (comma thousands, dot decimal)
      - German: "1.234,56" (dot thousands, comma decimal)

# Authorization
authorization:
  check: "get_current_user"
  path: "backend/app/core/auth.py"
  requires:
    - "Valid JWT token"
    - "User.is_active == True"
  notes: |
    Unlike admin staging endpoints, these do NOT require is_admin.
    Data isolation is enforced by filtering WHERE user_id = current_user.id

# Models
models:
  - $ref: "../database/support.yaml#/tables/t_import_staging"
  - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
  - $ref: "../database/history.yaml#/tables/t_f_budget_fact_history"

# Related
related:
  admin_endpoints:
    path: "/api/v1/admin/staging"
    description: "Admin-only staging endpoints (same functionality, requires is_admin)"
    file: "./admin.yaml"
  import_endpoints:
    path: "/api/v1/import"
    description: "Upload, analyze, map, parse CSV files"
    file: "./import.yaml"

# Frontend
frontend:
  page: "admin_import.html"
  notes: |
    Despite the filename, this page is accessible to all authenticated users.
    Uses /api/v1/staging endpoints (NOT /api/v1/admin/staging).
