# WebSocket Endpoints
# WebSocket + Long Polling for real-time updates

routes:
  # ---------------------------------------------------------------------------
  # WEBSOCKET CONNECT
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/ws"
    method: WebSocket
    auth: "JWT token via query parameter"
    description: "Establish WebSocket connection for real-time updates"
    query_params:
      - name: "token"
        type: "string"
        required: true
        description: "JWT access token (WebSocket cannot use cookies)"
    implementation:
      file: "backend/app/api/v1/endpoints/budget_ws.py"
      loc: 870
      manager: "BudgetWebSocketManager"

    server_to_client_events:
      - name: "connected"
        description: "Initial connection confirmation"
        data:
          message: "Connected to WebSocket"
          connection_id: "string (UUID)"

      - name: "ping"
        description: "Server keepalive (every 10 seconds)"
        data:
          timestamp: "ISO 8601"

      - name: "pong"
        description: "Response to client ping"
        data:
          timestamp: "ISO 8601"

      - name: "online_status"
        description: "Response to check_online request"
        data:
          online: "boolean (always true)"
          timestamp: "ISO 8601"

      - name: "fact_created"
        data:
          id: "integer"
          amount: "decimal"
          article_id: "integer"
          fact_date: "YYYY-MM-DD"
          record_type: "string"
        trigger: "POST /api/v1/facts"

      - name: "fact_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/facts/{id}"

      - name: "fact_deleted"
        data:
          id: "integer"
        trigger: "DELETE /api/v1/facts/{id}"

      - name: "plan_created"
        data:
          id: "integer"
          amount: "decimal"
          article_id: "integer"
          plan_date: "YYYY-MM-DD"
          record_type: "string"
        trigger: "POST /api/v1/facts (plan)"

      - name: "plan_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/facts/{id} (plan)"

      - name: "plan_deleted"
        data:
          id: "integer"
        trigger: "DELETE /api/v1/facts/{id} (plan)"

      - name: "transfer_created"
        data:
          transfer_id: "UUID"
          from_financial_center_id: "integer"
          to_financial_center_id: "integer"
          amount: "decimal"
        trigger: "POST /api/v1/transfers"

      - name: "transfer_deleted"
        data:
          transfer_id: "UUID"
        trigger: "DELETE /api/v1/transfers/{id}"

      - name: "item_created"
        data:
          id: "integer"
          shopping_list_id: "integer"
          name: "string"
        trigger: "POST /api/v1/shopping-list-items"

      - name: "item_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/shopping-list-items/{id}"

      - name: "item_deleted"
        data:
          id: "integer"
        trigger: "DELETE /api/v1/shopping-list-items"

      - name: "item_completed"
        data:
          id: "integer"
          is_completed: "boolean"
        trigger: "PUT /api/v1/shopping-list-items/{id}/complete"

      - name: "article_created"
        data:
          id: "integer"
          name: "string"
          type: "string"
        trigger: "POST /api/v1/articles"

      - name: "article_updated"
        data:
          id: "integer"
          changed_fields: "array"
        trigger: "PUT /api/v1/articles/{id}"

    client_to_server_messages:
      - type: "ping"
        description: "Client keepalive, server responds with pong"
        response: "pong"

      - type: "check_online"
        description: "Check server availability for offline mode detection"
        response: "online_status"

  # ---------------------------------------------------------------------------
  # LONG POLLING (Fallback)
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/poll"
    method: GET
    auth: user
    description: "Long polling fallback when WebSocket unavailable"
    implementation:
      file: "backend/app/api/v1/endpoints/budget_ws.py"
    query_params:
      - name: "since"
        type: "float"
        description: "Timestamp to get events since (Unix timestamp with microseconds)"
      - name: "timeout"
        type: "integer"
        default: 10
        max: 30
        description: "Maximum wait time in seconds"
    response:
      status: 200
      body:
        events: "array of events since timestamp"
        server_time: "float (Unix timestamp for next poll)"
    usage:
      description: |
        Comet-style long polling fallback.
        Client sends GET request with 'since' timestamp.
        Server holds request until events available or timeout.
        Used when WebSocket connection fails.
      interval: "Client polls every 10 seconds"
      triggered_by:
        - "WebSocket connection failure"
        - "_startLongPolling() in budgetWSClient.js"

  # ---------------------------------------------------------------------------
  # STATUS
  # ---------------------------------------------------------------------------
  - path: "/api/v1/budget/status"
    method: GET
    auth: user
    description: "Check WebSocket connection status"
    response:
      status: 200
      body:
        connected: "boolean"
        connection_count: "integer (total connections)"
        user_connection_count: "integer (user's connections)"

# Critical Constraint
critical_constraint:
  $ref: "../functionality/realtime.yaml#/critical_constraint"

# Frontend Integration
frontend:
  js_module:
    $ref: "../web/js-modules.yaml#/modules/budgetWSClient"

  ui:
    indicator_location: "navbar"
    indicator_id: "#budget-sse-status-indicator"
    states:
      connected: "green - Real-time via WebSocket"
      connected_via_leader: "green - Via another tab (follower mode)"
      approaching_limit: "warning - Many connections"
      disconnected: "red - Connection error"
      reconnecting: "loading - Reconnecting..."
      limit_reached: "red - Connection limit reached"
      offline: "gray - Offline mode"

  safari_ios:
    description: |
      Safari iOS теперь использует WebSocket вместо SSE.
      WebSocket не имеет проблем с буферизацией как SSE.
      Per-tab connection (без Web Locks) для надёжности.

    detection:
      method: "_detectSafariIOS()"
      checks:
        - name: "Standard iOS"
          check: "/iPad|iPhone|iPod/.test(ua) && !window.MSStream"
        - name: "iPadOS Desktop Mode"
          check: "navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1"
        - name: "Safari-like browser"
          check: "/Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua)"

    strategy: |
      1. Пропуск Web Locks - каждая вкладка создаёт своё WebSocket соединение
      2. Long Polling fallback если WebSocket не работает
      3. Прямое подключение без leader election

    improvements_over_sse:
      - "Нет буферизации (SSE буферизировал до 2KB)"
      - "Нет проблем с EventSource API"
      - "Bidirectional communication для проверки соединения"

  multi_tab_support:
    description: "Одно WebSocket соединение на браузер через Web Locks + BroadcastChannel"
    leader_tab: "Создаёт WebSocket соединение, рассылает события"
    follower_tabs: "Получают события через BroadcastChannel от лидера"
    leader_heartbeat: "Каждые 3 секунды для обнаружения падения лидера"
    connection_staleness: "45 секунд без ping = stale, force reconnect"
    safari_ios_exception: "На Safari iOS multi-tab отключен - каждая вкладка независима"

# Connection Manager
connection_manager:
  type: "In-memory"
  class: "BudgetWebSocketManager"
  methods:
    - connect: "Add client to pool, returns connection_id"
    - disconnect: "Remove client from pool"
    - broadcast: "Send event to all clients"
    - update_activity: "Update last activity timestamp"
    - cleanup_stale_connections: "Remove stale connections (>60s inactive)"
  note: |
    In-memory manager does NOT share state between workers.
    MUST run with WORKERS=1.

# Event Buffer (for Long Polling)
event_buffer:
  type: "In-memory ring buffer"
  class: "EventBuffer"
  max_events: 1000
  max_age_seconds: 60
  methods:
    - add_event: "Add event to buffer"
    - get_events_since: "Get events since timestamp"
