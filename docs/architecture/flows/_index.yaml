# Data Flows Index
# Process flows and data pipelines

summary:
  total_flows: 5
  categories:
    - name: "User Operations"
      flows: [create-transaction, telegram-oauth]
    - name: "Real-time"
      flows: [sse-broadcast]
    - name: "Offline"
      flows: [offline-sync]
    - name: "Import"
      flows: [csv-import]

flows:
  create_transaction:
    file: "./create-transaction.yaml"
    description: "Create income/expense/transfer transaction"
    trigger: "User action (web form, Telegram bot)"
    components:
      - $ref: "../endpoints/facts.yaml"
      - $ref: "../functionality/budget-management.yaml"
      - $ref: "../database/facts.yaml"

  telegram_oauth:
    file: "./telegram-oauth.yaml"
    description: "Telegram authentication flow"
    trigger: "User clicks 'Login with Telegram'"
    components:
      - $ref: "../endpoints/auth.yaml"
      - $ref: "../functionality/authentication.yaml"
      - $ref: "../database/support.yaml#/tables/t_refresh_token"

  sse_broadcast:
    file: "./sse-broadcast.yaml"
    description: "Real-time event broadcasting"
    trigger: "Data mutation (create, update, delete)"
    components:
      - $ref: "../functionality/realtime.yaml"
      - $ref: "../endpoints/sse.yaml"
      - $ref: "../web/js-modules.yaml#/modules/budgetSSEClient"

  offline_sync:
    file: "./offline-sync.yaml"
    description: "Offline data synchronization"
    trigger: "Network restored, pending changes"
    components:
      - $ref: "../functionality/offline.yaml"
      - $ref: "../web/js-modules.yaml#/modules/offlineManager"

  csv_import:
    file: "./csv-import.yaml"
    description: "CSV file import pipeline"
    trigger: "User uploads CSV file"
    components:
      - $ref: "../endpoints/import.yaml"
      - $ref: "../functionality/csv-import.yaml"
      - $ref: "../database/support.yaml#/tables/t_import_staging"

# Flow Diagram Legend
legend:
  symbols:
    "→": "Synchronous call"
    "⇒": "Asynchronous call"
    "◆": "Decision point"
    "●": "Start"
    "○": "End"
    "□": "Process/Action"
    "◇": "Database operation"
    "⬡": "External service"

  colors:
    green: "Success path"
    red: "Error path"
    yellow: "Warning/Validation"
    blue: "User interaction"

# Common Patterns
patterns:
  request_response:
    description: "Standard API request/response"
    steps:
      - "Client → API endpoint"
      - "Validate request"
      - "Execute business logic"
      - "Persist to database"
      - "Return response"

  event_driven:
    description: "Event-driven processing"
    steps:
      - "Action triggers event"
      - "Event dispatched to listeners"
      - "Listeners process independently"
      - "No blocking wait"

  saga_pattern:
    description: "Distributed transaction (e.g., transfers)"
    steps:
      - "Start transaction"
      - "Execute step 1"
      - "Execute step 2"
      - "If error: compensate previous steps"
      - "Commit or rollback"

# Related Documentation
related:
  functionality:
    $ref: "../functionality/_index.yaml"
  endpoints:
    $ref: "../endpoints/_index.yaml"
  guides:
    $ref: "../guides/_index.yaml"
