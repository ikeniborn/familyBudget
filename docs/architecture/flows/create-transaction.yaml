  │           │                                                             │
  │           ▼                                                             │
  │    ┌─────────────┐                                                      │
  │    │ Business    │                                                      │
  │    │ Validation  │                                                      │
  │    │ (service)   │                                                      │
  │    └──────┬──────┘                                                      │
  │           │                                                             │
