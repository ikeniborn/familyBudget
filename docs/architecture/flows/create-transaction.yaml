# ===========================================================================
# TRANSFER SUB-FLOW
# ===========================================================================
transfer_flow: |

  [Transfer Flow] - when record_type IN ('transfer_out', 'transfer_in')

  ◇─────────────────────────────────────────────────────────────────────◇
  │ BEGIN TRANSACTION                                                   │
  │                                                                     │
  │  1. Generate transfer_id (UUID)                                     │
  │                                                                     │
  │  2. Create transfer_out fact:                                       │
  │     ┌─────────────────────────────────────────────┐                 │
  │     │ INSERT t_f_budget_fact                      │                 │
  │     │   amount = -abs(amount)                     │                 │
  │     │   financial_center_id = from_fc_id          │                 │
  │     │   record_type = 'transfer_out'              │                 │
  │     │   transfer_id = generated_uuid               │                 │
  │     └─────────────────────────────────────────────┘                 │
  │                                                                     │
  │  3. Create transfer_in fact:                                        │
  │     ┌─────────────────────────────────────────────┐                 │
  │     │ INSERT t_f_budget_fact                      │                 │
  │     │   amount = +abs(amount)                     │                 │
  │     │   financial_center_id = to_fc_id            │                 │
  │     │   record_type = 'transfer_in'               │                 │
  │     │   transfer_id = same_uuid                    │                 │
  │     └─────────────────────────────────────────────┘                 │
  │                                                                     │
  │  4. Create history records for both facts                           │
  │                                                                     │
  │ COMMIT                                                              │
  ◇─────────────────────────────────────────────────────────────────────◇

  INVARIANT: SUM(amount) WHERE transfer_id = X MUST equal 0

# ===========================================================================
# STEPS DETAIL
# ===========================================================================
steps:
  1_authentication:
    name: "JWT Authentication"
    component:
      $ref: "../functionality/authentication.yaml#/module/services/0"
    input:
      - "Authorization header or cookie"
    output:
      - "current_user object"
    errors:
      - code: 401
        message: "Invalid or expired token"

  2_validation:
    name: "Request Validation"
    component: "Pydantic schema (FactCreate)"
    file: "backend/app/schemas/budget_fact.py"
    validates:
      - amount: "required, non-zero decimal"
      - article_id: "required, integer"
      - fact_date: "required, YYYY-MM-DD format"
      - financial_center_id: "optional, integer"
      - cost_center_id: "optional, integer"
      - description: "optional, string"
      - record_type: "required, enum"
    errors:
      - code: 422
        message: "Validation error with field details"

  3_business_validation:
    name: "Business Rules"
    component:
      $ref: "../functionality/budget-management.yaml#/module/services/2"
    validates:
      - "Article exists and is_active = TRUE"
      - "FinancialCenter exists (if provided)"
      - "CostCenter exists (if provided)"
      - "fact_date within allowed range (2023-2030)"
      - "record_type matches article.type"
    errors:
      - code: 400
        message: "Business rule violation"

  4_persistence:
    name: "Database Operations"
    tables:
      - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
      - $ref: "../database/history.yaml#/tables/t_f_budget_fact_history"
    transaction: true
    operations:
      - "INSERT BudgetFact"
      - "INSERT BudgetFactHistory (change_type='CREATE')"
    critical_note: |
      History record MUST include ALL fields from BudgetFact,
      especially record_type (NOT NULL constraint).
      See CLAUDE.md "History Tables" section.

  5_ws_broadcast:
    name: "Real-time Notification"
    component:
      $ref: "../functionality/realtime.yaml#/connection_manager"
    event:
      name: "fact_created"
      data:
        id: "integer"
        amount: "decimal"
        article_id: "integer"
        fact_date: "YYYY-MM-DD"
    note: "Only reaches clients on same worker (WORKERS=1 required)"

  6_response:
    name: "API Response"
    status: 201
    body:
      id: "integer"
      amount: "decimal"
      article_id: "integer"
      article_name: "string"
      fact_date: "YYYY-MM-DD"
      created_at: "ISO 8601"

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
errors:
  validation_error:
    code: 422
    cause: "Invalid input data"
    action: "Show validation errors to user"

  unauthorized:
    code: 401
    cause: "Invalid/expired JWT"
    action: "Redirect to login"

  not_found:
    code: 404
    cause: "Article/FC/CC not found"
    action: "Show error message"

  conflict:
    code: 409
    cause: "Duplicate transaction (idempotency)"
    action: "Return existing transaction"

  server_error:
    code: 500
    cause: "Database error, unexpected exception"
    action: "Log error, show generic message"

# ===========================================================================
# FRONTEND INTEGRATION
# ===========================================================================
frontend:
  web_form:
    template: "partials/modal_transaction.html"
    htmx:
      trigger: "submit"
      method: "POST"
      target: "#transactions-list"
      swap: "afterbegin"
    on_success:
      - "Close modal"
      - "Show success toast"
      - "WebSocket auto-updates list"

  telegram_webapp:
    file: "frontend/webapp/static/add.html"
    js_module: "transactionForm.js"
    on_success:
      - "Close webapp"
      - "Show telegram notification"

# ===========================================================================
# OBSERVABILITY
# ===========================================================================
observability:
  logs:
    - level: INFO
      message: "Fact created: id={id}, user={user_id}, amount={amount}"
    - level: ERROR
      message: "Fact creation failed: {error}"

  metrics:
    - name: "facts_created_total"
      type: counter
      labels: [record_type, article_type]

    - name: "fact_creation_duration_seconds"
      type: histogram

  tracing:
    span_name: "create_fact"
    attributes:
      - user_id
      - article_id
      - record_type
