# Create Transaction Flow
# Income, Expense, Transfer creation process

meta:
  name: "Create Transaction"
  trigger: "User submits transaction form"
  actors:
    - "Web UI (HTMX form)"
    - "Telegram Web App"
    - "API client"
  outcome: "BudgetFact record created, WebSocket broadcast"

