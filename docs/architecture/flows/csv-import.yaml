# ===========================================================================
# BANK PROVIDERS
# ===========================================================================
bank_providers:
  tinkoff:
    code: "tinkoff"
    name: "Тинькофф Банк"
    encoding: "UTF-8"
    delimiter: ";"
    date_format: "DD.MM.YYYY"
    columns:
      date: "Дата операции"
      amount: "Сумма операции"
      description: "Описание"
      category: "Категория"
    auto_detect:
      header_pattern: "Дата операции;Дата платежа"

  sberbank:
    code: "sberbank"
    name: "Сбербанк"
    encoding: "CP1251"
    delimiter: ";"
    date_format: "DD.MM.YYYY"
    columns:
      date: "Дата операции"
      amount: "Сумма"
      description: "Описание операции"
    auto_detect:
      header_pattern: "Номер карты;Дата операции"

  alfabank:
    code: "alfabank"
    name: "Альфа-Банк"
    encoding: "UTF-8"
    delimiter: ","
    date_format: "YYYY-MM-DD"
    columns:
      date: "Дата"
      amount: "Сумма"
      description: "Описание"
    auto_detect:
      header_pattern: "account_number,date"

  generic:
    code: "generic"
    name: "Универсальный формат"
    encoding: "auto"
    delimiter: "auto"
    date_format: "auto"
    requires_manual_mapping: true

# ===========================================================================
# DATA VALIDATION
# ===========================================================================
validation:
  date:
    formats:
      - "DD.MM.YYYY"
      - "YYYY-MM-DD"
      - "DD/MM/YYYY"
      - "MM/DD/YYYY"
    range: "2023-01-01 to 2030-12-31"
    error: "Invalid date format or out of range"

  amount:
    rules:
      - "Must be decimal number"
      - "Must be non-zero"
      - "Handle thousand separators (1 000.00)"
      - "Handle comma decimals (1000,50)"
    error: "Invalid amount format"

  description:
    max_length: 500
    sanitize: "Strip HTML, normalize whitespace"

  duplicate_detection:
    method: "Hash(date + amount + description)"
    action: "Mark as duplicate, skip or warn"

# ===========================================================================
# DATABASE TABLES
# ===========================================================================
tables:
  import_file_upload:
    $ref: "../database/support.yaml#/tables/t_import_file_upload"
    purpose: "Track uploaded files"

  import_staging:
    $ref: "../database/support.yaml#/tables/t_import_staging"
    purpose: "Parsed rows before import"

  import_column_mapping:
    $ref: "../database/support.yaml#/tables/t_import_column_mapping"
    purpose: "User-defined column mappings"

  budget_fact:
    $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
    purpose: "Final imported transactions"

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
errors:
  file_too_large:
    code: 413
    message: "File exceeds 10MB limit"

  invalid_format:
    code: 400
    message: "Invalid CSV format"
    details: "encoding, delimiter, or structure"

  no_valid_rows:
    code: 400
    message: "No valid rows to import"

  partial_import:
    code: 207
    message: "Partial import completed"
    body:
      imported: "N rows"
      failed: "M rows"
      errors: ["row 5: invalid date", ...]

# ===========================================================================
# FRONTEND INTEGRATION
# ===========================================================================
frontend:
  import_page:
    template: "frontend/web/templates/import.html"

  steps:
    1_upload:
      component: "File drop zone"
      shows: "Progress bar"
      on_success: "Show detected bank, row count"

    2_mapping:
      component: "Column mapping form"
      shows: "Detected columns with dropdowns"
      auto_fill: "From bank provider template"

    3_preview:
      component: "Data table"
      shows: "First 10 rows with validation status"
      actions: "Edit mapping, change article"

    4_confirm:
      component: "Summary and confirm button"
      shows: "Valid/invalid counts, warnings"
      action: "Execute import"

    5_result:
      component: "Result summary"
      shows: "Imported count, link to transactions"

# ===========================================================================
# SERVICES
# ===========================================================================
services:
  - $ref: "../functionality/csv-import.yaml#/module/services"

# ===========================================================================
# ENDPOINTS
# ===========================================================================
endpoints:
  - $ref: "../endpoints/import.yaml#/routes"
