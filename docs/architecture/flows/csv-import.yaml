# CSV Import Flow
# Upload → Analyze → Preview → Execute pipeline

meta:
  name: "CSV Import"
  trigger: "User uploads CSV file or provides Google Sheets URL"
  actors:
    - "Web UI (import form)"
    - "Backend API"
    - "CSV Parser"
    - "Google Sheets Parser"
  outcome: "BudgetFact records created from CSV or Google Sheets"

