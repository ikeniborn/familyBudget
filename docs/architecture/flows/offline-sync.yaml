# Offline Sync Flow
# IndexedDB → Backend synchronization

meta:
  name: "Offline Sync"
  trigger: "Network restored, pending changes in queue"
  actors:
    - "OfflineManager (JS)"
    - "Service Worker"
    - "Backend API"
  outcome: "Local changes synchronized with server"

# ===========================================================================
# ARCHITECTURE OVERVIEW
# ===========================================================================
architecture: |
  ┌─────────────────────────────────────────────────────────────────────────┐
  │                      OFFLINE-FIRST ARCHITECTURE                         │
  └─────────────────────────────────────────────────────────────────────────┘

  ┌──────────────────┐     ┌───────────────────┐     ┌──────────────────┐
  │   UI Layer       │     │  OfflineManager   │     │   IndexedDB      │
  │                  │────►│                   │────►│                  │
  │  - Forms         │     │  - Queue ops      │     │  - syncQueue     │
  │  - Lists         │     │  - Sync logic     │     │  - cachedData    │
  │  - Modals        │     │  - Conflict res.  │     │  - metadata      │
  └──────────────────┘     └─────────┬─────────┘     └──────────────────┘
                                     │
                                     │ When online
                                     ▼
                           ┌───────────────────┐
                           │   Backend API     │
                           │                   │
                           │  - /facts         │
                           │  - /articles      │
                           │  - /etc           │
                           └───────────────────┘

# ===========================================================================
# FLOW DIAGRAM - OFFLINE OPERATION
# ===========================================================================
offline_operation: |
  ┌─────────────────────────────────────────────────────────────────────────┐
  │                    OFFLINE OPERATION FLOW                               │
  └─────────────────────────────────────────────────────────────────────────┘

  ●─────────────────────────────────────────────────────────────────────────●
  │                                                                         │
  │  ┌────────────┐                                                         │
  │  │ User       │                                                         │
  │  │ creates    │                                                         │
  │  │ transaction│                                                         │
  │  └─────┬──────┘                                                         │
  │        │                                                                │
  │        ▼                                                                │
  │  ◆ Network available?                                                   │
  │ / \                                                                     │
  │/   \                                                                    │
  │Yes  No                                                                  │
  │ │    │                                                                  │
  │ │    ▼                                                                  │
  │ │  ┌────────────────────────────────────────────┐                      │
  │ │  │ OfflineManager.queueOperation()            │                      │
  │ │  │                                            │                      │
  │ │  │  operation = {                             │                      │
  │ │  │    id: uuid(),                             │                      │
  │ │  │    type: 'CREATE_FACT',                    │                      │
  │ │  │    data: { amount, article_id, ... },      │                      │
  │ │  │    timestamp: Date.now(),                  │                      │
  │ │  │    status: 'pending',                      │                      │
  │ │  │    retryCount: 0                           │                      │
  │ │  │  }                                         │                      │
  │ │  └────────────────┬───────────────────────────┘                      │
  │ │                   │                                                   │
  │ │                   ▼                                                   │
  │ │  ┌────────────────────────────────────────────┐                      │
  │ │  │ IndexedDB: syncQueue.add(operation)        │                      │
  │ │  └────────────────┬───────────────────────────┘                      │
  │ │                   │                                                   │
  │ │                   ▼                                                   │
  │ │  ┌────────────────────────────────────────────┐                      │
  │ │  │ UI: Show optimistic update                 │                      │
  │ │  │     + "Pending sync" indicator             │                      │
  │ │  └────────────────────────────────────────────┘                      │
  │ │                                                                       │
  │ ▼                                                                       │
  │ [Normal API flow]                                                       │
  │                                                                         │
  ○─────────────────────────────────────────────────────────────────────────○

# ===========================================================================
# FLOW DIAGRAM - SYNC PROCESS
# ===========================================================================
sync_process: |
  ┌─────────────────────────────────────────────────────────────────────────┐
  │                       SYNC PROCESS FLOW                                 │
  └─────────────────────────────────────────────────────────────────────────┘

  ●─────────────────────────────────────────────────────────────────────────●
  │                                                                         │
  │  ┌────────────┐                                                         │
  │  │ Network    │  (navigator.onLine event)                              │
  │  │ restored   │                                                         │
  │  └─────┬──────┘                                                         │
  │        │                                                                │
  │        ▼                                                                │
  │  ┌────────────────────────────────────────────┐                        │
  │  │ OfflineManager.startSync()                 │                        │
  │  └─────────────────┬──────────────────────────┘                        │
  │                    │                                                    │
  │                    ▼                                                    │
  │  ┌────────────────────────────────────────────┐                        │
  │  │ Get pending operations from IndexedDB      │                        │
  │  │ ORDER BY timestamp ASC                     │                        │
  │  └─────────────────┬──────────────────────────┘                        │
  │                    │                                                    │
  │                    ▼                                                    │
  │  ┌────────────────────────────────────────────┐                        │
  │  │ FOR EACH operation:                        │                        │
  │  └─────────────────┬──────────────────────────┘                        │
  │                    │                                                    │
  │                    ▼                                                    │
  │             ┌──────────────┐                                            │
  │             │ Send to API  │                                            │
  │             └──────┬───────┘                                            │
  │                    │                                                    │
  │             ◆ Success?                                                  │
  │            / \                                                          │
  │           /   \                                                         │
  │         Yes    No                                                       │
  │          │      │                                                       │
  │          │      ▼                                                       │
  │          │    ◆ Error type?                                            │
  │          │   /    |    \                                               │
  │          │  /     |     \                                              │
  │          │ 4xx   5xx   Network                                         │
  │          │  │     │       │                                            │
  │          │  │     │       ▼                                            │
  │          │  │     │   ┌─────────────────┐                              │
  │          │  │     │   │ Retry later     │                              │
  │          │  │     │   │ (exponential    │                              │
  │          │  │     │   │  backoff)       │                              │
  │          │  │     │   └─────────────────┘                              │
  │          │  │     │                                                     │
  │          │  │     ▼                                                     │
  │          │  │   ┌─────────────────┐                                    │
  │          │  │   │ Retry up to 3x  │                                    │
  │          │  │   │ then mark failed│                                    │
  │          │  │   └─────────────────┘                                    │
  │          │  │                                                           │
  │          │  ▼                                                           │
  │          │ ┌─────────────────┐                                         │
  │          │ │ Handle conflict │                                         │
  │          │ │ (see below)     │                                         │
  │          │ └────────┬────────┘                                         │
  │          │          │                                                   │
  │          ▼          ▼                                                   │
  │    ┌─────────────────────────────────────────┐                         │
  │    │ Remove from syncQueue                   │                         │
  │    │ Update UI                               │                         │
  │    └─────────────────────────────────────────┘                         │
  │                    │                                                    │
  │                    ▼                                                    │
  │           [Next operation]                                              │
  │                                                                         │
  ○─────────────────────────────────────────────────────────────────────────○

# ===========================================================================
# CONFLICT RESOLUTION
# ===========================================================================
conflict_resolution:
  strategies:
    last_write_wins:
      description: "Most recent change wins"
      used_for: "Simple field updates"
      implementation: |
        if (server.updated_at > local.updated_at) {
          // Server wins, discard local
          discardLocal(operation);
        } else {
          // Local wins, force push
          forcePush(operation);
        }

    server_wins:
      description: "Always prefer server state"
      used_for: "Admin-controlled data"
      implementation: |
        discardLocal(operation);
        refreshFromServer();

    merge:
      description: "Combine changes from both"
      used_for: "Non-conflicting field updates"
      implementation: |
        merged = {
          ...server,
          ...local.changedFieldsOnly
        };
        push(merged);

    user_resolution:
      description: "Ask user to resolve"
      used_for: "Critical conflicts"
      implementation: |
        showConflictDialog(local, server, (choice) => {
          if (choice === 'local') forcePush(local);
          else discardLocal(local);
        });

  conflict_detection:
    method: "Version vector / timestamp comparison"
    code: |
      // Each entity has updated_at timestamp
      // Conflict if:
      // - Local change made at T1
      // - Server has change at T2 where T2 > T1

# ===========================================================================
# INDEXEDDB SCHEMA
# ===========================================================================
indexeddb_schema:
  database_name: "FamilyBudgetOffline"
  version: 1

  object_stores:
    syncQueue:
      keyPath: "id"
      indexes:
        - name: "status"
          keyPath: "status"
        - name: "timestamp"
          keyPath: "timestamp"
      structure:
        id: "UUID"
        type: "CREATE_FACT | UPDATE_FACT | DELETE_FACT | ..."
        data: "Object (request body)"
        timestamp: "Unix timestamp"
        status: "pending | syncing | failed | completed"
        retryCount: "integer"
        error: "string (if failed)"

    cachedData:
      keyPath: "key"
      structure:
        key: "string (e.g., 'articles', 'financial_centers')"
        data: "array of entities"
        lastSync: "Unix timestamp"
        etag: "string (for conditional requests)"

    metadata:
      keyPath: "key"
      structure:
        key: "string"
        value: "any"

# ===========================================================================
# OPERATION TYPES
# ===========================================================================
operation_types:
  CREATE_FACT:
    endpoint: "POST /api/v1/facts"
    rollback: "DELETE from local cache"
    conflict: "Rare (new entity)"

  UPDATE_FACT:
    endpoint: "PUT /api/v1/facts/{id}"
    rollback: "Restore previous version"
    conflict: "Compare updated_at timestamps"

  DELETE_FACT:
    endpoint: "DELETE /api/v1/facts/{id}"
    rollback: "Restore to local cache"
    conflict: "Check if already deleted"

  CREATE_SHOPPING_ITEM:
    endpoint: "POST /api/v1/shopping-list-items"
    rollback: "Remove from local list"

  UPDATE_SHOPPING_ITEM:
    endpoint: "PUT /api/v1/shopping-list-items/{id}"
    rollback: "Restore previous state"
    conflict: "Merge is_checked changes"

  DELETE_SHOPPING_ITEM:
    endpoint: "DELETE /api/v1/shopping-list-items/{id}"
    rollback: "Restore to local list"

# ===========================================================================
# SERVICE WORKER INTEGRATION
# ===========================================================================
service_worker:
  file: "frontend/web/static/sw.js"

  background_sync:
    description: "Sync when app is in background"
    api: "Background Sync API"
    code: |
      // Register sync event
      navigator.serviceWorker.ready.then((registration) => {
        registration.sync.register('sync-transactions');
      });

      // Handle in service worker
      self.addEventListener('sync', (event) => {
        if (event.tag === 'sync-transactions') {
          event.waitUntil(syncTransactions());
        }
      });

  offline_fallback:
    description: "Serve cached content when offline"
    strategy: "Cache first, network fallback"

# ===========================================================================
# UI INDICATORS
# ===========================================================================
ui_indicators:
  sync_status:
    location: "Navbar, near SSE indicator"
    states:
      synced:
        icon: "✓"
        color: "green"
        tooltip: "All changes synced"

      pending:
        icon: "↻"
        color: "yellow"
        animation: "pulse"
        tooltip: "X changes pending sync"

      syncing:
        icon: "↻"
        color: "blue"
        animation: "spin"
        tooltip: "Syncing..."

      error:
        icon: "!"
        color: "red"
        tooltip: "Sync failed. Click to retry"

  offline_banner:
    trigger: "navigator.onLine === false"
    message: "You're offline. Changes will sync when connected."
    dismissable: false

  item_indicators:
    pending_item:
      style: "Slightly faded, clock icon"
    failed_item:
      style: "Red border, warning icon"
      action: "Click to retry or discard"

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
error_handling:
  network_error:
    action: "Add to retry queue"
    max_retries: 3
    backoff: "exponential (1s, 2s, 4s)"

  validation_error_4xx:
    action: "Mark as failed, notify user"
    user_action: "Edit and retry, or discard"

  server_error_5xx:
    action: "Retry with backoff"
    max_retries: 5

  conflict_409:
    action: "Fetch server version, resolve conflict"

  auth_error_401:
    action: "Pause sync, redirect to login"

# ===========================================================================
# COMPONENTS
# ===========================================================================
components:
  frontend:
    - $ref: "../web/js-modules.yaml#/modules/offlineManager"

  functionality:
    - $ref: "../functionality/offline.yaml"
