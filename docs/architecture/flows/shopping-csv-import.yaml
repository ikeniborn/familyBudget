# Shopping Lists CSV Import Flow
# Specialized flow for importing shopping list items from CSV or Google Sheets

meta:
  name: "Shopping Lists CSV Import"
  trigger: "User uploads CSV or imports from Google Sheets"
  actors:
    - "Web UI (lists.html import wizard)"
    - "Backend API (shopping_csv_import.py)"
    - "CSV Validator (csv_validator.py)"
  outcome: "ShoppingListItem records created, stores/groups auto-created"
  fixes:
    - "✅ Aggregation UX confusion (added info messages)"
    - "✅ New stores/groups not in dropdowns (reload after import)"
    - "✅ Google Sheets OAuth window (improved redirect detection)"
    - "✅ Backend returns metadata about created references"
    - "✅ [object Object] error display (proper Pydantic error handling)"
    - "✅ HTTP 307 redirect handling (manual redirect following)"
    - "✅ Preview table pagination and filtering (client-side)"

# ===========================================================================
# FLOW STAGES
# ===========================================================================
stages:
  1_method_selection:
    description: "User chooses import method: CSV file or Google Sheets URL"
    components:
      - "csvImporter.js:renderMethodSelection()"
      - "googleSheetsImporter.js"

  2_data_fetch:
    description: "Fetch data from source"
    csv_path: "File upload → base64 encode"
    google_sheets_path: "URL → fetch_google_sheets_as_csv() → CSV text"

  3_column_mapping:
    description: "Map CSV columns to fields: store, product_group, product_name, quantity, comment"
    auto_mapping: "Smart detection based on column names"
    manual_mapping: "Dropdown selectors"

  4_preview_validation:
    description: "Validate rows with options"
    endpoint: "POST /api/v1/shopping-lists/import/preview"
    options:
      create_missing_references: "Treat missing stores/groups as future-created (no error)"
      aggregate_duplicates: "Merge rows with same (store, product_group, product_name)"
    aggregation_logic:
      key: "(store.lower(), product_group.lower(), product_name.lower())"
      merge: "Sum quantity, concatenate comments"
      case_preservation: "Keep original case from first occurrence"
    ux_improvements:
      toast: "Shows: 'X rows → Y rows (Z duplicates merged)'"
      alert: "Informational alert explaining aggregation behavior"
    preview_table:
      description: "Client-side pagination and filtering for ALL rows"
      backend_change: "Returns ALL preview_rows (removed 20-row limit)"
      pagination:
        default_rows_per_page: 15
        options: [10, 15, 25, 50, 100]
        state: "previewPagination object in CSVImporter"
      filters:
        store: "Dropdown filter (exact match)"
        group: "Dropdown filter (exact match)"
        product: "Text input (substring search, case-insensitive)"
        state: "previewFilters object in CSVImporter"
      ui_location: "After 'Предпросмотр данных' header"
      rendering: "renderPreviewTableHTML() method"
      updates: "updatePreviewTable() for filter/pagination changes"

  5_execute_import:
    description: "Create shopping list items"
    endpoint: "POST /api/v1/shopping-lists/import/execute"
    auto_create:
      stores: "get_or_create_store() → Store + StoreHistory + code generation"
      product_groups: "get_or_create_product_group() → ProductGroup + ProductGroupHistory + ProductGroupHierarchy (root level)"
    transaction: "Single transaction for all items + history records"
    response_metadata:
      created_stores: "List of newly created Store objects"
      created_product_groups: "List of newly created ProductGroup objects"
    frontend_reload:
      stores_dropdown: "loadStores() + initStoreChoices()"
      groups_dropdown: "loadProductGroups() + initProductGroupChoices()"

# ===========================================================================
# DUPLICATE AGGREGATION
# ===========================================================================
aggregation:
  trigger: "aggregate_duplicates: true checkbox"
  when: "BEFORE validation (shopping_csv_import.py:328)"
  logic: "csv_validator.py:aggregate_duplicate_rows()"

  key_generation:
    components: ["store", "product_group", "product_name"]
    normalization: "lowercase for comparison"
    case_preservation: "Original case from first occurrence"

  merge_behavior:
    quantity: "Sum all quantities: float(q1) + float(q2) + ..."
    comment: "Concatenate: 'comment1, comment2, comment3'"
    other_fields: "Keep from first occurrence"

  ux_improvements:
    problem: "Rows disappear from preview (confusing)"
    solution:
      - "Toast: 'X rows → Y rows (Z merged)' after revalidation"
      - "Alert: 'Aggregation enabled - quantities summed, comments merged'"
      - "Shows in preview results section"

# ===========================================================================
# AUTO-CREATE REFERENCES
# ===========================================================================
auto_create:
  stores:
    function: "csv_validator.py:get_or_create_store()"
    code_generation: "store-YYYYMMDD-HHMMSS format"
    creates:
      - "Store record (SCD Type 1)"
      - "StoreHistory record (change_type='CREATE')"
    cache: "stores_cache dict to avoid duplicate queries"

  product_groups:
    function: "csv_validator.py:get_or_create_product_group()"
    hierarchy: "Always root level (parent_id=NULL)"
    creates:
      - "ProductGroup record (SCD Type 1)"
      - "ProductGroupHistory record (change_type='CREATE')"
      - "ProductGroupHierarchy record (self-reference, depth=0)"
    cache: "product_groups_cache dict to avoid duplicate queries"

  metadata_tracking:
    problem: "Created references not returned to frontend"
    solution:
      - "Track created_stores_dict, created_product_groups_dict during import"
      - "Return in CSVImportResponse.created_stores, created_product_groups"
      - "Frontend reloads dropdowns: loadStores(), loadProductGroups()"
      - "Frontend reinitializes Choices.js: initStoreChoices(), initProductGroupChoices()"
      - "Shows toast: '📦 Created: Stores: X, Y / Groups: A, B'"

# ===========================================================================
# GOOGLE SHEETS IMPORT
# ===========================================================================
google_sheets:
  url_format: "https://docs.google.com/spreadsheets/d/{id}/export?format=csv&gid={sheet_gid}"

  error_handling:
    private_sheet:
      detection: "HTTP 302/307 redirect to accounts.google.com/oauth"
      old_behavior: "httpx follows redirect → opens OAuth window in browser (bad UX)"
      new_behavior: "Manual redirect following with OAuth domain detection"
      error_message: "Лист требует авторизацию. Сделайте его публичным: Файл → Доступ → Доступ по ссылке"

    google_cdn_redirects:
      problem: "Google Sheets uses 307 redirects to doc-*.googleusercontent.com CDN"
      old_behavior: "follow_redirects=False + raise_for_status() on 307 = HTTP error"
      new_behavior: "Manual redirect loop: follow non-OAuth redirects, block OAuth"
      max_redirects: 5
      fix_location: "google_sheets_parser.py:fetch_google_sheets_as_csv()"

    html_response:
      detection: "content-type: text/html"
      meaning: "Login page or error page instead of CSV"
      error_message: "Google Sheets вернул HTML вместо CSV. Проверьте доступ."

    pydantic_validation_errors:
      problem: "FastAPI returns {detail: [{loc, msg, type}]} for validation errors"
      old_behavior: "throw new Error(error.detail) → displays '[object Object]' in toast"
      new_behavior: "Extract messages from array: error.detail.map(e => e.msg).join(', ')"
      fix_location: "googleSheetsImporter.js:handleUrlSubmit() error handling block"

# ===========================================================================
# FILES INVOLVED
# ===========================================================================
files:
  frontend:
    - path: "frontend/web/templates/lists.html"
      description: "Import UI with checkboxes"

    - path: "frontend/web/static/js/lists/csvImporter.js"
      description: "CSV import wizard"
      changes:
        - "Lines 657-679: revalidateWithOptions() - added aggregation toast"
        - "Lines 817-828: renderPreviewResults() - added aggregation alert"
        - "Lines 1082-1105: executeImport() - reload dropdowns, show metadata toast"
      preview_pagination_filtering:
        state_properties:
          - "previewPagination: {currentPage, rowsPerPage, rowsPerPageOptions}"
          - "previewFilters: {store, group, product}"
          - "allPreviewRows: [] - all rows for client-side processing"
        methods:
          - "getUniqueFilterValues(field) - unique values for filter dropdowns"
          - "getFilteredPaginatedRows() - apply filters and pagination"
          - "handleFilterChange(filterType, value) - filter change handler"
          - "handleRowsPerPageChange(value) - page size change handler"
          - "handlePageChange(page) - page navigation handler"
          - "clearFilters() - reset all filters"
          - "updatePreviewTable() - re-render table only"
          - "renderPreviewTableHTML() - render table with filters and pagination"

    - path: "frontend/web/static/js/lists/googleSheetsImporter.js"
      description: "Google Sheets import"

    - path: "frontend/web/static/js/lists/importManager.js"
      description: "Import coordinator"

    - path: "frontend/web/static/js/lists/listsManager.js"
      description: "CRUD operations + dropdowns reload"
      methods:
        - "Line 384: loadStores() - reload stores from API"
        - "Line 442: loadProductGroups() - reload groups from API"
        - "Line 992: initStoreChoices() - reinitialize Choices.js"
        - "Line 1069: initProductGroupChoices() - reinitialize Choices.js"

  backend:
    - path: "backend/app/api/v1/endpoints/shopping_csv_import.py"
      description: "Import endpoints"
      changes:
        - "Line 218-220: Returns ALL preview_rows (removed 20-row limit for client-side pagination)"
        - "Lines 351-353: Added created_stores_dict, created_product_groups_dict"
        - "Lines 392-427: Track created stores and product groups"
        - "Lines 507-531: Return metadata in response"

    - path: "backend/app/services/csv_validator.py"
      description: "Validation + aggregation + auto-create"
      functions:
        - "Lines 404-466: aggregate_duplicate_rows() - already working correctly"
        - "Lines 242-314: get_or_create_store() - pattern for tracking"
        - "Lines 317-401: get_or_create_product_group() - pattern for tracking"

    - path: "backend/app/services/google_sheets_parser.py"
      description: "Google Sheets fetcher"
      changes:
        - "Line 123: Changed follow_redirects=False"
        - "Lines 127-140: Added OAuth redirect detection"
        - "Lines 144-154: Added HTML content-type check"

    - path: "backend/app/schemas/csv_import.py"
      description: "Request/response schemas"
      changes:
        - "Lines 11-12: Added imports for StoreResponse, ProductGroupResponse"
        - "Lines 153-161: Added created_stores, created_product_groups fields"
