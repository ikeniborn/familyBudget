# SSE Broadcast Flow
# Real-time event propagation to connected clients

meta:
  name: "SSE Broadcast"
  trigger: "Data mutation (create, update, delete)"
  actors:
    - "Backend service (event producer)"
    - "BudgetConnectionManager"
    - "Web browser (event consumer)"
  outcome: "All connected clients receive real-time updates"

critical_constraint:
  description: |
    CRITICAL: Application MUST run with WORKERS=1 (single uvicorn worker).

    BudgetConnectionManager stores connections in-memory (Python dict).
    Multiple workers would have SEPARATE connection pools.
    Events broadcast by worker A would NOT reach clients on worker B.

  configuration:
    docker_compose: "--workers 1"
    env_var: "WORKERS=1"

  scaling_solution: |
    For multiple workers, implement Redis Pub/Sub:
    - Publish events to Redis channel
    - Each worker subscribes to channel
    - Each worker broadcasts to its local connections

# ===========================================================================
# FLOW DIAGRAM
# ===========================================================================
diagram: |
  ┌─────────────────────────────────────────────────────────────────────────┐
  │                       SSE BROADCAST FLOW                                │
  └─────────────────────────────────────────────────────────────────────────┘

  ●─────────────────────────────────────────────────────────────────────────●
  │                                                                         │
  │  CLIENT CONNECTION SETUP                                                │
  │  ═══════════════════════                                                │
  │                                                                         │
  │  ┌────────────┐     ┌──────────────────┐     ┌────────────────────┐    │
  │  │ Browser    │────►│ GET /budget/     │────►│ JWT Auth           │    │
  │  │ EventSource│     │ events/connect   │     │ Middleware         │    │
  │  └────────────┘     └──────────────────┘     └─────────┬──────────┘    │
  │                                                        │               │
  │                                               ◆ Valid token?           │
  │                                              / \                       │
  │                                             /   \                      │
  │                                           Yes    No───► 401            │
  │                                            │                           │
  │                                            ▼                           │
  │                     ┌──────────────────────────────────────────┐       │
  │                     │ BudgetConnectionManager.connect()        │       │
  │                     │                                          │       │
  │                     │  connections: Dict[user_id, Set[Queue]]  │       │
  │                     │  ┌─────────────────────────────────────┐ │       │
  │                     │  │ user_1: {queue_a, queue_b}          │ │       │
  │                     │  │ user_2: {queue_c}                   │ │       │
  │                     │  │ user_3: {queue_d, queue_e, queue_f} │ │       │
  │                     │  └─────────────────────────────────────┘ │       │
  │                     └──────────────────────────────────────────┘       │
  │                                            │                           │
  │                                            ▼                           │
  │                     ┌──────────────────────────────────────────┐       │
  │                     │ Response: text/event-stream              │       │
  │                     │ Cache-Control: no-cache                  │       │
  │                     │ Connection: keep-alive                   │       │
  │                     └──────────────────────────────────────────┘       │
  │                                            │                           │
  │                                            ▼                           │
  │                     ┌──────────────────────────────────────────┐       │
  │                     │ Send "connected" event                   │       │
  │                     │ data: {"message": "Connected to SSE",    │       │
  │                     │        "connection_id": "uuid"}          │       │
  │                     └──────────────────────────────────────────┘       │
  │                                                                         │
  │                                                                         │
  │  EVENT BROADCAST                                                        │
  │  ═══════════════                                                        │
  │                                                                         │
  │  ┌────────────┐                                                         │
  │  │ API        │                                                         │
  │  │ Endpoint   │  POST /facts, PUT /facts/{id}, DELETE /facts/{id}      │
  │  └─────┬──────┘                                                         │
  │        │                                                                │
  │        ▼                                                                │
  │  ┌────────────────┐                                                     │
  │  │ Service Layer  │                                                     │
  │  │ (business      │                                                     │
  │  │  logic)        │                                                     │
  │  └─────┬──────────┘                                                     │
  │        │                                                                │
  │        ▼                                                                │
  │  ┌────────────────┐                                                     │
  │  │ Database       │                                                     │
  │  │ Commit         │                                                     │
  │  └─────┬──────────┘                                                     │
  │        │                                                                │
  │        │ After successful commit                                        │
  │        ▼                                                                │
  │  ┌─────────────────────────────────────────────────────────────┐       │
  │  │ await connection_manager.broadcast(event_type, data)        │       │
  │  └──────────────────────────┬──────────────────────────────────┘       │
  │                             │                                          │
  │                             ▼                                          │
  │  ┌─────────────────────────────────────────────────────────────┐       │
  │  │ For each user in connections:                               │       │
  │  │   For each queue in user's queues:                          │       │
  │  │     queue.put_nowait(event)                                 │       │
  │  └─────────────────────────────────────────────────────────────┘       │
  │                             │                                          │
  │                             ▼                                          │
  │  ┌───────────────────────────────────────────────────────────────────┐ │
  │  │                                                                   │ │
  │  │  Client A          Client B          Client C                     │ │
  │  │  (user_1)          (user_1)          (user_2)                     │ │
  │  │     │                  │                  │                        │ │
  │  │     ▼                  ▼                  ▼                        │ │
  │  │  ┌──────┐          ┌──────┐          ┌──────┐                     │ │
  │  │  │event │          │event │          │event │                     │ │
  │  │  │data  │          │data  │          │data  │                     │ │
  │  │  └──────┘          └──────┘          └──────┘                     │ │
  │  │                                                                   │ │
  │  └───────────────────────────────────────────────────────────────────┘ │
  │                                                                         │
  ○─────────────────────────────────────────────────────────────────────────○

# ===========================================================================
# EVENT TYPES
# ===========================================================================
events:
  connected:
    trigger: "Client establishes SSE connection"
    data:
      message: "Connected to SSE"
      connection_id: "UUID"

  fact_created:
    trigger: "POST /api/v1/facts"
    data:
      id: "integer"
      amount: "decimal"
      article_id: "integer"
      fact_date: "YYYY-MM-DD"

  fact_updated:
    trigger: "PUT /api/v1/facts/{id}"
    data:
      id: "integer"
      changed_fields: "array of field names"

  fact_deleted:
    trigger: "DELETE /api/v1/facts/{id}"
    data:
      id: "integer"

  transfer_created:
    trigger: "POST /api/v1/transfers"
    data:
      transfer_id: "UUID"
      from_financial_center_id: "integer"
      to_financial_center_id: "integer"
      amount: "decimal"

  shopping_list_item_created:
    trigger: "POST /api/v1/shopping-list-items"
    data:
      id: "integer"
      shopping_list_id: "integer"
      name: "string"

  shopping_list_item_updated:
    trigger: "PUT /api/v1/shopping-list-items/{id}"
    data:
      id: "integer"
      changed_fields: "array"

  shopping_list_item_deleted:
    trigger: "DELETE /api/v1/shopping-list-items/{id}"
    data:
      id: "integer"

  article_created:
    trigger: "POST /api/v1/articles"
    data:
      id: "integer"
      name: "string"
      type: "string"

  article_updated:
    trigger: "PUT /api/v1/articles/{id}"
    data:
      id: "integer"
      changed_fields: "array"

  ping:
    trigger: "Keep-alive timer (30 seconds)"
    data:
      timestamp: "ISO 8601"

# ===========================================================================
# CONNECTION MANAGER
# ===========================================================================
connection_manager:
  class: "BudgetConnectionManager"
  file: "backend/app/api/v1/endpoints/budget_sse.py"

  data_structures:
    connections:
      type: "Dict[int, Set[asyncio.Queue]]"
      description: "user_id → set of queues (one per browser tab)"

  methods:
    connect:
      signature: "async def connect(user_id: int) -> asyncio.Queue"
      description: "Add client to connection pool"
      returns: "Queue for receiving events"

    disconnect:
      signature: "async def disconnect(user_id: int, queue: asyncio.Queue)"
      description: "Remove client from connection pool"

    broadcast:
      signature: "async def broadcast(event_type: str, data: dict)"
      description: "Send event to ALL connected clients"
      implementation: |
        for user_id, queues in self.connections.items():
            for queue in queues:
                await queue.put({"event": event_type, "data": data})

    get_connection_count:
      signature: "def get_connection_count() -> int"
      description: "Total number of active connections"

# ===========================================================================
# FRONTEND INTEGRATION
# ===========================================================================
frontend:
  js_module:
    $ref: "../web/js-modules.yaml#/modules/budgetSSEClient"

  incremental_updates_module:
    $ref: "../web/js-modules.yaml#/modules/incrementalUpdates"

  connection_code: |
    const eventSource = new EventSource('/api/v1/budget/events/connect');

    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleEvent(data);
    };

    eventSource.onerror = (error) => {
      // Reconnect logic
      setTimeout(reconnect, 5000);
    };

  event_handlers:
    fact_created:
      action: "IncrementalUpdates.onFactCreated(data) - direct DOM update"
      fallback: "HTMXWidgets.refreshWidgetDebounced() if cache miss"

    fact_updated:
      action: "IncrementalUpdates.onFactUpdated(data) - debounced refresh"
      note: "Complex delta calculation, uses fallback"

    fact_deleted:
      action: "IncrementalUpdates.onFactDeleted(data) - remove + refresh stats"

    shopping_list_item_created:
      action: "listsManager.addItemToUI(data) - direct DOM insert"

    shopping_list_item_updated:
      action: "listsManager.updateItemInUI(data) - direct DOM update"

    shopping_list_item_deleted:
      action: "listsManager.removeItemFromUI(id) - direct DOM removal"

  ui_indicator:
    location: "Navbar"
    states:
      connected: "Green badge"
      disconnected: "Red badge"
      reconnecting: "Yellow badge (pulsing)"

# ===========================================================================
# INCREMENTAL UPDATES OPTIMIZATION
# ===========================================================================
incremental_updates:
  description: |
    Optimization layer between SSE events and UI updates.
    Uses SSE payload data directly instead of making HTTP requests.

  flow_diagram: |
    BEFORE (v1):
    ┌──────────────┐    ┌───────────────┐    ┌────────────────┐
    │ SSE Event    │───►│ refreshAll()  │───►│ 3 HTTP GET     │
    │ fact_created │    │               │    │ requests       │
    └──────────────┘    └───────────────┘    └────────────────┘

    AFTER (v2 - optimized):
    ┌──────────────┐    ┌────────────────────┐    ┌──────────────┐
    │ SSE Event    │───►│ IncrementalUpdates │───►│ Direct DOM   │
    │ fact_created │    │ .onFactCreated()   │    │ manipulation │
    └──────────────┘    └────────────────────┘    └──────────────┘
                                │
                                │ (cache miss)
                                ▼
                        ┌────────────────────┐    ┌──────────────┐
                        │ HTMXWidgets        │───►│ HTTP GET     │
                        │ .refreshDebounced()│    │ (fallback)   │
                        └────────────────────┘    └──────────────┘

  performance_impact:
    http_requests_per_transaction:
      before: "1 POST + 3 GET = 4 requests"
      after: "1 POST = 1 request (75% reduction)"

    ui_latency:
      before: "200-500ms (wait for 3 HTTP round-trips)"
      after: "<100ms (instant DOM update)"

    backend_load:
      reduction: "3-4x fewer requests during active usage"

  implementation_files:
    - "frontend/web/static/js/budget/incrementalUpdates.js"
    - "frontend/web/static/js/htmxWidgets.js (debouncing)"
    - "frontend/web/templates/index.html (SSE handlers)"
    - "frontend/web/templates/facts.html (debounced loading)"

# ===========================================================================
# KEEP-ALIVE
# ===========================================================================
keepalive:
  interval: "30 seconds"
  event: "ping"
  purpose:
    - "Prevent connection timeout"
    - "Detect dead connections"
    - "Browser/proxy compatibility"

  implementation: |
    async def send_keepalive(queue: asyncio.Queue):
        while True:
            await asyncio.sleep(30)
            await queue.put({
                "event": "ping",
                "data": {"timestamp": datetime.utcnow().isoformat()}
            })

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
error_handling:
  client_disconnect:
    detection: "BrokenPipeError, ConnectionResetError"
    action: "Remove from connection pool, cleanup queue"

  queue_full:
    detection: "queue.put_nowait raises QueueFull"
    action: "Drop event (client too slow)"
    logging: "Warning with user_id"

  broadcast_failure:
    detection: "Exception during broadcast"
    action: "Log error, continue with other clients"
    note: "One failing client should not affect others"

# ===========================================================================
# SCALING CONSIDERATIONS
# ===========================================================================
scaling:
  current_limitation:
    description: "In-memory connection manager, single worker only"
    max_connections: "~1000 per worker (memory dependent)"

  redis_pubsub_solution:
    description: "For multi-worker deployment"
    implementation: |
      # Each worker subscribes to Redis channel
      redis = aioredis.from_url("redis://localhost")
      pubsub = redis.pubsub()
      await pubsub.subscribe("sse_events")

      # On event, publish to Redis instead of direct broadcast
      await redis.publish("sse_events", json.dumps({
          "event": event_type,
          "data": data
      }))

      # Each worker receives from Redis and broadcasts locally
      async for message in pubsub.listen():
          await local_connection_manager.broadcast(
              message["event"],
              message["data"]
          )

    benefits:
      - "Multiple workers can run"
      - "Events reach all clients regardless of worker"
      - "Horizontal scaling possible"

    requirements:
      - "Redis server"
      - "aioredis library"
      - "Refactored connection manager"

# ===========================================================================
# MULTI-TAB FLOW
# ===========================================================================
multi_tab_flow:
  description: "Single SSE connection shared between browser tabs"

  diagram: |
    Tab 1 (Leader)              Tab 2-N (Followers)
    ├─ EventSource SSE conn     ├─ No SSE connection
    ├─ Web Locks (acquired)     ├─ Web Locks (waiting)
    ├─ BroadcastChannel         ├─ BroadcastChannel
    └─ Heartbeat every 3s       └─ Listens for events
         ↓                            ↑
         └────── BroadcastChannel ────┘
                (sse_event, heartbeat)

  leader_election:
    desktop_flow: |
      1. Tab calls connect()
      2. await _initMultiTab() - CRITICAL: must await!
      3. navigator.locks.request('budget-sse-leader', ...)
      4. Timeout 100ms - if lock not acquired, start as follower
      5. If lock acquired before timeout - become leader
      6. If lock acquired AFTER timeout - promote to leader

    safari_ios_flow: |
      Safari iOS использует УПРОЩЁННУЮ стратегию из-за проблем с EventSource и Web Locks:

      1. Tab calls connect() (на DOMContentLoaded)
      2. _detectSafariIOS() возвращает true
      3. Проверяет document.readyState:
         - Если 'complete': сразу _safariIOSDelayedConnect()
         - Если НЕ 'complete': dual approach (event + polling)
      4. Dual approach для page load:
         a) Primary: window.load event listener
         b) Fallback: polling после 500ms delay
         c) Flag `connected` предотвращает двойное подключение
         d) Один из путей вызывает _safariIOSDelayedConnect()
      5. _safariIOSDelayedConnect():
         - 300ms задержка для "прогрева" сетевого стека
         - Warm-up fetch к /events/status
         - _createConnection() → _useFetchEventSource()
      6. await _initMultiTab()
      7. isLeader = true (сразу, без Web Locks!)
      8. _multiTabSupported = false (отключаем multi-tab)
      9. fetch() с ReadableStream устанавливает SSE соединение

      FIX 2025-12-19: Dual approach (Solution 2) применён после того как
      polling-only (Solution 1) не решил проблему. Dual approach обеспечивает
      redundancy - хотя бы один из путей (event или polling) должен сработать.

      ВАЖНО: На Safari iOS каждая вкладка создаёт своё SSE соединение.
      Это может привести к большему количеству соединений на сервере,
      но гарантирует работоспособность на проблемной платформе.

    safari_macos_flow: |
      Safari macOS использует Web Locks с увеличенными таймаутами:

      1. Tab calls connect()
      2. await _initMultiTab()
      3. Check connection pressure via /status endpoint
      4. If pressure >= 50%: use 2000ms timeout
      5. If pressure < 50%: use 500ms timeout
      6. If timeout + no heartbeat: become leader
      7. If timeout + heartbeat detected: stay follower
      8. CRITICAL: If lock acquired after timeout + was follower → promote to leader

  visibility_handling:
    tab_hidden: "Leader keeps connection, continues heartbeat"
    tab_visible:
      leader: |
        1. Check _isConnectionStale() (45s without ping)
        2. If stale: force reconnect
        3. Check EventSource.readyState === OPEN
        4. If OPEN: reuse connection, update status
        5. If CLOSED/CONNECTING: close and reconnect
      follower: "Request status from leader via BroadcastChannel"

  connection_reuse:
    description: "Prevent duplicate connections on tab switch"
    implementation: |
      // In _createConnection():
      if (this.eventSource) {
          if (this.eventSource.readyState === EventSource.OPEN) {
              // Reuse existing connection
              this.isConnected = true;
              this._updateStatusIndicator();
              return;
          }
          // Close stale connection before creating new
          this.eventSource.close();
          this.eventSource = null;
      }

  broadcast_channel_messages:
    sse_event:
      description: "SSE событие для рассылки follower'ам"
      payload: "{ type: 'sse_event', event_type: string, data: object }"

    heartbeat:
      description: "Leader alive signal"
      interval: "3 seconds"
      payload: "{ type: 'heartbeat', timestamp: number }"

    leader_changed:
      description: "Уведомление о смене лидера"
      payload: "{ type: 'leader_changed', timestamp: number }"

    status_request:
      description: "Запрос статуса от follower"
      payload: "{ type: 'status_request' }"

  safari_ios_comprehensive_fix:
    original_problem: |
      connect() вызывал _initMultiTab() без await.
      К моменту проверки isLeader, Web Locks callback ещё не отработал.
      Результат: tab становился follower'ом без создания соединения.

    additional_problems:
      - problem: "EventSource буферизация"
        description: |
          Safari iOS буферизирует SSE ответы до ~2KB.
          Событие onopen НИКОГДА не срабатывает для маленьких ответов.
          Даже после 5 секунд timeout соединение казалось мёртвым.

      - problem: "Web Locks ненадёжность"
        description: |
          Web Locks API на Safari iOS работает непредсказуемо.
          Даже с timeout 2000ms lock мог не сработать вообще.

      - problem: "Cookies и credentials"
        description: |
          EventSource с withCredentials: true не всегда корректно
          отправляет cookies на Safari iOS (особенно iOS 17+).

    comprehensive_solution:
      summary: "Для Safari iOS пропускаем EventSource и Web Locks полностью"
      steps:
        - "_detectSafariIOS() определяет Safari iOS при инициализации"
        - "_safariIOSMode флаг устанавливается в true"
        - "_initMultiTab() сразу выходит с isLeader=true (пропуск Web Locks)"
        - "_createConnection() вызывает _useFetchEventSource() напрямую"
        - "fetch() + ReadableStream обрабатывает SSE события"

      tradeoff: |
        На Safari iOS каждая вкладка создаёт своё SSE соединение.
        Это увеличивает количество соединений на сервере,
        но гарантирует работоспособность на проблемной платформе.

    detection_code: |
      _detectSafariIOS() {
          const ua = navigator.userAgent;
          const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
          const isSafariLike = /Safari/.test(ua) && !/Chrome/.test(ua) &&
                               !/CriOS/.test(ua) && !/FxiOS/.test(ua);
          return isIOS && isSafariLike;
      }
