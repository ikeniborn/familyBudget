# Telegram OAuth Flow
# Authentication via Telegram Login Widget

meta:
  name: "Telegram OAuth"
  trigger: "User clicks 'Login with Telegram'"
  actors:
    - "Web browser"
    - "Telegram servers"
    - "Backend API"
  outcome: "User authenticated, JWT issued"

# ===========================================================================
# FLOW DIAGRAM
# ===========================================================================
diagram: |
  ┌─────────────────────────────────────────────────────────────────────────┐
  │                     TELEGRAM OAUTH FLOW                                 │
  └─────────────────────────────────────────────────────────────────────────┘

  ●─────────────────────────────────────────────────────────────────────────●
  │                                                                         │
  │  ┌──────────────┐                                                       │
  │  │ User clicks  │                                                       │
  │  │ "Login with  │                                                       │
  │  │  Telegram"   │                                                       │
  │  └──────┬───────┘                                                       │
  │         │                                                               │
  │         ▼                                                               │
  │  ┌──────────────┐     ┌───────────────────────┐                        │
  │  │ Telegram     │────►│ Telegram Auth         │                        │
  │  │ Widget       │     │ Servers               │                        │
  │  │ (iframe)     │◄────│ (oauth.telegram.org)  │                        │
  │  └──────┬───────┘     └───────────────────────┘                        │
  │         │                                                               │
  │         │ User authenticates in Telegram                               │
  │         │                                                               │
  │         ▼                                                               │
  │  ┌──────────────┐                                                       │
  │  │ Callback     │                                                       │
  │  │ with hash    │                                                       │
  │  └──────┬───────┘                                                       │
  │         │                                                               │
  │         │ Data: id, first_name, last_name, username, photo_url, hash   │
  │         │                                                               │
  │         ▼                                                               │
  │  ┌────────────────────┐                                                 │
  │  │ POST               │                                                 │
  │  │ /auth/telegram     │                                                 │
  │  └─────────┬──────────┘                                                 │
  │            │                                                            │
  │            ▼                                                            │
  │  ┌────────────────────┐                                                 │
  │  │ Verify hash        │                                                 │
  │  │ (HMAC-SHA256)      │                                                 │
  │  └─────────┬──────────┘                                                 │
  │            │                                                            │
  │     ◆ Hash valid?                                                       │
  │    / \                                                                  │
  │   /   \                                                                 │
  │ Yes    No───► 401 Invalid hash                                         │
  │  │                                                                      │
  │  ▼                                                                      │
  │  ◆ Data fresh? (< 24h)                                                  │
  │ / \                                                                     │
  │/   \                                                                    │
  │Yes  No───► 401 Auth data expired                                       │
  │ │                                                                       │
  │ ▼                                                                       │
  │ ◆ User exists?                                                          │
  │/ \                                                                      │
  │   \                                                                     │
  │    ├──No──► 403 User not registered                                    │
  │    │        (closed registration)                                       │
  │   Yes                                                                   │
  │    │                                                                    │
  │    ▼                                                                    │
  │ ◆ User active?                                                          │
  │/ \                                                                      │
  │   \                                                                     │
  │    ├──No──► 403 Account deactivated                                    │
  │   Yes                                                                   │
  │    │                                                                    │
  │    ▼                                                                    │
  │ ┌────────────────────┐                                                  │
  │ │ Update user        │                                                  │
  │ │ profile if changed │                                                  │
  │ │ (SCD Type 1)       │                                                  │
  │ └─────────┬──────────┘                                                  │
  │           │                                                             │
  │           ▼                                                             │
  │ ◇─────────────────────────────────────────────────────◇                │
  │ │ BEGIN TRANSACTION                                   │                │
  │ │                                                     │                │
  │ │  ┌─────────────────────┐                            │                │
  │ │  │ UPDATE t_d_user     │                            │                │
  │ │  │ SET last_login_at   │                            │                │
  │ │  └──────────┬──────────┘                            │                │
  │ │             │                                       │                │
  │ │             ▼                                       │                │
  │ │  ┌─────────────────────┐                            │                │
  │ │  │ INSERT t_refresh_   │                            │                │
  │ │  │        token        │                            │                │
  │ │  └─────────────────────┘                            │                │
  │ │                                                     │                │
  │ │ COMMIT                                              │                │
  │ ◇─────────────────────────────────────────────────────◇                │
  │           │                                                             │
  │           ▼                                                             │
  │ ┌────────────────────┐                                                  │
  │ │ Generate JWT       │                                                  │
  │ │ access_token       │                                                  │
  │ │ (15 min TTL)       │                                                  │
  │ └─────────┬──────────┘                                                  │
  │           │                                                             │
  │           ▼                                                             │
  │ ┌────────────────────┐                                                  │
  │ │ Set httpOnly       │                                                  │
  │ │ cookies:           │                                                  │
  │ │ - access_token     │                                                  │
  │ │ - refresh_token    │                                                  │
  │ └─────────┬──────────┘                                                  │
  │           │                                                             │
  │           ▼                                                             │
  │ ┌────────────────────┐                                                  │
  │ │ Redirect to /      │                                                  │
  │ │ (dashboard)        │                                                  │
  │ └────────────────────┘                                                  │
  │                                                                         │
  ○─────────────────────────────────────────────────────────────────────────○

# ===========================================================================
# HASH VERIFICATION
# ===========================================================================
hash_verification:
  algorithm: "HMAC-SHA256"
  description: |
    Telegram signs auth data using bot token as secret.
    Backend MUST verify hash to prevent forgery.

  steps:
    - name: "Prepare data string"
      code: |
        # Sort fields alphabetically (excluding 'hash')
        data_check_string = '\n'.join(
            f'{k}={v}' for k, v in sorted(data.items())
            if k != 'hash'
        )

    - name: "Compute secret"
      code: |
        secret_key = hashlib.sha256(bot_token.encode()).digest()

    - name: "Compute hash"
      code: |
        computed_hash = hmac.new(
            secret_key,
            data_check_string.encode(),
            hashlib.sha256
        ).hexdigest()

    - name: "Compare hashes"
      code: |
        if computed_hash != received_hash:
            raise InvalidHashError()

  implementation:
    file: "backend/app/utils/telegram_auth.py"
    function: "verify_telegram_auth"

# ===========================================================================
# STEPS DETAIL
# ===========================================================================
steps:
  1_widget_init:
    name: "Telegram Widget Initialization"
    frontend:
      file: "frontend/web/templates/login.html"
    widget_config:
      bot_id: "from TELEGRAM_BOT_ID env"
      callback_url: "/auth/telegram"
      request_access: "write"

  2_telegram_auth:
    name: "User Authenticates with Telegram"
    external: true
    provider: "oauth.telegram.org"
    returns:
      - id: "Telegram user ID (bigint)"
      - first_name: "required"
      - last_name: "optional"
      - username: "optional (@username)"
      - photo_url: "optional"
      - auth_date: "Unix timestamp"
      - hash: "HMAC-SHA256 signature"

  3_hash_verification:
    name: "Verify Telegram Hash"
    component:
      $ref: "../functionality/authentication.yaml#/module/services/1"
    validates:
      - "Hash matches computed HMAC"
      - "auth_date not older than 24 hours"
    errors:
      - code: 401
        message: "Invalid Telegram auth hash"
      - code: 401
        message: "Auth data expired"

  4_user_lookup:
    name: "Find or Reject User"
    component:
      $ref: "../functionality/authentication.yaml#/module/services/2"
    behavior:
      user_exists: "Continue to login"
      user_not_exists: "403 (closed registration)"
      user_inactive: "403 (account deactivated)"
    note: |
      Registration is closed. Users must be pre-created by admin.
      This prevents unauthorized access to family budget.

  5_profile_update:
    name: "Update User Profile"
    description: "Sync Telegram profile changes (SCD Type 1)"
    updates:
      - first_name: "if changed"
      - last_name: "if changed"
      - username: "if changed"
      - last_login_at: "always"
    creates_history: true

  6_token_generation:
    name: "Generate Tokens"
    component:
      $ref: "../functionality/authentication.yaml#/module/services/0"
    tokens:
      access_token:
        type: "JWT"
        ttl: "15 minutes"
        claims:
          - sub: "user_id"
          - telegram_id: "telegram user ID"
          - is_admin: "boolean"
          - exp: "expiration"

      refresh_token:
        type: "Opaque (UUID)"
        ttl: "30 days"
        storage: "t_refresh_token table"

  7_cookie_setup:
    name: "Set Cookies"
    cookies:
      access_token:
        httpOnly: true
        secure: true
        sameSite: "Lax"
        path: "/"
        maxAge: "15 minutes"

      refresh_token:
        httpOnly: true
        secure: true
        sameSite: "Lax"
        path: "/auth"
        maxAge: "30 days"

# ===========================================================================
# TOKEN REFRESH FLOW
# ===========================================================================
refresh_flow:
  trigger: "Access token expired, refresh token valid"
  endpoint: "POST /auth/refresh"

  diagram: |
    access_token expired
           │
           ▼
    ┌──────────────────┐
    │ POST /auth/      │
    │      refresh     │
    │ (cookie: refresh │
    │        _token)   │
    └────────┬─────────┘
             │
             ▼
      ◆ Refresh token valid?
     / \
    /   \
    Yes   No───► 401 Session expired
    │           (redirect to login)
    │
    ▼
    ┌──────────────────┐
    │ Rotate tokens:   │
    │ - New access     │
    │ - New refresh    │
    │ - Revoke old     │
    └────────┬─────────┘
             │
             ▼
    ┌──────────────────┐
    │ Set new cookies  │
    └──────────────────┘

  security:
    - "Refresh tokens are one-time use"
    - "Old refresh token revoked on rotation"
    - "Device tracking for suspicious activity"

# ===========================================================================
# SECURITY CONSIDERATIONS
# ===========================================================================
security:
  hash_verification:
    description: "MUST verify Telegram hash to prevent auth bypass"
    vulnerability: "Without verification, attacker can forge auth data"

  closed_registration:
    description: "Only pre-created users can login"
    reason: "Family budget is private, not public service"

  token_security:
    access_token:
      - "Short TTL (15 min)"
      - "Stored in httpOnly cookie"
      - "No localStorage exposure"

    refresh_token:
      - "Longer TTL (30 days)"
      - "Stored in database (can be revoked)"
      - "One-time use (rotation)"

  session_revocation:
    methods:
      - "User logout (revoke current)"
      - "Admin deactivate (revoke all)"
      - "Password change (revoke all)"
      - "Security concern (revoke all)"

# ===========================================================================
# FRONTEND INTEGRATION
# ===========================================================================
frontend:
  login_page:
    template: "frontend/web/templates/login.html"
    widget: "Telegram Login Widget (iframe)"

  webapp_auth:
    file: "frontend/webapp/static/index.html"
    method: "window.Telegram.WebApp.initData"
    note: "Different auth flow for Telegram Web Apps"

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
errors:
  invalid_hash:
    code: 401
    message: "Invalid authentication data"
    cause: "Hash mismatch or tampered data"

  expired_data:
    code: 401
    message: "Authentication data expired"
    cause: "auth_date older than 24 hours"

  user_not_found:
    code: 403
    message: "User not registered"
    cause: "telegram_id not in t_d_user"

  user_inactive:
    code: 403
    message: "Account deactivated"
    cause: "user.is_active = FALSE"
