# JavaScript Patterns and Best Practices
# Frontend JavaScript coding patterns для Family Budget

patterns:
  # ---------------------------------------------------------------------------
  # EVENT HANDLING
  # ---------------------------------------------------------------------------
  event_handling:
    dynamic_content:
      name: "Event Delegation для динамического контента"
      pattern: event_delegation
      avoid: inline_onclick_handlers
      reason: "iOS Safari compatibility - inline onclick не работает надежно для динамически созданных элементов"
      when_to_use:
        - "HTML создается динамически через innerHTML или string templates"
        - "Элементы добавляются/удаляются в runtime"
        - "Требуется мобильная совместимость (iOS Safari, Android)"
      implementation:
        good_example: |
          // ✅ ПРАВИЛЬНО: Event delegation
          const parentContainer = document.getElementById('dropdown');
          parentContainer.addEventListener('click', (event) => {
              const item = event.target.closest('.item');
              if (!item) return;

              const index = parseInt(item.dataset.index, 10);
              handleItemClick(index);
          });
        bad_example: |
          // ❌ НЕПРАВИЛЬНО: Inline onclick
          const html = items.map((item, index) => `
              <div class="item" onclick="handleItemClick(${index})">
          `);
      files:
        - "frontend/web/static/js/lists/listsManager.js:_setupSuggestionsClickHandler()"
      related_commits:
        - commit: "0eedb351"
          description: "iOS Safari autocomplete tap fix"
        - commit: "6c558b76"
          description: "Input events для autocomplete на мобильных"

    mobile_compatibility:
      name: "Кроссбраузерные event listeners для мобильных"
      pattern: multiple_event_listeners
      when_to_use:
        - "Input fields на мобильных устройствах"
        - "IME input (iOS, Android китайская/японская клавиатура)"
      implementation:
        example: |
          // Multiple events для кроссбраузерной совместимости
          input.addEventListener('input', handler);           // Desktop & некоторые мобильные
          input.addEventListener('keyup', handler);           // Fallback для мобильных клавиатур
          input.addEventListener('compositionend', handler);  // IME input (iOS, Android)
      files:
        - "frontend/web/static/js/lists/listsManager.js:_setupProductAutocomplete()"

  # ---------------------------------------------------------------------------
  # INITIALIZATION PATTERNS
  # ---------------------------------------------------------------------------
  initialization:
    idempotent_setup:
      name: "Идемпотентная инициализация"
      pattern: initialization_flags
      when_to_use:
        - "Функция может быть вызвана несколько раз"
        - "Нужно избежать повторной инициализации"
      implementation:
        example: |
          _setupSomething() {
              const element = document.getElementById('target');
              if (!element || element._initialized) {
                  return; // Уже инициализировано или элемент не существует
              }

              // Setup code here
              element.addEventListener('click', handler);

              element._initialized = true;
          }
      files:
        - "frontend/web/static/js/lists/listsManager.js:_setupProductAutocomplete()"
        - "frontend/web/static/js/lists/listsManager.js:_setupSuggestionsClickHandler()"

    category_filtering_on_modal_open:
      name: "Фильтрация категорий и мест затрат при открытии edit модала"
      pattern: initialize_with_context
      when_to_use:
        - "Edit модалы где уже известен financial center"
        - "Нужно показать только доступные категории для выбранного счета"
        - "Требуется сохранить выбор категории при смене счета (если доступна)"
      avoid_when:
        - "Create модалы (пользователь сам выбирает счет с нуля)"
        - "Transfer модалы (создание новых переводов)"
      implementation:
        example: |
          // ✅ ПРАВИЛЬНО: Инициализация с financialCenterId фильтром
          editCategoryTreeSelect = new BudgetShared.ChoicesCategoryTree('#edit-article', {
              type: categoryType,
              showLeafOnly: true,
              financialCenterId: fact.financial_center_id,  // Фильтр по счету
              onCategoryChange: (category) => {
                  // ...
              }
          });

          // После установки категории - фильтровать места затрат
          await editCategoryTreeSelect.setSelectedCategory(fact.article_id);
          await filterEditCostCenters(fact.financial_center_id);
        bad_example: |
          // ❌ НЕПРАВИЛЬНО: Без фильтра при инициализации
          editCategoryTreeSelect = new BudgetShared.ChoicesCategoryTree('#edit-article', {
              type: categoryType,
              showLeafOnly: true,
              // financialCenterId отсутствует! Загружаются ВСЕ категории
          });
          // При смене счета категория может сброситься
      why_important:
        - "Без фильтра загружаются ВСЕ категории (даже недоступные для счета)"
        - "При смене счета категория сбрасывается даже если доступна для нового счета"
        - "updateFinancialCenter() уже содержит логику сохранения выбора, но только если изначально был фильтр"
      files:
        - "frontend/web/templates/index.html:openEditFromDashboard():1179-1196"
        - "frontend/web/templates/facts.html:showEditModal():1579-1619"
        - "frontend/web/templates/plan.html:showEditModal():2439-2479"
      related:
        - "frontend/shared/static/js/choicesCategoryTree.js:updateFinancialCenter():844-912"
      related_commits:
        - commit: "fix(frontend): filter categories & cost centers by financial center on edit modal open"
          description: "Added financialCenterId to ChoicesCategoryTree init, filterEditCostCenters call"

    reset_state_on_create_modal_open:
      name: "Сброс состояния фильтра при открытии create модала"
      pattern: reset_global_state
      when_to_use:
        - "Create модалы (Add Transaction, Add Plan, Transfer)"
        - "Модалы где пользователь выбирает financial center с нуля"
        - "Нужно предотвратить автозаполнение категорий при повторном открытии модала"
      avoid_when:
        - "Edit модалы (там financialCenterId должен сохраняться)"
      problem_solved:
        description: |
          При повторном открытии create модала (после создания первой записи) категории
          автоматически заполнялись значениями с предыдущего открытия. Происходило из-за
          того, что ChoicesCategoryTree инстансы - глобальные переменные, и их state
          (options.financialCenterId) сохранялся между открытиями модала.

          При втором открытии: previousFcId !== null → isInitialFiltering = false →
          категория сохранялась (phantom auto-selection).
      solution:
        description: |
          Явный сброс financialCenterId перед открытием create модалов.
          Теперь при каждом открытии modal state сбрасывается → isInitialFiltering = true
          → phantom selection НЕ сохраняется.
      implementation:
        example: |
          // ✅ ПРАВИЛЬНО: Reset state перед открытием create модала
          async function openAddPlanModal(modalId = 'modal_add_plan') {
              // ... setup code ...

              // CRITICAL: Reset FC filter state for create modals (not edit modals)
              // This ensures isInitialFiltering works correctly on modal reopening
              // Without this, previousFcId persists between modal openings, causing phantom auto-selection
              if (typeof planCategoryTreeSelect !== 'undefined' && planCategoryTreeSelect) {
                  planCategoryTreeSelect.options.financialCenterId = null;
              }

              modal.showModal();
          }
        bad_example: |
          // ❌ НЕПРАВИЛЬНО: Без reset state
          async function openAddPlanModal(modalId = 'modal_add_plan') {
              modal.showModal();
              // previousFcId сохранился → isInitialFiltering = false → категория автозаполнится
          }
      behavior:
        first_open: "Категории пустые ✅"
        second_open: "Категории пустые ✅ (раньше автозаполнялись)"
        fc_change_inside_modal: "Категория сохраняется если доступна для нового FC ✅"
      files:
        - "frontend/web/static/js/transfer.js:openTransferModal():915-920"
        - "frontend/web/templates/index.html:openFactTransferModal():592-600"
        - "frontend/web/templates/index.html:openPlanTransferModal():653-661"
        - "frontend/web/templates/index.html:openAddTransactionModal():2314-2319"
        - "frontend/web/templates/index.html:openAddPlanModal():4607-4612"
      related:
        - "frontend/shared/static/js/choicesCategoryTree.js:updateFinancialCenter():948-958 (isInitialFiltering logic)"
      related_commits:
        - commit: "eb70521e"
          description: "Reset FC filter state on Transfer modal reopening"
        - commit: "c067bf4f"
          description: "Reset FC filter state on Add Plan/Transaction modal reopening"
        - commit: "c0465bdd (revert c7fde80b)"
          description: "Reverted incorrect clearing of category on FC change inside create modals"
      testing_scenarios:
        scenario_1:
          description: "Повторное открытие create модала не автозаполняет категорию"
          steps:
            - "Открыть Add Plan → выбрать FC #1 → категория 'Продукты' → сохранить"
            - "Открыть Add Plan снова → выбрать FC #1"
            - "Проверить: категория ПУСТАЯ (не 'Продукты') ✅"
        scenario_2:
          description: "Смена FC внутри create модала сохраняет категорию (если доступна)"
          steps:
            - "Открыть Add Plan → выбрать FC #1 → категория 'Продукты'"
            - "Сменить FC на #2"
            - "Проверить: категория 'Продукты' ОСТАЕТСЯ (если доступна для FC #2) ✅"

  # ---------------------------------------------------------------------------
  # MOBILE-SPECIFIC PATTERNS
  # ---------------------------------------------------------------------------
  mobile:
    viewport_configuration:
      name: "Viewport configuration для веб-приложений"
      pattern: user_scalable_no
      when_to_use:
        - "Веб-приложение (не контентный сайт)"
        - "Нужно предотвратить автоматический zoom на iOS"
      avoid_when:
        - "Контентный сайт (accessibility важнее)"
        - "Требуется WCAG 2.1 compliance"
      implementation:
        example: |
          <meta name="viewport" content="width=device-width, initial-scale=1.0,
                maximum-scale=1.0, user-scalable=no">
      trade_offs:
        pros:
          - "100% надежное предотвращение автоматического zoom"
          - "Улучшает UX для большинства пользователей"
        cons:
          - "Снижает accessibility (пользователи не могут зумить)"
          - "Нарушает WCAG 2.1 Success Criterion 1.4.4"
      files:
        - "frontend/web/templates/base.html"
      related_commits:
        - commit: "32d78fda"
          description: "Mobile zoom fix"

    input_font_size:
      name: "Font size минимум 16px для input на iOS"
      pattern: minimum_font_size
      reason: "iOS Safari автоматически зумит input fields < 16px"
      implementation:
        example: |
          .choices__input,
          .choices__input--cloned {
              font-size: 16px !important;
              touch-action: manipulation !important;
              -webkit-text-size-adjust: 100% !important;
          }
      files:
        - "frontend/web/static/css/choices-tailwind.css"

  # ---------------------------------------------------------------------------
  # DOUBLE-CLICK PREVENTION
  # ---------------------------------------------------------------------------
  double_click_prevention:
    submit_buttons:
      name: "Защита от двойного клика на submit кнопках"
      pattern: button_disable_on_click
      when_to_use:
        - "Все кнопки сохранения в модальных окнах"
        - "Любые кнопки отправляющие данные на сервер"
        - "Кнопки с type='button' использующие onclick"
      implementation:
        example: |
          // В wrapper функции (onclick handler)
          function saveHandler(button) {
              if (button.disabled) return; // Уже обрабатывается
              button.disabled = true;
              button.classList.add('loading');

              const form = document.getElementById(button.dataset.formId);
              if (form && form.checkValidity()) {
                  form.requestSubmit();
              } else {
                  // Разблокировать если валидация не прошла
                  button.disabled = false;
                  button.classList.remove('loading');
                  form?.reportValidity();
              }
          }

          // Разблокировка в submit handler (finally блок)
          // setSubmitLoading управляет: disabled, .loading class, innerHTML
          form.addEventListener('submit', async (e) => {
              e.preventDefault();
              setSubmitLoading(e.target, true);
              try {
                  // ... submit logic ...
              } finally {
                  setSubmitLoading(e.target, false);  // Убирает .loading class
              }
          });
      files:
        - "frontend/web/templates/base.html:setSubmitLoading()"
        - "frontend/web/templates/index.html:saveTransaction/savePlan/saveTransfer()"
        - "frontend/web/templates/facts.html:updateFact()"
        - "frontend/web/templates/facts.html:saveTransaction/saveTransfer()"
        - "frontend/web/templates/plan.html:updateFact()"
        - "frontend/web/templates/plan.html:savePlan/saveTransfer()"
      related_commits:
        - commit: "c667ff75"
          description: "Double-click prevention for modal save buttons"

  # ---------------------------------------------------------------------------
  # DEBOUNCING & THROTTLING
  # ---------------------------------------------------------------------------
  performance:
    debouncing:
      name: "Debouncing для API calls"
      pattern: setTimeout_clearTimeout
      when_to_use:
        - "Autocomplete search"
        - "Input validation"
        - "Frequent user input"
      implementation:
        example: |
          handleInput(value) {
              if (this._timer) {
                  clearTimeout(this._timer);
              }

              this._timer = setTimeout(() => {
                  this.performSearch(value);
              }, 300); // 300ms debounce
          }
      files:
        - "frontend/web/static/js/lists/listsManager.js:handleProductInput()"

  # ---------------------------------------------------------------------------
  # DOM MANIPULATION
  # ---------------------------------------------------------------------------
  dom:
    escape_html:
      name: "Экранирование HTML для предотвращения XSS"
      pattern: escape_function
      when_to_use:
        - "User-generated content в innerHTML"
        - "Динамическое создание HTML"
      implementation:
        example: |
          _escapeHtml(text) {
              const div = document.createElement('div');
              div.textContent = text;
              return div.innerHTML;
          }

          // Использование
          const html = `<div>${this._escapeHtml(userInput)}</div>`;
      files:
        - "frontend/web/static/js/lists/listsManager.js:_escapeHtml()"

  # ---------------------------------------------------------------------------
  # CLOSEST() для event delegation
  # ---------------------------------------------------------------------------
  dom_traversal:
    closest_for_delegation:
      name: "Element.closest() для event delegation"
      pattern: closest_method
      when_to_use:
        - "Event delegation на child элементах"
        - "Нужно найти ближайшего родителя с определенным селектором"
      implementation:
        example: |
          parentContainer.addEventListener('click', (event) => {
              // Найти ближайший .item (включая сам event.target)
              const item = event.target.closest('.item');
              if (!item) return; // Клик вне .item элементов

              // Обработать клик
              const id = item.dataset.id;
              handleClick(id);
          });
      browser_support:
        - "All modern browsers"
        - "IE9+ с polyfill"
      files:
        - "frontend/web/static/js/lists/listsManager.js:_setupSuggestionsClickHandler()"

# ---------------------------------------------------------------------------
# ANTI-PATTERNS (чего избегать)
# ---------------------------------------------------------------------------
anti_patterns:
  - name: "Inline event handlers в динамическом HTML"
    avoid: |
      const html = `<button onclick="handleClick(${id})">Click</button>`;
    reason: "Не работает на iOS Safari, проблемы с CSP"
    use_instead: "Event delegation pattern"

  - name: "Игнорирование mobile events"
    avoid: |
      input.addEventListener('input', handler); // ТОЛЬКО input event
    reason: "Не работает на некоторых мобильных клавиатурах"
    use_instead: "Multiple events (input + keyup + compositionend)"

  - name: "Font-size < 16px для input на мобильных"
    avoid: |
      input { font-size: 14px; }
    reason: "iOS Safari автоматически зумит"
    use_instead: "font-size: 16px минимум"

  - name: "Повторная инициализация без проверки"
    avoid: |
      function setup() {
          element.addEventListener('click', handler); // Добавится дважды!
      }
    reason: "Memory leaks, дублирование обработчиков"
    use_instead: "Initialization flags pattern"

  - name: "Submit кнопки без защиты от двойного клика"
    avoid: |
      function saveHandler(button) {
          form.requestSubmit(); // Кнопка остаётся активной!
      }
    reason: "Двойной клик создаёт дублирующиеся записи"
    use_instead: "Double-click prevention pattern (disable button before submit)"

  - name: "Choices.js reinitialize без очистки select"
    avoid: |
      if (this.choicesInstance) {
          this.choicesInstance.destroy();
      }
      this.choicesInstance = new Choices(select, { choices: [...] });
    reason: "destroy() восстанавливает оригинальный HTML <select> со статическими <option>, new Choices() читает и DOM и choices[] → дубликаты"
    use_instead: |
      if (this.choicesInstance) {
          this.choicesInstance.destroy();
      }
      select.innerHTML = ''; // Очистить после destroy!
      this.choicesInstance = new Choices(select, { choices: [...] });
    files:
      - "frontend/web/static/js/lists/listsManager.js:initStoreChoices()"
      - "frontend/web/static/js/lists/listsManager.js:initProductGroupChoices()"
    related_commits:
      - commit: "fix(lists): prevent store/product group duplication"
        description: "Added select.innerHTML = '' after destroy()"

  - name: "Дублирование иконок при использовании CalendarWidget"
    avoid: |
      <div class="relative">
          <input type="text" ... />
          <button onclick="openCalendar()">
              <svg>...</svg> <!-- Встроенная иконка -->
          </button>
      </div>
      // + CalendarWidget._createSingleButton() добавит ещё одну кнопку
    reason: "CalendarWidget автоматически создаёт кнопку с иконкой календаря при инициализации"
    use_instead: |
      <div class="relative">
          <input type="text" ... />
          <!-- CalendarWidget сам создаст кнопку с иконкой -->
      </div>
    files:
      - "frontend/shared/static/js/calendar-widget.js:_createSingleButton()"
      - "frontend/web/templates/components/modal_plan.html"
    related_commits:
      - commit: "fix(plan): remove duplicate calendar icon"
        description: "Removed hardcoded button, CalendarWidget creates its own"

# ---------------------------------------------------------------------------
# DROPDOWN AND MODAL MOBILE FIXES
# ---------------------------------------------------------------------------
dropdown_mobile_fixes:
  title: "Mobile Dropdown and Modal Interaction Fixes"
  date_added: "2025-12-27"

  issues_solved:
    - name: "Category Clearing in CREATE Modals"
      description: "Category now preserved when selecting FC for first time if category is available"
      fix: "Removed !isInitialFiltering condition from preservation logic"
      file: "frontend/shared/static/js/choicesCategoryTree.js:1093"

    - name: "Dropdown Closes Immediately on Mobile"
      description: "After selecting FC, category dropdown opens normally on first click"
      fixes:
        - "Global click listener ignores clicks inside modals and Choices dropdowns"
        - "FC change handlers use stopPropagation() to prevent event interference"
        - "Added 50ms delay after FC change to allow DOM to settle on mobile browsers"
        - "Z-index hierarchy enforced via CSS"
      files:
        - "frontend/web/templates/base.html:1479"
        - "frontend/web/templates/index.html:3372,3389"
        - "frontend/web/static/css/daisyui-overrides.css" # consolidated from modal-dropdowns-fix.css

  best_practices:
    - name: "Stop Event Propagation in Modal Handlers"
      example: |
        fcSelect.addEventListener('change', async (e) => {
            e.stopPropagation();
            e.stopImmediatePropagation();
            await categoryTree.updateFinancialCenter(fcId);
            await new Promise(resolve => setTimeout(resolve, 50)); // Mobile optimization
        });

    - name: "Modal-Aware Global Click Listeners"
      example: |
        document.addEventListener('click', (e) => {
            if (e.target.closest('.modal-box, .choices')) {
                return; // Ignore clicks inside modals/dropdowns
            }
            // Handle global click
        });

    - name: "Z-Index Hierarchy for Modals and Dropdowns"
      hierarchy:
        modal_backdrop: 1000
        modal_content: 1001
        choices_dropdown_in_modal: 1050
        mobile_menu_normal: 50
        mobile_menu_when_modal_open: 40

