follow_up_issues:
  - issue: "Reminder icon не появляется в recent-transactions-card после создания плана"
    description: |\
      После создания плана с напоминанием, иконка 🔔 не появляется в виджете
      recent transactions на главной странице, хотя напоминание создано успешно.
      Иконка появляется только после перезагрузки страницы или через 10 секунд.
    root_cause_1_frontend: |\
      Проблема с порядком выполнения операций (race condition):
      1. План создан → result.id = 7609
      2. HTMX обновляет recent-transactions (GET /api/v1/facts/recent-html)
         → Backend query: SELECT FROM t_scheduled_reminder WHERE fact_id IN (...)
         → Находит НОЛЬ напоминаний (reminder еще не создан)
         → Рендерит HTML БЕЗ иконки напоминания
      3. HTMX обновляет #recent-transactions с HTML (без иконки)
      4. createReminder() вызывается → reminder создается в БД
      5. remindersMap.set() → frontend map обновлен
      6. Но HTML уже отрендерен без иконки!
    fix_1_frontend: |\
      Переместить HTMX refresh ПОСЛЕ создания reminder:
      1. План создан
      2. createReminder() вызывается → reminder создается в БД
      3. remindersMap обновлен
      4. HTMX refresh → backend query находит reminder
      5. Backend рендерит HTML С иконкой reminder
      6. Иконка появляется в таблице!
    commit_1: "270a23a1"
    files_1:
      - "frontend/web/templates/index.html:2618-2651" # OfflineManager path
      - "frontend/web/templates/index.html:2671-2697" # Fallback path

    root_cause_2_backend_cache: |\
      ПОСЛЕ фикса 270a23a1 проблема частично осталась - иконка все равно
      появлялась только после перезагрузки или через 10 секунд.

      Причина: Backend endpoint /api/v1/facts/recent-html использует кеширование
      с TTL 10 секунд. Кеш инвалидируется при "any fact CRUD", но reminder
      создание это НЕ fact CRUD (отдельная таблица t_scheduled_reminder).

      Flow с багом:
      1. План создан → кеш инвалидирован (fact CRUD)
      2. Backend генерирует HTML БЕЗ reminder (reminder ещё не создан)
      3. HTML кешируется на 10 секунд
      4. Reminder создан (НЕТ cache invalidation - не fact CRUD!)
      5. HTMX запрашивает HTML → возвращается ЗАКЕШИРОВАННЫЙ ответ без reminder
      6. Иконка не появляется до истечения 10 секунд кеша
    fix_2_backend_cache: |\
      Добавить cache invalidation в reminder CRUD endpoints:
      - POST /api/v1/reminders/{fact_id} → инвалидировать кеш после создания
      - PUT /api/v1/reminders/{fact_id} → инвалидировать кеш после обновления
      - DELETE /api/v1/reminders/{fact_id} → инвалидировать кеш после удаления

      Инвалидируются все варианты кеша (limit 1-20), т.к. неизвестно какой
      limit отображается на dashboard пользователя.
    commit_2: "9a7f2556"
    files_2:
      - "backend/app/api/v1/endpoints/reminders.py:29" # cache_service import
      - "backend/app/api/v1/endpoints/reminders.py:130-133" # CREATE invalidation
      - "backend/app/api/v1/endpoints/reminders.py:230-233" # UPDATE invalidation
      - "backend/app/api/v1/endpoints/reminders.py:290-293" # DELETE invalidation

  - issue: "Reminder section не появляется при повторном открытии модального окна"
    status: "under investigation"
    description: |\
      При повторном открытии modal_add_plan и переключении в режим "Напоминание",
      секция выбора даты/времени напоминания не появляется визуально.
    findings: |\
      Логи показывают:
      - Первое открытие: offsetHeight: 124 ← РАБОТАЕТ
      - Второе открытие: offsetHeight: 0 ← НЕ РАБОТАЕТ
      - В обоих случаях: classes AFTER пустая строка (hidden удален)
      - В обоих случаях: computedDisplay: 'block', computedVisibility: 'visible'

      Проблема: offsetHeight: 0 означает что элемент технически visible, но
      имеет нулевую высоту → содержимое скрыто или удалено.
    hypothesis: |\
      Возможные причины:
      1. Child div (reminder-settings-*) имеет класс 'hidden' при повторном открытии
      2. CalendarWidget.destroy() + recreate ломает DOM структуру
      3. Содержимое child div удаляется при закрытии модалки
    debug_commits:
      - "1a9f44ae" # Initial visibility logging
      - "bf86b836" # Extended visibility diagnostics (computedStyle, parent)
      - "eaa7b0f2" # Child div check + after-widget-init check
    next_steps: "Waiting for user to test with extended logs (child div state)"

