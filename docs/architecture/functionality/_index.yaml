# Functionality - Business Logic Modules Index
# Индекс модулей бизнес-логики

description: |
  Модули бизнес-логики проекта Family Budget.
  Каждый модуль содержит services, models, endpoints и зависимости.

total_modules: 14

modules:
  # Core Budget
  - name: authentication
    file: "./authentication.yaml"
    description: "JWT tokens, Telegram OAuth, Email/Password, 2FA"
    services: [jwt, telegram_auth, auth_service, password_service, totp_service, two_factor_session_service, webapp_auth]
    critical: true

  - name: budget_management
    file: "./budget-management.yaml"
    description: "Категории (articles), транзакции (facts), иерархия"
    services: [article_service, hierarchy_service, scd2_service]
    critical: true

  - name: financial_centers
    file: "./financial-centers.yaml"
    description: "Счета, кошельки, балансы"
    services: [financial_center_service, balance_aggregation_service]

  - name: cost_centers
    file: "./cost-centers.yaml"
    description: "Проекты, отделы, группы расходов"
    services: [cost_center_service]

  - name: transfers
    file: "./transfers.yaml"
    description: "Переводы между счетами (paired facts)"
    services: []  # Logic in endpoints

  - name: recurring_plans
    file: "./recurring-plans.yaml"
    description: "Регламентные платежи (auto-generate facts)"
    services: [recurring_plan_service]
    notes: "Scheduler job daily at 02:00 UTC"

  # Shopping
  - name: shopping_lists
    file: "./shopping-lists.yaml"
    description: "Списки покупок, items, offline sync"
    services: [shopping_list_service, shopping_list_item_service, store_service, product_group_service, product_group_hierarchy_service]

  # Import
  - name: csv_import
    file: "./csv-import.yaml"
    description: "Импорт из банков (Tinkoff, generic CSV, Google Sheets)"
    services: [tinkoff_csv_parser, generic_csv_parser, google_sheets_parser, csv_detector, csv_analyzer, csv_validator, csv_column_matcher, csv_security, import_executor, mapping_service]

  # Notifications
  - name: notifications
    file: "./notifications.yaml"
    description: "Push notifications, reminders, broadcast"
    services: [notification_service, reminder_service, push_service]

  # Analytics
  - name: analytics
    file: "./analytics.yaml"
    description: "Статистика, отчёты, дашборды"
    services: []  # Logic in endpoints

  # Admin
  - name: admin
    file: "./admin.yaml"
    description: "Управление пользователями, bulk операции"
    services: [user_service]

  # Real-time
  - name: realtime
    file: "./realtime.yaml"
    description: "WebSocket события, BudgetWebSocketManager"
    services: []  # In-memory manager in endpoint
    critical: true
    notes: "WORKERS=1 required (single uvicorn worker)"

  # Offline
  - name: offline
    file: "./offline.yaml"
    description: "IndexedDB, sync queue, conflict resolution"
    services: []  # Frontend-only
    frontend_only: true

  # Operations
  - name: backup_restore
    file: "./backup-restore.yaml"
    description: "Резервное копирование PostgreSQL, S3 upload, restore"
    services: []  # Shell scripts (backup.sh, restore.sh, s3_backup.py)
    scripts:
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/s3_backup.py
      - scripts/check_backup_health.sh
    operational: true

# Dependency Graph (high-level)
dependency_order:
  - authentication          # No dependencies
  - budget_management       # Depends on: authentication
  - financial_centers       # Depends on: authentication
  - cost_centers            # Depends on: authentication
  - transfers               # Depends on: financial_centers, budget_management
  - recurring_plans         # Depends on: budget_management, financial_centers, cost_centers
  - shopping_lists          # Depends on: authentication
  - csv_import              # Depends on: budget_management, financial_centers
  - notifications           # Depends on: authentication
  - analytics               # Depends on: budget_management, financial_centers
  - admin                   # Depends on: authentication (admin only)
  - realtime                # Depends on: budget_management, shopping_lists
  - offline                 # Depends on: budget_management, shopping_lists (frontend)
  - backup_restore          # No runtime dependencies (operational tool)
