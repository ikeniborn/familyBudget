# Admin Module
# User management, bulk operations

module:
  name: admin
  description: "Администрирование: управление пользователями, bulk операции"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: user_service
      path: "backend/app/services/user_service.py"
      functions:
        - update_user_profile     # SCD Type 1 update
        - get_user_history        # Audit trail
        - promote_to_admin
        - demote_from_admin
        - deactivate_user
        - reactivate_user
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_user"
        - $ref: "../database/history.yaml#/tables/t_d_user_history"

  # ---------------------------------------------------------------------------
  # ENDPOINT FILES
  # ---------------------------------------------------------------------------
  endpoint_files:
    - name: admin
      path: "backend/app/api/v1/admin.py"
      loc: 2333
      description: "Admin panel operations"

    - name: admin_staging
      path: "backend/app/api/v1/admin_staging.py"
      loc: 640
      description: "Multi-bank import staging review"

    - name: admin_analytics
      path: "backend/app/api/v1/admin_analytics.py"
      loc: 519
      description: "Admin dashboards"

    - name: admin_export
      path: "backend/app/api/v1/admin_export.py"
      description: "Admin data export"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/admin.yaml#/routes"

  # ---------------------------------------------------------------------------
  # ADMIN OPERATIONS
  # ---------------------------------------------------------------------------
  operations:
    user_management:
      - "List all users"
      - "Create user"
      - "Update user role (admin/user)"
      - "Deactivate/reactivate user"
      - "View user history"

    article_management:
      - "Create/update/archive/restore articles"
      - "Bulk archive subtree"
      - "Merge articles"

    financial_center_management:
      - "Create/update/delete financial centers"
      - "Set initial balance"

    cost_center_management:
      - "Create/update/delete cost centers"

    import_management:
      - "Review staged imports"
      - "Approve/reject import batches"
      - "View import history"

    data_export:
      - "Export transactions to CSV"
      - "Export full database backup"

  # ---------------------------------------------------------------------------
  # AUTHORIZATION
  # ---------------------------------------------------------------------------
  authorization:
    check: "get_current_admin dependency"
    implementation: "backend/app/core/auth.py"
    rule: "User.is_admin == True"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    pages:
      - $ref: "../web/templates.yaml#/templates/admin_dashboard"
      - $ref: "../web/templates.yaml#/templates/admin_users"
      - $ref: "../web/templates.yaml#/templates/admin_articles"
      - $ref: "../web/templates.yaml#/templates/admin_financial_centers"
      - $ref: "../web/templates.yaml#/templates/admin_cost_centers"
      - $ref: "../web/templates.yaml#/templates/admin_stores"
      - $ref: "../web/templates.yaml#/templates/admin_product_groups"
      - $ref: "../web/templates.yaml#/templates/admin_monitoring"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # SECURITY NOTE
  # ---------------------------------------------------------------------------
  security_note: |
    All admin endpoints require:
    1. Valid JWT token
    2. User.is_admin == True
    3. User.is_active == True

    Admin-only operations:
    - Creating new users (no auto-registration)
    - Creating/modifying articles
    - Creating/modifying financial centers
    - Creating/modifying cost centers
    - Viewing all user data
