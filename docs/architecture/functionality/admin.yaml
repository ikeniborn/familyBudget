# Admin Module
# User management, bulk operations

module:
  name: admin
  description: "Администрирование: управление пользователями, bulk операции"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: user_service
      path: "backend/app/services/user_service.py"
      functions:
        - update_user_profile     # SCD Type 1 update
        - get_user_history        # Audit trail
        - promote_to_admin
        - demote_from_admin
        - deactivate_user
        - reactivate_user
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_user"
        - $ref: "../database/history.yaml#/tables/t_d_user_history"

    - name: logs_collector_service
      path: "backend/app/services/logs_collector_service.py"
      loc_code: 356
      loc_total: ~445
      functions:
        - collect_logs
        - get_recent_logs
        - filter_logs_by_level
        - export_logs
      depends_on: []
      notes: "Log collection and management for admin panel"

    - name: avatar_service
      path: "backend/app/services/avatar_service.py"
      loc_code: 171
      loc_total: ~215
      functions:
        - upload_avatar
        - get_avatar_url
        - delete_avatar
        - validate_image
      depends_on: []
      notes: "User avatar upload and management"

    - name: id_generator
      path: "backend/app/services/id_generator.py"
      loc_code: 58
      loc_total: ~73
      functions:
        - generate_id
        - generate_uuid
      depends_on: []
      notes: "Unique ID generation utility"

  # ---------------------------------------------------------------------------
  # ENDPOINT FILES
  # ---------------------------------------------------------------------------
  endpoint_files:
    - name: admin
      path: "backend/app/api/v1/admin.py"
      loc: 2333
      description: "Admin panel operations"

    - name: admin_staging
      path: "backend/app/api/v1/admin_staging.py"
      loc: 640
      description: "Multi-bank import staging review"

    - name: admin_analytics
      path: "backend/app/api/v1/admin_analytics.py"
      loc: 519
      description: "Admin dashboards"

    - name: admin_export
      path: "backend/app/api/v1/admin_export.py"
      description: "Admin data export"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/admin.yaml#/routes"

  # ---------------------------------------------------------------------------
  # ADMIN OPERATIONS (admin only)
  # ---------------------------------------------------------------------------
  operations:
    admin_only:
      user_management:
        - "List all users (includes has_password field)"
        - "Create user"
        - "Update user role (admin/user)"
        - "Deactivate/reactivate user"
        - "View user history"
        - "Reset password (requires has_password=true)"
        - "Reset 2FA (requires two_factor_enabled=true)"

      article_management:
        - "Archive/restore/delete articles"
        - "Bulk archive subtree"
        - "Merge articles"

      financial_center_management:
        - "Archive/restore/delete financial centers"

      cost_center_management:
        - "Archive/restore/delete cost centers"

      store_management:
        - "Archive/restore/delete stores"

      product_group_management:
        - "Archive/restore/delete/move product groups"

      import_management:
        - "Review staged imports"
        - "Approve/reject import batches"
        - "View import history"

      data_export:
        - "Export transactions to CSV"
        - "Export full database backup"

    # ---------------------------------------------------------------------------
    # ALL USERS OPERATIONS (any authenticated user)
    # ---------------------------------------------------------------------------
    all_users:
      article_management:
        - "View articles"
        - "Create articles"
        - "Edit articles"

      financial_center_management:
        - "View financial centers"
        - "Create financial centers"
        - "Edit financial centers"

      cost_center_management:
        - "View cost centers"
        - "Create cost centers"
        - "Edit cost centers"

      store_management:
        - "View stores"
        - "Create stores"
        - "Edit stores"

      product_group_management:
        - "View product groups"
        - "Create product groups"
        - "Edit product groups"

  # ---------------------------------------------------------------------------
  # AUTHORIZATION
  # ---------------------------------------------------------------------------
  authorization:
    check: "get_current_admin dependency"
    implementation: "backend/app/core/auth.py"
    rule: "User.is_admin == True"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    pages:
      - $ref: "../web/templates.yaml#/templates/admin_dashboard"
      - $ref: "../web/templates.yaml#/templates/admin_users"
      - $ref: "../web/templates.yaml#/templates/admin_articles"
      - $ref: "../web/templates.yaml#/templates/admin_financial_centers"
      - $ref: "../web/templates.yaml#/templates/admin_cost_centers"
      - $ref: "../web/templates.yaml#/templates/admin_stores"
      - $ref: "../web/templates.yaml#/templates/admin_product_groups"
      - $ref: "../web/templates.yaml#/templates/admin_monitoring"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # SECURITY NOTE
  # ---------------------------------------------------------------------------
  security_note: |
    All admin endpoints require:
    1. Valid JWT token
    2. User.is_admin == True
    3. User.is_active == True

    Admin-only operations:
    - User management (create, deactivate, role changes)
    - Archive/restore/delete articles
    - Archive/restore/delete financial centers
    - Archive/restore/delete cost centers
    - Archive/restore/delete stores
    - Archive/restore/delete/move product groups
    - Import management
    - Data export

    All authenticated users can:
    - View/create/edit articles
    - View/create/edit financial centers
    - View/create/edit cost centers
    - View/create/edit stores
    - View/create/edit product groups
