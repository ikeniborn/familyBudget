# Analytics Module
# Statistics, reports, dashboards

module:
  name: analytics
  description: "Статистика, отчёты, дашборды"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services: []
  # Note: Analytics logic is in endpoint handlers

  # ---------------------------------------------------------------------------
  # ENDPOINT FILES
  # ---------------------------------------------------------------------------
  endpoint_files:
    - name: analytics
      path: "backend/app/api/v1/analytics.py"
      loc: 2634
      description: "Public analytics endpoints"

    - name: admin_analytics
      path: "backend/app/api/v1/admin_analytics.py"
      loc: 519
      description: "Admin-only analytics dashboards"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/analytics.yaml#/routes"

  # ---------------------------------------------------------------------------
  # ANALYTICS TYPES
  # ---------------------------------------------------------------------------
  analytics_types:
    quick_stats:
      endpoint: "GET /api/v1/analytics/quick-stats"
      description: "Dashboard summary (today, week, month)"
      metrics:
        - total_income
        - total_expense
        - balance_change
        - top_categories

    account_balances:
      endpoint: "GET /api/v1/analytics/account-balances"
      description: "Current balance per financial center"

    category_breakdown:
      endpoint: "GET /api/v1/analytics/category-breakdown"
      description: "Expense breakdown by article"
      aggregation: "SUM(amount) GROUP BY article_id"

    monthly_summary:
      endpoint: "GET /api/v1/analytics/monthly-summary"
      description: "Month-over-month comparison"

    fact_hints:
      endpoint: "GET /api/v1/analytics/fact-hints"
      description: "Suggestions for transaction form (recent categories, amounts)"

    plan_hints:
      endpoint: "GET /api/v1/analytics/plan-hints"
      description: "Suggestions for budget planning"

  # ---------------------------------------------------------------------------
  # HTMX ENDPOINTS (HTML responses)
  # ---------------------------------------------------------------------------
  htmx_endpoints:
    quick_stats_html:
      endpoint: "GET /api/v1/analytics/quick-stats-html"
      template: "partials/quick_stats.html"
      trigger: "hx-get on page load"

    account_balances_html:
      endpoint: "GET /api/v1/analytics/account-balances-html"
      template: "partials/account_balances.html"
      trigger: "hx-get on page load"
      html_attributes:
        - name: "data-movement"
          description: "abs(current_balance - opening_balance) for mobile collapsible sorting"
          added: "2025-12-19"

    recent_transactions_html:
      endpoint: "GET /api/v1/facts/recent-html"
      template: "partials/recent_transactions.html"
      trigger: "hx-get on page load"

  # ---------------------------------------------------------------------------
  # CHARTS
  # ---------------------------------------------------------------------------
  charts:
    library: "ECharts"
    types:
      - pie_chart: "Category breakdown"
      - line_chart: "Monthly trends"
      - bar_chart: "Income vs Expense"

  # ---------------------------------------------------------------------------
  # AGGREGATION TABLES
  # ---------------------------------------------------------------------------
  aggregation_tables:
    - $ref: "../database/support.yaml#/tables/t_agg_financial_center_balance_monthly"
    - $ref: "../database/support.yaml#/tables/t_article_usage_stats"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./financial-centers.yaml#/module"
    - $ref: "./cost-centers.yaml#/module"
    - $ref: "./transfers.yaml#/module"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    pages:
      - $ref: "../web/templates.yaml#/templates/index"
      - $ref: "../web/templates.yaml#/templates/analytics"
    # telegram_webapp:
    #   - $ref: "../web/telegram-webapps.yaml#/pages/stats"
    #   - $ref: "../web/telegram-webapps.yaml#/pages/summary"
    # Note: telegram-webapps.yaml not yet created
