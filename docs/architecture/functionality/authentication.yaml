# Authentication Module
# JWT, Telegram OAuth, Email/Password, 2FA

meta:
  version: "1.0.0"
  description: "Authentication and authorization module"
  created: "2025-11-01"
  last_updated: "2026-01-21"
  status: "active"
  version_introduced: "5.0.0"
  breaking_changes:
    - version: "6.5.0"
      description: "Added WebAuthn passwordless authentication"
      migration: "See authentication.md for WebAuthn setup"
  related_docs:
    - "../authentication.md"
    - "../admin-setup.md"
    - "../endpoints/auth.yaml"
    - "../endpoints/webauthn.yaml"

module:
  name: authentication
  description: "Аутентификация и авторизация пользователей"
  critical: true

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: jwt
      path: "backend/app/services/jwt.py"
      loc: 315
      functions:
        - create_access_token
        - decode_access_token
        - decode_access_token_full
      depends_on: []

    - name: telegram_auth
      path: "backend/app/services/telegram_auth.py"
      loc: 401
      functions:
        - validate_telegram_auth
        - get_bot_username
      depends_on:
        - jwt
      notes: "HMAC-SHA256 validation"

    - name: auth_service
      path: "backend/app/services/auth_service.py"
      functions:
        - get_user_by_telegram_id
        - get_user_by_email
        - add_email_to_user
      depends_on: []

    - name: password_service
      path: "backend/app/services/password_service.py"
      loc: 321
      functions:
        - hash_password
        - verify_password
        - verify_password_with_dummy
      depends_on: []
      notes: "Argon2 hashing, timing attack prevention"

    - name: totp_service
      path: "backend/app/services/totp_service.py"
      functions:
        # Fixed 2026-01-14: Corrected function names from audit
        - generate_secret  # Was: generate_totp_secret
        - verify_totp
        - get_totp_uri
        - get_current_totp
        - generate_backup_codes
        - verify_backup_code
        - get_remaining_backup_codes_count
      depends_on: []
      notes: "TOTP 2FA (Google Authenticator compatible) + backup codes"

    - name: two_factor_session_service
      path: "backend/app/services/two_factor_session_service.py"
      functions:
        - create_session
        - verify_session
        - delete_session
      depends_on:
        - totp_service
      notes: "5-minute TTL sessions"

    - name: webapp_auth
      path: "backend/app/services/webapp_auth.py"
      functions:
        - validate_telegram_webapp_init_data
      depends_on:
        - jwt
      notes: "Telegram Web Apps auth via initData"

    # Added 2026-01-14: WebAuthn biometric authentication (v6.5.0+)
    - name: webauthn_service
      path: "backend/app/services/webauthn_service.py"
      loc_code: 602
      loc_total: ~750
      functions:
        - create_registration_challenge
        - verify_and_store_credential
        - create_authentication_challenge
        - verify_authentication_and_issue_tokens
        - get_user_credentials
        - revoke_credential
        - check_credential_exists
        - validate_attestation_response
        - validate_assertion_response
      depends_on:
        - auth_service
        - jwt
      notes: "FIDO2/WebAuthn biometric authentication (fingerprint, FaceID, etc.)"

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/dimensions.yaml#/tables/t_d_user"
    - $ref: "../database/history.yaml#/tables/t_d_user_history"
    - $ref: "../database/support.yaml#/tables/t_refresh_token"
    - $ref: "../database/support.yaml#/tables/t_2fa_session"
    - $ref: "../database/support.yaml#/tables/t_user_consent"
    # Added 2026-01-14: WebAuthn models (v6.5.0+)
    - $ref: "../database/dimensions.yaml#/tables/t_d_webauthn_credential"
    - $ref: "../database/facts.yaml#/tables/t_f_webauthn_challenge"
    - $ref: "../database/support.yaml#/tables/t_f_webauthn_audit_log"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    - $ref: "../endpoints/auth.yaml#/routes"

  # ---------------------------------------------------------------------------
  # MIDDLEWARE
  # ---------------------------------------------------------------------------
  middleware:
    - name: jwt_middleware
      path: "backend/app/middleware/jwt_middleware.py"
      description: |
        Extracts JWT from Cookie (access_token) or Bearer header.
        Validates signature + expiration.
        Injects user_id into request.state.
        Smart 401 handling (redirect for browser, JSON for API).
      whitelist:
        - "/health"
        - "/ready"
        - "/ping"
        - "/auth/*"
        - "/static/*"
        - "/api/v1/webapp/validate"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES (Core Auth Deps)
  # ---------------------------------------------------------------------------
  core_dependencies:
    - name: get_current_user
      path: "backend/app/core/auth.py"
      description: "Load User from DB by user_id in request.state"

    - name: get_current_admin
      path: "backend/app/core/auth.py"
      description: "get_current_user + is_admin check"

    - name: get_current_user_optional
      path: "backend/app/core/auth.py"
      description: "Optional user for public pages"

  # ---------------------------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------------------------
  security:
    jwt:
      storage: "httpOnly cookie (access_token)"
      expiration: "7 days (configurable)"
      algorithm: "HS256"

    telegram_oauth:
      validation: "HMAC-SHA256 with bot token"
      note: "User must exist before login (no auto-registration)"
      widget_loading:
        description: "Telegram Login Widget loading with error handling"
        preload: "link rel=preload for widget script"
        detection: "MutationObserver for iframe injection"
        timeout: "15 seconds"
        state_machine:
          states: ["loading", "success", "error"]
          guarantee: "One UI element always visible (no empty space)"
        error_handling:
          retry_mechanism: "Script re-injection with cache-busting timestamp"
          max_retries: 3
          cooldown: "2 seconds between retries"
          fallback: "Direct t.me/bot_username link"
        ui_elements:
          loading: "#telegram-placeholder (inline HTML, visible immediately)"
          error: "#telegram-error (warning alert + retry button + fallback link)"

    password:
      algorithm: "Argon2id"
      timing_attack_prevention: true

    two_factor:
      type: "TOTP"
      session_ttl: "5 minutes"
      backup_codes: "10 codes, one-time use"

    # Added 2026-01-14: WebAuthn security (v6.5.0+)
    webauthn:
      standard: "FIDO2/WebAuthn Level 2"
      authenticator_attachment: "platform (biometric) or cross-platform (USB key)"
      user_verification: "required"
      resident_key: "discouraged (server-side storage)"
      challenge_ttl: "10 minutes"
      audit_trail: "All operations logged to t_s_webauthn_audit_log"

  # ---------------------------------------------------------------------------
  # FLOWS
  # ---------------------------------------------------------------------------
  flows:
    telegram_oauth:
      $ref: "../flows/telegram-oauth.yaml"

    email_password:
      steps:
        - "User enters email/password"
        - "POST /api/v1/auth/login"  # Updated 2026-01-14: Corrected endpoint
        - "Hash password with Argon2"
        - "If 2FA enabled: require TOTP verification"
        - "User verifies at POST /api/v1/auth/verify-2fa"  # Updated 2026-01-14
        - "Create JWT token → httpOnly cookie"

    # Added 2026-01-14: WebAuthn flow (v6.5.0+)
    webauthn_registration:
      steps:
        - "User initiates registration from settings"
        - "POST /api/v1/webauthn/register/options → generate challenge"
        - "Browser calls navigator.credentials.create()"
        - "POST /api/v1/webauthn/register/verify → verify + store credential"
        - "Credential saved to t_d_webauthn_credential"

    webauthn_authentication:
      steps:
        - "User selects WebAuthn login"
        - "POST /api/v1/webauthn/authenticate/options → generate challenge"
        - "Browser calls navigator.credentials.get()"
        - "POST /api/v1/webauthn/authenticate/verify → verify + issue JWT"
        - "Create JWT token → httpOnly cookie"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./financial-centers.yaml#/module"
    - $ref: "./cost-centers.yaml#/module"
    - $ref: "./shopping-lists.yaml#/module"
    - $ref: "./admin.yaml#/module"
    - $ref: "../web/js-modules.yaml#/modules/offlineManager"
