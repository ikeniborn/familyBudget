# Backup & Restore Module
# PostgreSQL backup, S3 upload, restore operations

module:
  name: backup_restore
  description: "Резервное копирование PostgreSQL, S3 upload, restore"
  type: operational  # Not a runtime service, operational tooling

  # ---------------------------------------------------------------------------
  # SCRIPTS (Shell/Python)
  # ---------------------------------------------------------------------------
  scripts:
    - name: backup.sh
      path: "scripts/backup.sh"
      description: "Main backup script with local and S3 upload"
      features:
        - Local PostgreSQL backup via pg_dump
        - Gzip compression
        - Local retention (7 days)
        - S3 upload with retry logic (3 attempts)
        - S3 cleanup (28 days retention)
        - Lock file protection (prevent concurrent runs)
      options:
        --force-s3: "Force S3 upload regardless of schedule"
        --verbose: "Enable debug logging"
      exit_codes:
        0: "Success"
        1: "Backup failed"
        2: "Configuration error"
        3: "Lock file exists (another instance running)"
        4: "S3 upload failed (backup still saved locally)"

    - name: restore.sh
      path: "scripts/restore.sh"
      description: "Interactive restore from local or S3 backup"
      features:
        - Interactive menu (local/S3/cancel)
        - Backup validation (gzip integrity, PostgreSQL structure)
        - Safety backup before restore
        - Approval gate (must type 'yes')
        - Service management (stop/start backend, bot)
        - Connection termination
      exit_codes:
        0: "Success"
        1: "Restore failed"
        2: "Configuration error"
        3: "User cancelled"
        4: "Validation failed"

    - name: s3_backup.py
      path: "scripts/s3_backup.py"
      description: "Python utility for S3 operations (boto3)"
      commands:
        upload: "Upload file to S3 with progress"
        cleanup: "Delete old backups from S3"
      dependencies:
        - boto3

    - name: check_backup_health.sh
      path: "scripts/check_backup_health.sh"
      description: "Monitoring script for backup health"
      checks:
        - Backup exists (today)
        - Backup age (<=26 hours)
        - Backup size (>=100KB)
        - Backup count (>0)
        - Log errors
        - Disk space (80% warn, 90% critical)
        - S3 sync status
        - PostgreSQL container status
      output_formats:
        - normal: "Colored text for humans"
        - json: "Machine-readable for monitoring"
        - quiet: "Errors only"

  # ---------------------------------------------------------------------------
  # STORAGE STRATEGY
  # ---------------------------------------------------------------------------
  storage:
    local:
      path: "/opt/budget/backups"
      retention_days: 7
      format: "backup_YYYYMMDD_HHMMSS.sql.gz"
      permissions: "644"

    s3:
      endpoint: "${S3_ENDPOINT_URL:-https://storage.yandexcloud.net}"
      bucket: "${S3_BUCKET_NAME}"
      base_path: "postgresql-backups"
      path_format: "postgresql-backups/YYYY/MM/backup_YYYYMMDD_HHMMSS.sql.gz"
      retention_days: 28
      upload_frequency: "daily"

  # ---------------------------------------------------------------------------
  # ENVIRONMENT VARIABLES
  # ---------------------------------------------------------------------------
  environment_variables:
    required:
      - POSTGRES_USER
      - POSTGRES_DB
    optional_s3:
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_BUCKET_NAME
      - S3_ENDPOINT_URL
      - S3_REGION

  # ---------------------------------------------------------------------------
  # AUTOMATION
  # ---------------------------------------------------------------------------
  automation:
    cron:
      file: "scripts/cron/familybudget-backup.cron"
      schedule: "0 2 * * *"  # 2:00 AM daily
      user: root

    systemd:
      service: "scripts/systemd/familybudget-backup.service"
      timer: "scripts/systemd/familybudget-backup.timer"
      schedule: "02:00:00 daily"
      persistent: true
      randomized_delay: "5min"

    integration:
      file: "scripts/lib/backup_integration.sh"
      description: "Integration with deploy.sh"

  # ---------------------------------------------------------------------------
  # WORKFLOW DIAGRAMS
  # ---------------------------------------------------------------------------
  workflows:
    backup:
      steps:
        - "Check dependencies (docker, gzip, python3)"
        - "Load .env configuration"
        - "Create lock file"
        - "Execute pg_dump via Docker"
        - "Compress with gzip"
        - "Save to local storage"
        - "Rotate local backups (7 days)"
        - "Upload to S3 (if configured)"
        - "Cleanup old S3 backups (28 days)"
        - "Generate report"

    restore:
      steps:
        - "Show interactive menu (local/S3/cancel)"
        - "Download from S3 (if selected)"
        - "Validate backup (gzip, PostgreSQL structure)"
        - "Create safety backup of current DB"
        - "Approval gate (type 'yes')"
        - "Stop services (backend, bot)"
        - "Terminate DB connections"
        - "DROP DATABASE"
        - "CREATE DATABASE"
        - "Restore from backup"
        - "Start services"
        - "Wait for health checks"
        - "Generate report"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    runtime: []  # No runtime dependencies (operational tool)
    system:
      - docker
      - gzip
      - python3
      - boto3  # Python package

  # ---------------------------------------------------------------------------
  # NOTES
  # ---------------------------------------------------------------------------
  notes:
    - "Backup runs OUTSIDE Docker containers (host script)"
    - "Uses Docker exec for pg_dump"
    - "S3 credentials are optional - local backup always works"
    - "Lock file prevents concurrent backups"
    - "set -e in bash requires careful error handling"
