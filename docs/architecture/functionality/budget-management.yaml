# Budget Management Module
# Articles, Facts, Hierarchy

meta:
  version: "1.0.0"
  description: "Budget categories, transactions, and hierarchy management"
  created: "2025-11-01"
  last_updated: "2026-01-21"
  status: "active"
  version_introduced: "1.0.0"
  related_docs:
    - "../database/dimensions.yaml#/tables/t_d_article"
    - "../database/facts.yaml#/tables/t_f_budget_fact"
    - "../database/hierarchy.yaml"
    - "../endpoints/articles.yaml"
    - "../endpoints/facts.yaml"

module:
  name: budget_management
  description: "Управление категориями бюджета (articles), транзакциями (facts), иерархией"
  critical: true

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: article_service
      path: "backend/app/services/article_service.py"
      functions:
        - update_article_profile     # SCD Type 1 in-place update
        - create_initial_history     # First history record
        - get_article_history        # Audit trail
        - get_article_version_at_date  # Time-travel query
      depends_on:
        - scd2_service
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_article"
        - $ref: "../database/history.yaml#/tables/t_d_article_history"

    - name: hierarchy_service
      path: "backend/app/services/hierarchy_service.py"
      loc: 573
      functions:
        - get_subtree              # All descendants to depth
        - get_ancestors            # All parents up to root
        - get_path                 # Root → article path
        - get_depth                # Subtree max depth
        - get_direct_children      # Immediate children only
        - get_root                 # Find root ancestor
        - archive_recursive        # Archive subtree
        - restore_recursive        # Restore subtree
        - is_descendant_of         # Relationship check
        - get_level                # Depth from root
      depends_on: []
      models:
        - $ref: "../database/hierarchy.yaml#/tables/t_d_article_hierarchy"
      notes: "Closure Table pattern for O(1) queries"

    - name: scd2_service
      path: "backend/app/services/scd2_service.py"
      loc: 520
      functions:
        - create_new_version       # Generic SCD2 version creation
        - get_current_version      # Query current version
        - get_version_at_date      # Time-travel query
        - get_history              # Ordered history list
        - has_changes              # Detect changed fields
        - validate_scd2_instance   # Verify SCD2 structure
        - verify_no_concurrent_update  # Race condition prevention
      depends_on: []
      notes: "Generic SCD Type 2 operations for all entities"

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    # Dimensions
    - $ref: "../database/dimensions.yaml#/tables/t_d_article"
    # History
    - $ref: "../database/history.yaml#/tables/t_d_article_history"
    # Hierarchy
    - $ref: "../database/hierarchy.yaml#/tables/t_d_article_hierarchy"
    # Facts
    - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
    - $ref: "../database/history.yaml#/tables/t_f_budget_fact_history"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/"
    files:
      - article.py:
          - ArticleCreate
          - ArticleUpdate
          - ArticleResponse
          - ArticleUsageStats
      - fact.py:
          - FactCreate
          - FactUpdate
          - FactResponse
          - FactFilter

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    articles:
      $ref: "../endpoints/articles.yaml#/routes"
    facts:
      $ref: "../endpoints/facts.yaml#/routes"

  # ---------------------------------------------------------------------------
  # PATTERNS
  # ---------------------------------------------------------------------------
  patterns:
    scd_type_1:
      description: |
        Main table (Article) contains ONLY current state.
        UPDATE statement (no INSERT).
        Stable PK for fact table FKs.

    scd_type_2:
      description: |
        History table (ArticleHistory) tracks ALL changes.
        INSERT on each change.
        is_current flag, valid_from/valid_to timestamps.

    closure_table:
      description: |
        ArticleHierarchy stores all ancestor-descendant paths.
        O(1) queries for subtree, ancestors, path.
        No recursive queries needed.

    star_schema:
      description: |
        BudgetFact (fact table) with FKs to dimensions.
        user_id, article_id, financial_center_id, cost_center_id.

  # ---------------------------------------------------------------------------
  # DATA INTEGRITY
  # ---------------------------------------------------------------------------
  data_integrity:
    article_types:
      - income
      - expense

    record_types:
      - fact    # Actual transaction
      - plan    # Planned/budgeted

    constraints:
      - "amount > 0 (sign determined by article type)"
      - "fact_date within valid range"
      - "parent_id cannot reference self"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./transfers.yaml#/module"
    - $ref: "./csv-import.yaml#/module"
    - $ref: "./analytics.yaml#/module"
    - $ref: "./realtime.yaml#/module"
    - $ref: "./offline.yaml#/module"
    - $ref: "../web/templates.yaml#/templates/facts"
    - $ref: "../web/templates.yaml#/templates/admin_articles"
    - $ref: "../web/js-modules.yaml#/modules/offlineManager"

  # ---------------------------------------------------------------------------
  # FLOWS
  # ---------------------------------------------------------------------------
  flows:
    create_transaction:
      $ref: "../flows/create-transaction.yaml"

    create_article:
      steps:
        - "POST /api/v1/articles"
        - "Check: current_user.is_admin"
        - "Validate: parent_id exists"
        - "INSERT INTO t_d_article"
        - "article_service.create_initial_history()"
        - "ArticleHierarchy auto-updated via trigger"
        - "WebSocket broadcast to all clients"
        - "Return ArticleResponse"

    update_article:
      steps:
        - "PUT /api/v1/articles/{id}"
        - "Check: current_user.is_admin"
        - "Compare old vs new values"
        - "UPDATE t_d_article (SCD Type 1)"
        - "Close old ArticleHistory (is_current=False)"
        - "INSERT new ArticleHistory (is_current=True)"
        - "WebSocket broadcast"
        - "Return ArticleResponse"
