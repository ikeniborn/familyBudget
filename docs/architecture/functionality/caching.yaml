# Caching Module
# Redis caching, write-behind pattern, cache metrics

module:
  name: caching
  description: "Кэширование данных в Redis с write-behind паттерном"
  critical: false

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: redis_service
      path: "backend/app/services/redis_service.py"
      loc_code: 216
      loc_total: ~270
      functions:
        - get_redis_client
        - ping
        - get_stats
      depends_on: []
      notes: "Base Redis connection management"

    - name: cache_service
      path: "backend/app/services/cache_service.py"
      loc_code: 346
      loc_total: ~430
      functions:
        - get
        - set
        - delete
        - exists
        - get_or_compute
        - invalidate_pattern
      depends_on:
        - redis_service
      notes: "Generic Redis cache layer with TTL support"

    - name: write_behind_service
      path: "backend/app/services/write_behind_service.py"
      loc_code: 641
      loc_total: ~800
      functions:
        - queue_write
        - flush_writes
        - get_pending_count
      depends_on:
        - redis_service
        - cache_service
      notes: "Write-behind pattern for delayed database writes. Improves write performance."

    - name: cache_metrics_service
      path: "backend/app/services/cache_metrics_service.py"
      loc_code: 223
      loc_total: ~280
      functions:
        - get_hit_rate
        - get_total_requests
        - record_hit
        - record_miss
        - get_cache_size
      depends_on:
        - redis_service
      notes: "Cache performance metrics collection"

  # ---------------------------------------------------------------------------
  # REDIS PUB/SUB (for WebSocket multi-worker)
  # ---------------------------------------------------------------------------
  redis_pubsub:
    services:
      - name: redis_pubsub_service
        path: "backend/app/services/redis_pubsub_service.py"
        loc_code: 198
        loc_total: ~250
        functions:
          - publish
          - subscribe
          - unsubscribe
        depends_on:
          - redis_service
        notes: "Redis Pub/Sub for multi-worker WebSocket synchronization"

      - name: redis_ws_manager
        path: "backend/app/services/redis_ws_manager.py"
        loc_code: 316
        loc_total: ~395
        functions:
          - broadcast_event
          - subscribe_to_events
          - handle_redis_message
        depends_on:
          - redis_pubsub_service
        notes: "WebSocket manager with Redis Pub/Sub for multi-worker deployments"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    - $ref: "../endpoints/admin-analytics.yaml#/routes/6"  # /admin/cache-metrics GET
    - $ref: "../endpoints/admin-analytics.yaml#/routes/7"  # /admin/cache-metrics POST
    - $ref: "../endpoints/admin-analytics.yaml#/routes/8"  # /admin/redis-stats

  # ---------------------------------------------------------------------------
  # CONFIGURATION
  # ---------------------------------------------------------------------------
  config:
    env_vars:
      REDIS_ENABLED: "true/false (default false)"
      REDIS_HOST: "string (default localhost)"
      REDIS_PORT: "integer (default 6379)"
      REDIS_PASSWORD: "string (optional)"
      REDIS_DB: "integer (default 0)"
      REDIS_TTL: "integer (seconds, default 3600)"

  # ---------------------------------------------------------------------------
  # USAGE PATTERNS
  # ---------------------------------------------------------------------------
  usage:
    reference_data_caching:
      description: "Cache articles, financial_centers, cost_centers"
      ttl: 3600  # 1 hour
      invalidation: "On update/delete of entity"

    balance_aggregation:
      description: "Cache balance_aggregation results"
      ttl: 300  # 5 minutes
      invalidation: "On fact create/update/delete"

    websocket_events:
      description: "Redis Pub/Sub for multi-worker WebSocket"
      enabled_when: "REDIS_ENABLED=true and WORKERS>1"

  notes: |
    Redis is OPTIONAL. System works without Redis (single-worker mode).
    Write-behind pattern reduces database write load.
    Cache metrics track performance.
