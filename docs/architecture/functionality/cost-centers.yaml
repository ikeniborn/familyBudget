# Cost Centers Module
# Projects, departments, expense groups

module:
  name: cost_centers
  description: "Управление центрами затрат (проекты, отделы, группы расходов)"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: cost_center_service
      path: "backend/app/services/cost_center_service.py"
      functions:
        - update_cost_center_profile  # SCD Type 1 update
        - create_initial_history
        - get_cost_center_history
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_cost_center"
        - $ref: "../database/history.yaml#/tables/t_d_cost_center_history"

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/dimensions.yaml#/tables/t_d_cost_center"
    - $ref: "../database/history.yaml#/tables/t_d_cost_center_history"
    - $ref: "../database/support.yaml#/tables/t_cost_center_financial_center"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/cost_center.py"
    classes:
      - CostCenterCreate
      - CostCenterUpdate
      - CostCenterResponse

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/cost-centers.yaml#/routes"

  # ---------------------------------------------------------------------------
  # UI TERMINOLOGY
  # ---------------------------------------------------------------------------
  terminology:
    code: "CostCenter"
    ui_russian: "Место затрат"
    ui_english: "Cost Center"
    table: "t_d_cost_center"
    examples:
      - "Дом"
      - "Машина"
      - "Дача"
      - "Отпуск 2025"

  # ---------------------------------------------------------------------------
  # PATTERNS
  # ---------------------------------------------------------------------------
  patterns:
    scd_type_1:
      description: "In-place updates with stable PK"
    history:
      description: "SCD Type 2 in CostCenterHistory"
    shared_reference:
      description: "All users can READ, only admins can WRITE"
    optional_in_facts:
      description: "cost_center_id is nullable in BudgetFact"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./csv-import.yaml#/module"
    - $ref: "./analytics.yaml#/module"
    - $ref: "../web/templates.yaml#/templates/admin_cost_centers"
