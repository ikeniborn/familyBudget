# CSV Import Module
# Multi-bank CSV import (Tinkoff, generic, Google Sheets)

module:
  name: csv_import
  description: "Импорт транзакций из банковских CSV выписок"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: tinkoff_csv_parser
      path: "backend/app/services/tinkoff_csv_parser.py"
      loc: 324
      functions:
        - parse_tinkoff_csv
        - detect_tinkoff_format
      depends_on: []
      notes: "Tinkoff bank specific CSV format"

    - name: generic_csv_parser
      path: "backend/app/services/generic_csv_parser.py"
      loc: 405
      functions:
        - parse_generic_csv
        - map_columns
      depends_on:
        - csv_column_matcher
      notes: "Generic bank CSV with column mapping"

    - name: google_sheets_parser
      path: "backend/app/services/google_sheets_parser.py"
      functions:
        - parse_google_sheets_url     # Extract spreadsheet_id and sheet_gid from URL
        - fetch_google_sheets_as_csv  # Fetch public sheet as CSV via export endpoint
      depends_on:
        - httpx  # Async HTTP client
      notes: |
        Google Sheets public export integration.
        - Parses URLs like https://docs.google.com/spreadsheets/d/{ID}/edit#gid={GID}
        - Fetches CSV via https://docs.google.com/spreadsheets/d/{ID}/export?format=csv&gid={GID}
        - Detects OAuth redirects (private sheets) and returns clear error messages
        - Handles 403 Forbidden (not public) and 404 Not Found errors
        - No Google API key required - uses public export URL

    - name: csv_detector
      path: "backend/app/services/csv_detector.py"
      loc: 379
      functions:
        - detect_bank_format
        - detect_encoding
        - detect_delimiter
      depends_on: []
      notes: "Auto-detect CSV format and bank"

    - name: bank_provider_service
      path: "backend/app/services/bank_provider_service.py"
      loc_code: 176
      loc_total: ~220
      functions:
        - detect_bank_provider
        - get_provider_parser
        - validate_provider_format
      depends_on:
        - csv_detector
      notes: "Bank provider detection for CSV import (Tinkoff, Sber, etc.)"

    - name: csv_analyzer
      path: "backend/app/services/csv_analyzer.py"
      functions:
        - analyze_csv_structure
        - suggest_column_mapping
      depends_on:
        - csv_detector

    - name: csv_validator
      path: "backend/app/services/csv_validator.py"
      loc: 550
      functions:
        - validate_csv_data
        - validate_dates
        - validate_amounts
        - check_duplicates
        - get_or_create_store
        - get_or_create_product_group
      depends_on:
        - code_generator
        - store_history (inline)
        - product_group_history (inline)
        - product_group_hierarchy (inline)
      notes: |
        Data quality validation.
        When create_missing_references=true:
        - Creates Store/ProductGroup with auto-generated code (STORE-N, PGRP-N)
        - Creates initial history records (SCD Type 2)
        - Creates hierarchy self-reference for ProductGroup (Closure Table)
        All within same transaction (no intermediate commits).

    - name: csv_column_matcher
      path: "backend/app/services/csv_column_matcher.py"
      loc: 339
      functions:
        - match_columns_to_schema
        - get_column_suggestions
      depends_on: []
      notes: "Match CSV columns to BudgetFact fields"

    - name: csv_security
      path: "backend/app/services/csv_security.py"
      functions:
        - sanitize_csv_content
        - detect_csv_injection
      depends_on: []
      notes: "CSV injection prevention"

    - name: import_executor
      path: "backend/app/services/import_executor.py"
      loc: 332
      functions:
        - execute_import
        - rollback_import
        - get_import_preview
      depends_on:
        - csv_validator
        - $ref: "./budget-management.yaml#/module/services/0"
      notes: "Execute staged imports"

    - name: mapping_service
      path: "backend/app/services/mapping_service.py"
      functions:
        - get_mapping        # Get mapping by bank_provider_id (shared)
        - save_mapping       # Save/update mapping (shared per bank)
        - get_default_mapping  # Get default mapping for known banks
      depends_on: []
      models:
        - $ref: "../database/support.yaml#/tables/t_import_column_mapping"
      notes: |
        Mappings are SHARED per bank (one mapping per bank_provider_id).
        All users share the same mapping for a given bank.
        user_id tracks who last updated the mapping (informational only).
        Any authenticated user can create or update mappings.

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/support.yaml#/tables/t_import_staging"
    - $ref: "../database/support.yaml#/tables/t_import_file_upload"
    - $ref: "../database/support.yaml#/tables/t_import_column_mapping"
    - $ref: "../database/dimensions.yaml#/tables/t_d_import_template"
    - $ref: "../database/dimensions.yaml#/tables/t_d_bank_provider"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/import.yaml#/routes"

  # ---------------------------------------------------------------------------
  # IMPORT WORKFLOW
  # ---------------------------------------------------------------------------
  workflow:
    flow:
      $ref: "../flows/csv-import.yaml"

    stages:
      - name: upload
        description: "Upload data source (CSV file or Google Sheets URL)"
        endpoints:
          - "POST /api/v1/import/upload (CSV file)"
          - "POST /api/v1/import/google-sheets/upload (Google Sheets URL)"
        output: "ImportFileUpload record"
        ui:
          component: "Radio buttons for source selection"
          options:
            - "📄 CSV файл"
            - "📊 Google Sheets"

      - name: detect
        description: "Auto-detect bank format"
        service: csv_detector
        output: "BankProvider, encoding, delimiter"

      - name: analyze
        description: "Analyze CSV structure"
        service: csv_analyzer
        output: "Column mapping suggestions"

      - name: preview
        description: "Show import preview"
        endpoint: "POST /api/v1/import/preview"
        output: "List of staged transactions"

      - name: validate
        description: "Validate data quality"
        service: csv_validator
        output: "Validation errors/warnings"

      - name: execute
        description: "Execute import"
        endpoint: "POST /api/v1/import/execute"
        output: "Created BudgetFact records"

  # ---------------------------------------------------------------------------
  # SUPPORTED BANKS
  # ---------------------------------------------------------------------------
  supported_banks:
    - name: tinkoff
      formats: ["CSV"]
      auto_detect: true
      parser: tinkoff_csv_parser

    - name: sberbank
      formats: ["CSV"]
      auto_detect: true
      parser: generic_csv_parser

    - name: generic
      formats: ["CSV"]
      auto_detect: false
      parser: generic_csv_parser
      notes: "User defines column mapping"

    - name: google_sheets
      formats: ["Google Sheets"]
      auto_detect: false
      parser: google_sheets_parser

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./financial-centers.yaml#/module"
    - $ref: "./cost-centers.yaml#/module"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    admin_page:
      $ref: "../web/templates.yaml#/templates/admin_import"
    js_modules:
      - $ref: "../web/js-modules.yaml#/modules/csvImporter"
      - $ref: "../web/js-modules.yaml#/modules/googleSheetsImporter"
      - $ref: "../web/js-modules.yaml#/modules/importManager"

    # UI refactoring variants for enrichment table (Step 4)
    ui_variants:
      $ref: "../web/templates.yaml#/templates/admin_import/ui_refactoring_variants"
      location: "tmp/import/"
      description: "10 standalone HTML demos with different UX approaches"
      variants:
        - variant-01-cards.html      # Card-Based Layout
        - variant-02-split-panel.html # Master-Detail Split Panel
        - variant-03-modal-edit.html  # Modal Edit Form
        - variant-04-accordion.html   # Expandable Accordion Rows
        - variant-05-kanban.html      # Kanban Status Columns
        - variant-06-popover.html     # Inline Popover Edit
        - variant-07-grouped.html     # Grouped Collapsible Table
        - variant-08-wizard.html      # Step-by-Step Wizard
        - variant-09-sticky.html      # Sticky Header + Floating Toolbar
        - variant-10-toggle.html      # Compact/Detail View Toggle
