# Error Handling Patterns
# Exception hierarchy and error responses

meta:
  version: "1.0.0"
  description: "Error handling patterns for backend and frontend"
  created: "2026-01-21"
  last_updated: "2026-01-21"
  status: "active"
  related_docs:
    - "./schema-validation.yaml"
    - "../endpoints/*.yaml"
    - "../websocket.md"

# =============================================================================
# BACKEND EXCEPTIONS (FastAPI)
# =============================================================================

backend:
  framework: "FastAPI + Custom Exceptions"
  location: "backend/app/"

  # ---------------------------------------------------------------------------
  # Exception Hierarchy
  # ---------------------------------------------------------------------------
  exception_hierarchy:
    base_exception:
      name: "AppException"
      file: "backend/app/core/exceptions.py"
      properties:
        - "status_code: int"
        - "detail: str"
        - "error_code: Optional[str]"
      usage: "Base class for all application exceptions"

    authentication_errors:
      - name: "AuthenticationError"
        status_code: 401
        error_code: "AUTH_FAILED"
        detail: "Authentication failed"
        use_cases:
          - "Invalid JWT token"
          - "Token expired"
          - "Missing authorization header"

      - name: "InvalidCredentialsError"
        status_code: 401
        error_code: "INVALID_CREDENTIALS"
        detail: "Invalid email or password"
        use_cases:
          - "Email/password login failed"

      - name: "TelegramAuthError"
        status_code: 401
        error_code: "TELEGRAM_AUTH_FAILED"
        detail: "Telegram authentication failed"
        use_cases:
          - "Invalid Telegram hash"
          - "Expired Telegram auth data"

    authorization_errors:
      - name: "AuthorizationError"
        status_code: 403
        error_code: "FORBIDDEN"
        detail: "Insufficient permissions"
        use_cases:
          - "Non-admin trying to access admin endpoints"
          - "User accessing another user's data"

      - name: "TwoFactorRequiredError"
        status_code: 403
        error_code: "2FA_REQUIRED"
        detail: "Two-factor authentication required"
        use_cases:
          - "Admin action requires 2FA"

    resource_errors:
      - name: "ResourceNotFoundError"
        status_code: 404
        error_code: "NOT_FOUND"
        detail: "Resource not found"
        use_cases:
          - "Article ID doesn't exist"
          - "User ID not found"

      - name: "ResourceAlreadyExistsError"
        status_code: 409
        error_code: "ALREADY_EXISTS"
        detail: "Resource already exists"
        use_cases:
          - "Duplicate article name"
          - "Email already registered"

    validation_errors:
      - name: "ValidationError"
        status_code: 422
        error_code: "VALIDATION_ERROR"
        detail: "Validation failed"
        use_cases:
          - "Pydantic validation failed"
          - "Custom business logic validation failed"

      - name: "BusinessRuleViolationError"
        status_code: 422
        error_code: "BUSINESS_RULE_VIOLATION"
        detail: "Business rule violated"
        use_cases:
          - "Cannot delete article with child items"
          - "Cannot transfer to same account"

    database_errors:
      - name: "DatabaseError"
        status_code: 500
        error_code: "DATABASE_ERROR"
        detail: "Database operation failed"
        use_cases:
          - "Connection timeout"
          - "Query execution failed"

      - name: "IntegrityError"
        status_code: 409
        error_code: "INTEGRITY_VIOLATION"
        detail: "Database integrity constraint violated"
        use_cases:
          - "Foreign key constraint violation"
          - "Unique constraint violation"

  # ---------------------------------------------------------------------------
  # Error Response Format
  # ---------------------------------------------------------------------------
  error_response_format:
    structure:
      detail: "Human-readable error message"
      error_code: "Machine-readable error code (optional)"
      field_errors: "Field-specific errors (optional, for validation)"

    examples:
      authentication_error:
        status: 401
        body:
          detail: "Invalid or expired JWT token"
          error_code: "AUTH_FAILED"

      validation_error:
        status: 422
        body:
          detail: "Validation failed"
          error_code: "VALIDATION_ERROR"
          field_errors:
            - field: "amount"
              message: "must be greater than 0"
            - field: "article_id"
              message: "article not found"

      resource_not_found:
        status: 404
        body:
          detail: "Article not found"
          error_code: "NOT_FOUND"

      business_rule_violation:
        status: 422
        body:
          detail: "Cannot delete article with existing transactions"
          error_code: "BUSINESS_RULE_VIOLATION"

  # ---------------------------------------------------------------------------
  # Exception Raising Patterns
  # ---------------------------------------------------------------------------
  patterns:
    raise_authentication_error:
      example: |
        from app.core.exceptions import AuthenticationError

        async def get_current_user(token: str) -> User:
            try:
                payload = decode_jwt(token)
            except InvalidTokenError:
                raise AuthenticationError("Invalid or expired JWT token")

            user = await get_user_by_id(payload['user_id'])
            if not user:
                raise AuthenticationError("User not found")

            return user

    raise_resource_not_found:
      example: |
        from app.core.exceptions import ResourceNotFoundError

        async def get_article(article_id: UUID) -> Article:
            article = await db.get(Article, article_id)
            if not article:
                raise ResourceNotFoundError(f"Article {article_id} not found")
            return article

    raise_validation_error:
      example: |
        from app.core.exceptions import ValidationError

        async def create_transfer(from_fc: UUID, to_fc: UUID, amount: Decimal):
            if from_fc == to_fc:
                raise ValidationError("Cannot transfer to the same account")

            if amount <= 0:
                raise ValidationError("Amount must be positive")

            # Process transfer...

    raise_business_rule_violation:
      example: |
        from app.core.exceptions import BusinessRuleViolationError

        async def delete_article(article_id: UUID):
            # Check if article has transactions
            fact_count = await db.count(BudgetFact, article_id=article_id)
            if fact_count > 0:
                raise BusinessRuleViolationError(
                    f"Cannot delete article with {fact_count} existing transactions"
                )

            await db.delete(Article, article_id)

  # ---------------------------------------------------------------------------
  # Exception Handler Middleware
  # ---------------------------------------------------------------------------
  exception_handler:
    file: "backend/app/middleware/exception_handler.py"
    description: "Global exception handler for FastAPI"
    pattern: |
      from fastapi import Request, status
      from fastapi.responses import JSONResponse
      from app.core.exceptions import AppException

      @app.exception_handler(AppException)
      async def app_exception_handler(request: Request, exc: AppException):
          return JSONResponse(
              status_code=exc.status_code,
              content={
                  "detail": exc.detail,
                  "error_code": exc.error_code,
              }
          )

      @app.exception_handler(Exception)
      async def generic_exception_handler(request: Request, exc: Exception):
          logger.error(f"Unhandled exception: {exc}", exc_info=True)
          return JSONResponse(
              status_code=status.HTTP_500_INTERNAL_SERVER_ERROR,
              content={
                  "detail": "Internal server error",
                  "error_code": "INTERNAL_ERROR"
              }
          )

# =============================================================================
# FRONTEND ERROR HANDLING
# =============================================================================

frontend:
  framework: "TypeScript + Fetch API"
  location: "frontend/web/static/js/"

  # ---------------------------------------------------------------------------
  # API Error Handling
  # ---------------------------------------------------------------------------
  api_error_handling:
    description: "Handle API errors with user-friendly messages"
    pattern: |
      interface APIError {
        detail: string;
        error_code?: string;
        field_errors?: Array<{
          field: string;
          message: string;
        }>;
      }

      async function handleAPICall<T>(
        url: string,
        options: RequestInit
      ): Promise<T> {
        try {
          const response = await fetch(url, options);

          if (!response.ok) {
            const errorData: APIError = await response.json();

            // Show user-friendly error
            if (response.status === 401) {
              showToast('error', 'Authentication failed. Please log in again.');
              redirectToLogin();
            } else if (response.status === 403) {
              showToast('error', 'You do not have permission for this action.');
            } else if (response.status === 404) {
              showToast('error', errorData.detail || 'Resource not found.');
            } else if (response.status === 422) {
              // Validation error - show field-specific errors
              if (errorData.field_errors) {
                displayFieldErrors(errorData.field_errors);
              } else {
                showToast('error', errorData.detail || 'Validation failed.');
              }
            } else {
              showToast('error', errorData.detail || 'An error occurred.');
            }

            throw new Error(errorData.detail);
          }

          return await response.json();
        } catch (error) {
          if (error instanceof TypeError) {
            // Network error
            showToast('error', 'Network error. Please check your connection.');
          }
          throw error;
        }
      }

    usage: |
      try {
        const fact = await handleAPICall<BudgetFact>(
          '/api/v1/facts',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(factData)
          }
        );
        showToast('success', 'Transaction created successfully');
      } catch (error) {
        // Error already handled in handleAPICall
        console.error('Failed to create transaction', error);
      }

  # ---------------------------------------------------------------------------
  # Offline Error Handling
  # ---------------------------------------------------------------------------
  offline_error_handling:
    description: "Queue operations when offline"
    pattern: |
      async function createTransactionWithOffline(factData: BudgetFact) {
        if (!navigator.onLine) {
          // Queue for later sync
          await offlineManager.queueOperation({
            type: 'CREATE_FACT',
            data: factData,
            timestamp: Date.now()
          });
          showToast('info', 'Transaction queued. Will sync when online.');
          return;
        }

        try {
          await handleAPICall('/api/v1/facts', {
            method: 'POST',
            body: JSON.stringify(factData)
          });
          showToast('success', 'Transaction created');
        } catch (error) {
          // If network error, queue for later
          if (error instanceof TypeError) {
            await offlineManager.queueOperation({
              type: 'CREATE_FACT',
              data: factData,
              timestamp: Date.now()
            });
            showToast('warning', 'Network error. Transaction queued.');
          }
        }
      }

  # ---------------------------------------------------------------------------
  # WebSocket Error Handling
  # ---------------------------------------------------------------------------
  websocket_error_handling:
    description: "Handle WebSocket connection errors with reconnection"
    pattern: |
      class BudgetWebSocketClient {
        private reconnectAttempts = 0;
        private maxReconnectAttempts = 5;
        private reconnectDelay = 1000;

        connect() {
          this.ws = new WebSocket(this.url);

          this.ws.onerror = (error) => {
            console.error('[WebSocket] Error', error);
            showToast('warning', 'Real-time updates disconnected');
          };

          this.ws.onclose = () => {
            console.log('[WebSocket] Disconnected');

            if (this.reconnectAttempts < this.maxReconnectAttempts) {
              setTimeout(() => {
                this.reconnectAttempts++;
                console.log(`[WebSocket] Reconnecting (${this.reconnectAttempts}/${this.maxReconnectAttempts})`);
                this.connect();
              }, this.reconnectDelay * this.reconnectAttempts);
            } else {
              showToast('error', 'Real-time updates unavailable. Please refresh page.');
            }
          };

          this.ws.onopen = () => {
            console.log('[WebSocket] Connected');
            this.reconnectAttempts = 0;
            if (this.reconnectAttempts > 0) {
              showToast('success', 'Real-time updates reconnected');
            }
          };
        }
      }

# =============================================================================
# LOGGING CONVENTIONS
# =============================================================================

logging:
  backend:
    framework: "Python logging"
    location: "backend/app/"

    levels:
      ERROR: "Unrecoverable errors, exceptions, system failures"
      WARNING: "Recoverable errors, deprecated features, validation failures"
      INFO: "Normal operation, user actions, API calls"
      DEBUG: "Detailed diagnostic information"

    patterns:
      log_exception:
        example: |
          import logging
          logger = logging.getLogger(__name__)

          try:
              result = await perform_operation()
          except DatabaseError as e:
              logger.error(f"Database operation failed: {e}", exc_info=True)
              raise

      log_validation_failure:
        example: |
          logger.warning(f"Validation failed for user {user_id}: {error_detail}")

      log_api_request:
        example: |
          logger.info(f"[API] POST /api/v1/facts by user {user_id}")

    prefixes:
      authentication: "[AUTH]"
      database: "[DB]"
      websocket: "[WS]"
      cache: "[CACHE]"
      api: "[API]"

  frontend:
    framework: "console.log with prefixes"
    location: "frontend/web/static/js/"

    active_prefixes:
      - "[AUTH_EMAIL]"
      - "[AUTH_WEBAUTHN]"
      - "[RECURRING_PLAN]"
      - "[BULK_DELETE]"
      - "[WS_BULK]"
      - "[DEDUP]"
      - "[RTT_FILTER]"

    configuration_file: "frontend/web/static/js/config/logging.js"

    pattern: |
      const LOG_PREFIXES = {
        AUTH_EMAIL: '[AUTH_EMAIL]',
        WEBSOCKET: '[WS]',
        OFFLINE: '[OFFLINE]',
      };

      console.log(`${LOG_PREFIXES.AUTH_EMAIL} User authenticated:`, user);
      console.error(`${LOG_PREFIXES.WEBSOCKET} Connection failed:`, error);

# =============================================================================
# BEST PRACTICES
# =============================================================================

best_practices:
  backend:
    - "Use specific exception types (not generic Exception)"
    - "Provide clear, actionable error messages"
    - "Include error_code for client error handling"
    - "Log exceptions with exc_info=True for stack traces"
    - "Never expose internal implementation details in errors"
    - "Sanitize error messages (no SQL queries, file paths)"

  frontend:
    - "Show user-friendly error messages (not raw API errors)"
    - "Provide actionable guidance (e.g., 'Try again' button)"
    - "Queue operations when offline"
    - "Implement exponential backoff for retries"
    - "Log errors to console for debugging"
    - "Don't block UI on network errors"

  error_messages:
    good_examples:
      - "✅ 'Transaction amount must be positive'"
      - "✅ 'Category not found. Please select a different category.'"
      - "✅ 'Cannot delete category with existing transactions'"

    bad_examples:
      - "❌ 'ValueError: amount <= 0'"
      - "❌ 'SQLAlchemy IntegrityError: constraint violation'"
      - "❌ 'Error code 500 occurred'"

# =============================================================================
# TROUBLESHOOTING
# =============================================================================

troubleshooting:
  error_500_in_production:
    symptom: "User sees 'Internal server error'"
    diagnosis:
      - "Check backend logs for exception stack trace"
      - "Look for unhandled exceptions"
      - "Check database connection status"
    fix:
      - "Add specific exception handler for this error type"
      - "Improve error logging (add context)"

  validation_errors_not_shown:
    symptom: "User doesn't see field errors"
    diagnosis:
      - "Check API response format (422 status + field_errors)"
      - "Check frontend displayFieldErrors() implementation"
    fix:
      - "Ensure backend returns field_errors array"
      - "Verify frontend parses and displays field_errors"

  websocket_keeps_disconnecting:
    symptom: "Real-time updates unreliable"
    diagnosis:
      - "Check backend WebSocket logs"
      - "Check Redis connection (if using Pub/Sub)"
      - "Check network stability"
    fix:
      - "Implement exponential backoff reconnection"
      - "Add heartbeat/ping messages"
      - "Consider Long Polling fallback"

