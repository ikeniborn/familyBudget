# Financial Centers Module
# Bank accounts, wallets, cash, balances

module:
  name: financial_centers
  description: "Управление финансовыми центрами (счета, кошельки, наличные)"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: financial_center_service
      path: "backend/app/services/financial_center_service.py"
      functions:
        - update_financial_center_profile  # SCD Type 1 update
        - create_initial_history
        - get_financial_center_history
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_financial_center"
        - $ref: "../database/history.yaml#/tables/t_d_financial_center_history"

    - name: balance_aggregation_service
      path: "backend/app/services/balance_aggregation_service.py"
      loc: 403
      functions:
        - calculate_monthly_balance
        - get_balance_at_date
        - update_materialized_balances
      depends_on: []
      models:
        - $ref: "../database/support.yaml#/tables/t_agg_financial_center_balance_monthly"
      notes: "Pre-calculated monthly balances for performance"

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/dimensions.yaml#/tables/t_d_financial_center"
    - $ref: "../database/history.yaml#/tables/t_d_financial_center_history"
    - $ref: "../database/support.yaml#/tables/t_agg_financial_center_balance_monthly"
    - $ref: "../database/support.yaml#/tables/t_article_financial_center"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/financial_center.py"
    classes:
      - FinancialCenterCreate
      - FinancialCenterUpdate
      - FinancialCenterResponse
      - FinancialCenterBalance

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/financial-centers.yaml#/routes"

  # ---------------------------------------------------------------------------
  # UI TERMINOLOGY
  # ---------------------------------------------------------------------------
  terminology:
    code: "FinancialCenter"
    ui_russian: "Счет"
    ui_english: "Account"
    table: "t_d_financial_center"
    examples:
      - "Сбербанк (основной)"
      - "Тинькофф Кредитная"
      - "Наличные"
      - "Кошелёк"

  # ---------------------------------------------------------------------------
  # PATTERNS
  # ---------------------------------------------------------------------------
  patterns:
    scd_type_1:
      description: "In-place updates with stable PK"
    history:
      description: "SCD Type 2 in FinancialCenterHistory"
    shared_reference:
      description: "All users can READ, only admins can WRITE"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./transfers.yaml#/module"
    - $ref: "./csv-import.yaml#/module"
    - $ref: "./analytics.yaml#/module"
    - $ref: "../web/templates.yaml#/templates/admin_financial_centers"
    - $ref: "../web/templates.yaml#/templates/index"

  # ---------------------------------------------------------------------------
  # BALANCE CALCULATION
  # ---------------------------------------------------------------------------
  balance_calculation:
    formula: |
      balance = initial_balance
              + SUM(facts WHERE type='income')
              - SUM(facts WHERE type='expense')
              + SUM(transfer_in)
              - SUM(transfer_out)

    materialization:
      table: "t_agg_financial_center_balance_monthly"
      refresh: "On transaction create/update/delete"
      granularity: "Monthly"
