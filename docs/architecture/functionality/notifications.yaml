# Notifications Module
# Push notifications, reminders, broadcast

module:
  name: notifications
  description: "Push уведомления, напоминания, broadcast сообщения"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: notification_service
      path: "backend/app/services/notification_service.py"
      loc: 435
      functions:
        - create_notification
        - get_user_notifications
        - mark_as_read
        - broadcast_notification  # user_id=NULL for all users
      depends_on: []
      models:
        - $ref: "../database/support.yaml#/tables/t_notification"
      notes: "Broadcast support via user_id=NULL"

    - name: reminder_service
      path: "backend/app/services/reminder_service.py"
      loc: 640
      functions:
        - create_reminder
        - get_user_reminders
        - update_reminder
        - delete_reminder
        - process_due_reminders  # Called by scheduler
      depends_on:
        - notification_service
        - push_service
      models:
        - $ref: "../database/support.yaml#/tables/t_scheduled_reminder"
      notes: "APScheduler integration"

    - name: push_service
      path: "backend/app/services/push_service.py"
      loc: 309
      functions:
        - subscribe
        - unsubscribe
        - send_push_notification
        - get_vapid_public_key
      depends_on: []
      models:
        - $ref: "../database/support.yaml#/tables/t_push_subscription"
      notes: "Web Push API (VAPID)"

  # ---------------------------------------------------------------------------
  # VAPID CONFIGURATION
  # ---------------------------------------------------------------------------
  vapid_configuration:
    description: "VAPID keys for Web Push notifications (REQUIRED)"
    installation:
      package: "pywebpush"
      installed_by: "setup.sh (ensure_pywebpush_installed function)"
      auto_install: true
      fallback_method: "--break-system-packages for Debian 12+"
      location: "System Python packages"
    generation:
      script: "setup.sh (generate_vapid_keys function)"
      required: true
      behavior: "setup.sh exits with error if VAPID keys cannot be generated"
      manual_script: "./scripts/generate_vapid_keys.sh --update-env"
    storage:
      file: ".env"
      variables:
        - VAPID_PUBLIC_KEY
        - VAPID_PRIVATE_KEY
        - VAPID_CONTACT_EMAIL
    notes: |
      Keys are generated once per server and shared by all users.
      STRICT MODE: setup.sh will fail if pywebpush cannot be installed or VAPID keys cannot be generated.
      If automatic installation fails, install manually with: sudo pip3 install pywebpush
    compatibility:
      cryptography_versions: ">=41.0.0"
      key_format: |
        Uses X962+UncompressedPoint for public key (not Raw format).
        Raw format is NOT supported for ECDSA (P-256) keys in cryptography 41.x.
      implementation_notes: |
        - Public key: Encoding.X962 + PublicFormat.UncompressedPoint (includes 0x04 prefix)
        - Private key: private_numbers().private_value.to_bytes(32, 'big')
        - Both keys encoded as base64url (no padding)

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/support.yaml#/tables/t_notification"
    - $ref: "../database/support.yaml#/tables/t_scheduled_reminder"
    - $ref: "../database/support.yaml#/tables/t_push_subscription"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/"
    files:
      - notification.py:
          - NotificationCreate
          - NotificationResponse
      - reminder.py:
          - ReminderCreate
          - ReminderUpdate
          - ReminderResponse
      - push.py:
          - PushSubscriptionCreate
          - VapidPublicKeyResponse

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    notifications:
      prefix: "/api/v1/notifications"
      routes:
        - path: "/"
          methods: [GET]
          description: "Get user notifications"
        - path: "/send"
          methods: [POST]
          description: "Send notification (admin)"
        - path: "/{id}/read"
          methods: [POST]
          description: "Mark notification as read"

    reminders:
      prefix: "/api/v1/reminders"
      $ref: "../endpoints/reminders.yaml#/routes"

    push:
      prefix: "/api/v1/push"
      routes:
        - path: "/vapid-key"
          methods: [GET]
          description: "Get VAPID public key"
          auth_required: false  # PUBLIC ENDPOINT
          security_note: |
            VAPID public key is publicly accessible by design (like SSL certificates).
            No authentication required. Only returns public key, never exposes private key.
            Safari iOS requests this endpoint BEFORE user login when granting notification permission.
          implementation: "backend/app/api/v1/endpoints/push.py:54-82"
        - path: "/subscribe"
          methods: [POST]
          description: "Subscribe to push notifications"
          auth_required: true  # PROTECTED ENDPOINT
          security_note: |
            Subscription requires authentication to associate push endpoint with specific user.
            User must be logged in to subscribe.
          implementation: "backend/app/api/v1/endpoints/push.py:85-170"
        - path: "/unsubscribe"
          methods: [POST]
          description: "Unsubscribe from push notifications"
          auth_required: true  # PROTECTED ENDPOINT
          security_note: |
            Unsubscription requires authentication to prevent unauthorized removal of subscriptions.
          implementation: "backend/app/api/v1/endpoints/push.py:173-221"

  # ---------------------------------------------------------------------------
  # NOTIFICATION TYPES
  # ---------------------------------------------------------------------------
  notification_types:
    broadcast:
      description: "Sent to all users (user_id=NULL)"
      examples:
        - "System maintenance announcement"
        - "New feature released"

    personal:
      description: "Sent to specific user"
      examples:
        - "Budget limit exceeded"
        - "Reminder triggered"

  # ---------------------------------------------------------------------------
  # SCHEDULER INTEGRATION
  # ---------------------------------------------------------------------------
  scheduler:
    path: "backend/app/scheduler.py"
    jobs:
      - name: process_reminders
        schedule: "every 1 minute"
        function: "reminder_service.process_due_reminders"

      - name: weekly_report
        schedule: "every Monday at 09:00"
        function: "send_weekly_report"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    page:
      $ref: "../web/templates.yaml#/templates/notifications"
    js_module:
      $ref: "../web/js-modules.yaml#/modules/pushManager"
    service_worker:
      source: "sw.js"  # Root directory
      served_as: "/sw.min.js"  # Minified at deploy
      handles: "push events"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "../web/templates.yaml#/templates/base"
