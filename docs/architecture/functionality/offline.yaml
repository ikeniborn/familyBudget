# Offline Module
# IndexedDB, sync queue, conflict resolution

meta:
  version: "1.0.0"
  description: "Offline mode with IndexedDB storage and sync queue"
  created: "2025-11-01"
  last_updated: "2026-01-21"
  status: "active"
  version_introduced: "4.0.0"
  frontend_only: true
  technologies:
    - "IndexedDB (idb library)"
    - "Service Worker"
    - "Sync queue with retry"
  related_docs:
    - "../pwa.md"
    - "../web/js-modules.yaml#/modules/offlineManager"
    - "../web/js-modules.yaml#/modules/idb"

module:
  name: offline
  description: "Offline режим: IndexedDB, очередь синхронизации, разрешение конфликтов"
  frontend_only: true

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services: []
  # Note: Frontend-only module (no backend services)

  # ---------------------------------------------------------------------------
  # JS MODULES
  # ---------------------------------------------------------------------------
  js_modules:
    - name: offlineManager
      path: "frontend/web/static/js/offline/offlineManager.js"
      loc: 1473
      description: "Main offline mode manager"
      functions:
        - detectOnlineStatus
        - queueOperation
        - syncPendingOperations
        - resolveConflicts
        - createFact
        - createRecurringPlan
        - createTransfer
      internal_helpers:
        - name: _offlineLog
          description: "Debug logging for offline operations (console.log wrapper)"
        - name: _offlineWarn
          description: "Warning logging for offline operations (console.warn wrapper)"
      note: |
        ВАЖНО: Для логирования используйте _offlineLog() и _offlineWarn(),
        НЕ _log() - такой функции не существует.

    - name: idb
      path: "frontend/web/static/js/offline/idb.js"
      loc: 1282
      description: "IndexedDB wrapper"
      functions:
        - openDatabase
        - saveToStore
        - getFromStore
        - deleteFromStore
        - clearStore

    - name: networkDetector
      path: "frontend/web/static/js/offline/networkDetector.js"
      description: "Backend availability monitoring"
      functions:
        - checkBackendConnection
        - dispatchNetworkStatusEvent
      events:
        - "network-status-change"

    - name: conflictResolver
      path: "frontend/web/static/js/offline/conflictResolver.js"
      description: "Sync conflict resolution"
      strategies:
        - "server-wins"
        - "client-wins"
        - "manual-merge"

    - name: offlineShoppingManager
      path: "frontend/web/static/js/offline/offlineShoppingManager.js"
      description: "Shopping list offline operations"
      functions:
        - saveItemLocally
        - syncShoppingItems
        - getLocalItems

  # ---------------------------------------------------------------------------
  # TIMEOUT CONFIGURATION
  # ---------------------------------------------------------------------------
  timeout_configuration:
    description: "Адаптивный timeout для HTTP запросов при создании транзакций"
    location: "offlineManager.js constructor + createFact()"
    behavior:
      first_request_after_load:
        timeout_ms: 8000
        description: "8 секунд для 'холодного' backend после рестарта"
      normal_requests:
        timeout_ms: 3000
        description: "3 секунды для 'прогретого' backend"
      after_successful_request:
        timeout_ms: 2000
        description: "2 секунды после первого успешного запроса"

    reason: |
      После перезапуска backend первые запросы могут занимать больше времени
      из-за инициализации connection pools (PostgreSQL, Redis).
      Увеличенный timeout для первого запроса предотвращает ложные offline fallback.

    implementation:
      variables:
        - "_isFirstRequest: boolean (default: true)"
        - "_firstRequestTimeout: 8000ms"
        - "_normalTimeout: 3000ms"
        - "_optimizedTimeout: 2000ms"
      logic: |
        1. First request: timeout = _firstRequestTimeout (8s)
        2. On success: _isFirstRequest = false, _normalTimeout = _optimizedTimeout
        3. Subsequent: timeout = _normalTimeout (2s)

  # ---------------------------------------------------------------------------
  # BACKEND WARMUP
  # ---------------------------------------------------------------------------
  backend_warmup:
    description: "Прогрев соединений при старте backend"
    location: "backend/app/main.py lifespan function"
    behavior:
      - "Инициализация Redis connection pool"
      - "Тестовый запрос к Redis (cache warmup)"
      - "Гарантия готовности соединений ДО первого user request"

    implementation:
      trigger: "Application startup (lifespan)"
      method: "cache_service.get(CacheKey.quick_stats())"
      fallback: "Warning log if warmup fails (non-critical)"

    reason: |
      При первом запросе к Redis после инициализации происходит
      реальное TCP соединение. Warmup гарантирует что это соединение
      установлено ДО обработки пользовательских запросов.

  # ---------------------------------------------------------------------------
  # NON-BLOCKING CACHE INVALIDATION
  # ---------------------------------------------------------------------------
  non_blocking_invalidation:
    description: "Fire-and-forget инвалидация кеша"
    location: "backend/app/api/v1/endpoints/facts.py"
    endpoints:
      - "POST /api/v1/facts (create_fact)"
      - "PUT /api/v1/facts/{id} (update_fact)"
      - "DELETE /api/v1/facts/{id} (delete_fact)"
      - "POST /api/v1/facts/batch-delete (batch_delete_facts)"

    implementation:
      before: "await cache_service.invalidate_dashboard()"
      after: "asyncio.create_task(cache_service.invalidate_dashboard())"

    reason: |
      HTTP response не должен ждать завершения Redis операций.
      Cache invalidation выполняется в фоне (fire-and-forget).
      TTL=30s гарантирует автоматическую инвалидацию при сбое.

  # ---------------------------------------------------------------------------
  # INDEXEDDB STORES
  # ---------------------------------------------------------------------------
  indexeddb:
    database_name: "FamilyBudgetOffline"
    stores:
      facts:
        description: "Budget transactions"
        key_path: "id"
        indexes:
          - "sync_hash"
          - "fact_date"

      shoppingListItems:
        description: "Shopping list items"
        key_path: "id"
        indexes:
          - "shopping_list_id"
          - "sync_hash"

      syncQueue:
        description: "Pending API calls"
        key_path: "queueId"
        indexes:
          - "timestamp"
          - "operation_type"

  # ---------------------------------------------------------------------------
  # SYNC QUEUE
  # ---------------------------------------------------------------------------
  sync_queue:
    operations:
      - CREATE_FACT
      - UPDATE_FACT
      - DELETE_FACT
      - CREATE_RECURRING_PLAN
      - CREATE_TRANSFER
      - CREATE_SHOPPING_ITEM
      - UPDATE_SHOPPING_ITEM
      - DELETE_SHOPPING_ITEM

    structure:
      queueId: "auto-generated UUID"
      operation_type: "CREATE_FACT | UPDATE_FACT | ..."
      endpoint: "/api/v1/facts"
      method: "POST | PUT | DELETE"
      payload: "JSON data"
      timestamp: "ISO 8601"
      retries: 0
      max_retries: 3

    processing:
      trigger: "network-status-change event (online)"
      order: "FIFO by timestamp"
      retry: "Exponential backoff"

  # ---------------------------------------------------------------------------
  # CONFLICT RESOLUTION
  # ---------------------------------------------------------------------------
  conflict_resolution:
    detection:
      method: "content_hash comparison"
      description: |
        When syncing, compare local content_hash with server content_hash.
        If different → conflict detected.

    strategies:
      server_wins:
        description: "Discard local changes, use server version"
        use_case: "Default for most operations"

      client_wins:
        description: "Overwrite server with local changes"
        use_case: "User explicitly chose to keep local"

      manual_merge:
        description: "Show both versions, user decides"
        use_case: "Complex conflicts"

  # ---------------------------------------------------------------------------
  # DEDUPLICATION
  # ---------------------------------------------------------------------------
  deduplication:
    fields:
      sync_hash:
        description: "MD5 hash for sync deduplication"
        generation: "hash(user_id + article_id + amount + fact_date)"

      content_hash:
        description: "MD5 hash for content comparison"
        generation: "hash(all_fields)"

    backend_handling:
      endpoint: "POST /api/v1/facts"
      check: "IF EXISTS (SELECT 1 WHERE sync_hash = :hash) THEN skip"

  # ---------------------------------------------------------------------------
  # UI INDICATORS
  # ---------------------------------------------------------------------------
  ui_indicators:
    offline_status:
      location: "navbar"
      states:
        - "online (green)"
        - "offline (red)"
        - "syncing (yellow spinner)"

    pending_count:
      location: "navbar badge"
      description: "Number of pending sync operations"

    offline_hidden_elements:
      css_class: "html.offline-mode [data-offline-hidden='true']"
      description: "Elements hidden when offline"

  # ---------------------------------------------------------------------------
  # PENDING RECORDS
  # ---------------------------------------------------------------------------
  pending_records:
    location: "index.html #pending-records-card"
    description: "Pending records awaiting sync"
    features:
      - "Desktop table view"
      - "Mobile list view"
      - "Edit pending facts/plans"
      - "Delete pending records"
      - "Retry failed sync"

    transfer_editing:
      description: "Редактирование pending transfers"
      behavior:
        - "При клике на edit перевод разделяется на 2 независимых факта"
        - "Debit fact (fact_type='debit') создаётся из FROM стороны перевода"
        - "Credit fact (fact_type='credit') создаётся из TO стороны перевода"
        - "Оба факта добавляются в entity store (facts) с хешами для синхронизации"
        - "Оригинальный transfer удаляется из syncQueue и transfers store"
        - "После разделения факты редактируются и синхронизируются независимо"
      ui_changes:
        - "Кнопка редактирования добавлена к обеим строкам перевода (debit/credit)"
        - "Mobile view: tap по строке открывает редактирование"
        - "Tooltip предупреждает о разделении перевода"
      category_types:
        debit: "Списание (FROM сторона) - категории с type='debit'"
        credit: "Пополнение (TO сторона) - категории с type='credit'"
      functions:
        - "splitTransferToFacts(itemId, side)"
        - "handleTransferEditClick(itemId, side)"

  # ---------------------------------------------------------------------------
  # FLOWS
  # ---------------------------------------------------------------------------
  flows:
    offline_sync:
      $ref: "../flows/offline-sync.yaml"

  # ---------------------------------------------------------------------------
  # WRITE-BEHIND INTEGRATION
  # ---------------------------------------------------------------------------
  write_behind_integration:
    description: "Async PostgreSQL writes via Redis queue"
    enabled_by: "WRITE_BEHIND_ENABLED=true"
    benefits:
      - "Lower API latency (~10ms vs ~50ms)"
      - "Pre-generated ID returned immediately"
      - "Complete history tracking (BudgetFactHistory)"
      - "Graceful fallback to sync write"

    flow:
      - step: 1
        action: "Pre-generate fact ID from PostgreSQL sequence"
        function: "get_next_fact_id(session)"

      - step: 2
        action: "Queue write operation to Redis"
        function: "write_behind_service.queue_fact_create()"
        params:
          - "pre_generated_id"
          - "is_offline_sync"
          - "sync_hash"
          - "content_hash"
          - "changed_by_user_id"

      - step: 3
        action: "Return 201 Created with pre-generated ID"
        note: "Response includes _write_behind=true indicator"

      - step: 4
        action: "Background worker processes queue"
        note: "Creates fact AND history record in single transaction"

    offline_sync_support:
      description: "Write-Behind preserves offline sync features"
      deduplication: "sync_hash checked BEFORE queuing (in endpoint)"
      fields_preserved:
        - "is_offline_sync"
        - "sync_hash"
        - "content_hash"
      history_tracking: "CREATE history includes is_offline_sync flag"

    related_files:
      - "backend/app/services/write_behind_service.py"
      - "backend/app/services/id_generator.py"
      - "backend/app/api/v1/endpoints/facts.py"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./shopping-lists.yaml#/module"

  # ---------------------------------------------------------------------------
  # SERVICE WORKER
  # ---------------------------------------------------------------------------
  service_worker:
    source: "sw.js"  # Root directory
    served_as: "/sw.min.js"  # Minified at deploy
    features:
      - "Cache static assets"
      - "Handle push notifications"
      - "Background sync (future)"
    cache_version: "CACHE_VERSION_PLACEHOLDER (replaced at deploy)"
