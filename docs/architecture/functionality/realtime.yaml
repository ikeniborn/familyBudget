# Realtime Module
# SSE events, BudgetConnectionManager

module:
  name: realtime
  description: "Real-time обновления через Server-Sent Events (SSE)"
  critical: true

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services: []
  # Note: In-memory BudgetConnectionManager in endpoint file

  # ---------------------------------------------------------------------------
  # ENDPOINT FILE
  # ---------------------------------------------------------------------------
  endpoint_file:
    name: budget_sse
    path: "backend/app/api/v1/endpoints/budget_sse.py"
    loc: 877
    description: "SSE connection management and broadcasting"

  # ---------------------------------------------------------------------------
  # CONNECTION MANAGER
  # ---------------------------------------------------------------------------
  connection_manager:
    name: "BudgetConnectionManager"
    type: "In-memory"
    description: |
      Manages SSE connections for all connected clients.
      Broadcasts events when data changes.

    methods:
      - name: connect
        description: "Add client to connection pool"
      - name: disconnect
        description: "Remove client from pool"
      - name: broadcast
        description: "Send event to all connected clients"
      - name: get_connection_count
        description: "Get number of connected clients"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/sse.yaml#/routes"

  # ---------------------------------------------------------------------------
  # SSE EVENTS
  # ---------------------------------------------------------------------------
  events:
    fact_created:
      description: "New transaction created"
      payload:
        - id
        - amount
        - article_id
        - fact_date
      triggers_refresh:
        - quick_stats
        - recent_transactions
        - account_balances

    fact_updated:
      description: "Transaction updated"
      payload:
        - id
        - changed_fields
      triggers_refresh:
        - quick_stats
        - recent_transactions

    fact_deleted:
      description: "Transaction deleted"
      payload:
        - id
      triggers_refresh:
        - quick_stats
        - recent_transactions

    transfer_created:
      description: "Transfer between accounts"
      payload:
        - transfer_id
        - from_financial_center_id
        - to_financial_center_id
        - amount
      triggers_refresh:
        - account_balances

    shopping_list_item_created:
      description: "Shopping list item added"
      payload:
        - id
        - shopping_list_id
        - name

    shopping_list_item_updated:
      description: "Shopping list item updated"
      payload:
        - id
        - changed_fields

    shopping_list_item_deleted:
      description: "Shopping list item removed"
      payload:
        - id

    article_created:
      description: "New article created (admin)"
      payload:
        - id
        - name
        - type

    article_updated:
      description: "Article updated (admin)"
      payload:
        - id
        - changed_fields

  # ---------------------------------------------------------------------------
  # CRITICAL CONSTRAINT
  # ---------------------------------------------------------------------------
  critical_constraint:
    name: "Single Worker Requirement"
    description: |
      CRITICAL: Application MUST run with WORKERS=1 (single uvicorn worker).

      The SSE implementation uses in-memory BudgetConnectionManager which does NOT
      share state between workers. Running with multiple workers will cause SSE
      events to be lost.

    reason: |
      Each uvicorn worker has SEPARATE BudgetConnectionManager instance.
      User A on worker 1 creates transaction → broadcast goes only to worker 1 clients.
      User B on worker 2 does NOT receive event → stale UI without page reload.

    configuration:
      - "docker-compose.yml: --workers 1"
      - "setup.sh: WORKERS=1"
      - "Dockerfile: --workers 1"

    scaling_solution: |
      To scale: Implement Redis Pub/Sub to sync events between workers.
      Reference: backend/app/api/v1/endpoints/budget_sse.py:9-11

  # ---------------------------------------------------------------------------
  # MULTI-TAB SUPPORT
  # ---------------------------------------------------------------------------
  multi_tab_support:
    description: |
      Web Locks API + BroadcastChannel для single SSE connection per browser.
      Одно SSE соединение на браузер, события рассылаются по вкладкам через BroadcastChannel.

    leader_election:
      method: "Web Locks API"
      fallback: "Heartbeat-based detection при timeout"
      non_safari_timeout: "100ms (Chrome, Firefox, Edge)"
      safari_timeout: "500-2000ms (iOS и macOS Safari)"
      first_tab_detection: |
        При timeout проверяется lastLeaderHeartbeat.
        Если heartbeat не получен за 5 секунд - это первая вкладка, становимся лидером.

    inter_tab_communication:
      method: "BroadcastChannel API"
      channel: "budget-sse-channel"
      message_types:
        - sse_event: "SSE событие для рассылки follower'ам"
        - heartbeat: "Leader alive signal (каждые 3 сек)"
        - leader_changed: "Смена лидера"
        - status_request: "Запрос статуса от follower"

    safari_macos_handling:
      description: "Специальная обработка для Safari на macOS"
      detection: "_isSafari() - проверяет Safari в User-Agent (исключая Chrome)"
      web_locks_timeout: "500ms (норма) / 2000ms (high connection pressure)"
      connection_reuse: "Проверка EventSource.readyState при visibility change"
      connection_pressure_check: "Проверка /status перед выбором стратегии"
      first_tab_fix: |
        При timeout проверяется lastLeaderHeartbeat.
        Если нет heartbeat за 5 сек - первая вкладка становится лидером.

    safari_ios_handling:
      description: |
        Safari iOS требует полностью отдельной стратегии подключения из-за
        множественных известных проблем с EventSource и Web Locks API.

      known_issues:
        - issue: "EventSource буферизация"
          description: |
            Safari iOS буферизирует SSE ответы до ~2KB перед обработкой.
            Событие onopen НИКОГДА не срабатывает для маленьких ответов.
          reference: "https://github.com/bigskysoftware/htmx/issues/2388"

        - issue: "Web Locks ненадёжны"
          description: |
            Web Locks API на Safari iOS работает непредсказуемо.
            Таймауты могут быть очень большими или lock никогда не срабатывает.
          reference: "Safari/WebKit bug reports"

        - issue: "Cookies и credentials"
          description: |
            EventSource с withCredentials: true может не работать корректно.
            Проблемы с third-party cookie политиками в iOS 17+.

      solution:
        detection: "_detectSafariIOS() - комплексная проверка iOS + Safari"
        strategy: |
          1. Пропуск Web Locks - каждая вкладка создаёт своё соединение
          2. Использование fetch-based SSE вместо EventSource
          3. Прямое подключение без leader election
        connection_method: "fetch() с ReadableStream вместо EventSource"
        multi_tab: "Отключено - каждая вкладка независима"

      implementation:
        file: "frontend/web/static/js/budget/budgetSSEClient.js"
        flag: "_safariIOSMode"
        methods:
          - "_detectSafariIOS() - определение Safari iOS"
          - "_useFetchEventSource() - fetch-based SSE connection"

      timing_fix_2025_12_19:
        issue: "Safari iOS SSE не подключается на page load/navigation"
        symptom: |
          Polling-only подход (Solution 1) не решил проблему.
          SSE всё равно не подключается при загрузке страницы.
        root_cause: |
          Множественные факторы Safari iOS:
          1. window.load event может не срабатывать корректно
          2. document.readyState может застрять в 'interactive'
          3. Network stack требует дополнительного времени для инициализации
        solution: "Dual approach (Solution 2)"
        implementation: |
          Primary path: window.load event listener (fast if works)
          Fallback path: polling readyState после 500ms (safety net if event fails)
          Flag `connected` предотвращает двойное подключение

          Advantage: Redundancy - хотя бы один из путей должен сработать
        code_location: "frontend/web/static/js/budget/budgetSSEClient.js:846-876"
        why_screen_unlock_works: |
          Screen unlock использует независимый код путь:
          visibilitychange → _checkConnectionHealth() → _forceReconnect()
          Не зависит от timing window.load или readyState polling.

    connection_staleness:
      ping_interval: "10 секунд (сервер)"
      staleness_timeout: "45 секунд без ping = stale connection"
      action: "Force reconnect при возврате на вкладку"

  # ---------------------------------------------------------------------------
  # INCREMENTAL UI UPDATES (OPTIMIZATION)
  # ---------------------------------------------------------------------------
  incremental_updates:
    description: |
      Оптимизация обработки SSE событий: вместо полного refresh виджетов
      через HTMX, UI обновляется инкрементально из payload SSE события.

    motivation: |
      БЫЛО: SSE event → refreshDashboard() → 3 HTTP GET запроса
      СТАЛО: SSE event → IncrementalUpdates.onFactCreated(data) → 0 HTTP запросов

      Результат:
      - HTTP запросов при создании факта: 4 → 1 (только POST)
      - Время отклика UI: 200-500ms → <100ms
      - Нагрузка на backend снижена в 3-4 раза

    js_module:
      $ref: "../web/js-modules.yaml#/modules/incrementalUpdates"

    architecture: |
      ┌─────────────────────────────────────────────────────────────────┐
      │                       SSE EVENT FLOW                            │
      └─────────────────────────────────────────────────────────────────┘

      ┌────────────┐     ┌──────────────────┐     ┌───────────────────┐
      │ SSE Event  │────►│ IncrementalUpdates│────►│ Direct DOM Update │
      │ (payload)  │     │ (if cache ready)  │     │ (no HTTP request) │
      └────────────┘     └──────────────────┘     └───────────────────┘
                                │
                                │ (cache miss or complex update)
                                ▼
                         ┌──────────────────┐     ┌───────────────────┐
                         │ HTMXWidgets      │────►│ HTTP GET request  │
                         │ (debounced)      │     │ (fallback)        │
                         └──────────────────┘     └───────────────────┘

    cache_strategy:
      articles: "Загружаются при инициализации: /api/v1/articles?leaf_only=false"
      financial_centers: "Загружаются при инициализации: /api/v1/financial-centers"
      refresh: "При изменении справочных данных (article_created, etc.)"

    page_implementations:
      index_html:
        handlers:
          - "fact_created → IncrementalUpdates.onFactCreated()"
          - "fact_updated → IncrementalUpdates.onFactUpdated()"
          - "fact_deleted → IncrementalUpdates.onFactDeleted()"
          - "plan_*, transfer_* → Аналогично"
        fallback: "HTMXWidgets.refreshWidgetDebounced()"

      facts_html:
        handlers:
          - "fact_* → loadFactsDebounced() (debounce 300ms)"
        note: "Полная загрузка таблицы с пагинацией - инкремент сложен"

      lists_html:
        handlers:
          - "item_* → listsManager.addItemToUI() / updateItemInUI() / removeItemFromUI()"
        note: "Уже использует инкрементальный подход через budgetSSEClient"

    debouncing:
      delay: "300ms"
      purpose: |
        При быстрой последовательности SSE событий (например, bulk import)
        debouncing предотвращает множественные HTTP запросы fallback.

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    js_module:
      $ref: "../web/js-modules.yaml#/modules/budgetSSEClient"

    incremental_updates_module:
      $ref: "../web/js-modules.yaml#/modules/incrementalUpdates"

    ui_indicator:
      location: "navbar"
      description: "SSE connection status badge"
      states:
        connected: "🟢 green - Real-time синхронизация активна"
        connected_via_leader: "🟢 green - Синхронизация через другую вкладку"
        approaching_limit: "⚠️ warning - Много соединений"
        disconnected: "🔴 red - Ошибка соединения"
        reconnecting: "⏳ loading - Переподключение"
        limit_reached: "🔴 red - Превышен лимит"
        offline: "⚫ gray - Offline режим"

  # ---------------------------------------------------------------------------
  # FLOWS
  # ---------------------------------------------------------------------------
  flows:
    sse_broadcast:
      $ref: "../flows/sse-broadcast.yaml"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./shopping-lists.yaml#/module"
    - $ref: "./transfers.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "../web/templates.yaml#/templates/base"
    - $ref: "../web/templates.yaml#/templates/index"
    - $ref: "../web/templates.yaml#/templates/lists"
