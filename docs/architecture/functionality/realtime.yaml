# Realtime Module
# SSE events, BudgetConnectionManager

module:
  name: realtime
  description: "Real-time обновления через Server-Sent Events (SSE)"
  critical: true

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services: []
  # Note: In-memory BudgetConnectionManager in endpoint file

  # ---------------------------------------------------------------------------
  # ENDPOINT FILE
  # ---------------------------------------------------------------------------
  endpoint_file:
    name: budget_sse
    path: "backend/app/api/v1/endpoints/budget_sse.py"
    loc: 877
    description: "SSE connection management and broadcasting"

  # ---------------------------------------------------------------------------
  # CONNECTION MANAGER
  # ---------------------------------------------------------------------------
  connection_manager:
    name: "BudgetConnectionManager"
    type: "In-memory"
    description: |
      Manages SSE connections for all connected clients.
      Broadcasts events when data changes.

    methods:
      - name: connect
        description: "Add client to connection pool"
      - name: disconnect
        description: "Remove client from pool"
      - name: broadcast
        description: "Send event to all connected clients"
      - name: get_connection_count
        description: "Get number of connected clients"

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/sse.yaml#/routes"

  # ---------------------------------------------------------------------------
  # SSE EVENTS
  # ---------------------------------------------------------------------------
  events:
    fact_created:
      description: "New transaction created"
      payload:
        - id
        - amount
        - article_id
        - fact_date
      triggers_refresh:
        - quick_stats
        - recent_transactions
        - account_balances

    fact_updated:
      description: "Transaction updated"
      payload:
        - id
        - changed_fields
      triggers_refresh:
        - quick_stats
        - recent_transactions

    fact_deleted:
      description: "Transaction deleted"
      payload:
        - id
      triggers_refresh:
        - quick_stats
        - recent_transactions

    transfer_created:
      description: "Transfer between accounts"
      payload:
        - transfer_id
        - from_financial_center_id
        - to_financial_center_id
        - amount
      triggers_refresh:
        - account_balances

    shopping_list_item_created:
      description: "Shopping list item added"
      payload:
        - id
        - shopping_list_id
        - name

    shopping_list_item_updated:
      description: "Shopping list item updated"
      payload:
        - id
        - changed_fields

    shopping_list_item_deleted:
      description: "Shopping list item removed"
      payload:
        - id

    article_created:
      description: "New article created (admin)"
      payload:
        - id
        - name
        - type

    article_updated:
      description: "Article updated (admin)"
      payload:
        - id
        - changed_fields

  # ---------------------------------------------------------------------------
  # CRITICAL CONSTRAINT
  # ---------------------------------------------------------------------------
  critical_constraint:
    name: "Single Worker Requirement"
    description: |
      CRITICAL: Application MUST run with WORKERS=1 (single uvicorn worker).

      The SSE implementation uses in-memory BudgetConnectionManager which does NOT
      share state between workers. Running with multiple workers will cause SSE
      events to be lost.

    reason: |
      Each uvicorn worker has SEPARATE BudgetConnectionManager instance.
      User A on worker 1 creates transaction → broadcast goes only to worker 1 clients.
      User B on worker 2 does NOT receive event → stale UI without page reload.

    configuration:
      - "docker-compose.yml: --workers 1"
      - "setup.sh: WORKERS=1"
      - "Dockerfile: --workers 1"

    scaling_solution: |
      To scale: Implement Redis Pub/Sub to sync events between workers.
      Reference: backend/app/api/v1/endpoints/budget_sse.py:9-11

  # ---------------------------------------------------------------------------
  # MULTI-TAB SUPPORT
  # ---------------------------------------------------------------------------
  multi_tab_support:
    description: |
      Web Locks API + BroadcastChannel для single SSE connection per browser.
      Одно SSE соединение на браузер, события рассылаются по вкладкам через BroadcastChannel.

    leader_election:
      method: "Web Locks API"
      fallback: "Timeout-based для Safari iOS"
      desktop_timeout: "100ms"
      safari_ios_timeout: "500-2000ms (на основе connection pressure)"

    inter_tab_communication:
      method: "BroadcastChannel API"
      channel: "budget-sse-channel"
      message_types:
        - sse_event: "SSE событие для рассылки follower'ам"
        - heartbeat: "Leader alive signal (каждые 3 сек)"
        - leader_changed: "Смена лидера"
        - status_request: "Запрос статуса от follower"

    safari_ios_handling:
      description: "Специальная обработка для Safari на iOS устройствах"
      web_locks_timeout: "500ms (норма) / 2000ms (high connection pressure)"
      connection_reuse: "Проверка EventSource.readyState при visibility change"
      connection_pressure_check: "Проверка /status перед выбором стратегии"

    connection_staleness:
      ping_interval: "10 секунд (сервер)"
      staleness_timeout: "45 секунд без ping = stale connection"
      action: "Force reconnect при возврате на вкладку"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    js_module:
      $ref: "../web/js-modules.yaml#/modules/budgetSSEClient"

    ui_indicator:
      location: "navbar"
      description: "SSE connection status badge"
      states:
        connected: "🟢 green - Real-time синхронизация активна"
        connected_via_leader: "🟢 green - Синхронизация через другую вкладку"
        approaching_limit: "⚠️ warning - Много соединений"
        disconnected: "🔴 red - Ошибка соединения"
        reconnecting: "⏳ loading - Переподключение"
        limit_reached: "🔴 red - Превышен лимит"
        offline: "⚫ gray - Offline режим"

  # ---------------------------------------------------------------------------
  # FLOWS
  # ---------------------------------------------------------------------------
  flows:
    sse_broadcast:
      $ref: "../flows/sse-broadcast.yaml"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./shopping-lists.yaml#/module"
    - $ref: "./transfers.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "../web/templates.yaml#/templates/base"
    - $ref: "../web/templates.yaml#/templates/index"
    - $ref: "../web/templates.yaml#/templates/lists"
