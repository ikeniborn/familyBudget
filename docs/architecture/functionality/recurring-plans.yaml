# Recurring Plans Functionality
# Auto-generated recurring payment templates

module:
  name: "Recurring Plans"
  description: |
    Регламентные (регулярные) платежи - шаблоны для автоматической генерации
    BudgetFact записей с заданной периодичностью.

    Архитектура: Гибридная
    - Шаблон (t_d_recurring_plan) хранит параметры повторения
    - При создании сразу генерируются факты на 90 дней вперед
    - Scheduler job ежедневно догенерирует новые записи

  features:
    - "Flexible frequency: daily, weekly, monthly, quarterly"
    - "Duration options: indefinite, by count, or by end date"
    - "Automatic fact generation on creation (90 days ahead)"
    - "Daily scheduler job for ongoing generation"
    - "Traceability via recurring_plan_id in BudgetFact"
    - "UI integration in plan creation modal"

  services:
    - name: RecurringPlanService
      file: "backend/app/services/recurring_plan_service.py"
      description: "Core service for recurring plan management"
      methods:
        - name: create_recurring_plan
          description: |
            Creates recurring plan template and generates initial facts.
            Uses DEFAULT_GENERATION_HORIZON_DAYS (90) for initial generation.
          params:
            - session: AsyncSession
            - user_id: int
            - data: RecurringPlanCreate
          returns: RecurringPlanResponse

        - name: generate_facts_for_plan
          description: |
            Generates BudgetFact records for a recurring plan up to horizon.
            Called by create and scheduler job.
          params:
            - session: AsyncSession
            - plan: RecurringPlan
            - horizon_date: date
          returns: "list[BudgetFact]"

        - name: calculate_next_occurrence
          description: |
            Calculates next occurrence date based on frequency_type and frequency_value.
          params:
            - current_date: date
            - frequency_type: str
            - frequency_value: Optional[int]
          returns: date

        - name: generate_pending_facts
          description: |
            Generates missing facts for all active recurring plans.
            Called by scheduler job.
          params:
            - session: AsyncSession
            - horizon_days: int = 90
          returns: "dict[str, int]"  # {plans_processed, facts_created}

        - name: list_recurring_plans
          description: "List recurring plans with pagination and filters"
          params:
            - session: AsyncSession
            - is_active: Optional[bool]
            - record_type: Optional[str]
            - skip: int
            - limit: int
          returns: RecurringPlanListResponse

        - name: update_recurring_plan
          description: |
            Updates future-affecting fields of a recurring plan.
            Cannot change frequency_type or start_date.
          params:
            - session: AsyncSession
            - recurring_plan_id: int
            - data: RecurringPlanUpdate
          returns: RecurringPlanResponse

        - name: deactivate_recurring_plan
          description: |
            Soft-deletes recurring plan (is_active=False).
            Already generated facts are preserved.
          params:
            - session: AsyncSession
            - recurring_plan_id: int
          returns: None

  scheduler:
    job_name: "generate_recurring_facts"
    schedule: "Daily at 02:00 UTC"
    lock_id: 1007
    file: "backend/app/scheduler.py"
    function: "generate_recurring_facts_job"
    description: |
      Iterates all active recurring plans where next_generation_date <= today
      and generates BudgetFact records up to DEFAULT_GENERATION_HORIZON_DAYS ahead.

      Uses PostgreSQL advisory lock (LOCK_ID=1007) to prevent duplicate
      execution when running with multiple uvicorn workers.

  frequency_types:
    daily:
      description: "Every day"
      frequency_value: "ignored"
      example: "Generates fact every day from start_date"

    weekly:
      description: "Every week on specific day"
      frequency_value: "0-6 (Monday=0, Sunday=6)"
      example: "frequency_value=4 means every Friday"

    monthly:
      description: "Every month on specific day"
      frequency_value: "1-28 (day of month)"
      example: "frequency_value=15 means 15th of each month"
      note: "Days 29-31 not supported for stability"

    quarterly:
      description: "Every 3 months on specific day"
      frequency_value: "1-28 (day of month)"
      example: "frequency_value=1 means 1st day of Jan/Apr/Jul/Oct"

  duration_options:
    indefinite:
      description: "No end limit"
      fields: "end_date=NULL, occurrences_count=NULL"

    by_count:
      description: "Limit by number of occurrences"
      fields: "occurrences_count=N, end_date=NULL"
      example: "occurrences_count=12 means exactly 12 facts generated"

    by_end_date:
      description: "Limit by end date"
      fields: "end_date=DATE, occurrences_count=NULL"
      example: "end_date='2025-12-31' means generate until end of 2025"

  ui_integration:
    modal_plan:
      file: "frontend/web/templates/components/modal_plan.html"
      changes:
        - "Added 'Регулярный платеж' toggle"
        - "Added recurring settings panel (hidden by default)"
        - "Frequency selector (daily/weekly/monthly/quarterly)"
        - "Weekday picker (for weekly)"
        - "Monthday picker (for monthly/quarterly)"
        - "Duration options (indefinite/count/end_date)"
        - "Live preview of recurrence pattern"

    plan_page:
      file: "frontend/web/templates/plan.html"
      changes:
        - "Added filter checkbox for recurring records"
        - "Added filter checkbox for records with reminder"
        - "Added recurring indicator (🔄) in table column"
        - "Added recurring indicator in mobile view"
        - "Modified createPlan() to support recurring plan creation"

  api_endpoints:
    base_path: "/api/v1/recurring-plans"
    file: "backend/app/api/v1/endpoints/recurring_plans.py"
    routes:
      - method: POST
        path: "/"
        description: "Create recurring plan + generate initial facts"

      - method: GET
        path: "/"
        description: "List recurring plans with pagination"

      - method: GET
        path: "/{id}"
        description: "Get recurring plan details"

      - method: PUT
        path: "/{id}"
        description: "Update recurring plan"

      - method: DELETE
        path: "/{id}"
        description: "Deactivate recurring plan"

  facts_api_extensions:
    file: "backend/app/api/v1/endpoints/facts.py"
    new_query_params:
      - name: has_recurring_plan
        type: bool
        description: "Filter by recurring_plan_id IS NOT NULL"

      - name: has_reminder
        type: bool
        description: "Filter by existence in t_scheduled_reminder"

  database:
    tables:
      - $ref: "../database/dimensions.yaml#/tables/t_d_recurring_plan"

    columns_added:
      - table: t_f_budget_fact
        column: recurring_plan_id
        type: INTEGER
        description: "Reference to recurring plan template"
        note: "No FK constraint due to partitioning"

    indexes:
      - $ref: "../database/indexes.yaml#/indexes/idx_rp_user_id"
      - $ref: "../database/indexes.yaml#/indexes/idx_rp_is_active_next_date"
      - $ref: "../database/indexes.yaml#/indexes/idx_bf_recurring_plan_id"

  constants:
    DEFAULT_GENERATION_HORIZON_DAYS: 90
    description: "Number of days ahead to pre-generate facts"

  backward_compatibility:
    breaking_changes: false
    notes:
      - "Nullable recurring_plan_id - existing facts have NULL"
      - "New API endpoints don't affect existing /facts"
      - "Modal toggle hidden by default - existing form works as before"
      - "Filters are optional - default behavior unchanged"
