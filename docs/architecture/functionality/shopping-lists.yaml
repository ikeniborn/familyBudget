# Shopping Lists Module
# Lists, items, offline sync, product groups, stores

module:
  name: shopping_lists
  description: "Списки покупок с поддержкой offline режима"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services:
    - name: shopping_list_service
      path: "backend/app/services/shopping_list_service.py"
      loc: 329
      functions:
        - create_list
        - update_list
        - delete_list
        - get_user_lists
        - get_shopping_lists_with_stats  # Returns lists with item counts (excludes soft-deleted items)
        - get_shopping_list_item_count   # Returns (total, completed) counts (excludes soft-deleted items)
      depends_on: []
      notes: |
        Item count functions exclude soft-deleted items (deleted_at IS NOT NULL).
        Used by landing page cards to show "X / Y выполнено (Z%)".
        Changed in commit 6aa943bf to fix incorrect counts including deleted items.

    - name: shopping_list_item_service
      path: "backend/app/services/shopping_list_item_service.py"
      loc: 493
      functions:
        - create_item
        - update_item
        - delete_items_batch   # Soft delete (sets deleted_at timestamp)
        - sync_batch           # Offline sync
        - get_items_by_list
        - get_pending_sync_items  # Excludes soft-deleted items
      depends_on: []
      notes: |
        Batch operations, offline sync support.
        Uses soft delete pattern: items marked with deleted_at timestamp instead of physical deletion.
        Soft-deleted items preserved for autocomplete history and conflict resolution.
        All queries filter deleted_at IS NULL to exclude soft-deleted items.

    - name: store_service
      path: "backend/app/services/store_service.py"
      functions:
        - create_store
        - update_store
        - get_all_stores
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_store"
        - $ref: "../database/history.yaml#/tables/t_d_store_history"

    - name: product_group_service
      path: "backend/app/services/product_group_service.py"
      loc: 339
      functions:
        - create_product_group
        - update_product_group
        - get_all_product_groups
      depends_on: []
      models:
        - $ref: "../database/dimensions.yaml#/tables/t_d_product_group"
        - $ref: "../database/history.yaml#/tables/t_d_product_group_history"

    - name: product_group_hierarchy_service
      path: "backend/app/services/product_group_hierarchy_service.py"
      loc: 455
      functions:
        - get_subtree
        - get_ancestors
        - get_path
      depends_on: []
      models:
        - $ref: "../database/hierarchy.yaml#/tables/t_d_product_group_hierarchy"
      notes: "Closure Table pattern (same as article hierarchy)"

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/facts.yaml#/tables/t_f_shopping_list"
    - $ref: "../database/facts.yaml#/tables/t_f_shopping_list_item"
    - $ref: "../database/dimensions.yaml#/tables/t_d_store"
    - $ref: "../database/history.yaml#/tables/t_d_store_history"
    - $ref: "../database/dimensions.yaml#/tables/t_d_product_group"
    - $ref: "../database/history.yaml#/tables/t_d_product_group_history"
    - $ref: "../database/hierarchy.yaml#/tables/t_d_product_group_hierarchy"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/"
    files:
      - shopping_list.py:
          - ShoppingListCreate
          - ShoppingListUpdate
          - ShoppingListResponse
      - shopping_list_item.py:
          - ShoppingListItemCreate
          - ShoppingListItemUpdate
          - ShoppingListItemResponse
          - SyncBatchRequest
          - SyncBatchResponse
      - store.py:
          - StoreCreate
          - StoreUpdate
          - StoreResponse
      - product_group.py:
          - ProductGroupCreate
          - ProductGroupUpdate
          - ProductGroupResponse

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/shopping.yaml#/routes"

  # ---------------------------------------------------------------------------
  # OFFLINE SUPPORT
  # ---------------------------------------------------------------------------
  offline_support:
    description: |
      Shopping lists support offline mode with sync queue.

    client_storage:
      type: "IndexedDB"
      js_module:
        $ref: "../web/js-modules.yaml#/modules/offlineShoppingManager"

    sync_mechanism:
      endpoint: "POST /api/v1/shopping-list-items/sync/batch"
      conflict_resolution: "last-write-wins (by timestamp)"
      deduplication: "sync_hash field"

    websocket_events:
      - shopping_list_created
      - shopping_list_updated
      - shopping_list_deleted
      - shopping_list_item_created
      - shopping_list_item_updated
      - shopping_list_item_deleted

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    page:
      $ref: "../web/templates.yaml#/templates/lists"
    js_modules:
      - $ref: "../web/js-modules.yaml#/modules/listsManager"
      - $ref: "../web/js-modules.yaml#/modules/hierarchyView"
      - $ref: "../web/js-modules.yaml#/modules/csvImporter"
      - $ref: "../web/js-modules.yaml#/modules/offlineShoppingManager"

  # ---------------------------------------------------------------------------
  # UI FEATURES
  # ---------------------------------------------------------------------------
  ui_features:
    views:
      table_view:
        description: "Табличное представление списка товаров"
        mobile: "Карточный вид вместо таблицы"
        controls: []  # Перемещены в shared_controls (v6.x)

      hierarchy_view:
        description: "Иерархическое представление по магазинам/группам"
        controls:
          - "Развернуть (⬇️) - развернуть все узлы"
          - "Свернуть (⬆️) - свернуть все узлы"

    shared_controls:
      description: "Кнопки доступные в обоих режимах (table и hierarchy)"
      button_order:
        - delete_completed    # 🗑️ (hidden по умолчанию)
        - mark_all_completed  # ✅
        - unmark_all_completed  # ☐
        - toggle_hide_completed  # 👁️
      buttons:
        delete_completed:
          id: "delete-completed-btn"
          icon: "🗑️"
          text: "Удалить выполненные"
          function: "deleteCompleted()"
          visibility: |
            Скрыта по умолчанию (класс hidden).
            Показывается автоматически когда есть выполненные товары.
            Управляется методом updateDeleteCompletedButton().
          behavior: |
            Удаляет все выполненные товары с подтверждением.
            Использует batch-delete endpoint.

        mark_all_completed:
          icon: "✅"
          text: "Отметить все"
          function: "markAllCompleted()"
          note: "Перемещена из table_view в shared_controls (v6.x)"
          behavior: |
            Отмечает все товары как выполненные.
            Работает в обоих views (table и hierarchy).

        unmark_all_completed:
          icon: "☐"
          text: "Снять все"
          function: "unmarkAllCompleted()"
          note: "Перемещена из table_view в shared_controls (v6.x)"
          behavior: |
            Снимает отметку со всех товаров.
            Работает в обоих views (table и hierarchy).

        toggle_hide_completed:
          id: "toggle-hide-completed-btn"
          icon_inactive: "👁️"
          icon_active: "👁️‍🗨️"
          text_inactive: "Скрыть выполненные"
          text_active: "Показать все"
          function: "toggleHideCompleted()"
          localStorage_key: "lists_hide_completed_preference"
          localStorage_type: "boolean string ('true'|'false')"
          behavior: |
            При нажатии скрывает все выполненные товары.
            Меняет текст и иконку на "Показать все".
            Состояние сохраняется в localStorage (lists_hide_completed_preference).
            При открытии списка восстанавливается из localStorage.
            Паттерн: try/catch для приватного режима браузера.

    responsive_design:
      mobile:
        - "Текст кнопок скрыт (показываются только иконки)"
        - "Карточное представление вместо таблицы"
        - "Тулбар горизонтально скроллится при нехватке места"
      desktop:
        - "Полный текст кнопок виден"
        - "Табличное представление"
        - "Тулбар фиксированной ширины"

  # ---------------------------------------------------------------------------
  # MOBILE COMPATIBILITY
  # ---------------------------------------------------------------------------
  mobile_compatibility:
    ios_safari:
      autocomplete:
        implementation: event_delegation
        reason: "Inline onclick handlers не работают для динамического контента"
        commit: "0eedb351"
        files_changed:
          - "frontend/web/static/js/lists/listsManager.js"
        tested_devices:
          - "iPhone (iOS Safari)"
          - "iPhone (Chrome)"
          - "iPhone (Yandex Browser)"
        related_fixes:
          - commit: "32d78fda"
            description: "Mobile zoom fix (viewport user-scalable=no)"
          - commit: "2cf22f96"
            description: "Modal overflow fix для autocomplete dropdown"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./authentication.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./realtime.yaml#/module"
    - $ref: "./offline.yaml#/module"
