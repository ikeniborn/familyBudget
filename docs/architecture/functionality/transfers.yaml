# Transfers Module
# Inter-account transfers (paired facts)

module:
  name: transfers
  description: "Переводы между финансовыми центрами"

  # ---------------------------------------------------------------------------
  # SERVICES
  # ---------------------------------------------------------------------------
  services: []
  # Note: Transfer logic is in endpoint handlers, not separate service

  # ---------------------------------------------------------------------------
  # MODELS
  # ---------------------------------------------------------------------------
  models:
    - $ref: "../database/facts.yaml#/tables/t_f_budget_fact"
    - $ref: "../database/history.yaml#/tables/t_f_budget_fact_history"

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:
    path: "backend/app/schemas/transfer.py"
    classes:
      - TransferCreate
      - TransferResponse

  # ---------------------------------------------------------------------------
  # ENDPOINTS
  # ---------------------------------------------------------------------------
  endpoints:
    $ref: "../endpoints/transfers.yaml#/routes"

  # ---------------------------------------------------------------------------
  # TRANSFER LOGIC
  # ---------------------------------------------------------------------------
  transfer_logic:
    description: |
      Transfer creates TWO linked BudgetFact records:
      1. Debit from source financial_center (money leaves account)
      2. Credit to destination financial_center (money enters account)

    implementation:
      - "Generate unique transfer_id (UUID)"
      - "Create debit fact (from_financial_center) with article type 'debit'"
      - "Create credit fact (to_financial_center) with article type 'credit'"
      - "Link via transfer_id field"
      - "Both facts have same amount, date, description"

    category_types:
      description: |
        Transfers use special category types (debit/credit) different from
        regular transactions (expense/income):
        - debit: Списание - FROM side, money leaving account
        - credit: Пополнение - TO side, money entering account
      types:
        - "debit (FROM side)"
        - "credit (TO side)"

    fields:
      transfer_id:
        type: "UUID"
        description: "Links paired debit/credit facts"
      record_type:
        values: ["fact", "plan"]
        description: "Actual transfer or planned transfer"

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    modal:
      $ref: "../web/templates.yaml#/components/modal_transfer"
    js_module:
      $ref: "../web/js-modules.yaml#/modules/transfer"

  # ---------------------------------------------------------------------------
  # DEPENDENCIES
  # ---------------------------------------------------------------------------
  depends_on:
    - $ref: "./budget-management.yaml#/module"
    - $ref: "./financial-centers.yaml#/module"

  # ---------------------------------------------------------------------------
  # USED BY
  # ---------------------------------------------------------------------------
  used_by:
    - $ref: "./realtime.yaml#/module"
    - $ref: "./analytics.yaml#/module"
    - $ref: "../web/templates.yaml#/templates/facts"
