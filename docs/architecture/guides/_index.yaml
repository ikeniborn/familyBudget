      - "1. Определить тип изменения (model, service, endpoint, UI)"
      - "2. Найти связанные файлы в соответствующем YAML"
      - "3. Проверить critical paths"
      - "4. Использовать change checklist"
      - "5. Провести impact analysis"

  common_tasks:
    add_field_to_model:
      guide: "./change-checklist.yaml#/checklists/add_model_field"
      files:
        - "Model file"
        - "History model file"
        - "Pydantic schema"
        - "Alembic migration"
        - "Service layer"
        - "Tests"

    add_new_endpoint:
      guide: "./change-checklist.yaml#/checklists/add_endpoint"
      files:
        - "Endpoint file"
        - "Router registration"
        - "Service layer"
        - "Pydantic schemas"
