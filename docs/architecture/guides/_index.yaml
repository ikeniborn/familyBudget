# Guides Index
# Development guides and checklists

summary:
  purpose: |
    Практические руководства для разработки и поддержки
    проекта Family Budget. Содержат чеклисты, критические пути
    и методики анализа влияния изменений.

  guides:
    - name: "Change Checklist"
      file: "./change-checklist.yaml"
      use_case: "Перед внесением изменений в код"

    - name: "Critical Paths"
      file: "./critical-paths.yaml"
      use_case: "Понимание high-impact зависимостей"

    - name: "Impact Analysis"
      file: "./impact-analysis.yaml"
      use_case: "Оценка влияния изменений"

# Quick Reference
