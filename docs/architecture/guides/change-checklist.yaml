# Change Checklists
# Step-by-step guides for common modifications

meta:
  purpose: |
    Чеклисты для безопасного внесения изменений в проект.
    Следуйте пошаговым инструкциям, чтобы ничего не пропустить.

checklists:
  # ===========================================================================
  # ADD MODEL FIELD
  # ===========================================================================
  add_model_field:
    name: "Добавление поля в модель"
    when: "Нужно добавить новое поле в существующую таблицу"

    steps:
      - order: 1
        action: "Обновить SQLModel модель"
        file_pattern: "backend/app/models/{model_name}.py"
        example: |
          class Article(SQLModel, table=True):
              # Существующие поля...
              new_field: Optional[str] = Field(default=None)  # Добавить

      - order: 2
        action: "Обновить History модель (если есть)"
        file_pattern: "backend/app/models/{model_name}_history.py"
        critical: true
        note: |
          ВАЖНО: History таблица ДОЛЖНА содержать ВСЕ поля из основной таблицы.
          Пропуск поля приведет к IntegrityError при создании записей.
        example: |
          class ArticleHistory(SQLModel, table=True):
              # Существующие поля...
              new_field: Optional[str] = None  # Добавить

      - order: 3
        action: "Обновить Pydantic схемы"
        file_pattern: "backend/app/schemas/{model_name}.py"
        sub_steps:
          - "ArticleCreate - если поле при создании"
          - "ArticleUpdate - если поле редактируемое"
          - "ArticleResponse - если поле возвращается"
        example: |
          class ArticleResponse(BaseModel):
              # Существующие поля...
              new_field: Optional[str] = None

      - order: 4
        action: "Создать Alembic миграцию"
        command: "cd backend && alembic revision --autogenerate -m 'add new_field to article'"
        file_pattern: "backend/db/migrations/versions/{timestamp}_*.py"
        verify:
          - "Проверить сгенерированную миграцию"
          - "Убедиться что upgrade() и downgrade() корректны"

      - order: 5
        action: "Обновить сервисный слой"
        file_pattern: "backend/app/services/{model_name}_service.py"
        sub_steps:
          - "create_* - добавить поле в создание"
          - "update_* - добавить поле в обновление"
          - "Обновить логику создания History записей"

      - order: 6
        action: "Обновить тесты"
        file_pattern: "tests/unit/test_{model_name}_service.py"
        sub_steps:
          - "Добавить тесты для нового поля"
          - "Обновить фикстуры если нужно"

      - order: 7
        action: "Запустить тесты"
        command: "pytest tests/unit/test_{model_name}*.py -v"

      - order: 8
        action: "Применить миграцию локально"
        command: "cd backend && alembic upgrade head"

    verification:
      - "Тесты проходят"
      - "API возвращает новое поле"
      - "History записи создаются корректно"

  # ===========================================================================
  # ADD ENDPOINT
  # ===========================================================================
  add_endpoint:
    name: "Добавление нового endpoint"
    when: "Нужно создать новый API endpoint"

    steps:
      - order: 1
        action: "Определить тип endpoint"
        decision:
          rest_api: "backend/app/api/v1/endpoints/"
          web_htmx: "backend/app/api/web/endpoints/"
          admin: "backend/app/api/v1/endpoints/admin/"

      - order: 2
        action: "Создать/обновить endpoint файл"
        file_pattern: "backend/app/api/v1/endpoints/{resource}.py"
        example: |
          from fastapi import APIRouter, Depends
          from app.core.auth import get_current_user

          router = APIRouter()

          @router.get("/{id}")
          async def get_item(
              id: int,
              current_user: User = Depends(get_current_user)
          ):
              # Implementation

      - order: 3
        action: "Зарегистрировать router"
        file: "backend/app/api/v1/router.py"
        example: |
          from app.api.v1.endpoints import new_resource
          api_router.include_router(
              new_resource.router,
              prefix="/new-resource",
              tags=["new-resource"]
          )

      - order: 4
        action: "Создать Pydantic схемы"
        file_pattern: "backend/app/schemas/{resource}.py"
        sub_steps:
          - "Create schema (input)"
          - "Update schema (input)"
          - "Response schema (output)"

      - order: 5
        action: "Создать/обновить сервис"
        file_pattern: "backend/app/services/{resource}_service.py"

      - order: 6
        action: "Добавить тесты"
        file_pattern: "tests/integration/test_{resource}_api.py"

      - order: 7
        action: "Обновить документацию"
        file: "docs/architecture/endpoints/{category}.yaml"

      - order: 8
        action: "Тестирование"
        commands:
          - "pytest tests/integration/test_{resource}*.py -v"
          - "curl -X GET http://localhost:8000/api/v1/new-resource"

    verification:
      - "Endpoint доступен в Swagger (/docs)"
      - "Аутентификация работает"
      - "Validation работает"
      - "Тесты проходят"

  # ===========================================================================
  # DATABASE CHANGE
  # ===========================================================================
  database_change:
    name: "Изменение структуры БД"
    when: "Нужно изменить схему базы данных"

    steps:
      - order: 1
        action: "Обновить SQLModel модели"
        note: "Включая History модели если применимо"

      - order: 2
        action: "Создать миграцию"
        command: "cd backend && alembic revision --autogenerate -m 'description'"

      - order: 3
        action: "ПРОВЕРИТЬ миграцию вручную"
        critical: true
        checks:
          - "Правильные ALTER TABLE команды"
          - "Правильные индексы"
          - "Правильные constraints"
          - "downgrade() корректен"

      - order: 4
        action: "Тест миграции локально"
        commands:
          - "alembic upgrade head"
          - "alembic downgrade -1"
          - "alembic upgrade head"

      - order: 5
        action: "Обновить сервисы если нужно"

      - order: 6
        action: "Обновить документацию"
        files:
          - "docs/architecture/database/*.yaml"

    warnings:
      - "НИКОГДА не удалять колонки без данных backup"
      - "НИКОГДА не менять тип колонки если есть данные"
      - "Добавлять NOT NULL только с DEFAULT значением"

  # ===========================================================================
  # UI CHANGE
  # ===========================================================================
  ui_change:
    name: "Изменение UI компонента"
    when: "Нужно изменить frontend компонент"

    steps:
      - order: 1
        action: "Определить тип изменения"
        types:
          template: "Jinja2 HTML"
          javascript: "JS модуль"
          style: "CSS/Tailwind"

      - order: 2
        action: "Найти связанные файлы"
        reference: "../web/templates.yaml"
        tool: "grep -r 'component_name' frontend/"

      - order: 3
        action: "Изменить template"
        file_pattern: "frontend/web/templates/{template}.html"

      - order: 4
        action: "Изменить JavaScript (если нужно)"
        file_pattern: "frontend/web/static/js/{module}.js"
        post_step: "npm run minify:js"

      - order: 5
        action: "Изменить CSS (если нужно)"
        file_pattern: "frontend/web/static/css/*.css"
        post_step: "npm run build:css"

      - order: 6
        action: "Проверить HTMX интеграцию"
        reference: "../web/htmx-triggers.yaml"

      - order: 7
        action: "Тестирование"
        sub_steps:
          - "Визуальная проверка в браузере"
          - "Проверка в Telegram Web App"
          - "Проверка responsive"
          - "Проверка accessibility"

    verification:
      - "Страница отображается корректно"
      - "HTMX запросы работают"
      - "SSE обновления приходят"
      - "Offline режим работает (если применимо)"

  # ===========================================================================
  # ADD SSE EVENT
  # ===========================================================================
  add_sse_event:
    name: "Добавление SSE события"
    when: "Нужно добавить real-time уведомление"

    steps:
      - order: 1
        action: "Определить триггер события"
        examples:
          - "POST создание записи"
          - "PUT обновление"
          - "DELETE удаление"

      - order: 2
        action: "Добавить broadcast в endpoint"
        file_pattern: "backend/app/api/v1/endpoints/{resource}.py"
        example: |
          await connection_manager.broadcast(
              "resource_created",
              {"id": resource.id, "name": resource.name}
          )

      - order: 3
        action: "Добавить handler в budgetSSEClient.js"
        file: "frontend/web/static/js/budget/budgetSSEClient.js"
        example: |
          case 'resource_created':
              this.handleResourceCreated(data);
              break;

      - order: 4
        action: "Обновить документацию"
        files:
          - "docs/architecture/endpoints/sse.yaml"
          - "docs/architecture/flows/sse-broadcast.yaml"

    critical_note: |
      SSE работает только с WORKERS=1!
      События не доставляются между воркерами.

  # ===========================================================================
  # ADD HISTORY TRACKING
  # ===========================================================================
  add_history_tracking:
    name: "Добавление History tracking к модели"
    when: "Нужно отслеживать историю изменений"

    steps:
      - order: 1
        action: "Создать History модель"
        file_pattern: "backend/app/models/{model}_history.py"
        template: |
          class ModelHistory(SQLModel, table=True):
              __tablename__ = "t_d_{model}_history"

              history_id: int = Field(primary_key=True)
              {model}_id: int = Field(foreign_key="t_d_{model}.id")
              # ВСЕ поля из основной модели
              valid_from: datetime
              valid_to: Optional[datetime] = None
              is_current: bool = True
              change_type: str  # CREATE | UPDATE | DELETE

      - order: 2
        action: "Создать миграцию"
        command: "alembic revision --autogenerate -m 'add {model}_history'"

      - order: 3
        action: "Обновить сервис"
        add_methods:
          - "create_history_record()"
          - "close_current_history()"
          - "get_history()"

      - order: 4
        action: "Интегрировать в CRUD операции"
        operations:
          create: "INSERT history with change_type='CREATE'"
          update: "CLOSE old, INSERT new with change_type='UPDATE'"
          delete: "CLOSE with change_type='DELETE'"

# ===========================================================================
# COMMON MISTAKES
# ===========================================================================
common_mistakes:
  forgot_await:
    description: "Пропущен await для async методов"
    symptom: "RuntimeWarning: coroutine was never awaited"
    fix: "Добавить await перед всеми async вызовами"
    reference: "CLAUDE.md#sqlalchemy-2-asyncsession"

  forgot_history_field:
    description: "Не скопировано поле в History модель"
    symptom: "IntegrityError: null value in column"
    fix: "Скопировать ВСЕ поля из основной модели"
    reference: "CLAUDE.md#history-tables"

  multi_worker_sse:
    description: "SSE с несколькими workers"
    symptom: "События не доходят до части клиентов"
    fix: "WORKERS=1 или Redis Pub/Sub"
    reference: "CLAUDE.md#sse-single-worker-requirement"

  missing_migration:
    description: "Забыли создать миграцию"
    symptom: "Column does not exist"
    fix: "alembic revision --autogenerate"
