# Critical Paths
# High-impact dependencies and sensitive areas

meta:
  purpose: |
    Документация критических путей в системе.
    Изменения в этих областях требуют повышенного внимания
    и тщательного тестирования.

# ===========================================================================
# AUTHENTICATION
# ===========================================================================
authentication:
  criticality: "HIGH"
  description: "Аутентификация и авторизация пользователей"

  critical_components:
    jwt_middleware:
      file: "backend/app/middleware/jwt_middleware.py"
      impact: "ВСЕ защищённые endpoints"
      risk: "Неавторизованный доступ"

    telegram_auth:
      file: "backend/app/utils/telegram_auth.py"
      impact: "Вход в систему"
      risk: "Подделка аутентификации"

    get_current_user:
      file: "backend/app/core/auth.py"
      impact: "Все endpoints с Depends(get_current_user)"
      risk: "Доступ к чужим данным"

  dependency_chain: |
    Request → JWT Middleware → Token Validation → User Lookup → Endpoint

  testing_requirements:
    - "Unit тесты для token validation"
    - "Integration тесты для protected endpoints"
    - "Security тесты для edge cases"
    - "Penetration testing периодически"

# ===========================================================================
# DATABASE
# ===========================================================================
database:
  criticality: "HIGH"
  description: "Схема БД и критические запросы"

  critical_tables:
    t_d_user:
      impact: "ВСЯ система"
      cascades:
        - "t_d_article (CASCADE)"
        - "t_f_budget_fact (CASCADE)"
        - "t_refresh_token (CASCADE)"
        - "ВСЕ данные пользователя"
      warning: "Удаление user удаляет ВСЕ его данные!"

    t_f_budget_fact:
      impact: "Финансовые данные"
      partitioning: "96 партиций по месяцам"
      warning: "Изменения индексов влияют на все партиции"

    t_d_article:
      impact: "Категоризация транзакций"
      hierarchy: "Closure table (t_d_article_hierarchy)"
      constraint: "RESTRICT на удаление если есть facts"

  critical_queries:
    balance_calculation:
      description: "Расчёт баланса по финансовым центрам"
      location: "backend/app/services/financial_center_service.py"
      performance: "Агрегация по всем фактам"
      indexes_used:
        - "idx_bf_financial_center_id"
        - "idx_bf_fact_date"

    hierarchy_traversal:
      description: "Обход иерархии категорий"
      location: "backend/app/services/hierarchy_service.py"
      pattern: "Closure Table"
      indexes_used:
        - "idx_ah_ancestor_id"
        - "idx_ah_descendant_id"

  migration_risks:
    - "ALTER TABLE на больших таблицах (t_f_budget_fact)"
    - "Изменение типа колонки с данными"
    - "Удаление колонок без backup"
    - "Изменение partitioning scheme"

# ===========================================================================
# SSE / REAL-TIME
# ===========================================================================
realtime:
  criticality: "MEDIUM-HIGH"
  description: "Server-Sent Events система"

  single_worker_constraint:
    status: "CRITICAL"
    reason: "In-memory ConnectionManager"
    config: "WORKERS=1 (захардкожено)"
    impact: "Масштабирование ограничено"

  critical_components:
    connection_manager:
      file: "backend/app/api/v1/endpoints/budget_sse.py"
      state: "In-memory Dict[user_id, Set[Queue]]"
      failure_mode: "Worker restart = потеря всех соединений"

    broadcast_points:
      files:
        - "backend/app/api/v1/endpoints/facts.py"
        - "backend/app/api/v1/endpoints/transfers.py"
        - "backend/app/api/v1/endpoints/shopping.py"
      pattern: "await connection_manager.broadcast()"

  frontend_dependency:
    file: "frontend/web/static/js/budget/budgetSSEClient.js"
    reconnect_logic: "Exponential backoff"
    ui_indicator: "Navbar connection status"

  failure_scenarios:
    server_restart: "Все клиенты переподключаются"
    network_issue: "Client-side reconnect"
    worker_crash: "Потеря соединений, требуется reconnect"

# ===========================================================================
# HISTORY / AUDIT
# ===========================================================================
history:
  criticality: "MEDIUM-HIGH"
  description: "Система истории изменений (SCD Type 2)"

  critical_invariants:
    - "Ровно ОДНА запись с is_current=TRUE для каждой entity"
    - "valid_to предыдущей = valid_from текущей"
    - "Все поля из основной таблицы ДОЛЖНЫ быть скопированы"

  implementation_locations:
    budget_fact_history:
      model: "backend/app/models/budget_fact_history.py"
      service: "backend/app/services/fact_service.py"

    article_history:
      model: "backend/app/models/article_history.py"
      service: "backend/app/services/article_service.py"

  common_bugs:
    missing_field:
      symptom: "IntegrityError: null value"
      cause: "Поле не скопировано в history"
      fix: "Добавить поле в history модель и service"

    duplicate_current:
      symptom: "Несколько записей с is_current=TRUE"
      cause: "Не закрыта предыдущая запись"
      fix: "UPDATE is_current=FALSE перед INSERT"

# ===========================================================================
# OFFLINE / SYNC
# ===========================================================================
offline:
  criticality: "MEDIUM"
  description: "Offline режим и синхронизация"

  critical_components:
    offline_manager:
      file: "frontend/web/static/js/budget/offlineManager.js"
      storage: "IndexedDB"
      sync_queue: "FIFO processing"

    service_worker:
      source: "sw.js"  # Root directory
      served_as: "/sw.min.js"  # Minified at deploy
      caching: "Cache first strategy"
      background_sync: "Background Sync API"

  conflict_scenarios:
    edit_conflict:
      description: "Оба пользователя редактируют одно и то же"
      resolution: "Last write wins / User choice"

    delete_conflict:
      description: "Удаление уже удалённой записи"
      resolution: "Idempotent delete"

    stale_data:
      description: "Локальные данные устарели"
      resolution: "Force refresh from server"

# ===========================================================================
# TRANSFERS
# ===========================================================================
transfers:
  criticality: "HIGH"
  description: "Переводы между счетами"

  atomic_invariant: |
    Transfer = EXACTLY 2 BudgetFact records:
    1. transfer_out (amount < 0, from_fc)
    2. transfer_in (amount > 0, to_fc)
    Same transfer_id, SUM(amount) = 0

  critical_files:
    service: "backend/app/services/transfer_service.py"
    endpoint: "backend/app/api/v1/endpoints/transfers.py"

  failure_modes:
    partial_transfer:
      cause: "Ошибка между INSERT первого и второго fact"
      prevention: "Database transaction"
      recovery: "Rollback обоих"

    orphan_transfer:
      cause: "Удалён только один из paired facts"
      prevention: "CASCADE delete по transfer_id"
      detection: "SELECT WHERE transfer_id IS NOT NULL GROUP BY having count != 2"

# ===========================================================================
# DEPENDENCY MAP
# ===========================================================================
dependency_map:
  high_impact_files:
    - file: "backend/app/middleware/jwt_middleware.py"
      affects: "Все protected endpoints"

    - file: "backend/app/core/auth.py"
      affects: "User authentication flow"

    - file: "backend/app/api/v1/endpoints/budget_sse.py"
      affects: "Real-time updates"

    - file: "backend/app/services/transfer_service.py"
      affects: "Financial data integrity"

    - file: "backend/app/models/budget_fact.py"
      affects: "Core financial data"

  cascade_effects:
    user_model_change:
      - "User related endpoints"
      - "JWT token structure"
      - "History tables"
      - "All user-owned data"

    article_model_change:
      - "Budget facts"
      - "Article hierarchy"
      - "Article history"
      - "UI category trees"
      - "Import mapping"

# ===========================================================================
# MONITORING POINTS
# ===========================================================================
monitoring:
  health_checks:
    - path: "/health"
      critical: true
      monitors: "Basic app health"

    - path: "/ready"
      critical: true
      monitors: "Database connectivity"

    - path: "/health/detailed"
      critical: false
      monitors: "Resource usage, connections"

  error_patterns:
    watch_for:
      - "RuntimeWarning: coroutine was never awaited"
      - "IntegrityError"
      - "ConnectionResetError (SSE)"
      - "sqlalchemy.exc.OperationalError"

  performance:
    slow_queries: "> 100ms"
    sse_connections: "Monitor total count"
    memory_usage: "Watch for leaks"
