# Impact Analysis Guide
# How to assess the impact of changes

meta:
  purpose: |
    Методика оценки влияния изменений на систему.
    Используйте перед внесением изменений для понимания
    всех затрагиваемых компонентов.

# ===========================================================================
# METHODOLOGY
# ===========================================================================
methodology:
  overview: |
    Impact Analysis - процесс определения всех компонентов,
    которые будут затронуты изменением. Включает:
    1. Идентификацию точки изменения
    2. Трассировку зависимостей
    3. Оценку риска
    4. Планирование тестирования

  steps:
    1_identify:
      name: "Идентификация точки изменения"
      actions:
        - "Определить файл(ы) для изменения"
        - "Найти файл в docs/architecture/"
        - "Изучить $ref ссылки на связанные компоненты"

    2_trace_dependencies:
      name: "Трассировка зависимостей"
      directions:
        upstream: "Кто вызывает этот компонент?"
        downstream: "Что вызывает этот компонент?"
        lateral: "Какие компоненты используют те же данные?"

    3_assess_risk:
      name: "Оценка риска"
      factors:
        - "Критичность компонента"
        - "Количество зависимых компонентов"
        - "Сложность изменения"
        - "Наличие тестов"

    4_plan_testing:
      name: "Планирование тестирования"
      levels:
        - "Unit тесты для изменённого компонента"
        - "Integration тесты для зависимых компонентов"
        - "E2E тесты для критических путей"

# ===========================================================================
# DEPENDENCY TRACING
# ===========================================================================
dependency_tracing:
  using_architecture_docs:
    description: "Как использовать YAML файлы для трассировки"

    example_model_change:
      scenario: "Изменение модели Article"
      steps:
        - step: "Найти модель в database/dimensions.yaml"
          look_for:
            - "fk_from: какие таблицы ссылаются"
            - "services: какие сервисы используют"
            - "endpoints: какие API endpoints"

        - step: "Проверить history table"
          file: "database/history.yaml#/tables/t_d_article_history"
          action: "Обновить поля если добавлены новые"

        - step: "Проверить hierarchy"
          file: "database/hierarchy.yaml#/tables/t_d_article_hierarchy"
          action: "Проверить влияние на closure table"

        - step: "Найти связанные сервисы"
          file: "functionality/budget-management.yaml"
          look_for:
            - "services: какие функции затронуты"
            - "models: что нужно обновить"

        - step: "Найти затронутые endpoints"
          file: "endpoints/articles.yaml"
          action: "Обновить схемы request/response"

        - step: "Проверить frontend"
          files:
            - "web/templates.yaml"
            - "web/js-modules.yaml"
          action: "Найти компоненты использующие articles"

    example_endpoint_change:
      scenario: "Изменение endpoint /api/v1/facts"
      steps:
        - step: "Найти endpoint в endpoints/facts.yaml"
          look_for:
            - "service: какой сервис вызывается"
            - "models: какие модели затронуты"
            - "htmx_triggers: какие UI компоненты"

        - step: "Проверить WebSocket события"
          file: "endpoints/websocket.yaml"
          look_for: "events связанные с facts"

        - step: "Проверить frontend интеграцию"
          file: "web/htmx-triggers.yaml"
          look_for: "hx-* атрибуты вызывающие этот endpoint"

  using_grep:
    description: "Поиск зависимостей через grep"
    commands:
      find_usages: |
        grep -r "article_service" backend/
        grep -r "ArticleCreate" backend/
        grep -r "/articles" frontend/

      find_imports: |
        grep -r "from app.models.article" backend/
        grep -r "from app.services.article" backend/

      find_tests: |
        grep -r "def test.*article" tests/

# ===========================================================================
# IMPACT MATRICES
# ===========================================================================
impact_matrices:
  model_change:
    description: "Матрица влияния изменений в модели"
    matrix:
      add_nullable_field:
        models: "Низкий (добавить поле)"
        history_models: "Средний (добавить поле)"
        schemas: "Низкий (добавить в response)"
        migrations: "Низкий (ADD COLUMN)"
        services: "Низкий (если не бизнес-логика)"
        endpoints: "Минимальный"
        frontend: "Минимальный"
        tests: "Средний (новые тесты)"

      add_required_field:
        models: "Средний"
        history_models: "Высокий (NOT NULL!)"
        schemas: "Средний (добавить в create/update)"
        migrations: "Средний (DEFAULT или миграция данных)"
        services: "Средний"
        endpoints: "Средний"
        frontend: "Средний (формы)"
        tests: "Высокий"

      change_field_type:
        models: "Высокий"
        history_models: "Высокий"
        schemas: "Высокий"
        migrations: "Очень высокий (миграция данных)"
        services: "Высокий"
        endpoints: "Высокий"
        frontend: "Высокий"
        tests: "Очень высокий"

      remove_field:
        models: "Средний"
        history_models: "Средний"
        schemas: "Средний"
        migrations: "Высокий (потеря данных)"
        services: "Высокий"
        endpoints: "Средний"
        frontend: "Средний"
        tests: "Высокий"

  endpoint_change:
    description: "Матрица влияния изменений в endpoint"
    matrix:
      add_endpoint:
        router: "Низкий"
        service: "Зависит от логики"
        schemas: "Средний"
        auth: "Низкий"
        frontend: "Средний"
        tests: "Средний"

      change_response:
        router: "Низкий"
        service: "Минимальный"
        schemas: "Средний"
        auth: "Минимальный"
        frontend: "Высокий (может сломать)"
        tests: "Высокий"

      change_auth:
        router: "Низкий"
        service: "Минимальный"
        schemas: "Минимальный"
        auth: "Высокий"
        frontend: "Средний"
        tests: "Высокий"

# ===========================================================================
# RISK ASSESSMENT
# ===========================================================================
risk_assessment:
  risk_levels:
    low:
      description: "Минимальное влияние"
      characteristics:
        - "Изолированное изменение"
        - "Не затрагивает критические пути"
        - "Хорошее покрытие тестами"
      testing: "Unit тесты достаточно"

    medium:
      description: "Умеренное влияние"
      characteristics:
        - "Несколько затронутых компонентов"
        - "Не критические данные"
        - "Обратимое изменение"
      testing: "Unit + Integration тесты"

    high:
      description: "Значительное влияние"
      characteristics:
        - "Много зависимых компонентов"
        - "Критические данные"
        - "Сложно откатить"
      testing: "Полный цикл тестирования"

    critical:
      description: "Критическое влияние"
      characteristics:
        - "Затрагивает аутентификацию"
        - "Затрагивает финансовые данные"
        - "Может сломать продакшн"
      testing: "Полный цикл + staging + code review"

  risk_factors:
    data_integrity:
      weight: 3
      examples:
        - "Изменение структуры БД"
        - "Изменение логики расчётов"
        - "Изменение transfers"

    security:
      weight: 3
      examples:
        - "Изменение JWT"
        - "Изменение авторизации"
        - "Изменение валидации"

    user_experience:
      weight: 2
      examples:
        - "Изменение UI"
        - "Изменение API response"
        - "Изменение поведения"

    performance:
      weight: 2
      examples:
        - "Новые запросы к БД"
        - "Изменение индексов"
        - "Изменение кэширования"

# ===========================================================================
# TESTING STRATEGY
# ===========================================================================
testing_strategy:
  by_impact_level:
    low:
      required:
        - "Unit тесты для изменённого кода"
      optional:
        - "Integration тесты если есть"

    medium:
      required:
        - "Unit тесты"
        - "Integration тесты для затронутых endpoints"
      optional:
        - "E2E тесты для основных сценариев"

    high:
      required:
        - "Unit тесты"
        - "Integration тесты"
        - "E2E тесты для критических путей"
      optional:
        - "Performance тесты"
        - "Security тесты"

    critical:
      required:
        - "Все уровни тестов"
        - "Code review"
        - "Staging deployment"
        - "Manual QA"

  test_commands:
    unit: "pytest tests/unit/ -v"
    integration: "pytest tests/integration/ -v"
    e2e: "npx playwright test"
    coverage: "pytest --cov=backend --cov-report=html"

# ===========================================================================
# EXAMPLE ANALYSIS
# ===========================================================================
examples:
  example_1:
    change: "Добавить поле 'priority' в BudgetFact"
    analysis:
      affected_components:
        - "backend/app/models/budget_fact.py"
        - "backend/app/models/budget_fact_history.py"
        - "backend/app/schemas/budget_fact.py"
        - "backend/app/services/fact_service.py"
        - "backend/app/api/v1/endpoints/facts.py"
        - "frontend/web/templates/partials/modal_transaction.html"
        - "Alembic migration"

      risk_level: "MEDIUM"
      reasoning: |
        - Nullable поле = минимальное влияние на существующие данные
        - Требуется обновление History модели
        - Frontend изменения для отображения

      testing_plan:
        - "Unit: test_create_fact_with_priority"
        - "Unit: test_update_fact_priority"
        - "Unit: test_fact_history_includes_priority"
        - "Integration: test_facts_api_priority"
        - "E2E: создание транзакции с priority"

  example_2:
    change: "Изменить JWT expiration с 15min на 30min"
    analysis:
      affected_components:
        - "backend/app/core/auth.py"
        - "backend/app/core/config.py"

      risk_level: "MEDIUM-HIGH"
      reasoning: |
        - Влияет на безопасность сессий
        - Увеличивает окно атаки
        - Может требовать обновления refresh logic

      testing_plan:
        - "Unit: test_jwt_expiration"
        - "Integration: test_token_refresh_flow"
        - "Security: проверка token revocation"

  example_3:
    change: "Добавить WebSocket событие 'article_archived'"
    analysis:
      affected_components:
        - "backend/app/api/v1/endpoints/articles.py"
        - "backend/app/api/v1/endpoints/budget_ws.py"
        - "frontend/web/static/js/budget/budgetWSClient.js"

      risk_level: "LOW"
      reasoning: |
        - Изолированное изменение
        - Не влияет на существующую функциональность
        - Легко тестируется

      testing_plan:
        - "Unit: test_article_archive_broadcasts_ws"
        - "Integration: test_ws_article_archived_event"
        - "Manual: проверка UI обновления"
