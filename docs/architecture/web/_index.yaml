# Web - Frontend Components Index
# Jinja2 templates, JS modules, CSS, HTMX

description: |
  Frontend компоненты проекта Family Budget.
  HTMX + Jinja2 + Tailwind CSS + DaisyUI.

stack:
  template_engine: "Jinja2"
  css_framework: "Tailwind CSS + DaisyUI"
  interactivity: "HTMX"
  js_libraries:
    - "Choices.js (dropdowns)"
    - "ECharts (charts)"
  pwa: true

total_components:
  templates: 16
  js_modules: 15
  css_files: 12

components:
  - name: templates
    file: "./templates.yaml"
    description: "Jinja2 шаблоны (16+)"
    base_path: "frontend/web/templates/"

  - name: js_modules
    file: "./js-modules.yaml"
    description: "JavaScript модули (15+)"
    base_path: "frontend/web/static/js/"

  - name: css
    file: "./css.yaml"
    description: "CSS файлы (Tailwind, DaisyUI, custom)"
    base_path: "frontend/web/static/css/"

  - name: htmx_triggers
    file: "./htmx-triggers.yaml"
    description: "HTMX → API endpoint mappings"

# Directory Structure
directory_structure:
  frontend:
    web:
      templates:
        - "base.html"
        - "index.html"
        - "facts.html"
        - "plan.html"
        - "analytics.html"
        - "lists.html"
        - "notifications.html"
        - "security.html"
        - "login_email.html"
        - "telegram_login.html"
        - "register.html"
        - "admin_*.html (7 files)"
        - "components/*.html (modals)"
        - "partials/*.html (HTMX fragments)"
      static:
        js:
          - "budget/ (budgetWSClient)"
          - "offline/ (offlineManager, idb, etc)"
          - "lists/ (listsManager, hierarchyView)"
          - "transfer.js"
          - "admin-*.js"
        css:
          - "vendor/ (tailwind, choices)"
          - "*.min.css"
        icons: "PWA icons"

    webapp:
      files:
        - "index.html"
        - "add.html"
        - "addplan.html"
        - "edit.html"
        - "list.html"
        - "today.html"
        - "summary.html"
        - "stats.html"
      static:
        js: "api.js, auth.js, storage.js, theme.js, ui.js, validators.js"
        css: "telegram-theme.min.css, app.min.css, forms.min.css"

    shared:
      static:
        js:
          - "budgetShared.js (bundle)"
          - "dateFormatter.js"
          - "calendar-widget.js"
          - "choicesCategoryTree.js"
          - "choicesProductGroupTree.js"
