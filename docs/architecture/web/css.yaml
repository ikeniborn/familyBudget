# CSS Files
# Tailwind CSS + DaisyUI + custom styles

files:
  # ---------------------------------------------------------------------------
  # VENDOR
  # ---------------------------------------------------------------------------
  tailwind_daisyui:
    path: "frontend/web/static/css/vendor/tailwind-daisyui.min.css"
    size: "~60KB minified"
    description: "Tailwind CSS + DaisyUI combined"
    includes:
      - "Tailwind CSS utilities"
      - "DaisyUI components (btn, card, modal, badge, etc.)"
      - "DaisyUI themes (light, dark)"

  choices:
    path: "frontend/web/static/css/vendor/choices.min.css"
    size: "~5KB"
    description: "Choices.js base styles"

  # ---------------------------------------------------------------------------
  # TAILWIND INTEGRATIONS
  # ---------------------------------------------------------------------------
  choices_tailwind:
    path: "frontend/web/static/css/choices-tailwind.min.css"
    size: "~9KB"
    description: "Choices.js Tailwind integration"
    customizes:
      - "Dropdown styling"
      - "Search input"
      - "Selected items"

  # ---------------------------------------------------------------------------
  # WIDGETS
  # ---------------------------------------------------------------------------
  calendar_widget:
    path: "frontend/web/static/css/calendar-widget.min.css"
    size: "~3KB"
    description: "Calendar picker styling"
    features:
      - "Month navigation"
      - "Day grid"
      - "Selected state"
      - "Today highlight"

  # ---------------------------------------------------------------------------
  # PAGE-SPECIFIC
  # ---------------------------------------------------------------------------
  lists:
    path: "frontend/web/static/css/lists.min.css"
    size: "~14KB"
    description: "Shopping lists specific styles"
    features:
      - "Table view"
      - "Hierarchy tree view"
      - "Import UI"

  # ---------------------------------------------------------------------------
  # CUSTOM
  # ---------------------------------------------------------------------------
  custom:
    path: "frontend/web/static/css/custom.min.css"
    size: "~3KB"
    description: "Brand customizations and tweaks"
    includes:
      - "Color overrides"
      - "Font adjustments"
      - "Component tweaks"

  style:
    path: "frontend/web/static/css/style.min.css"
    size: "~12KB"
    description: "Main application styles"
    includes:
      - "Layout adjustments"
      - "Responsive fixes"
      - "Utility classes"

  style_legacy:
    path: "frontend/web/static/css/style.legacy.min.css"
    size: "~12KB"
    description: "Legacy browser compatibility"
    target: "Older browsers without CSS features"

# ---------------------------------------------------------------------------
# TELEGRAM WEB APP CSS
# ---------------------------------------------------------------------------
telegram_webapp:
  telegram_theme:
    path: "frontend/webapp/static/css/telegram-theme.min.css"
    size: "~1.7KB"
    description: "Telegram theme variable integration"
    variables:
      - "--tg-theme-bg-color"
      - "--tg-theme-text-color"
      - "--tg-theme-button-color"
      - "--tg-theme-secondary-bg-color"

  app:
    path: "frontend/webapp/static/css/app.min.css"
    size: "~4KB"
    description: "Web app layout and components"

  forms:
    path: "frontend/webapp/static/css/forms.min.css"
    size: "~4.5KB"
    description: "Form styling"

  shared_components:
    path: "frontend/webapp/static/css/shared-components.min.css"
    size: "~2.5KB"
    description: "Reusable UI components"

  calendar_widget_webapp:
    path: "frontend/webapp/static/css/calendar-widget.min.css"
    size: "~2.4KB"
    description: "Calendar for web app"

  choices_telegram:
    path: "frontend/webapp/static/css/choices-telegram.min.css"
    size: "~5KB"
    description: "Choices.js styled for Telegram theme"

# ---------------------------------------------------------------------------
# KEY CSS CLASSES
# ---------------------------------------------------------------------------
key_classes:
  modals:
    modal_box:
      description: "Modal container"
      styles:
        - "max-height: 90dvh (dynamic viewport height)"
        - "overflow-y: auto"

  offline:
    offline_hidden:
      selector: "html.offline-mode [data-offline-hidden='true']"
      description: "Hide elements when offline"
      styles:
        - "display: none !important"

  toasts:
    alert:
      description: "Toast notifications"
      styles:
        - "max-width: min(90vw, 400px)"
        - "z-index: 99999"

  forms:
    input_bordered:
      description: "Form inputs"
      from: "DaisyUI"

  daisyui_components:
    - btn
    - card
    - badge
    - dropdown
    - modal
    - form-control
    - navbar
    - drawer
    - collapse
    - table
    - tabs
    - alert

# ---------------------------------------------------------------------------
# BUILD PROCESS
# ---------------------------------------------------------------------------
build:
  tailwind:
    config: "tailwind.config.js"
    input: "frontend/web/static/css/style.css"
    output: "frontend/web/static/css/style.min.css"
    commands:
      build: "npm run build:css"
      watch: "npm run watch:css"

  minification:
    tool: "cssnano"
    command: "npm run minify:css"

  validation:
    command: "npm run validate:minified"
