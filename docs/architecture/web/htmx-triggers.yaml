# HTMX Triggers
# Mapping of HTMX attributes to API endpoints

description: |
  HTMX используется для динамической загрузки контента без полной перезагрузки страницы.
  Ниже приведены все HTMX триггеры и их связь с API endpoints.

# ---------------------------------------------------------------------------
# INDEX PAGE
# ---------------------------------------------------------------------------
index_page:
  quick_stats:
    element: "#quick-stats"
    hx-get: "/api/v1/analytics/quick-stats-html"
    hx-trigger: "load"
    hx-swap: "innerHTML"
    template: "partials/quick_stats.html"
    refresh_on:
      - "fact_created (SSE)"
      - "fact_updated (SSE)"
      - "fact_deleted (SSE)"

  account_balances:
    element: "#account-balances"
    hx-get: "/api/v1/analytics/account-balances-html"
    hx-trigger: "load"
    hx-swap: "innerHTML"
    template: "partials/account_balances.html"
    refresh_on:
      - "fact_created (SSE)"
      - "transfer_created (SSE)"

  recent_transactions:
    element: "#recent-transactions"
    hx-get: "/api/v1/facts/recent-html?limit=10"
    hx-trigger: "load"
    hx-swap: "innerHTML"
    template: "partials/recent_transactions.html"
    refresh_on:
      - "fact_created (SSE)"
      - "fact_updated (SSE)"

# ---------------------------------------------------------------------------
# FACTS PAGE
# ---------------------------------------------------------------------------
facts_page:
  facts_table:
    element: "#facts-table"
    hx-get: "/api/v1/facts"
    hx-trigger: "load, filterChanged from:body"
    hx-swap: "innerHTML"
    hx-include: "[name='date_from'], [name='date_to'], [name='article_id'], [name='financial_center_id']"
    parameters:
      - date_from
      - date_to
      - article_id
      - financial_center_id
      - page
      - per_page

  pagination:
    element: ".pagination-link"
    hx-get: "/api/v1/facts"
    hx-trigger: "click"
    hx-target: "#facts-table"
    hx-swap: "innerHTML"

# ---------------------------------------------------------------------------
# ADMIN ARTICLES PAGE
# ---------------------------------------------------------------------------
admin_articles_page:
  articles_list:
    element: "#articles-list"
    hx-get: "/api/v1/admin/articles"
    hx-trigger: "load, statusFilterChanged from:body"
    hx-swap: "innerHTML"
    hx-include: "[name='status']"
    parameters:
      - status: "active | archived | deleted"

  create_article:
    trigger_element: "#create-article-form"
    hx-post: "/api/v1/articles"
    hx-trigger: "submit"
    hx-swap: "none"
    hx-on-success: "closeModal(); htmx.trigger('#articles-list', 'load')"

  archive_article:
    trigger_element: ".archive-btn"
    hx-post: "/api/v1/articles/{id}/archive"
    hx-trigger: "click"
    hx-confirm: "Архивировать категорию?"
    hx-swap: "none"
    hx-on-success: "htmx.trigger('#articles-list', 'load')"

  restore_article:
    trigger_element: ".restore-btn"
    hx-post: "/api/v1/articles/{id}/restore"
    hx-trigger: "click"
    hx-swap: "none"
    hx-on-success: "htmx.trigger('#articles-list', 'load')"

# ---------------------------------------------------------------------------
# ADMIN FINANCIAL CENTERS PAGE
# ---------------------------------------------------------------------------
admin_financial_centers_page:
  list:
    element: "#financial-centers-list"
    hx-get: "/api/v1/admin/financial-centers"
    hx-trigger: "load"
    hx-swap: "innerHTML"

  create:
    trigger_element: "#create-fc-form"
    hx-post: "/api/v1/financial-centers"
    hx-trigger: "submit"
    hx-swap: "none"

  update:
    trigger_element: ".edit-fc-form"
    hx-put: "/api/v1/financial-centers/{id}"
    hx-trigger: "submit"
    hx-swap: "none"

# ---------------------------------------------------------------------------
# ADMIN COST CENTERS PAGE
# ---------------------------------------------------------------------------
admin_cost_centers_page:
  list:
    element: "#cost-centers-list"
    hx-get: "/api/v1/admin/cost-centers"
    hx-trigger: "load"
    hx-swap: "innerHTML"

  create:
    trigger_element: "#create-cc-form"
    hx-post: "/api/v1/cost-centers"
    hx-trigger: "submit"
    hx-swap: "none"

# ---------------------------------------------------------------------------
# ADMIN USERS PAGE
# ---------------------------------------------------------------------------
admin_users_page:
  users_list:
    element: "#users-list"
    hx-get: "/api/v1/users"
    hx-trigger: "load"
    hx-swap: "innerHTML"

  update_role:
    trigger_element: ".role-toggle"
    hx-put: "/api/v1/users/{id}/role"
    hx-trigger: "change"
    hx-swap: "none"

  deactivate_user:
    trigger_element: ".deactivate-btn"
    hx-post: "/api/v1/users/{id}/deactivate"
    hx-trigger: "click"
    hx-confirm: "Деактивировать пользователя?"

# ---------------------------------------------------------------------------
# SHOPPING LISTS PAGE
# ---------------------------------------------------------------------------
lists_page:
  lists:
    element: "#shopping-lists"
    hx-get: "/api/v1/shopping-lists"
    hx-trigger: "load"
    hx-swap: "innerHTML"

  items:
    element: "#shopping-items"
    hx-get: "/api/v1/shopping-list-items?shopping_list_id={id}"
    hx-trigger: "listSelected"
    hx-swap: "innerHTML"

  create_item:
    trigger_element: "#add-item-form"
    hx-post: "/api/v1/shopping-list-items"
    hx-trigger: "submit"
    hx-swap: "none"
    hx-on-success: "htmx.trigger('#shopping-items', 'load')"

# ---------------------------------------------------------------------------
# COMMON PATTERNS
# ---------------------------------------------------------------------------
common_patterns:
  load_on_page_load:
    hx-trigger: "load"
    description: "Load content when page renders"

  load_on_event:
    hx-trigger: "customEvent from:body"
    description: "Load content when custom event dispatched"

  form_submit:
    hx-trigger: "submit"
    description: "Submit form via AJAX"

  click_action:
    hx-trigger: "click"
    description: "Action on button click"

  filter_change:
    hx-trigger: "change"
    hx-include: "[name='filter_field']"
    description: "Reload when filter changes"

# ---------------------------------------------------------------------------
# HTMX EXTENSIONS USED
# ---------------------------------------------------------------------------
extensions:
  - name: "json-enc"
    description: "Send form data as JSON"
    usage: "hx-ext='json-enc'"

  - name: "loading-states"
    description: "Show loading indicators"
    usage: "hx-indicator='#loading'"

# ---------------------------------------------------------------------------
# CUSTOM HEADERS
# ---------------------------------------------------------------------------
custom_headers:
  HX-Request:
    description: "Indicates HTMX request"
    value: "true"

  HX-Trigger:
    description: "Element that triggered request"

  HX-Target:
    description: "Target element ID"

# ---------------------------------------------------------------------------
# RESPONSE HANDLING
# ---------------------------------------------------------------------------
response_handling:
  HX-Trigger_response:
    description: "Server can trigger client events"
    example: "HX-Trigger: showToast"

  HX-Redirect:
    description: "Server-side redirect"
    example: "HX-Redirect: /login"

  HX-Refresh:
    description: "Force page refresh"
    example: "HX-Refresh: true"
