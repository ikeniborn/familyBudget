        - modalManager.ts: "Modal presentation for enrollment"

    exports:
      class: "WebAuthnManager"
      singleton: "window.WebAuthnManager"

    features:
      - "Browser capability detection"
      - "Credential registration (PublicKeyCredential.create)"
      - "Credential authentication (PublicKeyCredential.get)"
      - "Credential management (list, revoke)"
      - "Onboarding flow for first-time setup"
      - "Passkey support detection (backup_eligible)"

    browser_support:
      chrome: "≥67"
      firefox: "≥60"
      safari: "≥13 (iOS 13+)"
      edge: "≥18"

    initialization: |
      // Auto-initialized on pages with WebAuthn support
      import { WebAuthnManager } from './webauthn/WebAuthnManager/index.js';

      const webauthn = new WebAuthnManager();
      await webauthn.checkBrowserSupport();

      // Registration
      await webauthn.register({ deviceName: 'My iPhone' });

      // Authentication
      const result = await webauthn.authenticate();

    endpoints:
      - $ref: "../endpoints/webauthn.yaml#/routes/0"  # register/options
      - $ref: "../endpoints/webauthn.yaml#/routes/1"  # register/verify
      - $ref: "../endpoints/webauthn.yaml#/routes/2"  # authenticate/options
      - $ref: "../endpoints/webauthn.yaml#/routes/3"  # authenticate/verify
      - $ref: "../endpoints/webauthn.yaml#/routes/4"  # credentials GET
      - $ref: "../endpoints/webauthn.yaml#/routes/5"  # credentials DELETE

    notes: |
      Requires HTTPS in production.
      Platform authenticators (TouchID, FaceID) preferred over roaming (YubiKey).
      Sign count validation prevents credential cloning.

