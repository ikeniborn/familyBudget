    purpose: |
      Solves the problem of modal windows being pushed off-screen when virtual
      keyboard opens on mobile devices. Automatically shifts modal to top with
      10px offset from header and scrolls active input into view.
    architecture: "Event-based global handler (zero modification to existing modals)"
    features:
