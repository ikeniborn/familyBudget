      - "Fallback detection via window resize + focus tracking"
      - "Automatic position restoration when keyboard closes"
      - "Input field scrolling into view"
      - "Support for all DaisyUI modals (dialog.modal)"
      - "Edge case handling: multiple modals, orientation change, resize"
      - "iOS safe area support (notch/home indicator)"
