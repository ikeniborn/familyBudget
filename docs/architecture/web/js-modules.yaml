# JavaScript Modules
# Frontend JS module dependencies

modules:
  # ---------------------------------------------------------------------------
  # SHARED BUNDLE
  # ---------------------------------------------------------------------------
  budgetShared:
    path: "frontend/shared/static/js/budgetShared.js"
    minified: "budgetShared.min.js"
    size: "~79KB (unminified), ~25KB (minified gzip)"
    description: "Unified bundle with shared utilities"
    exports:
      - DateFormatter
      - CalendarWidget
      - ChoicesCategoryTree
      - ChoicesProductGroupTree
    usage: |
      // Access via global namespace
      BudgetShared.DateFormatter.formatForAPI(date)
      new BudgetShared.CalendarWidget({inputElement, mode})
      new BudgetShared.ChoicesCategoryTree('#select_id', {type})

  dateFormatter:
    path: "frontend/shared/static/js/dateFormatter.js"
    loc: ~200
    description: "Date formatting utilities"
    functions:
      - formatForAPI: "DD.MM.YYYY → YYYY-MM-DD"
      - formatForDisplay: "YYYY-MM-DD → DD.MM.YYYY"
      - today: "Current date in DD.MM.YYYY"
      - getUTCToday: "Current date in YYYY-MM-DD"
      - getMonthRange: "Get month start/end dates"
      - formatForRussianDisplay: "YYYY-MM-DD → '27 октября 2025'"
    included_in: budgetShared

  calendarWidget:
    path: "frontend/shared/static/js/calendar-widget.js"
    loc: ~310
    description: "Custom date picker widget"
    modes:
      - single: "Pick one date"
      - range: "Pick date range"
    features:
      - "Russian month names"
      - "Keyboard navigation"
      - "Mobile-friendly"
    included_in: budgetShared

  choicesCategoryTree:
    path: "frontend/shared/static/js/choicesCategoryTree.js"
    loc: ~360
    description: "Hierarchical category selector (Choices.js plugin)"
    features:
      - "Filter by type (expense/income)"
      - "Parent indicators in dropdown"
      - "Search within categories"
    depends_on:
      - "Choices.js (vendor)"
    included_in: budgetShared

  choicesProductGroupTree:
    path: "frontend/shared/static/js/choicesProductGroupTree.js"
    description: "Hierarchical product group selector"
    similar_to: choicesCategoryTree
    included_in: budgetShared

  reminders:
    path: "frontend/shared/static/js/reminders.js"
    loc: ~108
    description: "Reminder API client module (shared across index.html and plan.html)"
    exports:
      namespace: "BudgetShared.Reminders"
      functions:
        - createReminder: "POST /api/v1/reminders/{factId}"
        - updateReminder: "PUT /api/v1/reminders/{factId}"
        - deleteReminder: "DELETE /api/v1/reminders/{factId}"
    features:
      - "Prevents code desynchronization between index.html and plan.html"
      - "Consistent error handling and logging"
      - "Graceful degradation on API errors"
    usage: |
      // Create reminder
      const reminder = await BudgetShared.Reminders.createReminder(factId, "2025-12-24T09:00:00");

      // Update reminder
      const updated = await BudgetShared.Reminders.updateReminder(factId, "2025-12-25T10:00:00");

      // Delete reminder
      const deleted = await BudgetShared.Reminders.deleteReminder(factId);
    used_by:
      - "frontend/web/templates/index.html (create/edit plan modals)"
      - "frontend/web/templates/plan.html (create/edit plan modals)"
    depends_on: []
    notes: |
      Extracted from duplicated code to DRY principle.
      Previously createReminder() was duplicated in index.html:4189 and plan.html:4189.
      Now centralized in shared module to prevent desynchronization.

  # ---------------------------------------------------------------------------
  # BUDGET/REALTIME
  # ---------------------------------------------------------------------------
  budgetWSClient:
    path: "frontend/web/static/js/budget/budgetWSClient.js"
    loc: 1200
    description: "WebSocket client for real-time updates with Long Polling fallback and multi-tab support"
    endpoints:
      - path: "/api/v1/budget/ws"
        method: "WebSocket (with JWT token in query param)"
      - path: "/api/v1/budget/poll"
        method: "GET (Long Polling fallback)"
      - path: "/api/v1/budget/status"
        method: "GET"
    events_handled:
      - fact_created
      - fact_updated
      - fact_deleted
      - plan_created
      - plan_updated
      - plan_deleted
      - transfer_created
      - transfer_deleted
      - item_created
      - item_updated
      - item_deleted
      - item_completed
      - article_created
      - article_updated
    ui_updates:
      - "Navbar status indicator badge (7 states)"
      - "HTMX refresh of quick-stats"
      - "HTMX refresh of recent-transactions"
    multi_tab_support:
      leader_election: "Web Locks API + timeout fallback"
      inter_tab_communication: "BroadcastChannel API"
      channel_name: "budget-ws-channel"
      safari_ios_note: "Отключено для Safari iOS - каждая вкладка независима"
    bidirectional:
      description: "WebSocket enables client-to-server messages"
      client_messages:
        - type: "ping"
          purpose: "Client keepalive, server responds with pong"
        - type: "check_online"
          purpose: "Check server availability for offline mode detection"
    long_polling_fallback:
      description: "Comet-style Long Polling when WebSocket fails"
      interval: "10 seconds"
      endpoint: "/api/v1/budget/poll"
    safari_ios_mode:
      description: "Специальный режим для Safari iOS (per-tab connection)"
      detection: "_detectSafariIOS() - комплексная проверка User-Agent"
      connection: "WebSocket (не SSE с буферизацией)"
      multi_tab: "Отключено - Web Locks ненадёжны на iOS"
      flag: "_safariIOSMode - устанавливается при инициализации"
      improvements_over_sse:
        - "Нет буферизации (SSE буферизировал до 2KB)"
        - "Bidirectional communication"
        - "Long Polling fallback"
    key_methods:
      connect: "async - устанавливает WebSocket соединение (только leader)"
      disconnect: "Закрывает соединение и очищает ресурсы"
      _initMultiTab: "async - инициализирует multi-tab support"
      _createWebSocket: "async - создаёт WebSocket соединение"
      _startLongPolling: "async - запускает Long Polling fallback"
      _detectSafariIOS: "Комплексное определение Safari на iOS"
      _isConnectionStale: "Проверяет устаревшее соединение (45s без ping)"
      _updateStatusIndicator: "Обновляет UI badge (7 состояний)"
      _broadcastToFollowers: "Рассылает события follower вкладкам"
      sendPing: "Отправляет ping серверу"
      checkOnline: "Проверяет доступность сервера для offline режима"
    constants:
      HEARTBEAT_INTERVAL: "3000ms - leader heartbeat"
      LEADER_TIMEOUT: "10000ms - follower considers leader dead"
      PING_TIMEOUT: "45000ms - connection staleness detection"
      POLL_INTERVAL: "10000ms - Long Polling interval"
      CLIENT_PING_INTERVAL: "15000ms - client ping interval"
    exports:
      class: "window.BudgetWSClient"
      singleton: "window.budgetWSClient"
    functionality:
      $ref: "../functionality/realtime.yaml#/module"

  # ---------------------------------------------------------------------------
  # OFFLINE
  # ---------------------------------------------------------------------------
  offlineManager:
    path: "frontend/web/static/js/offline/offlineManager.js"
    loc: 1500
    description: "Main offline mode manager"
    endpoints:
      - "/api/v1/users/me"
      - "/api/v1/facts"
      - "/api/v1/transfers"
    depends_on:
      - idb
      - networkDetector
      - conflictResolver
    public_methods:
      getAllUnsyncedItems: "Get all pending + failed items for display"
      updatePendingItemData: "Update data of a pending item in sync queue"
      removePendingItem: "Remove a pending item from sync queue"
      syncQueue: "Sync all pending items"
      clearAll: "Clear all offline data (dangerous)"
    functionality:
      $ref: "../functionality/offline.yaml#/module"

  idb:
    path: "frontend/web/static/js/offline/idb.js"
    loc: 1282
    description: "IndexedDB wrapper"
    stores:
      - facts
      - shoppingListItems
      - syncQueue
    functionality:
      $ref: "../functionality/offline.yaml#/indexeddb"

  networkDetector:
    path: "frontend/web/static/js/offline/networkDetector.js"
    description: "Backend availability monitoring"
    events:
      dispatches: "network-status-change"
    fallback: "Polling when navigator.onLine unreliable"

  conflictResolver:
    path: "frontend/web/static/js/offline/conflictResolver.js"
    description: "Sync conflict resolution"
    strategies:
      - server-wins
      - client-wins
      - manual-merge

  offlineShoppingManager:
    path: "frontend/web/static/js/offline/offlineShoppingManager.js"
    description: "Shopping list offline operations"
    endpoints:
      - "/api/v1/shopping-list-items/sync/batch"
    depends_on:
      - idb
      - networkDetector

  # ---------------------------------------------------------------------------
  # PUSH
  # ---------------------------------------------------------------------------
  pushManager:
    path: "frontend/web/static/js/offline/pushManager.js"
    description: "Web Push notifications manager"
    endpoints:
      - path: "/api/v1/push/vapid-key"
        method: "GET"
      - path: "/api/v1/push/subscribe"
        method: "POST"
      - path: "/api/v1/push/unsubscribe"
        method: "POST"
    browser_api: "PushManager, ServiceWorkerRegistration"

  # ---------------------------------------------------------------------------
  # LISTS
  # ---------------------------------------------------------------------------
  listsManager:
    path: "frontend/web/static/js/lists/listsManager.js"
    loc: 2700
    description: "Shopping lists CRUD and view management"
    endpoints:
      - "/api/v1/shopping-lists"
      - "/api/v1/shopping-list-items"
      - "/api/v1/shopping-list-items/sync/batch"
      - "/api/v1/stores"
      - "/api/v1/product-groups"
    features:
      - "Dual view: table and hierarchy"
      - "Batch operations (via FAB Speed Dial)"
      - "Offline sync"
      - "Hide completed items filter"
      - "FAB Speed Dial for batch actions"
      - "Confirmation dialogs for destructive actions"
      - "Choices.js for store and product group selectors"
    state:
      hideCompleted: "boolean - скрыть выполненные товары"
      searchQuery: "string - поисковый запрос"
      currentView: "string - 'table' или 'hierarchy'"
      choicesInstances:
        store: "Choices.js instance for store selector"
        productGroup: "Choices.js instance for product group selector"
    key_methods:
      toggleHideCompleted: "Переключает фильтр скрытия выполненных"
      updateHideCompletedButton: "Обновляет UI кнопки скрытия (иконка, текст)"
      updateFABVisibility: "Показывает/скрывает FAB Speed Dial при наличии товаров"
      hideFAB: "Скрывает FAB при переходе в landing view"
      filterItemsBySearch: "Фильтрует по поиску И hideCompleted"
      initStoreChoices: "Инициализирует Choices.js для выбора магазина"
      buildStoreChoices: "Строит массив опций для Choices.js (stores)"
      initProductGroupChoices: "Инициализирует Choices.js для выбора группы товаров"
      buildProductGroupChoices: "Строит массив опций для Choices.js (product groups)"
      markAllCompleted: "Отмечает все товары как выполненные"
      unmarkAllCompleted: "Снимает отметки со всех товаров"
      deleteCompleted: "Удаляет выполненные товары"
    global_functions:
      toggleListsFAB: "Открывает/закрывает FAB Speed Dial"
      markAllCompletedWithConfirm: "Отмечает все с подтверждением"
      unmarkAllCompletedWithConfirm: "Снимает отметки с подтверждением"
      deleteCompletedWithConfirm: "Удаляет выполненные с подтверждением"
    depends_on:
      - hierarchyView
      - offlineShoppingManager
      - confirmDialog
      - "Choices.js (vendor)"
    functionality:
      $ref: "../functionality/shopping-lists.yaml#/module"

  hierarchyView:
    path: "frontend/web/static/js/lists/hierarchyView.js"
    description: "Collapsible tree view renderer"
    usage:
      - "Shopping lists hierarchy"
      - "Article hierarchy (admin)"
      - "Product group hierarchy (admin)"

  csvImporter:
    path: "frontend/web/static/js/lists/csvImporter.js"
    loc: 1280
    description: "CSV upload wizard with client-side pagination and filtering"
    endpoints:
      - "/api/v1/shopping-lists/import/analyze"
      - "/api/v1/shopping-lists/import/preview"
      - "/api/v1/shopping-lists/import/execute"
    state:
      previewPagination:
        currentPage: "Current page number (1-based)"
        rowsPerPage: "Rows per page (default: 15)"
        rowsPerPageOptions: "[10, 15, 25, 50, 100]"
      previewFilters:
        store: "Store dropdown filter (exact match)"
        group: "Group dropdown filter (exact match)"
        product: "Product text input (substring search, case-insensitive)"
      allPreviewRows: "All preview rows for client-side processing"
    preview_methods:
      getUniqueFilterValues: "Get unique values for filter dropdowns"
      getFilteredPaginatedRows: "Apply filters and pagination"
      handleFilterChange: "Handle filter dropdown/input changes"
      handleRowsPerPageChange: "Handle page size change"
      handlePageChange: "Handle page navigation"
      clearFilters: "Reset all filters"
      updatePreviewTable: "Re-render table only"
      renderPreviewTableHTML: "Render table with filters and pagination controls"

  googleSheetsImporter:
    path: "frontend/web/static/js/lists/googleSheetsImporter.js"
    description: "Google Sheets integration"
    endpoints:
      - "/api/v1/shopping-lists/google-sheets/fetch"
    error_handling: |
      Properly handles Pydantic validation errors from FastAPI:
      - Array format: error.detail.map(e => e.msg).join(', ')
      - String format: error.detail
      - Object format: JSON.stringify(error.detail)
      - Fallback: HTTP status code

  importManager:
    path: "frontend/web/static/js/lists/importManager.js"
    description: "Import orchestrator (CSV, Google Sheets)"
    depends_on:
      - csvImporter
      - googleSheetsImporter

  # ---------------------------------------------------------------------------
  # TRANSFER
  # ---------------------------------------------------------------------------
  transfer:
    path: "frontend/web/static/js/transfer.js"
    loc: 1227
    description: "Transfer dialog logic"
    endpoints:
      - "/api/v1/transfers"
      - "/api/v1/financial-centers"
      - "/api/v1/analytics/fact-hints"
      - "/api/v1/analytics/plan-hints"
    features:
      - "Fact transfer (immediate)"
      - "Plan transfer (scheduled)"
      - "Hint loading"

  # ---------------------------------------------------------------------------
  # UNIFIED SAVE (inline in index.html)
  # ---------------------------------------------------------------------------
  unifiedSave:
    path: "frontend/web/templates/index.html (inline script)"
    loc: ~50
    description: "Unified save function for modals with online/offline support"
    functions:
      unifiedSave: |
        Main dispatcher for form saves. Chooses between:
        - Online: form.requestSubmit() triggers form's submit handler
        - Offline: calls saveTransactionOffline/savePlanOffline/saveTransferOffline
        Re-enables button after failed validation to allow retry.
      saveTransaction: "Wrapper for transaction modal, disables button then calls unifiedSave"
      savePlan: "Wrapper for plan modal, disables button then calls unifiedSave"
      saveTransfer: "Wrapper for transfer modal, disables button then calls unifiedSave"
    button_state:
      on_click: "Button disabled + loading class added"
      on_validation_fail: "Button re-enabled, loading class removed"
      on_submit_success: "Button reset by form handler's finally block"
    offline_handlers:
      saveTransactionOffline: "Saves transaction to IndexedDB queue"
      savePlanOffline: "Saves plan to IndexedDB queue"
      saveTransferOffline: "Saves transfer to IndexedDB queue"

  # ---------------------------------------------------------------------------
  # ADMIN
  # ---------------------------------------------------------------------------
  adminFactsCommon:
    path: "frontend/web/static/js/admin-facts-common.js"
    description: "Shared logic for facts/plans pages"
    features:
      - "Date range filter"
      - "Pagination"
      - "Column sorting"

  adminStatusFilter:
    path: "frontend/web/static/js/adminStatusFilter.js"
    description: "Status filter UI (active/archived/deleted)"
    usage: "Admin entity pages"

  # ---------------------------------------------------------------------------
  # UTILITIES
  # ---------------------------------------------------------------------------
  htmxWidgets:
    path: "frontend/web/static/js/htmxWidgets.js"
    loc: ~175
    description: "HTMX widget refresh manager with debouncing"
    widgets:
      - quick-stats: "/api/v1/analytics/quick-stats-html"
      - account-balances: "/api/v1/analytics/account-balances-html"
      - recent-transactions: "/api/v1/facts/recent-html?limit=10"
    features:
      - "refreshWidget(id) - immediate refresh"
      - "refreshWidgetDebounced(id) - debounced refresh (300ms)"
      - "refreshAll() / refreshAllDebounced() - refresh all widgets"
      - "Auto-refresh on network recovery"
    debouncing:
      delay: "300ms"
      purpose: "Prevent multiple rapid refreshes from WebSocket events"

  incrementalUpdates:
    path: "frontend/web/static/js/budget/incrementalUpdates.js"
    loc: ~450
    description: "WebSocket-driven incremental UI updates without HTTP requests"
    purpose: |
      Optimizes WebSocket event handling by updating UI directly from event payload
      instead of triggering full HTMX widget refresh.

      Reduces HTTP requests: 4 → 1 per transaction (3-4x improvement)
      Reduces UI latency: 200-500ms → <100ms (instant updates)

    features:
      - "Reference data cache (articles, financial_centers)"
      - "Incremental DOM updates from WebSocket payload"
      - "Fallback to HTMXWidgets when cache unavailable"
      - "Debounced fallback refreshes"

    cache:
      articles: "Map<id, {name, type}>"
      financial_centers: "Map<id, {name}>"
      initialization: "initCache() on DOMContentLoaded"
      refresh: "refreshCache() when reference data changes"

    handlers:
      onFactCreated: "Prepend to recent-transactions, update balances"
      onFactUpdated: "Fallback refresh (complex delta calculation)"
      onFactDeleted: "Remove from list, fallback refresh stats"
      onPlanCreated: "Fallback refresh quick-stats"
      onTransferCreated: "Fallback refresh balances"

    fallback_mechanism: |
      When incremental update not possible (missing cache data, complex updates):
      1. Cancel incremental update
      2. Call HTMXWidgets.refreshWidgetDebounced(widgetId)
      3. Debouncing prevents multiple rapid refreshes

    integration:
      loaded_in: "base.html (after budgetWSClient.js)"
      initialized_by: "DOMContentLoaded event"
      used_by:
        - "index.html WebSocket handlers"
        - "facts.html (debounced only, complex table)"

  confirmDialog:
    path: "frontend/web/static/js/confirmDialog.js"
    description: "Confirmation modal manager"
    usage: "Delete/archive operations"

  navigationProgress:
    path: "frontend/web/static/js/navigationProgress.js"
    minified: "navigationProgress.min.js"
    version: "3.0.0"
    loc: ~430
    description: "Pre-fetch + Overlay navigation with progress bar"
    features:
      - "Intercepts internal link clicks"
      - "Shows real progress bar under navbar (fetch + ReadableStream)"
      - "Falls back to animated progress if Content-Length unknown"
      - "Minimum 1 second progress display for better UX"
      - "Shows overlay at 100% to hide DOM cleanup (no black/white screen)"
      - "Handles Gzip/Brotli responses gracefully"
      - "Closes mobile menu before navigation"
      - "Handles bfcache (back/forward navigation via pageshow)"
    public_methods:
      init: "Initialize navigation interceptor"
      navigateTo: "Programmatic navigation with progress"
      cancel: "Cancel current navigation"
      shouldIntercept: "Check if link should be intercepted"
      showOverlay: "Show transition overlay"
      hideOverlay: "Hide transition overlay"
    css_classes:
      navigation-progress: "Progress bar container (top: 4rem on all breakpoints)"
      navigation-overlay: "Transition overlay container"
      active: "Progress bar/overlay visible"
      complete: "Progress bar at 100%, fading out"
    exclusions:
      - "External links (different origin)"
      - "Hash links (#...)"
      - "Download links (download attr)"
      - "New window links (target=_blank)"
      - "data-no-progress attribute"
      - "HTMX links (hx-get, hx-post, hx-boost)"
      - "Links inside modals (dialog, .modal)"
    integration:
      - "Works with budgetWSClient (keeps connection)"
      - "Works with Service Worker HTTP cache"
    exports:
      singleton: "window.NavigationProgress"
    config:
      minDisplayTime: "1000ms (minimum progress display)"
      overlayDelay: "50ms (delay before navigation)"
      timeout: "30000ms (max fetch timeout)"

# ---------------------------------------------------------------------------
# VENDOR LIBRARIES
