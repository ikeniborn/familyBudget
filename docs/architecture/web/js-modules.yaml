      _onViewportResize: "Detect keyboard state changes"
      _setupModalObserver: "Watch for modal open/close"
      _onModalOpen: "Store active modal reference"
      _onModalClose: "Clear active modal state"
      _onKeyboardOpen: "Apply keyboard position + scroll input into view"
      _onKeyboardClose: "Restore original position"
      _applyKeyboardPosition: "Add CSS class, remove my-auto conflict"
      _scrollActiveInputIntoView: "Scroll focused input visible (350ms delay)"
      _restoreOriginalPosition: "Remove CSS class, restore my-auto"
      _updateCSSVariables: "Set --header-height, --viewport-height"
    class_conflict_resolution:
      problem: "Tailwind my-auto class (margin-top/bottom: auto) conflicts with calculated margins"
      solution: "Remove my-auto when applying keyboard position, restore when closing"
      implementation: |
        _applyKeyboardPosition():
          this._modalBox.classList.remove('my-auto')
