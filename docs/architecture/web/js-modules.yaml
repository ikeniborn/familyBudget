    depends_on:
      - "Logger class (window.logModalKB)"
      - "LOGGING_CONFIG.modules.MODAL_KB"
    integration:
      script_import: "base.html (after logger.js)"
      initialization: "Automatic on module load"
      manual_intervention: "None required (event-based)"
    documentation:
      architecture: "/docs/architecture/frontend/modal-keyboard-adaptation.md"
      test_cases: "TC1-TC5 (keyboard open/close, scroll, orientation, multiple modals, rapid focus)"
      troubleshooting: "Remote debugging via iOS Safari, Android Chrome DevTools"

