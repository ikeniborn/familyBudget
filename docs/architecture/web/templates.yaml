# Web Templates
# Jinja2 templates hierarchy

templates:
  # ---------------------------------------------------------------------------
  # BASE TEMPLATE
  # ---------------------------------------------------------------------------
  base:
    path: "frontend/web/templates/base.html"
    type: "layout"
    description: "Master template - navbar, sidebar, toast, offline indicator"
    children:
      - index
      - facts
      - plan
      - analytics
      - lists
      - notifications
      - security
      - login_email
      - telegram_login
      - register
      - admin_dashboard
      - admin_users
      - admin_articles
      - admin_financial_centers
      - admin_cost_centers
      - admin_stores
      - admin_product_groups
      - admin_monitoring

    includes:
      js_modules:
        - $ref: "./js-modules.yaml#/modules/budgetWSClient"
        - $ref: "./js-modules.yaml#/modules/offlineManager"
        - $ref: "./js-modules.yaml#/modules/pushManager"
        - $ref: "./js-modules.yaml#/modules/networkDetector"
        - $ref: "./js-modules.yaml#/modules/navigationProgress"
      css:
        - $ref: "./css.yaml#/files/tailwind_daisyui"
        - $ref: "./css.yaml#/files/custom"
        - $ref: "./css.yaml#/files/style"

    features:
      - "PWA splash screen (first launch only, standalone mode)"
      - "Navigation progress bar (real loading progress 0-100%)"
      - "Responsive navbar (desktop horizontal, mobile dropdown)"
      - "User profile dropdown"
      - "Theme toggle (light/dark)"
      - "WebSocket status indicator"
      - "Offline status indicator"
      - "Toast notification system (modal-aware)"
      - "Cookie consent banner"
      - "Push notification banner"
      - "Service Worker registration"

    pwa_splash_screen:
      id: "pwa-splash"
      description: "Welcome screen for PWA with centered app icon (no loader)"
      behavior:
        - "iOS: Native splash image via apple-touch-startup-image (instant)"
        - "Android: Native splash from manifest.json (instant)"
        - "HTML splash provides smooth transition after native splash"
        - "Only shown in standalone mode (not in regular browser)"
        - "Only shown on FIRST EVER PWA launch (not on F5, not on navigation)"
        - "Uses localStorage (permanent) to track first launch"
        - "F5/reload detected via Performance API (navigation.type === 'reload')"
        - "Smooth fade-out transition (300ms)"
        - "Removed from DOM after transition"
      localStorage_key: "pwa_first_launch_completed"
      ios_splash_images:
        directory: "frontend/web/static/icons/splash/"
        generated_by: "scripts/generate_pwa_icons.sh"
        sizes:
          - "750x1334 (iPhone 7/8/SE)"
          - "1242x2208 (iPhone 7+/8+)"
          - "1125x2436 (iPhone X/XS/11 Pro)"
          - "828x1792 (iPhone XR/11)"
          - "1242x2688 (iPhone XS Max/11 Pro Max)"
          - "1080x2340 (iPhone 12 mini/13 mini)"
          - "1170x2532 (iPhone 12-14)"
          - "1284x2778 (iPhone 12-14 Pro Max)"
          - "1179x2556 (iPhone 14/15 Pro)"
          - "1290x2796 (iPhone 14/15 Pro Max)"
      css:
        main_css: "tailwind-daisyui.min.css (blocking - deferred caused FOUC)"
        splash_css: "inline in <head> for immediate render"
        features:
          - "Full-screen fixed overlay (z-index: 99999)"
          - "Gradient background with light/dark mode fallbacks"
          - "Icon with bounce animation (no loader)"
          - "Reduced motion support (prefers-reduced-motion)"
      js:
        location: "inline immediately after splash HTML element"
        min_display_time: "2000ms (first launch only)"
        pwa_detection: "display-mode: standalone OR navigator.standalone"
        reload_detection: "performance.getEntriesByType('navigation')[0]?.type === 'reload'"
        logic: "First ever launch: 2s + load. F5/reload or repeat launch: no splash (removed immediately)"

    navigation_progress_bar:
      id: "navigation-progress"
      description: "Thin green progress bar under navbar showing real page loading progress"
      position: "Fixed below navbar (top: 4rem desktop, 3.5rem mobile)"
      color: "oklch(var(--su)) - DaisyUI success (green)"
      height: "3px"
      z_index: 39
      js_module: "navigationProgress.js"
      behavior:
        - "Intercepts internal link clicks"
        - "Shows real progress via fetch ReadableStream (0-100%)"
        - "Falls back to animated progress if Content-Length unknown"
        - "Stays on current page until 100% loaded"
        - "Replaces page content, updates URL, scrolls to top"
        - "Reinitializes HTMX and widgets after navigation"
      exclusions:
        - "External links (different origin)"
        - "Hash links (#anchor)"
        - "Download links"
        - "target='_blank' links"
        - "data-no-progress attribute"
        - "HTMX links (hx-get, hx-post, hx-boost)"
        - "Links inside modals/dialogs"
      css_classes:
        active: "Progress bar visible and animating"
        complete: "Fade out after reaching 100%"

    mobile_menu:
      id: "mobile-menu-dropdown"
      description: "Hamburger menu for mobile devices (< 1024px)"
      visible_items:
        always:
          - "User info (avatar, name)"
          - "🏠 Главная"
          - "📊 Аналитика"
          - "💸 Факт"
          - "📋 План"
          - "🛒 Списки"
          - "🔐 Безопасность"
          - "Справочники (section title)"
          - "🏪 Магазины"
          - "📦 Группы товаров"
          - "🚪 Выйти"
        tablets_only:
          description: "Visible on tablets and larger (hidden md:block, ≥768px)"
          items:
            - "📂 Прочее (section title)"
            - "🔔 Уведомления"
            - "📥 Импорт"
            - "📁 Категории"
            - "💼 Места затрат"
            - "🏢 Счета"
            - "👥 Пользователи (admin only)"
      note: "Stores and Product Groups are visible on all screen sizes; other admin pages are tablet+ only"

    toast_system:
      description: "Toast notifications that work inside modals"
      behavior:
        - "When no dialog is open: toast appears in main #toast-container (z-[99999])"
        - "When dialog is open: toast appears INSIDE the dialog's modal-box (.dialog-toast-container)"
        - "This is necessary because HTML5 <dialog> creates 'top layer' above all z-index"
      functions:
        - showToast: "Standard toast with auto-dismiss"
        - showToastWithAction: "Toast with action button"
      classes:
        main_container: "fixed top-[4.5rem] left-1/2 -translate-x-1/2 z-[99999]"
        dialog_container: "dialog-toast-container fixed top-4 left-1/2 -translate-x-1/2 z-50"

  # ---------------------------------------------------------------------------
  # PAGE TEMPLATES
  # ---------------------------------------------------------------------------
  index:
    path: "frontend/web/templates/index.html"
    extends: base
    description: "Home dashboard with quick stats, balances, recent transactions"
    partials:
      - quick_stats
      - account_balances
      - recent_transactions
    modals:
      - modal_transaction
      - modal_plan
      - modal_transfer
      - modal_edit_plan  # Used for editing both facts and plans from dashboard
    api_calls:
      - endpoint: "/api/v1/analytics/quick-stats-html"
        trigger: "load"
        target: "#quick-stats"
      - endpoint: "/api/v1/analytics/account-balances-html"
        trigger: "load"
        target: "#account-balances"
      - endpoint: "/api/v1/facts/recent-html?limit=10"
        trigger: "load"
        target: "#recent-transactions"

    # Mobile Quick Actions (added 2025-12-19)
    responsive_components:
      quick_actions:
        mobile_pattern: "Mini Cards Row"
        mobile_breakpoint: "< 768px (md)"
        mobile_layout:
          type: "4-column grid"
          height: "~80px"
          priority_buttons:
            - name: "Факт"
              action: "openAddTransactionModal()"
              color: "bg-success"
            - name: "Перевод"
              action: "openFactTransferModal()"
              color: "bg-warning"
            - name: "Списки"
              action: "href: /lists"
              color: "bg-accent"
          dropdown_button:
            name: "Ещё"
            items:
              - "План: Расход/Доход"
              - "План: Перевод"
              - "Аналитика"
        desktop_layout:
          type: "3-column grouped cards"
          groups:
            - "Факты (Расход/Доход, Перевод)"
            - "Планы (Расход/Доход, Перевод)"
            - "Прочее (Аналитика, Списки)"
        design_rationale: |
          Mobile layout optimized for one-handed use:
          - Priority actions (Факт, Списки) accessible in 1 tap
          - Secondary actions (План, Аналитика) behind dropdown
          - Compact ~80px height vs ~350px original
          - Design variants tested: tmp/quick/variant-*.html

    # Collapsible Sections (added 2025-12-19)
    collapsible_sections:
      quick_stats:
        mobile_breakpoint: "< 768px (md)"
        collapsed_view: "2 cards (Доходы, Расходы)"
        expanded_view: "4 cards (Доходы, Расходы, Пополнение, Списание)"
        toggle_trigger: "tap on section header"
        persist_state: false
        initial_state: "collapsed"
        js_functions:
          - "toggleQuickStats()"
          - "applyQuickStatsState()"

      account_balances:
        mobile_breakpoint: "< 768px (md)"
        collapsed_view: "Top 2 accounts by month movement"
        expanded_view: "All accounts"
        toggle_trigger: "tap on section header"
        persist_state: false
        initial_state: "collapsed"
        sort_criteria: "data-movement attribute (abs(current_balance - opening_balance), descending)"
        edge_cases:
          - "If ≤2 accounts: indicator hidden, all accounts visible"
        js_functions:
          - "toggleAccountBalances()"
          - "applyAccountBalancesState()"

      shared_handlers:
        - "htmx:afterSwap → applies state after HTMX loads content"
        - "window.resize (debounced 100ms) → reapplies state on screen rotation"

      indicator_component:
        selector: ".expand-indicator"
        css_location: "frontend/web/templates/index.html:362-381 (inline style)"
        variants_demo: "tmp/labels/expand-indicators.html"
        description: "10 DaisyUI-based design alternatives for expand indicator"

    # Record Editing from Dashboard (added 2025-12-20)
    record_editing:
      description: "Editing records (facts/plans) directly from dashboard"
      entry_points:
        recent_transactions:
          desktop: "Click edit icon (✏️) in first column"
          mobile: "Tap on entire transaction row"
          function: "openEditFromDashboard(factId)"
        pending_records:
          desktop: "Click edit icon (✏️) in first column (not available for transfers)"
          mobile: "Tap on entire record row (not available for transfers)"
          function: "openEditPendingRecord(itemId, entity)"
      modal_behavior:
        id: "edit-modal"
        component: "modal_edit_plan"
        reminder_section:
          for_facts: "Hidden (id='edit-reminder-container' gets hidden class)"
          for_plans: "Visible (reminder can be set/updated/deleted)"
      js_functions:
        - "setEditModalMode(recordType) - Show/hide reminder section"
        - "loadCategoriesForEdit() - Load categories (cached)"
        - "loadRemindersForEdit(factIds) - Load reminders for plans"
        - "openEditFromDashboard(factId) - Edit online record"
        - "openEditPendingRecord(itemId, entity) - Edit pending (IndexedDB) record"
        - "closeEditModal() - Close edit modal"
        - "updateFact(event) - Save changes (online and pending records)"
        - "deleteFromEditModal() - Delete record from modal"
      api_calls:
        read:
          - "GET /api/v1/facts/{id} - Load fact data"
          - "GET /api/v1/reminders/?limit=100 - Load reminders"
          - "GET /api/v1/articles - Load categories"
        write:
          - "PUT /api/v1/admin/facts/{id} - Update fact"
          - "POST /api/v1/reminders/{id} - Create reminder"
          - "PUT /api/v1/reminders/{id} - Update reminder"
          - "DELETE /api/v1/reminders/{id} - Delete reminder"
          - "DELETE /api/v1/facts/{id} - Delete fact"
      offline_support:
        pending_records:
          update: "offlineManager.updatePendingItemData(itemId, data)"
          delete: "offlineManager.removePendingItem(itemId)"

  facts:
    path: "frontend/web/templates/facts.html"
    extends: base
    description: "Transactions management (facts and plans)"
    modals:
      - modal_transaction
      - modal_edit_fact
      - modal_confirm
      - modal_transfer
    js_modules:
      - $ref: "./js-modules.yaml#/modules/adminFactsCommon"
      - $ref: "./js-modules.yaml#/modules/transfer"
    features:
      - "Date range filter"
      - "Category filter"
      - "Financial center filter"
      - "Pagination"
      - "Inline edit"

  plan:
    path: "frontend/web/templates/plan.html"
    extends: base
    description: "Budget planning (planned transactions)"
    modals:
      - modal_plan
      - modal_edit_plan
      - modal_confirm
    js_modules:
      - $ref: "./js-modules.yaml#/modules/adminFactsCommon"
    features:
      - "Monthly budget view"
      - "Category breakdown"
      - "Plan vs actual comparison"

  analytics:
    path: "frontend/web/templates/analytics.html"
    extends: base
    description: "Statistics and charts"
    charts:
      library: "ECharts"
      types:
        - pie_chart
        - line_chart
        - bar_chart
    api_calls:
      - "/api/v1/analytics/category-breakdown"
      - "/api/v1/analytics/monthly-summary"

  lists:
    path: "frontend/web/templates/lists.html"
    extends: base
    description: "Shopping lists with dual view (table and hierarchy)"
    js_modules:
      - $ref: "./js-modules.yaml#/modules/listsManager"
      - $ref: "./js-modules.yaml#/modules/hierarchyView"
      - $ref: "./js-modules.yaml#/modules/csvImporter"
      - $ref: "./js-modules.yaml#/modules/offlineShoppingManager"
      - $ref: "./js-modules.yaml#/modules/confirmDialog"
    vendor_libs:
      - "Choices.js"
    features:
      - "Dual view: table and tree"
      - "Offline support"
      - "CSV import"
      - "Google Sheets import"
      - "Product group categorization"
      - "Hide completed items filter (in toolbar)"
      - "FAB Speed Dial for batch operations"
      - "Choices.js searchable selectors for store and product group"
    form_selectors:
      store:
        element_id: "item-store"
        type: "Choices.js"
        features: ["search", "alphabetical sort", "choices-tailwind theme"]
      product_group:
        element_id: "item-product-group"
        type: "Choices.js"
        features: ["search", "hierarchical display", "leaf-only selection"]
    fab_speed_dial:
      id: "lists-fab-menu"
      icon: "⋮ (vertical dots, rotates 90° on open)"
      visibility: "Detail view only, when items exist"
      backdrop_id: "lists-fab-backdrop"
      actions:
        - id: "deleteCompletedWithConfirm"
          label: "Удалить выполненные"
          icon: "🗑️"
          color: "btn-error"
          confirm_dialog: true
          condition: "has completed items"
        - id: "markAllCompletedWithConfirm"
          label: "Отметить все"
          icon: "✅"
          color: "btn-success"
          confirm_dialog: true
        - id: "unmarkAllCompletedWithConfirm"
          label: "Снять все отметки"
          icon: "☐"
          color: "btn-warning"
          confirm_dialog: true
      css:
        file: "frontend/web/static/css/lists.css"
        section: "FAB Speed Dial Menu"
        features:
          - "Cascade animation with staggered delays"
          - "Main button rotation on open"
          - "Backdrop with opacity transition"
          - "iOS safe area support"
          - "Reduced motion support"
    toolbar_sections:
      hierarchy_controls:
        id: "hierarchy-controls"
        visibility: "Hierarchy view only"
        buttons:
          - "Развернуть (⬇️)"
          - "Свернуть (⬆️)"
      shared_controls:
        id: "shared-controls"
        visibility: "Both views"
        buttons:
          - id: "toggle-hide-completed-btn"
            text: "Скрыть выполненные / Показать все (👁️)"
        note: "Batch operations (mark all, unmark all, delete completed) moved to FAB"
      view_toggle:
        type: "join (button group)"
        buttons:
          - "Таблица (📋)"
          - "Иерархия (🌳)"
    modals:
      - create-list-modal
      - item-modal
      - delete-confirm-modal
      - delete-list-modal
      - confirm-modal  # For FAB action confirmations
    responsive_design:
      mobile:
        - "Текст кнопок скрыт (показываются только иконки)"
        - "Карточное представление вместо таблицы"
        - "Тулбар горизонтально скроллится"
        - "FAB с iOS safe area поддержкой"
      desktop:
        - "Полный текст кнопок"
        - "Табличное представление"
        - "FAB с анимациями"

  notifications:
    path: "frontend/web/templates/notifications.html"
    extends: base
    description: "Notification history"
    api_calls:
      - "/api/v1/notifications"

  security:
    path: "frontend/web/templates/security.html"
    extends: base
    description: "2FA settings, security preferences"
    features:
      - "Enable/disable 2FA"
      - "Backup codes"
      - "Active sessions"

  # ---------------------------------------------------------------------------
  # AUTH TEMPLATES
  # ---------------------------------------------------------------------------
  login_email:
    path: "frontend/web/templates/login_email.html"
    extends: base
    description: "Email/password login"
    api_calls:
      - "/api/v1/auth/login-email"
      - "/api/v1/auth/2fa-verify"

  telegram_login:
    path: "frontend/web/templates/telegram_login.html"
    extends: base
    description: "Telegram OAuth login page"
    widgets:
      - name: "Telegram Login Widget"
        source: "https://telegram.org/js/telegram-widget.js?22"
        preload: "link rel=preload in head"
    loading_states:
      description: "State machine with 3 mutually exclusive states"
      states:
        loading:
          element_id: "telegram-placeholder"
          description: "Placeholder button with spinner, visible immediately (inline HTML)"
          visible: true
        success:
          trigger: "iframe injected by Telegram widget"
          behavior: "Placeholder hidden, widget visible"
        error:
          element_id: "telegram-error"
          trigger: "15s timeout without iframe detection"
          features:
            - "Warning alert with explanation message"
            - "Retry button (max 3 attempts, 2s cooldown)"
            - "Direct t.me/bot_username fallback link"
      guarantee: "One UI element is ALWAYS visible - never empty space"
    js_features:
      state_machine:
        states: ["loading", "success", "error"]
        transitions:
          - from: loading
            to: success
            trigger: "MutationObserver detects iframe"
          - from: loading
            to: error
            trigger: "15s timeout"
          - from: error
            to: loading
            trigger: "retry button click"
      retry_mechanism:
        max_retries: 3
        cooldown_ms: 2000
        cache_busting: "timestamp query param on script src"
      data_attributes:
        - "data-bot-username"
        - "data-callback-url"
    api_calls:
      - "/api/v1/auth/telegram"

  register:
    path: "frontend/web/templates/register.html"
    extends: base
    description: "User registration (email)"
    api_calls:
      - "/api/v1/auth/register"

  # ---------------------------------------------------------------------------
  # ADMIN TEMPLATES
  # ---------------------------------------------------------------------------
  admin_dashboard:
    path: "frontend/web/templates/admin_dashboard.html"
    extends: base
    description: "Admin overview dashboard"
    requires_admin: true

  admin_users:
    path: "frontend/web/templates/admin_users.html"
    extends: base
    description: "User management"
    requires_admin: true
    modals:
      - modal_confirm
    api_calls:
      - "/api/v1/users"
      - "/api/v1/users/{id}/role"

  admin_articles:
    path: "frontend/web/templates/admin_articles.html"
    extends: base
    description: "Article (category) management"
    requires_admin: true
    modals:
      - modal_confirm
    js_modules:
      - $ref: "./js-modules.yaml#/modules/hierarchyView"
      - $ref: "./js-modules.yaml#/modules/adminStatusFilter"
    api_calls:
      - "/api/v1/articles"
      - "/api/v1/articles/{id}/archive"
      - "/api/v1/articles/{id}/restore"

  admin_financial_centers:
    path: "frontend/web/templates/admin_financial_centers.html"
    extends: base
    description: "Financial center (account) management"
    requires_admin: true
    modals:
      - modal_confirm
    api_calls:
      - "/api/v1/financial-centers"

  admin_cost_centers:
    path: "frontend/web/templates/admin_cost_centers.html"
    extends: base
    description: "Cost center management"
    requires_admin: true
    modals:
      - modal_confirm
    api_calls:
      - "/api/v1/cost-centers"

  admin_stores:
    path: "frontend/web/templates/admin_stores.html"
    extends: base
    description: "Store reference data"
    requires_admin: true
    modals:
      - modal_confirm
    api_calls:
      - "/api/v1/stores"

  admin_product_groups:
    path: "frontend/web/templates/admin_product_groups.html"
    extends: base
    description: "Product group hierarchy"
    requires_admin: true
    modals:
      - modal_confirm
    js_modules:
      - $ref: "./js-modules.yaml#/modules/hierarchyView"
    api_calls:
      - "/api/v1/product-groups"

  admin_monitoring:
    path: "frontend/web/templates/admin_monitoring.html"
    extends: base
    description: "System monitoring dashboard"
    requires_admin: true
    features:
      - "Real-time metrics"
      - "Connection count"
      - "Error logs"

  admin_import:
    path: "frontend/web/templates/admin_import.html"
    extends: base
    description: "Multi-bank CSV import with enrichment workflow"
    requires_admin: false
    js_modules:
      - $ref: "./js-modules.yaml#/modules/importManager"
    vendor_libs:
      - "Choices.js"
    features:
      - "4-step workflow: Bank -> Upload -> Mapping -> Enrichment"
      - "Auto-detect bank format and encoding"
      - "Configurable column mapping"
      - "Inline staging table editing"
      - "Bulk operations on selected records"
      - "Progress indicators"
    api_calls:
      - "POST /api/v1/import/upload"
      - "GET /api/v1/import/files/{id}/analyze"
      - "GET /api/v1/import/mappings/{bank_id}"
      - "POST /api/v1/import/mappings"
      - "POST /api/v1/import/files/{id}/parse"
      - "GET /api/v1/admin/staging"
      - "PATCH /api/v1/admin/staging/{id}"
      - "POST /api/v1/admin/staging/bulk-update"
      - "POST /api/v1/admin/staging/execute"
    workflow_steps:
      step_1_bank_selection:
        description: "Select bank provider or create new"
        features:
          - "Bank dropdown with add/delete buttons"
          - "Check for existing staging records"
          - "Skip to enrichment if staging exists"
      step_2_upload:
        description: "Upload CSV file"
        features:
          - "File upload (max 100MB)"
          - "Auto-detect encoding"
          - "Mapping mode selection (create/update/use existing)"
      step_3_mapping:
        description: "Configure column mapping"
        features:
          - "Delimiter selector (semicolon, comma, tab)"
          - "Date format selector"
          - "Number format selector (RU, US, DE)"
          - "CSV preview table (first 5 rows)"
          - "Column mapping table"
      step_4_enrichment:
        description: "Enrich staging records before import"
        features:
          - "Editable staging table"
          - "Bulk operations on filtered records"
          - "Category picker modal with ChoicesCategoryTree"
          - "Statistics (total, filtered, ready)"
          - "Execute import button"
          - "Spreadsheet-like cell selection and editing"
          - "Resizable columns with localStorage persistence"
        filter_sidebar:
          id: "filter-sidebar"
          collapsible: true
          default_state: "collapsed"
          toggle_function: "toggleFilterSidebar()"
          state_persistence: "localStorage.filterSidebarCollapsed"
        filter_elements:
          filter-csv-cat:
            type: "select"
            purpose: "Filter by CSV category (auto-populated from data)"
            height: "3rem"
          filter-status:
            type: "select"
            purpose: "Filter by fill status (empty/partial/complete)"
            height: "3rem"
        bulk_panel_filtered:
          id: "bulk-panel-filtered"
          visibility: "always"
          select_height: "3rem"
          purpose: "Bulk apply values to all or filtered records"
          category_picker: "ChoicesCategoryTree with type filtering"
          behavior:
            - "Applies values to all filtered records (not just selected)"
            - "Resets header checkbox after operation"
            - "Highlights updated rows with flash animation"
        category_picker_float:
          id: "category-picker-float"
          uses: "BudgetShared.ChoicesCategoryTree"
          type_filter: "from rowArticleTypes[record.id]"
          positioning: "fixed, near clicked cell"
          close_on: "selection or click outside"
          features:
            - "Fuzzy search"
            - "Type-based filtering"
            - "Auto-save on selection"
            - "Path display"
        spreadsheet_features:
          sticky_checkbox_column:
            description: "Checkbox column stays fixed during horizontal scroll"
            css_selector: 'th[data-col="checkbox"], td[data-col="checkbox"]'
            styles:
              - "position: sticky"
              - "left: 0"
              - "z-index: 2 (3 for header)"
              - "background: oklch(var(--b1)) with zebra matching"
          column_resize:
            storage_key: "staging-column-widths"
            min_width: "50px"
            persistence: "localStorage"
          cell_selection:
            single_click: "Select cell"
            shift_click: "Select range"
            ctrl_click: "Toggle cell selection"
            readonly_click: "Select entire row"
            header_click: "Select entire column"
          context_menu:
            id: "spreadsheet-context-menu"
            actions:
              - "Fill Down (Ctrl+D)"
              - "Fill Selection"
              - "Copy (Ctrl+C)"
              - "Paste (Ctrl+V)"
              - "Clear (Delete)"
              - "Select Column"
              - "Select Similar (by CSV category)"
          keyboard_shortcuts:
            ctrl_d: "Fill Down"
            ctrl_c: "Copy"
            ctrl_v: "Paste"
            delete: "Clear selection"
            escape: "Clear all selection"
          status_bar:
            id: "spreadsheet-status-bar"
            displays:
              - "Selected cells count"
              - "Filled fields / Total fields"
              - "Ready for import count"
              - "Last action message (5s timeout)"
        enrichment_fields:
          - "article_id (required)"
          - "financial_center_id (required)"
          - "cost_center_id (optional)"
          - "user_comment"
          - "record_type (fact/plan)"
    ui_refactoring_variants:
      description: "10 alternative UI designs for enrichment table"
      location: "tmp/import/"
      variants:
        - file: "variant-01-cards.html"
          name: "Card-Based Layout"
          concept: "Each record as a card in responsive grid"
          pros: ["Visual status indicators", "Mobile-friendly", "Good for overview"]
          cons: ["More vertical space", "Harder to compare records"]

        - file: "variant-02-split-panel.html"
          name: "Master-Detail Split Panel"
          concept: "List on left, edit form on right"
          pros: ["Focus on one record", "Keyboard navigation", "Full form without scroll"]
          cons: ["Requires wide screen", "Slower for bulk editing"]

        - file: "variant-03-modal-edit.html"
          name: "Modal Edit Form"
          concept: "Compact table + modal for editing"
          pros: ["Clean table", "Familiar UX pattern", "Easy to add fields"]
          cons: ["Extra click to edit", "Modal can be annoying"]

        - file: "variant-04-accordion.html"
          name: "Expandable Accordion Rows"
          concept: "Rows expand to show edit form"
          pros: ["Context preserved", "No modal needed", "Can compare records"]
          cons: ["Vertical scroll increases", "Animation may lag"]

        - file: "variant-05-kanban.html"
          name: "Kanban Status Columns"
          concept: "3 columns by status: Incomplete -> Partial -> Ready"
          pros: ["Visual workflow", "Drag & drop", "Progress motivation"]
          cons: ["Horizontal space", "Hard with many records"]

        - file: "variant-06-popover.html"
          name: "Inline Popover Edit"
          concept: "Compact cells with popover on click"
          pros: ["Very compact", "Scales to 100+ records", "Keyboard-friendly"]
          cons: ["Popover may overlap", "Touch-unfriendly"]

        - file: "variant-07-grouped.html"
          name: "Grouped Collapsible Table"
          concept: "Auto-group by CSV category with bulk apply"
          pros: ["Logical organization", "Fast group processing", "Clear progress"]
          cons: ["Needs good CSV categories", "May create too many groups"]

        - file: "variant-08-wizard.html"
          name: "Step-by-Step Wizard"
          concept: "Focus mode: one record at a time with steps"
          pros: ["Maximum focus", "Guided workflow", "Good for beginners"]
          cons: ["Slow for many records", "Needs bulk mode fallback"]

        - file: "variant-09-sticky.html"
          name: "Sticky Header + Floating Toolbar"
          concept: "Enhanced current table with sticky elements"
          pros: ["Header always visible", "Bulk toolbar on demand", "Quick filters"]
          cons: ["More UI complexity", "Floating elements may overlap"]

        - file: "variant-10-toggle.html"
          name: "Compact/Detail View Toggle"
          concept: "Two view modes with toggle button"
          pros: ["Flexibility", "Compact for overview", "Detail for editing"]
          cons: ["Two modes to maintain", "User must know about toggle"]

        - file: "variant-11-spreadsheet.html"
          name: "Spreadsheet (Excel-like)"
          concept: "Excel-like cell selection, Fill Down, Copy/Paste"
          pros: ["Familiar UX for Excel users", "Fast bulk editing", "Column resize", "Keyboard shortcuts"]
          cons: ["Mobile-unfriendly", "Learning curve for non-Excel users"]
          status: "IMPLEMENTED"
          implementation_date: "2025-12"

# ---------------------------------------------------------------------------
# COMPONENTS (Jinja2 Macros)
# ---------------------------------------------------------------------------
components:
  modal_transaction:
    path: "frontend/web/templates/components/modal_transaction.html"
    type: "macro"
    description: "Transaction creation modal"
    fields:
      - "date (CalendarWidget)"
      - "amount"
      - "article_id (ChoicesCategoryTree)"
      - "financial_center_id (Choices.js)"
      - "cost_center_id (Choices.js)"
      - "description"
    api_calls:
      - "/api/v1/facts"
      - "/api/v1/articles"
      - "/api/v1/financial-centers"
      - "/api/v1/cost-centers"
      - "/api/v1/analytics/fact-hints"

  modal_edit_fact:
    path: "frontend/web/templates/components/modal_edit_fact.html"
    type: "macro"
    description: "Transaction edit modal"
    api_calls:
      - "/api/v1/facts/{id}"

  modal_plan:
    path: "frontend/web/templates/components/modal_plan.html"
    type: "macro"
    description: "Budget plan creation modal"
    plan_mode_selector:
      type: "radio_group"
      name: "plan_mode"
      description: "Mutually exclusive plan mode selection (replaces toggle + checkbox)"
      options:
        - value: "regular"
          label: "Обычный план"
          description: "Default mode - no recurring, no reminder"
          default: true
        - value: "recurring"
          label: "Регулярный платеж"
          description: "Shows recurring payment settings panel"
        - value: "reminder"
          label: "Напоминание"
          description: "Shows reminder date/time picker panel"
      behavior:
        - "Only one mode can be selected at a time"
        - "Switching modes hides previous panel and shows new one"
        - "Reset to 'regular' clears both panels' fields"
      js_function: "togglePlanMode(modalId)"
      panels:
        recurring: "recurring-settings-{modalId}"
        reminder: "onetime-reminder-section-{modalId}"
    recurring_settings:
      frequency_type:
        type: "select"
        class: "h-12"
        description: "Frequency selector (monthly/weekly/daily/quarterly)"
      frequency_value_monthday:
        type: "select"
        class: "h-12"
        description: "Day of month (1-28)"
      duration_type:
        type: "select"
        class: "h-12"
        description: "Duration selector (indefinite/count/end_date)"
        options:
          - value: "indefinite"
            label: "Бессрочно"
            default: true
          - value: "count"
            label: "Количество повторений"
          - value: "end_date"
            label: "До даты"
        js_function: "updateDurationFields(modalId)"
      recurring_end_date:
        type: "text"
        class: "h-12"
        description: "End date input with CalendarWidget"
        calendar_widget:
          mode: "single"
          min_date: "today"
          initialization: "updateDurationFields() - when duration_type='end_date'"
          icon_button: "SVG calendar icon inside input (onclick triggers widget)"
      recurring_reminder_hour:
        type: "select"
        class: "h-12 w-20"
        description: "Hour selector (00-23)"
      recurring_reminder_minute:
        type: "select"
        class: "h-12 w-20"
        description: "Minute selector (00-55, step 5)"
    api_calls:
      - "/api/v1/facts"
      - "/api/v1/analytics/plan-hints"

  modal_edit_plan:
    path: "frontend/web/templates/components/modal_edit_plan.html"
    type: "macro"
    description: "Budget plan edit modal with recurring plan support"
    fields:
      - "edit-id (hidden): Fact ID"
      - "edit-recurring-plan-id (hidden): RecurringPlan ID (if linked)"
      - "amount (number, required)"
      - "fact_date (text, DD.MM.YYYY format, CalendarWidget)"
      - "edit_category_type (radio buttons in collapse): expense/income/debit/credit"
      - "article_id (ChoicesCategoryTree, filtered by type)"
      - "financial_center_id (select)"
      - "cost_center_id (select, optional)"
      - "description (textarea)"
      - "enable_reminder (checkbox, plans only)"
      - "reminder_date/hour/minute (reminder datetime)"
      - "edit_scope (radio, if recurring_plan_id exists): single/template"
    recurring_plan_support:
      description: "When editing a fact linked to a recurring plan, shows scope selector"
      scope_options:
        single: "Update only this fact (default)"
        template: "Update recurring plan template (affects future generations)"
      template_editable_fields:
        - "amount"
        - "description"
        - "cost_center_id"
      template_readonly_fields:
        - "frequency_type, frequency_value, start_date"
        - "article_id, financial_center_id"
    ux_improvements:
      - "Category type in collapsible section with badge showing current type"
      - "Recurring info alert box shown when editing recurring-linked facts"
    api_calls:
      - "PUT /api/v1/facts/{id} - Single fact update"
      - "PUT /api/v1/recurring-plans/{id} - Template update"
      - "GET/POST/PUT/DELETE /api/v1/reminders/{fact_id} - Reminder CRUD"

  modal_transfer:
    path: "frontend/web/templates/components/modal_transfer.html"
    type: "macro"
    description: "Transfer between accounts modal"
    fields:
      - "transfer_date (CalendarWidget for facts, period buttons for plans)"
      - "from_financial_center_id (Choices.js)"
      - "from_article_id (ChoicesCategoryTree, type=debit)"
      - "to_financial_center_id (Choices.js)"
      - "to_article_id (ChoicesCategoryTree, type=credit)"
      - "amount"
      - "description"
    deprecated_fields:
      - "from_cost_center_id - removed from UI (2025-12-22), always null"
      - "to_cost_center_id - removed from UI (2025-12-22), always null"
    api_calls:
      - "/api/v1/transfers"
      - "/api/v1/financial-centers"
      - "/api/v1/analytics/plan-hints"
      - "/api/v1/analytics/fact-hints"

  modal_confirm:
    path: "frontend/web/templates/components/modal_confirm.html"
    type: "macro"
    description: "Confirmation dialog (delete/archive)"
    usage: "Archive, delete, restore operations"

  status_filter:
    path: "frontend/web/templates/components/status_filter.html"
    type: "macro"
    description: "Status filter buttons (active/archived/deleted)"

  mobile_alert:
    path: "frontend/web/templates/components/mobile_alert.html"
    type: "macro"
    description: "Mobile restriction alert"

# ---------------------------------------------------------------------------
# PARTIALS (HTMX Fragments)
# ---------------------------------------------------------------------------
partials:
  quick_stats:
    path: "frontend/web/templates/partials/quick_stats.html"
    description: "Dashboard statistics fragment"
    loaded_by: "index.html"
    endpoint: "/api/v1/analytics/quick-stats-html"

  account_balances:
    path: "frontend/web/templates/partials/account_balances.html"
    description: "Account balance cards with data-fc-id for IncrementalUpdates"
    loaded_by: "index.html"
    endpoint: "/api/v1/analytics/account-balances-html"
    data_attributes:
      - "data-fc-id: Financial center ID for IncrementalUpdates.updateAccountBalance()"

  recent_transactions:
    path: "frontend/web/templates/partials/recent_transactions.html"
    description: "Last 10 transactions list with inline edit capability"
    loaded_by: "index.html"
    endpoint: "/api/v1/facts/recent-html"
    features:
      - "Desktop: edit icon (✏️) column opens edit modal"
      - "Mobile: tap on row opens edit modal"
      - "Both fact and plan record types supported"
    onclick_handler: "openEditFromDashboard(factId)"
