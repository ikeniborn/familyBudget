# Web Workers
# Background processing for CPU-intensive tasks

workers:
  # ---------------------------------------------------------------------------
  # CSV WORKER
  # ---------------------------------------------------------------------------
  csvWorker:
    path: "frontend/web/static/js/workers/csvWorker.js"
    loc_code: 313
    description: "CSV parsing in background thread"
    input:
      file: "File (CSV)"
      delimiter: "string (default ',')"
      encoding: "string (default 'utf-8')"
    output:
      rows: "array of objects"
      headers: "array of strings"
      rowCount: "integer"
    used_by:
      - $ref: "./js-modules.yaml#/modules/csvImporter"
    notes: "Prevents UI freeze during large CSV parsing"

  # ---------------------------------------------------------------------------
  # SYNC WORKER
  # ---------------------------------------------------------------------------
  syncWorker:
    path: "frontend/web/static/js/workers/syncWorker.js"
    loc_code: 391
    description: "Offline sync deduplication and conflict resolution"
    input:
      pendingRecords: "array (from IndexedDB)"
      serverRecords: "array (from API)"
    output:
      toSync: "array (deduplicated records)"
      conflicts: "array (conflicting records)"
    used_by:
      - $ref: "./js-modules.yaml#/modules/offlineManager"
    features:
      - "Deduplication via content_hash"
      - "Conflict detection via updated_at comparison"
      - "Transfer pair validation"
    notes: "Prevents main thread blocking during sync"

  # ---------------------------------------------------------------------------
  # HIERARCHY WORKER
  # ---------------------------------------------------------------------------
  hierarchyWorker:
    path: "frontend/web/static/js/workers/hierarchyWorker.js"
    loc_code: 175
    description: "Article/ProductGroup hierarchy tree building"
    input:
      items: "array (flat list)"
      parentIdKey: "string (default 'parent_id')"
    output:
      tree: "array (nested tree structure)"
      depth: "integer (max depth)"
    used_by:
      - $ref: "./js-modules.yaml#/modules/listsManager"
    notes: "Builds hierarchical tree from flat data"

  # ---------------------------------------------------------------------------
  # PENDING RECORDS WORKER
  # ---------------------------------------------------------------------------
  pendingRecordsWorker:
    path: "frontend/web/static/js/workers/pendingRecordsWorker.js"
    loc_code: 440
    description: "Pending records processing and validation"
    input:
      records: "array (from sync queue)"
      validationRules: "object"
    output:
      valid: "array"
      invalid: "array (with error messages)"
    used_by:
      - $ref: "./js-modules.yaml#/modules/offlineManager"

  # ---------------------------------------------------------------------------
  # WORKER WRAPPER (Core Infrastructure)
  # ---------------------------------------------------------------------------
  workerWrapper:
    path: "frontend/web/static/js/workers/core/workerWrapper.js"
    loc_code: 293
    description: "Worker lifecycle management and error handling"
    features:
      - "Worker pool management"
      - "Promise-based API"
      - "Error handling and retry"
      - "Worker termination on timeout"
    usage: |
      import { WorkerWrapper } from './workers/core/workerWrapper.js';

      const csvWorker = new WorkerWrapper('csvWorker.js');
      const result = await csvWorker.execute({ file, delimiter });

notes: |
  All workers run in separate threads to prevent UI blocking.
  Workers cannot access DOM or window object.
  Communication via postMessage (structured clone algorithm).
