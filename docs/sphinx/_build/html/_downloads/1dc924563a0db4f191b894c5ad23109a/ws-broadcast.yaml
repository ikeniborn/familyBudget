# WebSocket Broadcast Flow
# Real-time event propagation to connected clients

meta:
  name: "WebSocket Broadcast"
  trigger: "Data mutation (create, update, delete)"
  actors:
    - "Backend service (event producer)"
    - "BudgetWebSocketManager"
    - "EventBuffer (for Long Polling)"
    - "Web browser (event consumer)"
  outcome: "All connected clients receive real-time updates"

critical_constraint:
  description: |
    CRITICAL: Application MUST run with WORKERS=1 (single uvicorn worker).

    BudgetWebSocketManager stores connections in-memory.
    Multiple workers would have SEPARATE connection pools.
    Events broadcast by worker A would NOT reach clients on worker B.

  configuration:
    docker_compose: "--workers 1"
    env_var: "WORKERS=1"

  scaling_solution: |
    For multiple workers, implement Redis Pub/Sub:
    - Publish events to Redis channel
    - Each worker subscribes to channel
    - Each worker broadcasts to its local connections

# ===========================================================================
# FLOW DIAGRAM
# ===========================================================================
diagram: |
  +---------------------------------------------------------------------------+
  |                      WEBSOCKET BROADCAST FLOW                             |
  +---------------------------------------------------------------------------+

  *-------------------------------------------------------------------------*
  |                                                                         |
  |  CLIENT CONNECTION SETUP                                                |
  |  =======================                                                |
  |                                                                         |
  |  +------------+     +------------------+     +--------------------+     |
  |  | Browser    |----+| WebSocket        |----+| JWT Auth via       |     |
  |  | WebSocket  |     | /api/v1/budget/ws|     | query param        |     |
  |  +------------+     | ?token=<JWT>     |     +----------+---------+     |
  |                     +------------------+                |              |
  |                                                * Valid token?          |
  |                                               / \                      |
  |                                              /   \                     |
  |                                            Yes    No---> 403           |
  |                                             |                          |
  |                                             v                          |
  |                     +------------------------------------------+       |
  |                     | BudgetWebSocketManager.connect()         |       |
  |                     |                                          |       |
  |                     | connections: list[(user_id, websocket,   |       |
  |                     |              connection_id, timestamp)]  |       |
  |                     | +--------------------------------------+ |       |
  |                     | | (user_1, ws_a, uuid_a, ts_a)         | |       |
  |                     | | (user_1, ws_b, uuid_b, ts_b)         | |       |
  |                     | | (user_2, ws_c, uuid_c, ts_c)         | |       |
  |                     | +--------------------------------------+ |       |
  |                     +------------------------------------------+       |
  |                                             |                          |
  |                                             v                          |
  |                     +------------------------------------------+       |
  |                     | Send "connected" event                   |       |
  |                     | {"type": "connected",                    |       |
  |                     |  "data": {"connection_id": "uuid"},      |       |
  |                     |  "timestamp": "ISO8601"}                 |       |
  |                     +------------------------------------------+       |
  |                                                                        |
  |                                                                        |
  |  BIDIRECTIONAL COMMUNICATION                                           |
  |  ============================                                          |
  |                                                                        |
  |  Client -> Server:                                                     |
  |  +------------+     +------------------+     +--------------------+    |
  |  | Client     |----+| {"type": "ping"} |----+| Server responds    |    |
  |  | sends msg  |     |                  |     | {"type": "pong"}   |    |
  |  +------------+     +------------------+     +--------------------+    |
  |                                                                        |
  |  +------------+     +----------------------+  +--------------------+   |
  |  | Client     |----+| {"type":             |--+| Server responds    |   |
  |  | offline    |     |  "check_online"}     |  | {"type":           |   |
  |  | detection  |     +----------------------+  |  "online_status"}  |   |
  |  +------------+                               +--------------------+   |
  |                                                                        |
  |                                                                        |
  |  EVENT BROADCAST                                                       |
  |  ===============                                                       |
  |                                                                        |
  |  +------------+                                                        |
  |  | API        |                                                        |
  |  | Endpoint   |  POST /facts, PUT /facts/{id}, DELETE /facts/{id}     |
  |  +-----+------+                                                        |
  |        |                                                               |
  |        v                                                               |
  |  +----------------+                                                    |
  |  | Service Layer  |                                                    |
  |  | (business      |                                                    |
  |  |  logic)        |                                                    |
  |  +-----+----------+                                                    |
  |        |                                                               |
  |        v                                                               |
  |  +----------------+                                                    |
  |  | Database       |                                                    |
  |  | Commit         |                                                    |
  |  +-----+----------+                                                    |
  |        |                                                               |
  |        | After successful commit                                       |
  |        v                                                               |
  |  +-----------------------------------------------------------+        |
  |  | await ws_manager.broadcast(event_type, data)              |        |
  |  | event_buffer.add_event(event_type, data, timestamp)       |        |
  |  +----------------------------+------------------------------+        |
  |                               |                                       |
  |                               v                                       |
  |  +-----------------------------------------------------------+        |
  |  | For each connection in ws_manager.connections:            |        |
  |  |   await websocket.send_json(event)                        |        |
  |  +-----------------------------------------------------------+        |
  |                               |                                       |
  |                               v                                       |
  |  +---------------------------------------------------------------------+
  |  |                                                                   | |
  |  |  Client A          Client B          Client C                     | |
  |  |  (WebSocket)       (WebSocket)       (Long Polling)               | |
  |  |     |                  |                  |                        | |
  |  |     v                  v                  v                        | |
  |  |  +------+          +------+          +------+                     | |
  |  |  |event |          |event |          |poll  |                     | |
  |  |  |JSON  |          |JSON  |          |resp  |                     | |
  |  |  +------+          +------+          +------+                     | |
  |  |                                                                   | |
  |  +-------------------------------------------------------------------+ |
  |                                                                        |
  *------------------------------------------------------------------------*

# ===========================================================================
# EVENT TYPES
# ===========================================================================
events:
  connected:
    trigger: "Client establishes WebSocket connection"
    data:
      message: "Connected to WebSocket"
      connection_id: "UUID"

  ping:
    trigger: "Server keepalive timer (10 seconds)"
    data:
      timestamp: "ISO 8601"

  pong:
    trigger: "Client sends ping message"
    data:
      timestamp: "ISO 8601"

  online_status:
    trigger: "Client sends check_online message"
    data:
      online: "boolean (always true)"
      timestamp: "ISO 8601"

  fact_created:
    trigger: "POST /api/v1/facts"
    data:
      id: "integer"
      amount: "decimal"
      article_id: "integer"
      fact_date: "YYYY-MM-DD"
      record_type: "string"

  fact_updated:
    trigger: "PUT /api/v1/facts/{id}"
    data:
      id: "integer"
      changed_fields: "array of field names"

  fact_deleted:
    trigger: "DELETE /api/v1/facts/{id}"
    data:
      id: "integer"

  plan_created:
    trigger: "POST /api/v1/facts (plan)"
    data:
      id: "integer"
      amount: "decimal"
      article_id: "integer"
      plan_date: "YYYY-MM-DD"
      record_type: "string"

  plan_updated:
    trigger: "PUT /api/v1/facts/{id} (plan)"
    data:
      id: "integer"
      changed_fields: "array"

  plan_deleted:
    trigger: "DELETE /api/v1/facts/{id} (plan)"
    data:
      id: "integer"

  transfer_created:
    trigger: "POST /api/v1/transfers"
    data:
      transfer_id: "UUID"
      from_financial_center_id: "integer"
      to_financial_center_id: "integer"
      amount: "decimal"

  transfer_deleted:
    trigger: "DELETE /api/v1/transfers/{id}"
    data:
      transfer_id: "UUID"

  item_created:
    trigger: "POST /api/v1/shopping-list-items"
    data:
      id: "integer"
      shopping_list_id: "integer"
      name: "string"

  item_updated:
    trigger: "PUT /api/v1/shopping-list-items/{id}"
    data:
      id: "integer"
      changed_fields: "array"

  item_deleted:
    trigger: "DELETE /api/v1/shopping-list-items/{id}"
    data:
      id: "integer"

  item_completed:
    trigger: "PUT /api/v1/shopping-list-items/{id}/complete"
    data:
      id: "integer"
      is_completed: "boolean"

  article_created:
    trigger: "POST /api/v1/articles"
    data:
      id: "integer"
      name: "string"
      type: "string"

  article_updated:
    trigger: "PUT /api/v1/articles/{id}"
    data:
      id: "integer"
      changed_fields: "array"

# ===========================================================================
# CONNECTION MANAGER
# ===========================================================================
connection_manager:
  class: "BudgetWebSocketManager"
  file: "backend/app/api/v1/endpoints/budget_ws.py"

  data_structures:
    connections:
      type: "list[tuple[int, WebSocket, str, float]]"
      description: "(user_id, websocket, connection_id, last_activity)"

  methods:
    connect:
      signature: "async def connect(websocket: WebSocket, user_id: int) -> str"
      description: "Add client to connection pool"
      returns: "connection_id (UUID)"

    disconnect:
      signature: "async def disconnect(user_id: int, connection_id: str)"
      description: "Remove client from connection pool"

    broadcast:
      signature: "async def broadcast(event_type: str, data: dict)"
      description: "Send event to ALL connected clients"
      implementation: |
        for user_id, ws, conn_id, _ in self.connections:
            await ws.send_json({
                "type": event_type,
                "data": data,
                "timestamp": datetime.utcnow().isoformat()
            })

    update_activity:
      signature: "def update_activity(connection_id: str)"
      description: "Update last activity timestamp for connection"

    cleanup_stale_connections:
      signature: "async def cleanup_stale_connections()"
      description: "Remove connections inactive for >60 seconds"
      runs: "Every 30 seconds via background task"

# ===========================================================================
# EVENT BUFFER (Long Polling)
# ===========================================================================
event_buffer:
  class: "EventBuffer"
  file: "backend/app/api/v1/endpoints/budget_ws.py"

  data_structures:
    events:
      type: "deque[tuple[str, dict, float]]"
      description: "(event_type, data, timestamp)"
      max_length: 1000

  methods:
    add_event:
      signature: "def add_event(event_type: str, data: dict, timestamp: float)"
      description: "Add event to ring buffer"

    get_events_since:
      signature: "def get_events_since(timestamp: float) -> list"
      description: "Get all events since timestamp"

# ===========================================================================
# FRONTEND INTEGRATION
# ===========================================================================
frontend:
  js_module:
    $ref: "../web/js-modules.yaml#/modules/budgetWSClient"

  incremental_updates_module:
    $ref: "../web/js-modules.yaml#/modules/incrementalUpdates"

  connection_code: |
    // WebSocket connection
    const wsUrl = `wss://${location.host}/api/v1/budget/ws?token=${jwtToken}`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      handleEvent(msg.type, msg.data);
    };

    ws.onerror = (error) => {
      // Switch to Long Polling fallback
      startLongPolling();
    };

  long_polling_code: |
    // Long Polling fallback
    async function poll() {
      const response = await fetch(`/api/v1/budget/poll?since=${lastTimestamp}&timeout=10`);
      const data = await response.json();

      for (const event of data.events) {
        handleEvent(event.type, event.data);
      }

      lastTimestamp = data.server_time;
      setTimeout(poll, 100);  // Small delay then poll again
    }

  event_handlers:
    fact_created:
      action: "IncrementalUpdates.onFactCreated(data) - direct DOM update"
      fallback: "HTMXWidgets.refreshWidgetDebounced() if cache miss"

    fact_updated:
      action: "IncrementalUpdates.onFactUpdated(data) - debounced refresh"
      note: "Complex delta calculation, uses fallback"

    fact_deleted:
      action: "IncrementalUpdates.onFactDeleted(data) - remove + refresh stats"

    item_created:
      action: "listsManager.addItemToUI(data) - direct DOM insert"

    item_updated:
      action: "listsManager.updateItemInUI(data) - direct DOM update"

    item_deleted:
      action: "listsManager.removeItemFromUI(id) - direct DOM removal"

  ui_indicator:
    location: "Navbar"
    element_id: "#budget-sse-status-indicator"
    states:
      connected: "Green badge"
      disconnected: "Red badge"
      reconnecting: "Yellow badge (pulsing)"

# ===========================================================================
# INCREMENTAL UPDATES OPTIMIZATION
# ===========================================================================
incremental_updates:
  description: |
    Optimization layer between WebSocket events and UI updates.
    Uses event payload data directly instead of making HTTP requests.

  flow_diagram: |
    BEFORE (HTTP refresh):
    +------------+    +---------------+    +----------------+
    | WS Event   |--->| refreshAll()  |--->| 3 HTTP GET     |
    | fact_created    |               |    | requests       |
    +------------+    +---------------+    +----------------+

    AFTER (optimized):
    +------------+    +--------------------+    +--------------+
    | WS Event   |--->| IncrementalUpdates |--->| Direct DOM   |
    | fact_created    | .onFactCreated()   |    | manipulation |
    +------------+    +--------------------+    +--------------+
                               |
                               | (cache miss)
                               v
                       +--------------------+    +--------------+
                       | HTMXWidgets        |--->| HTTP GET     |
                       | .refreshDebounced()|    | (fallback)   |
                       +--------------------+    +--------------+

  performance_impact:
    http_requests_per_transaction:
      before: "1 POST + 3 GET = 4 requests"
      after: "1 POST = 1 request (75% reduction)"

    ui_latency:
      before: "200-500ms (wait for 3 HTTP round-trips)"
      after: "<100ms (instant DOM update)"

    backend_load:
      reduction: "3-4x fewer requests during active usage"

# ===========================================================================
# KEEP-ALIVE
# ===========================================================================
keepalive:
  server_ping:
    interval: "10 seconds"
    event: "ping"

  client_ping:
    interval: "15 seconds"
    message: '{"type": "ping"}'
    response: "pong"

  purpose:
    - "Prevent connection timeout"
    - "Detect dead connections"
    - "Enable offline mode detection (check_online)"

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
error_handling:
  client_disconnect:
    detection: "WebSocketDisconnect exception"
    action: "Remove from connection pool, log disconnect"

  broadcast_failure:
    detection: "Exception during send_json"
    action: "Log error, remove failed connection, continue with others"
    note: "One failing client should not affect others"

  stale_connections:
    detection: "Background cleanup task every 30 seconds"
    threshold: "60 seconds without activity"
    action: "Close WebSocket, remove from pool"

  endpoint_broadcast_errors:
    description: |
      Broadcast вызовы в API endpoints ОБЯЗАТЕЛЬНО оборачивать в try/except,
      чтобы ошибки broadcast не приводили к HTTP 500 в API response.

    pattern: |
      # Правильный паттерн (используется во всех endpoints):
      try:
          ws = _get_ws_broadcast()
          await ws.broadcast_item_updated(item_data=response.model_dump(mode="json"))
      except Exception as e:
          logger.warning(f"WebSocket broadcast failed for item {item_id}: {e}")
          # Don't fail the request if broadcast fails

    affected_files:
      - "backend/app/api/v1/endpoints/facts.py"
      - "backend/app/api/v1/endpoints/shopping_list_items.py"

    common_causes:
      - "JSON serialization failure (Decimal type)"
      - "Connection closed during broadcast"
      - "Network timeout"

    json_serialization:
      problem: "Decimal type not JSON serializable by default"
      solution: |
        1. Use model_dump(mode="json") when passing Pydantic models
        2. json.dumps(event, default=str) in ws_manager.broadcast()

# ===========================================================================
# SCALING CONSIDERATIONS
# ===========================================================================
scaling:
  current_limitation:
    description: "In-memory connection manager, single worker only"
    max_connections: "500 total, 10 per user"

  redis_pubsub_solution:
    description: "For multi-worker deployment"
    implementation: |
      # Each worker subscribes to Redis channel
      redis = aioredis.from_url("redis://localhost")
      pubsub = redis.pubsub()
      await pubsub.subscribe("ws_events")

      # On event, publish to Redis instead of direct broadcast
      await redis.publish("ws_events", json.dumps({
          "type": event_type,
          "data": data
      }))

      # Each worker receives from Redis and broadcasts locally
      async for message in pubsub.listen():
          await local_ws_manager.broadcast(
              message["type"],
              message["data"]
          )

    benefits:
      - "Multiple workers can run"
      - "Events reach all clients regardless of worker"
      - "Horizontal scaling possible"

# ===========================================================================
# MULTI-TAB FLOW
# ===========================================================================
multi_tab_flow:
  description: "Single WebSocket connection shared between browser tabs"

  diagram: |
    Tab 1 (Leader)              Tab 2-N (Followers)
    +- WebSocket connection     +- No WebSocket connection
    +- Web Locks (acquired)     +- Web Locks (waiting)
    +- BroadcastChannel         +- BroadcastChannel
    +- Heartbeat every 3s       +- Listens for events
         |                            ^
         +------ BroadcastChannel ----+
               (ws_event, heartbeat)

  leader_election:
    desktop_flow: |
      1. Tab calls connect()
      2. await _initMultiTab()
      3. navigator.locks.request('budget-ws-leader', ...)
      4. Timeout 100ms - if lock not acquired, start as follower
      5. If lock acquired before timeout - become leader
      6. If lock acquired AFTER timeout - promote to leader

    safari_ios_flow: |
      Safari iOS использует per-tab connection (без Web Locks):

      1. Tab calls connect()
      2. _detectSafariIOS() returns true
      3. _safariIOSMode = true
      4. _initMultiTab() immediately sets isLeader = true
      5. Skip Web Locks entirely
      6. Create direct WebSocket connection
      7. On failure: switch to Long Polling

      ВАЖНО: На Safari iOS каждая вкладка создаёт своё WebSocket соединение.

  visibility_handling:
    tab_hidden: "Leader keeps connection, continues heartbeat"
    tab_visible:
      leader: |
        1. Check _isConnectionStale() (45s without ping)
        2. If stale: force reconnect
        3. Check WebSocket.readyState === OPEN
        4. If OPEN: reuse connection
        5. If CLOSED: reconnect
      follower: "Request status from leader via BroadcastChannel"

  broadcast_channel_messages:
    ws_event:
      description: "WebSocket event to broadcast to followers"
      payload: "{ type: 'ws_event', event_type: string, data: object }"

    heartbeat:
      description: "Leader alive signal"
      interval: "3 seconds"
      payload: "{ type: 'heartbeat', timestamp: number }"

    leader_changed:
      description: "Leader change notification"
      payload: "{ type: 'leader_changed', timestamp: number }"

    status_request:
      description: "Status request from follower"
      payload: "{ type: 'status_request' }"
