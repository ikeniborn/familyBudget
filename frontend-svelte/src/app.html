<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    
    <!-- Prevent browser extension conflicts -->
    <script>
      // Защита от ошибок переопределения свойств расширениями браузера (TronLink, MetaMask и др.)
      (function() {
        // Предварительно резервируем свойства до загрузки расширений
        const protectedProps = ['sunWeb', 'tronWeb', 'ethereum', 'web3'];
        
        protectedProps.forEach(prop => {
          try {
            // Проверяем, не определено ли уже свойство
            const descriptor = Object.getOwnPropertyDescriptor(window, prop);
            
            if (!descriptor) {
              // Если свойство не существует, создаем его как configurable
              Object.defineProperty(window, prop, {
                configurable: true,
                writable: true,
                value: undefined
              });
            } else if (!descriptor.configurable && descriptor.value !== undefined) {
              // Если свойство существует и не configurable, пробуем переопределить
              try {
                delete window[prop];
                Object.defineProperty(window, prop, {
                  configurable: true,
                  writable: true,
                  value: descriptor.value
                });
              } catch (e) {
                // Игнорируем, если не можем переопределить
              }
            }
          } catch (e) {
            // Игнорируем ошибки определения свойств
            console.debug(`Обработка свойства ${prop}:`, e.message);
          }
        });
        
        // Перехватываем попытки переопределения свойств
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === window && protectedProps.includes(prop)) {
            try {
              // Делаем свойство configurable, если это возможно
              descriptor.configurable = true;
            } catch (e) {
              // Игнорируем если descriptor заморожен
            }
          }
          try {
            return originalDefineProperty.call(this, obj, prop, descriptor);
          } catch (e) {
            if (obj === window && protectedProps.includes(prop)) {
              console.debug(`Предотвращена ошибка переопределения ${prop}`);
              return obj;
            }
            throw e;
          }
        };
      })();
    </script>
    
    <!-- Basic meta tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Управление семейным бюджетом с планированием и контролем расходов" />
    <meta name="keywords" content="бюджет, семейный бюджет, финансы, планирование, расходы, доходы" />
    <meta name="author" content="Family Budget App" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA and mobile optimization -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="background-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FamilyBudget" />
    
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamilyBudget" />
    <!-- <link rel="apple-touch-icon" href="/icons/icon-192x192.png" /> -->
    <!-- <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" /> -->
    
    <!-- Icons and manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- <link rel="icon" type="image/png" href="/icons/icon-192x192.png" /> -->
    <!-- Временно отключен manifest из-за отсутствия иконок -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//api.familybudget.ru" />
    
    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    %sveltekit.head%
  </head>
  <body 
    data-sveltekit-preload-data="hover" 
    class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 touch-manipulation"
    style="overscroll-behavior: contain;"
  >
    <!-- Loading screen for PWA -->
    <div id="app-loading" class="fixed inset-0 bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center z-50">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-slate-600 font-medium">Загрузка FamilyBudget...</p>
      </div>
    </div>
    
    <div style="display: contents">%sveltekit.body%</div>
    
    <!-- Enhanced SvelteKit Warning Suppression (v3.7.5) - Browser Console Filter -->
    <script>
      // Runtime console filtering for SvelteKit internal prop warnings
      // Only active in development mode to preserve production logging
      (function() {
        'use strict';

        // Environment detection - only run in development
        const isDevelopment = (
          (typeof import !== 'undefined' && import.meta && import.meta.env && import.meta.env.DEV) ||
          (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'development') ||
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.port === '5173'
        );

        // Configuration
        const debugSuppression = (
          (typeof import !== 'undefined' && import.meta && import.meta.env && import.meta.env.VITE_DEBUG_WARNING_SUPPRESSION === 'true') ||
          (typeof process !== 'undefined' && process.env && process.env.DEBUG_WARNING_SUPPRESSION === 'true') ||
          localStorage.getItem('debug-warning-suppression') === 'true'
        );

        if (!isDevelopment) {
          if (debugSuppression) {
            console.debug('[CONSOLE FILTER] Production mode detected, console filtering disabled');
          }
          return;
        }

        // Comprehensive SvelteKit internal props list (synchronized with svelte.config.js)
        const svelteKitInternalProps = new Set([
          // Core SvelteKit props
          'params', 'route', 'url', 'status', 'error', 'form', 'data',
          // Navigation props
          'beforeNavigate', 'afterNavigate', 'invalidateAll', 'preloadData',
          'navigating', 'enhanced', 'shallow', 'keepFocus', 'noscroll',
          'replaceState', 'invalidate', 'goto', 'pushState', 'popState',
          // Store and state props
          'updated', 'page', 'stores', 'snapshot', 'state',
          // Advanced SvelteKit props
          'preloadCode', 'preloadData', 'reload', 'routeId', 'routeParams',
          'searchParams', 'hash', 'origin', 'pathname', 'search',
          // Service worker and offline props
          'serviceWorker', 'offline', 'online', 'connectivity',
          // Development and debugging props
          'dev', 'browser', 'building', 'version', 'base', 'assets',
          // Additional internal props found in SvelteKit 2.x
          'submitting', 'delayed', 'timeout', 'message', 'details'
        ]);

        // Performance-optimized warning detection patterns
        const warningPatterns = [
          // Primary patterns for component prop warnings
          /(?:Page|Component|\w+) was created with unknown prop '([^']+)'/i,
          /received an unexpected slot "([^"]+)"/i,
          /Unknown prop '([^']+)'/i,
          /'([^']+)' was exported/i,
          /prop '([^']+)' was passed to/i,
          // Secondary patterns for edge cases
          /created with unknown prop (\w+)/i,
          /unexpected prop '([^']+)'/i,
          /invalid prop '([^']+)'/i,
          /undeclared prop '([^']+)'/i,
          // Multi-prop patterns
          /created with unknown props? (?:'([^']+)'(?:,\s*'([^']+)')*)/i
        ];

        // Cache for performance optimization
        const warningCache = new Map();
        const maxCacheSize = 1000;

        // Statistics tracking (development only)
        let suppressedCount = 0;
        let totalWarnings = 0;
        let startTime = Date.now();

        // Enhanced warning detection function
        function shouldSuppressWarning(message) {
          // Check cache first for performance
          if (warningCache.has(message)) {
            return warningCache.get(message);
          }

          let shouldSuppress = false;

          // Test each pattern for matches
          for (const pattern of warningPatterns) {
            const match = message.match(pattern);
            if (match) {
              // Extract prop name(s) from the match
              const propName = match[1] || match[2] || match[3];
              if (propName && svelteKitInternalProps.has(propName)) {
                shouldSuppress = true;
                break;
              }

              // Handle multi-prop warnings
              const allMatches = message.match(/'([^']+)'/g) || [];
              if (allMatches.length > 0) {
                const allPropsInternal = allMatches.every(quotedProp => {
                  const cleanProp = quotedProp.replace(/'/g, '');
                  return svelteKitInternalProps.has(cleanProp);
                });
                if (allPropsInternal) {
                  shouldSuppress = true;
                  break;
                }
              }
            }
          }

          // Update cache with size limit
          if (warningCache.size >= maxCacheSize) {
            const firstKey = warningCache.keys().next().value;
            warningCache.delete(firstKey);
          }
          warningCache.set(message, shouldSuppress);

          return shouldSuppress;
        }

        // Store original console methods
        const originalWarn = console.warn;
        const originalError = console.error;

        // Enhanced console.warn override
        console.warn = function(...args) {
          totalWarnings++;

          // Convert arguments to string for analysis
          const message = args.map(arg =>
            typeof arg === 'string' ? arg :
            typeof arg === 'object' ? JSON.stringify(arg) :
            String(arg)
          ).join(' ');

          // Check if this warning should be suppressed
          if (shouldSuppressWarning(message)) {
            suppressedCount++;

            if (debugSuppression) {
              originalWarn.call(console, '[SUPPRESSED SVELTEKIT WARNING]', message.substring(0, 100) + (message.length > 100 ? '...' : ''));
            }
            return;
          }

          // For non-suppressed warnings, pass through normally
          return originalWarn.apply(console, args);
        };

        // Also filter console.error for SvelteKit warnings that might appear as errors
        console.error = function(...args) {
          const message = args.map(arg =>
            typeof arg === 'string' ? arg :
            typeof arg === 'object' ? JSON.stringify(arg) :
            String(arg)
          ).join(' ');

          // Only suppress SvelteKit prop warnings, let real errors through
          if (message.includes('was created with unknown prop') && shouldSuppressWarning(message)) {
            suppressedCount++;

            if (debugSuppression) {
              originalWarn.call(console, '[SUPPRESSED SVELTEKIT ERROR]', message.substring(0, 100) + (message.length > 100 ? '...' : ''));
            }
            return;
          }

          // Pass through all other errors
          return originalError.apply(console, args);
        };

        // Development statistics and debugging
        if (debugSuppression) {
          console.info('[CONSOLE FILTER] SvelteKit warning suppression active', {
            totalInternalProps: svelteKitInternalProps.size,
            patterns: warningPatterns.length,
            environment: 'development'
          });

          // Periodic statistics reporting
          setInterval(() => {
            const runtime = Math.round((Date.now() - startTime) / 1000);
            console.info('[CONSOLE FILTER] Statistics', {
              runtime: `${runtime}s`,
              totalWarnings,
              suppressedCount,
              suppressionRate: totalWarnings > 0 ? `${Math.round((suppressedCount / totalWarnings) * 100)}%` : '0%',
              cacheSize: warningCache.size
            });
          }, 30000); // Report every 30 seconds
        }

        // Cleanup function for development tools
        window.__svelteKitWarningSuppressionStats = function() {
          return {
            totalWarnings,
            suppressedCount,
            suppressionRate: totalWarnings > 0 ? Math.round((suppressedCount / totalWarnings) * 100) : 0,
            cacheSize: warningCache.size,
            internalProps: Array.from(svelteKitInternalProps).sort()
          };
        };

        // Reset function for testing
        window.__resetSvelteKitWarningStats = function() {
          suppressedCount = 0;
          totalWarnings = 0;
          warningCache.clear();
          startTime = Date.now();
          console.info('[CONSOLE FILTER] Statistics reset');
        };

      })();
    </script>

    <!-- Remove loading screen after app loads -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const loading = document.getElementById('app-loading');
        if (loading) {
          setTimeout(() => loading.remove(), 500);
        }
      });
    </script>
  </body>
</html>
