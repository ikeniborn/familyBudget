<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    
    <!-- Basic meta tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Управление семейным бюджетом с планированием и контролем расходов" />
    <meta name="keywords" content="бюджет, семейный бюджет, финансы, планирование, расходы, доходы" />
    <meta name="author" content="Family Budget App" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA and mobile optimization -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="background-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FamilyBudget" />
    
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FamilyBudget" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />
    
    <!-- Icons and manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//api.familybudget.ru" />
    
    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    %sveltekit.head%
  </head>
  <body 
    data-sveltekit-preload-data="hover" 
    class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 touch-manipulation"
    style="overscroll-behavior: contain;"
  >
    <!-- Loading screen for PWA -->
    <div id="app-loading" class="fixed inset-0 bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center z-50">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-slate-600 font-medium">Загрузка FamilyBudget...</p>
      </div>
    </div>
    
    <div style="display: contents">%sveltekit.body%</div>
    
    <!-- Remove loading screen after app loads -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const loading = document.getElementById('app-loading');
        if (loading) {
          setTimeout(() => loading.remove(), 500);
        }
      });
    </script>
  </body>
</html>
