<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Budget</title>
    <script>
      // Protect against browser extension conflicts
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('sunWeb')) {
          e.preventDefault();
          console.warn('Prevented sunWeb error from browser extension');
          return false;
        }
      });
      
      // Try to prevent the error before it happens
      try {
        if (typeof window.sunWeb !== 'undefined') {
          Object.defineProperty(window, 'sunWeb', {
            value: window.sunWeb,
            writable: true,
            configurable: true
          });
        }
      } catch (err) {
        console.warn('sunWeb already defined by browser extension');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
