<!-- Fixed Bottom Navigation (Compact Icons) -->
<nav id="fab-toolbar" class="bottom-nav">
    <div class="nav-container">

        <!-- Button 1: Факт -->
        <button class="icon-btn"
                onclick="openAddTransactionModal()"
                aria-label="Добавить транзакцию"
                title="Добавить факт">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="icon-label">Факт</span>
        </button>

        <!-- Button 2: Перевод -->
        <button class="icon-btn"
                onclick="openFactTransferModal()"
                aria-label="Добавить перевод"
                title="Перевод между счетами">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
            <span class="icon-label">Перевод</span>
        </button>

        <!-- Button 3: Добавить (Center FAB) -->
        <button class="icon-btn"
                onclick="openAddTransactionModal()"
                aria-label="Быстрое добавление"
                title="Добавить транзакцию">
            <div class="center-fab">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
            </div>
            <span class="icon-label" style="margin-top: 0.25rem;">Добавить</span>
        </button>

        <!-- Button 4: План -->
        <button class="icon-btn"
                onclick="openAddPlanModal()"
                aria-label="Добавить план"
                title="Добавить план расходов/доходов">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="icon-label">План</span>
        </button>

        <!-- Button 5: Списки -->
        <a href="/lists"
           class="icon-btn"
           aria-label="Перейти к спискам"
           title="Списки покупок">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <span class="icon-label">Списки</span>
        </a>

    </div>
</nav>

<script>
(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) return;

    console.log('[FAB_TOOLBAR] Compact Icons navigation initialized:', {
        page: window.location.pathname,
        buttonsCount: fabToolbar.querySelectorAll('.icon-btn').length,
        style: 'compact-icons',
        position: 'fixed bottom',
        safeAreaBottom: getComputedStyle(fabToolbar).paddingBottom,
        zIndex: getComputedStyle(fabToolbar).zIndex
    });

    // Log button clicks
    fabToolbar.querySelectorAll('.icon-btn').forEach((btn, index) => {
        btn.addEventListener('click', (e) => {
            const buttonLabel = btn.getAttribute('aria-label') || btn.querySelector('.icon-label')?.textContent;
            console.log(`[FAB_TOOLBAR] Button clicked:`, {
                index,
                label: buttonLabel,
                timestamp: new Date().toISOString()
            });
        });
    });

    // Active state management (highlight current page)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && currentPath.startsWith(href)) {
            btn.classList.add('active');
        }
    });
})();
</script>
