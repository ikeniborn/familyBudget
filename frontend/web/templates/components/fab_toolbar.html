<script>
(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) {
        console.log('[FAB_TOOLBAR] Navigation hidden: User not authenticated');
        return;
    }

    // Detect display mode (mobile vs desktop)
    const isDesktop = window.innerWidth >= 1024;
    const mode = isDesktop ? 'desktop-fab' : 'mobile-nav';

    console.log('[FAB_TOOLBAR] Enhanced navigation initialized:', {
        page: window.location.pathname,
        mode: mode,
        deviceType: isDesktop ? 'desktop' : (window.innerWidth >= 768 ? 'tablet' : 'mobile'),
        buttonsCount: isDesktop
            ? 1  // Desktop: only FAB button
            : fabToolbar.querySelectorAll('.mobile-nav-wrapper .icon-btn, .mobile-nav-wrapper .dropdown').length,
        fabSize: isDesktop
            ? (window.innerWidth >= 1280 ? '64px' : '56px')
            : 'N/A',
        offlineMode: document.documentElement.classList.contains('offline-mode'),
        style: isDesktop ? 'material-design-fab' : 'dropdown-enhanced',
        position: isDesktop ? 'fixed bottom-right' : 'fixed bottom',
        safeAreaBottom: getComputedStyle(fabToolbar).paddingBottom,
        zIndex: getComputedStyle(fabToolbar).zIndex,
        userAuthenticated: true
    });

    // Desktop FAB: event handlers
    const desktopFabBtn = document.getElementById('desktop-fab-btn');
    if (desktopFabBtn) {
        desktopFabBtn.addEventListener('click', (e) => {
            const dropdown = e.currentTarget.closest('.dropdown');
            const isOpen = dropdown?.classList.contains('dropdown-open');

            console.log('[FAB_TOOLBAR] Desktop FAB clicked:', {
                timestamp: new Date().toISOString(),
                dropdownOpen: isOpen,
                action: 'toggle-menu'
            });
        });

        // Log menu item clicks
        document.querySelectorAll('.desktop-fab-wrapper .dropdown-content a').forEach((menuItem, index) => {
            menuItem.addEventListener('click', (e) => {
                const actionText = e.currentTarget.querySelector('span')?.textContent;

                console.log('[FAB_TOOLBAR] Desktop FAB menu item clicked:', {
                    index,
                    action: actionText,
                    timestamp: new Date().toISOString()
                });
            });
        });
    }

    // Offline mode: hide buttons with data-online-only (mobile only)
    function updateOfflineVisibility() {
        const isOffline = document.documentElement.classList.contains('offline-mode');

        // Only for mobile wrapper
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const onlineOnlyElements = mobileWrapper?.querySelectorAll('[data-online-only]');

        onlineOnlyElements?.forEach(el => {
            if (isOffline) {
                el.style.display = 'none';
                console.log('[FAB_TOOLBAR] Hidden in offline:', el.getAttribute('aria-label') || el.querySelector('.icon-label')?.textContent);
            } else {
                el.style.display = '';
            }
        });

        console.log('[FAB_TOOLBAR] Offline visibility updated:', {
            isOffline,
            mode: mode,
            hiddenCount: isOffline ? (onlineOnlyElements?.length || 0) : 0,
            affectedMode: 'mobile-only'
        });
    }

    // Initial offline check
    updateOfflineVisibility();

    // Watch for offline mode changes
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
                updateOfflineVisibility();
            }
        });
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Special logic for /lists page: center FAB adapts to context
    if (window.location.pathname === '/lists') {
        const centerFabBtn = document.getElementById('center-fab-btn');
        const centerFabDropdown = centerFabBtn?.closest('.dropdown');

        if (centerFabDropdown) {
            // Check if we're in detail view (viewing list items) or landing view (list selection)
            const checkListContext = () => {
                const detailView = document.getElementById('detail-view');
                const landingView = document.getElementById('landing-view');

                // detail-view is active if it doesn't have 'hidden' class
                const isDetailView = detailView && !detailView.classList.contains('hidden');

                console.log('[FAB_TOOLBAR] View check:', {
                    detailViewExists: !!detailView,
                    landingViewExists: !!landingView,
                    detailViewHidden: detailView?.classList.contains('hidden'),
                    isDetailView: isDetailView
                });

                return isDetailView;
            };

            // Replace dropdown with direct action
            centerFabBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                if (checkListContext()) {
                    // In detail view (list items) → add new item
                    console.log('[FAB_TOOLBAR] /lists context: Detail view - Adding item to active list');
                    if (typeof openAddItemModal === 'function') {
                        openAddItemModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openAddItemModal not found');
                    }
                } else {
                    // In landing view (list selection) → create new list
                    console.log('[FAB_TOOLBAR] /lists context: Landing view - Creating new list');
                    if (typeof openCreateListModal === 'function') {
                        openCreateListModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openCreateListModal not found');
                    }
                }
            };

            // Remove dropdown functionality on /lists
            centerFabDropdown.classList.remove('dropdown');
            const dropdownMenu = centerFabDropdown.querySelector('.dropdown-content');
            if (dropdownMenu) dropdownMenu.remove();

            console.log('[FAB_TOOLBAR] /lists page: Mobile center FAB adapted for context-aware behavior');
        }

        // Desktop FAB adaptation for /lists (NEW)
        const desktopFabBtn = document.getElementById('desktop-fab-btn');
        const desktopFabDropdown = desktopFabBtn?.closest('.dropdown');

        if (desktopFabDropdown && window.innerWidth >= 1024) {
            desktopFabBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                const checkListContext = () => {
                    const detailView = document.getElementById('detail-view');
                    return detailView && !detailView.classList.contains('hidden');
                };

                if (checkListContext()) {
                    console.log('[FAB_TOOLBAR] Desktop FAB /lists: Adding item to active list');
                    if (typeof openAddItemModal === 'function') {
                        openAddItemModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openAddItemModal not found');
                    }
                } else {
                    console.log('[FAB_TOOLBAR] Desktop FAB /lists: Creating new list');
                    if (typeof openCreateListModal === 'function') {
                        openCreateListModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openCreateListModal not found');
                    }
                }
            };

            // Remove dropdown on /lists
            desktopFabDropdown.classList.remove('dropdown');
            const dropdownMenu = desktopFabDropdown.querySelector('.dropdown-content');
            if (dropdownMenu) dropdownMenu.remove();

            console.log('[FAB_TOOLBAR] Desktop FAB /lists: Adapted for context-aware behavior');
        }
    }

    // Log button clicks (mobile nav only)
    fabToolbar.querySelectorAll('.mobile-nav-wrapper .icon-btn, .mobile-nav-wrapper .dropdown button').forEach((btn, index) => {
        btn.addEventListener('click', (e) => {
            const buttonLabel = btn.getAttribute('aria-label') || btn.querySelector('.icon-label')?.textContent;
            console.log(`[FAB_TOOLBAR] Button clicked:`, {
                index,
                label: buttonLabel,
                timestamp: new Date().toISOString()
            });
        });
    });

    // Active state management (highlight current page - mobile nav only)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.mobile-nav-wrapper a.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
            btn.classList.add('active');
        }
    });

    console.log('[FAB_TOOLBAR] Initialization complete');
})();
</script>
