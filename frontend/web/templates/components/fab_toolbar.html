<script>
// ============================================================
// FAB Navigation - Global Functions & Page Context Logic
// ============================================================

// Page context for FAB visibility
// 'lists' = special mode (no menu, direct action based on context)
const FAB_PAGE_CONTEXT = {
    '/': ['fact-transaction', 'fact-transfer', 'plan-transaction', 'plan-transfer'],
    '/facts': ['fact-transaction', 'fact-transfer'],
    '/plan': ['plan-transaction', 'plan-transfer'],
    '/lists': 'lists'  // Special mode - no speed dial, direct action
    // /analytics - not in list = FAB hidden
};

// Toggle Desktop FAB (defined globally for cached HTML compatibility)
window.toggleDesktopFAB = function() {
    const wrapper = document.querySelector('.desktop-fab-wrapper');
    const backdrop = document.getElementById('desktop-fab-backdrop');
    const fabBtn = document.getElementById('desktop-fab-btn');

    if (!wrapper || !backdrop) {
        console.warn('[FAB_TOOLBAR] Desktop FAB elements not found');
        return;
    }

    const isOpen = wrapper.classList.contains('open');

    if (isOpen) {
        // Close FAB
        wrapper.classList.remove('open');
        wrapper.classList.add('closed');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        if (fabBtn) fabBtn.setAttribute('aria-expanded', 'false');
    } else {
        // Open FAB
        wrapper.classList.remove('closed');
        wrapper.classList.add('open');
        backdrop.classList.remove('hidden');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100');
        if (fabBtn) fabBtn.setAttribute('aria-expanded', 'true');
    }
};

// Toggle Mobile FAB (no backdrop)
window.toggleMobileFAB = function() {
    const wrapper = document.getElementById('mobile-fab-wrapper');
    const btn = document.getElementById('mobile-fab-btn');

    if (!wrapper) return;

    const isOpen = wrapper.classList.contains('open');

    if (isOpen) {
        wrapper.classList.remove('open');
        btn?.setAttribute('aria-expanded', 'false');
    } else {
        wrapper.classList.add('open');
        btn?.setAttribute('aria-expanded', 'true');
    }
};

(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) return;

    const BREAKPOINT = 1024;

    // Apply page context to both Mobile and Desktop FAB
    function applyFabPageContext() {
        const currentPage = window.location.pathname;
        const pageConfig = FAB_PAGE_CONTEXT[currentPage];

        // Mobile FAB elements
        const mobileFabWrapper = document.getElementById('mobile-fab-wrapper');
        const mobileFabBtn = document.getElementById('mobile-fab-btn');
        const mobileFabMenu = document.getElementById('mobile-fab-menu');

        // Desktop FAB elements
        const desktopFabWrapper = document.querySelector('.desktop-fab-wrapper');
        const desktopBackdrop = document.getElementById('desktop-fab-backdrop');

        // No config = hide FAB (e.g., /analytics)
        if (!pageConfig) {
            if (mobileFabWrapper) mobileFabWrapper.style.display = 'none';
            if (desktopFabWrapper) desktopFabWrapper.style.display = 'none';
            if (desktopBackdrop) desktopBackdrop.style.display = 'none';
            return;
        }

        // Special mode for /lists - direct action, no menu
        if (pageConfig === 'lists') {
            // Hide desktop FAB on /lists (uses own implementation)
            if (desktopFabWrapper) desktopFabWrapper.style.display = 'none';
            if (desktopBackdrop) desktopBackdrop.style.display = 'none';

            // Show mobile FAB but without menu
            if (mobileFabWrapper) {
                mobileFabWrapper.style.display = '';
                if (mobileFabMenu) mobileFabMenu.style.display = 'none';

                // Override click handler for direct action
                if (mobileFabBtn) {
                    mobileFabBtn.onclick = function(e) {
                        e.preventDefault();
                        const detailView = document.getElementById('detail-view');
                        const isDetailView = detailView && !detailView.classList.contains('hidden');

                        if (isDetailView) {
                            // Inside a list → add item
                            if (typeof openAddItemModal === 'function') {
                                openAddItemModal();
                            }
                        } else {
                            // List of lists → create list
                            if (typeof openCreateListModal === 'function') {
                                openCreateListModal();
                            }
                        }
                    };
                }
            }
            return;
        }

        // Standard mode - show FAB with speed dial menu
        if (mobileFabWrapper) mobileFabWrapper.style.display = '';
        if (mobileFabMenu) mobileFabMenu.style.display = '';

        // Desktop visibility controlled by CSS @media, but ensure it's not hidden
        if (desktopFabWrapper) desktopFabWrapper.style.display = '';
        if (desktopBackdrop) desktopBackdrop.style.display = '';

        // Hide/show individual menu items based on page context
        document.querySelectorAll('[data-fab-action]').forEach(item => {
            const action = item.dataset.fabAction;
            item.style.display = pageConfig.includes(action) ? '' : 'none';
        });
    }

    // Run on page load
    applyFabPageContext();

    // Close mobile FAB when clicking outside (only for pages with menu)
    document.addEventListener('click', function(e) {
        const currentPage = window.location.pathname;
        if (FAB_PAGE_CONTEXT[currentPage] === 'lists') return;

        const mobileFabWrapper = document.getElementById('mobile-fab-wrapper');
        if (mobileFabWrapper?.classList.contains('open')) {
            if (!mobileFabWrapper.contains(e.target)) {
                window.toggleMobileFAB();
            }
        }
    });

    // Resize listener: handle mode switching
    let resizeTimeout;
    let currentMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            const newMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

            if (newMode !== currentMode) {
                currentMode = newMode;

                const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
                const mobileFabWrapper = document.getElementById('mobile-fab-wrapper');
                const desktopWrapper = document.querySelector('.desktop-fab-wrapper');
                const desktopBackdrop = document.getElementById('desktop-fab-backdrop');

                if (newMode === 'desktop') {
                    // Hide mobile elements
                    if (mobileWrapper) {
                        mobileWrapper.style.display = 'none';
                        mobileWrapper.style.visibility = 'hidden';
                    }
                    if (mobileFabWrapper) {
                        mobileFabWrapper.style.display = 'none';
                        mobileFabWrapper.classList.remove('open');
                    }

                    // Re-apply page context for desktop
                    applyFabPageContext();
                } else {
                    // Show mobile elements
                    if (mobileWrapper) {
                        mobileWrapper.style.display = '';
                        mobileWrapper.style.visibility = '';
                    }

                    // Hide desktop FAB
                    if (desktopWrapper) {
                        desktopWrapper.style.display = 'none';
                        desktopWrapper.classList.remove('open');
                        desktopWrapper.classList.add('closed');
                    }
                    if (desktopBackdrop) {
                        desktopBackdrop.classList.add('hidden');
                        desktopBackdrop.classList.remove('opacity-100');
                        desktopBackdrop.classList.add('opacity-0', 'pointer-events-none');
                    }

                    // Re-apply page context for mobile
                    applyFabPageContext();
                }
            }
        }, 200);
    });

    // Desktop FAB: Auto-close on menu item click
    const desktopFabWrapper = document.querySelector('.desktop-fab-wrapper');
    if (desktopFabWrapper) {
        document.querySelectorAll('.desktop-fab-wrapper .fab-menu-item button').forEach(menuItem => {
            menuItem.addEventListener('click', () => {
                setTimeout(() => {
                    if (desktopFabWrapper.classList.contains('open')) {
                        window.toggleDesktopFAB();
                    }
                }, 100);
            });
        });

        // Auto-close FAB when any modal opens
        const modalObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'open') {
                    const modal = mutation.target;
                    if (modal.hasAttribute('open') && desktopFabWrapper.classList.contains('open')) {
                        window.toggleDesktopFAB();
                    }
                }
            });
        });

        document.querySelectorAll('dialog.modal').forEach(modal => {
            modalObserver.observe(modal, { attributes: true });
        });
    }

    // Offline mode: hide buttons with data-online-only (mobile nav only)
    function updateOfflineVisibility() {
        const isOffline = document.documentElement.classList.contains('offline-mode');
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const onlineOnlyElements = mobileWrapper?.querySelectorAll('[data-online-only]');

        onlineOnlyElements?.forEach(el => {
            el.style.display = isOffline ? 'none' : '';
        });
    }

    updateOfflineVisibility();

    const offlineObserver = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
                updateOfflineVisibility();
            }
        });
    });
    offlineObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Active state management (highlight current page - mobile nav only)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.mobile-nav-wrapper a.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
            btn.classList.add('active');
        }
    });

})();
</script>
