<!-- Adaptive FAB Navigation: Mobile = Bottom nav | Desktop = Floating button -->
<nav id="fab-toolbar" class="fab-container">

    <!-- Mobile/Tablet Navigation (< 1024px) -->
    <div class="mobile-nav-wrapper">
        <div class="nav-container">

        <!-- Button 1: Главная -->
        <a href="/"
           class="icon-btn"
           data-nav-item
           aria-label="Перейти на главную"
           title="Главная страница">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="icon-label">Главная</span>
        </a>

        <!-- Button 2: Аналитика (hidden in offline) -->
        <a href="/analytics"
           class="icon-btn"
           data-nav-item
           data-online-only
           aria-label="Перейти к аналитике"
           title="Аналитика и отчеты">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span class="icon-label">Аналитика</span>
        </a>

        <!-- Button 3: Факт (direct link, hidden in offline) -->
        <a href="/facts"
           class="icon-btn"
           data-nav-item
           data-online-only
           aria-label="Перейти к фактам"
           title="Фактические данные">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="icon-label">Факт</span>
        </a>

        <!-- Button 4: План (direct link, hidden in offline) -->
        <a href="/plan"
           class="icon-btn"
           data-nav-item
           data-online-only
           aria-label="Перейти к планам"
           title="Плановые данные">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="icon-label">План</span>
        </a>

        <!-- Button 5: Списки -->
        <a href="/lists"
           class="icon-btn"
           data-nav-item
           aria-label="Перейти к спискам"
           title="Списки покупок">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <span class="icon-label">Списки</span>
        </a>

        </div> <!-- .nav-container -->
    </div> <!-- .mobile-nav-wrapper -->

    <!-- Simplified Universal FAB Button (shown on /, /facts, /plan) -->
    <div class="fab-wrapper" id="fab-wrapper">
        <button
            onclick="openContextModal()"
            class="fab-button btn btn-circle btn-primary shadow-lg"
            id="fab-btn"
            aria-label="Добавить запись"
            title="Добавить запись">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
        </button>
    </div>

</nav>

<script>
// ============================================================
// FAB Navigation - Simplified (v9.0)
// ============================================================

// Page context for FAB visibility
const FAB_PAGE_CONTEXT = {
    '/': 'fact',        // Open modal_fact on home page
    '/facts': 'fact',   // Open modal_fact on facts page
    '/plan': 'plan',    // Open modal_plan on plan page
    '/lists': 'lists'   // Special mode (handled by lists module)
    // /analytics - not in list = FAB hidden
};

(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) return;

    const BREAKPOINT = 1024;
    const currentPage = window.location.pathname;
    const context = FAB_PAGE_CONTEXT[currentPage];

    // Apply page context to FAB visibility
    function applyFabPageContext() {
        const fabWrapper = document.getElementById('fab-wrapper');
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');

        if (!context || context === 'lists') {
            // Hide FAB on /lists and unlisted pages (e.g., /analytics)
            if (fabWrapper) fabWrapper.style.display = 'none';
        } else {
            // Show FAB on /, /facts, /plan
            if (fabWrapper) fabWrapper.style.display = '';
        }

        // Mobile navigation always visible (except offline mode adjustments)
        if (mobileWrapper) {
            mobileWrapper.style.display = '';
        }
    }

    // Run on page load
    applyFabPageContext();

    // Resize listener: handle mobile nav visibility
    let resizeTimeout;
    let currentMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            const newMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

            if (newMode !== currentMode) {
                currentMode = newMode;

                const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');

                if (newMode === 'desktop') {
                    // Hide mobile bottom navigation
                    if (mobileWrapper) {
                        mobileWrapper.style.display = 'none';
                        mobileWrapper.style.visibility = 'hidden';
                    }
                } else {
                    // Show mobile bottom navigation
                    if (mobileWrapper) {
                        mobileWrapper.style.display = '';
                        mobileWrapper.style.visibility = '';
                    }
                }

                // Re-apply FAB visibility
                applyFabPageContext();
            }
        }, 200);
    });

    // Offline mode: hide buttons with data-online-only (mobile nav only)
    function updateOfflineVisibility() {
        const isOffline = document.documentElement.classList.contains('offline-mode');
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const onlineOnlyElements = mobileWrapper?.querySelectorAll('[data-online-only]');

        onlineOnlyElements?.forEach(el => {
            el.style.display = isOffline ? 'none' : '';
        });
    }

    updateOfflineVisibility();

    const offlineObserver = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
                updateOfflineVisibility();
            }
        });
    });
    offlineObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Active state management (highlight current page - mobile nav only)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.mobile-nav-wrapper a.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
            btn.classList.add('active');
        }
    });

})();
</script>
