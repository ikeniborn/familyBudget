<script>
// ============================================================
// FAB Navigation - Simplified (v9.0)
// ============================================================

// Page context for FAB visibility
const FAB_PAGE_CONTEXT = {
    '/': 'fact',        // Open modal_fact on home page
    '/facts': 'fact',   // Open modal_fact on facts page
    '/plan': 'plan',    // Open modal_plan on plan page
    '/lists': 'lists'   // Special mode (handled by lists module)
    // /analytics - not in list = FAB hidden
};

(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) return;

    const BREAKPOINT = 1024;
    const currentPage = window.location.pathname;
    const context = FAB_PAGE_CONTEXT[currentPage];

    // Apply page context to FAB visibility
    function applyFabPageContext() {
        const mobileFabWrapper = document.getElementById('fab-wrapper');
        const desktopFabWrapper = document.getElementById('desktop-fab-wrapper');
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const isDesktop = window.innerWidth >= BREAKPOINT;

        if (!context || context === 'lists') {
            // Hide FAB on /lists and unlisted pages (e.g., /analytics)
            if (mobileFabWrapper) {
                mobileFabWrapper.style.display = 'none';
                mobileFabWrapper.style.visibility = 'hidden';
                mobileFabWrapper.style.pointerEvents = 'none';
            }
            if (desktopFabWrapper) {
                desktopFabWrapper.style.display = 'none';
                desktopFabWrapper.style.visibility = 'hidden';
                desktopFabWrapper.style.pointerEvents = 'none';
            }
        } else {
            // Show appropriate FAB on /, /facts, /plan
            if (isDesktop) {
                // Desktop: show desktop FAB, hide mobile FAB
                if (desktopFabWrapper) {
                    desktopFabWrapper.style.display = 'block';
                    desktopFabWrapper.style.visibility = 'visible';
                    desktopFabWrapper.style.pointerEvents = 'auto';
                }
                if (mobileFabWrapper) {
                    mobileFabWrapper.style.display = 'none';
                    mobileFabWrapper.style.visibility = 'hidden';
                    mobileFabWrapper.style.pointerEvents = 'none';
                }
            } else {
                // Mobile: show mobile FAB, hide desktop FAB
                if (mobileFabWrapper) {
                    mobileFabWrapper.style.display = 'block';
                    mobileFabWrapper.style.visibility = 'visible';
                    mobileFabWrapper.style.pointerEvents = 'auto';
                    mobileFabWrapper.style.opacity = '1';
                }
                if (desktopFabWrapper) {
                    desktopFabWrapper.style.display = 'none';
                    desktopFabWrapper.style.visibility = 'hidden';
                    desktopFabWrapper.style.pointerEvents = 'none';
                }
            }
        }

        // Mobile navigation always visible (except offline mode adjustments)
        if (mobileWrapper) {
            mobileWrapper.style.display = '';
        }
    }

    // Run on page load
    applyFabPageContext();

    // Resize listener: handle mobile nav visibility
    let resizeTimeout;
    let currentMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            const newMode = window.innerWidth >= BREAKPOINT ? 'desktop' : 'mobile';

            if (newMode !== currentMode) {
                currentMode = newMode;

                const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');

                if (newMode === 'desktop') {
                    // Hide mobile bottom navigation
                    if (mobileWrapper) {
                        mobileWrapper.style.display = 'none';
                        mobileWrapper.style.visibility = 'hidden';
                    }
                } else {
                    // Show mobile bottom navigation
                    if (mobileWrapper) {
                        mobileWrapper.style.display = '';
                        mobileWrapper.style.visibility = '';
                    }
                }

                // Re-apply FAB visibility
                applyFabPageContext();
            }
        }, 200);
    });

    // Offline mode: hide buttons with data-online-only (mobile nav only)
    function updateOfflineVisibility() {
        const isOffline = document.documentElement.classList.contains('offline-mode');
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const onlineOnlyElements = mobileWrapper?.querySelectorAll('[data-online-only]');

        onlineOnlyElements?.forEach(el => {
            el.style.display = isOffline ? 'none' : '';
        });
    }

    updateOfflineVisibility();

    const offlineObserver = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
                updateOfflineVisibility();
            }
        });
    });
    offlineObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Active state management (highlight current page - mobile nav only)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.mobile-nav-wrapper a.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
            btn.classList.add('active');
        }
    });

})();

// ============= Speed Dial Controls =============

/**
 * Безопасный вызов openContextModal (защита от timing issues)
 */
function safeOpenContextModal() {
    // Приоритет 1: Dashboard module
    if (typeof window.Dashboard !== 'undefined' && window.Dashboard.openContextModal) {
        try {
            window.Dashboard.openContextModal();
            return;
        } catch (error) {
            console.error('[FAB] Dashboard.openContextModal failed:', error);
        }
    }

    // Приоритет 2: Global openContextModal
    if (typeof window.openContextModal === 'function') {
        try {
            window.openContextModal();
            return;
        } catch (error) {
            console.error('[FAB] window.openContextModal failed:', error);
        }
    }

    // Fallback: Прямой вызов модальных окон
    const currentPage = window.location.pathname;
    if (currentPage === '/plan') {
        if (typeof window.openModalPlan === 'function') {
            window.openModalPlan();
        } else {
            console.error('[FAB] openModalPlan not available');
            showFallbackError();
        }
    } else {
        // По умолчанию - modal_fact (для / и /facts)
        if (typeof window.openModalFact === 'function') {
            window.openModalFact();
        } else {
            console.error('[FAB] openModalFact not available');
            showFallbackError();
        }
    }
}

/**
 * Показать ошибку если модальные функции недоступны
 */
function showFallbackError() {
    if (typeof showToast === 'function') {
        showToast('Функция временно недоступна. Попробуйте обновить страницу.', 'error');
    } else {
        alert('Функция временно недоступна. Попробуйте обновить страницу.');
    }
}

/**
 * Переключает Speed Dial меню (только на главной странице)
 */
function toggleFabMenu() {
    const currentPage = window.location.pathname;
    const wrapper = document.getElementById('fab-wrapper');
    const menu = document.getElementById('fab-speed-dial-menu');

    if (!wrapper || !menu) {
        console.error('[FAB] Speed dial elements not found');
        return;
    }

    // Speed dial только на главной странице
    if (currentPage === '/') {
        const isOpen = wrapper.classList.contains('open');

        if (isOpen) {
            // Закрыть меню
            wrapper.classList.remove('open');
            menu.style.display = 'none';
        } else {
            // Открыть меню
            wrapper.classList.add('open');
            menu.style.display = 'flex';
        }
    } else {
        // На других страницах - прямой вызов модального окна
        safeOpenContextModal();
    }
}

/**
 * Закрывает Speed Dial меню
 */
function closeFabMenu() {
    const wrapper = document.getElementById('fab-wrapper');
    const menu = document.getElementById('fab-speed-dial-menu');

    if (wrapper && menu) {
        wrapper.classList.remove('open');
        menu.style.display = 'none';
    }
}

/**
 * Инициализация Speed Dial при загрузке страницы
 */
(function initSpeedDial() {
    const currentPage = window.location.pathname;
    const mobileMenu = document.getElementById('fab-speed-dial-menu');
    const mobileFabBtn = document.getElementById('fab-btn');
    const desktopWrapper = document.getElementById('desktop-fab-wrapper');
    const desktopFabBtn = document.getElementById('desktop-fab-btn');

    // Mobile FAB initialization
    if (mobileMenu && mobileFabBtn) {
        mobileFabBtn.removeAttribute('onclick');

        if (mobileFabBtn.dataset.listenerAttached === 'true') {
            return;
        }

        if (currentPage === '/') {
            mobileMenu.style.display = 'none';
            mobileFabBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                toggleFabMenu();
            });
        } else {
            mobileMenu.style.display = 'none';
            mobileFabBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                safeOpenContextModal();
            });
        }

        mobileFabBtn.dataset.listenerAttached = 'true';
    }

    // Mobile Speed Dial menu buttons initialization
    if (currentPage === '/' && mobileMenu) {
        const mobileFactBtn = mobileMenu.querySelector('.mobile-fab-item button[onclick*="openModalFact"]');
        const mobilePlanBtn = mobileMenu.querySelector('.mobile-fab-item button[onclick*="openModalPlan"]');

        if (mobileFactBtn && mobileFactBtn.dataset.listenerAttached !== 'true') {
            mobileFactBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();

                if (typeof window.openModalFact === 'function') {
                    window.openModalFact();
                    closeFabMenu();
                } else {
                    console.error('[FAB] window.openModalFact not available');
                    if (typeof showToast === 'function') {
                        showToast('Функция временно недоступна. Попробуйте обновить страницу.', 'error');
                    }
                }
            });
            mobileFactBtn.dataset.listenerAttached = 'true';
        }

        if (mobilePlanBtn && mobilePlanBtn.dataset.listenerAttached !== 'true') {
            mobilePlanBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();

                if (typeof window.openModalPlan === 'function') {
                    window.openModalPlan();
                    closeFabMenu();
                } else {
                    console.error('[FAB] window.openModalPlan not available');
                    if (typeof showToast === 'function') {
                        showToast('Функция временно недоступна. Попробуйте обновить страницу.', 'error');
                    }
                }
            });
            mobilePlanBtn.dataset.listenerAttached = 'true';
        }
    }

    // Desktop FAB initialization
    if (desktopWrapper && desktopFabBtn) {
        const backdrop = document.getElementById('desktop-fab-backdrop');
        desktopFabBtn.removeAttribute('onclick');

        if (desktopFabBtn.dataset.listenerAttached === 'true') {
            return;
        }

        if (currentPage === '/') {
            desktopWrapper.classList.add('closed');
            desktopWrapper.classList.remove('open');
            if (backdrop) backdrop.style.display = 'none';

            desktopFabBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                toggleDesktopFabMenu();
            });
        } else {
            desktopWrapper.classList.add('closed');
            desktopWrapper.classList.remove('open');
            if (backdrop) backdrop.style.display = 'none';

            const menuItems = desktopWrapper.querySelectorAll('.fab-menu-item');
            menuItems.forEach(item => item.style.display = 'none');

            desktopFabBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();
                safeOpenContextModal();
            });
        }

        desktopFabBtn.dataset.listenerAttached = 'true';
    }

    // Desktop Speed Dial menu buttons initialization
    if (currentPage === '/' && desktopWrapper) {
        const desktopFactBtn = desktopWrapper.querySelector('.fab-menu-item button[onclick*="openModalFact"]');
        const desktopPlanBtn = desktopWrapper.querySelector('.fab-menu-item button[onclick*="openModalPlan"]');

        if (desktopFactBtn && desktopFactBtn.dataset.listenerAttached !== 'true') {
            desktopFactBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();

                if (typeof window.openModalFact === 'function') {
                    window.openModalFact();
                    if (typeof window.closeDesktopFabMenu === 'function') {
                        window.closeDesktopFabMenu();
                    }
                } else {
                    console.error('[FAB] window.openModalFact not available');
                    if (typeof showToast === 'function') {
                        showToast('Функция временно недоступна. Попробуйте обновить страницу.', 'error');
                    }
                }
            });
            desktopFactBtn.dataset.listenerAttached = 'true';
        }

        if (desktopPlanBtn && desktopPlanBtn.dataset.listenerAttached !== 'true') {
            desktopPlanBtn.addEventListener('click', function(event) {
                event.preventDefault();
                event.stopPropagation();

                if (typeof window.openModalPlan === 'function') {
                    window.openModalPlan();
                    if (typeof window.closeDesktopFabMenu === 'function') {
                        window.closeDesktopFabMenu();
                    }
                } else {
                    console.error('[FAB] window.openModalPlan not available');
                    if (typeof showToast === 'function') {
                        showToast('Функция временно недоступна. Попробуйте обновить страницу.', 'error');
                    }
                }
            });
            desktopPlanBtn.dataset.listenerAttached = 'true';
        }
    }
})();

// Закрытие меню при клике вне FAB (mobile)
document.addEventListener('click', function(event) {
    const wrapper = document.getElementById('fab-wrapper');
    const menu = document.getElementById('fab-speed-dial-menu');

    if (!wrapper || !menu) return;

    // Если клик вне FAB и меню открыто - закрыть
    if (!wrapper.contains(event.target) && wrapper.classList.contains('open')) {
        closeFabMenu();
    }
});

// Keyboard navigation: Escape key closes FAB menu
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' || event.keyCode === 27) {
        // Close mobile FAB menu
        const mobileWrapper = document.getElementById('fab-wrapper');
        const mobileMenu = document.getElementById('fab-speed-dial-menu');
        if (mobileWrapper && mobileMenu && mobileWrapper.classList.contains('open')) {
            closeFabMenu();
            event.preventDefault();
        }

        // Close desktop FAB menu
        const desktopWrapper = document.getElementById('desktop-fab-wrapper');
        if (desktopWrapper && desktopWrapper.classList.contains('open')) {
            closeDesktopFabMenu();
            event.preventDefault();
        }
    }
});

// ============= Desktop Speed Dial Controls =============
// NOTE: toggleDesktopFabMenu() and closeDesktopFabMenu() are defined in
// frontend/web/static/js/components/desktopFab.ts and exported to window
// for onclick handlers. Global click listener for closing menu on outside
// click is also handled by desktopFab.ts module.
</script>
