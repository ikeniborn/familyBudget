<script>
// Define toggleDesktopFAB globally even if fab-toolbar is not present
// This prevents "function not found" errors from cached HTML
window.toggleDesktopFAB = function() {
    const wrapper = document.querySelector('.desktop-fab-wrapper');
    const backdrop = document.getElementById('desktop-fab-backdrop');
    const fabBtn = document.getElementById('desktop-fab-btn');

    if (!wrapper || !backdrop) {
        console.warn('[FAB_TOOLBAR] Desktop FAB elements not found - function called but elements missing');
        return;
    }

    const isOpen = wrapper.classList.contains('open');

    if (isOpen) {
        // Close FAB
        wrapper.classList.remove('open');
        wrapper.classList.add('closed');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        if (fabBtn) fabBtn.setAttribute('aria-expanded', 'false');
    } else {
        // Open FAB
        wrapper.classList.remove('closed');
        wrapper.classList.add('open');
        backdrop.classList.remove('hidden');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100');
        if (fabBtn) fabBtn.setAttribute('aria-expanded', 'true');
    }
};

(function() {
    const fabToolbar = document.getElementById('fab-toolbar');
    if (!fabToolbar) {
        return;
    }

    // Detect display mode (mobile vs desktop)
    const isDesktop = window.innerWidth >= 1024;
    const mode = isDesktop ? 'desktop-fab' : 'mobile-nav';

    // Desktop FAB: show only on specific pages
    // Note: /lists page has custom mobile-only FAB (see lists.html)
    const allowedPages = ['/', '/facts', '/plan'];
    const currentPage = window.location.pathname;
    const isPageAllowed = allowedPages.includes(currentPage);

    if (isDesktop && !isPageAllowed) {
        // Hide desktop FAB on pages not in the allowed list
        const desktopWrapper = fabToolbar.querySelector('.desktop-fab-wrapper');
        const desktopBackdrop = document.getElementById('desktop-fab-backdrop');

        if (desktopWrapper) desktopWrapper.style.display = 'none';
        if (desktopBackdrop) desktopBackdrop.style.display = 'none';
    }

    // Resize listener: Automatically switch between mobile nav and desktop FAB
    let resizeTimeout;
    const BREAKPOINT = 1024;
    let currentMode = mode;  // Track current mode

    window.addEventListener('resize', function() {
        // Debounce: wait 200ms after last resize event
        clearTimeout(resizeTimeout);

        resizeTimeout = setTimeout(function() {
            const newIsDesktop = window.innerWidth >= BREAKPOINT;
            const newMode = newIsDesktop ? 'desktop-fab' : 'mobile-nav';

            // Only update if mode actually changed (crossing breakpoint)
            if (newMode !== currentMode) {
                currentMode = newMode;

                // Force CSS re-evaluation by toggling visibility
                const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
                const desktopWrapper = fabToolbar.querySelector('.desktop-fab-wrapper');
                const desktopBackdrop = document.getElementById('desktop-fab-backdrop');

                if (newIsDesktop) {
                    // Switch to desktop mode
                    const currentPage = window.location.pathname;
                    const isPageAllowed = allowedPages.includes(currentPage);

                    // Hide mobile nav
                    if (mobileWrapper) {
                        mobileWrapper.style.display = 'none';
                        mobileWrapper.style.visibility = 'hidden';
                    }

                    // Show desktop FAB (only on allowed pages)
                    if (desktopWrapper && isPageAllowed) {
                        desktopWrapper.style.display = 'block';
                        desktopWrapper.style.visibility = 'visible';
                        desktopWrapper.classList.remove('open');
                        desktopWrapper.classList.add('closed');
                    } else if (desktopWrapper) {
                        desktopWrapper.style.display = 'none';
                        desktopWrapper.style.visibility = 'hidden';
                    }

                    // Hide backdrop
                    if (desktopBackdrop) {
                        desktopBackdrop.classList.add('hidden');
                        desktopBackdrop.classList.remove('opacity-100');
                        desktopBackdrop.classList.add('opacity-0', 'pointer-events-none');
                    }
                } else {
                    // Switch to mobile mode

                    // Show mobile nav
                    if (mobileWrapper) {
                        mobileWrapper.style.display = 'block';
                        mobileWrapper.style.visibility = 'visible';
                    }

                    // Hide desktop FAB
                    if (desktopWrapper) {
                        desktopWrapper.style.display = 'none';
                        desktopWrapper.style.visibility = 'hidden';
                        desktopWrapper.classList.remove('open');
                        desktopWrapper.classList.add('closed');
                    }

                    // Hide backdrop
                    if (desktopBackdrop) {
                        desktopBackdrop.classList.add('hidden');
                        desktopBackdrop.classList.remove('opacity-100');
                        desktopBackdrop.classList.add('opacity-0', 'pointer-events-none');
                    }

                }
            }
        }, 200);  // 200ms debounce delay
    });

    // Log computed CSS values for debugging
    const fabToolbarStyles = window.getComputedStyle(fabToolbar);
    const mainContentStyles = window.getComputedStyle(document.getElementById('main-content'));

        fabContainer: {
            position: fabToolbarStyles.position,
            bottom: fabToolbarStyles.bottom,
            left: fabToolbarStyles.left,
            right: fabToolbarStyles.right,
            paddingBottom: fabToolbarStyles.paddingBottom,
            display: fabToolbarStyles.display,
            zIndex: fabToolbarStyles.zIndex,
        },
        mobileNav: {
            display: window.getComputedStyle(fabToolbar.querySelector('.mobile-nav-wrapper')).display,
            visibility: window.getComputedStyle(fabToolbar.querySelector('.mobile-nav-wrapper')).visibility,
        },
        desktopFab: {
            display: window.getComputedStyle(fabToolbar.querySelector('.desktop-fab-wrapper')).display,
            visibility: window.getComputedStyle(fabToolbar.querySelector('.desktop-fab-wrapper')).visibility,
        },
        mainContent: {
            paddingBottom: mainContentStyles.paddingBottom,
        },
        safeArea: {
            top: getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-top'),
            right: getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-right'),
            bottom: getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom'),
            left: getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-left'),
        }
    });

    // Desktop FAB: Auto-close and event handling (toggleDesktopFAB defined globally above)
    // Desktop FAB: Log menu item clicks
    const desktopFabWrapper = document.querySelector('.desktop-fab-wrapper');
    if (desktopFabWrapper) {
        document.querySelectorAll('.desktop-fab-wrapper .fab-menu-item button').forEach((menuItem, index) => {
            menuItem.addEventListener('click', (e) => {
                const actionText = e.currentTarget.getAttribute('aria-label') ||
                                   e.currentTarget.previousElementSibling?.textContent;

                // Auto-close FAB after clicking menu item (with slight delay to allow modal to open)
                setTimeout(() => {
                    if (desktopFabWrapper.classList.contains('open')) {
                        window.toggleDesktopFAB();
                    }
                }, 100);
            });
        });

        // Auto-close FAB when any modal opens
        const modalObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'open') {
                    const modal = mutation.target;
                    if (modal.hasAttribute('open') && desktopFabWrapper.classList.contains('open')) {
                        window.toggleDesktopFAB();
                    }
                }
            });
        });

        // Observe all modals
        document.querySelectorAll('dialog.modal').forEach(modal => {
            modalObserver.observe(modal, { attributes: true });
        });
    }

    // Offline mode: hide buttons with data-online-only (mobile only)
    function updateOfflineVisibility() {
        const isOffline = document.documentElement.classList.contains('offline-mode');

        // Only for mobile wrapper
        const mobileWrapper = fabToolbar.querySelector('.mobile-nav-wrapper');
        const onlineOnlyElements = mobileWrapper?.querySelectorAll('[data-online-only]');

        onlineOnlyElements?.forEach(el => {
            if (isOffline) {
                el.style.display = 'none';
            } else {
                el.style.display = '';
            }
        });
    }

    // Initial offline check
    updateOfflineVisibility();

    // Watch for offline mode changes
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
                updateOfflineVisibility();
            }
        });
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

    // Special logic for /lists page: center FAB adapts to context
    if (window.location.pathname === '/lists') {
        const centerFabBtn = document.getElementById('center-fab-btn');
        const centerFabDropdown = centerFabBtn?.closest('.dropdown');

        if (centerFabDropdown) {
            // Check if we're in detail view (viewing list items) or landing view (list selection)
            const checkListContext = () => {
                const detailView = document.getElementById('detail-view');
                const landingView = document.getElementById('landing-view');

                // detail-view is active if it doesn't have 'hidden' class
                const isDetailView = detailView && !detailView.classList.contains('hidden');

                    detailViewExists: !!detailView,
                    landingViewExists: !!landingView,
                    detailViewHidden: detailView?.classList.contains('hidden'),
                    isDetailView: isDetailView
                });

                return isDetailView;
            };

            // Replace dropdown with direct action
            centerFabBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                if (checkListContext()) {
                    // In detail view (list items) → add new item
                    if (typeof openAddItemModal === 'function') {
                        openAddItemModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openAddItemModal not found');
                    }
                } else {
                    // In landing view (list selection) → create new list
                    if (typeof openCreateListModal === 'function') {
                        openCreateListModal();
                    } else {
                        console.warn('[FAB_TOOLBAR] openCreateListModal not found');
                    }
                }
            };

            // Remove dropdown functionality on /lists
            centerFabDropdown.classList.remove('dropdown');
            const dropdownMenu = centerFabDropdown.querySelector('.dropdown-content');
            if (dropdownMenu) dropdownMenu.remove();

        }

        // Note: Desktop FAB is hidden on /lists page (handled by allowedPages check above)
    }

    // Log button clicks (mobile nav only)
    fabToolbar.querySelectorAll('.mobile-nav-wrapper .icon-btn, .mobile-nav-wrapper .dropdown button').forEach((btn, index) => {
        btn.addEventListener('click', (e) => {
            const buttonLabel = btn.getAttribute('aria-label') || btn.querySelector('.icon-label')?.textContent;
                index,
                label: buttonLabel,
                timestamp: new Date().toISOString()
            });
        });
    });

    // Active state management (highlight current page - mobile nav only)
    const currentPath = window.location.pathname;
    fabToolbar.querySelectorAll('.mobile-nav-wrapper a.icon-btn').forEach(btn => {
        const href = btn.getAttribute('href');
        if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
            btn.classList.add('active');
        }
    });

})();
</script>
