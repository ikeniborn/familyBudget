{#
  COMPONENT: Create Shopping List Modal
  Purpose: Form for creating new shopping lists
  Used in: lists.html
#}

{% macro create_list_modal() %}
<!-- Create Shopping List Modal - compact on mobile -->
<dialog id="create-list-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box p-4 sm:p-6">
        <h3 class="text-base sm:text-lg font-semibold mb-1 sm:mb-2">📝 Создать список</h3>
        <form id="create-list-form" onsubmit="handleCreateList(event)">
            <div class="form-control mb-3 sm:mb-4">
                <label class="label py-1">
                    <span class="label-text font-medium text-sm">Название <span class="text-error">*</span></span>
                </label>
                <input type="text" name="name" class="input input-bordered input-sm sm:input-md" placeholder="Продукты на неделю" required>
            </div>

            <div class="form-control mb-3 sm:mb-4">
                <label class="label py-1">
                    <span class="label-text font-medium text-sm">Описание</span>
                </label>
                <textarea name="description" class="textarea textarea-bordered textarea-sm sm:textarea-md" rows="2" placeholder="Опционально"></textarea>
            </div>

            <div class="modal-action mt-3 sm:mt-4 gap-2">
                <button type="button" class="btn btn-ghost btn-sm sm:btn-md" onclick="closeCreateListModal()">Отмена</button>
                <button type="submit" class="btn btn-primary btn-sm sm:btn-md flex-1 sm:flex-initial">Создать</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{% endmacro %}
