{#
  COMPONENT: Delete Items Confirmation Modal
  Purpose: Confirmation dialog for deleting selected items
  Used in: lists.html
#}

{% macro delete_confirm_modal() %}
<!-- Delete Confirmation Modal - compact on mobile -->
<dialog id="delete-confirm-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box p-4 sm:p-6">
        <h3 class="text-base sm:text-lg font-semibold mb-1 sm:mb-2">⚠️ Удалить товары?</h3>
        <p class="text-sm sm:text-base mb-3 sm:mb-4" id="delete-confirm-message">Удалить выбранные товары?</p>
        <div class="modal-action mt-3 sm:mt-4 gap-2">
            <button type="button" class="btn btn-ghost btn-sm sm:btn-md" onclick="closeDeleteConfirmModal()">Отмена</button>
            <button type="button" class="btn btn-error btn-sm sm:btn-md flex-1 sm:flex-initial" onclick="confirmDelete()">Удалить</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{% endmacro %}
