{#
  COMPONENT: FAB Confirmation Modal
  Purpose: Generic confirmation dialog for FAB menu actions
  Used in: lists.html (mark all, unmark all, delete completed)
#}

{% macro fab_confirm_modal() %}
<!-- Confirm Modal для FAB действий -->
<dialog id="confirm-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-lg p-4 sm:p-6">
        <h3 class="text-base sm:text-lg font-semibold mb-1 sm:mb-2" id="confirm-title">Подтверждение</h3>
        <p class="whitespace-pre-line text-sm sm:text-base mb-4 sm:mb-6" id="confirm-message"></p>
        <div class="modal-action mt-3 sm:mt-4 gap-2">
            <button type="button" class="btn btn-ghost btn-sm sm:btn-md" onclick="confirmModalResolve(false)">Отмена</button>
            <button type="button" class="btn btn-primary btn-sm sm:btn-md flex-1 sm:flex-initial" onclick="confirmModalResolve(true)">Подтвердить</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button onclick="confirmModalResolve(false)">close</button>
    </form>
</dialog>
{% endmacro %}
