{% macro modal_ai_receipt() %}
<!-- AI receipt recognition modal (ai-assisted-transaction-input, phase 5).
     Opened from the 📷 button in the fact modal quick-add block; driven by
     the aiQuickAdd bundle. Facts are created only after user confirmation. -->
<dialog id="modal_ai_receipt" class="modal">
    <div class="modal-box max-w-3xl">
        <h3 class="font-bold text-lg mb-2">📷 Распознавание чека</h3>

        <div id="ai-receipt-upload-step">
            <input type="file" id="ai-receipt-file" accept="image/jpeg,image/png,image/webp"
                   class="file-input file-input-bordered w-full" />
            <p class="text-xs text-base-content/60 mt-1">JPEG/PNG/WebP до 10 МБ. Фото обрабатывается и не сохраняется.</p>
            <div class="modal-action">
                <button type="button" id="ai-receipt-recognize" class="btn btn-primary">Распознать</button>
                <form method="dialog"><button class="btn btn-ghost">Отмена</button></form>
            </div>
        </div>

        <div id="ai-receipt-result-step" class="hidden">
            <div class="flex flex-wrap gap-3 items-end mb-3">
                <div class="form-control">
                    <label class="label py-1" for="ai-receipt-date"><span class="label-text text-xs">Дата</span></label>
                    <input type="date" id="ai-receipt-date" class="input input-bordered input-sm" />
                </div>
                <div class="form-control min-w-[12rem]">
                    <label class="label py-1" for="ai-receipt-fc"><span class="label-text text-xs">Счёт *</span></label>
                    <select id="ai-receipt-fc" class="select select-bordered select-sm"></select>
                </div>
                <div id="ai-receipt-store" class="text-sm text-base-content/70"></div>
            </div>

            <div class="overflow-x-auto max-h-96">
                <table class="table table-sm" id="ai-receipt-table">
                    <thead>
                        <tr><th></th><th>Позиция</th><th>Сумма, ₽</th><th>Категория</th></tr>
                    </thead>
                    <tbody><!-- rows rendered by aiQuickAdd bundle --></tbody>
                </table>
            </div>

            <div class="flex justify-between items-center mt-2">
                <span id="ai-receipt-total" class="text-sm font-semibold"></span>
                <span id="ai-receipt-status" class="text-xs text-base-content/70"></span>
            </div>

            <div class="modal-action">
                <button type="button" id="ai-receipt-create" class="btn btn-primary">Создать записи</button>
                <button type="button" id="ai-receipt-back" class="btn btn-ghost">← Другое фото</button>
                <form method="dialog"><button class="btn btn-ghost">Закрыть</button></form>
            </div>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
{% endmacro %}
