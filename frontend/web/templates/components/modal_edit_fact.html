{% from "components/macros/delete_buttons.html" import delete_button_mobile %}
{% macro edit_fact_modal(modal_id='edit-modal') %}
<dialog id="{{ modal_id }}" class="modal">
    <div class="modal-box w-full max-w-2xl p-4 max-h-[90vh] overflow-y-auto my-auto">
        <h2 class="text-base sm:text-lg font-semibold mb-1 sm:mb-2">✏️ Редактировать факт</h2>

        <form id="edit-form" onsubmit="updateFact(event)" class="space-y-2">
            <input type="hidden" id="edit-id" name="id">

            <!-- Skeleton Loading State (hidden by default) -->
            <div id="edit-loading-skeleton" class="hidden space-y-2">
                <div class="skeleton h-12 w-full"></div>
                <div class="skeleton h-12 w-full"></div>
                <div class="skeleton h-12 w-full"></div>
                <div class="skeleton h-20 w-full"></div>
            </div>

            <!-- Actual Form Fields (wrapped in div for toggling) -->
            <div id="edit-form-fields">

            <!-- Дата -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Дата *</span>
                </label>
                <input type="text" id="edit-date" name="fact_date"
                       required class="input input-bordered w-full"
                       placeholder="ДД.ММ.ГГГГ" autocomplete="off" />
            </div>

            <!-- Счет -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Счет *</span>
                </label>
                <select id="edit-financial-center" name="financial_center_id"
                        required class="select select-bordered">
                    <option value="">-- Выберите счет --</option>
                </select>
            </div>

            <!-- Тип категории (read-only badge) -->
            <div id="edit-category-type-container" class="bg-base-200 rounded-lg p-3 mt-2">
                <div class="flex items-center justify-center gap-2">
                    <span class="label-text font-semibold text-sm">Тип категории:</span>
                    <span id="edit-category-type-label" class="badge badge-sm badge-error">Расход</span>
                </div>
            </div>

            <!-- Категория -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Категория *</span>
                </label>
                <select id="edit-article" name="article_id" required class="select select-bordered">
                    <option value="" disabled hidden>-- Выберите категорию --</option>
                </select>
            </div>

            <!-- Место затрат -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Место затрат</span>
                </label>
                <select id="edit-cost-center" name="cost_center_id" class="select select-bordered">
                    <option value="">-- Не указано --</option>
                </select>
            </div>

            <!-- Сумма -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Сумма *</span>
                </label>
                <input type="number" id="edit-amount" name="amount"
                       step="0.01" required class="input input-bordered" />
            </div>

            <!-- Описание -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Описание</span>
                </label>
                <textarea id="edit-description" name="description"
                          rows="2" maxlength="500" class="textarea textarea-bordered"></textarea>
            </div>

            </div> <!-- End of edit-form-fields -->

            <!-- Кнопки -->
            <div class="modal-action mt-3 flex flex-row gap-2 items-center">
                <!-- Кнопка удаления - только иконка, видна только на мобильных (где нет чекбоксов) -->
                {{ delete_button_mobile('deleteFromEditModal()') }}
                <!-- Разделитель (пустое пространство) -->
                <div class="flex-1 md:hidden"></div>
                <button type="button" class="btn btn-sm sm:btn-md flex-1 sm:flex-initial" onclick="closeEditModal()">
                    <span class="inline-flex items-center gap-1 whitespace-nowrap">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        <span>Отмена</span>
                    </span>
                </button>
                <button type="submit" class="btn btn-sm sm:btn-md btn-primary save-btn flex-1 sm:flex-initial">
                    <span class="inline-flex items-center gap-1 whitespace-nowrap">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>Сохранить</span>
                    </span>
                </button>
            </div>
        </form>
    </div>
    <div class="modal-backdrop"></div>
</dialog>
{% endmacro %}
