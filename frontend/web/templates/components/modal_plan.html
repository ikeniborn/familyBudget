{% macro plan_modal(modal_id='modal_add_plan') %}
<dialog id="{{ modal_id }}" class="modal">
    <div class="modal-box w-full max-w-2xl p-4 max-h-[90vh] overflow-y-auto my-auto">
        <h3 class="font-bold text-lg mb-3">📝 Добавить план</h3>

        <form id="form_{{ modal_id }}" class="space-y-2">
            <!-- Период (месяц) -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text font-semibold">Период планирования *</span>
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="btn btn-xs btn-outline period-btn btn-active" data-offset="0" id="plan_period_btn_1">Окт 2025</button>
                    <button type="button" class="btn btn-xs btn-outline period-btn" data-offset="1" id="plan_period_btn_2">Ноя 2025</button>
                    <button type="button" class="btn btn-xs btn-outline period-btn" data-offset="2" id="plan_period_btn_3">Дек 2025</button>
                </div>
                <input type="hidden" name="plan_month" required />
            </div>

            <!-- Счет - moved above operation type for account filtering -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Счет *</span>
                </label>
                <select name="financial_center_id" required class="select select-bordered">
                    <option value="">-- Выберите счет --</option>
                </select>
            </div>

            <!-- Тип операции -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text font-semibold">Тип операции *</span>
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="btn btn-sm btn-outline btn-error plan-type-btn btn-active" data-type="expense">
                        <input type="radio" name="plan_type" value="expense" class="hidden" checked />
                        Расход
                    </label>
                    <label class="btn btn-sm btn-outline btn-success plan-type-btn" data-type="income">
                        <input type="radio" name="plan_type" value="income" class="hidden" />
                        Доход
                    </label>
                </div>
            </div>

            <!-- Категория -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Категория *</span>
                </label>
                <select name="article_id" required class="select select-bordered">
                    <option value="" disabled hidden>-- Выберите категорию --</option>
                </select>
            </div>

            <!-- Место затрат -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Место затрат</span>
                </label>
                <select name="cost_center_id" class="select select-bordered">
                    <option value="">-- Не выбрано --</option>
                </select>
            </div>

            <!-- Plan Hints (after account and cost location selection) -->
            <div id="plan-hints-container" class="grid grid-cols-2 gap-1">
                <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="hint-prev-plan" disabled>
                    План пред. мес: --
                </button>
                <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="hint-prev-fact" disabled>
                    Факт пред. мес: --
                </button>
            </div>

            <!-- Сумма (after hints) -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Сумма *</span>
                </label>
                <input type="number" name="amount" step="1" min="1" required
                       class="input input-bordered" placeholder="0" />
            </div>

            <!-- Описание -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Описание</span>
                </label>
                <textarea name="description" class="textarea textarea-bordered"
                          placeholder="Комментарий" rows="1"></textarea>
            </div>

            <!-- Напоминание -->
            <div class="form-control">
                <label class="label py-1 cursor-pointer justify-start gap-2">
                    <input type="checkbox" name="enable_reminder" class="checkbox checkbox-sm checkbox-primary"
                           onchange="toggleReminderSettings('{{ modal_id }}')" />
                    <span class="label-text">Установить напоминание</span>
                </label>
            </div>

            <div id="reminder-settings-{{ modal_id }}" class="hidden space-y-2">
                <div class="form-control">
                    <label class="label py-1">
                        <span class="label-text">Дата и время напоминания</span>
                    </label>
                    <!-- Responsive datetime picker: stacked on mobile, inline on desktop -->
                    <div class="flex flex-col sm:flex-row gap-2">
                        <!-- Date input with CalendarWidget -->
                        <input
                            type="text"
                            name="reminder_date"
                            id="reminder_date_{{ modal_id }}"
                            class="input input-bordered flex-1 h-12"
                            placeholder="ДД.ММ.ГГГГ"
                            autocomplete="off"
                        />
                        <!-- Time dropdowns - on separate row for mobile -->
                        <div class="flex items-center gap-1 justify-start">
                            <select name="reminder_hour" id="reminder_hour_{{ modal_id }}" class="select select-bordered w-20 h-12">
                                <option value="">--</option>
                                {% for h in range(24) %}
                                <option value="{{ '%02d'|format(h) }}">{{ '%02d'|format(h) }}</option>
                                {% endfor %}
                            </select>
                            <span class="text-lg font-bold">:</span>
                            <select name="reminder_minute" id="reminder_minute_{{ modal_id }}" class="select select-bordered w-20 h-12">
                                <option value="">--</option>
                                {% for m in range(0, 60, 5) %}
                                <option value="{{ '%02d'|format(m) }}">{{ '%02d'|format(m) }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <!-- Hidden field for combined datetime (populated by JS) -->
                    <input type="hidden" name="reminder_datetime" id="reminder_datetime_{{ modal_id }}" />
                </div>
                <p class="text-xs text-base-content/70">
                    Уведомление придет в Telegram и как push в браузер
                </p>
            </div>

            <div class="modal-action mt-3">
                <button type="button" onclick="{{ modal_id }}.close()" class="btn btn-sm btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    <span class="hidden sm:inline">Отмена</span>
                </button>
                <!-- Save to local queue only (offline-aware) -->
                <button type="button" class="btn btn-sm btn-warning save-offline-btn"
                        data-form-id="form_{{ modal_id }}"
                        data-modal-id="{{ modal_id }}"
                        onclick="savePlanOffline(this)"
                        title="Сохранить локально (синхронизируется при подключении)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                    </svg>
                    <span class="hidden sm:inline">Сохранить</span>
                </button>
                <!-- Save and upload to server (online only) -->
                <button type="submit" class="btn btn-sm btn-info save-upload-btn"
                        title="Сохранить и загрузить на сервер">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="hidden sm:inline">Сохранить и загрузить</span>
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{% endmacro %}
