{% macro transaction_modal(modal_id='modal_add_transaction') %}
<dialog id="{{ modal_id }}" class="modal">
    <div class="modal-box w-full max-w-2xl p-4 max-h-[90vh] overflow-y-auto my-auto">
        <h2 class="text-base sm:text-lg font-semibold mb-1 sm:mb-2">➕ Добавить факт</h2>

        <form id="form_{{ modal_id }}" class="space-y-2">
            <!-- Дата -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Дата *</span>
                </label>
                <div class="flex gap-1 mb-1">
                    <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setTransactionDate(0)">Сегодня</button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setTransactionDate(-1)">Вчера</button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setTransactionDate(-2)">Позавчера</button>
                </div>
                <input type="text" name="fact_date" required
                       class="input input-bordered w-full transaction-date-input"
                       placeholder="ДД.ММ.ГГГГ"
                       maxlength="10"
                       autocomplete="off" />
            </div>

            <!-- Счет - ПЕРВЫМ для фильтрации категорий -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Счет *</span>
                </label>
                <select name="financial_center_id" required class="select select-bordered">
                    <option value="">-- Выберите счет --</option>
                </select>
            </div>

            <!-- Тип операции -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text font-semibold">Тип операции *</span>
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="btn btn-sm btn-outline btn-error transaction-type-btn btn-active" data-type="expense">
                        <input type="radio" name="record_type" value="expense" class="hidden" checked />
                        Расход
                    </label>
                    <label class="btn btn-sm btn-outline btn-success transaction-type-btn" data-type="income">
                        <input type="radio" name="record_type" value="income" class="hidden" />
                        Доход
                    </label>
                </div>
            </div>

            <!-- Категория (фильтруется по выбранному счету) -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Категория *</span>
                </label>
                <select name="article_id" required class="select select-bordered">
                    <option value="" disabled hidden>-- Выберите категорию --</option>
                </select>
            </div>

            <!-- Место затрат -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Место затрат</span>
                </label>
                <select name="cost_center_id" class="select select-bordered">
                    <option value="">-- Не выбрано --</option>
                </select>
            </div>

            <!-- Fact Hints (план/факт за месяц) -->
            <div id="fact-hints-container" class="grid grid-cols-2 gap-1">
                <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="hint-period-plan" disabled>
                    План мес: --
                </button>
                <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="hint-period-fact" disabled>
                    Факт мес: --
                </button>
            </div>

            <!-- Сумма -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Сумма *</span>
                </label>
                <input type="number" name="amount" step="1" min="1" required
                       class="input input-bordered" placeholder="0" />
            </div>

            <!-- Описание -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Описание</span>
                </label>
                <textarea name="description" class="textarea textarea-bordered"
                          placeholder="Комментарий" rows="1"></textarea>
            </div>

            <div class="modal-action mt-3">
                <button type="button" onclick="{{ modal_id }}.close()" class="btn btn-sm btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Отмена
                </button>
                <!-- Unified save button (online: green, offline: orange) -->
                <button type="button" class="btn btn-sm save-btn"
                        data-form-id="form_{{ modal_id }}"
                        data-modal-id="{{ modal_id }}"
                        onclick="saveTransaction(this)"
                        title="Сохранить">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Сохранить
                </button>
            </div>
        </form>
    </div>
    <div class="modal-backdrop"></div>
</dialog>
{% endmacro %}
