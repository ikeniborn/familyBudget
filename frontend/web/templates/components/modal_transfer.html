<!-- Transfer Modal -->
<dialog id="transfer_modal" class="modal">
    <div class="modal-box max-w-2xl p-4 max-h-[90vh] overflow-y-auto my-auto">
        <h3 class="font-bold text-lg mb-3 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            Перевод
        </h3>

        <form id="form_transfer" class="space-y-2">
            <!-- Date/Period Picker -->
            <!-- For fact transfers: date input with quick buttons -->
            <div id="transfer-date-section-fact" class="form-control">
                <label class="label py-1">
                    <span class="label-text">Дата перевода *</span>
                </label>
                <div class="flex gap-1 mb-1">
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="today">
                        Сегодня
                    </button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="yesterday">
                        Вчера
                    </button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="day-before">
                        Позавчера
                    </button>
                </div>
                <!-- Note: required attribute removed - validation handled in JS based on transfer type -->
                <input
                    type="text"
                    name="transfer_date"
                    id="transfer_date"
                    class="input input-bordered w-full"
                    placeholder="ДД.ММ.ГГГГ"
                />
            </div>

            <!-- For plan transfers: period selector like modal_add_plan -->
            <div id="transfer-period-section-plan" class="form-control hidden">
                <label class="label py-1">
                    <span class="label-text font-semibold">Период планирования *</span>
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="btn btn-xs btn-outline transfer-period-btn btn-active" data-offset="0" id="transfer_period_btn_1">Текущий</button>
                    <button type="button" class="btn btn-xs btn-outline transfer-period-btn" data-offset="1" id="transfer_period_btn_2">Следующий</button>
                    <button type="button" class="btn btn-xs btn-outline transfer-period-btn" data-offset="2" id="transfer_period_btn_3">Послед.</button>
                </div>
                <input type="hidden" name="transfer_plan_month" id="transfer_plan_month" />
            </div>

            <!-- FROM Section -->
            <div class="border border-error/20 rounded-lg p-3 bg-error/5">
                <h4 class="font-semibold text-error text-sm mb-2">Откуда (списание)</h4>

                <!-- From Financial Center -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">ЦФО *</span>
                    </label>
                    <select
                        name="from_financial_center_id"
                        id="from_financial_center"
                        class="select select-bordered"
                        required
                    >
                        <option value="">Выберите ЦФО...</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- From Article (Expense) -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">Категория *</span>
                    </label>
                    <select
                        name="from_article_id"
                        id="from_article"
                        class="select select-bordered"
                        required
                    >
                        <option value="" disabled hidden>Выберите категорию...</option>
                        <!-- Populated by ChoicesCategoryTree -->
                    </select>
                </div>

                <!-- From Cost Center (Optional) -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">МВЗ</span>
                    </label>
                    <select
                        name="from_cost_center_id"
                        id="from_cost_center"
                        class="select select-bordered"
                    >
                        <option value="">Не указано</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- Plan Hints for FROM (expense) - AFTER МВЗ, shown only for plan transfers -->
                <div id="transfer-from-hints" class="grid grid-cols-2 gap-1 hidden">
                    <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="transfer-hint-from-plan" disabled>
                        План: --
                    </button>
                    <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="transfer-hint-from-fact" disabled>
                        Факт: --
                    </button>
                </div>
            </div>

            <!-- TO Section -->
            <div class="border border-success/20 rounded-lg p-3 bg-success/5">
                <h4 class="font-semibold text-success text-sm mb-2">Куда (пополнение)</h4>

                <!-- To Financial Center -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">ЦФО *</span>
                    </label>
                    <select
                        name="to_financial_center_id"
                        id="to_financial_center"
                        class="select select-bordered"
                        required
                    >
                        <option value="">Выберите ЦФО...</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- To Article (Income) -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">Категория *</span>
                    </label>
                    <select
                        name="to_article_id"
                        id="to_article"
                        class="select select-bordered"
                        required
                    >
                        <option value="" disabled hidden>Выберите категорию...</option>
                        <!-- Populated by ChoicesCategoryTree -->
                    </select>
                </div>

                <!-- To Cost Center (Optional) -->
                <div class="form-control mb-2">
                    <label class="label py-0.5">
                        <span class="label-text text-xs">МВЗ</span>
                    </label>
                    <select
                        name="to_cost_center_id"
                        id="to_cost_center"
                        class="select select-bordered"
                    >
                        <option value="">Не указано</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- Plan Hints for TO (income) - AFTER МВЗ, shown only for plan transfers -->
                <div id="transfer-to-hints" class="grid grid-cols-2 gap-1 hidden">
                    <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="transfer-hint-to-plan" disabled>
                        План: --
                    </button>
                    <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="transfer-hint-to-fact" disabled>
                        Факт: --
                    </button>
                </div>
            </div>

            <!-- Amount (after FROM/TO sections) -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Сумма *</span>
                </label>
                <input
                    type="number"
                    name="amount"
                    id="transfer_amount"
                    class="input input-bordered"
                    placeholder="0"
                    step="1"
                    min="1"
                    required
                />
            </div>

            <!-- Description (Optional) -->
            <div class="form-control">
                <label class="label py-1">
                    <span class="label-text">Описание</span>
                </label>
                <textarea
                    name="description"
                    id="transfer_description"
                    class="textarea textarea-bordered"
                    placeholder="Комментарий"
                    rows="1"
                ></textarea>
            </div>

            <!-- Actions -->
            <div class="modal-action mt-3">
                <button type="button" class="btn btn-sm btn-ghost" onclick="transfer_modal.close()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    <span class="hidden sm:inline">Отмена</span>
                </button>
                <!-- Save to local queue only (offline-aware) -->
                <button type="button" class="btn btn-sm btn-warning save-offline-btn"
                        data-form-id="form_transfer"
                        data-modal-id="transfer_modal"
                        onclick="saveTransferOffline(this)"
                        title="Сохранить локально (синхронизируется при подключении)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                    </svg>
                    <span class="hidden sm:inline">Сохранить</span>
                </button>
                <!-- Save and upload to server (online only) -->
                <button type="submit" class="btn btn-sm btn-primary save-upload-btn"
                        title="Сохранить и загрузить на сервер">
                    💸 <span class="hidden sm:inline">Создать и загрузить</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Close on backdrop click -->
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
