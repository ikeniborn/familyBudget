<!-- Transfer Modal -->
<dialog id="transfer_modal" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            Перевод
        </h3>

        <form id="form_transfer" method="dialog">
            <!-- Date/Period Picker -->
            <!-- For fact transfers: date input with quick buttons -->
            <div id="transfer-date-section-fact" class="form-control">
                <label class="label">
                    <span class="label-text">Дата перевода</span>
                </label>
                <div class="flex gap-1 mb-2">
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="today">
                        Сегодня
                    </button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="yesterday">
                        Вчера
                    </button>
                    <button type="button" class="btn btn-xs btn-outline flex-1" data-quick-date="day-before">
                        Позавчера
                    </button>
                </div>
                <input
                    type="text"
                    name="transfer_date"
                    id="transfer_date"
                    class="input input-bordered w-full"
                    placeholder="ДД.ММ.ГГГГ"
                    required
                />
            </div>

            <!-- For plan transfers: period selector like modal_add_plan -->
            <div id="transfer-period-section-plan" class="form-control hidden">
                <label class="label">
                    <span class="label-text font-semibold">Период планирования *</span>
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="btn btn-outline transfer-period-btn btn-active" data-offset="0" id="transfer_period_btn_1">Текущий</button>
                    <button type="button" class="btn btn-outline transfer-period-btn" data-offset="1" id="transfer_period_btn_2">Следующий</button>
                    <button type="button" class="btn btn-outline transfer-period-btn" data-offset="2" id="transfer_period_btn_3">Послед.</button>
                </div>
                <input type="hidden" name="transfer_plan_month" id="transfer_plan_month" />
            </div>

            <!-- Amount -->
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Сумма</span>
                </label>
                <input
                    type="number"
                    name="amount"
                    id="transfer_amount"
                    class="input input-bordered"
                    placeholder="0"
                    step="1"
                    min="1"
                    required
                />
            </div>

            <!-- FROM Section -->
            <div class="border border-error/20 rounded-lg p-4 mb-4 bg-error/5">
                <h4 class="font-semibold text-error mb-3">Откуда (списание)</h4>

                <!-- From Financial Center -->
                <div class="form-control mb-3">
                    <label class="label">
                        <span class="label-text">Финансовый центр (откуда)</span>
                    </label>
                    <select
                        name="from_financial_center_id"
                        id="from_financial_center"
                        class="select select-bordered"
                        required
                    >
                        <option value="">Выберите ЦФО...</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- From Article (Expense) -->
                <div class="form-control mb-3">
                    <label class="label">
                        <span class="label-text">Категория списания</span>
                    </label>
                    <select
                        name="from_article_id"
                        id="from_article"
                        class="select select-bordered"
                        required
                    >
                        <option value="" disabled hidden>Выберите категорию...</option>
                        <!-- Populated by ChoicesCategoryTree -->
                    </select>
                </div>

                <!-- From Cost Center (Optional) -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">МВЗ (опционально)</span>
                    </label>
                    <select
                        name="from_cost_center_id"
                        id="from_cost_center"
                        class="select select-bordered"
                    >
                        <option value="">Не указано</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>
            </div>

            <!-- TO Section -->
            <div class="border border-success/20 rounded-lg p-4 mb-4 bg-success/5">
                <h4 class="font-semibold text-success mb-3">Куда (пополнение)</h4>

                <!-- To Financial Center -->
                <div class="form-control mb-3">
                    <label class="label">
                        <span class="label-text">Финансовый центр (куда)</span>
                    </label>
                    <select
                        name="to_financial_center_id"
                        id="to_financial_center"
                        class="select select-bordered"
                        required
                    >
                        <option value="">Выберите ЦФО...</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>

                <!-- To Article (Income) -->
                <div class="form-control mb-3">
                    <label class="label">
                        <span class="label-text">Категория пополнения</span>
                    </label>
                    <select
                        name="to_article_id"
                        id="to_article"
                        class="select select-bordered"
                        required
                    >
                        <option value="" disabled hidden>Выберите категорию...</option>
                        <!-- Populated by ChoicesCategoryTree -->
                    </select>
                </div>

                <!-- To Cost Center (Optional) -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">МВЗ (опционально)</span>
                    </label>
                    <select
                        name="to_cost_center_id"
                        id="to_cost_center"
                        class="select select-bordered"
                    >
                        <option value="">Не указано</option>
                        <!-- Populated dynamically by loadTransferData() -->
                    </select>
                </div>
            </div>

            <!-- Description (Optional) -->
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Описание (опционально)</span>
                </label>
                <textarea
                    name="description"
                    id="transfer_description"
                    class="textarea textarea-bordered"
                    placeholder="Комментарий к переводу..."
                    rows="2"
                ></textarea>
            </div>

            <!-- Actions -->
            <div class="modal-action">
                <button type="button" class="btn" onclick="transfer_modal.close()">
                    Отмена
                </button>
                <button type="submit" class="btn btn-primary">
                    💸 Создать перевод
                </button>
            </div>
        </form>
    </div>

    <!-- Close on backdrop click -->
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
