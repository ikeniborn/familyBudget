<!-- Fact Transfer Tab Content -->
<!-- Дата -->
<div class="form-control">
    <label class="label py-1">
        <span class="label-text">Дата перевода *</span>
    </label>
    <div class="flex gap-1 mb-1">
        <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setFactTransferDate(0)">Сегодня</button>
        <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setFactTransferDate(-1)">Вчера</button>
        <button type="button" class="btn btn-xs btn-outline flex-1" onclick="setFactTransferDate(-2)">Позавчера</button>
    </div>
    <input type="text" name="transfer_date" required
           class="input input-bordered w-full"
           placeholder="ДД.ММ.ГГГГ"
           maxlength="10"
           autocomplete="off" />
</div>

<!-- FROM Section -->
<div class="border border-error/20 rounded-lg p-3 bg-error/5 mt-3">
    <h4 class="font-semibold text-error text-sm mb-2">Откуда (списание)</h4>

    <!-- From Account -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Счет *</span>
        </label>
        <select name="from_financial_center_id" required class="select select-bordered">
            <option value="">-- Выберите счет --</option>
        </select>
    </div>

    <!-- From Article (Expense) -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Категория *</span>
        </label>
        <select name="from_article_id" class="select select-bordered select-sm" disabled>
            <option value="">-- Выберите категорию --</option>
        </select>
    </div>

    <!-- From Hints -->
    <div class="grid grid-cols-2 gap-1">
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="from-hint-period-plan" disabled>
            План мес: --
        </button>
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="from-hint-period-fact" disabled>
            Факт мес: --
        </button>
    </div>
</div>

<!-- TO Section -->
<div class="border border-success/20 rounded-lg p-3 bg-success/5 mt-2">
    <h4 class="font-semibold text-success text-sm mb-2">Куда (пополнение)</h4>

    <!-- To Account -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Счет *</span>
        </label>
        <select name="to_financial_center_id" required class="select select-bordered">
            <option value="">-- Выберите счет --</option>
        </select>
    </div>

    <!-- To Article (Income) -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Категория *</span>
        </label>
        <select name="to_article_id" class="select select-bordered select-sm" disabled>
            <option value="">-- Выберите категорию --</option>
        </select>
    </div>

    <!-- To Hints -->
    <div class="grid grid-cols-2 gap-1">
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="to-hint-period-plan" disabled>
            План мес: --
        </button>
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="to-hint-period-fact" disabled>
            Факт мес: --
        </button>
    </div>
</div>

<!-- Сумма -->
<div class="form-control mt-2">
    <label class="label py-1">
        <span class="label-text">Сумма *</span>
    </label>
    <input type="number" name="amount" step="1" min="1" required
           class="input input-bordered" placeholder="0" />
</div>

<!-- Описание -->
<div class="form-control">
    <label class="label py-1">
        <span class="label-text">Описание</span>
    </label>
    <textarea name="description" class="textarea textarea-bordered"
              placeholder="Комментарий" rows="1"></textarea>
</div>
