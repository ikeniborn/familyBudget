<!-- Plan Transfer Tab Content -->
<!-- Период -->
<div class="form-control">
    <label class="label py-1">
        <span class="label-text font-semibold">Период планирования *</span>
    </label>
    <div class="grid grid-cols-3 gap-2">
        <button type="button" class="btn btn-xs btn-outline transfer-period-btn btn-active" data-offset="0" id="transfer_period_btn_1">Текущий</button>
        <button type="button" class="btn btn-xs btn-outline transfer-period-btn" data-offset="1" id="transfer_period_btn_2">Следующий</button>
        <button type="button" class="btn btn-xs btn-outline transfer-period-btn" data-offset="2" id="transfer_period_btn_3">Послед.</button>
    </div>
    <input type="hidden" name="transfer_plan_month" />
</div>

<!-- FROM Section -->
<div class="border border-error/20 rounded-lg p-3 bg-error/5">
    <h4 class="font-semibold text-error text-sm mb-2">Откуда (списание)</h4>

    <!-- From Account -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Счет *</span>
        </label>
        <select name="from_financial_center_id" required class="select select-bordered select-sm max-h-12">
            <option value="">-- Выберите счет --</option>
        </select>
    </div>

    <!-- From Article (Expense) -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Категория *</span>
        </label>
        <select name="from_article_id" required class="select select-bordered select-sm">
            <option value="">-- Выберите категорию --</option>
        </select>
    </div>

    <!-- From Hints -->
    <div class="grid grid-cols-2 gap-1">
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="from-hint-prev-plan" disabled>
            План пред. мес: --
        </button>
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="from-hint-prev-fact" disabled>
            Факт пред. мес: --
        </button>
    </div>
</div>

<!-- TO Section -->
<div class="border border-success/20 rounded-lg p-3 bg-success/5 mt-2">
    <h4 class="font-semibold text-success text-sm mb-2">Куда (пополнение)</h4>

    <!-- To Account -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Счет *</span>
        </label>
        <select name="to_financial_center_id" required class="select select-bordered select-sm max-h-12">
            <option value="">-- Выберите счет --</option>
        </select>
    </div>

    <!-- To Article (Income) -->
    <div class="form-control mb-2">
        <label class="label py-0.5">
            <span class="label-text text-xs">Категория *</span>
        </label>
        <select name="to_article_id" required class="select select-bordered select-sm">
            <option value="">-- Выберите категорию --</option>
        </select>
    </div>

    <!-- To Hints -->
    <div class="grid grid-cols-2 gap-1">
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="to-hint-prev-plan" disabled>
            План пред. мес: --
        </button>
        <button type="button" class="btn btn-xs btn-ghost btn-disabled" id="to-hint-prev-fact" disabled>
            Факт пред. мес: --
        </button>
    </div>
</div>

<!-- Сумма -->
<div class="form-control mt-2">
    <label class="label py-1">
        <span class="label-text">Сумма *</span>
    </label>
    <input type="number" name="transfer_amount" step="1" min="1" required
           class="input input-bordered" placeholder="0" />
</div>

<!-- Описание -->
<div class="form-control">
    <label class="label py-1">
        <span class="label-text">Описание</span>
    </label>
    <textarea name="transfer_description" class="textarea textarea-bordered"
              placeholder="Комментарий" rows="1"></textarea>
</div>
