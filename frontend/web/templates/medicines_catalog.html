{% extends "base.html" %}

{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between gap-2 flex-wrap">
    <h1 class="text-xl font-bold">Справочник лекарств</h1>
    <div class="join">
      <input id="med-search" class="input input-bordered input-sm join-item" placeholder="Поиск по названию"
             onkeydown="if(event.key==='Enter')window.catalogSearch()">
      <button class="btn btn-sm join-item" onclick="window.catalogSearch()">Найти</button>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-4 grid grid-cols-1 sm:grid-cols-4 gap-2">
      <input id="med-name" class="input input-bordered input-sm" placeholder="Название" />
      {# options come from the FORM_LABELS dictionary in medicinesManager.ts (single source) #}
      <select id="med-form" class="select select-bordered select-sm"></select>
      <input id="med-dosage" class="input input-bordered input-sm" placeholder="Дозировка" />
      <button class="btn btn-primary btn-sm" onclick="window.createMedicineFromForm()">Добавить</button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead><tr><th>Название</th><th>Форма</th><th>Дозировка</th><th></th></tr></thead>
      <tbody id="medicines-catalog-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/confirm-dialog.min.js?v=PLACEHOLDER" defer></script>
<script src="/static/js/medicines.min.js?v=PLACEHOLDER" defer></script>
{% endblock %}
