{% raw %}
<!-- P2P Sync: Scanner screen (QR scan + answer display) -->
<!-- Shown on the device that receives the sync session -->
<div id="p2p-scanner-screen" class="flex flex-col items-center gap-4 p-4 w-full">

  <!-- Header -->
  <div class="text-center">
    <h3 class="text-lg font-bold">Сканировать QR</h3>
    <p class="text-sm text-base-content/60" id="p2p-scanner-subtitle">Наведите камеру на QR другого устройства</p>
  </div>

  <!-- iOS guidance -->
  <div id="p2p-ios-camera-guidance" class="alert alert-info text-sm hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span>Разрешите доступ к камере в Safari → Настройки → Safari → Камера</span>
  </div>

  <!-- Camera view -->
  <div id="p2p-camera-wrapper" class="relative w-full max-w-sm">
    <div class="p2p-scanner-overlay rounded-xl overflow-hidden bg-black aspect-square flex items-center justify-center">
      <video id="p2p-camera-video"
        class="w-full h-full object-cover"
        autoplay
        playsinline
        muted></video>
      <!-- Scanning frame overlay -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-48 h-48 border-2 border-primary rounded-xl opacity-70"></div>
      </div>
    </div>
    <!-- Camera error state -->
    <div id="p2p-camera-error" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-base-200 rounded-xl gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <p class="text-sm text-base-content/60 text-center">Камера недоступна</p>
      <button class="btn btn-xs btn-outline" onclick="window.p2pUI?.requestCamera()">Повторить</button>
    </div>
  </div>

  <!-- Answer QR display (shown after processing offer) -->
  <div id="p2p-answer-qr-section" class="hidden flex flex-col items-center gap-2 w-full">
    <div class="divider text-sm">Шаг 2: Покажите этот QR первому устройству</div>
    <div id="p2p-answer-qr-container" class="p2p-qr-container flex items-center justify-center bg-white rounded-2xl shadow-md" style="min-height:280px;min-width:280px;">
      <span class="loading loading-ring loading-lg"></span>
    </div>
    <!-- Manual answer fallback -->
    <div class="collapse collapse-arrow bg-base-200 w-full max-w-sm">
      <input type="checkbox" />
      <div class="collapse-title text-sm font-medium">Скопировать ответный код</div>
      <div class="collapse-content">
        <div class="flex flex-col gap-2">
          <textarea id="p2p-manual-answer-text"
            class="textarea textarea-bordered textarea-xs font-mono text-xs h-20 w-full"
            readonly></textarea>
          <button class="btn btn-xs btn-outline w-full" onclick="window.p2pUI?.copyAnswerText()">Скопировать</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Manual input fallback (for paste mode) -->
  <div class="collapse collapse-arrow bg-base-200 w-full max-w-sm">
    <input type="checkbox" id="p2p-manual-paste-toggle" />
    <div class="collapse-title text-sm font-medium">Вставить код вручную</div>
    <div class="collapse-content">
      <div class="flex flex-col gap-2">
        <textarea id="p2p-paste-input"
          class="textarea textarea-bordered textarea-xs font-mono text-xs h-20 w-full"
          placeholder="Вставьте код от другого устройства..."></textarea>
        <button class="btn btn-xs btn-primary w-full" onclick="window.p2pUI?.processPastedCode()">
          Подключиться
        </button>
      </div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="flex gap-2 w-full max-w-sm">
    <button class="btn btn-ghost btn-sm flex-1" onclick="window.p2pUI?.cancel()">Отмена</button>
  </div>

</div>
{% endraw %}
