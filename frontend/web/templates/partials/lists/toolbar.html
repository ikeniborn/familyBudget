{#
  PARTIAL: Toolbar for Detail View
  Purpose: View controls, search toggle, hide completed toggle
  Desktop: Table/Hierarchy toggle visible
  Mobile: Only shared controls visible
  Used in: detail_view.html
#}

<!-- Toolbar - compact scrollable on mobile -->
<div class="toolbar">
    <!-- Shared Controls (visible in both views) -->
    <!-- Note: Mark All, Unmark All, Delete Completed moved to FAB menu -->
    <div class="flex gap-1 sm:gap-2" id="shared-controls">
        <button id="toggle-hide-completed-btn" class="btn btn-sm btn-outline sm:min-w-44" onclick="toggleHideCompleted()" title="Скрыть выполненные">
            <span>👁️</span><span class="hidden sm:inline ml-1">Скрыть выполненные</span>
        </button>
    </div>

    <!-- Search Toggle Button -->
    <div class="flex gap-1 sm:gap-2">
        <button id="toggle-search-btn" class="btn btn-sm btn-outline" onclick="toggleSearchField()" title="Поиск">
            <span>🔍</span><span class="hidden sm:inline ml-1">Поиск</span>
        </button>
    </div>

    <!-- Spacer -->
    <div class="flex-1 min-w-4"></div>

    <!-- Hierarchy-specific Controls (Hierarchy View Only) - moved to right side -->
    <div class="flex gap-1 sm:gap-2 hidden" id="hierarchy-controls">
        <button id="hierarchy-toggle-btn" class="btn btn-sm" onclick="toggleAllNodes()" title="Развернуть/свернуть все узлы" data-action="expand">
            <span id="hierarchy-toggle-icon">⬇️</span><span id="hierarchy-toggle-text" class="hidden sm:inline ml-1">Развернуть</span>
        </button>
    </div>

    <!-- View Toggle (Desktop Only) -->
    <div class="join flex-shrink-0 hidden sm:flex">
        <button class="btn btn-sm join-item" id="table-view-btn" onclick="switchView('table')" title="Вид таблицы">
            <span>📋</span><span class="hidden sm:inline ml-1">Таблица</span>
        </button>
        <button class="btn btn-sm join-item btn-outline" id="hierarchy-view-btn" onclick="switchView('hierarchy')" title="Иерархический вид">
            <span>🌳</span><span class="hidden sm:inline ml-1">Иерархия</span>
        </button>
    </div>
</div>
