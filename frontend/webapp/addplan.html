<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавить план - Семейный бюджет</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/webapp/static/css/telegram-theme.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/app.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/forms.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/shared-components.min.css?v=PLACEHOLDER">

    <!-- Choices.js -->
    <link rel="stylesheet" href="/webapp/static/css/vendor/choices.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/choices-telegram.min.css?v=PLACEHOLDER">

    <!-- Choices.js JS - load in head to ensure it's available before use -->
    <script src="/webapp/static/js/vendor/choices.min.js?v=PLACEHOLDER"></script>

    <style>
        /* Add plan specific styles */
        /* page-header, page-title, amount-input-wrapper, currency-label moved to shared-components.css */

        /* Extra margin for add plan page header */
        .page-header {
            margin-bottom: 24px;
        }

        /* Override amount-input colors for plan (uses link-color instead of button-color) */
        .amount-input {
            border-color: var(--tg-theme-link-color);
            color: var(--tg-theme-link-color);
        }

        .amount-input:focus {
            border-color: var(--tg-theme-button-color);
        }

        .category-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color);
        }

        .category-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-item:active {
            background-color: var(--tg-theme-secondary-bg-color);
        }

        .category-item.selected {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .category-item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .category-loading {
            padding: 16px;
            text-align: center;
            color: var(--tg-theme-hint-color);
        }

        .quick-amount-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .quick-amount-btn {
            padding: 8px;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color);
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 8px;
            color: var(--tg-theme-text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-amount-btn:active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .toggle-btn {
            font-size: 16px;
            font-weight: 500;
            padding: 12px;
        }

        .toggle-btn.active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border-color: var(--tg-theme-button-color);
        }

        .amount-input.expense {
            border-color: var(--tg-theme-destructive-text-color);
            color: var(--tg-theme-destructive-text-color);
        }

        .amount-input.income {
            border-color: #34c759;
            color: #34c759;
        }

        /* Period selector */
        .period-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .period-btn {
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-section-separator-color);
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .period-btn.active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border-color: var(--tg-theme-button-color);
        }

        .period-btn:active {
            opacity: 0.8;
        }

        /* Custom period section */
        .custom-period-section {
            display: none;
            margin-top: 16px;
        }

        .custom-period-section.active {
            display: block;
        }

        .date-range-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-range-row input {
            flex: 1;
        }

        .date-range-separator {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
        }

        /* Recurring checkbox */
        .recurring-option {
            display: flex;
            align-items: center;
            padding: 12px 0;
        }

        .recurring-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .recurring-label {
            font-size: 14px;
            color: var(--tg-theme-text-color);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">📝 Добавить план</div>
        </div>

        <!-- Plan Type Selector -->
        <div class="form-group">
            <label class="form-label">Тип категории</label>
            <div class="quick-amount-buttons" style="grid-template-columns: repeat(2, 1fr);">
                <button type="button" class="quick-amount-btn toggle-btn active" data-type="expense">Расход</button>
                <button type="button" class="quick-amount-btn toggle-btn" data-type="income">Доход</button>
            </div>
        </div>

        <!-- Quick Amount Buttons -->
        <div class="form-group">
            <label class="form-label">Быстрый выбор суммы</label>
            <div class="quick-amount-buttons">
                <button type="button" class="quick-amount-btn" data-amount="5000">5000</button>
                <button type="button" class="quick-amount-btn" data-amount="10000">10k</button>
                <button type="button" class="quick-amount-btn" data-amount="20000">20k</button>
                <button type="button" class="quick-amount-btn" data-amount="50000">50k</button>
            </div>
        </div>

        <!-- Amount Input -->
        <div class="form-group">
            <label class="form-label form-label-required">Плановая сумма</label>
            <div class="amount-input-wrapper">
                <input
                    type="number"
                    id="amount"
                    class="amount-input"
                    placeholder="0"
                    step="1"
                    min="1"
                    max="9999999"
                    inputmode="numeric"
                    required
                >
                <span class="currency-label"></span>
            </div>
            <span class="error-message" id="amount-error"></span>
        </div>

        <!-- Category Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Категория</label>
            <select id="category-select" class="form-input" required disabled>
                <option value="">Загрузка категорий...</option>
            </select>
            <div id="category-path-display" class="category-path-info" style="display: none;"></div>
            <span class="error-message" id="category-error"></span>
        </div>

        <!-- Account Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Счет</label>
            <select id="financial-center" class="form-input" required>
                <option value="">Загрузка...</option>
            </select>
            <span class="error-message" id="financial-center-error"></span>
        </div>

        <!-- Cost Location Select -->
        <div class="form-group">
            <label class="form-label">Место затрат</label>
            <select id="cost-center" class="form-input" disabled>
                <option value="">-- Не выбрано --</option>
            </select>
            <span class="error-message" id="cost-center-error"></span>
        </div>

        <!-- Period Selector -->
        <div class="form-group">
            <label class="form-label form-label-required">Период планирования</label>
            <div class="period-selector" style="grid-template-columns: repeat(3, 1fr);">
                <button class="period-btn active" data-period="month" id="period-btn-month">Месяц</button>
                <button class="period-btn" data-period="quarter" id="period-btn-quarter">Квартал</button>
                <button class="period-btn" data-period="year" id="period-btn-year">Год</button>
            </div>
            <span class="error-message" id="period-error"></span>
        </div>

        <!-- Description (optional) -->
        <div class="form-group">
            <label class="form-label">Описание (необязательно)</label>
            <textarea
                id="description"
                class="form-textarea"
                placeholder="Комментарий к плану..."
                maxlength="200"
                rows="3"
            ></textarea>
            <span class="char-counter" id="description-counter">0 / 200</span>
        </div>

        <!-- Recurring Option -->
        <div class="form-group">
            <div class="recurring-option">
                <input type="checkbox" id="recurring" class="recurring-checkbox">
                <label for="recurring" class="recurring-label">
                    Создавать автоматически каждый период
                </label>
            </div>
        </div>
    </div>

    <!-- Core JS modules -->
    <script src="/webapp/static/js/storage.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/theme.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/validators.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/ui.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/auth.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/api.min.js?v=PLACEHOLDER"></script>

    <!-- BudgetShared Bundle (DateFormatter, CalendarWidget, ChoicesCategoryTree) -->
    <script src="/shared/static/js/budgetShared.min.js?v=PLACEHOLDER"></script>

    <script src="/webapp/static/js/app.min.js?v=PLACEHOLDER"></script>

    <script>
        let formState = {
            planType: 'expense',  // 'income' or 'expense'
            amount: null,
            categoryId: null,
            financialCenterId: null,
            costCenterId: null,
            description: '',
            period: 'month',
            periodStart: null,
            periodEnd: null,
            recurring: false
        };

        let categories = [];
        let financialCenters = [];
        let costCenters = [];
        let categoryTreeSelect = null;
        // app is already declared globally in app.js

        // Page-specific initialization
        window.pageInit = async function(budgetApp) {
            console.log('Add plan page init');
            app = budgetApp;

            // Setup type selector
            setupTypeSelector();

            // Setup quick amount buttons
            setupQuickAmountButtons();

            // Setup amount input
            setupAmountInput();

            // Setup description counter
            setupDescriptionCounter();

            // Update period button texts with current date
            updatePeriodButtonTexts();

            // Setup period selector
            setupPeriodSelector();

            // Setup recurring checkbox
            setupRecurringCheckbox();

            // Setup date inputs for current period
            updatePeriodDates();

            // Load categories
            await loadCategories();

            // Load financial centers and cost centers
            await loadFinancialCenters();
            await loadCostCenters();

            // Setup MainButton for save
            setupMainButton();

            // Setup BackButton
            app.setupBackButton(() => {
                app.tg.close();
            });

            console.log('Add plan page ready');
        };

        function setupTypeSelector() {
            const buttons = document.querySelectorAll('.toggle-btn[data-type]');
            const amountInput = document.getElementById('amount');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');

                    // Update form state
                    formState.planType = button.dataset.type;

                    // Clear category selection when changing type to avoid mismatch
                    formState.categoryId = null;

                    // Update amount input style
                    amountInput.classList.remove('income', 'expense');
                    amountInput.classList.add(formState.planType);

                    // Reload categories for selected type
                    loadCategories();

                    // Haptic feedback
                    app.ui.hapticLight();
                });
            });
        }

        function updatePeriodButtonTexts() {
            const now = new Date();
            const monthNamesShort = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

            // Get current month and year
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            // Button 1: Current month "Окт 2025"
            const btn1Month = currentMonth;
            const btn1Year = currentYear;
            const btn1Text = `${monthNamesShort[btn1Month]} ${btn1Year}`;
            document.getElementById('period-btn-month').textContent = btn1Text;

            // Button 2: Next month "Ноя 2025"
            const btn2Month = (currentMonth + 1) % 12;
            const btn2Year = currentMonth === 11 ? currentYear + 1 : currentYear;
            const btn2Text = `${monthNamesShort[btn2Month]} ${btn2Year}`;
            document.getElementById('period-btn-quarter').textContent = btn2Text;

            // Button 3: Next+1 month "Дек 2025"
            const btn3Month = (currentMonth + 2) % 12;
            const btn3Year = currentMonth >= 10 ? currentYear + 1 : currentYear;
            const btn3Text = `${monthNamesShort[btn3Month]} ${btn3Year}`;
            document.getElementById('period-btn-year').textContent = btn3Text;
        }

        function setupQuickAmountButtons() {
            const buttons = document.querySelectorAll('.quick-amount-btn');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const amount = parseFloat(button.dataset.amount);
                    document.getElementById('amount').value = Math.round(amount);
                    formState.amount = amount;
                    app.ui.hapticLight();
                });
            });
        }

        function setupAmountInput() {
            const amountInput = document.getElementById('amount');

            amountInput.addEventListener('input', () => {
                const value = parseFloat(amountInput.value);
                formState.amount = isNaN(value) ? null : value;

                // Clear error on input
                document.getElementById('amount-error').textContent = '';
                amountInput.classList.remove('input-error');
            });
        }

        function setupDescriptionCounter() {
            const textarea = document.getElementById('description');
            const counter = document.getElementById('description-counter');

            textarea.addEventListener('input', () => {
                const length = textarea.value.length;
                counter.textContent = `${length} / 200`;

                if (length > 200) {
                    counter.classList.add('over-limit');
                } else {
                    counter.classList.remove('over-limit');
                }

                formState.description = textarea.value;
            });
        }

        function setupPeriodSelector() {
            const buttons = document.querySelectorAll('.period-btn');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');

                    // Update form state
                    formState.period = button.dataset.period;

                    // Update period dates
                    updatePeriodDates();

                    // Haptic feedback
                    app.ui.hapticLight();
                });
            });
        }

        function setupRecurringCheckbox() {
            const checkbox = document.getElementById('recurring');

            checkbox.addEventListener('change', () => {
                formState.recurring = checkbox.checked;
                app.ui.hapticLight();
            });
        }

        function updatePeriodDates() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            let startDate, endDate;
            let monthOffset = 0;

            // Determine month offset based on selected period button
            // 'month' = current month (offset 0)
            // 'quarter' = next month (offset 1)
            // 'year' = next+1 month (offset 2)
            if (formState.period === 'month') {
                monthOffset = 0;
            } else if (formState.period === 'quarter') {
                monthOffset = 1;
            } else if (formState.period === 'year') {
                monthOffset = 2;
            } else {
                return; // custom period (not used anymore)
            }

            // Calculate target month and year with offset
            const targetMonth = (currentMonth + monthOffset) % 12;
            const targetYear = currentMonth + monthOffset >= 12 ? currentYear + 1 : currentYear;

            // Start: first day of target month
            startDate = new Date(targetYear, targetMonth, 1);
            // End: last day of target month
            endDate = new Date(targetYear, targetMonth + 1, 0);

            // Format dates for API (YYYY-MM-DD) - use LOCAL timezone, not UTC
            const formatLocalDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            formState.periodStart = formatLocalDate(startDate);
            formState.periodEnd = formatLocalDate(endDate);
        }

        async function loadCategories() {
            const categorySelect = document.getElementById('category-select');

            try {
                if (categoryTreeSelect) {
                    // Update existing instance (more efficient than destroy/recreate)
                    await categoryTreeSelect.updateType(formState.planType);
                } else {
                    // Create ChoicesCategoryTree instance
                    if (typeof BudgetShared !== 'undefined' && BudgetShared.ChoicesCategoryTree) {
                        categoryTreeSelect = new BudgetShared.ChoicesCategoryTree('#category-select', {
                            type: formState.planType,
                            auth: window.auth,  // Pass auth instance for Bearer token
                            showLeafOnly: true,
                            mode: 'create',  // ✅ Create mode - prevents phantom auto-select on initial FC filter
                            onCategoryChange: (category) => {
                                formState.categoryId = category ? category.id : null;

                                // Clear error
                                document.getElementById('category-error').textContent = '';

                                // Haptic feedback
                                app.ui.hapticLight();

                                console.log('Category changed:', category);
                            }
                        });
                    } else {
                        console.warn('BudgetShared.ChoicesCategoryTree not loaded');
                        throw new Error('ChoicesCategoryTree not available');
                    }
                }

            } catch (error) {
                console.error('Failed to load categories:', error);
                categorySelect.innerHTML = '<option value="">Ошибка загрузки категорий</option>';
            }
        }

        async function loadFinancialCenters() {
            const select = document.getElementById('financial-center');

            try {
                const result = await app.api.get('/api/v1/financial-centers', { limit: 1000 });
                financialCenters = result.financial_centers || [];

                if (financialCenters.length === 0) {
                    select.innerHTML = '<option value="">Центры не найдены</option>';
                    return;
                }

                select.innerHTML = '<option value="">Выберите счет</option>';
                financialCenters.forEach(fc => {
                    const option = document.createElement('option');
                    option.value = fc.id;
                    option.textContent = fc.name;
                    select.appendChild(option);
                });

                select.addEventListener('change', async () => {
                    const fcId = parseInt(select.value) || null;
                    formState.financialCenterId = fcId;
                    document.getElementById('financial-center-error').textContent = '';

                    const categorySelect = document.getElementById('category-select');
                    const costCenterSelect = document.getElementById('cost-center');

                    if (fcId) {
                        // Update category filter based on selected FC
                        if (categoryTreeSelect) {
                            await categoryTreeSelect.updateFinancialCenter(fcId);
                            categoryTreeSelect.enable(); // use Choices.js API for visual update
                        } else if (categorySelect) {
                            categorySelect.removeAttribute('disabled');
                        }
                        if (costCenterSelect) costCenterSelect.removeAttribute('disabled');
                    } else {
                        // Disable Category and Cost Location and clear values
                        if (categoryTreeSelect) {
                            categoryTreeSelect.clearSelection(); // clear Choices.js active items + element.value
                            categoryTreeSelect.disable();        // visually disable via Choices.js API
                        } else if (categorySelect) {
                            categorySelect.setAttribute('disabled', 'disabled');
                            categorySelect.value = '';
                        }
                        formState.categoryId = null;
                        if (costCenterSelect) {
                            costCenterSelect.setAttribute('disabled', 'disabled');
                            costCenterSelect.value = '';
                        }
                        formState.costCenterId = null;
                    }

                    app.ui.hapticLight();
                });

            } catch (error) {
                console.error('Failed to load accounts:', error);
                select.innerHTML = '<option value="">Ошибка загрузки счетов</option>';
            }
        }

        async function loadCostCenters() {
            const select = document.getElementById('cost-center');

            try {
                const result = await app.api.get('/api/v1/cost-centers', { limit: 1000 });
                costCenters = result.cost_centers || [];

                if (costCenters.length === 0) {
                    select.innerHTML = '<option value="">-- Не выбрано --</option>';
                    return;
                }

                select.innerHTML = '<option value="">-- Не выбрано --</option>';
                costCenters.forEach(cc => {
                    const option = document.createElement('option');
                    option.value = cc.id;
                    option.textContent = cc.name;
                    select.appendChild(option);
                });

                select.addEventListener('change', () => {
                    formState.costCenterId = parseInt(select.value) || null;
                    document.getElementById('cost-center-error').textContent = '';
                    app.ui.hapticLight();
                });

            } catch (error) {
                console.error('Failed to load cost centers:', error);
                select.innerHTML = '<option value="">-- Не выбрано --</option>';
            }
        }

        function setupMainButton() {
            const mainButton = app.tg.MainButton;

            mainButton.setText('Сохранить план');
            mainButton.show();
            mainButton.enable();

            mainButton.onClick(async () => {
                await handleSave();
            });
        }

        async function handleSave() {
            console.log('Saving plan...', formState);

            // Validate form
            const errors = validateForm();
            if (Object.keys(errors).length > 0) {
                app.ui.hapticError();
                return;
            }

            // Show loading
            app.ui.showLoading('Сохранение...');

            try {
                // Create plan
                const result = await app.api.createFact({
                    article_id: formState.categoryId,
                    amount: formState.amount,
                    fact_date: formState.periodStart,
                    description: formState.description,
                    record_type: 'plan',
                    financial_center_id: formState.financialCenterId,
                    cost_center_id: formState.costCenterId
                    // TODO: Add support for recurring plans when backend is ready
                    // recurring: formState.recurring,
                    // period_type: formState.period,
                    // period_end: formState.periodEnd
                });

                app.ui.hideLoading();
                app.ui.haptic('success');
                app.ui.showSuccess('План сохранен', () => {
                    // Go back to main menu
                    app.tg.close();
                });

            } catch (error) {
                app.ui.hideLoading();
                app.ui.showError(`Ошибка: ${error.message}`);
            }
        }

        function validateForm() {
            const errors = {};

            // Amount validation
            const amountInput = document.getElementById('amount');
            const amountError = Validators.amount(formState.amount);
            if (amountError) {
                errors.amount = amountError;
                document.getElementById('amount-error').textContent = amountError;
                amountInput.classList.add('input-error');
            }

            // Category validation
            if (!formState.categoryId) {
                errors.category = 'Выберите категорию';
                document.getElementById('category-error').textContent = 'Выберите категорию';
            }

            // Account validation
            if (!formState.financialCenterId) {
                errors.financialCenter = 'Выберите счет';
                document.getElementById('financial-center-error').textContent = 'Выберите счет';
            }

            // Period validation - ensure dates are set
            updatePeriodDates();
            if (!formState.periodStart || !formState.periodEnd) {
                errors.period = 'Не удалось определить период планирования';
                document.getElementById('period-error').textContent = 'Не удалось определить период планирования';
            }

            return errors;
        }
    </script>
</body>
</html>
