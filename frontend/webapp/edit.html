<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Редактировать факт - Семейный бюджет</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/webapp/static/css/telegram-theme.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/app.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/forms.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/shared-components.min.css?v=PLACEHOLDER">

    <!-- Choices.js -->
    <link rel="stylesheet" href="/webapp/static/css/vendor/choices.min.css?v=PLACEHOLDER">
    <link rel="stylesheet" href="/webapp/static/css/choices-telegram.min.css?v=PLACEHOLDER">

    <!-- Choices.js JS - load in head to ensure it's available before use -->
    <script src="/webapp/static/js/vendor/choices.min.js?v=PLACEHOLDER"></script>

    <style>
        /* Edit transaction specific styles */
        /* page-header, page-title, amount-input, currency-label moved to shared-components.css */

        /* Extra margin for edit page header */
        .page-header {
            margin-bottom: 24px;
        }

        .category-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 12px;
            background-color: var(--tg-theme-bg-color);
        }

        .category-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-item:active {
            background-color: var(--tg-theme-secondary-bg-color);
        }

        .category-item.selected {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        .category-item-name {
            font-size: 16px;
            font-weight: 500;
        }

        .category-loading {
            padding: 16px;
            text-align: center;
            color: var(--tg-theme-hint-color);
        }

        .quick-amount-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .quick-amount-btn {
            padding: 8px;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color);
            border: 1px solid var(--tg-theme-section-separator-color);
            border-radius: 8px;
            color: var(--tg-theme-text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-amount-btn:active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        /* Delete button */
        .delete-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--tg-theme-section-separator-color);
        }

        .btn-delete {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            background-color: var(--tg-theme-destructive-text-color);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-delete:active {
            opacity: 0.8;
        }

        /* Loading state */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--tg-theme-bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 16px;
            color: var(--tg-theme-hint-color);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Загрузка факта...</div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">Редактировать факт</div>
        </div>

        <!-- Transaction Type Selector -->
        <div class="form-group">
            <label class="form-label">Тип категории</label>
            <div class="segmented-control">
                <button type="button" class="segmented-control-item" data-type="expense">Расход</button>
                <button type="button" class="segmented-control-item active" data-type="income">
                    Доход
                </button>
            </div>
        </div>

        <!-- Quick Amount Buttons -->
        <div class="form-group">
            <label class="form-label">Быстрый выбор суммы</label>
            <div class="quick-amount-buttons">
                <button type="button" class="quick-amount-btn" data-amount="100">100 </button>
                <button type="button" class="quick-amount-btn" data-amount="500">500 </button>
                <button type="button" class="quick-amount-btn" data-amount="1000">1000 </button>
                <button type="button" class="quick-amount-btn" data-amount="5000">5000 </button>
            </div>
        </div>

        <!-- Amount Input -->
        <div class="form-group">
            <label class="form-label form-label-required">Сумма</label>
            <div class="amount-input-wrapper">
                <input
                    type="number"
                    id="amount"
                    class="amount-input income"
                    placeholder="0"
                    step="1"
                    min="1"
                    max="9999999"
                    inputmode="numeric"
                    required
                >
                <span class="currency-label"></span>
            </div>
            <span class="error-message" id="amount-error"></span>
        </div>

        <!-- Category Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Категория</label>
            <select id="category-select" class="form-input" required>
                <option value="">Загрузка категорий...</option>
            </select>
            <div id="category-path-display" class="category-path-info" style="display: none;"></div>
            <span class="error-message" id="category-error"></span>
        </div>

        <!-- Description (optional) -->
        <div class="form-group">
            <label class="form-label">Описание (необязательно)</label>
            <textarea
                id="description"
                class="form-textarea"
                placeholder="Добавьте комментарий..."
                maxlength="200"
                rows="3"
            ></textarea>
            <span class="char-counter" id="description-counter">0 / 200</span>
        </div>

        <!-- Date Select -->
        <div class="form-group">
            <label class="form-label form-label-required">Дата</label>
            <div class="quick-amount-buttons" style="margin-bottom: 8px;">
                <button type="button" class="quick-amount-btn" data-days="0">Сегодня</button>
                <button type="button" class="quick-amount-btn" data-days="-1">Вчера</button>
                <button type="button" class="quick-amount-btn" data-days="-2">Позавчера</button>
            </div>
            <input
                type="date"
                id="fact-date"
                class="form-input"
                required
            >
            <span class="error-message" id="date-error"></span>
        </div>

        <!-- Delete Section -->
        <div class="delete-section">
            <button type="button" class="btn-delete" id="delete-btn">
                🗑 Удалить факт
            </button>
        </div>
    </div>

    <!-- Core JS modules -->
    <script src="/webapp/static/js/storage.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/theme.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/validators.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/ui.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/auth.min.js?v=PLACEHOLDER"></script>
    <script src="/webapp/static/js/api.min.js?v=PLACEHOLDER"></script>

    <!-- BudgetShared Bundle (DateFormatter, CalendarWidget, ChoicesCategoryTree) -->
    <script src="/shared/static/js/budgetShared.min.js?v=PLACEHOLDER"></script>

    <script src="/webapp/static/js/app.min.js?v=PLACEHOLDER"></script>

    <script>
        let formState = {
            factId: null,
            factType: 'income',  // 'income' or 'expense'
            amount: null,
            categoryId: null,
            description: '',
            factDate: null
        };

        let categories = [];
        let categoryTreeSelect = null;
        // app is already declared globally in app.js
        let originalFact = null;  // Original fact data for comparison

        // Page-specific initialization
        window.pageInit = async function(budgetApp) {
            console.log('Edit transaction page init');
            app = budgetApp;

            // Get fact ID from URL query params
            const urlParams = new URLSearchParams(window.location.search);
            const factId = urlParams.get('id');

            if (!factId) {
                app.ui.showError('ID транзакции не указан', () => {
                    window.location.href = '/webapp/index.html';
                });
                return;
            }

            formState.factId = parseInt(factId);

            // Load transaction data
            await loadTransaction(formState.factId);

            // Setup form controls
            setupTypeSelector();
            setupQuickAmountButtons();
            setupAmountInput();
            setupDescriptionCounter();
            setupDateInput();
            setupQuickDateButtons();

            // Load categories
            await loadCategories();

            // Setup delete button
            setupDeleteButton();

            // Setup MainButton for save
            setupMainButton();

            // Setup BackButton
            app.setupBackButton(() => {
                window.history.back();
            });

            console.log('Edit transaction page ready');
        };

        async function loadTransaction(factId) {
            const loadingOverlay = document.getElementById('loading-overlay');
            const mainContent = document.getElementById('main-content');

            try {
                // Fetch fact details
                const result = await app.api.listFacts({ limit: 1000 });
                const facts = result.facts || [];

                // Find the fact by ID
                originalFact = facts.find(f => f.id === factId);

                if (!originalFact) {
                    throw new Error('Факт не найден');
                }

                // Populate form state
                // CRITICAL FIX: Use article_type from API instead of amount sign
                formState.factType = originalFact.article_type || 'expense';
                formState.amount = Math.abs(originalFact.amount);
                formState.categoryId = originalFact.article_id;
                formState.description = originalFact.description || '';
                formState.factDate = originalFact.fact_date;

                // Populate form fields
                populateFormFields();

                // Hide loading, show content
                loadingOverlay.style.display = 'none';
                mainContent.style.display = 'block';

            } catch (error) {
                console.error('Failed to load transaction:', error);
                app.ui.showError(`Ошибка загрузки: ${error.message}`, () => {
                    window.history.back();
                });
            }
        }

        function populateFormFields() {
            // Type selector
            const typeButtons = document.querySelectorAll('.segmented-control-item');
            typeButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === formState.factType) {
                    btn.classList.add('active');
                }
            });

            // Amount
            const amountInput = document.getElementById('amount');
            amountInput.value = String(formState.amount);
            amountInput.classList.remove('income', 'expense');
            amountInput.classList.add(formState.factType);

            // Description
            const descriptionInput = document.getElementById('description');
            descriptionInput.value = formState.description;
            const counter = document.getElementById('description-counter');
            counter.textContent = `${formState.description.length} / 200`;

            // Date (native date input accepts YYYY-MM-DD)
            const dateInput = document.getElementById('fact-date');
            dateInput.value = formState.factDate; // Already in YYYY-MM-DD format from API

            // Category will be selected after categories are loaded
        }

        function setupTypeSelector() {
            const buttons = document.querySelectorAll('.segmented-control-item');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');

                    // Update form state
                    formState.factType = button.dataset.type;

                    // CRITICAL FIX: Clear category selection when changing type to avoid mismatch
                    formState.categoryId = null;

                    // Update amount input style
                    const amountInput = document.getElementById('amount');
                    amountInput.classList.remove('income', 'expense');
                    amountInput.classList.add(formState.factType);

                    // Reload categories for selected type
                    loadCategories();

                    // Haptic feedback
                    app.ui.hapticLight();
                });
            });
        }

        function setupQuickAmountButtons() {
            const buttons = document.querySelectorAll('.quick-amount-btn[data-amount]');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const amount = Number.parseInt(button.dataset.amount, 10);
                    document.getElementById('amount').value = String(amount);
                    formState.amount = amount;
                    app.ui.hapticLight();
                });
            });
        }

        function setupAmountInput() {
            const amountInput = document.getElementById('amount');

            amountInput.addEventListener('input', () => {
                const value = Number.parseInt(amountInput.value, 10);
                formState.amount = isNaN(value) ? null : value;

                // Clear error on input
                document.getElementById('amount-error').textContent = '';
                amountInput.classList.remove('input-error');
            });
        }

        function setupDescriptionCounter() {
            const textarea = document.getElementById('description');
            const counter = document.getElementById('description-counter');

            textarea.addEventListener('input', () => {
                const length = textarea.value.length;
                counter.textContent = `${length} / 200`;

                if (length > 200) {
                    counter.classList.add('over-limit');
                } else {
                    counter.classList.remove('over-limit');
                }

                formState.description = textarea.value;
            });
        }

        function setupDateInput() {
            const dateInput = document.getElementById('fact-date');

            dateInput.addEventListener('input', () => {
                // Native date input value is already in YYYY-MM-DD format
                formState.factDate = dateInput.value;

                // Clear error
                document.getElementById('date-error').textContent = '';
                dateInput.classList.remove('input-error');
            });

            dateInput.addEventListener('blur', () => {
                // Native date input automatically validates format
                if (!dateInput.value) {
                    document.getElementById('date-error').textContent = 'Дата обязательна';
                    dateInput.classList.add('input-error');
                }
            });
        }

        function setupQuickDateButtons() {
            const buttons = document.querySelectorAll('.quick-amount-buttons button[data-days]');
            const dateInput = document.getElementById('fact-date');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const daysOffset = parseInt(button.dataset.days);
                    const date = new Date();
                    date.setDate(date.getDate() + daysOffset);

                    // Format for native date input (YYYY-MM-DD)
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const isoDate = `${year}-${month}-${day}`;

                    // Set value for native date input (accepts YYYY-MM-DD)
                    dateInput.value = isoDate;
                    formState.factDate = isoDate;

                    // Clear error
                    document.getElementById('date-error').textContent = '';
                    dateInput.classList.remove('input-error');

                    // Haptic feedback
                    app.ui.hapticLight();
                });
            });
        }

        async function loadCategories() {
            const categorySelect = document.getElementById('category-select');

            try {
                if (categoryTreeSelect) {
                    // Update existing instance (more efficient than destroy/recreate)
                    await categoryTreeSelect.updateType(formState.factType);
                } else {
                    // Create ChoicesCategoryTree instance
                    if (typeof BudgetShared !== 'undefined' && BudgetShared.ChoicesCategoryTree) {
                        categoryTreeSelect = new BudgetShared.ChoicesCategoryTree('#category-select', {
                            type: formState.factType,
                            auth: window.auth,  // Pass auth instance for Bearer token
                            showLeafOnly: true,
                            mode: 'edit',  // ✅ Edit mode - preserves category on FC filter (editing existing record)
                            onCategoryChange: (category) => {
                                formState.categoryId = category ? category.id : null;

                                // Clear error
                                document.getElementById('category-error').textContent = '';

                                // Haptic feedback
                                app.ui.hapticLight();

                                console.log('Category changed:', category);
                            }
                        });

                        // Set selected category only after initial creation (not on type change)
                        if (formState.categoryId) {
                            await categoryTreeSelect.setSelectedCategory(formState.categoryId);
                        }
                    } else {
                        console.warn('BudgetShared.ChoicesCategoryTree not loaded');
                        throw new Error('ChoicesCategoryTree not available');
                    }
                }

            } catch (error) {
                console.error('Failed to load categories:', error);
                categorySelect.innerHTML = '<option value="">Ошибка загрузки категорий</option>';
            }
        }

        function setupDeleteButton() {
            const deleteBtn = document.getElementById('delete-btn');

            deleteBtn.addEventListener('click', async () => {
                app.ui.hapticLight();

                // Show confirmation dialog
                const confirmed = confirm('Вы уверены, что хотите удалить этот факт? Это действие нельзя отменить.');

                if (!confirmed) {
                    return;
                }

                // Show loading
                app.ui.showLoading('Удаление...');

                try {
                    await app.api.deleteFact(formState.factId);

                    app.ui.hideLoading();
                    app.ui.showSuccess('Факт удален', () => {
                        window.location.href = '/webapp/index.html';
                    });

                } catch (error) {
                    app.ui.hideLoading();
                    console.error('Delete error:', error);
                    const errorMessage = error.detail || error.message || String(error);
                    app.ui.showError(`Ошибка удаления: ${errorMessage}`);
                }
            });
        }

        function setupMainButton() {
            const mainButton = app.tg.MainButton;

            mainButton.setText('СОХРАНИТЬ ИЗМЕНЕНИЯ');
            mainButton.show();
            mainButton.enable();

            mainButton.onClick(async () => {
                await handleSave();
            });
        }

        async function handleSave() {
            console.log('Saving transaction...', formState);

            // Validate form
            const errors = validateForm();
            if (Object.keys(errors).length > 0) {
                app.ui.hapticError();
                return;
            }

            // Show loading
            app.ui.showLoading('Сохранение...');

            try {
                // Prepare update data
                const updateData = {
                    amount: formState.amount,
                    article_id: formState.categoryId,
                    description: formState.description,
                    fact_date: formState.factDate
                };

                // Update fact
                const result = await app.api.updateFact(formState.factId, updateData);

                app.ui.hideLoading();
                app.ui.showSuccess('Факт обновлен', () => {
                    window.history.back();
                });

            } catch (error) {
                app.ui.hideLoading();
                console.error('Update error:', error);
                const errorMessage = error.detail || error.message || String(error);
                app.ui.showError(`Ошибка: ${errorMessage}`);
            }
        }

        function validateForm() {
            const errors = {};

            // Amount validation
            const amountInput = document.getElementById('amount');
            const amountError = Validators.amount(formState.amount);
            if (amountError) {
                errors.amount = amountError;
                document.getElementById('amount-error').textContent = amountError;
                amountInput.classList.add('input-error');
            }

            // Category validation
            if (!formState.categoryId) {
                errors.category = 'Выберите категорию';
                document.getElementById('category-error').textContent = 'Выберите категорию';
            }

            // Date validation
            const dateInput = document.getElementById('fact-date');
            const dateError = Validators.date(formState.factDate);
            if (dateError) {
                errors.date = dateError;
                document.getElementById('date-error').textContent = dateError;
                dateInput.classList.add('input-error');
            }

            return errors;
        }
    </script>
</body>
</html>
