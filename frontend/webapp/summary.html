<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>План&Факт - Семейный бюджет</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/webapp/static/css/telegram-theme.min.css?v=v20260124_1018">
    <link rel="stylesheet" href="/webapp/static/css/app.min.css?v=v20260124_1018">
    <link rel="stylesheet" href="/webapp/static/css/forms.min.css?v=v20260124_1018">
    <link rel="stylesheet" href="/webapp/static/css/shared-components.min.css?v=v20260124_1018">

    <style>
        /* Summary page specific styles */
        /* page-header, page-title, period-selector moved to shared-components.css */

        /* Total summary card */
        .total-summary {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .total-summary-title {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 16px;
            text-align: center;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .total-label {
            font-size: 14px;
            color: var(--tg-theme-text-color);
        }

        .total-values {
            text-align: right;
        }

        .total-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
        }

        .total-diff {
            font-size: 12px;
            margin-top: 2px;
        }

        .total-diff.positive {
            color: #34c759;
        }

        .total-diff.negative {
            color: var(--tg-theme-destructive-text-color);
        }

        /* Category comparison list */
        .comparison-section {
            margin-bottom: 24px;
        }

        .comparison-header {
            font-size: 18px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .comparison-list {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .comparison-item {
            padding: 16px;
            border-bottom: 1px solid var(--tg-theme-section-separator-color);
        }

        .comparison-item:last-child {
            border-bottom: none;
        }

        .comparison-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .category-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--tg-theme-text-color);
        }

        .category-diff {
            font-size: 14px;
            font-weight: 600;
        }

        .category-diff.positive {
            color: #34c759;
        }

        .category-diff.negative {
            color: var(--tg-theme-destructive-text-color);
        }

        .comparison-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .value-box {
            text-align: center;
            padding: 8px;
            background-color: var(--tg-theme-bg-color);
            border-radius: 8px;
        }

        .value-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 4px;
        }

        .value-amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-text-color);
        }

        /* Progress bar */
        .progress-bar-container {
            position: relative;
            height: 8px;
            background-color: var(--tg-theme-section-separator-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .progress-bar.positive {
            background-color: #34c759;
        }

        .progress-bar.negative {
            background-color: var(--tg-theme-destructive-text-color);
        }

        .progress-bar.neutral {
            background-color: var(--tg-theme-link-color);
        }

        .progress-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
            text-align: center;
            margin-top: 4px;
        }

        /* States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 24px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }

        .loading-spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Custom range container */
        .custom-range-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .custom-range-container input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-section-separator-color);
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }

        .custom-range-container button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-button-color);
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            cursor: pointer;
        }

        .custom-range-container button.cancel {
            background-color: transparent;
            color: var(--tg-theme-button-color);
        }

        @media (max-width: 640px) {
            .custom-range-container {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">📊 План&Факт</div>
        </div>

        <!-- Period Selector -->
        <div class="period-selector">
            <button class="period-btn active" data-period="month">Месяц</button>
            <button class="period-btn" data-period="quarter">Квартал</button>
            <button class="period-btn" data-period="year">Год</button>
            <button class="period-btn" data-period="custom">Произвольный</button>
        </div>

        <!-- Custom Range Container (hidden by default) -->
        <div class="custom-range-container" id="custom-range-container" style="display: none;">
            <input type="text" id="date-from" readonly placeholder="ДД.ММ.ГГГГ">
            <span>—</span>
            <input type="text" id="date-to" readonly placeholder="ДД.ММ.ГГГГ">
            <button onclick="applyCustomRange()">Применить</button>
            <button class="cancel" onclick="cancelCustomRange()">Отмена</button>
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loading-state">
            <div class="loading-spinner"></div>
            <div style="margin-top: 16px;">Загрузка данных...</div>
        </div>

        <!-- Content -->
        <div id="summary-content" style="display: none;">
            <!-- Total Summary -->
            <div class="total-summary">
                <div class="total-summary-title" id="period-title">За месяц</div>

                <div class="total-row">
                    <span class="total-label">📉 Расходы</span>
                    <div class="total-values">
                        <div class="total-value" id="total-expense-fact">0</div>
                        <div class="total-diff" id="total-expense-diff"></div>
                    </div>
                </div>

                <div class="total-row">
                    <span class="total-label">📈 Доходы</span>
                    <div class="total-values">
                        <div class="total-value" id="total-income-fact">0</div>
                        <div class="total-diff" id="total-income-diff"></div>
                    </div>
                </div>
            </div>

            <!-- Expenses Breakdown -->
            <div class="comparison-section" id="expense-section" style="display: none;">
                <div class="comparison-header">📉 Расходы по категориям</div>
                <div class="comparison-list" id="expense-list">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Income Breakdown -->
            <div class="comparison-section" id="income-section" style="display: none;">
                <div class="comparison-header">📈 Доходы по категориям</div>
                <div class="comparison-list" id="income-list">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-state-icon">📊</div>
            <div class="empty-state-text">Нет данных за выбранный период<br>Создайте план для сравнения</div>
            <button class="btn btn-primary" onclick="window.location.href='/webapp/addplan.html'">
                Создать план
            </button>
        </div>
    </div>

    <!-- Core JS modules -->
    <script src="/webapp/static/js/storage.min.js?v=v20260124_1018"></script>
    <script src="/webapp/static/js/theme.min.js?v=v20260124_1018"></script>
    <script src="/webapp/static/js/validators.min.js?v=v20260124_1018"></script>
    <script src="/webapp/static/js/ui.min.js?v=v20260124_1018"></script>
    <script src="/webapp/static/js/auth.min.js?v=v20260124_1018"></script>
    <script src="/webapp/static/js/api.min.js?v=v20260124_1018"></script>

    <!-- BudgetShared bundle (DateFormatter, CalendarWidget, ChoicesCategoryTree) -->
    <script src="/shared/static/js/budgetShared.min.js?v=v20260124_1018"></script>

    <script src="/webapp/static/js/app.min.js?v=v20260124_1018"></script>

    <script>
        // app is already declared globally in app.js
        let facts = [];
        let categories = [];
        let currentPeriod = 'month';

        // Custom date range support
        let calendarWidget = null;
        let customDateFrom = null;
        let customDateTo = null;

        // Page-specific initialization
        window.pageInit = async function(budgetApp) {
            console.log('Summary page init');
            app = budgetApp;

            // Setup period selector
            setupPeriodSelector();

            // Load categories
            await loadCategories();

            // Load summary for default period
            await loadSummary(currentPeriod);

            // Setup BackButton to return to main menu
            app.setupBackButton(() => {
                window.location.href = '/webapp/index.html';
            });

            console.log('Summary page ready');
        };

        function setupPeriodSelector() {
            const buttons = document.querySelectorAll('.period-btn');

            buttons.forEach(button => {
                button.addEventListener('click', async () => {
                    app.ui.hapticLight();
                    const period = button.dataset.period;

                    // Handle custom period - show calendar
                    if (period === 'custom') {
                        buttons.forEach(b => b.classList.remove('active'));
                        button.classList.add('active');
                        toggleCustomRange();
                        return;
                    }

                    // Regular period - hide custom range and load summary
                    document.getElementById('custom-range-container').style.display = 'none';
                    buttons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    currentPeriod = period;
                    await loadSummary(currentPeriod);
                });
            });
        }

        async function loadCategories() {
            try {
                const result = await app.api.listArticles({});
                categories = result.articles || [];
            } catch (error) {
                console.error('Failed to load categories:', error);
            }
        }

        function toggleCustomRange() {
            const container = document.getElementById('custom-range-container');
            container.style.display = 'flex';

            if (!calendarWidget && typeof BudgetShared !== 'undefined' && BudgetShared.CalendarWidget) {
                try {
                    const dateFromInput = document.getElementById('date-from');
                    const dateToInput = document.getElementById('date-to');

                    // Change inputs to native date type for better UX
                    dateFromInput.type = 'date';
                    dateToInput.type = 'date';

                    // Set max to today
                    const today = new Date().toISOString().split('T')[0];
                    dateFromInput.max = today;
                    dateToInput.max = today;

                    // Set default values (last 30 days)
                    const from = new Date();
                    from.setDate(from.getDate() - 30);
                    dateFromInput.value = from.toISOString().split('T')[0];
                    dateToInput.value = today;

                    calendarWidget = true;
                } catch (error) {
                    console.error('Failed to initialize calendar:', error);
                }
            }
        }

        function applyCustomRange() {
            const dateFromInput = document.getElementById('date-from');
            const dateToInput = document.getElementById('date-to');

            customDateFrom = dateFromInput.value; // YYYY-MM-DD format
            customDateTo = dateToInput.value;

            if (!customDateFrom || !customDateTo) {
                app.tg.showAlert('Выберите даты');
                return;
            }

            if (customDateFrom > customDateTo) {
                app.tg.showAlert('Дата "от" должна быть раньше даты "до"');
                return;
            }

            document.getElementById('custom-range-container').style.display = 'none';
            currentPeriod = 'custom';
            loadSummary(currentPeriod);
            app.ui.hapticLight();
        }

        function cancelCustomRange() {
            document.getElementById('custom-range-container').style.display = 'none';

            if (currentPeriod === 'custom') {
                currentPeriod = 'month';
            }

            const buttons = document.querySelectorAll('.period-btn');
            buttons.forEach(b => {
                b.classList.remove('active');
                if (b.dataset.period === currentPeriod) {
                    b.classList.add('active');
                }
            });

            loadSummary(currentPeriod);
            app.ui.hapticLight();
        }

        async function loadSummary(period) {
            const loadingState = document.getElementById('loading-state');
            const summaryContent = document.getElementById('summary-content');
            const emptyState = document.getElementById('empty-state');

            try {
                // Show loading
                loadingState.style.display = 'block';
                summaryContent.style.display = 'none';
                emptyState.style.display = 'none';

                // Get date range for period
                const { dateFrom, dateTo } = getDateRange(period);

                // Fetch facts (both plan and fact)
                const result = await app.api.listFacts({
                    date_from: dateFrom,
                    date_to: dateTo,
                    limit: 10000
                });

                facts = result.facts || [];

                // Hide loading
                loadingState.style.display = 'none';

                if (facts.length === 0) {
                    // Show empty state
                    emptyState.style.display = 'block';
                } else {
                    // Calculate and display summary
                    displaySummary(facts, period);
                    summaryContent.style.display = 'block';
                }

            } catch (error) {
                console.error('Failed to load summary:', error);
                loadingState.innerHTML = `<div style="color: var(--tg-theme-destructive-text-color);">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        function getDateRange(period) {
            const now = new Date();
            let dateFrom, dateTo;

            // Handle custom period
            if (period === 'custom' && customDateFrom && customDateTo) {
                return {
                    dateFrom: customDateFrom, // Already in YYYY-MM-DD format
                    dateTo: customDateTo
                };
            }

            switch (period) {
                case 'month':
                    // Current month - from 1st to today
                    dateFrom = new Date(now.getFullYear(), now.getMonth(), 1);
                    dateTo = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    break;

                case 'quarter':
                    // Current quarter - from quarter start to today
                    const quarter = Math.floor(now.getMonth() / 3);
                    dateFrom = new Date(now.getFullYear(), quarter * 3, 1);
                    dateTo = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    break;

                case 'year':
                    // Current year - from Jan 1 to today
                    dateFrom = new Date(now.getFullYear(), 0, 1);
                    dateTo = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    break;
            }

            // Format dates for API (YYYY-MM-DD) - use LOCAL timezone, not UTC
            const formatLocalDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            return {
                dateFrom: formatLocalDate(dateFrom),
                dateTo: formatLocalDate(dateTo)
            };
        }

        function displaySummary(facts, period) {
            // Update period title with dates
            const periodTitles = {
                'month': 'За месяц',
                'quarter': 'За квартал',
                'year': 'За год',
                'custom': 'Произвольный период'
            };

            let title = periodTitles[period] || 'Период';

            // Add dates to title if available
            if (typeof BudgetShared !== 'undefined' && BudgetShared.DateFormatter) {
                const range = getDateRange(period);
                if (range && range.dateFrom && range.dateTo) {
                    const displayFrom = BudgetShared.DateFormatter.formatForDisplay(range.dateFrom);
                    const displayTo = BudgetShared.DateFormatter.formatForDisplay(range.dateTo);
                    title += `: ${displayFrom} — ${displayTo}`;
                }
            }

            document.getElementById('period-title').textContent = title;

            // Group by category and record_type
            const grouped = groupByCategory(facts);

            // Calculate totals
            const totals = calculateTotals(grouped);
            updateTotals(totals);

            // Display category breakdowns
            displayCategoryBreakdown('expense', grouped);
            displayCategoryBreakdown('income', grouped);
        }

        function groupByCategory(facts) {
            const grouped = {};

            facts.forEach(fact => {
                const categoryId = fact.article_id;
                const recordType = fact.record_type || 'fact'; // Default to 'fact' if not specified
                // Use article_type from API response instead of amount sign
                const type = fact.article_type || (fact.amount > 0 ? 'income' : 'expense');

                if (!grouped[categoryId]) {
                    grouped[categoryId] = {
                        income: { plan: 0, fact: 0 },
                        expense: { plan: 0, fact: 0 }
                    };
                }

                const amount = Math.abs(fact.amount);
                grouped[categoryId][type][recordType] += amount;
            });

            return grouped;
        }

        function calculateTotals(grouped) {
            const totals = {
                income: { plan: 0, fact: 0, diff: 0 },
                expense: { plan: 0, fact: 0, diff: 0 }
            };

            Object.values(grouped).forEach(data => {
                totals.income.plan += data.income.plan;
                totals.income.fact += data.income.fact;
                totals.expense.plan += data.expense.plan;
                totals.expense.fact += data.expense.fact;
            });

            totals.income.diff = totals.income.fact - totals.income.plan;
            totals.expense.diff = totals.expense.plan - totals.expense.fact; // Positive = economy

            return totals;
        }

        function updateTotals(totals) {
            // Expenses
            document.getElementById('total-expense-fact').textContent = `${app.ui.formatAmount(totals.expense.fact)}`;
            const expenseDiffEl = document.getElementById('total-expense-diff');
            const expenseSign = totals.expense.diff >= 0 ? '+' : '';
            expenseDiffEl.textContent = `План: ${app.ui.formatAmount(totals.expense.plan)} (${expenseSign}${app.ui.formatAmount(totals.expense.diff)})`;
            expenseDiffEl.className = `total-diff ${totals.expense.diff >= 0 ? 'positive' : 'negative'}`;

            // Income
            document.getElementById('total-income-fact').textContent = `${app.ui.formatAmount(totals.income.fact)}`;
            const incomeDiffEl = document.getElementById('total-income-diff');
            const incomeSign = totals.income.diff >= 0 ? '+' : '';
            incomeDiffEl.textContent = `План: ${app.ui.formatAmount(totals.income.plan)} (${incomeSign}${app.ui.formatAmount(totals.income.diff)})`;
            incomeDiffEl.className = `total-diff ${totals.income.diff >= 0 ? 'positive' : 'negative'}`;
        }

        function displayCategoryBreakdown(type, grouped) {
            const sectionId = `${type}-section`;
            const listId = `${type}-list`;
            const section = document.getElementById(sectionId);
            const list = document.getElementById(listId);

            // Filter categories with plan or fact for this type
            const items = [];
            Object.entries(grouped).forEach(([categoryId, data]) => {
                if (data[type].plan > 0 || data[type].fact > 0) {
                    items.push({
                        categoryId: parseInt(categoryId),
                        plan: data[type].plan,
                        fact: data[type].fact,
                        diff: type === 'expense'
                            ? data[type].plan - data[type].fact  // Positive = economy
                            : data[type].fact - data[type].plan, // Positive = exceeded plan
                        percent: data[type].plan > 0
                            ? (data[type].fact / data[type].plan * 100)
                            : 0
                    });
                }
            });

            if (items.length === 0) {
                section.style.display = 'none';
                return;
            }

            // Sort by plan amount descending
            items.sort((a, b) => b.plan - a.plan);

            section.style.display = 'block';
            list.innerHTML = '';

            items.forEach(item => {
                const category = categories.find(c => c.id === item.categoryId);
                const categoryName = category ? category.name : `Категория #${item.categoryId}`;

                const element = createComparisonItem(categoryName, item, type);
                list.appendChild(element);
            });
        }

        function createComparisonItem(name, data, type) {
            const item = document.createElement('div');
            item.className = 'comparison-item';

            // Header
            const header = document.createElement('div');
            header.className = 'comparison-item-header';

            const categoryName = document.createElement('div');
            categoryName.className = 'category-name';
            categoryName.textContent = name;

            const diffEl = document.createElement('div');
            diffEl.className = 'category-diff';
            const diffSign = data.diff >= 0 ? '✅ +' : '⚠️ ';
            const diffText = type === 'expense'
                ? (data.diff >= 0 ? 'Экономия' : 'Превышение')
                : (data.diff >= 0 ? 'Превышение' : 'Недобор');
            diffEl.textContent = `${diffSign}${diffText}: ${app.ui.formatAmount(Math.abs(data.diff))}`;
            diffEl.classList.add(data.diff >= 0 ? 'positive' : 'negative');

            header.appendChild(categoryName);
            header.appendChild(diffEl);

            // Values
            const values = document.createElement('div');
            values.className = 'comparison-values';

            const planBox = document.createElement('div');
            planBox.className = 'value-box';
            planBox.innerHTML = `
                <div class="value-label">План</div>
                <div class="value-amount">${app.ui.formatAmount(data.plan)}</div>
            `;

            const factBox = document.createElement('div');
            factBox.className = 'value-box';
            factBox.innerHTML = `
                <div class="value-label">Факт</div>
                <div class="value-amount">${app.ui.formatAmount(data.fact)}</div>
            `;

            values.appendChild(planBox);
            values.appendChild(factBox);

            // Progress bar
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-bar-container';

            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            const progressPercent = Math.min(data.percent, 150); // Cap at 150%
            progressBar.style.width = `${progressPercent}%`;

            if (type === 'expense') {
                // Expense: <100% is good (economy), >100% is bad (overspent)
                progressBar.classList.add(data.percent <= 100 ? 'positive' : 'negative');
            } else {
                // Income: >100% is good (exceeded), <100% is bad (underperformed)
                progressBar.classList.add(data.percent >= 100 ? 'positive' : 'negative');
            }

            progressContainer.appendChild(progressBar);

            const progressLabel = document.createElement('div');
            progressLabel.className = 'progress-label';
            progressLabel.textContent = `${data.percent.toFixed(1)}% от плана`;

            // Assemble
            item.appendChild(header);
            item.appendChild(values);
            item.appendChild(progressContainer);
            item.appendChild(progressLabel);

            return item;
        }
    </script>
</body>
</html>
