# HTTPS Server - Port 443
# SSL already configured - see below
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name budget-dev.ikeniborn.ru;
#
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/budget-dev.ikeniborn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget-dev.ikeniborn.ru/privkey.pem;
#
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
#
    # HSTS (optional - uncomment for production)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
#
    # Logging
    access_log /var/log/nginx/budget-dev.ikeniborn.ru_ssl_access.log;
    error_log /var/log/nginx/budget-dev.ikeniborn.ru_ssl_error.log;
#
    # Client upload size
    client_max_body_size 20M;
#
    # Backend API endpoints
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
#
        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
#
    # Health check endpoint
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }
#
    # Swagger/OpenAPI docs
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
#
    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
#
    # Static files
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
#
    # Telegram WebApp files - smart caching with ETag for optimal performance
    location /webapp/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
#
        # Always validate freshness, but use ETag to save bandwidth
        # Browser checks with server on each request
        # Server returns 304 Not Modified if file unchanged (saves 95%+ traffic)
        add_header Cache-Control "no-cache, must-revalidate" always;
#
        # Enable ETag for conditional requests
        etag on;
#
        # Use If-Modified-Since header for additional optimization
        if_modified_since before;
    }
#
    # Root - web interface
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name budget-dev.ikeniborn.ru;
#
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
#
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
