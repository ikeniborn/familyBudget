[pytest]
# Pytest configuration for Family Budget project

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires backend/db)
    e2e: End-to-end tests (requires full stack)
    playwright: Playwright UI tests
    webapp: Web Apps specific tests
    backend: Backend API tests
    slow: Slow running tests

# Output options
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using --cov)
# Run with: pytest --cov=backend --cov=webapp --cov-report=html
[coverage:run]
source = backend,webapp
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
