<!DOCTYPE html>
<html>
<head>
    <title>Test Articles API</title>
</head>
<body>
    <h1>Articles API Test</h1>
    <button onclick="testApi()">Test Articles API</button>
    <pre id="output"></pre>

    <script>
        async function testApi() {
            const output = document.getElementById('output');
            output.textContent = 'Testing...\n';

            try {
                // Test GET articles
                const response = await fetch('/api/articles/');
                const data = await response.json();

                output.textContent += `Status: ${response.status}\n`;
                output.textContent += `Response: ${JSON.stringify(data, null, 2)}\n`;

                // Test stats
                const statsResponse = await fetch('/api/articles/stats');
                const statsData = await statsResponse.json();
                output.textContent += `\nStats: ${JSON.stringify(statsData, null, 2)}\n`;

            } catch (error) {
                output.textContent += `Error: ${error}\n`;
            }
        }

        // Auto-run on load
        window.addEventListener('load', testApi);
    </script>
</body>
</html>
