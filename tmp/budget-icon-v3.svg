<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Столбчатый график -->
  <rect x="80" y="280" width="56" height="120" rx="8" fill="#fff" opacity="0.6"/>
  <rect x="156" y="220" width="56" height="180" rx="8" fill="#fff" opacity="0.75"/>
  <rect x="232" y="160" width="56" height="240" rx="8" fill="#fff" opacity="0.9"/>
  
  <!-- Символ рубля (изящный) -->
  <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Вертикальная линия -->
    <line x1="340" y1="130" x2="340" y2="380"/>
    <!-- Верхняя дуга (полукруг) -->
    <path d="M340 130 L380 130 Q430 130 430 190 Q430 250 380 250 L340 250"/>
    <!-- Горизонтальная черта -->
    <line x1="310" y1="300" x2="400" y2="300"/>
  </g>
</svg>
