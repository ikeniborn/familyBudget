<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 1: Card-Based Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-record {
            transition: all 0.2s ease;
        }
        .card-record:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .card-record.selected {
            border-color: oklch(var(--p));
            border-width: 2px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-incomplete { background-color: #ef4444; }
        .status-partial { background-color: #f59e0b; }
        .status-ready { background-color: #22c55e; }
    </style>
</head>
<body class="bg-base-200 min-h-screen p-6">
    <!--
    ============================================================
    ВАРИАНТ 1: Card-Based Layout
    ============================================================

    КОНЦЕПЦИЯ:
    - Каждая staging запись отображается как компактная карточка
    - Grid layout: 3-4 карточки в ряд (responsive)
    - Основные данные (дата, сумма, описание) видны сразу
    - Selects для категории/счёта внутри карточки
    - Hover показывает дополнительные actions
    - Визуальные индикаторы статуса готовности

    ПРЕИМУЩЕСТВА:
    + Визуально понятный статус каждой записи
    + Компактное отображение большого количества записей
    + Удобно для массовых операций с чекбоксами
    + Мобильно-дружественный (1 карточка на экран)

    НЕДОСТАТКИ:
    - Требует больше вертикального пространства
    - Сложнее сравнивать записи между собой
    - Много кликов для редактирования всех полей
    ============================================================
    -->

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Вариант 1: Card-Based Layout</h1>
            <p class="text-base-content/70">Каждая запись как карточка в адаптивной сетке</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats shadow mb-6 w-full">
            <div class="stat">
                <div class="stat-title">Всего записей</div>
                <div class="stat-value" id="stat-total">8</div>
            </div>
            <div class="stat">
                <div class="stat-title">Выбрано</div>
                <div class="stat-value text-primary" id="stat-selected">0</div>
            </div>
            <div class="stat">
                <div class="stat-title">Готово к импорту</div>
                <div class="stat-value text-success" id="stat-ready">0</div>
            </div>
        </div>

        <!-- Bulk Toolbar -->
        <div class="bg-base-100 p-4 rounded-lg shadow mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="checkbox" id="select-all" onchange="toggleSelectAll(this)">
                    <span class="font-medium">Выбрать все</span>
                </label>

                <div class="divider divider-horizontal"></div>

                <select class="select select-bordered select-sm w-40" id="bulk-article">
                    <option value="">Категория...</option>
                    <optgroup label="Расходы">
                        <option value="1">Продукты</option>
                        <option value="2">Транспорт</option>
                        <option value="3">Развлечения</option>
                    </optgroup>
                    <optgroup label="Доходы">
                        <option value="4">Зарплата</option>
                        <option value="5">Фриланс</option>
                    </optgroup>
                </select>

                <select class="select select-bordered select-sm w-40" id="bulk-fc">
                    <option value="">Счёт...</option>
                    <option value="1">Тинькофф</option>
                    <option value="2">Сбербанк</option>
                    <option value="3">Наличные</option>
                </select>

                <button class="btn btn-primary btn-sm" onclick="applyBulkUpdate()">
                    Применить к выбранным
                </button>

                <div class="flex-grow"></div>

                <button class="btn btn-success gap-2" onclick="executeImport()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Импортировать выбранные
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="flex gap-4 mb-6">
            <input type="text" placeholder="Поиск по описанию..." class="input input-bordered flex-grow" id="search-input" oninput="filterCards()">
            <select class="select select-bordered w-48" id="filter-status" onchange="filterCards()">
                <option value="">Все статусы</option>
                <option value="incomplete">Не заполнено</option>
                <option value="partial">Частично</option>
                <option value="ready">Готово</option>
            </select>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="cards-container">
            <!-- Cards will be rendered here -->
        </div>
    </div>

    <script>
        // Mock данные
        const stagingRecords = [
            { id: 1, fact_date: '2024-12-15', amount: -1500.00, description: 'Пятерочка покупки', csv_category: 'Супермаркеты', article_id: null, financial_center_id: 1 },
            { id: 2, fact_date: '2024-12-14', amount: -2300.50, description: 'Яндекс.Такси', csv_category: 'Транспорт', article_id: 2, financial_center_id: 1 },
            { id: 3, fact_date: '2024-12-14', amount: 50000.00, description: 'Зарплата декабрь', csv_category: 'Переводы', article_id: 4, financial_center_id: 1 },
            { id: 4, fact_date: '2024-12-13', amount: -890.00, description: 'Кафе "Му-Му"', csv_category: 'Рестораны', article_id: null, financial_center_id: null },
            { id: 5, fact_date: '2024-12-12', amount: -4500.00, description: 'Wildberries заказ', csv_category: 'Маркетплейсы', article_id: null, financial_center_id: 1 },
            { id: 6, fact_date: '2024-12-11', amount: -350.00, description: 'Spotify подписка', csv_category: 'Подписки', article_id: 3, financial_center_id: 1 },
            { id: 7, fact_date: '2024-12-10', amount: 15000.00, description: 'Фриланс проект', csv_category: 'Переводы', article_id: 5, financial_center_id: null },
            { id: 8, fact_date: '2024-12-09', amount: -1200.00, description: 'Лента продукты', csv_category: 'Супермаркеты', article_id: 1, financial_center_id: 1 }
        ];

        const articles = [
            { id: 1, name: 'Продукты', type: 'expense' },
            { id: 2, name: 'Транспорт', type: 'expense' },
            { id: 3, name: 'Развлечения', type: 'expense' },
            { id: 4, name: 'Зарплата', type: 'income' },
            { id: 5, name: 'Фриланс', type: 'income' }
        ];

        const financialCenters = [
            { id: 1, name: 'Тинькофф' },
            { id: 2, name: 'Сбербанк' },
            { id: 3, name: 'Наличные' }
        ];

        function getStatus(record) {
            if (record.article_id && record.financial_center_id) return 'ready';
            if (record.article_id || record.financial_center_id) return 'partial';
            return 'incomplete';
        }

        function getStatusLabel(status) {
            switch(status) {
                case 'ready': return 'Готово';
                case 'partial': return 'Частично';
                default: return 'Не заполнено';
            }
        }

        function formatAmount(amount) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                minimumFractionDigits: 2
            }).format(amount);
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'short'
            });
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            stagingRecords.forEach(record => {
                const status = getStatus(record);
                const card = document.createElement('div');
                card.className = `card bg-base-100 shadow card-record`;
                card.dataset.id = record.id;
                card.dataset.status = status;

                const selectedArticle = articles.find(a => a.id === record.article_id);
                const selectedFC = financialCenters.find(fc => fc.id === record.financial_center_id);

                card.innerHTML = `
                    <div class="card-body p-4">
                        <!-- Header: Checkbox + Date + Status -->
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" class="checkbox checkbox-sm record-checkbox" data-id="${record.id}" onchange="updateStats()">
                                <span class="text-sm text-base-content/70">${formatDate(record.fact_date)}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="status-dot status-${status}"></span>
                                <span class="text-xs text-base-content/50">${getStatusLabel(status)}</span>
                            </div>
                        </div>

                        <!-- Amount -->
                        <div class="text-2xl font-bold ${record.amount < 0 ? 'text-error' : 'text-success'}">
                            ${formatAmount(record.amount)}
                        </div>

                        <!-- Description -->
                        <p class="text-sm text-base-content/80 line-clamp-2 mb-2" title="${record.description}">
                            ${record.description}
                        </p>

                        <!-- CSV Category Badge -->
                        <div class="mb-3">
                            <span class="badge badge-ghost badge-sm">${record.csv_category}</span>
                        </div>

                        <!-- Editable Fields -->
                        <div class="space-y-2">
                            <select class="select select-bordered select-sm w-full"
                                    data-field="article_id"
                                    data-id="${record.id}"
                                    onchange="updateField(this)">
                                <option value="">-- Категория --</option>
                                ${articles.filter(a => record.amount < 0 ? a.type === 'expense' : a.type === 'income').map(a =>
                                    `<option value="${a.id}" ${a.id === record.article_id ? 'selected' : ''}>${a.name}</option>`
                                ).join('')}
                            </select>

                            <select class="select select-bordered select-sm w-full"
                                    data-field="financial_center_id"
                                    data-id="${record.id}"
                                    onchange="updateField(this)">
                                <option value="">-- Счёт --</option>
                                ${financialCenters.map(fc =>
                                    `<option value="${fc.id}" ${fc.id === record.financial_center_id ? 'selected' : ''}>${fc.name}</option>`
                                ).join('')}
                            </select>
                        </div>

                        <!-- Actions (visible on hover) -->
                        <div class="card-actions justify-end mt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="btn btn-ghost btn-xs" onclick="deleteRecord(${record.id})">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;

                card.classList.add('group');
                container.appendChild(card);
            });

            updateStats();
        }

        function updateField(select) {
            const id = parseInt(select.dataset.id);
            const field = select.dataset.field;
            const value = select.value ? parseInt(select.value) : null;

            const record = stagingRecords.find(r => r.id === id);
            if (record) {
                record[field] = value;

                // Update card status
                const card = document.querySelector(`.card-record[data-id="${id}"]`);
                const status = getStatus(record);
                card.dataset.status = status;

                const statusDot = card.querySelector('.status-dot');
                statusDot.className = `status-dot status-${status}`;

                const statusLabel = card.querySelector('.status-dot + span');
                statusLabel.textContent = getStatusLabel(status);

                updateStats();
            }
        }

        function updateStats() {
            const checkboxes = document.querySelectorAll('.record-checkbox:checked');
            const readyCount = stagingRecords.filter(r => getStatus(r) === 'ready').length;

            document.getElementById('stat-total').textContent = stagingRecords.length;
            document.getElementById('stat-selected').textContent = checkboxes.length;
            document.getElementById('stat-ready').textContent = readyCount;
        }

        function toggleSelectAll(checkbox) {
            const recordCheckboxes = document.querySelectorAll('.record-checkbox');
            recordCheckboxes.forEach(cb => {
                cb.checked = checkbox.checked;
                const card = cb.closest('.card-record');
                card.classList.toggle('selected', checkbox.checked);
            });
            updateStats();
        }

        function applyBulkUpdate() {
            const articleId = document.getElementById('bulk-article').value;
            const fcId = document.getElementById('bulk-fc').value;

            const selectedCheckboxes = document.querySelectorAll('.record-checkbox:checked');

            selectedCheckboxes.forEach(cb => {
                const id = parseInt(cb.dataset.id);
                const record = stagingRecords.find(r => r.id === id);

                if (record) {
                    if (articleId) record.article_id = parseInt(articleId);
                    if (fcId) record.financial_center_id = parseInt(fcId);
                }
            });

            renderCards();
            alert(`Обновлено ${selectedCheckboxes.length} записей`);
        }

        function filterCards() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;

            const cards = document.querySelectorAll('.card-record');
            cards.forEach(card => {
                const record = stagingRecords.find(r => r.id === parseInt(card.dataset.id));
                const matchesSearch = record.description.toLowerCase().includes(searchTerm);
                const matchesStatus = !statusFilter || card.dataset.status === statusFilter;

                card.style.display = matchesSearch && matchesStatus ? 'block' : 'none';
            });
        }

        function deleteRecord(id) {
            if (confirm('Удалить запись?')) {
                const index = stagingRecords.findIndex(r => r.id === id);
                if (index !== -1) {
                    stagingRecords.splice(index, 1);
                    renderCards();
                }
            }
        }

        function executeImport() {
            const selectedCheckboxes = document.querySelectorAll('.record-checkbox:checked');
            const readyIds = [];

            selectedCheckboxes.forEach(cb => {
                const id = parseInt(cb.dataset.id);
                const record = stagingRecords.find(r => r.id === id);
                if (record && getStatus(record) === 'ready') {
                    readyIds.push(id);
                }
            });

            if (readyIds.length === 0) {
                alert('Нет готовых к импорту записей среди выбранных');
                return;
            }

            alert(`Импортировано ${readyIds.length} записей`);
        }

        // Initial render
        renderCards();
    </script>
</body>
</html>
