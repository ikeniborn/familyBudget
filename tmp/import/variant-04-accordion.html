<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 4: Expandable Accordion Rows</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .accordion-row {
            transition: all 0.2s ease;
        }
        .accordion-row:hover {
            background-color: oklch(var(--b2));
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-content.open {
            max-height: 400px;
        }
        .expand-icon {
            transition: transform 0.2s ease;
        }
        .accordion-row.expanded .expand-icon {
            transform: rotate(180deg);
        }
        .status-bar {
            width: 4px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }
        .status-incomplete { background-color: #ef4444; }
        .status-partial { background-color: #f59e0b; }
        .status-ready { background-color: #22c55e; }
    </style>
</head>
<body class="bg-base-200 min-h-screen p-6">
    <!--
    ============================================================
    ВАРИАНТ 4: Expandable Accordion Rows
    ============================================================

    КОНЦЕПЦИЯ:
    - Строки таблицы с раскрывающимися деталями
    - Компактная строка: чекбокс, дата, сумма, описание, статус
    - Клик раскрывает детальную панель под строкой
    - Все редактируемые поля в раскрытой панели
    - Множественное раскрытие (1-3 строки одновременно)

    ПРЕИМУЩЕСТВА:
    + Контекст сохраняется (другие строки видны)
    + Не нужен модальный диалог
    + Естественная визуальная иерархия
    + Можно сравнивать несколько записей

    НЕДОСТАТКИ:
    - Вертикальный скролл увеличивается при раскрытии
    - Сложнее реализовать drag & drop
    - Анимации могут тормозить при большом количестве записей
    ============================================================
    -->

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Вариант 4: Expandable Accordion Rows</h1>
            <p class="text-base-content/70">Строки таблицы с раскрывающимися деталями для редактирования</p>
        </div>

        <!-- Toolbar -->
        <div class="bg-base-100 p-4 rounded-lg shadow mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <input type="checkbox" class="checkbox checkbox-sm" id="select-all" onchange="toggleSelectAll(this)">
                    <span class="text-sm font-medium">Все</span>
                </div>

                <input type="text" placeholder="Поиск..." class="input input-bordered input-sm flex-grow max-w-xs" id="search-input" oninput="filterRows()">

                <div class="btn-group">
                    <button class="btn btn-sm btn-ghost" onclick="expandAll()">Развернуть все</button>
                    <button class="btn btn-sm btn-ghost" onclick="collapseAll()">Свернуть все</button>
                </div>

                <div class="flex-grow"></div>

                <div class="stats shadow stats-horizontal">
                    <div class="stat py-1 px-3">
                        <div class="stat-value text-lg" id="stat-total">8</div>
                        <div class="stat-title text-xs">Всего</div>
                    </div>
                    <div class="stat py-1 px-3">
                        <div class="stat-value text-lg text-primary" id="stat-selected">0</div>
                        <div class="stat-title text-xs">Выбрано</div>
                    </div>
                    <div class="stat py-1 px-3">
                        <div class="stat-value text-lg text-success" id="stat-ready">0</div>
                        <div class="stat-title text-xs">Готово</div>
                    </div>
                </div>

                <button class="btn btn-success gap-2" onclick="executeImport()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Импортировать
                </button>
            </div>
        </div>

        <!-- Accordion Table -->
        <div class="bg-base-100 rounded-lg shadow overflow-hidden" id="accordion-container">
            <!-- Rows will be rendered here -->
        </div>
    </div>

    <script>
        // Mock данные
        const stagingRecords = [
            { id: 1, fact_date: '2024-12-15', amount: -1500.00, description: 'Пятерочка покупки', csv_category: 'Супермаркеты', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 2, fact_date: '2024-12-14', amount: -2300.50, description: 'Яндекс.Такси', csv_category: 'Транспорт', article_id: 2, financial_center_id: 1, cost_center_id: null, user_comment: 'Поездка в аэропорт' },
            { id: 3, fact_date: '2024-12-14', amount: 50000.00, description: 'Зарплата декабрь', csv_category: 'Переводы', article_id: 4, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 4, fact_date: '2024-12-13', amount: -890.00, description: 'Кафе "Му-Му"', csv_category: 'Рестораны', article_id: null, financial_center_id: null, cost_center_id: null, user_comment: '' },
            { id: 5, fact_date: '2024-12-12', amount: -4500.00, description: 'Wildberries заказ', csv_category: 'Маркетплейсы', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 6, fact_date: '2024-12-11', amount: -350.00, description: 'Spotify подписка', csv_category: 'Подписки', article_id: 3, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 7, fact_date: '2024-12-10', amount: 15000.00, description: 'Фриланс проект', csv_category: 'Переводы', article_id: 5, financial_center_id: null, cost_center_id: 1, user_comment: '' },
            { id: 8, fact_date: '2024-12-09', amount: -1200.00, description: 'Лента продукты', csv_category: 'Супермаркеты', article_id: 1, financial_center_id: 1, cost_center_id: null, user_comment: '' }
        ];

        const articles = [
            { id: 1, name: 'Продукты', type: 'expense' },
            { id: 2, name: 'Транспорт', type: 'expense' },
            { id: 3, name: 'Развлечения', type: 'expense' },
            { id: 4, name: 'Зарплата', type: 'income' },
            { id: 5, name: 'Фриланс', type: 'income' }
        ];

        const financialCenters = [
            { id: 1, name: 'Тинькофф' },
            { id: 2, name: 'Сбербанк' },
            { id: 3, name: 'Наличные' }
        ];

        const costCenters = [
            { id: 1, name: 'Работа' },
            { id: 2, name: 'Личное' },
            { id: 3, name: 'Семья' }
        ];

        function getStatus(record) {
            if (record.article_id && record.financial_center_id) return 'ready';
            if (record.article_id || record.financial_center_id) return 'partial';
            return 'incomplete';
        }

        function getStatusText(status) {
            switch(status) {
                case 'ready': return 'Готово';
                case 'partial': return 'Частично';
                default: return 'Не заполнено';
            }
        }

        function formatAmount(amount) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'short'
            });
        }

        function renderAccordion() {
            const container = document.getElementById('accordion-container');
            container.innerHTML = '';

            stagingRecords.forEach(record => {
                const status = getStatus(record);
                const isExpense = record.amount < 0;
                const filteredArticles = articles.filter(a => isExpense ? a.type === 'expense' : a.type === 'income');

                const wrapper = document.createElement('div');
                wrapper.className = 'border-b border-base-200 last:border-b-0';
                wrapper.dataset.id = record.id;

                wrapper.innerHTML = `
                    <!-- Header Row -->
                    <div class="accordion-row relative p-4 cursor-pointer" onclick="toggleAccordion(${record.id}, event)">
                        <div class="status-bar status-${status}"></div>
                        <div class="flex items-center gap-4 pl-2">
                            <input type="checkbox" class="checkbox checkbox-sm record-checkbox" data-id="${record.id}" onclick="event.stopPropagation()" onchange="updateStats()">

                            <div class="w-20 text-sm text-base-content/70">
                                ${formatDate(record.fact_date)}
                            </div>

                            <div class="w-32 font-semibold ${record.amount < 0 ? 'text-error' : 'text-success'}">
                                ${formatAmount(record.amount)}
                            </div>

                            <div class="flex-grow">
                                <div class="font-medium truncate max-w-md">${record.description}</div>
                                <div class="text-xs text-base-content/50">${record.csv_category}</div>
                            </div>

                            <div class="flex items-center gap-2">
                                <span class="badge ${status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'} badge-sm">
                                    ${getStatusText(status)}
                                </span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 expand-icon text-base-content/50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Expandable Content -->
                    <div class="accordion-content bg-base-200" id="content-${record.id}">
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Category Select -->
                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text font-semibold">Категория *</span>
                                    </label>
                                    <select class="select select-bordered w-full" id="article-${record.id}" onchange="updateField(${record.id}, 'article_id', this.value)">
                                        <option value="">-- Выберите категорию --</option>
                                        ${filteredArticles.map(a =>
                                            `<option value="${a.id}" ${a.id === record.article_id ? 'selected' : ''}>${a.name}</option>`
                                        ).join('')}
                                    </select>
                                </div>

                                <!-- Financial Center Select -->
                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text font-semibold">Счёт *</span>
                                    </label>
                                    <select class="select select-bordered w-full" id="fc-${record.id}" onchange="updateField(${record.id}, 'financial_center_id', this.value)">
                                        <option value="">-- Выберите счёт --</option>
                                        ${financialCenters.map(fc =>
                                            `<option value="${fc.id}" ${fc.id === record.financial_center_id ? 'selected' : ''}>${fc.name}</option>`
                                        ).join('')}
                                    </select>
                                </div>

                                <!-- Cost Center Select -->
                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text font-semibold">Место затрат</span>
                                    </label>
                                    <select class="select select-bordered w-full" id="cc-${record.id}" onchange="updateField(${record.id}, 'cost_center_id', this.value)">
                                        <option value="">-- Не указано --</option>
                                        ${costCenters.map(cc =>
                                            `<option value="${cc.id}" ${cc.id === record.cost_center_id ? 'selected' : ''}>${cc.name}</option>`
                                        ).join('')}
                                    </select>
                                </div>

                                <!-- Comment -->
                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text font-semibold">Комментарий</span>
                                    </label>
                                    <input type="text" class="input input-bordered w-full" id="comment-${record.id}"
                                           value="${record.user_comment || ''}"
                                           placeholder="Добавьте комментарий..."
                                           onblur="updateField(${record.id}, 'user_comment', this.value)">
                                </div>
                            </div>

                            <div class="flex justify-end gap-2 mt-4">
                                <button class="btn btn-ghost btn-sm" onclick="deleteRecord(${record.id})">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                    Удалить
                                </button>
                                <button class="btn btn-primary btn-sm" onclick="toggleAccordion(${record.id})">
                                    Готово
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(wrapper);
            });

            updateStats();
        }

        function toggleAccordion(recordId, event) {
            if (event && event.target.closest('.record-checkbox')) return;

            const row = document.querySelector(`[data-id="${recordId}"] .accordion-row`);
            const content = document.getElementById(`content-${recordId}`);

            row.classList.toggle('expanded');
            content.classList.toggle('open');
        }

        function expandAll() {
            stagingRecords.forEach(record => {
                const row = document.querySelector(`[data-id="${record.id}"] .accordion-row`);
                const content = document.getElementById(`content-${record.id}`);
                row.classList.add('expanded');
                content.classList.add('open');
            });
        }

        function collapseAll() {
            stagingRecords.forEach(record => {
                const row = document.querySelector(`[data-id="${record.id}"] .accordion-row`);
                const content = document.getElementById(`content-${record.id}`);
                row.classList.remove('expanded');
                content.classList.remove('open');
            });
        }

        function updateField(recordId, field, value) {
            const record = stagingRecords.find(r => r.id === recordId);
            if (record) {
                record[field] = field.includes('_id') ? (value ? parseInt(value) : null) : value;

                // Update status bar
                const status = getStatus(record);
                const statusBar = document.querySelector(`[data-id="${recordId}"] .status-bar`);
                statusBar.className = `status-bar status-${status}`;

                // Update status badge
                const badge = document.querySelector(`[data-id="${recordId}"] .badge`);
                badge.className = `badge ${status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'} badge-sm`;
                badge.textContent = getStatusText(status);

                updateStats();
            }
        }

        function updateStats() {
            const checkboxes = document.querySelectorAll('.record-checkbox:checked');
            const readyCount = stagingRecords.filter(r => getStatus(r) === 'ready').length;

            document.getElementById('stat-total').textContent = stagingRecords.length;
            document.getElementById('stat-selected').textContent = checkboxes.length;
            document.getElementById('stat-ready').textContent = readyCount;
        }

        function toggleSelectAll(checkbox) {
            document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = checkbox.checked);
            updateStats();
        }

        function filterRows() {
            const term = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#accordion-container > div').forEach(wrapper => {
                const record = stagingRecords.find(r => r.id === parseInt(wrapper.dataset.id));
                wrapper.style.display = record.description.toLowerCase().includes(term) ? 'block' : 'none';
            });
        }

        function deleteRecord(id) {
            if (confirm('Удалить запись?')) {
                const index = stagingRecords.findIndex(r => r.id === id);
                if (index !== -1) {
                    stagingRecords.splice(index, 1);
                    renderAccordion();
                }
            }
        }

        function executeImport() {
            const selected = document.querySelectorAll('.record-checkbox:checked');
            const readyIds = [];
            selected.forEach(cb => {
                const record = stagingRecords.find(r => r.id === parseInt(cb.dataset.id));
                if (record && getStatus(record) === 'ready') readyIds.push(record.id);
            });
            if (readyIds.length === 0) {
                alert('Нет готовых записей среди выбранных');
                return;
            }
            alert(`Импортировано ${readyIds.length} записей`);
        }

        // Initial render
        renderAccordion();
    </script>
</body>
</html>
