<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 8: Step-by-Step Wizard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .wizard-card {
            transition: all 0.3s ease;
        }
        .wizard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
        .focus-mode .other-records {
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen p-6">
    <!--
    ============================================================
    ВАРИАНТ 8: Step-by-Step Wizard per Record
    ============================================================

    КОНЦЕПЦИЯ:
    - Focus mode: одна запись на экране для детального редактирования
    - Шаги: 1) Тип/Категория 2) Счёт 3) Доп.данные 4) Подтверждение
    - Navigation: Previous/Next/Skip
    - Progress bar для всего списка
    - Массовое редактирование: применить одинаковые значения к нескольким записям

    HTMX ИНТЕГРАЦИЯ:
    - hx-post="/api/v1/admin/staging/{id}" для сохранения изменений
    - hx-get="/api/v1/admin/staging/{id}/next" для перехода к следующей
    - hx-swap="outerHTML" для обновления формы

    ПРЕИМУЩЕСТВА:
    + Максимальный фокус на одной записи
    + Пошаговый guided workflow
    + Легко добавить валидацию на каждом шаге
    + Идеально для новых пользователей

    НЕДОСТАТКИ:
    - Медленно для большого количества записей
    - Нужен режим массового редактирования для efficiency
    - Много переходов между записями
    ============================================================
    -->

    <div class="max-w-3xl mx-auto">
        <!-- Header with Progress -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Вариант 8: Wizard Mode</h1>
            <p class="text-base-content/70">Пошаговое заполнение каждой записи</p>
        </div>

        <!-- Overall Progress -->
        <div class="bg-base-100 p-4 rounded-lg shadow mb-6">
            <div class="flex items-center justify-between mb-2">
                <span class="font-semibold">Общий прогресс</span>
                <span class="text-sm text-base-content/70"><span id="progress-current">0</span> из <span id="progress-total">8</span> записей готово</span>
            </div>
            <progress class="progress progress-success w-full" id="overall-progress" value="0" max="8"></progress>

            <div class="flex justify-between mt-4">
                <button class="btn btn-outline btn-sm" id="mode-toggle" onclick="toggleMode()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                    </svg>
                    Режим списка
                </button>
                <button class="btn btn-success gap-2" onclick="executeImport()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Импортировать готовые
                </button>
            </div>
        </div>

        <!-- Wizard Mode: Single Record Focus -->
        <div id="wizard-mode">
            <!-- Current Record Card -->
            <div class="wizard-card bg-base-100 rounded-lg shadow-lg p-6" id="wizard-card">
                <!-- Will be populated by renderWizard() -->
            </div>

            <!-- Quick List (mini preview) -->
            <div class="mt-6">
                <h3 class="text-sm font-semibold text-base-content/70 mb-2">Все записи:</h3>
                <div class="flex flex-wrap gap-2" id="quick-list">
                    <!-- Mini badges for all records -->
                </div>
            </div>
        </div>

        <!-- List Mode: All Records -->
        <div id="list-mode" class="hidden space-y-4">
            <!-- Will be populated by renderList() -->
        </div>

        <!-- Bulk Edit Panel (for List Mode) -->
        <div id="bulk-panel" class="hidden fixed bottom-0 left-0 right-0 bg-base-100 shadow-lg border-t p-4">
            <div class="max-w-3xl mx-auto">
                <div class="flex items-center gap-4">
                    <span class="font-semibold">Выбрано: <span id="bulk-count">0</span></span>
                    <select class="select select-bordered select-sm" id="bulk-article">
                        <option value="">Категория...</option>
                    </select>
                    <select class="select select-bordered select-sm" id="bulk-fc">
                        <option value="">Счёт...</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="applyBulkEdit()">Применить</button>
                    <button class="btn btn-ghost btn-sm" onclick="clearSelection()">Отменить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock данные
        const stagingRecords = [
            { id: 1, fact_date: '2024-12-15', amount: -1500.00, description: 'Пятерочка покупки', csv_category: 'Супермаркеты', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 2, fact_date: '2024-12-14', amount: -2300.50, description: 'Яндекс.Такси', csv_category: 'Транспорт', article_id: 2, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 3, fact_date: '2024-12-14', amount: 50000.00, description: 'Зарплата декабрь', csv_category: 'Переводы', article_id: 4, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 4, fact_date: '2024-12-13', amount: -890.00, description: 'Кафе "Му-Му"', csv_category: 'Рестораны', article_id: null, financial_center_id: null, cost_center_id: null, user_comment: '' },
            { id: 5, fact_date: '2024-12-12', amount: -4500.00, description: 'Wildberries заказ', csv_category: 'Маркетплейсы', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 6, fact_date: '2024-12-11', amount: -350.00, description: 'Spotify подписка', csv_category: 'Подписки', article_id: 3, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 7, fact_date: '2024-12-10', amount: 15000.00, description: 'Фриланс проект', csv_category: 'Переводы', article_id: 5, financial_center_id: null, cost_center_id: 1, user_comment: '' },
            { id: 8, fact_date: '2024-12-09', amount: -1200.00, description: 'Лента продукты', csv_category: 'Супермаркеты', article_id: 1, financial_center_id: 1, cost_center_id: null, user_comment: '' }
        ];

        const articles = [
            { id: 1, name: 'Продукты', type: 'expense' },
            { id: 2, name: 'Транспорт', type: 'expense' },
            { id: 3, name: 'Развлечения', type: 'expense' },
            { id: 4, name: 'Зарплата', type: 'income' },
            { id: 5, name: 'Фриланс', type: 'income' }
        ];

        const financialCenters = [
            { id: 1, name: 'Тинькофф' },
            { id: 2, name: 'Сбербанк' },
            { id: 3, name: 'Наличные' }
        ];

        const costCenters = [
            { id: 1, name: 'Работа' },
            { id: 2, name: 'Личное' },
            { id: 3, name: 'Семья' }
        ];

        let currentIndex = 0;
        let currentStep = 1;
        let isListMode = false;

        function getStatus(record) {
            if (record.article_id && record.financial_center_id) return 'ready';
            if (record.article_id || record.financial_center_id) return 'partial';
            return 'incomplete';
        }

        function formatAmount(amount) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('ru-RU');
        }

        function renderWizard() {
            const record = stagingRecords[currentIndex];
            const card = document.getElementById('wizard-card');
            const isExpense = record.amount < 0;
            const filteredArticles = articles.filter(a => isExpense ? a.type === 'expense' : a.type === 'income');
            const status = getStatus(record);

            card.innerHTML = `
                <!-- Navigation -->
                <div class="flex justify-between items-center mb-6">
                    <button class="btn btn-ghost btn-sm" onclick="navigateRecord(-1)" ${currentIndex === 0 ? 'disabled' : ''}>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        Назад
                    </button>
                    <span class="font-medium">${currentIndex + 1} / ${stagingRecords.length}</span>
                    <button class="btn btn-ghost btn-sm" onclick="navigateRecord(1)" ${currentIndex === stagingRecords.length - 1 ? 'disabled' : ''}>
                        Далее
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

                <!-- Record Info -->
                <div class="text-center mb-6">
                    <div class="text-4xl font-bold ${record.amount < 0 ? 'text-error' : 'text-success'} mb-2">
                        ${formatAmount(record.amount)}
                    </div>
                    <div class="text-lg mb-1">${record.description}</div>
                    <div class="flex justify-center gap-2">
                        <span class="badge badge-ghost">${record.csv_category}</span>
                        <span class="badge badge-ghost">${formatDate(record.fact_date)}</span>
                        <span class="badge ${status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'}">
                            ${status === 'ready' ? 'Готово' : status === 'partial' ? 'Частично' : 'Не заполнено'}
                        </span>
                    </div>
                </div>

                <!-- Steps Indicator -->
                <ul class="steps steps-horizontal w-full mb-6">
                    <li class="step ${currentStep >= 1 ? 'step-primary' : ''}" data-content="${record.article_id ? '✓' : '1'}">Категория</li>
                    <li class="step ${currentStep >= 2 ? 'step-primary' : ''}" data-content="${record.financial_center_id ? '✓' : '2'}">Счёт</li>
                    <li class="step ${currentStep >= 3 ? 'step-primary' : ''}" data-content="3">Дополнительно</li>
                </ul>

                <!-- Step Content -->
                <div class="min-h-[200px]">
                    ${currentStep === 1 ? `
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text text-lg font-semibold">Выберите категорию *</span>
                            </label>
                            <div class="grid grid-cols-2 gap-2">
                                ${filteredArticles.map(a => `
                                    <button class="btn ${a.id === record.article_id ? 'btn-primary' : 'btn-outline'}"
                                            onclick="selectArticle(${a.id})">
                                        ${a.name}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : currentStep === 2 ? `
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text text-lg font-semibold">Выберите счёт *</span>
                            </label>
                            <div class="grid grid-cols-2 gap-2">
                                ${financialCenters.map(fc => `
                                    <button class="btn ${fc.id === record.financial_center_id ? 'btn-primary' : 'btn-outline'}"
                                            onclick="selectFC(${fc.id})">
                                        ${fc.name}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="space-y-4">
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-semibold">Место затрат (опционально)</span>
                                </label>
                                <select class="select select-bordered w-full" onchange="selectCC(parseInt(this.value) || null)">
                                    <option value="">-- Не указано --</option>
                                    ${costCenters.map(cc =>
                                        `<option value="${cc.id}" ${cc.id === record.cost_center_id ? 'selected' : ''}>${cc.name}</option>`
                                    ).join('')}
                                </select>
                            </div>
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-semibold">Комментарий</span>
                                </label>
                                <textarea class="textarea textarea-bordered" placeholder="Добавьте комментарий..."
                                          onblur="updateComment(this.value)">${record.user_comment || ''}</textarea>
                            </div>
                        </div>
                    `}
                </div>

                <!-- Step Navigation -->
                <div class="flex justify-between mt-6">
                    <button class="btn btn-ghost" onclick="prevStep()" ${currentStep === 1 ? 'disabled' : ''}>
                        Назад
                    </button>
                    ${currentStep < 3 ? `
                        <button class="btn btn-primary" onclick="nextStep()">
                            Далее
                        </button>
                    ` : `
                        <button class="btn btn-success" onclick="finishRecord()">
                            ${currentIndex < stagingRecords.length - 1 ? 'Сохранить и к следующей' : 'Завершить'}
                        </button>
                    `}
                </div>

                <!-- Apply to similar (массовое редактирование) -->
                <div class="divider"></div>
                <div class="text-center">
                    <button class="btn btn-ghost btn-sm" onclick="applyToSimilar()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Применить к похожим (${countSimilar()} записей из "${record.csv_category}")
                    </button>
                </div>
            `;

            renderQuickList();
            updateProgress();
        }

        function renderQuickList() {
            const quickList = document.getElementById('quick-list');
            quickList.innerHTML = stagingRecords.map((record, index) => {
                const status = getStatus(record);
                const isActive = index === currentIndex;
                return `
                    <button class="badge ${isActive ? 'badge-primary' : status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'} badge-lg cursor-pointer"
                            onclick="goToRecord(${index})">
                        ${index + 1}
                    </button>
                `;
            }).join('');
        }

        function countSimilar() {
            const currentCategory = stagingRecords[currentIndex].csv_category;
            return stagingRecords.filter(r => r.csv_category === currentCategory).length;
        }

        function applyToSimilar() {
            const current = stagingRecords[currentIndex];
            const similar = stagingRecords.filter(r => r.csv_category === current.csv_category);

            if (confirm(`Применить категорию "${articles.find(a => a.id === current.article_id)?.name || 'не выбрана'}" и счёт "${financialCenters.find(fc => fc.id === current.financial_center_id)?.name || 'не выбран'}" к ${similar.length} записям из категории "${current.csv_category}"?`)) {
                similar.forEach(r => {
                    if (current.article_id) r.article_id = current.article_id;
                    if (current.financial_center_id) r.financial_center_id = current.financial_center_id;
                });
                renderWizard();
                updateProgress();
            }
        }

        function selectArticle(articleId) {
            stagingRecords[currentIndex].article_id = articleId;
            renderWizard();
        }

        function selectFC(fcId) {
            stagingRecords[currentIndex].financial_center_id = fcId;
            renderWizard();
        }

        function selectCC(ccId) {
            stagingRecords[currentIndex].cost_center_id = ccId;
        }

        function updateComment(value) {
            stagingRecords[currentIndex].user_comment = value;
        }

        function nextStep() {
            if (currentStep < 3) {
                currentStep++;
                renderWizard();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderWizard();
            }
        }

        function finishRecord() {
            if (currentIndex < stagingRecords.length - 1) {
                currentIndex++;
                currentStep = 1;
                renderWizard();
            } else {
                alert('Все записи обработаны!');
            }
        }

        function navigateRecord(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < stagingRecords.length) {
                currentIndex = newIndex;
                currentStep = 1;
                renderWizard();
            }
        }

        function goToRecord(index) {
            currentIndex = index;
            currentStep = 1;
            renderWizard();
        }

        function updateProgress() {
            const readyCount = stagingRecords.filter(r => getStatus(r) === 'ready').length;
            document.getElementById('progress-current').textContent = readyCount;
            document.getElementById('progress-total').textContent = stagingRecords.length;
            document.getElementById('overall-progress').value = readyCount;
            document.getElementById('overall-progress').max = stagingRecords.length;
        }

        function toggleMode() {
            isListMode = !isListMode;
            document.getElementById('wizard-mode').classList.toggle('hidden', isListMode);
            document.getElementById('list-mode').classList.toggle('hidden', !isListMode);
            document.getElementById('mode-toggle').innerHTML = isListMode ?
                '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg> Режим wizard' :
                '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg> Режим списка';

            if (isListMode) renderList();
        }

        function renderList() {
            const container = document.getElementById('list-mode');
            container.innerHTML = stagingRecords.map((record, index) => {
                const status = getStatus(record);
                const isExpense = record.amount < 0;
                return `
                    <div class="bg-base-100 p-4 rounded-lg shadow flex items-center gap-4">
                        <input type="checkbox" class="checkbox" data-index="${index}" onchange="updateBulkCount()">
                        <div class="flex-grow">
                            <div class="flex justify-between">
                                <span class="font-medium">${record.description}</span>
                                <span class="font-bold ${isExpense ? 'text-error' : 'text-success'}">${formatAmount(record.amount)}</span>
                            </div>
                            <div class="text-sm text-base-content/60">${formatDate(record.fact_date)} • ${record.csv_category}</div>
                        </div>
                        <span class="badge ${status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'}">${status === 'ready' ? 'Готово' : status === 'partial' ? 'Частично' : 'Не заполнено'}</span>
                        <button class="btn btn-ghost btn-sm" onclick="goToRecord(${index}); toggleMode();">Редактировать</button>
                    </div>
                `;
            }).join('');
        }

        function updateBulkCount() {
            const count = document.querySelectorAll('#list-mode input[type="checkbox"]:checked').length;
            document.getElementById('bulk-count').textContent = count;
            document.getElementById('bulk-panel').classList.toggle('hidden', count === 0);
        }

        function clearSelection() {
            document.querySelectorAll('#list-mode input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateBulkCount();
        }

        function executeImport() {
            const readyRecords = stagingRecords.filter(r => getStatus(r) === 'ready');
            if (readyRecords.length === 0) {
                alert('Нет готовых записей');
                return;
            }
            alert(`Импортировано ${readyRecords.length} записей`);
        }

        // Initial render
        renderWizard();
    </script>
</body>
</html>
