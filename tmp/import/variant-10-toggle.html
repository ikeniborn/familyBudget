<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 10: Compact/Detail View Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .view-mode-compact .detail-only {
            display: none;
        }
        .view-mode-detail .compact-only {
            display: none;
        }
        .tooltip-cell {
            position: relative;
        }
        .tooltip-cell:hover .tooltip-content {
            display: block;
        }
        .tooltip-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: oklch(var(--n));
            color: oklch(var(--nc));
            padding: 0.5rem;
            border-radius: 0.5rem;
            white-space: nowrap;
            z-index: 50;
            font-size: 0.75rem;
        }
        .status-icon-compact {
            width: 24px;
            height: 24px;
        }
        .bulk-row {
            background-color: oklch(var(--p) / 0.05);
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen p-6">
    <!--
    ============================================================
    ВАРИАНТ 10: Compact/Detail View Toggle
    ============================================================

    КОНЦЕПЦИЯ:
    - Два режима отображения с переключателем
    - Compact: 6 колонок, иконки вместо текста, hover tooltips
    - Detail: полная таблица как сейчас
    - Toggle в toolbar
    - Responsive: auto-compact на узких экранах
    - Массовое редактирование работает в обоих режимах

    HTMX ИНТЕГРАЦИЯ:
    - hx-post для обновления записей
    - hx-swap="outerHTML" для обновления строк
    - hx-trigger="change" для inline редактирования

    ПРЕИМУЩЕСТВА:
    + Гибкость для разных задач
    + Compact режим для обзора и массовых операций
    + Detail режим для точного редактирования
    + Адаптивность к размеру экрана

    НЕДОСТАТКИ:
    - Два режима = больше кода для поддержки
    - Пользователь должен знать о переключателе
    - Синхронизация состояния между режимами
    ============================================================
    -->

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Вариант 10: Compact/Detail Toggle</h1>
            <p class="text-base-content/70">Переключайтесь между компактным и детальным видом</p>
        </div>

        <!-- Toolbar -->
        <div class="bg-base-100 p-4 rounded-lg shadow mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <!-- View Toggle -->
                <div class="join">
                    <button class="btn join-item btn-sm" id="btn-compact" onclick="setViewMode('compact')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                        Компактный
                    </button>
                    <button class="btn join-item btn-sm btn-active" id="btn-detail" onclick="setViewMode('detail')">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Детальный
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" class="checkbox checkbox-sm" id="select-all" onchange="toggleSelectAll(this)">
                    <span class="text-sm">Все</span>
                </div>

                <input type="text" placeholder="Поиск..." class="input input-bordered input-sm flex-grow max-w-xs" id="search-input" oninput="filterTable()">

                <!-- Bulk Operations (inline) -->
                <div id="bulk-ops" class="hidden flex items-center gap-2 bg-primary/10 px-3 py-1 rounded-lg">
                    <span class="font-semibold text-sm">Выбрано: <span id="selected-count">0</span></span>
                    <select class="select select-bordered select-xs" id="bulk-article">
                        <option value="">Категория</option>
                    </select>
                    <select class="select select-bordered select-xs" id="bulk-fc">
                        <option value="">Счёт</option>
                    </select>
                    <button class="btn btn-primary btn-xs" onclick="applyBulkEdit()">OK</button>
                    <button class="btn btn-ghost btn-xs" onclick="clearSelection()">✕</button>
                </div>

                <div class="flex-grow"></div>

                <!-- Stats -->
                <div class="stats shadow stats-horizontal">
                    <div class="stat py-1 px-3">
                        <div class="stat-value text-lg" id="stat-total">8</div>
                        <div class="stat-title text-xs">Всего</div>
                    </div>
                    <div class="stat py-1 px-3">
                        <div class="stat-value text-lg text-success" id="stat-ready">0</div>
                        <div class="stat-title text-xs">Готово</div>
                    </div>
                </div>

                <button class="btn btn-success gap-2" onclick="executeImport()">
                    Импортировать
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-base-100 rounded-lg shadow overflow-x-auto" id="table-container">
            <table class="table w-full" id="main-table">
                <thead>
                    <tr id="table-header">
                        <!-- Header will be rendered by JS -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be rendered by JS -->
                </tbody>
            </table>
        </div>

        <!-- Legend for Compact Mode -->
        <div id="legend" class="hidden mt-4 text-xs text-base-content/60">
            <span class="mr-4">Иконки: ✓ = готово, ◐ = частично, ○ = не заполнено</span>
            <span>Наведите на ячейку для подсказки</span>
        </div>
    </div>

    <script>
        // Mock данные
        const stagingRecords = [
            { id: 1, fact_date: '2024-12-15', amount: -1500.00, description: 'Пятерочка покупки', csv_category: 'Супермаркеты', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 2, fact_date: '2024-12-14', amount: -2300.50, description: 'Яндекс.Такси', csv_category: 'Транспорт', article_id: 2, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 3, fact_date: '2024-12-14', amount: 50000.00, description: 'Зарплата декабрь', csv_category: 'Переводы', article_id: 4, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 4, fact_date: '2024-12-13', amount: -890.00, description: 'Кафе "Му-Му"', csv_category: 'Рестораны', article_id: null, financial_center_id: null, cost_center_id: null, user_comment: '' },
            { id: 5, fact_date: '2024-12-12', amount: -4500.00, description: 'Wildberries заказ', csv_category: 'Маркетплейсы', article_id: null, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 6, fact_date: '2024-12-11', amount: -350.00, description: 'Spotify подписка', csv_category: 'Подписки', article_id: 3, financial_center_id: 1, cost_center_id: null, user_comment: '' },
            { id: 7, fact_date: '2024-12-10', amount: 15000.00, description: 'Фриланс проект', csv_category: 'Переводы', article_id: 5, financial_center_id: null, cost_center_id: 1, user_comment: '' },
            { id: 8, fact_date: '2024-12-09', amount: -1200.00, description: 'Лента продукты', csv_category: 'Супермаркеты', article_id: 1, financial_center_id: 1, cost_center_id: null, user_comment: '' }
        ];

        const articles = [
            { id: 1, name: 'Продукты', type: 'expense' },
            { id: 2, name: 'Транспорт', type: 'expense' },
            { id: 3, name: 'Развлечения', type: 'expense' },
            { id: 4, name: 'Зарплата', type: 'income' },
            { id: 5, name: 'Фриланс', type: 'income' }
        ];

        const financialCenters = [
            { id: 1, name: 'Тинькофф' },
            { id: 2, name: 'Сбербанк' },
            { id: 3, name: 'Наличные' }
        ];

        const costCenters = [
            { id: 1, name: 'Работа' },
            { id: 2, name: 'Личное' },
            { id: 3, name: 'Семья' }
        ];

        let viewMode = 'detail';

        function getStatus(record) {
            if (record.article_id && record.financial_center_id) return 'ready';
            if (record.article_id || record.financial_center_id) return 'partial';
            return 'incomplete';
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'ready': return '<span class="text-success text-lg">✓</span>';
                case 'partial': return '<span class="text-warning text-lg">◐</span>';
                default: return '<span class="text-error text-lg">○</span>';
            }
        }

        function formatAmount(amount) {
            return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', minimumFractionDigits: 0 }).format(amount);
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function getArticleName(id) {
            return articles.find(a => a.id === id)?.name || null;
        }

        function getFCName(id) {
            return financialCenters.find(f => f.id === id)?.name || null;
        }

        function getCCName(id) {
            return costCenters.find(c => c.id === id)?.name || null;
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-compact').classList.toggle('btn-active', mode === 'compact');
            document.getElementById('btn-detail').classList.toggle('btn-active', mode === 'detail');
            document.getElementById('table-container').classList.toggle('view-mode-compact', mode === 'compact');
            document.getElementById('table-container').classList.toggle('view-mode-detail', mode === 'detail');
            document.getElementById('legend').classList.toggle('hidden', mode !== 'compact');
            renderTable();
        }

        function renderTable() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');

            populateBulkSelects();

            if (viewMode === 'compact') {
                thead.innerHTML = `
                    <th class="w-10"></th>
                    <th>Ст.</th>
                    <th>Дата</th>
                    <th>Сумма</th>
                    <th class="w-1/3">Описание</th>
                    <th>Кат.</th>
                    <th>Счёт</th>
                    <th class="w-10"></th>
                `;
            } else {
                thead.innerHTML = `
                    <th class="w-10"></th>
                    <th>Дата</th>
                    <th>Сумма</th>
                    <th>Описание</th>
                    <th>Категория CSV</th>
                    <th>Комментарий</th>
                    <th>Категория</th>
                    <th>Счёт</th>
                    <th>МЗ</th>
                    <th>Статус</th>
                    <th class="w-10"></th>
                `;
            }

            tbody.innerHTML = '';

            stagingRecords.forEach(record => {
                const status = getStatus(record);
                const isExpense = record.amount < 0;
                const filteredArticles = articles.filter(a => isExpense ? a.type === 'expense' : a.type === 'income');
                const articleName = getArticleName(record.article_id);
                const fcName = getFCName(record.financial_center_id);
                const ccName = getCCName(record.cost_center_id);

                const row = document.createElement('tr');
                row.dataset.id = record.id;
                row.dataset.status = status;

                if (viewMode === 'compact') {
                    row.innerHTML = `
                        <td>
                            <input type="checkbox" class="checkbox checkbox-sm record-checkbox" data-id="${record.id}" onchange="updateSelection()">
                        </td>
                        <td>${getStatusIcon(status)}</td>
                        <td class="text-xs">${formatDate(record.fact_date)}</td>
                        <td class="font-semibold ${record.amount < 0 ? 'text-error' : 'text-success'}">${formatAmount(record.amount)}</td>
                        <td class="truncate max-w-xs tooltip-cell">
                            ${record.description}
                            <div class="tooltip-content">${record.description}<br>${record.csv_category}</div>
                        </td>
                        <td class="tooltip-cell ${articleName ? 'text-success' : 'text-error'}">
                            ${articleName ? articleName.substring(0, 3) + '.' : '—'}
                            <div class="tooltip-content">${articleName || 'Не выбрана'}</div>
                        </td>
                        <td class="tooltip-cell ${fcName ? 'text-success' : 'text-error'}">
                            ${fcName ? fcName.substring(0, 3) + '.' : '—'}
                            <div class="tooltip-content">${fcName || 'Не выбран'}</div>
                        </td>
                        <td>
                            <button class="btn btn-ghost btn-xs" onclick="editRecord(${record.id})">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                            </button>
                        </td>
                    `;
                } else {
                    row.innerHTML = `
                        <td>
                            <input type="checkbox" class="checkbox checkbox-sm record-checkbox" data-id="${record.id}" onchange="updateSelection()">
                        </td>
                        <td class="text-sm">${formatDate(record.fact_date)}</td>
                        <td class="font-semibold ${record.amount < 0 ? 'text-error' : 'text-success'}">${formatAmount(record.amount)}</td>
                        <td class="max-w-xs truncate">${record.description}</td>
                        <td class="text-xs text-base-content/70">${record.csv_category}</td>
                        <td>
                            <input type="text" class="input input-bordered input-xs w-full" value="${record.user_comment || ''}"
                                   placeholder="..." onblur="updateField(${record.id}, 'user_comment', this.value)">
                        </td>
                        <td>
                            <select class="select select-bordered select-xs w-full" onchange="updateField(${record.id}, 'article_id', this.value)">
                                <option value="">—</option>
                                ${filteredArticles.map(a => `<option value="${a.id}" ${a.id === record.article_id ? 'selected' : ''}>${a.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <select class="select select-bordered select-xs w-full" onchange="updateField(${record.id}, 'financial_center_id', this.value)">
                                <option value="">—</option>
                                ${financialCenters.map(fc => `<option value="${fc.id}" ${fc.id === record.financial_center_id ? 'selected' : ''}>${fc.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <select class="select select-bordered select-xs w-full" onchange="updateField(${record.id}, 'cost_center_id', this.value)">
                                <option value="">—</option>
                                ${costCenters.map(cc => `<option value="${cc.id}" ${cc.id === record.cost_center_id ? 'selected' : ''}>${cc.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <span class="badge ${status === 'ready' ? 'badge-success' : status === 'partial' ? 'badge-warning' : 'badge-error'} badge-sm">
                                ${status === 'ready' ? 'Готово' : status === 'partial' ? 'Частично' : '○'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-ghost btn-xs text-error" onclick="deleteRecord(${record.id})">✕</button>
                        </td>
                    `;
                }

                tbody.appendChild(row);
            });

            updateStats();
        }

        function editRecord(id) {
            // In compact mode, switch to detail and focus on the record
            setViewMode('detail');
            setTimeout(() => {
                const row = document.querySelector(`tr[data-id="${id}"]`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.classList.add('bg-primary/10');
                    setTimeout(() => row.classList.remove('bg-primary/10'), 2000);
                }
            }, 100);
        }

        function populateBulkSelects() {
            document.getElementById('bulk-article').innerHTML = '<option value="">Категория</option>' +
                articles.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            document.getElementById('bulk-fc').innerHTML = '<option value="">Счёт</option>' +
                financialCenters.map(fc => `<option value="${fc.id}">${fc.name}</option>`).join('');
        }

        function updateField(recordId, field, value) {
            const record = stagingRecords.find(r => r.id === recordId);
            if (record) {
                record[field] = field.includes('_id') ? (value ? parseInt(value) : null) : value;
                renderTable();
            }
        }

        function updateStats() {
            const readyCount = stagingRecords.filter(r => getStatus(r) === 'ready').length;
            document.getElementById('stat-total').textContent = stagingRecords.length;
            document.getElementById('stat-ready').textContent = readyCount;
        }

        function toggleSelectAll(checkbox) {
            document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = checkbox.checked);
            updateSelection();
        }

        function updateSelection() {
            const count = document.querySelectorAll('.record-checkbox:checked').length;
            document.getElementById('selected-count').textContent = count;
            document.getElementById('bulk-ops').classList.toggle('hidden', count === 0);
        }

        function clearSelection() {
            document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('select-all').checked = false;
            updateSelection();
        }

        function applyBulkEdit() {
            const articleId = document.getElementById('bulk-article').value;
            const fcId = document.getElementById('bulk-fc').value;

            document.querySelectorAll('.record-checkbox:checked').forEach(cb => {
                const record = stagingRecords.find(r => r.id === parseInt(cb.dataset.id));
                if (record) {
                    if (articleId) record.article_id = parseInt(articleId);
                    if (fcId) record.financial_center_id = parseInt(fcId);
                }
            });

            clearSelection();
            renderTable();
        }

        function filterTable() {
            const term = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(row => {
                const record = stagingRecords.find(r => r.id === parseInt(row.dataset.id));
                row.style.display = record.description.toLowerCase().includes(term) ? '' : 'none';
            });
        }

        function deleteRecord(id) {
            if (confirm('Удалить запись?')) {
                const index = stagingRecords.findIndex(r => r.id === id);
                if (index !== -1) {
                    stagingRecords.splice(index, 1);
                    renderTable();
                }
            }
        }

        function executeImport() {
            const readyRecords = stagingRecords.filter(r => getStatus(r) === 'ready');
            if (readyRecords.length === 0) {
                alert('Нет готовых записей');
                return;
            }
            alert(`Импортировано ${readyRecords.length} записей`);
        }

        // Responsive: auto-compact on narrow screens
        function checkResponsive() {
            if (window.innerWidth < 1024 && viewMode !== 'compact') {
                setViewMode('compact');
            }
        }
        window.addEventListener('resize', checkResponsive);

        // Initial render
        renderTable();
    </script>
</body>
</html>
