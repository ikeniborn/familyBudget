<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вариант 6: Mini Cards - Quick Actions</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 p-4">
    <!-- Header with theme toggle and navigation -->
    <header class="navbar bg-base-100 rounded-box shadow mb-4">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost btn-sm">← Назад</a>
        </div>
        <div class="navbar-center">
            <span class="font-bold text-lg">Вариант 6</span>
        </div>
        <div class="navbar-end">
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="dark" />
                <span class="swap-off text-xl">☀️</span>
                <span class="swap-on text-xl">🌙</span>
            </label>
        </div>
    </header>

    <!-- Info Card -->
    <div class="card bg-base-100 shadow-xl mb-4">
        <div class="card-body p-4">
            <h2 class="card-title text-lg">Mini Cards Row</h2>
            <div class="text-sm opacity-70">
                <p><strong>Высота:</strong> ~80px</p>
                <p><strong>Сложность:</strong> Низкая</p>
                <p><strong>Паттерн:</strong> 3 приоритета + "Ещё"</p>
            </div>
            <div class="divider my-2"></div>
            <div class="flex gap-2 flex-wrap text-xs">
                <span class="badge badge-success">✅✅ Отлично для Факт+Списки</span>
                <span class="badge badge-success">✅ 1 клик</span>
                <span class="badge badge-success">✅ Компактно</span>
            </div>
        </div>
    </div>

    <!-- Quick Actions Component -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-4">
            <h3 class="text-sm font-semibold text-base-content/70 mb-3">💡 Быстрые действия</h3>

            <!-- Mini Cards Row -->
            <div class="grid grid-cols-4 gap-2">
                <!-- Priority 1: Факт -->
                <button onclick="showToast('+ Факт')" class="flex flex-col items-center gap-1 p-3 rounded-xl bg-success text-success-content hover:brightness-95 active:scale-95 transition-all shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span class="text-xs font-medium">Факт</span>
                </button>

                <!-- Priority 2: Перевод -->
                <button onclick="showToast('↔ Перевод')" class="flex flex-col items-center gap-1 p-3 rounded-xl bg-warning text-warning-content hover:brightness-95 active:scale-95 transition-all shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                    </svg>
                    <span class="text-xs font-medium">Перевод</span>
                </button>

                <!-- Priority 3: Списки -->
                <button onclick="showToast('🛒 Списки')" class="flex flex-col items-center gap-1 p-3 rounded-xl bg-accent text-accent-content hover:brightness-95 active:scale-95 transition-all shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span class="text-xs font-medium">Списки</span>
                </button>

                <!-- More: Dropdown -->
                <div class="dropdown dropdown-end">
                    <button tabindex="0" class="flex flex-col items-center gap-1 p-3 rounded-xl bg-base-200 hover:bg-base-300 active:scale-95 transition-all w-full">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/>
                        </svg>
                        <span class="text-xs font-medium text-base-content/70">Ещё</span>
                    </button>
                    <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow-lg bg-base-100 rounded-box w-52 mt-2">
                        <li>
                            <button onclick="showToast('+ План')" class="gap-2">
                                <svg class="w-4 h-4 text-info" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                </svg>
                                План: Расход/Доход
                            </button>
                        </li>
                        <li>
                            <button onclick="showToast('↔ Пл.перевод')" class="gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                </svg>
                                План: Перевод
                            </button>
                        </li>
                        <div class="divider my-1"></div>
                        <li>
                            <button onclick="showToast('📊 Аналитика')" class="gap-2">
                                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                Аналитика
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Demo content -->
    <div class="card bg-base-100 shadow-xl mt-4">
        <div class="card-body p-4">
            <h3 class="text-sm font-semibold text-base-content/70">📊 Быстрая статистика</h3>
            <div class="h-24 bg-base-200 rounded-lg flex items-center justify-center text-base-content/30">
                (демо контент)
            </div>
        </div>
    </div>

    <div class="card bg-base-100 shadow-xl mt-4">
        <div class="card-body p-4">
            <h3 class="text-sm font-semibold text-base-content/70">💳 Баланс по счетам</h3>
            <div class="h-24 bg-base-200 rounded-lg flex items-center justify-center text-base-content/30">
                (демо контент)
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast toast-top toast-center z-50"></div>

    <script>
        // Theme toggle
        document.querySelector('.theme-controller').addEventListener('change', function(e) {
            document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
        });

        // Toast notification
        function showToast(action) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'alert alert-success shadow-lg';
            toast.innerHTML = `<span>Нажато: ${action}</span>`;
            container.appendChild(toast);

            // Close any open dropdowns
            document.activeElement.blur();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }
    </script>
</body>
</html>
