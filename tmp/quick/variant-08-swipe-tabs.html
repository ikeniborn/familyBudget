<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вариант 8: Swipe Tabs - Quick Actions</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Swipe container */
        .swipe-container {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .swipe-container::-webkit-scrollbar {
            display: none;
        }

        .swipe-page {
            scroll-snap-align: center;
            scroll-snap-stop: always;
        }

        /* Dot indicator */
        .dot {
            transition: all 0.3s ease;
        }
        .dot.active {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="min-h-screen bg-base-200 p-4">
    <!-- Header with theme toggle and navigation -->
    <header class="navbar bg-base-100 rounded-box shadow mb-4">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost btn-sm">← Назад</a>
        </div>
        <div class="navbar-center">
            <span class="font-bold text-lg">Вариант 8</span>
        </div>
        <div class="navbar-end">
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="dark" />
                <span class="swap-off text-xl">☀️</span>
                <span class="swap-on text-xl">🌙</span>
            </label>
        </div>
    </header>

    <!-- Info Card -->
    <div class="card bg-base-100 shadow-xl mb-4">
        <div class="card-body p-4">
            <h2 class="card-title text-lg">Swipeable Tabs</h2>
            <div class="text-sm opacity-70">
                <p><strong>Высота:</strong> ~90px</p>
                <p><strong>Сложность:</strong> Средняя</p>
                <p><strong>Паттерн:</strong> Свайп между табами</p>
            </div>
            <div class="divider my-2"></div>
            <div class="flex gap-2 flex-wrap text-xs">
                <span class="badge badge-success">✅ Компактно</span>
                <span class="badge badge-success">✅ Свайп</span>
                <span class="badge badge-warning">⚠️ Не всё видно сразу</span>
            </div>
        </div>
    </div>

    <!-- Quick Actions Component -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-4">
            <h3 class="text-sm font-semibold text-base-content/70 mb-2">💡 Быстрые действия</h3>

            <!-- Dot indicators -->
            <div class="flex justify-center gap-2 mb-3">
                <button onclick="scrollToPage(0)" class="dot w-2 h-2 rounded-full bg-success active" data-page="0"></button>
                <button onclick="scrollToPage(1)" class="dot w-2 h-2 rounded-full bg-info" data-page="1"></button>
                <button onclick="scrollToPage(2)" class="dot w-2 h-2 rounded-full bg-primary" data-page="2"></button>
            </div>

            <!-- Swipe container -->
            <div id="swipe-container" class="swipe-container flex overflow-x-auto gap-4 pb-2" onscroll="updateDots()">
                <!-- Page 1: Факты -->
                <div class="swipe-page flex-shrink-0 w-full">
                    <div class="border border-success/30 rounded-lg p-3 bg-success/5">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-4 h-4 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span class="text-sm font-semibold text-success">Факты</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="showToast('+ Факт')" class="btn btn-success btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Расход
                            </button>
                            <button onclick="showToast('↔ Перевод')" class="btn btn-warning btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                </svg>
                                Перевод
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Page 2: Планы -->
                <div class="swipe-page flex-shrink-0 w-full">
                    <div class="border border-info/30 rounded-lg p-3 bg-info/5">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-4 h-4 text-info" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <span class="text-sm font-semibold text-info">Планы</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="showToast('+ План')" class="btn btn-info btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                Расход
                            </button>
                            <button onclick="showToast('↔ Пл.перевод')" class="btn btn-outline btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                </svg>
                                Перевод
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Page 3: Прочее -->
                <div class="swipe-page flex-shrink-0 w-full">
                    <div class="border border-primary/30 rounded-lg p-3 bg-primary/5">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/>
                            </svg>
                            <span class="text-sm font-semibold text-primary">Прочее</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="showToast('📊 Аналитика')" class="btn btn-primary btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                Аналитика
                            </button>
                            <button onclick="showToast('🛒 Списки')" class="btn btn-accent btn-sm flex-1 gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                                </svg>
                                Списки
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <p class="text-xs text-base-content/50 text-center">← Свайпните для переключения →</p>
        </div>
    </div>

    <!-- Demo content -->
    <div class="card bg-base-100 shadow-xl mt-4">
        <div class="card-body p-4">
            <h3 class="text-sm font-semibold text-base-content/70">📊 Быстрая статистика</h3>
            <div class="h-24 bg-base-200 rounded-lg flex items-center justify-center text-base-content/30">
                (демо контент)
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast toast-top toast-center z-50"></div>

    <script>
        // Theme toggle
        document.querySelector('.theme-controller').addEventListener('change', function(e) {
            document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
        });

        // Scroll to specific page
        function scrollToPage(pageIndex) {
            const container = document.getElementById('swipe-container');
            const pages = container.querySelectorAll('.swipe-page');
            if (pages[pageIndex]) {
                pages[pageIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        // Update dot indicators on scroll
        function updateDots() {
            const container = document.getElementById('swipe-container');
            const scrollLeft = container.scrollLeft;
            const pageWidth = container.offsetWidth;
            const currentPage = Math.round(scrollLeft / pageWidth);

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPage);
                // Update color based on page
                const colors = ['bg-success', 'bg-info', 'bg-primary'];
                dot.className = `dot w-2 h-2 rounded-full ${colors[index]} ${index === currentPage ? 'active' : 'opacity-40'}`;
            });
        }

        // Toast notification
        function showToast(action) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'alert alert-success shadow-lg';
            toast.innerHTML = `<span>Нажато: ${action}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }
    </script>
</body>
</html>
