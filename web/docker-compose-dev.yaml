  portfolio-ui:
    container_name: portfolio-ui
    build:
      dockerfile: ./app/portfolio/Dockerfile
      context: ./
    volumes:
      - /home/ikeni/Documents/Git/familyBudget/web/app/portfolio:/usr/src/app:delegated
    ports:
      - "8502:8502"
    command: "streamlit run ui.py --server.port=8502"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - API_URL=http://10.5.0.3:8899
      - POLARS_SKIP_CPU_CHECK=false
    networks:
      app_network:
        ipv4_address: 10.5.0.5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl","--fail","http://0.0.0.0:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      - api

  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-8_5
    environment:
      PGADMIN_DEFAULT_EMAIL: ikeniborn@gmail.com
      PGADMIN_DEFAULT_PASSWORD: JxUdSobKjAVrB2Wm4Li5
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      app_network:
        ipv4_address: 10.5.0.7
    depends_on:
      - postgres

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16
          gateway: 10.5.0.1

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

