global
  log         127.0.0.1 local2
  chroot      /var/lib/haproxy
  pidfile     /var/run/haproxy.pid
  maxconn     4000
  user        haproxy
  group       haproxy
  daemon
  stats socket /var/lib/haproxy/stats
  ssl-default-bind-ciphers PROFILE=SYSTEM
  ssl-default-server-ciphers PROFILE=SYSTEM

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
  timeout connect 5s
  timeout client  100s
  timeout server  100s
	timeout check 5s

frontend web
	bind *:80
	bind *:443 ssl crt /etc/ssl/certs
	mode http
  http-request redirect scheme https unless { ssl_fc }
  http-request set-header X-Forwarded-For %[src]
	option http-server-close
  redirect scheme https code 301 if !{ ssl_fc }
  http-response set-header Strict-Transport-Security max-age=63072000
  acl is_budget hdr(host) -i budget.ikeniborn.ru
  use_backend budget_web if is_budget
  acl is_portfolio hdr(host) -i portfolio.ikeniborn.ru
  use_backend portfolio_web if is_portfolio
  default_backend haproxy_web 

backend haproxy_web
  description "HaProxy"
  mode http
  log global
  stats enable
  stats uri /
  stats refresh 30s
  stats show-legends
  stats auth admin:f5p6PjDwAamE3Sd9ViNn
  stats admin if TRUE
	
backend budget_web
  description "Budget"
  balance roundrobin
  mode http
  option forwardfor
  server budget 10.5.0.4:8501 maxconn 10 check inter 1s

backend portfolio_web
  description "Portfolio"
  balance roundrobin
  mode http
  option forwardfor
  option httpchk GET /health HTTP/1.1
  http-check expect status 200	
  server portfolio 10.5.0.4:8502 maxconn 10 check inter 1s


