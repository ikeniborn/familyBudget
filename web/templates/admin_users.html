{% extends "base.html" %}

{% block content %}
<div class="admin-page">
    <div class="page-header">
        <h1>👥 User Management</h1>
        <p class="page-description">View and manage user accounts and permissions</p>
    </div>

    <!-- Stats Summary -->
    <div class="stats-grid" id="stats-container">
        <div class="loading">Loading statistics...</div>
    </div>

    <!-- Users Table -->
    <div class="card admin-table-card">
        <div class="card-header">
            <h2>Registered Users</h2>
            <div class="table-actions">
                <button class="filter-btn active" id="filter-current" onclick="toggleUserFilter('current')">Current Only</button>
                <button class="filter-btn" id="filter-all" onclick="toggleUserFilter('all')">All History</button>
            </div>
        </div>

        <div id="users-table-container">
            <div class="loading">Loading users...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// Global state
let currentFilter = 'current';

// Load users on page load
document.addEventListener('DOMContentLoaded', function() {
    loadUsers();
    loadStats();
});

// Toggle user filter (current vs all history)
function toggleUserFilter(filter) {
    currentFilter = filter;

    // Update active button
    document.querySelectorAll('.table-actions .filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.getElementById(`filter-${filter}`).classList.add('active');

    // Reload users
    loadUsers();
}

// Load users from API
async function loadUsers() {
    const container = document.getElementById('users-table-container');
    container.innerHTML = '<div class="loading">Loading users...</div>';

    try {
        const isCurrent = currentFilter === 'current';
        const response = await fetch(`/api/v1/admin/users?is_current=${isCurrent}`);

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const users = await response.json();
        renderUsersTable(users);
    } catch (error) {
        console.error('Error loading users:', error);
        container.innerHTML = `<div class="error-message">Failed to load users: ${error.message}</div>`;
    }
}

// Render users table
function renderUsersTable(users) {
    const container = document.getElementById('users-table-container');

    if (users.length === 0) {
        container.innerHTML = '<p class="info-text">No users found</p>';
        return;
    }

    let html = `
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Telegram ID</th>
                        <th>Username</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Valid From</th>
                        <th>Valid To</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
    `;

    users.forEach(user => {
        const displayName = user.first_name || user.username || `User ${user.telegram_id}`;
        const roleLabel = user.is_admin ? '<span class="badge admin">Admin</span>' : '<span class="badge user">User</span>';
        const statusLabel = user.is_current ? '<span class="badge success">Current</span>' : '<span class="badge inactive">Historical</span>';
        const validFrom = formatDate(user.valid_from);
        const validTo = user.valid_to ? formatDate(user.valid_to) : '—';

        html += `
            <tr data-user-id="${user.id}">
                <td>${user.telegram_id}</td>
                <td>${user.username || '—'}</td>
                <td>${displayName}</td>
                <td>${roleLabel}</td>
                <td>${statusLabel}</td>
                <td>${validFrom}</td>
                <td>${validTo}</td>
                <td>
                    ${user.is_current ? renderActions(user) : '—'}
                </td>
            </tr>
        `;
    });

    html += `
                </tbody>
            </table>
        </div>
    `;

    container.innerHTML = html;
}

// Render action buttons for user
function renderActions(user) {
    if (user.is_admin) {
        return `<button class="btn-secondary btn-small" onclick="toggleAdmin(${user.id}, false)">Revoke Admin</button>`;
    } else {
        return `<button class="btn-primary btn-small" onclick="toggleAdmin(${user.id}, true)">Grant Admin</button>`;
    }
}

// Toggle admin privileges
async function toggleAdmin(userId, makeAdmin) {
    if (!confirm(`Are you sure you want to ${makeAdmin ? 'grant' : 'revoke'} admin privileges?`)) {
        return;
    }

    try {
        const response = await fetch(`/api/v1/admin/users/${userId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                is_admin: makeAdmin
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || `HTTP error! status: ${response.status}`);
        }

        // Success - reload users
        await loadUsers();
        await loadStats();

        // Show success message
        showNotification(`Admin privileges ${makeAdmin ? 'granted' : 'revoked'} successfully`, 'success');
    } catch (error) {
        console.error('Error toggling admin:', error);
        showNotification(`Failed: ${error.message}`, 'error');
    }
}

// Load statistics
async function loadStats() {
    const container = document.getElementById('stats-container');

    try {
        const response = await fetch('/api/v1/admin/users/stats/summary');

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const stats = await response.json();
        renderStats(stats);
    } catch (error) {
        console.error('Error loading stats:', error);
        container.innerHTML = `<div class="error-message">Failed to load statistics</div>`;
    }
}

// Render statistics cards
function renderStats(stats) {
    const container = document.getElementById('stats-container');

    const totalUsers = stats.length;
    const totalFacts = stats.reduce((sum, user) => sum + user.total_facts, 0);
    const totalArticles = stats.reduce((sum, user) => sum + user.total_articles, 0);
    const activeUsers = stats.filter(user => user.total_facts > 0).length;

    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-content">
                <div class="stat-value">${totalUsers}</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-content">
                <div class="stat-value">${activeUsers}</div>
                <div class="stat-label">Active Users</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📝</div>
            <div class="stat-content">
                <div class="stat-value">${totalFacts}</div>
                <div class="stat-label">Total Facts</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📁</div>
            <div class="stat-content">
                <div class="stat-value">${totalArticles}</div>
                <div class="stat-label">Total Articles</div>
            </div>
        </div>
    `;
}

// Utility: Format date
function formatDate(isoString) {
    const date = new Date(isoString);
    return date.toLocaleDateString('ru-RU', { year: 'numeric', month: 'short', day: 'numeric' });
}

// Utility: Show notification
function showNotification(message, type) {
    // Simple alert for now - can be replaced with toast notification
    if (type === 'error') {
        alert('❌ ' + message);
    } else {
        alert('✅ ' + message);
    }
}
</script>
{% endblock %}
