{% macro transaction_modal(modal_id='modal_add_transaction') %}
<dialog id="{{ modal_id }}" class="modal">
    <div class="modal-box w-11/12 max-w-2xl">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="font-bold text-lg mb-4">➕ Добавить транзакцию</h3>

        <form id="form_{{ modal_id }}" class="space-y-4">
            <!-- Тип транзакции -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text font-semibold">Тип транзакции *</span>
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="btn btn-outline btn-error transaction-type-btn btn-active" data-type="expense">
                        <input type="radio" name="record_type" value="expense" class="hidden" checked />
                        Расход
                    </label>
                    <label class="btn btn-outline btn-success transaction-type-btn" data-type="income">
                        <input type="radio" name="record_type" value="income" class="hidden" />
                        Доход
                    </label>
                </div>
            </div>

            <!-- Quick Amount Buttons -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Быстрый выбор суммы</span>
                </label>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionAmount(100)">100 ₽</button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionAmount(500)">500 ₽</button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionAmount(1000)">1000 ₽</button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionAmount(5000)">5000 ₽</button>
                </div>
            </div>

            <!-- Сумма -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Сумма</span>
                </label>
                <input type="number" name="amount" step="0.01" min="0.01" required
                       class="input input-bordered" placeholder="0.00" />
            </div>

            <!-- Категория -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Категория *</span>
                </label>
                <select name="article_id" required class="select select-bordered">
                    <option value="">-- Выберите категорию --</option>
                </select>
            </div>

            <!-- Центр финансовой ответственности (ЦФО) -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Центр финансовой ответственности (ЦФО) *</span>
                </label>
                <select name="financial_center_id" required class="select select-bordered">
                    <option value="">-- Выберите ЦФО --</option>
                </select>
            </div>

            <!-- Место возникновения затрат (МВЗ) -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Место возникновения затрат (МВЗ)</span>
                </label>
                <select name="cost_center_id" class="select select-bordered">
                    <option value="">-- Не выбрано --</option>
                </select>
            </div>

            <!-- Дата -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Дата</span>
                </label>
                <!-- Quick Date Shortcuts -->
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionDate(0)">Сегодня</button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="setTransactionDate(-1)">Вчера</button>
                </div>
                <input type="text" name="fact_date" required
                       class="input input-bordered transaction-date-input"
                       placeholder="ДД.ММ.ГГГГ" />
            </div>

            <!-- Описание -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Описание (необязательно)</span>
                </label>
                <textarea name="description" class="textarea textarea-bordered"
                          placeholder="Комментарий к транзакции" rows="2"></textarea>
            </div>

            <div class="modal-action">
                <button type="button" onclick="{{ modal_id }}.close()" class="btn btn-ghost">Отмена</button>
                <button type="submit" class="btn btn-success">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Сохранить
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
{% endmacro %}
